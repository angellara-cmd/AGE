<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Estudio AGE - Tema 1: Personal al servicio de las AAPP</title>
    <!-- Tipografía moderna Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Tema Claro (Por defecto) */
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.85);
            --bg-subtle: #f8fafc;
            --bg-hover: #f1f5f9;
            
            --text-main: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --accent: #0ea5e9;
            --header-gradient: linear-gradient(135deg, #1e1b4b 0%, #3730a3 50%, #4f46e5 100%);
            
            --border-color: #e2e8f0;
            --border-focus: #818cf8;
            
            /* Estados de Test */
            --correct-bg: #ecfdf5;
            --correct-border: #10b981;
            --correct-text: #065f46;
            
            --incorrect-bg: #fef2f2;
            --incorrect-border: #ef4444;
            --incorrect-text: #991b1b;
            
            --explanation-bg: #eff6ff;
            --explanation-border: #3b82f6;
            --explanation-text: #1e40af;
            
            /* Sombras y Radios */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 25px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-full: 9999px;
            
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-body: #0b1120;
            --bg-card: #1e293b;
            --bg-glass: rgba(15, 23, 42, 0.85);
            --bg-subtle: #0f172a;
            --bg-hover: #334155;
            
            --text-main: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --primary-light: rgba(99, 102, 241, 0.15);
            --accent: #38bdf8;
            --header-gradient: linear-gradient(135deg, #090d16 0%, #1e1b4b 50%, #312e81 100%);
            
            --border-color: #334155;
            --border-focus: #6366f1;
            
            --correct-bg: rgba(16, 185, 129, 0.15);
            --correct-border: #10b981;
            --correct-text: #6ee7b7;
            
            --incorrect-bg: rgba(239, 68, 68, 0.15);
            --incorrect-border: #ef4444;
            --incorrect-text: #fca5a5;
            
            --explanation-bg: rgba(59, 130, 246, 0.15);
            --explanation-border: #3b82f6;
            --explanation-text: #93c5fd;
            
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 25px -3px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            font-size: 16px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ================= HEADER ================= */
        header {
            background: var(--header-gradient);
            color: white;
            padding: 18px 20px;
            position: relative;
            z-index: 1001;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        header h1 {
            font-size: clamp(1.2rem, 3vw, 1.65rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.15rem;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.28);
            transform: scale(1.05);
        }

        .doc-links {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        .doc-links-label {
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
            margin-right: 4px;
        }

        .doc-link {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 12px;
            border-radius: var(--radius-full);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            transition: var(--transition);
            backdrop-filter: blur(4px);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .doc-link:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-1px);
        }

        /* ================= STICKY NAVIGATION ================= */
        .nav-wrapper {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        nav {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            overflow-x: auto;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE/Edge */
        }

        nav::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        nav button {
            background: transparent;
            border: 1px solid transparent;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
            border-radius: var(--radius-full);
            transition: var(--transition);
            white-space: nowrap;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        nav button:hover:not(.active) {
            background: var(--bg-hover);
            color: var(--text-main);
        }

        nav button.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
        }

        /* ================= MAIN CONTAINER ================= */
        main {
            padding: 24px 16px 48px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            flex-grow: 1;
        }

        /* ================= TOOLBAR ESQUEMA (Audio + Buscador) ================= */
        .esquema-toolbar {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
        }

        .audio-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex-grow: 1;
            min-width: 220px;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-color);
            background: var(--bg-subtle);
            color: var(--text-main);
            font-size: 0.92rem;
            transition: var(--transition);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
            background: var(--bg-card);
        }

        .search-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.95rem;
            pointer-events: none;
        }

        /* ================= ESQUEMA CARDS ================= */
        .esquema-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px 22px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--primary);
            opacity: 0.75;
            transition: var(--transition);
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            border-color: var(--border-focus);
        }

        .card:hover::before {
            opacity: 1;
            width: 5px;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }

        .card-num {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 700;
            font-size: 0.8rem;
            padding: 3px 9px;
            border-radius: var(--radius-full);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .card h3 {
            color: var(--text-main);
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1.4;
        }

        .card p {
            color: var(--text-secondary);
            font-size: 0.96rem;
            padding-left: 2px;
        }

        /* ================= TESTS & EXAM VIEW ================= */
        .exam-header-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .exam-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .exam-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-container {
            width: 100%;
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: var(--bg-subtle);
            border-radius: var(--radius-full);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: var(--radius-full);
            transition: width 0.35s ease;
        }

        .question-block {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .question-header {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .q-badge {
            background: var(--primary);
            color: white;
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 30px;
            height: 30px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .question-text {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-main);
            line-height: 1.45;
            padding-top: 2px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 13px 16px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
            background: var(--bg-subtle);
            position: relative;
            user-select: none;
        }

        .option-label:hover:not(.disabled-opt) {
            background: var(--bg-hover);
            border-color: var(--border-focus);
            transform: translateX(3px);
        }

        .option-label:has(input:checked) {
            background: var(--primary-light);
            border-color: var(--primary);
        }

        .option-label input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .option-letter {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 14px;
            flex-shrink: 0;
            transition: var(--transition);
        }

        .option-label:has(input:checked) .option-letter {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .option-text {
            font-size: 0.96rem;
            color: var(--text-main);
            line-height: 1.4;
        }

        /* Estados tras corrección */
        .option-label.correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text);
        }
        .option-label.correct .option-letter {
            background-color: var(--correct-border);
            color: white;
            border-color: var(--correct-border);
        }
        .option-label.correct .option-text {
            color: var(--correct-text);
            font-weight: 600;
        }

        .option-label.incorrect {
            background-color: var(--incorrect-bg) !important;
            border-color: var(--incorrect-border) !important;
            color: var(--incorrect-text);
        }
        .option-label.incorrect .option-letter {
            background-color: var(--incorrect-border);
            color: white;
            border-color: var(--incorrect-border);
        }
        .option-label.incorrect .option-text {
            color: var(--incorrect-text);
        }

        .explanation {
            background: var(--explanation-bg);
            color: var(--explanation-text);
            padding: 14px 16px;
            border-radius: var(--radius-md);
            margin-top: 14px;
            display: none;
            border-left: 4px solid var(--explanation-border);
            font-size: 0.92rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        .explanation.show {
            display: block;
        }

        /* ================= BUTTONS & CONTROLS ================= */
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: var(--radius-full);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.25);
        }

        .btn:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--bg-subtle);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            box-shadow: none;
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--bg-hover);
            box-shadow: var(--shadow-sm);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .test-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 24px 0;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Score Card */
        .score-banner {
            background: var(--bg-card);
            border: 2px solid var(--primary);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-lg);
            display: none;
            animation: slideDown 0.35s ease;
        }

        .score-banner.show {
            display: block;
        }

        .score-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            text-align: center;
        }

        .score-stat {
            background: var(--bg-subtle);
            padding: 12px 8px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .score-stat-val {
            font-size: 1.4rem;
            font-weight: 800;
            display: block;
        }

        .score-stat-lbl {
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .val-ok { color: #10b981; }
        .val-err { color: #ef4444; }
        .val-blank { color: var(--text-secondary); }
        .val-pct { color: var(--primary); }

        /* Utils & Animations */
        .hidden { display: none !important; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ================= RESPONSIVE MOBILE OPTIMIZATION ================= */
        @media (max-width: 768px) {
            header {
                padding: 14px 16px;
            }

            .doc-links {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }

            .doc-link {
                width: 100%;
                justify-content: flex-start;
                font-size: 0.8rem;
                padding: 7px 12px;
            }

            main {
                padding: 16px 12px 40px;
            }

            .esquema-toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .audio-controls {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            .search-box {
                max-width: 100%;
            }

            .card {
                padding: 16px;
            }

            .question-block {
                padding: 16px;
            }

            .option-label {
                padding: 14px 12px;
            }

            .score-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .test-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                padding: 13px 20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <div class="header-top">
                <div class="brand">
                    <span class="brand-badge">Oposiciones AGE</span>
                    <h1>Tema 1: Personal al servicio de las AAPP</h1>
                </div>
                <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Cambiar tema claro/oscuro" aria-label="Cambiar modo de color">
                    🌙
                </button>
            </div>
            
            <div class="doc-links">
                <span class="doc-links-label">📚 Material de referencia:</span>
                <a class="doc-link" href="tema01_El personal al servicio de las admin publicas.pdf" target="_blank">
                    <span>📄</span> tema01_El personal al servicio de las admin publicas.pdf
                </a>
                <a class="doc-link" href="Tema_01_Personal_AAPP_TREBEP_claude.html" target="_blank">
                    <span>🌐</span> Tema_01_Personal_AAPP_TREBEP_claude.html
                </a>
            </div>
        </div>
    </header>

    <div class="nav-wrapper">
        <nav id="main-nav">
            <button class="active" onclick="showView('esquema', this)">📖 Esquema Clave (40)</button>
            <!-- Botones de Test generados dinámicamente por JS -->
        </nav>
    </div>

    <main>
        <!-- ================= VISTA ESQUEMA ================= -->
        <div id="esquema-view">
            <div class="esquema-toolbar">
                <div class="audio-controls">
                    <button class="btn" id="btn-play-audio" onclick="toggleAudio()">🔊 Escuchar Tema</button>
                    <button class="btn btn-secondary" onclick="stopAudio()">⏹️ Detener</button>
                </div>
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="esquema-search" placeholder="Filtrar conceptos (ej. interinos, RCP, A1...)" oninput="filterEsquema(this.value)">
                </div>
            </div>
            
            <div id="esquema-container" class="esquema-grid"></div>
        </div>

        <!-- ================= VISTA EXAMEN ================= -->
        <div id="exam-view" class="hidden">
            <div class="exam-header-card">
                <div class="exam-meta">

                    <div class="btn-group">

        // ---------------------------------------------------------

        // ---------------------------------------------------------
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', next);
            document.getElementById('theme-toggle').innerText = next === 'light' ? '🌙' : '☀️';
            localStorage.setItem('age-theme', next);
        }

        // Cargar preferencia guardada
        (function initTheme() {
            const saved = localStorage.getItem('age-theme');
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
                window.addEventListener('DOMContentLoaded', () => {
                    const btn = document.getElementById('theme-toggle');
                    if (btn) btn.innerText = saved === 'light' ? '🌙' : '☀️';
                });
            }
        })();

        // ---------------------------------------------------------

            { q: "¿Cuál es el concepto de empleados públicos según el documento?", a: "Son empleados públicos quienes desempeñan funciones retribuidas en las Administraciones Públicas al servicio de los intereses generales." },
            { q: "¿Cómo se clasifican los empleados públicos?", a: "Se clasifican en: Funcionarios públicos (de carrera o interinos), Personal laboral (fijo, indefinido o temporal) y Personal eventual." },
            { q: "¿Qué caracteriza a un funcionario de carrera?", a: "Su vinculación en virtud de nombramiento legal por relación estatutaria (Derecho Administrativo), la permanencia, profesionalidad y la retribución con cargo a presupuestos públicos." },
            { q: "¿A quién corresponde la reserva de funciones?", a: "Corresponde exclusivamente a los funcionarios públicos (carrera e interinos) el ejercicio de funciones que impliquen participación directa o indirecta en potestades públicas o en la salvaguardia de los intereses generales." },
            { q: "¿Qué titulación se exige para el Grupo A (Subgrupos A1 y A2)?", a: "Se exigirá estar en posesión del título universitario de Grado (o aquel otro título universitario que exija la Ley)." },
            { q: "¿Qué titulación se exige para los Grupos B, C1 y C2?", a: "Grupo B: Técnico Superior. Subgrupo C1: Bachiller o Técnico. Subgrupo C2: Graduado en Educación Secundaria Obligatoria." },
            { q: "¿Qué son las Agrupaciones Profesionales?", a: "Son agrupaciones diferentes a los grupos A, B y C para cuyo acceso no se exige estar en posesión de ninguna de las titulaciones previstas en el sistema educativo." },
            { q: "¿Cómo se integran transitoriamente los antiguos Grupos (A,B,C,D,E)?", a: "Antiguo A (Licenciatura) a A1; Antiguo B (Diplomatura) a A2; Antiguo C a C1; Antiguo D a C2; Antiguo E a Agrupaciones Profesionales." },

            { q: "¿Mediante qué norma se crea, refunde, modifica o suprime un Cuerpo o Escala en la AGE?", a: "A través de una Ley aprobada por las Cortes Generales." },

                { q: "Criterios comunes para los Registros en las AAPP se acuerdan en:", o: ["El BOE unilateralmente.", "Convenio de Conferencia Sectorial.", "Ministerio de Sanidad.", "Ley Orgánica siempre."], a: 1, e: "Mediante convenio de Conferencia Sectorial se establecen contenidos comunes." },
                { q: "La Dirección General de Gobernanza Pública depende de:", o: ["Ministerio del Interior.", "Secretaría de Estado de Función Pública.", "Directamente de Presidencia.", "Muface."], a: 1, e: "Depende de la SEFP." },
                { q: "Emitir informes de actos en materia de FP emanados de las Comunidades Autónomas compete a:", o: ["INAP.", "Registro.", "Dirección General de la Función Pública.", "Subsecretario Educación."], a: 2, e: "Competencias de la DGFP sobre otras AAPP incluye emitir estos informes." },
                { q: "Señala la afirmación correcta sobre el TREBEP:", o: ["Deroga la Constitución.", "Establece bases estatutarias de funcionarios y normas aplicables al personal laboral.", "Sólo aplica a la AGE.", "No rige las Universidades."], a: 1, e: "Objeto: bases régimen estatutario de funcionarios y determinar normas del personal laboral." }
            ]
        ];

        let currentExamIndex = -1;
        let isExamFinished = false;

        // ---------------------------------------------------------
        // 3. SPEECH SYNTHESIS LOGIC
        // ---------------------------------------------------------
        let speechQueue = [];
        let isPlaying = false;
        
        function populateSpeechQueue() {
            speechQueue = [];
            esquemaPreguntas.forEach((item, index) => {
                speechQueue.push(`Punto ${index + 1}: ${item.q}. ${item.a}`);
            });
        }

        function playNextUtterance() {
            if (speechQueue.length === 0 || !isPlaying) {
                isPlaying = false;
                document.getElementById('btn-play-audio').innerText = "🔊 Escuchar Tema";
                return;
            }
            
            const text = speechQueue.shift();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "es-ES";
            
            utterance.onend = () => {
                if (isPlaying) playNextUtterance();
            };
            
            window.speechSynthesis.speak(utterance);
        }

        function toggleAudio() {
            if (isPlaying) {
                window.speechSynthesis.cancel();
                isPlaying = false;
                document.getElementById('btn-play-audio').innerText = "🔊 Continuar";
            } else {
                isPlaying = true;
                document.getElementById('btn-play-audio').innerText = "⏸️ Pausar";
                if (speechQueue.length === 0) populateSpeechQueue();
                playNextUtterance();
            }
        }

        function stopAudio() {
            window.speechSynthesis.cancel();
            isPlaying = false;
            speechQueue = [];
            document.getElementById('btn-play-audio').innerText = "🔊 Escuchar Tema";
        }

        // ---------------------------------------------------------
        // 4. FILTRO EN TIEMPO REAL DEL ESQUEMA
        // ---------------------------------------------------------
        function filterEsquema(query) {
            const term = query.toLowerCase().trim();
            const cards = document.querySelectorAll('#esquema-container .card');
            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(term) ? 'block' : 'none';
            });
        }

        // ---------------------------------------------------------
        // 5. RENDERIZADO DE VISTAS Y LÓGICA DE TEST
        // ---------------------------------------------------------
        function initApp() {
            const esquemaCont = document.getElementById('esquema-container');
            esquemaPreguntas.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-num">#${String(index + 1).padStart(2, '0')}</span>
                        <h3>${item.q}</h3>
                    </div>
                    <p>${item.a}</p>
                `;
                esquemaCont.appendChild(card);
            });

            const nav = document.getElementById('main-nav');
            for (let i = 0; i < examenes.length; i++) {
                const btn = document.createElement('button');
                btn.innerText = `Test ${i + 1}`;
                btn.onclick = (e) => showView('test', e.target, i);
                nav.appendChild(btn);
            }
        }

        function showView(viewType, btnElem, testIndex = 0) {
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            btnElem.classList.add('active');
            
            // Centrar suavemente el botón activo en el scroll horizontal móvil
            btnElem.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            stopAudio();

            const esquemaView = document.getElementById('esquema-view');
            const examView = document.getElementById('exam-view');

            if (viewType === 'esquema') {
                esquemaView.classList.remove('hidden');
                examView.classList.add('hidden');
            } else {
                esquemaView.classList.add('hidden');
                examView.classList.remove('hidden');
                loadExam(testIndex);
            }
        }

        function updateProgress() {
            if (currentExamIndex === -1) return;
            const total = examenes[currentExamIndex].length;
            const answered = document.querySelectorAll('#exam-container input[type="radio"]:checked').length;
            const pct = Math.round((answered / total) * 100);
            
            document.getElementById('progress-text').innerText = `${answered} / ${total} respondidas`;
            document.getElementById('progress-fill').style.width = `${pct}%`;
        }

        function loadExam(index) {
            currentExamIndex = index;
            isExamFinished = false;
            const testData = examenes[index];
            const examCont = document.getElementById('exam-container');
            examCont.innerHTML = '';
            
            document.getElementById('current-test-title').innerText = `📝 Test ${index + 1} (${testData.length} preguntas)`;
            document.getElementById('score-banner').classList.remove('show');
            document.querySelectorAll('.btn[onclick="corregirExamen()"]').forEach(btn => btn.disabled = false);

            testData.forEach((item, qIndex) => {
                const block = document.createElement('div');
                block.className = 'question-block';
                block.dataset.qindex = qIndex;
                
                let optionsHTML = '';
                item.o.forEach((optText, oIndex) => {
                    const letter = String.fromCharCode(65 + oIndex);
                    optionsHTML += `
                        <label class="option-label" id="label-q${qIndex}-o${oIndex}">
                            <input type="radio" name="q${qIndex}" value="${oIndex}" onchange="updateProgress()">
                            <span class="option-letter">${letter}</span>
                            <span class="option-text">${optText}</span>
                        </label>
                    `;
                });

                block.innerHTML = `
                    <div class="question-header">
                        <span class="q-badge">${qIndex + 1}</span>
                        <div class="question-text">${item.q}</div>
                    </div>
                    <div class="options-container">${optionsHTML}</div>
                    <div class="explanation" id="expl-q${qIndex}">
                        <strong>💡 Explicación (Respuesta correcta: ${String.fromCharCode(65 + item.a)}):</strong><br>
                        ${item.e}
                    </div>
                `;
                examCont.appendChild(block);
            });

            updateProgress();
        }

        function corregirExamen() {
            if (currentExamIndex === -1 || isExamFinished) return;
            
            const testData = examenes[currentExamIndex];
            let aciertos = 0;
            let errores = 0;
            let enBlanco = 0;

            testData.forEach((item, qIndex) => {
                const inputs = document.querySelectorAll(`input[name="q${qIndex}"]`);
                let answered = false;
                let userVal = -1;

                inputs.forEach(inp => {
                    inp.disabled = true;
                    inp.parentElement.classList.add('disabled-opt');
                    if (inp.checked) {
                        answered = true;
                        userVal = parseInt(inp.value);
                    }
                });

                const correctLabel = document.getElementById(`label-q${qIndex}-o${item.a}`);
                const explBox = document.getElementById(`expl-q${qIndex}`);

                if (!answered) {
                    enBlanco++;
                    correctLabel.classList.add('correct');
                    explBox.classList.add('show');
                } else if (userVal === item.a) {
                    aciertos++;
                    correctLabel.classList.add('correct');
                } else {
                    errores++;
                    const userLabel = document.getElementById(`label-q${qIndex}-o${userVal}`);
                    userLabel.classList.add('incorrect');
                    correctLabel.classList.add('correct');
                    explBox.classList.add('show');
                }
            });

            isExamFinished = true;
            document.querySelectorAll('.btn[onclick="corregirExamen()"]').forEach(btn => btn.disabled = true);
            
            const total = testData.length;
            const pct = Math.round((aciertos / total) * 100);

            document.getElementById('stat-ok').innerText = aciertos;
            document.getElementById('stat-err').innerText = errores;
            document.getElementById('stat-blank').innerText = enBlanco;
            document.getElementById('stat-pct').innerText = `${pct}%`;
            document.getElementById('score-banner').classList.add('show');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function reiniciarExamen() {
            if (currentExamIndex !== -1) {
                loadExam(currentExamIndex);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>

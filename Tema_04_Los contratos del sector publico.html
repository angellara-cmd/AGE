// --- DATOS BASADOS EXCLUSIVAMENTE EN LA DOCUMENTACIÓN ---
const esquemaPreguntas = [
    { p: "¿Qué contratos administrativos celebran las Administraciones Públicas?", r: "Los contratos de obras, concesión de obras, concesión de servicios, suministro y servicios. Se exceptúan servicios financieros, creación artística y literaria, espectáculos, y suscripción a revistas, que son privados[cite: 2, 70]." },
    { p: "¿Qué caracteriza a un contrato de concesión de obras o servicios?", r: "El derecho de explotación implica la transferencia al concesionario del riesgo operacional (de demanda o de suministro), asumiendo que no está garantizada la recuperación de la inversión en condiciones normales[cite: 4, 65, 66]." },
    { p: "¿Qué requisitos tiene un contrato mixto?", r: "Contiene prestaciones de diferentes tipos de contratos. Solo pueden celebrarse si las prestaciones están directamente vinculadas entre sí y mantienen relaciones de complementariedad como unidad funcional[cite: 5, 67]." },
    { p: "¿Qué umbral define a un contrato SARA de obras o concesiones?", r: "Valor estimado igual o superior a 5.538.000 €[cite: 28, 68]." },
    { p: "¿Cuál es el umbral SARA para contratos de suministros y servicios adjudicados por la AGE?", r: "Valor estimado igual o superior a 143.000 €[cite: 29, 69]." },
    { p: "¿Por qué normas se rigen los efectos y extinción de los contratos privados de las AAPP?", r: "Se rigen por el derecho privado, salvo lo establecido en la LCSP para condiciones especiales de ejecución, modificación, cesión, subcontratación y resolución si el contrato es SARA[cite: 2, 71]." },
    { p: "¿Qué jurisdicción resuelve las controversias sobre efectos y extinción de contratos privados de AAPP?", r: "El orden jurisdiccional civil[cite: 3, 72]." },
    { p: "¿Qué contratos requieren autorización previa del Consejo de Ministros?", r: "Aquellos cuyo valor estimado sea igual o superior a 12.000.000 €, arrendamientos financieros de más de 4 años, y modificaciones no previstas mayores al 10% del precio inicial[cite: 31, 74]." },
    { p: "¿Qué órgano no interviene si existe Junta de Contratación?", r: "La Intervención y la Mesa de contratación no intervienen cuando existe Junta de Contratación que actúa como órgano de contratación[cite: 14, 15]." },
    { p: "¿Quién no puede formar parte de la Mesa de Contratación?", r: "Cargos públicos representativos, altos cargos, personal eventual, y el personal que haya participado en la redacción de la documentación técnica[cite: 15, 78]." },
    { p: "¿Qué es el Comité de Cooperación en materia de contratación pública?", r: "Órgano colegiado creado en el seno de la Junta Consultiva de Contratación Pública del Estado para asumir compromisos específicos en áreas de acción común de las AAPP[cite: 16, 80]." },
    { p: "¿Qué umbral exime de clasificación al empresario en contratos de obras?", r: "Para contratos de obras con valor estimado inferior a 500.000 euros, la clasificación es opcional[cite: 36]." },
    { p: "¿Qué duración máxima tienen las prohibiciones de contratar?", r: "La prevista en la sentencia (máximo 5 años). En resto de supuestos, máximo 3 años[cite: 34]." },
    { p: "¿Cuándo es obligatoria la garantía definitiva y de qué porcentaje es?", r: "Es obligatoria y asciende al 5% del precio final ofertado (excluido IVA)[cite: 38]." },
    { p: "¿Qué condiciones definen a un contrato menor?", r: "Contratos de obras de valor estimado inferior a 40.000 €; contratos de suministros y servicios inferiores a 15.000 €[cite: 11, 85]." },
    { p: "¿Cuál es la duración máxima permitida para un contrato menor?", r: "No podrán tener una duración superior a un año ni ser objeto de prórroga[cite: 11, 130]." },
    { p: "¿Qué plazos se reducen en la tramitación urgente?", r: "Se reducen a la mitad los plazos de licitación, adjudicación y formalización, salvo excepciones (como plazo de presentación en SARA abierto). El inicio de ejecución será en máximo 1 mes[cite: 11, 85]." },
    { p: "¿En qué casos procede la tramitación de emergencia?", r: "Acontecimientos catastróficos, grave peligro o defensa nacional. Se actúa sin tramitación previa de expediente. El plazo de inicio de ejecución no será superior a 1 mes[cite: 11, 86]." },
    { p: "¿Qué límite tienen las modificaciones contractuales previstas en pliegos?", r: "Un máximo del 20% del precio inicial del contrato[cite: 121]." },
    { p: "¿Cuál es la penalidad diaria por demora en la ejecución imputable al contratista?", r: "0,60 euros por cada 1.000 euros del precio del contrato (IVA excluido)[cite: 12, 122]." },
    { p: "¿Qué plazo tiene la Administración para pagar tras la aprobación de certificaciones?", r: "Debe abonar el precio dentro de los 30 días siguientes a la fecha de aprobación[cite: 12, 124]." },
    { p: "¿Qué derecho tiene el contratista si la demora en el pago supera los 4 meses?", r: "Proceder a la suspensión del cumplimiento del contrato, con un mes de antelación[cite: 12, 124]." },
    { p: "¿Qué derecho asiste al contratista si la demora en el pago excede de 6 meses?", r: "Derecho a resolver el contrato y al resarcimiento de los perjuicios sufridos[cite: 12, 124]." },
    { p: "¿Cuáles son causas de nulidad de derecho administrativo exclusivas de la LCSP?", r: "Falta de capacidad/solvencia, carencia de crédito, falta de publicación del anuncio, inobservancia del plazo de formalización (con perjuicio), incumplir suspensión en recurso especial, e incumplimiento grave del Derecho de la UE[cite: 13, 132]." },
    { p: "¿Qué contratos admiten Recurso Especial en materia de contratación?", r: "Obras > 3.000.000 €; Suministros y servicios > 100.000 €; Concesiones > 3.000.000 €; Acuerdos Marco de esas cuantías y contratos subvencionados SARA[cite: 17, 135]." },
    { p: "¿Cuál es el plazo para interponer un Recurso Especial?", r: "El plazo general es de 15 días hábiles desde la notificación, publicación o conocimiento del acto recurrido[cite: 18, 138]." },
    { p: "¿Qué es la subasta electrónica?", r: "Proceso electrónico repetitivo aplicable en Abierto, Restringido y Negociado para mejorar precios o nuevos valores tras evaluación completa de ofertas, salvo en servicios intelectuales o calidad alimentaria[cite: 23, 93]." },
    { p: "¿Cuál es el plazo de presentación de ofertas en el procedimiento abierto para contratos SARA?", r: "No inferior a 35 días para obras, suministros y servicios; y 30 días para concesiones. Reducible si hay anuncio previo o medios electrónicos[cite: 46, 101]." },
    { p: "¿Cuáles son los límites para utilizar el procedimiento abierto simplificado?", r: "Obras con valor estimado <= 2.000.000 €; suministros y servicios con valor estimado < 143.000 €. Criterios de juicio de valor no superiores al 25% (45% en prestaciones intelectuales)[cite: 8, 103]." },
    { p: "¿Qué especialidades tiene el procedimiento abierto simplificado?", r: "Plazo >= 15 días (20 en obras), exige estar inscrito en el ROLECE, no requiere garantía provisional y la oferta se presenta en un único sobre si no hay juicios de valor[cite: 40, 103]." },
    { p: "¿Cuáles son los umbrales del procedimiento abierto supersimplificado?", r: "Obras de valor estimado < 80.000 €; suministros y servicios < 60.000 € (salvo intelectuales). Plazo de 10 días hábiles (5 en compras corrientes)[cite: 41, 105]." },
    { p: "¿Cómo funciona el procedimiento restringido?", r: "Cualquier empresario solicita participar, el OC selecciona en base a solvencia (mínimo 5 candidatos) que son los únicos invitados a presentar proposiciones. Está prohibida la negociación[cite: 8, 106]." },
    { p: "¿Qué caracteriza al diálogo competitivo?", r: "Se dialoga con candidatos (mínimo 3) para desarrollar soluciones que luego servirán de base para que presenten ofertas definitivas[cite: 8, 111]." },
    { p: "¿Qué duración máxima tienen los Acuerdos Marco?", r: "Su duración no podrá exceder de 4 años, salvo casos excepcionales debidamente justificados[cite: 44, 115]." },
    { p: "¿Qué requisitos se exigen para ceder un contrato a un tercero?", r: "Autorización previa expresa (silencio positivo 2 meses), ejecución de al menos 20% (1/5 en concesión), cesionario apto, y formalización en escritura pública[cite: 38, 130]." },
    { p: "¿Qué penalidad existe por infracción en la subcontratación?", r: "Penalidad al contratista de hasta un 50% del importe del subcontrato, o la resolución del contrato[cite: 38, 131]." },
    { p: "¿Cuál es el límite temporal máximo para contratos de suministro y servicios?", r: "Un máximo de 5 años incluyendo posibles prórrogas, salvo si se exige recuperación de inversiones (justificado)[cite: 37, 129]." },
    { p: "¿Qué reglas aplican a la revisión de precios?", r: "Admisible en contratos de obras, armamento y energía. Procede tras ejecutarse el 20% del importe y transcurrir 1 año desde formalización[cite: 37, 120]." },
    { p: "¿Qué ocurre con las ofertas anormalmente bajas?", r: "El OC debe requerir justificación. Si la justificación no explica satisfactoriamente los bajos costes, vulnera normativa laboral o ambiental o la Ley de Subcontratación, la oferta se rechaza[cite: 9, 95]." },
    { p: "¿Qué órgano resuelve el Recurso Especial en la Administración General del Estado?", r: "El Tribunal Administrativo Central de Recursos Contractuales (TACRC)[cite: 17, 123]." }
];

const examenes = [
    // Test 1: Conceptos y Tipos de Contrato
    [
        { p: "¿Qué contratos se consideran administrativos?[cite: 2, 70]", o: ["A) Obras, suministros y servicios, salvo exclusiones", "B) Contratos de creación literaria", "C) Contratos de servicios financieros", "D) Suscripción a revistas"], c: 0, e: "Obras, concesiones, suministros y servicios celebrados por AAPP son administrativos, excepto financieros, creación artística y revistas[cite: 2, 70]." },

        { p: "¿Qué jurisdicción es competente para efectos y extinción de contratos privados de AAPP?[cite: 3, 72]", o: ["A) Contencioso-Administrativa", "B) Civil", "C) Social", "D) Militar"], c: 1, e: "El orden jurisdiccional civil conoce de los efectos y extinción de los contratos privados[cite: 3, 72]." },
        { p: "En un contrato mixto separable de obras y concesiones, si el valor de la obra supera el umbral SARA:[cite: 5, 68]", o: ["A) Se rige por normas de concesión", "B) Se rige por normas de contratos de obras", "C) Es nulo", "D) Decide la Mesa libremente"], c: 1, e: "Si son separables y supera umbrales SARA, se aplican normas de contratos de obras, suministros o servicios[cite: 5, 68]." },
        { p: "Límite para ser contrato menor de obras:[cite: 11, 85]", o: ["A) < 15.000 €", "B) < 40.000 €", "C) < 50.000 €", "D) < 80.000 €"], c: 1, e: "Contratos de obras de valor estimado inferior a 40.000 euros[cite: 11, 85]." },

        { p: "Duración máxima de un contrato menor:[cite: 11, 130]", o: ["A) 6 meses sin prórroga", "B) 1 año sin posibilidad de prórroga", "C) 1 año más 1 de prórroga", "D) 2 años"], c: 1, e: "No podrán tener duración superior a 1 año ni prorrogarse[cite: 11, 130]." },

        { p: "El umbral SARA para suministros adjudicados por la AGE es:[cite: 29, 69]", o: ["A) 143.000 €", "B) 221.000 €", "C) 750.000 €", "D) 100.000 €"], c: 0, e: "Valor estimado igual o superior a 143.000 € para la AGE[cite: 29, 69]." },
        { p: "El VEC (Valor Estimado del Contrato) incluye:[cite: 37, 74]", o: ["A) IVA", "B) Sólo el presupuesto base", "C) Opciones, prórrogas y costes sin IVA", "D) Costes de demora"], c: 2, e: "Incluye prórrogas, primas, opciones eventuales sin IVA[cite: 37, 74]." },
        { p: "¿Se puede fraccionar un contrato para evitar requisitos de publicidad?[cite: 36, 90]", o: ["A) Sí, si lo justifica urgencia", "B) Sí, mediante lotes", "C) No, está expresamente prohibido", "D) Sólo en suministros"], c: 2, e: "No podrá fraccionarse con la finalidad de eludir requisitos de publicidad[cite: 36, 90]." },

function renderEsquema() {
    const container = document.getElementById('esquema-container');
    let html = '';
    esquemaPreguntas.forEach((item, index) => {
        html += `
        <div class="card">
            <div class="pregunta-titulo">${index + 1}. ${item.p}</div>
            <div class="respuesta-detalle">${item.r}</div>
        </div>`;
    });
    container.innerHTML = html;
}

function renderTests() {
    const container = document.getElementById('tests-container');
    let html = '';
    
    examenes.forEach((test, testIndex) => {
        html += `<div id="test${testIndex}" class="tab-content">
            <h2 style="margin-bottom: 1rem; color: var(--primary);">Examen ${testIndex + 1}</h2>
            <div id="score${testIndex}" class="score-display"></div>
            <form id="form-test${testIndex}">`;
            
        test.forEach((q, qIndex) => {
            html += `
            <div class="card" id="q-${testIndex}-${qIndex}">
                <div class="pregunta-titulo">${qIndex + 1}. ${q.p}</div>
                <div class="opciones">`;
                
            q.o.forEach((opt, optIndex) => {
                html += `
                <label class="opcion-label" id="label-${testIndex}-${qIndex}-${optIndex}">
                    <input type="radio" name="p-${testIndex}-${qIndex}" value="${optIndex}">
                    <span>${opt}</span>
                </label>`;
            });
            
            html += `
                </div>
                <div class="explicacion" id="exp-${testIndex}-${qIndex}">
                    <strong>Explicación:</strong> ${q.e}
                </div>
            </div>`;
        });
        
        html += `
            </form>
            <div id="score-bottom${testIndex}" class="score-display"></div>
            <div class="test-controls">
                <button class="btn-action" onclick="corregirExamen(${testIndex})" id="btn-corregir-${testIndex}">✔️ Corregir Examen</button>
                <button class="btn-action" style="background:#7f8c8d;" onclick="reiniciarExamen(${testIndex})">🔄 Reiniciar Test</button>
            </div>
        </div>`;
    });
    container.innerHTML = html;
}

function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    
    const buttons = document.querySelectorAll('nav button');
    if(tabId === 'esquema') buttons[0].classList.add('active');
    else {
        const testNum = parseInt(tabId.replace('test',''));
        buttons[testNum + 1].classList.add('active');
    }
    
    window.scrollTo({top: 0, behavior: 'smooth'});
}

function corregirExamen(testIndex) {
    const test = examenes[testIndex];
    let aciertos = 0;
    let errores = 0;
    let blancos = 0;
    
    test.forEach((q, qIndex) => {
        const selected = document.querySelector(`input[name="p-${testIndex}-${qIndex}"]:checked`);
        const isCorrect = selected && parseInt(selected.value) === q.c;
        
        // Lock inputs
        document.querySelectorAll(`input[name="p-${testIndex}-${qIndex}"]`).forEach(input => {
            input.disabled = true;
            input.parentElement.classList.add('locked');
        });
        
        if (selected) {
            if (isCorrect) {
                aciertos++;
                selected.parentElement.classList.add('correcta');
            } else {
                errores++;
                selected.parentElement.classList.add('erronea');
                // Marcar la correcta también
                document.getElementById(`label-${testIndex}-${qIndex}-${q.c}`).classList.add('correcta');
                // Mostrar explicación para falladas
                document.getElementById(`exp-${testIndex}-${qIndex}`).style.display = 'block';
            }
        } else {
            blancos++;
            document.getElementById(`label-${testIndex}-${qIndex}-${q.c}`).classList.add('correcta');
            document.getElementById(`exp-${testIndex}-${qIndex}`).style.display = 'block';
        }
    });
    
    const scoreText = `Resultado: ${aciertos} Aciertos | ${errores} Errores | ${blancos} Blancos`;
    document.getElementById(`score${testIndex}`).innerText = scoreText;
    document.getElementById(`score${testIndex}`).style.display = 'block';
    document.getElementById(`score-bottom${testIndex}`).innerText = scoreText;
    document.getElementById(`score-bottom${testIndex}`).style.display = 'block';
    
    document.getElementById(`btn-corregir-${testIndex}`).disabled = true;
}

function reiniciarExamen(testIndex) {
    const form = document.getElementById(`form-test${testIndex}`);
    form.reset();
    
    document.querySelectorAll(`#test${testIndex} .opcion-label`).forEach(lbl => {
        lbl.classList.remove('correcta', 'erronea', 'locked');
        lbl.querySelector('input').disabled = false;
    });
    
    document.querySelectorAll(`#test${testIndex} .explicacion`).forEach(exp => {
        exp.style.display = 'none';
    });
    
    document.getElementById(`score${testIndex}`).style.display = 'none';
    document.getElementById(`score-bottom${testIndex}`).style.display = 'none';
    document.getElementById(`btn-corregir-${testIndex}`).disabled = false;
    
    window.scrollTo({top: 0, behavior: 'smooth'});
}

let speaking = false;
function toggleAudio() {
    const btn = document.getElementById('btn-escuchar');
    if (speaking) {
        window.speechSynthesis.cancel();
        speaking = false;
        btn.innerText = "🔊 Escuchar Tema";
        return;
    }
    
    let textToRead = "";
    esquemaPreguntas.forEach(q => {
        // Limpiamos citaciones para lectura más fluida
        const cleanP = q.p.replace(/\[cite:\s*[\d, ]+\]/g, "");
        const cleanR = q.r.replace(/\[cite:\s*[\d, ]+\]/g, "");
        textToRead += cleanP + ". " + cleanR + ". ";
    });
    
    const utterance = new SpeechSynthesisUtterance(textToRead);
    utterance.lang = 'es-ES';
    utterance.rate = 1.0;
    
    utterance.onend = () => {
        speaking = false;
        btn.innerText = "🔊 Escuchar Tema";
    };
    
    window.speechSynthesis.speak(utterance);
    speaking = true;
    btn.innerText = "⏹️ Detener Lectura";
}

// Inicialización
window.onload = () => {
    renderEsquema();
    renderTests();
};
</script>

    <script>

            { q: "¿Cuál es el objeto de la Ley Orgánica 3/2007?", a: "Hacer efectivo el derecho de igualdad de trato y de oportunidades entre mujeres y hombres, en particular mediante la eliminación de la discriminación de la mujer, sea cual fuere su circunstancia o condición, en cualesquiera de los ámbitos de la vida y, singularmente, en las esferas política, civil, laboral, económica, social y cultural." },
            { q: "¿Qué establecen los artículos 14 y 9.2 de la Constitución Española respecto a la igualdad?", a: "El art. 14 (igualdad formal) proclama que los españoles son iguales ante la ley, sin discriminación. El art. 9.2 (igualdad material) impone a los poderes públicos promover las condiciones para que la libertad y la igualdad del individuo y de los grupos sean reales y efectivas, removiendo obstáculos." },
            { q: "¿Cómo define la LO 3/2007 la discriminación indirecta?", a: "La situación en que una disposición, criterio o práctica aparentemente neutros pone a personas de un sexo en desventaja particular con respecto a personas del otro, salvo que puedan justificarse objetivamente en atención a una finalidad legítima y que los medios sean necesarios y adecuados." },
            { q: "¿Qué empresas están obligadas a elaborar un Plan de Igualdad según la LO 3/2007 y el RD 901/2020?", a: "Es obligatorio en empresas con 50 o más trabajadores; en las empresas en que se establezca por convenio colectivo; y en aquellas donde la autoridad laboral, en un procedimiento sancionador, haya acordado sustituir las sanciones accesorias por la elaboración y aplicación de dicho plan." },
            { q: "¿Qué es el acoso por razón de sexo según la LO 3/2007?", a: "Cualquier comportamiento realizado en función del sexo de una persona, con el propósito o el efecto de atentar contra su dignidad y de crear un entorno intimidatorio, degradante u ofensivo." },
            { q: "¿En qué casos se invierte la carga de la prueba según la LO 3/2007?", a: "En aquellos procedimientos (excepto penales) en los que las alegaciones de la parte actora se fundamenten en actuaciones discriminatorias por razón de sexo, corresponderá a la persona demandada probar la ausencia de discriminación en las medidas adoptadas y su proporcionalidad." },
            { q: "¿Qué se entiende por composición o presencia equilibrada según la LO 3/2007?", a: "La presencia de mujeres y hombres de forma que, en el conjunto a que se refiera, las personas de cada sexo no superen el 60% ni sean menos del 40%." },
            { q: "¿A qué tipo de candidaturas electorales no es exigible el principio de presencia equilibrada (art. 44 bis LOREG)?", a: "No será exigible a las candidaturas que se presenten en los municipios o islas con un número de residentes igual o inferior a 3.000 y 5.000 habitantes respectivamente." },

            { q: "¿Qué prohíbe el art. 71 de la LO 3/2007 respecto a seguros y servicios financieros?", a: "Prohíbe celebrar contratos en los que, al considerar el sexo como factor de cálculo, se generen diferencias en primas y prestaciones. Específicamente, los costes relacionados con el embarazo y el parto no justificarán diferencias." },
            { q: "¿Qué órgano es responsable de la coordinación interministerial de políticas de igualdad?", a: "La Comisión Interministerial de Igualdad entre mujeres y hombres, que es el órgano colegiado responsable de coordinar políticas y medidas de los ministerios para garantizar el derecho a la igualdad." },
            { q: "¿Cuál es la vigencia inicial del Distintivo Empresarial en materia de igualdad?", a: "Tendrá una vigencia inicial de cinco años, pudiendo la empresa solicitar su prórroga antes de expirar." },
            { q: "¿Qué define la LO 1/2004 como violencia de género?", a: "Comprende todo acto de violencia física y psicológica (incluidas agresiones a la libertad sexual, amenazas, coacciones o privación de libertad) que, como manifestación de discriminación, desigualdad y relaciones de poder, se ejerce sobre las mujeres por parte de quienes sean o hayan sido sus cónyuges o estén o hayan estado ligados a ellas por relaciones similares de afectividad, aun sin convivencia." },
            { q: "¿Qué es la violencia vicaria en el contexto de la LO 1/2004?", a: "La violencia de género que, con el objetivo de causar perjuicio o daño a las mujeres, se ejerce sobre sus familiares o allegados menores de edad por parte de las personas indicadas en la ley (cónyuges o ex cónyuges, parejas o ex parejas)." },
            { q: "¿Qué derechos laborales tiene una trabajadora víctima de violencia de género (LO 1/2004)?", a: "Reducción o reordenación de su tiempo de trabajo, movilidad geográfica, cambio de centro de trabajo, adaptación de su puesto, suspensión de la relación laboral con reserva de puesto y extinción del contrato (dando lugar a situación legal de desempleo)." },
            { q: "¿Cómo se puede acreditar la situación de violencia de género (art. 23, LO 1/2004)?", a: "Sentencia condenatoria, orden de protección, resolución judicial con medida cautelar, informe del Ministerio Fiscal, informe de los servicios sociales, especializados o de acogida, o cualquier título normativo. En menores, documentos sanitarios oficiales comunicados a la Fiscalía o Juzgado." },
            { q: "¿A qué ayudas económicas (pago único) tiene derecho la víctima de violencia de género según el art. 27 de la LO 1/2004?", a: "Si carece de rentas superiores al 75% del SMI: ayuda de pago único equivalente a 6 meses de subsidio por desempleo; 12 meses si tiene discapacidad igual o superior al 33%; 18 meses si tiene responsabilidades familiares; 24 meses si un familiar conviviente tiene discapacidad igual o superior al 33%." },
            { q: "¿Qué delitos asume la Sección de Violencia sobre la Mujer (art. 89 LOPJ)?", a: "Instrucción de delitos de homicidio, aborto, lesiones, delitos contra la libertad sexual, intimidad, honor (cometidos contra esposa o análoga relación), emisión y ejecución de instrumentos de reconocimiento en la UE, y delitos de quebrantamiento (art. 468 CP), entre otros." },
            { q: "¿Cuáles son las penas por el delito de malos tratos del art. 153.1 del Código Penal?", a: "Prisión de 6 meses a 1 año o trabajos en beneficio de la comunidad de 31 a 80 días, y en todo caso privación del derecho a tenencia y porte de armas de 1 año y 1 día a 3 años." },
            { q: "¿Qué objeto tiene la Ley 15/2022, integral para la igualdad de trato y la no discriminación?", a: "Garantizar y promover el derecho a la igualdad de trato y no discriminación, respetar la igual dignidad de las personas en desarrollo de los arts. 9.2, 10 y 14 de la Constitución." },
            { q: "¿Qué diferencia existe entre discriminación múltiple e interseccional según la Ley 15/2022?", a: "Múltiple: discriminación simultánea o consecutiva por dos o más causas. Interseccional: cuando concurren o interactúan diversas causas generando una forma específica de discriminación." },
            { q: "¿Qué organismo crea el Título III de la Ley 15/2022?", a: "La Autoridad Independiente para la Igualdad de Trato y la No Discriminación, en el ámbito de la Administración del Estado." },
            { q: "¿Cómo se sancionan las infracciones muy graves en la Ley 15/2022 y cuáles son?", a: "Sancionadas con entre 40.001 y 500.000 euros. Incluyen discriminación múltiple, acoso discriminatorio, presión grave sobre la autoridad, y comisión de 3 o más graves en 2 años." },
            { q: "¿Cuál es el objeto de la LO 10/2022 de garantía integral de la libertad sexual?", a: "La garantía y protección integral del derecho a la libertad sexual y la erradicación de todas las violencias sexuales." },
            { q: "¿Qué comprende el ámbito objetivo de la violencias sexuales según la LO 10/2022?", a: "Cualquier acto de naturaleza sexual no consentido o que condicione el libre desarrollo de la vida sexual. Incluye feminicidio sexual, delitos del Título VIII LO 10/1995, mutilación genital femenina, matrimonio forzado, acoso con connotación sexual, trata y violencias en el ámbito digital (pornografía no consentida, extorsión)." },
            { q: "¿Qué es la intersexualidad según la Ley 4/2023?", a: "La condición de aquellas personas nacidas con unas características biológicas, anatómicas o fisiológicas, anatomía sexual, órganos reproductivos o patrón cromosómico que no se corresponden con las nociones socialmente establecidas de cuerpos masculinos o femeninos." },
            { q: "¿A partir de qué edad se puede solicitar por sí misma la rectificación registral de la mención del sexo (Ley 4/2023)?", a: "Toda persona de nacionalidad española mayor de dieciséis años podrá solicitarla por sí misma ante el Registro Civil." },
            { q: "¿Qué procedimiento aplica para menores de 16 y mayores de 14 años en la rectificación del sexo?", a: "Podrán presentar la solicitud por sí mismas, asistidas en el procedimiento por sus representantes legales." },
            { q: "¿Qué plazo hay para que la persona encargada del Registro dicte resolución sobre la rectificación registral del sexo?", a: "Plazo máximo de un mes a contar desde la fecha de la segunda comparecencia (ratificación)." },
            { q: "¿Cuándo prescriben las infracciones muy graves y sus sanciones en la Ley 4/2023?", a: "Las infracciones muy graves prescriben a los 4 años. Las sanciones por infracciones muy graves prescriben a los 5 años." },
            { q: "¿Qué define la Ley 39/2006 como Dependencia?", a: "El estado permanente de personas que, por edad, enfermedad o discapacidad y ligadas a la pérdida de autonomía, precisan de atención de otras personas o ayudas importantes para realizar actividades básicas de la vida diaria." },
            { q: "¿Cuáles son los grados de dependencia según la Ley 39/2006?", a: "Grado I: Dependencia moderada (ayuda al menos una vez al día). Grado II: Dependencia severa (ayuda dos o tres veces al día sin apoyo permanente). Grado III: Gran dependencia (ayuda varias veces al día con apoyo indispensable y continuo)." },
            { q: "¿Qué tres niveles de protección establece el Sistema para la Autonomía y Atención a la Dependencia (SAAD)?", a: "1) Nivel mínimo (garantizado y financiado por la AGE). 2) Segundo nivel (acordado entre AGE y CCAA vía convenios - actualmente suspendido). 3) Tercer nivel adicional (definido y financiado por las CCAA)." },
            { q: "¿Qué servicios incluye el Catálogo de servicios de la Ley 39/2006?", a: "Prevención y promoción de autonomía, Teleasistencia, Ayuda a domicilio, Centros de Día y Noche, y Atención Residencial." },
            { q: "¿Cuándo se reconoce la prestación económica vinculada al servicio (Ley 39/2006)?", a: "Únicamente cuando no sea posible el acceso a un servicio público o concertado de atención y cuidado." },

            { q: "¿Quién debe aprobar la resolución sancionadora por infracciones de cuantía superior a 300.000 euros en materia de discapacidad?", a: "Se requerirá el acuerdo previo del Consejo de Ministros." }

                container.appendChild(div);
            });

                });

                div.innerHTML = `
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">Test ${index + 1}</h2>
                    <form id="form-${testId}">
                        ${questionsHtml}
                        <div class="flex flex-wrap gap-4 mt-8">
                            <button type="button" onclick="evaluarTest('${testId}', ${index})" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded shadow transition font-bold">Enviar (Calcular resultado)</button>
                            <button type="button" onclick="reiniciarTest('${testId}', ${index})" class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-2 rounded shadow transition font-bold">Reiniciar test</button>
                        </div>
                    </form>
                    <div id="results-${testId}" class="mt-6 p-4 rounded font-bold text-lg hidden"></div>
                `;
                container.appendChild(div);
            });
        }

        function openTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            
            // Update tab buttons styling
            document.querySelectorAll('#tabs-container button').forEach(btn => {
                btn.classList.remove('bg-blue-100', 'text-blue-700');
                btn.classList.add('bg-gray-100', 'text-gray-700');
            });
            const activeBtn = document.getElementById(tabId === 'esquema' ? 'tab-btn-esquema' : `tab-btn-${tabId}`);
            if(activeBtn) {
                activeBtn.classList.remove('bg-gray-100', 'text-gray-700');
                activeBtn.classList.add('bg-blue-100', 'text-blue-700');
            }
            
            // Stop speech if navigating away
            if(speechSynthesis.speaking) { speechSynthesis.cancel(); updateTTSButtonState(false); }
        }

        function evaluarTest(testId, dataIndex) {
            const testData = testsData[dataIndex];
            let aciertos = 0;
            let errores = 0;
            let enBlanco = 0;

            testData.forEach((q, qIndex) => {
                const radios = document.getElementsByName(`q${testId}-${qIndex}`);
                let answered = false;
                
                radios.forEach(r => r.disabled = true); // Disable inputs after submission

                for (let i = 0; i < radios.length; i++) {
                    const optionContainer = document.querySelector(`.option-container-${testId}-${qIndex}:nth-child(${i+1})`);
                    
                    if (radios[i].checked) {
                        answered = true;
                        if (parseInt(radios[i].value) === q.a) {
                            aciertos++;
                            optionContainer.classList.add('correct-answer');
                        } else {
                            errores++;
                            optionContainer.classList.add('incorrect-answer');
                        }
                    }
                    // Show correct answer in green even if they didn't check it or checked wrong
                    if (parseInt(radios[i].value) === q.a) {
                        optionContainer.classList.add('correct-answer');
                    }
                }

                if (!answered) enBlanco++;

                // Reveal explanation
                document.getElementById(`exp-${testId}-${qIndex}`).classList.add('show');
            });

            const resultsDiv = document.getElementById(`results-${testId}`);
            resultsDiv.classList.remove('hidden', 'bg-green-100', 'bg-red-100', 'text-green-800', 'text-red-800');
            
            let resultClass = aciertos >= 10 ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800';
            resultsDiv.className = `mt-6 p-4 rounded font-bold text-lg ${resultClass} block`;
            resultsDiv.innerHTML = `Resultados: ${aciertos} Aciertos | ${errores} Errores | ${enBlanco} En Blanco. <br>
                                    ${aciertos >= 10 ? '¡Aprobado! Buen trabajo.' : 'Has suspendido. Necesitas repasar el texto adjunto.'}`;
            
            // Scroll to results
            resultsDiv.scrollIntoView({ behavior: 'smooth' });
        }

        function reiniciarTest(testId, dataIndex) {
            const form = document.getElementById(`form-${testId}`);
            form.reset();

            const testData = testsData[dataIndex];
            testData.forEach((q, qIndex) => {
                const radios = document.getElementsByName(`q${testId}-${qIndex}`);
                radios.forEach(r => r.disabled = false);

                for (let i = 0; i < radios.length; i++) {
                    const optionContainer = document.querySelector(`.option-container-${testId}-${qIndex}:nth-child(${i+1})`);
                    optionContainer.classList.remove('correct-answer', 'incorrect-answer');
                }
                document.getElementById(`exp-${testId}-${qIndex}`).classList.remove('show');
            });

            document.getElementById(`results-${testId}`).classList.add('hidden');
            form.scrollIntoView({ behavior: 'smooth' });
        }

        let ttsUtterance = null;
        function toggleTTS() {
            if (speechSynthesis.speaking) {
                speechSynthesis.cancel();
                updateTTSButtonState(false);
            } else {
                let fullText = "Esquema de preguntas probables. ";
                esquemaData.forEach((item, index) => {
                    fullText += `Pregunta ${index + 1}. ${item.q} . Respuesta: ${item.a} . . `;
                });
                
                ttsUtterance = new SpeechSynthesisUtterance(fullText);
                ttsUtterance.lang = 'es-ES';
                ttsUtterance.rate = 1.0;
                
                ttsUtterance.onend = () => updateTTSButtonState(false);
                ttsUtterance.onerror = () => updateTTSButtonState(false);
                
                speechSynthesis.speak(ttsUtterance);
                updateTTSButtonState(true);
            }
        }

        function updateTTSButtonState(isSpeaking) {
            const btnText = document.getElementById('tts-text');
            const btn = document.getElementById('tts-btn');
            if (isSpeaking) {
                btnText.innerText = "Detener lectura";
                btn.classList.replace('bg-green-600', 'bg-red-600');
                btn.classList.replace('hover:bg-green-700', 'hover:bg-red-700');
            } else {
                btnText.innerText = "Escuchar Esquema";
                btn.classList.replace('bg-red-600', 'bg-green-600');
                btn.classList.replace('hover:bg-red-700', 'hover:bg-green-700');
            }
        }
    </script>
</body>
</html>

    <script>
        const esquemaPreguntas = [
            {
                pregunta: "¿Cuáles son los dos procedimientos principales de provisión de puestos de trabajo adscritos a funcionarios en la AGE?",
                respuesta_detallada: "El concurso, que es el sistema normal de provisión, y la libre designación, de conformidad con lo que determinen las relaciones de puestos de trabajo en atención a la naturaleza de sus funciones."
            },
            {
                pregunta: "¿En qué plazo deben comunicarse las diligencias de cese y toma de posesión al Registro Central de Personal?",
                respuesta_detallada: "Dentro de los tres días hábiles siguientes a su formalización."
            },
            {
                pregunta: "¿Quién autoriza las bases de la convocatoria de un concurso de provisión de puestos?",
                respuesta_detallada: "Son autorizadas por la Secretaría de Estado competente en materia de función pública, a iniciativa de los Departamentos Ministeriales."
            },
            {
                pregunta: "¿Cuál es el plazo de presentación de instancias para participar en un concurso de traslados?",
                respuesta_detallada: "El plazo de presentación de instancias será de quince días hábiles, contados a partir del siguiente al de la publicación de la convocatoria en el Boletín Oficial del Estado (BOE)."
            },
            {
                pregunta: "¿Qué antigüedad mínima se exige con carácter general para poder participar en un concurso de traslados?",
                respuesta_detallada: "Haber permanecido en el puesto de destino anterior definitivo un mínimo de dos años."
            },
            {
                pregunta: "¿Cuáles son los límites porcentuales de puntuación para cada bloque de méritos valorables en un concurso?",
                respuesta_detallada: "La puntuación por cada uno de los conceptos (méritos específicos, grado personal, trabajo desarrollado, cursos de formación y antigüedad) no puede ser superior al 40%, ni inferior al 10% de la puntuación máxima total."
            },
            {
                pregunta: "¿Cuál es el plazo general de resolución de un concurso de traslados?",
                respuesta_detallada: "El plazo de resolución será de dos meses desde el día siguiente al de finalización de presentación de instancias, salvo que en supuestos excepcionales la propia convocatoria establezca otro distinto."
            },

        function renderEsquema(lista = esquemaPreguntas) {
            const esquemaContainer = document.getElementById('esquema-container');
            if (lista.length === 0) {
                esquemaContainer.innerHTML = `<div class="no-results">No se encontraron preguntas que coincidan con tu búsqueda.</div>`;
                return;
            }
            esquemaContainer.innerHTML = lista.map((item) => {
                const idxOriginal = esquemaPreguntas.indexOf(item);
                return `
                    <article class="card">
                        <div>
                            <div class="card-header">
                                <span class="card-num">#${idxOriginal + 1}</span>
                                <h3>${item.pregunta}</h3>
                                <button class="card-speak-btn" onclick="leerTarjeta(${idxOriginal})" title="Escuchar esta tarjeta" aria-label="Escuchar tarjeta">🔊</button>

                            <p>${item.respuesta_detallada}</p>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function filtrarEsquema() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            if (!query) {
                renderEsquema(esquemaPreguntas);
                return;

            const filtradas = esquemaPreguntas.filter(item =>
                item.pregunta.toLowerCase().includes(query) ||
                item.respuesta_detallada.toLowerCase().includes(query)
            );
            renderEsquema(filtradas);
        }

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(`tab-${tabId}`).classList.add('active');
            if (btnElement) {
                btnElement.classList.add('active');
                btnElement.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function actualizarProgreso(examIndex) {
            const form = document.getElementById(`form-exam-${examIndex}`);
            const respondidas = form.querySelectorAll('input[type="radio"]:checked').length;
            document.getElementById(`progress-${examIndex}`).textContent = `Respondidas: ${respondidas} / 20`;
        }

        function corregirExamen(examIndex) {
            const form = document.getElementById(`form-exam-${examIndex}`);
            const questions = form.querySelectorAll('.question-block');
            let aciertos = 0;
            let errores = 0;

            questions.forEach((qBlock, qIndex) => {
                const correct = qBlock.getAttribute('data-correct');
                const selectedInput = qBlock.querySelector(`input[name="ex${examIndex}_q${qIndex}"]:checked`);
                const options = qBlock.querySelectorAll('.option-label');
                const explanationBox = qBlock.querySelector('.explanation-box');

                qBlock.querySelectorAll('input').forEach(inp => inp.disabled = true);
                explanationBox.style.display = 'block';

                options.forEach(opt => {
                    const val = opt.querySelector('input').value;
                    opt.classList.remove('correct', 'incorrect');

                    if (val === correct) {
                        opt.classList.add('correct');
                    }
                    if (selectedInput && selectedInput.value === val && val !== correct) {
                        opt.classList.add('incorrect');
                    }
                });

                if (selectedInput && selectedInput.value === correct) {
                    aciertos++;
                } else {
                    errores++;
                }
            });

            const nota = ((aciertos / 20) * 10).toFixed(2);
            const scoreDisplay = document.getElementById(`score-${examIndex}`);
            scoreDisplay.style.display = 'block';
            scoreDisplay.innerHTML = `
                <div class="score-number">${nota} / 10</div>
                <div class="score-details">✅ ${aciertos} Aciertos &nbsp;·&nbsp; ❌ ${errores} Errores</div>
            `;
            scoreDisplay.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function reiniciarExamen(examIndex) {
            const form = document.getElementById(`form-exam-${examIndex}`);
            form.reset();
            const questions = form.querySelectorAll('.question-block');

            questions.forEach(qBlock => {
                qBlock.querySelectorAll('input').forEach(inp => inp.disabled = false);
                qBlock.querySelectorAll('.option-label').forEach(opt => {
                    opt.classList.remove('correct', 'incorrect');
                });
                qBlock.querySelector('.explanation-box').style.display = 'none';
            });

            document.getElementById(`progress-${examIndex}`).textContent = `Respondidas: 0 / 20`;
            const scoreDisplay = document.getElementById(`score-${examIndex}`);
            scoreDisplay.style.display = 'none';
            scoreDisplay.innerHTML = '';
        }

        // Síntesis de voz mejorada
        let isSpeaking = false;

        function toggleAudioTema() {
            if (!('speechSynthesis' in window)) {
                alert("Tu navegador no soporta la síntesis de voz.");
                return;
            }

            const playBtn = document.getElementById('btn-audio-play');
            const stopBtn = document.getElementById('btn-audio-stop');

            if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
                window.speechSynthesis.pause();
                playBtn.textContent = "▶️ Reanudar";
                return;
            }

            if (window.speechSynthesis.paused) {
                window.speechSynthesis.resume();
                playBtn.textContent = "⏸️ Pausar";
                return;
            }

            window.speechSynthesis.cancel();
            let textoCompleto = "Esquema detallado del Tema 5. ";
            esquemaPreguntas.forEach((item, index) => {
                textoCompleto += `Punto ${index + 1}: ${item.pregunta}. ${item.respuesta_detallada}. `;
            });

            const utterance = new SpeechSynthesisUtterance(textoCompleto);
            utterance.lang = 'es-ES';
            utterance.onend = () => {
                playBtn.textContent = "🔊 Escuchar Todo";
                stopBtn.style.display = "none";
            };

            window.speechSynthesis.speak(utterance);
            playBtn.textContent = "⏸️ Pausar";
            stopBtn.style.display = "inline-flex";
        }

        function detenerAudio() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                document.getElementById('btn-audio-play').textContent = "🔊 Escuchar Todo";
                document.getElementById('btn-audio-stop').style.display = "none";
            }
        }

        function leerTarjeta(index) {
            if (!('speechSynthesis' in window)) return;
            detenerAudio();
            const item = esquemaPreguntas[index];
            const utterance = new SpeechSynthesisUtterance(`${item.pregunta}. ${item.respuesta_detallada}`);
            utterance.lang = 'es-ES';
            window.speechSynthesis.speak(utterance);
        }

        // Modo Oscuro / Claro
        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('theme-btn');
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                btn.textContent = '🌙 Modo Oscuro';
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.textContent = '☀️ Modo Claro';
                localStorage.setItem('theme', 'dark');
            }
        }

        window.onload = () => {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('theme-btn').textContent = '☀️ Modo Claro';
            }
            initApp();
        };
    </script>
</body>
</html>

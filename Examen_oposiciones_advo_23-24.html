        {n:68, c:"b", a:false, q:"En Outlook 365 vamos a asignar categorías de color a un grupo de elementos seleccionados. ¿Cuál de las siguientes opciones indica de forma correcta las acciones disponibles para ello?", o:{a:"Es necesario crear primero las categorías, ya que no partimos de categorías habilitadas por defecto. Es posible modificar o eliminar categorías así como asignar teclas de métodos abreviados a cada categoría.", b:"Contamos con varias categorías habilitadas por defecto que podemos modificar o eliminar. También es posible crear nuevas categorías y asignar teclas de métodos abreviados a cada categoría.", c:"Es necesario crear primero las categorías, ya que no partimos de categorías habilitadas por defecto. Es posible modificar o eliminar categorías, pero no asignar teclas de métodos abreviados a cada categoría.", d:"Contamos con varias categorías habilitadas por defecto que podemos modificar o eliminar. También es posible crear nuevas categorías, pero no asignar teclas de métodos abreviados a cada categoría."}},

{
    id: "rp1", title: "PREGUNTAS DE RESERVA (Primera Parte)", context: null,
    questions: [
        {n:1, c:"a", a:false, q:"De acuerdo con lo dispuesto en el título III de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, relativo al Consejo de Transparencia y Buen Gobierno, señale la respuesta correcta:", o:{a:"El Consejo de Transparencia y Buen Gobierno estará compuesto por la Junta de Transparencia y Buen Gobierno y por el Presidente del Consejo de Transparencia y Buen Gobierno.", b:"El Presidente del Consejo de Transparencia y Buen Gobierno será nombrado por un período no renovable de cuatro años mediante Real Decreto.", c:"El Presidente del Consejo de Transparencia y Buen Gobierno cesará en su cargo por la expiración de su mandato, a petición propia o por separación acordada por el Ministro de Hacienda.", d:"El Consejo de Ministros aprobará mediante Real Decreto el Estatuto del Consejo de Transparencia y Buen Gobierno."}},
        {n:2, c:"b", a:false, q:"La Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas establece que las notificaciones:", o:{a:"Se practicarán, en todo caso, por medios electrónicos.", b:"Se practicarán preferentemente por medios electrónicos y, en todo caso, cuando el interesado resulte obligado a recibirlas por esta vía.", c:"Se podrán practicar por medios electrónicos las que contengan medios de pago a favor de los obligados, tales como cheques.", d:"Cuando la notificación por medios electrónicos sea de carácter obligatorio, se entenderá rechazada cuando hayan transcurrido tres días naturales desde la puesta a disposición de la notificación sin que se acceda a su contenido."}},
        {n:3, c:"c", a:false, q:"De acuerdo con la definición contenida en el artículo 38 de la Ley 40/2015, 1 de octubre, de Régimen Jurídico del Sector Público, aquella dirección electrónica, disponible para los ciudadanos a través de redes de telecomunicaciones, cuya titularidad corresponde a una Administración Pública, o bien a uno o varios organismos públicos o entidades de derecho público en ejercicio de sus competencias es:", o:{a:"Un portal de internet.", b:"Una carpeta ciudadana.", c:"Una sede electrónica.", d:"Un código seguro de verificación."}},
        {n:4, c:"c", a:false, q:"¿Qué actos administrativos, resoluciones y datos de las personas inscritas serán objeto de anotación en el Registro Central de Personal?:", o:{a:"Domicilio particular.", b:"Estado civil.", c:"Autorizaciones o reconocimientos de compatibilidad.", d:"Prolongaciones de jornada."}},
        {n:5, c:"b", a:false, q:"En función de lo dispuesto en la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, podrá interponerse el recurso extraordinario de revisión ante el órgano administrativo que lo dictó, que también será el competente para su resolución, cuando concurra alguna de las circunstancias siguientes:", o:{a:"Que al dictarlo se hubiera incurrido en error de hecho o de derecho, que resulte de los propios documentos incorporados al expediente únicamente con posterioridad a la incoación del expediente.", b:"Que aparezcan documentos de valor esencial para la resolución del asunto que, aunque sean posteriores, evidencien el error de la resolución recurrida.", c:"Que en la resolución hayan influido parcialmente documentos o testimonios declarados falsos por auto judicial, anterior a aquella resolución.", d:"Que la resolución administrativa haya sido emitida con omisión del procedimiento legalmente establecido."}}

{
    id: "sup1", title: "SUPUESTO I", context: "Dña. Estela Sánchez Ruiz, funcionaria del Cuerpo de Gestión de la Administración Civil del Estado, viene ocupando un puesto en comisión de servicios desde hace un año, denominado Jefe/Jefa de Servicio de Procedimientos Administrativos, de nivel de complemento de destino 26, adscrito a la Subsecretaría del Ministerio de Agricultura, Pesca y Alimentación. La persona titular de la Subdirección General a la que está adscrita dicha funcionaria le encarga que prepare el borrador de una convocatoria de subvenciones para agricultores afectados por la sequía en las comunidades autónomas de Madrid, Castilla-La Mancha y Extremadura.\n\nAdemás, a Dña. Estela también se le encarga que informe sobre un recurso de alzada que se ha recibido en la Subdirección General.\n\nLa mencionada funcionaria considera que cada vez recibe más encargos y está pensando seriamente cambiar de puesto de trabajo o promocionar a otro Cuerpo, al considerarse mal retribuida. Incluso ha llegado a plantear en alguna ocasión a sus superiores jerárquicos la posibilidad de que se contrate a alguien para que le ayude en sus tareas. Y es que la situación le está creando cierto estrés y duda incluso de que esté gestionando adecuadamente toda la información que maneja, con posibles errores en lo referente a la protección de datos, lo cual le produce el temor de poder ser sancionada o, incluso, perder su empleo.",
    questions: [
        {n:1, c:"d", a:false, q:"En el informe a elaborar sobre el recurso de alzada, ¿cuál de los siguientes enunciados sería el correcto?:", o:{a:"Si el recurso se ha interpuesto ante el órgano que dictó el acto impugnado, este debe resolverlo.", b:"Si el acto impugnado ha sido expreso, el plazo para la interposición del recurso es de tres meses.", c:"El plazo máximo para dictar y notificar la resolución del recurso será de un mes.", d:"Contra la resolución del recurso de alzada no cabrá ningún otro recurso administrativo, salvo, en su caso, el extraordinario de revisión."}},
        {n:2, c:"a", a:false, q:"Dña. Estela, al analizar la documentación de la que dispone en relación al recurso de alzada interpuesto, aprecia que habrían de tenerse en cuenta nuevos hechos no recogidos en el expediente originario, por lo que decide incluir en su informe una propuesta para que esos hechos se pongan de manifiesto a los interesados para que estos puedan formular las alegaciones que estimen procedentes en un plazo:", o:{a:"No inferior a diez días ni superior a quince.", b:"No inferior a diez días ni superior a un mes.", c:"De un mes desde la fecha del trámite de audiencia de los interesados.", d:"De tres meses a contar desde el conocimiento de los hechos."}},
        {n:3, c:"b", a:false, q:"Pero Dña. Estela, antes de terminar su informe, se da cuenta de que a ella se le ha solicitado informe sobre un recurso de alzada, pero el recurrente lo ha calificado como recurso de reposición, calificación que ella considera claramente como errónea, por lo que sería correcta la siguiente actuación:", o:{a:"Propone suspender la tramitación del recurso por calificación errónea por parte del recurrente.", b:"Propone continuar con la tramitación del recurso, dado que del recurso presentado se deduce su verdadero carácter de recurso de alzada.", c:"Propone la inadmisión del recurso por carecer manifiestamente de fundamento.", d:"Propone la suspensión de su eficacia y su publicación en el Boletín Oficial del Estado."}},
        {n:4, c:"a", a:false, q:"Ante las dudas sobre la protección de datos, Dña. Estela, sabiendo que existe un delegado de protección de datos en el Ministerio de Agricultura, Pesca y Alimentación, piensa que sería una buena idea plantear una consulta para determinar si los procesos de tratamiento de datos son correctos. ¿Podría el delegado de protección de datos tener acceso a esos datos personales?", o:{a:"Sí.", b:"No.", c:"Sí, salvo que se oponga a dicho acceso el responsable o el encargado del tratamiento de datos.", d:"No, dado que este acceso solo le es permitido a la Agencia Española de Protección de Datos."}},
        {n:5, c:"a", a:false, q:"En el caso de que la persona que ha interpuesto el recurso de alzada presente una reclamación ante la Agencia Española de Protección de Datos por entender vulnerada la protección de sus datos, dicha Agencia podrá remitir esa reclamación al delegado de protección de datos del Ministerio de Agricultura, Pesca y Alimentación a fin de que este responda en el plazo de:", o:{a:"Un mes.", b:"Dos meses.", c:"Quince días.", d:"Tres meses."}},
        {n:6, c:"d", a:false, q:"Si como consecuencia de la actuación indicada en la anterior pregunta, el Ministerio de Agricultura, Pesca y Alimentación demuestra haber adoptado medidas para el cumplimiento de la normativa aplicable, la Agencia Española de Protección de Datos:", o:{a:"Declarará caducado el procedimiento.", b:"Efectuará un requerimiento al delegado de protección de datos del Ministerio de Agricultura, Pesca y Alimentación.", c:"Efectuará una advertencia al responsable del tratamiento de datos del Ministerio de Agricultura, Pesca y Alimentación.", d:"Podrá inadmitir a trámite la reclamación."}},
        {n:7, c:"c", a:false, q:"Fruto del estrés que sufre Dña. Estela, esta acaba discutiendo con la persona titular de la Subdirección General a la que está adscrita. En el marco de esa discusión, Dña. Estela llega a amenazar con dar publicidad en las redes sociales y medios de comunicación a toda la documentación a la que tiene acceso por razón de su cargo de Jefa de Servicio. Ante esta amenaza, su superior jerárquico le informa de que dicha conducta podría ser constitutiva de:", o:{a:"Falta leve.", b:"Falta grave.", c:"Falta muy grave.", d:"Despido disciplinario."}},
        {n:8, c:"a", a:false, q:"A la vista de lo que le puede suponer a Dña. Estela el hecho de llevar a cabo su amenaza, esta estudia la normativa aplicable y constata que su actuación podría llevar aparejada una sanción:", o:{a:"De separación del servicio.", b:"De despido disciplinario.", c:"De suspensión de funciones por dos años.", d:"De traslado con cambio de residencia por un año."}},
        {n:9, c:"c", a:false, q:"A la luz de la normativa aplicable en materia de régimen disciplinario, Dña. Estela sabe que en el caso de que se iniciara un procedimiento disciplinario contra ella, el Subsecretario del Ministerio de Agricultura, Pesca y Alimentación podría o debería nombrar un instructor o instructora del mismo, y que debería ser, en dicho caso, una persona funcionaria perteneciente a un cuerpo o escala del subgrupo:", o:{a:"C1.", b:"A2 en todo caso.", c:"A1 o A2.", d:"Solo se exige que sea funcionario público."}},
        {n:10, c:"b", a:false, q:"Dña. Estela comienza a barajar posibilidades respecto a su futuro profesional y piensa en solicitar una excedencia voluntaria por interés particular, sabiendo que si se le comienza a instruir un expediente disciplinario:", o:{a:"Deberá acreditar un período mínimo de servicios de tres años.", b:"No se le podrá conceder la excedencia voluntaria mientras dure la instrucción del procedimiento disciplinario.", c:"La concesión de excedencia voluntaria por interés particular quedará subordinada a las necesidades del servicio debidamente motivadas.", d:"No se le podrá conceder por un período superior a tres años."}},
        {n:11, c:"a", a:false, q:"Entre una de las posibilidades sobre las que piensa Dña. Estela, se encuentra la de ampliar sus retribuciones e ir labrándose un futuro en el sector privado trabajando como jefa de los servicios administrativos de una sociedad limitada perteneciente a un tío abuelo suyo que se dedica a la contratación de obras con el sector público. ¿Podría ser compatible esta actividad privada con su condición de funcionaria del Estado?", o:{a:"No, conforme a la Ley de Incompatibilidades del personal al servicio de las Administraciones Públicas.", b:"Sí, siempre que informe favorablemente la personal titular de la Subsecretaría del Ministerio de Agricultura, Pesca y Alimentación.", c:"Podría ser compatible si la actividad privada no modificara la jornada y horario de trabajo de Dña. Estela.", d:"Hay que atender al grado de parentesco del propietario de la empresa con Dña. Estela para dilucidar esta cuestión, así como la configuración jurídica de la empresa."}},
        {n:12, c:"b", a:false, q:"No obstante las posibilidades que se está planteando Dña. Estela, también podría promocionar a otro cuerpo o escala de un subgrupo superior, como, por ejemplo, el Cuerpo Superior de Administradores Civiles del Estado. ¿Sería posible en el caso de esta funcionaria?", o:{a:"No, porque está desempeñando un puesto en comisión de servicios desde hace un año.", b:"Sería posible si dicha funcionaria tiene una antigüedad de, al menos, dos años en el Cuerpo de Gestión de la Administración Civil del Estado y posee la titulación y el resto de los requisitos establecidos con carácter general para el acceso al Cuerpo Superior de Administradores Civiles del Estado.", c:"Sería posible siempre que se haga a través de los procedimientos previstos en el Estatuto de los Trabajadores o en el convenio colectivo correspondiente.", d:"Sería posible siempre y cuando concurra a los sistemas de evaluación que la Administración General del Estado determine, dándose audiencia a la interesada, y por la correspondiente resolución motivada."}},
        {n:13, c:"c", a:false, q:"También cabría la posibilidad de que Dña. Estela participase en un procedimiento de provisión de puestos de trabajo por el sistema de libre designación en el Ministerio de Asuntos Exteriores, Unión Europea y Cooperación, para la cual se requeriría antes de su nombramiento:", o:{a:"Informe favorable de la Secretaría de Estado de Función Pública.", b:"Ser funcionaria del subgrupo A1.", c:"Informe favorable del Ministerio de Agricultura, Pesca y Alimentación.", d:"Informe favorable de la Secretaría de Estado de Administración Pública."}},
        {n:14, c:"b", a:false, q:"Ya que Dña. Estela considera que en su Unidad hay una gran carga de trabajo que no puede ser adecuadamente asumida, decide proponerle a su Subdirectora General que gestione la posibilidad del nombramiento de funcionarios interinos por exceso o acumulación de tareas conforme al texto refundido de la Ley del Estatuto Básico del Empleado Público, sabiendo que pueden ser nombrados:", o:{a:"Por un período máximo de tres años.", b:"Por plazo máximo de nueve meses, dentro de un período de dieciocho meses.", c:"Con una duración máxima de tres años, ampliables hasta doce meses más.", d:"Por el tiempo que dure la cobertura de los puestos conforme a la correspondiente Oferta de Empleo Público."}},
        {n:15, c:"d", a:false, q:"Dña. Estela tiene cierto temor por las consecuencias del estrés que sufre, y conoce el caso de un compañero suyo, personal laboral fijo, al que el Instituto Nacional de la Seguridad Social declaró en situación de incapacidad permanente, pero no recuerda en qué grado, aunque sí sabe que la Ley General de la Seguridad Social indica cuatro grados posibles y que son:", o:{a:"Parcial, total, transitoria y gran invalidez.", b:"Total, absoluta, reglamentaria y gran invalidez.", c:"Parcial, revisable, total y gran invalidez.", d:"Parcial, total, absoluta y gran invalidez."}},
        {n:16, c:"d", a:false, q:"De todas formas, Dña. Estela sabe que se le ha asignado una tarea importante en materia de subvenciones que por sus deberes como funcionaria debe atender, por lo que comienza a analizar la Ley General de Subvenciones, y viendo que las subvenciones no van a ser financiadas con cargo a fondos de la Unión Europea, concluye que el régimen jurídico aplicable a las mismas es:", o:{a:"Las normas de derecho privado en todo caso.", b:"El derecho comunitario, dado que las subvenciones van dirigidas a varias Comunidades Autónomas.", c:"El derecho privado y las restantes normas de desarrollo y, en su defecto, el derecho administrativo.", d:"La Ley General de Subvenciones y sus disposiciones de desarrollo, las restantes normas de derecho administrativo y, en su defecto, las normas de derecho privado."}},
        {n:17, c:"b", a:false, q:"Antes de comenzar a preparar el borrador de la convocatoria de subvenciones, Dña. Estela comprueba si el Ministerio de Agricultura, Pesca y Alimentación dispone del plan en el que se concreten los objetivos y efectos que se pretenden con las subvenciones a otorgar por el Departamento, el plazo necesario para su consecución, los costes previsibles y sus fuentes de financiación, es decir, si el Ministerio dispone del:", o:{a:"Plan anual de subvenciones.", b:"Plan estratégico de subvenciones.", c:"Plan trienal de subvenciones.", d:"Plan plurianual de subvenciones."}},
        {n:18, c:"b", a:false, q:"Con carácter previo a la convocatoria de subvenciones, Dña. Estela sabe que debe efectuar:", o:{a:"El compromiso del gasto.", b:"La aprobación del gasto.", c:"El reconocimiento de la obligación.", d:"El reconocimiento de la obligación y la propuesta de gasto."}},
        {n:19, c:"c", a:false, q:"¿Qué documento contable reflejaría la fase del gasto contemplada en la anterior pregunta?", o:{a:"OK", b:"D", c:"A", d:"RC"}},
        {n:20, c:"a", a:false, q:"Dña. Estela, en el transcurso de la gestión económica de la convocatoria de subvenciones, aprecia que el crédito en el capítulo 4 del presupuesto de gastos del Ministerio de Agricultura, Pesca y Alimentación es insuficiente para atender la nueva convocatoria, estimando que se necesitan 10 millones más de euros sobre un total de 100 millones que aparecen en dicho capítulo. Ante esto, propone que se tramite un crédito extraordinario o un suplemento de crédito que debería financiarse:", o:{a:"Mediante baja en los créditos del Fondo de Contingencia o en otros no financieros que se consideren adecuados.", b:"Con deuda pública o con baja en otros créditos de la misma naturaleza financiera.", c:"Con cargo a la parte del remanente de tesorería al fin del ejercicio anterior que no hayan sido aplicados en el presupuestos del Ministerio, o con mayores ingresos sobre los previstos inicialmente.", d:"Mediante la transferencia de créditos destinados a subvenciones nominativas."}}
    ]
},
{
    id: "rsup1", title: "PREGUNTAS DE RESERVA (Supuesto I)", context: null,
    questions: [
        {n:1, c:"b", a:false, q:"¿En qué plazo podrá Dña. Estela presentar su solicitud de participación en la libre designación del Ministerio de Asuntos Exteriores, Unión Europea y Cooperación?", o:{a:"10 días hábiles siguientes al de la publicación de la convocatoria.", b:"15 días hábiles siguientes al de la publicación de la convocatoria.", c:"20 días hábiles siguientes al de la publicación de la convocatoria.", d:"Un mes a partir de la publicación de la convocatoria."}},
        {n:2, c:"a", a:false, q:"Dña. Estela, que reside en Madrid, tiene que acudir a un curso como formadora durante tres días en Valladolid. El día de regreso la comisión de servicio concluye a las 21 horas. ¿Qué gastos se le abonarán a la funcionaria respecto de ese último día?", o:{a:"50 por 100 de los gastos de manutención.", b:"100 por 100 de los gastos de manutención.", c:"50 por 100 de los gastos de manutención, abonándose adicionalmente el otro 50 por 100 cuando la cena se realice fuera de la residencia habitual, previa justificación con factura o recibo del correspondiente establecimiento.", d:"Gastos de alojamiento."}},
        {n:3, c:"b", a:false, q:"Dña. Estela tiene un compañero personal laboral fijo, grupo profesional E1. ¿Qué titulación mínima posee?", o:{a:"Sin titulación prevista en el sistema educativo.", b:"Título de Graduado en Educación Secundaria Obligatoria o Título Profesional Básico o equivalentes.", c:"Título de Bachiller o Técnico o equivalentes.", d:"Título clasificado en el Nivel 1 del Marco Español de Cualificaciones para la Educación Superior o equivalentes."}},
        {n:4, c:"c", a:false, q:"Transcurrido el plazo máximo para resolver el recurso de alzada sin que hubiese recaído resolución, el recurrente podría entender que:", o:{a:"Habría caducado el procedimiento de recurso.", b:"Habría prescrito el procedimiento de recurso.", c:"Se habría desestimado el recurso interpuesto.", d:"Se habría estimado el recurso interpuesto."}},
        {n:5, c:"d", a:false, q:"Como consecuencia de la pérdida de efectivos producida por un elevado número de jubilaciones en el último año, el Ministerio de Agricultura, Pesca y Alimentación se plantea fusionar la Subdirección General en la que presta servicio Dña. Estela y otra Subdirección General de la misma Dirección General. ¿A través de qué instrumento juridico se podrá articular esta reorganización ministerial?", o:{a:"Por Orden del Ministro de Agricultura, Pesca y Alimentación, a propuesta del Ministerio para la Transformación Digital y de la Función Pública.", b:"Por Orden del Ministro de Agricultura, Pesca y Alimentación, previa autorización del Ministro para la Transformación Digital y de la Función Pública.", c:"Por Real Decreto del Consejo de Ministros, a propuesta del Ministro de Agricultura, Pesca y Alimentación.", d:"Por Real Decreto del Consejo de Ministros, a iniciativa del Ministro de Agricultura, Pesca y Alimentación y a propuesta del Ministro para la Transformación Digital y de la Función Pública."}}
    ]
},
{
    id: "sup2", title: "SUPUESTO II", context: "D. Juan Rodríguez, perteneciente al Cuerpo de Gestión de la Administración Civil del Estado, presta sus servicios en el área de contratación administrativa de la Subdirección General de Administración Financiera, dentro del Ministerio de Industria y Turismo. Un día, mientras caminaba hacia su trabajo, recibió la noticia de que su pareja de hecho había sufrido un accidente grave que requería una intervención quirúrgica sin hospitalización y necesitaría reposo domiciliario. D. Juan Rodríguez sueña con hacer un viaje largo por el mundo con ella, pero para lograrlo necesita ahorrar y disponer de más días de asuntos particulares.\n\nPor otro lado, uno de sus compañeros busca un destino en la administración de su comunidad autónoma de nacimiento a través de convocatorias de libre designación que se publican periódicamente. Este compañero tiene una amplia trayectoria dentro de la administración, habiendo promocionado desde el subgrupo C2 al C1 después de diez años de servicio. Comenzó con un nivel 14 y en un año pasó a ocupar un nivel 17. Finalmente, su compañero logra garantizar su movilidad a otra comunidad autónoma; sin embargo, por razones del servicio, en su unidad de origen necesitan retenerlo para cumplir con los objetivos de ejecución presupuestaria para el ejercicio corriente.\n\nEn su unidad, D. Juan Rodríguez Hernández debe tramitar una indemnización por comisión de servicio según el Real Decreto 462/2002 para una compañera, personal laboral temporal del grupo profesional M3.\n\nEn materia de industria, su Ministerio requiere un acuerdo con efectos jurídicos con el Ministerio de Transportes y Movilidad Sostenible para la cofinanciación de un proyecto de desarrollo del vehículo eléctrico.\n\nDentro de la Subdirección General de Administración Financiera dada su necesidad, se ha puesto en marcha la tramitación de un contrato de obras por procedimiento abierto para rehabilitar una de sus dependencias en Madrid, que se encuentra obsoleta. Sin embargo, uno de los licitadores no está conforme con los pliegos de la licitación y tiene la voluntad de interponer un recurso especial en materia de contratación. A este contrato de obras se le suma la necesidad de licitar un contrato de servicios para asistencia técnica y dirección de obra.\n\nAdemás, a D. Juan Rodriguez le han asignado la tramitación de un contrato para la adquisición de tarjetas de combustible para el repostaje en estaciones de servicio de los vehículos oficiales del Ministerio, que se tramitará a través del vigente Acuerdo Marco 21/2023. Hasta la tramitación de este contrato, el Ministerio no tiene ninguno en vigor y un vehículo necesita repostar, por lo que proponen cubrir el gasto mediante el sistema de anticipos de caja fija.",
    questions: [
        {n:1, c:"d", a:false, q:"¿Tiene D. Juan Rodriguez derecho a algún permiso como resultado del accidente de su pareja de hecho?", o:{a:"No tiene permiso.", b:"1 día hábil.", c:"3 días hábiles.", d:"5 días hábiles."}},
        {n:2, c:"b", a:false, q:"¿Aumentarán los días de permiso por asuntos particulares a los que tiene derecho D. Juan Rodriguez conforme acumule antigüedad en la Administración?", o:{a:"Sí, las Administraciones Públicas podrán establecer hasta dos días adicionales de permiso por asuntos particulares al cumplir el quinto trienio, incrementándose, como máximo, en un día adicional por cada trienio cumplido a partir del octavo.", b:"Sí, las Administraciones Públicas podrán establecer hasta dos días adicionales de permiso por asuntos particulares al cumplir el sexto trienio, incrementándose, como máximo, en un día adicional por cada trienio cumplido a partir del octavo.", c:"Sí, las Administraciones Públicas podrán establecer hasta tres días adicionales de permiso por asuntos particulares al cumplir el sexto trienio, incrementándose, como máximo, en un día adicional por cada trienio cumplido a partir del octavo.", d:"Si, las Administraciones Públicas podrán establecer hasta tres días adicionales de permiso por asuntos particulares al cumplir el quinto trienio, incrementándose, como máximo, en un día adicional por cada trienio cumplido a partir del octavo."}},
        {n:3, c:null, a:true, q:"Según se comenta en el enunciado, el compañero de D. Juan Rodríguez se incorporó a la administración con un nivel 14 y en un año pasó a ocupar un nivel 17, ¿cuánto tiempo tardó desde su toma de posesión en consolidar el nivel 17?", o:{a:"5 años, siempre que haya obtenido la plaza de nivel 17 con carácter definitivo por alguno de los sistemas de provisión de puestos de trabajo.", b:"5 años, no siendo necesario haber obtenido la plaza de nivel 17 con carácter definitivo por alguno de los sistemas de provisión de puestos de trabajo.", c:"6 años, siempre que haya obtenido la plaza de nivel 17 con carácter definitivo por alguno de los sistemas de provisión de puestos de trabajo.", d:"6 años, no siendo necesario haber obtenido la plaza de nivel 17 con carácter definitivo por alguno de los sistemas de provisión de puestos de trabajo."}},
        {n:4, c:"a", a:false, q:"Con respecto al tiempo que se puede diferir el cese cuando se está tramitando la libre designación a otra comunidad autónoma, indique la respuesta correcta:", o:{a:"El Subsecretario del Departamento donde preste servicios el funcionario podrá diferir el cese por necesidades del servicio hasta veinte días hábiles, comunicándose a la unidad a que haya sido destinado el funcionario.", b:"Excepcionalmente, a propuesta del Departamento, por exigencias del normal funcionamiento de los servicios, la Subsecretaría del Departamento donde preste servicios el funcionario podrá aplazar la fecha de cese hasta un máximo de tres meses.", c:"El Subsecretario del Departamento donde preste servicios el funcionario podrá diferir el cese por necesidades del servicio hasta quince días hábiles, comunicándose a la unidad a que haya sido destinado el funcionario.", d:"Excepcionalmente, a propuesta del Departamento, por exigencias del normal funcionamiento de los servicios, la Secretaría de Estado para la Administración Pública podrá aplazar la fecha de cese hasta un máximo de seis meses."}},
        {n:5, c:"b", a:false, q:"A la hora de tramitar la comisión de servicio para la compañera de D. Juan Rodríguez, señale a qué grupo a efectos de indemnización por razón del servicio pertenece atendiendo al IV Convenio colectivo único para el personal laboral de la Administración General del Estado:", o:{a:"1.", b:"2.", c:"3.", d:"4."}},
        {n:6, c:"d", a:false, q:"Si la orden de comisión de servicio es firmada de manera errónea por un órgano que no es competente por razón de jerarquía, marque al respecto la afirmación correcta:", o:{a:"La Administración podrá convalidar los actos nulos, subsanando los vicios de que adolezcan.", b:"El acto de convalidación producirá efecto desde el día siguiente a su fecha, salvo lo dispuesto en el artículo 39.3 para la retroactividad de los actos administrativos.", c:"Dada la consideración de error material o, de hecho, es preceptivo retrotraer las actuaciones realizadas e incoar nuevamente el procedimiento administrativo.", d:"Si el vicio consistiera en incompetencia no determinante de nulidad, la convalidación podrá realizarse por el órgano competente cuando sea superior jerárquico del que dictó el acto viciado."}},
        {n:7, c:"d", a:false, q:"Con respecto al acuerdo con efectos jurídicos con el Ministerio de Transportes y Movilidad Sostenible, ¿qué figura jurídica sería necesario emplear?", o:{a:"Protocolo General de Actuación.", b:"Consorcio.", c:"Pacto bilateral.", d:"Convenio."}},
        {n:8, c:"d", a:false, q:"Siguiendo con el acuerdo con efectos juridicos al que hace referencia la pregunta anterior, indique la respuesta correcta relativa al plazo de vigencia:", o:{a:"Deberá tener una duración determinada, que no podrá ser superior a tres años.", b:"En cualquier momento antes de la finalización, los firmantes del convenio podrán acordar unánimemente su prórroga por un periodo de hasta dos años adicionales o su extinción.", c:"No cabe la posibilidad de prorrogar un acuerdo con implicaciones económicas prestablecidas.", d:"Deberá tener una duración determinada, que no podrá ser superior a cuatro años, salvo que normativamente se prevea un plazo superior."}},
        {n:9, c:"a", a:false, q:"En relación con el licitador que no está conforme con los pliegos de la licitación del contrato de obras y tiene voluntad de interponer un recurso especial en materia de contratación, señale la respuesta correcta:", o:{a:"Son susceptibles de recurso especial en materia de contratación los contratos de obras cuyo valor estimado sea superior a tres millones de euros. No procederá la interposición de recursos administrativos ordinarios.", b:"Son susceptibles de recurso especial en materia de contratación los contratos de obras cuyo valor estimado sea superior a dos millones de euros. Alternativamente procede la interposición de recursos administrativos ordinarios.", c:"Son susceptibles de recurso especial en materia de contratación los contratos de obras cuyo valor estimado sea superior a tres millones de euros. Alternativamente procede la interposición de recursos administrativos ordinarios.", d:"Son susceptibles de recurso especial en materia de contratación los contratos de obras cuyo valor estimado sea superior a dos millones de euros. No procederá la interposición de recursos administrativos ordinarios."}},
        {n:10, c:"a", a:false, q:"¿Cuál es el órgano competente para resolver el recurso especial en materia de contratación?", o:{a:"Tribunal Administrativo Central de Recursos Contractuales.", b:"Junta Administrativa de Recursos Contractuales.", c:"Autoridad Central de Recursos Contractuales.", d:"Oficina Independiente de Regulación y Supervisión en la Contratación."}},
        {n:11, c:"c", a:false, q:"En caso de que el contrato sea susceptible de recurso especial en materia de contratación ¿cuántos días hay que esperar para la formalización del contrato desde que se remita la notificación de la adjudicación a los licitadores y candidatos?", o:{a:"5 días naturales.", b:"10 días hábiles.", c:"15 días hábiles.", d:"15 días naturales."}},
        {n:12, c:"b", a:false, q:"Marque qué tipo de documento contable habrá que realizar cuando se haya formalizado el contrato de obras y, por tanto, se haya comprometido el gasto:", o:{a:"OK", b:"D", c:"A", d:"RC"}},
        {n:13, c:"a", a:false, q:"Durante la ejecución del contrato de obras surge la necesidad de utilizar un exceso de mediciones sobre las unidades de obra previstas, que supone un incremento del gasto del 8 por ciento del precio del contrato inicial. Señale cómo proceder en estos casos:", o:{a:"Los excesos de mediciones no tienen consideración de modificación contractual si el incremento del gasto es inferior al 10 por ciento del precio del contrato.", b:"Cabe adjudicar estas unidades a un nuevo contratista en caso de que no se haya contemplado como modificación prevista dentro del pliego de cláusulas administrativas particulares.", c:"Se deberá tramitar una modificación no prevista de las recogidas en el artículo 205 de la Ley de Contratos del Sector Público que podrá alcanzar hasta un 50% del precio inicial del contrato.", d:"Las modificaciones previstas en los pliegos no deben superar el 15 por ciento que indica el artículo 204 de la Ley de Contratos del Sector Público."}},
        {n:14, c:"d", a:false, q:"Para licitar el contrato de servicios de asistencia técnica a la obra, ¿puede emplearse el procedimiento simplificado previsto en el artículo 159 de la Ley de Contratos del Sector Público, sabiendo que el valor estimado del contrato es de 70.000 euros?", o:{a:"Sí, el límite de valor estimado que no se puede superar para tramitar un contrato de servicios por procedimiento abierto simplificado es de 83.000 euros.", b:"Sí, el límite de valor estimado que no se puede superar para tramitar un contrato de servicios por procedimiento abierto simplificado es de 113.000 euros.", c:"Sí, el límite de valor estimado que no se puede superar para tramitar un contrato de servicios por procedimiento abierto simplificado es de 123.000 euros.", d:"Sí, el límite de valor estimado que no se puede superar para tramitar un contrato de servicios por procedimiento abierto simplificado es de 143.000 euros."}},
        {n:15, c:"a", a:false, q:"En caso de tramitarse un procedimiento abierto simplificado para el contrato de servicio de asistencia técnica a la obra, indique cuál sería el plazo mínimo para presentación de proposiciones a contar desde el siguiente a la publicación en el perfil de contratante del anuncio de licitación:", o:{a:"No podrá ser inferior a quince días.", b:"No podrá ser inferior a veinte días.", c:"No podrá ser inferior a veintiséis días.", d:"No podrá ser inferior a treinta días."}},
        {n:16, c:"c", a:false, q:"En el caso de que el contratista al que se le adjudique el contrato de obra para rehabilitar las dependencias del Ministerio de Industria y Turismo incurra en demora respecto al cumplimiento del plazo total, la Administración podrá optar por la resolución del contrato o por:", o:{a:"La imposición de penalidades diarias en la proporción de 0,40 euros por cada mil euros del presupuesto máximo del contrato.", b:"La imposición de penalidades diarias en la proporción de 0,50 euros por cada mil euros del precio del contrato, IVA excluido", c:"La imposición de penalidades diarias en la proporción de 0,60 euros por cada mil euros del precio del contrato, IVA excluido.", d:"La imposición de penalidades no superiores al 10 por ciento del precio del contrato, IVA excluido, y el total de las mismas no podrá superar el 50 por cien del precio del contrato."}},
        {n:17, c:"b", a:false, q:"Con respecto al acuerdo marco 21/2023 vigente para el suministro de combustibles en estaciones de servicio. Señale cuál es la respuesta correcta sobre la duración máxima de un acuerdo marco:", o:{a:"La duración de un acuerdo marco no podrá exceder de tres años, salvo en casos excepcionales, debidamente justificados. La duración de los contratos basados en un acuerdo marco estará vinculada a la duración del acuerdo marco.", b:"La duración de un acuerdo marco no podrá exceder de cuatro años, salvo en casos excepcionales, debidamente justificados. La duración de los contratos basados en un acuerdo marco será independiente de la duración del acuerdo marco.", c:"La duración de un acuerdo marco no podrá exceder de tres años, salvo en casos excepcionales, debidamente justificados. La duración de los contratos basados en un acuerdo marco será independiente de la duración del acuerdo marco.", d:"La duración de un acuerdo marco no podrá exceder de cuatro años, salvo en casos excepcionales, debidamente justificados. La duración de los contratos basados en un acuerdo marco estará vinculada a la duración del acuerdo marco."}},
        {n:18, c:"b", a:false, q:"Atendiendo a la Resolución de 20 de enero de 2014, de la Dirección General de Presupuestos, por la que se establecen los códigos que definen la clasificación económica, indique el capítulo, artículo, concepto y subconcepto que corresponde a la compra de combustible:", o:{a:"132.01", b:"221.03", c:"332.01", d:"642.03"}},
        {n:19, c:"b", a:false, q:"Suponiendo que se quieran adquirir a través del acuerdo marco 21/2023 tarjetas de combustible por un total de base imponible de 10.000 euros con una duración de 24 meses sin posibilidad de prórroga, y sabiendo que la modificación prevista en el pliego es del 20%, calcule el valor estimado del contrato.", o:{a:"10.000 euros.", b:"12.000 euros.", c:"12.100 euros.", d:"14.520 euros."}},
        {n:20, c:"d", a:false, q:"Fuera del acuerdo marco, en caso de que se decidiera pagar a un proveedor la adquisición de combustible por el sistema de anticipos de caja fija, ¿cuál sería el importe máximo a pagar por este sistema?", o:{a:"5.000 euros incluyendo el IVA.", b:"5.000 euros sin incluir el IVA.", c:"5.000 euros incluyendo la correspondiente prorrata del IVA.", d:"Podrán ser superiores a los 5.000 euros por razón del servicio."}}
    ]
},
{
    id: "rsup2", title: "PREGUNTAS DE RESERVA (Supuesto II)", context: null,
    questions: [

function renderTest() {
    const container = document.getElementById('test-container');
    
    testData.forEach(group => {
        const groupDiv = document.createElement('div');
        groupDiv.className = 'mb-8 bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden';
        groupDiv.id = `bloque-${group.id}`;

        const header = document.createElement('div');
        header.className = 'bg-blue-800 text-white px-4 py-2 font-bold flex justify-between items-center';
        header.innerHTML = `<span>${group.title}</span> <span class="text-xs font-normal text-blue-200">${group.questions.length} preguntas</span>`;
        groupDiv.appendChild(header);

        if (group.context) {
            const contextDiv = document.createElement('div');
            contextDiv.className = 'px-4 py-3 bg-blue-50 border-b border-blue-100 text-gray-700 text-sm whitespace-pre-line text-justify italic';
            contextDiv.innerText = group.context;
            groupDiv.appendChild(contextDiv);
        }

        const questionsDiv = document.createElement('div');
        questionsDiv.className = 'p-3 md:p-4 grid gap-3';

        group.questions.forEach(q => {
            const qDiv = document.createElement('div');
            qDiv.className = `p-3 rounded border ${q.a ? 'bg-gray-50 border-gray-200 opacity-75' : 'bg-white border-gray-200 shadow-sm'}`;
            
            const qTitle = document.createElement('div');
            qTitle.className = `font-semibold mb-2 ${q.a ? 'text-gray-500 line-through' : 'text-gray-800'}`;
            qTitle.innerHTML = `<span class="mr-1">${q.n}.</span>${q.q}`;
            if (q.a) {
                qTitle.innerHTML += ` <span class="ml-2 bg-gray-200 text-gray-600 text-xs px-1.5 py-0.5 rounded font-bold no-underline inline-block">ANULADA</span>`;
            }
            qDiv.appendChild(qTitle);

            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'flex flex-col gap-1';

            ['a', 'b', 'c', 'd'].forEach(letra => {
                const label = document.createElement('label');
                label.className = `opcion-label flex items-start gap-2 p-1.5 border rounded cursor-pointer ${q.a ? 'bg-gray-100 border-transparent cursor-not-allowed' : 'bg-white border-transparent hover:bg-blue-50'}`;
                label.id = `label-${group.id}-${q.n}-${letra}`;

                const input = document.createElement('input');
                input.type = 'radio';
                input.name = `q-${group.id}-${q.n}`;
                input.value = letra;
                if (q.a) input.disabled = true;

                const textSpan = document.createElement('span');
                textSpan.className = q.a ? 'text-gray-400' : 'text-gray-700';
                textSpan.innerHTML = `<span class="font-medium text-gray-500 w-4 inline-block">${letra})</span> ${q.o[letra]}`;

                label.appendChild(input);
                label.appendChild(textSpan);
                optionsDiv.appendChild(label);
            });

            qDiv.appendChild(optionsDiv);
            questionsDiv.appendChild(qDiv);
        });
        groupDiv.appendChild(questionsDiv);

        const footer = document.createElement('div');
        footer.className = 'p-4 bg-gray-50 border-t border-gray-200 flex flex-col sm:flex-row sm:items-center justify-between gap-4';
        
        const btn = document.createElement('button');
        btn.className = 'px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded shadow-sm transition-colors text-sm';
        btn.innerText = `Corregir Bloque: ${group.title}`;
        btn.onclick = () => corregirBloque(group.id);

        const resultDiv = document.createElement('div');
        resultDiv.id = `resultado-${group.id}`;
        resultDiv.className = 'hidden font-bold flex flex-wrap gap-3 text-sm items-center';

        footer.appendChild(btn);
        footer.appendChild(resultDiv);
        groupDiv.appendChild(footer);

        container.appendChild(groupDiv);
    });
}

function corregirBloque(groupId) {
    const groupData = testData.find(g => g.id === groupId);
    let aciertos = 0;
    let errores = 0;
    let blancos = 0;
    let anuladas = 0;

    groupData.questions.forEach(q => {
        if (q.a) {
            anuladas++;
            return;
        }

        const radios = document.getElementsByName(`q-${groupId}-${q.n}`);
        let seleccionada = null;

        // Deshabilitar todo y resetear bordes
        ['a', 'b', 'c', 'd'].forEach(letra => {
            const label = document.getElementById(`label-${groupId}-${q.n}-${letra}`);
            label.classList.add('border-gray-100'); // Dim general
            document.querySelector(`input[name="q-${groupId}-${q.n}"][value="${letra}"]`).disabled = true;
        });

        radios.forEach(r => { if (r.checked) seleccionada = r.value; });

        const labelCorrecta = document.getElementById(`label-${groupId}-${q.n}-${q.c}`);

        if (seleccionada === q.c) {
            aciertos++;
            labelCorrecta.classList.add('correct-selected');
            labelCorrecta.classList.remove('border-gray-100', 'hover:bg-blue-50');
        } else if (seleccionada) {
            errores++;
            const labelSeleccionada = document.getElementById(`label-${groupId}-${q.n}-${seleccionada}`);
            labelSeleccionada.classList.add('wrong-selected');
            labelSeleccionada.classList.remove('border-gray-100', 'hover:bg-blue-50');
            
            labelCorrecta.classList.add('correct-missed');
            labelCorrecta.classList.remove('border-gray-100', 'hover:bg-blue-50');
        } else {
            blancos++;
            labelCorrecta.classList.add('correct-missed');
            labelCorrecta.classList.remove('border-gray-100', 'hover:bg-blue-50');
        }
    });

    const puntuacion = (aciertos * 1) - (errores * 0.333);
    const resultDiv = document.getElementById(`resultado-${groupId}`);
    
    resultDiv.innerHTML = `
        <span class="px-2 py-1 bg-green-100 text-green-800 rounded border border-green-200">Aciertos: ${aciertos}</span>
        <span class="px-2 py-1 bg-red-100 text-red-800 rounded border border-red-200">Errores: ${errores}</span>
        <span class="px-2 py-1 bg-gray-200 text-gray-700 rounded border border-gray-300">Blancos: ${blancos}</span>
        <span class="px-3 py-1 bg-blue-100 text-blue-900 rounded-full border border-blue-300 ml-auto">
            Nota: ${puntuacion.toFixed(3)}
        </span>
    `;
    resultDiv.classList.remove('hidden');
}

window.onload = renderTest;
</script>

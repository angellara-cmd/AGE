    <script>
        // DATOS: ESQUEMA (40 preguntas)
        const esquemaPreguntas = [
            {q: "¿Qué se entiende por personal laboral al servicio de las Administraciones Públicas?", a: "Es aquel que, en virtud de contrato de trabajo formalizado por escrito, presta servicios retribuidos por las AAPP en cualquiera de las modalidades previstas en la legislación laboral. Su contrato puede ser fijo, indefinido o temporal[cite: 3]."},
            {q: "¿Qué puestos excepcionalmente pueden ser desempeñados por personal laboral?", a: "Puestos de naturaleza no permanente o periódica/discontinua; oficios, vigilancia y custodia; carácter instrumental (mantenimiento, artes gráficas); conocimientos técnicos especializados sin cuerpo de funcionarios; puestos en el extranjero (trámite/auxiliares); y funciones auxiliares instrumentales[cite: 4]."},
            {q: "¿Qué puestos tienen prohibido, en todo caso, ser desempeñados por personal laboral?", a: "Aquellos cuyo ejercicio implique la participación directa o indirecta en el ejercicio de potestades públicas o la salvaguardia de los intereses generales del Estado y AAPP[cite: 4]."},
            {q: "¿Cuáles son los principios constitucionales y rectores para la selección de personal laboral?", a: "Igualdad, mérito, capacidad, publicidad, transparencia, imparcialidad y profesionalidad, independencia y discrecionalidad técnica, adecuación de procesos a funciones, y agilidad[cite: 4, 5]."},
            {q: "¿Qué sistemas selectivos establece el TREBEP para el personal laboral fijo?", a: "Los de oposición, concurso-oposición (con una o varias pruebas para determinar capacidad y orden de prelación) y concurso de valoración de méritos[cite: 5]."},
            {q: "¿Cómo se componen los órganos de selección para la provisión de personal laboral?", a: "Por un número impar de miembros. Como mínimo 4 representantes de la Administración (uno Presidente y otro Secretario) y 3 de los trabajadores. Todos deben pertenecer a un grupo profesional igual o superior al puesto[cite: 5, 17, 44]."},
            {q: "¿Cuál es la duración del periodo de prueba para el personal de nuevo ingreso?", a: "Para grupos M3 y M2: 3 meses. Para los demás: 1 mes. Para personal sin titulación: 15 días laborables. Durante este periodo se puede extinguir la relación sin indemnización[cite: 18, 44]."},
            {q: "¿Cuál es la vigencia máxima de las bolsas de trabajo provinciales?", a: "En ningún caso podrán superar los tres años, salvo prórroga solicitada y autorizada por la Dirección General de la Función Pública[cite: 6]."},
            {q: "¿Cuáles son los derechos básicos de los trabajadores laborales?", a: "Trabajo y libre elección de profesión, libre sindicación, negociación colectiva, adopción de medidas de conflicto, huelga, reunión, e información/consulta y participación[cite: 7]."},
            {q: "¿Qué destaca entre los derechos derivados del contrato de trabajo?", a: "La ocupación efectiva, promoción y formación profesional, no discriminación, integridad física/prevención de riesgos, respeto a la intimidad, percepción puntual de la remuneración, y ejercicio de acciones[cite: 7]."},
            {q: "¿Cuáles son los deberes básicos de los trabajadores?", a: "Cumplir obligaciones con buena fe y diligencia, observar medidas de prevención, cumplir órdenes, no concurrir con la actividad, contribuir a la mejora de la productividad y los señalados para empleados públicos[cite: 8]."},
            {q: "¿Qué establece el pacto de no concurrencia para el personal laboral?", a: "No podrán prestar servicio a varios empresarios si hay concurrencia desleal o dedicación plena pactada económicamente. A los laborales AAPP se les aplica plenamente la Ley de Incompatibilidades 53/1984[cite: 9, 10, 46]."},
            {q: "¿A quién aplica principalmente el IV Convenio Colectivo Único?", a: "Al personal laboral de la AGE y sus organismos autónomos, e incluye Justicia no transferida, Seguridad Social (incluido INGESA central y periférico), Consejo Seguridad Nuclear, AEPD, Museo Reina Sofía y Trabajo Penitenciario[cite: 10, 11, 37]."},
            {q: "¿Quién queda excluido del IV Convenio Único?", a: "Personal en el exterior, alta dirección, contratos administrativos (Ley 9/2017), minutas concretas, profesorado de religión, y los incluidos en otros convenios de la AGE[cite: 11, 12]."},
            {q: "¿Cómo se estructura el sistema de clasificación profesional en el IV Convenio?", a: "En grupos profesionales (que agrupan aptitudes y titulación), familias profesionales (agrupan cualificaciones u oficios por afinidad) y especialidades (perfil concreto, competencias y especificaciones técnicas)[cite: 13]."},
            {q: "¿Cuáles son los grupos profesionales M3, M2 y M1?", a: "M3: Título clasificado en Nivel 3 del MECES; M2: Nivel 2 del MECES; M1: Nivel 1 del MECES (o equivalentes)[cite: 13, 40]."},
            {q: "¿Qué titulaciones exigen los grupos profesionales E2, E1 y E0?", a: "E2: Bachiller o Técnico. E1: Graduado en ESO o Título Profesional Básico. E0: Sin titulación prevista en el sistema educativo[cite: 13, 40]."},
            {q: "¿Qué mecanismos existen para la provisión de vacantes?", a: "1) Concurso abierto y permanente (ordinario interdepartamental). 2) Promoción profesional. 3) Ingreso libre. Todo previo aviso y dotación presupuestaria[cite: 15, 42]."},
            {q: "¿Quiénes pueden participar en los procesos de promoción interna?", a: "Todo personal laboral fijo del grupo inmediatamente inferior con 2 años de servicios efectivos. Del E0 al E1 se permite si tienen más de 10 años de antigüedad aunque no tengan titulación (salvo habilitante)[cite: 16, 17, 42]."},
            {q: "¿Qué requisito exige el concurso abierto y permanente para participar?", a: "Haber permanecido en el último puesto obtenido de forma definitiva un mínimo de dos años, salvo si solicitan puesto en la misma Secretaría de Estado o Departamento Ministerial/Organismo[cite: 19, 42]."},
            {q: "¿Cuántos días de vacaciones anuales corresponden y cuándo se disfrutan?", a: "22 días hábiles por año completo (sábados no son hábiles). Se disfrutan en el año natural y hasta el 31 de enero del año siguiente[cite: 19, 45]."},
            {q: "¿Cuántos días de vacaciones se adquieren por antigüedad acumulada?", a: "A los 15 años: 23 días; 20 años: 24 días; 25 años: 25 días; 30 o más años: 26 días hábiles[cite: 20, 45]."},
            {q: "¿Qué condiciones regulan la licencia por asuntos propios?", a: "Personal con al menos 1 año de servicios efectivos. Máximo 3 meses cada 2 años, sin sueldo. Computa para antigüedad[cite: 21, 45]."},
            {q: "¿Qué permisos corresponden por matrimonio, nacimiento de hijo y traslado de domicilio?", a: "Matrimonio o registro de pareja de hecho: 15 días naturales. Nacimiento/adopción: 2 días. Traslado dentro de la misma localidad: 1 día; distinta localidad: 2 días[cite: 21, 22, 45]."},
            {q: "¿Cuánto dura el permiso por fallecimiento, accidente o enfermedad grave de familiar de 1er grado?", a: "3 días hábiles si es en la misma localidad, y 5 días hábiles si se produce en distinta localidad. Puede sumarse 1 mes adicional no retribuido si fallece cónyuge/pareja/hijos[cite: 21, 22, 45]."},
            {q: "¿Y en caso de familiar de 2º grado (consanguinidad o afinidad)?", a: "2 días hábiles si es en la misma localidad y 4 días hábiles si es en distinta localidad[cite: 22, 45]."},
            {q: "¿Cuáles son los permisos de las trabajadoras gestantes?", a: "Exámenes prenatales indispensables y permiso retribuido desde la semana 37 del embarazo (semana 35 en caso de gestación múltiple) hasta el parto[cite: 23, 45]."},
            {q: "¿Cuántos días por asuntos particulares corresponden?", a: "Hasta 6 días al año natural (disfrutables hasta el 31 enero). Se añaden 2 días extra al cumplir el sexto trienio, e incrementan 1 día adicional por cada trienio desde el octavo[cite: 23, 46]."},
            {q: "¿Qué componentes integran la estructura retributiva?", a: "Salario base, pagas extraordinarias, retribuciones personales (antigüedad, complementos unificación), complementos salariales (puesto, nocturnidad, disponibilidad, residencia) y percepciones no salariales[cite: 24, 50]."},
            {q: "¿En qué meses se devengan las pagas extraordinarias y qué cuantía tienen?", a: "El primer día hábil de junio y diciembre, en la cuantía de una mensualidad de salario base, antigüedad y complemento personal consolidado[cite: 25, 50]."},
            {q: "¿Cuáles son algunos ejemplos de faltas leves?", a: "Falta de asistencia sin causa de 1 o 2 días al mes, leve incorrección con el público, retraso injustificado, o incumplir el horario de 3 a 5 ocasiones al mes[cite: 25, 52]."},
            {q: "¿Qué se considera falta grave?", a: "Falta de disciplina, desconsideración grave, abandono de puesto, simulación de enfermedad, falta de asistencia de 3 a 4 días en un mes, incumplimiento de jornada entre 6 y 10 veces al mes (>10 horas)[cite: 25, 26, 52]."},
            {q: "¿Cuáles son ejemplos de faltas muy graves?", a: "Transgresión buena fe, embriaguez habitual que repercuta, falta no justificada de 5 o más días al mes, e incumplir horario más de 10 ocasiones al mes o >20 al trimestre[cite: 27, 52]."},
            {q: "¿Qué sanciones corresponden a faltas leves?", a: "Apercibimiento por escrito o suspensión de empleo y sueldo de hasta dos días[cite: 27, 52]."},
            {q: "¿Qué sanciones se prevén para faltas graves?", a: "Suspensión de empleo y sueldo de 3 días a 3 meses, y demérito (inhabilitación para promoción/provisión de hasta 1 año)[cite: 27, 52]."},
            {q: "¿Qué sanciones se aplican a faltas muy graves?", a: "Despido disciplinario, suspensión de empleo y sueldo de 3 meses y un día a 2 años, traslado forzoso sin indemnización por 3 años, o demérito de 1 año y un día a 5 años[cite: 28, 52]."},
            {q: "¿Cuáles son los plazos de prescripción de las faltas?", a: "Muy graves: 3 años. Graves: 2 años. Leves: 6 meses (se cuenta desde que se cometió)[cite: 29, 52]."},
            {q: "¿Cuáles son los plazos de prescripción de las sanciones?", a: "Sanciones por faltas muy graves: 3 años. Graves: 2 años. Leves: 1 año (se cuenta desde la firmeza en vía administrativa)[cite: 29, 52]."},
            {q: "¿Qué órganos asumen la representación colectiva?", a: "Delegados de personal (centros con menos de 50 trabajadores) y Comités de empresa (50 trabajadores o más)[cite: 30, 53]."},
            {q: "¿Qué crédito de horas mensuales tienen los representantes?", a: "Hasta 100 trab: 15h. De 101-250: 20h. De 251-500: 30h. De 501-750: 35h. De 751 en adelante: 40h. Pueden acumularse en uno o varios miembros[cite: 31, 53]."}
        ];

        // DATOS: TEST (10 arrays de 20 preguntas)
        const examenes = [
            // TEST 1: Conceptos, Derechos y Deberes
            [
                {q: "El art. 15.1.c de la Ley 30/1984 establece que se exceptúan de la regla general de cobertura por funcionarios y podrán desempeñarse por personal laboral:", o: ["Aquellos puestos con participación directa en potestades públicas.", "Los puestos correspondientes a oficios, vigilancia, custodia y áreas de mantenimiento.", "Puestos de Alta Dirección.", "Todos los puestos del INGESA, exclusivamente."], a: 1, e: "Se exceptúan los oficios, vigilancia, custodia, artes gráficas, protección civil, etc. Las potestades públicas están reservadas a funcionarios[cite: 4]."},
                {q: "En todo caso, ¿qué funciones están prohibidas para el personal laboral?", o: ["Mantenimiento y oficios.", "Funciones auxiliares en el extranjero.", "Ejercicio de potestades públicas o salvaguarda de intereses generales.", "A y B son correctas."], a: 2, e: "Según el art. 9.2 TREBEP, el ejercicio de funciones que impliquen la participación directa o indirecta en el ejercicio de potestades públicas corresponde exclusivamente a funcionarios[cite: 4]."},
                {q: "Los sistemas selectivos de personal laboral fijo regulados en el TREBEP son:", o: ["Solo oposición.", "Oposición, concurso-oposición y concurso de valoración de méritos.", "Libre designación o concurso.", "Todas son correctas."], a: 1, e: "El art. 61.7 TREBEP señala oposición, concurso-oposición o concurso de valoración de méritos[cite: 5]."},
                {q: "Para personal de los grupos M3 y M2, ¿de cuánto tiempo es el periodo de prueba?", o: ["Un mes.", "15 días laborables.", "Tres meses.", "Seis meses."], a: 2, e: "La duración del periodo de prueba es de 3 meses para M3 y M2, 1 mes para demás, y 15 días laborables sin titulación[cite: 18]."},
                {q: "¿Cuántos miembros conforman como mínimo el órgano de selección?", o: ["Tres miembros.", "Cuatro representantes de la Administración y tres de los trabajadores.", "Cinco miembros sindicales.", "Siete representantes de la Administración."], a: 1, e: "Mínimo cuatro representantes de la Administración (uno Presidente y otro Secretario) y tres de los trabajadores[cite: 17]."},
                {q: "En el periodo de prueba, ¿puede ponerse fin a la relación laboral con derecho a indemnización?", o: ["Sí, por parte del trabajador con 1 mes por año.", "Sí, por ambas partes.", "No, sin que ninguna de las partes tenga derecho a indemnización.", "Depende del grupo profesional."], a: 2, e: "Cualquiera de las partes puede poner fin sin derecho a indemnización[cite: 18]."},
                {q: "¿Cuál de los siguientes es un derecho básico de los trabajadores?", o: ["Derecho a la libre sindicación.", "Derecho a la ocupación efectiva.", "Derecho a no ser discriminado.", "Derecho a la prevención de riesgos."], a: 0, e: "La libre sindicación es un derecho básico. Los demás son derechos derivados de la relación de trabajo[cite: 7]."},
                {q: "Contribuir a la mejora de la productividad es:", o: ["Un derecho básico.", "Un deber básico.", "Un deber de conducta del empleado público.", "Una recomendación del Convenio."], a: 1, e: "Contribuir a la mejora de la productividad se tipifica expresamente como un deber básico del TRLET[cite: 8]."},
                {q: "Las bolsas de trabajo de estructura provincial para contratar laborales no permanentes tienen una vigencia que no podrá superar:", o: ["Un año.", "Tres años, salvo prórroga.", "Cinco años.", "Dos años."], a: 1, e: "La vigencia en ningún caso superará tres años, salvo prórroga por la Dirección General de Función Pública[cite: 6]."},
                {q: "En cuanto al pacto de no competencia post-contractual (TRLET), no podrá tener una duración superior a:", o: ["Tres años para los técnicos y 1 año para los demás.", "Dos años para los técnicos y seis meses para los demás.", "Seis meses para los técnicos y un mes para el resto.", "No existe pacto posible en las AAPP."], a: 1, e: "No podrá tener una duración superior a 2 años para los técnicos y 6 meses para los demás[cite: 10]."},
                {q: "Sobre el pacto de permanencia derivado de especialización, la duración máxima será de:", o: ["Un año.", "Dos años.", "Tres años.", "Cinco años."], a: 1, e: "El acuerdo de permanencia tras recibir especialización no será superior a dos años[cite: 10]."},
                {q: "¿Cuál de estos principios forma parte del Código de Conducta de los empleados públicos?", o: ["Maximización del beneficio.", "Austeridad.", "Discrecionalidad absoluta.", "Todas son correctas."], a: 1, e: "El Código de Conducta incluye, entre otros, ejemplaridad, austeridad, honradez y confidencialidad[cite: 9]."},
                {q: "Según el art. 16 de la Ley 53/1984 de incompatibilidades:", o: ["No podrá autorizarse compatibilidad al personal laboral con el personal directivo.", "El laboral puede ser directivo a media jornada.", "Solo se autoriza en caso de M1.", "Es libremente compatible."], a: 0, e: "No podrá autorizarse o reconocerse compatibilidad al personal (...) con el personal directivo[cite: 10]."},
                {q: "La imparcialidad y profesionalidad de los órganos de selección es:", o: ["Un deber de conducta.", "Un principio rector para el acceso al empleo público.", "Una recomendación sindical.", "No figura en el TREBEP."], a: 1, e: "El art. 55 TREBEP lo recoge como principio rector de acceso[cite: 5]."},
                {q: "¿Puede el personal laboral temporal formar parte de los órganos de selección?", o: ["Sí, en todo caso.", "Sí, si tiene titulación M3.", "No, bajo ningún concepto.", "A y B son correctas."], a: 2, e: "El IV Convenio especifica: 'No podrá formar parte de los órganos de selección el personal laboral temporal'[cite: 17]."},
                {q: "Cuando la prestación de trabajo no esté regulada por la Función Pública, las AAPP asumen el rol de:", o: ["Empresario definido por el TRLET.", "Agente colaborador.", "Empresa temporal de empleo.", "Sindicato unitario."], a: 0, e: "Asumen asimilación al concepto de empresario del Estatuto de los Trabajadores[cite: 3]."},

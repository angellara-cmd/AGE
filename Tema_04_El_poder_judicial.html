<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Esquemas y Test - Oposiciones AGE (Tema 4)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f1f5f9;
            --bg-gradient: radial-gradient(circle at top right, #e0e7ff 0%, #f1f5f9 45%, #f8fafc 100%);
            --card-bg: #ffffff;
            --header-bg: rgba(255, 255, 255, 0.85);
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --accent: #06b6d4;
            --text-main: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            
            /* Estados Test */
            --correct-bg: #ecfdf5;
            --correct-border: #10b981;
            --correct-text: #065f46;
            --incorrect-bg: #fef2f2;
            --incorrect-border: #ef4444;
            --incorrect-text: #991b1b;
            --exp-bg: #eff6ff;
            --exp-border: #3b82f6;
            --exp-text: #1e3a8a;

            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.07), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-pill: 9999px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-body: #0b1120;
            --bg-gradient: radial-gradient(circle at top right, #1e1b4b 0%, #0b1120 50%, #0f172a 100%);
            --card-bg: #1e293b;
            --header-bg: rgba(15, 23, 42, 0.85);
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --primary-light: rgba(99, 102, 241, 0.15);
            --accent: #22d3ee;
            --text-main: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: #334155;

            --correct-bg: rgba(16, 185, 129, 0.15);
            --correct-border: #10b981;
            --correct-text: #6ee7b7;
            --incorrect-bg: rgba(239, 68, 68, 0.15);
            --incorrect-border: #ef4444;
            --incorrect-text: #fca5a5;
            --exp-bg: rgba(59, 130, 246, 0.15);
            --exp-border: #60a5fa;
            --exp-text: #bfdbfe;

            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.65;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Barra de progreso superior */
        #scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            z-index: 2000;
            transition: width 0.1s ease-out;
        }

        /* Cabecera Glassmorphism */
        header {
            background: var(--header-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 14px 20px 10px;
            transition: var(--transition);
        }

        .header-top {
            max-width: 1024px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge-tema {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 800;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
        }

        h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--text-main) 30%, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .theme-toggle:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        /* Enlaces de documentos en cabecera */
        .docs-links {
            max-width: 1024px;
            margin: 0 auto 12px;
            display: flex;
            justify-content: flex-start;
            gap: 8px;
            flex-wrap: wrap;
        }

        .docs-links a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--primary);
            text-decoration: none;
            border: 1px solid var(--border-color);
            padding: 5px 12px;
            border-radius: var(--radius-pill);
            background: var(--card-bg);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .docs-links a:hover {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .docs-links a.highlight-link {
            border-color: rgba(79, 70, 229, 0.4);
            background: var(--primary-light);
        }

        .docs-links a.highlight-link:hover {
            background: var(--primary);
            color: #ffffff;
        }

        /* Navegación de pestañas */
        .nav-wrapper {
            max-width: 1024px;
            margin: 0 auto;
            position: relative;
        }

        nav {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding: 4px 2px 6px;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        nav::-webkit-scrollbar {
            display: none;
        }

        nav button {
            scroll-snap-align: start;
            white-space: nowrap;
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            border-radius: var(--radius-pill);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        nav button:hover {
            color: var(--primary);
            border-color: var(--primary);
        }

        nav button.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        /* Contenedor principal */
        main {
            padding: 24px 20px 60px;
            max-width: 920px;
            margin: 0 auto;
        }

        /* Controles superiores del esquema */
        .esquema-toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 240px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 13px 16px 13px 42px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
            pointer-events: none;
        }

        /* Botones principales */
        .btn-action {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: #ffffff;
            border: none;
            padding: 13px 22px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
            transition: var(--transition);
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
        }

        .btn-action:active {
            transform: translateY(0);
        }

        .btn-full {
            width: 100%;
            margin-top: 10px;
        }

        .btn-secondary {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .btn-secondary:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        /* Tarjetas del Esquema */
        .card {
            background: var(--card-bg);
            padding: 22px 24px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
            animation: fadeIn 0.35s ease both;
        }

        .card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, var(--primary), var(--accent));
            opacity: 0.85;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: rgba(99, 102, 241, 0.4);
        }

        .card h3 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            margin-bottom: 8px;
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1.4;
        }

        .card p {
            color: var(--text-secondary);
            font-size: 0.96rem;
        }

        /* Sección Test */
        .test-header-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            margin-bottom: 22px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .test-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        #test-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .progress-pill {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
            background: var(--primary-light);
            padding: 5px 14px;
            border-radius: var(--radius-pill);
        }

        .test-progress-bar-bg {
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: var(--radius-pill);
            overflow: hidden;
        }

        .test-progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: var(--radius-pill);
            transition: width 0.3s ease;
        }

        /* Marcador de resultados */
        .score-card {
            display: none;
            background: var(--card-bg);
            border: 2px solid var(--primary);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-md);
            animation: fadeIn 0.4s ease;
        }

        .score-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            text-align: center;
        }

        .score-item {
            padding: 12px 8px;
            border-radius: var(--radius-md);
            background: var(--bg-body);
            border: 1px solid var(--border-color);
        }

        .score-item span.num {
            display: block;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
        }

        .score-item span.lbl {
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .score-item.ok span.num { color: #10b981; }
        .score-item.err span.num { color: #ef4444; }
        .score-item.nota span.num { color: var(--primary); }

        /* Bloque de pregunta */
        .question-block {
            margin-bottom: 22px;
            padding: 22px 24px;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            animation: fadeIn 0.35s ease both;
        }

        .question-text {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 16px;
            color: var(--text-main);
            line-height: 1.45;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 13px 16px;
            margin-bottom: 10px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.95rem;
            color: var(--text-secondary);
            background: transparent;
        }

        .option-label:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .option-label input[type="radio"] {
            margin-top: 3px;
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .option-label.correct {
            background-color: var(--correct-bg);
            color: var(--correct-text);
            border-color: var(--correct-border);
            font-weight: 600;
        }

        .option-label.incorrect {
            background-color: var(--incorrect-bg);
            color: var(--incorrect-text);
            border-color: var(--incorrect-border);
        }

        .explanation-box {
            display: none;
            background-color: var(--exp-bg);
            padding: 14px 16px;
            border-radius: var(--radius-md);
            margin-top: 14px;
            font-size: 0.92rem;
            color: var(--exp-text);
            border-left: 4px solid var(--exp-border);
            line-height: 1.55;
            animation: fadeIn 0.3s ease;
        }

        /* Botón flotante volver arriba */
        #btn-top {
            position: fixed;
            bottom: 22px;
            right: 22px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            border: none;
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            z-index: 900;
            transition: var(--transition);
        }

        #btn-top:hover {
            transform: translateY(-3px);
            background: var(--primary-hover);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Optimización Móvil */
        @media (max-width: 768px) {
            header {
                padding: 12px 14px 8px;
            }
            h1 {
                font-size: 1.05rem;
            }
            .docs-links {
                flex-wrap: nowrap;
                overflow-x: auto;
                padding-bottom: 4px;
                scrollbar-width: none;
            }
            .docs-links::-webkit-scrollbar {
                display: none;
            }
            .docs-links a {
                white-space: nowrap;
                font-size: 0.78rem;
                padding: 5px 11px;
            }
            main {
                padding: 16px 12px 70px;
            }
            .esquema-toolbar {
                flex-direction: column;
            }
            .btn-action {
                width: 100%;
                padding: 14px 18px;
            }
            .card, .question-block {
                padding: 18px 16px;
                border-radius: 14px;
            }
            .option-label {
                padding: 14px 12px;
            }
            .score-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div id="scroll-progress"></div>

    <header>
        <div class="header-top">
            <div class="title-group">
                <span class="badge-tema">AGE · Tema 4</span>
                <h1>Poder Judicial, CGPJ, TS y MF</h1>
            </div>
            <button class="theme-toggle" id="theme-toggle" title="Cambiar tema claro/oscuro" aria-label="Cambiar tema">🌙</button>
        </div>

        <div class="docs-links">
            <a href="Tema_04.pdf" target="_blank">📄 Tema_04.pdf</a>
            <a href="Tema_04_DC_CGPJ_AspectosGenerales.pdf" target="_blank">⚖️ Esquema CGPJ</a>
            <a href="Tema_04_DC_MinisterioFiscal_Basico.pdf" target="_blank">🏛️ Esquema MF</a>
            <a href="Tema_04_Poder_Judicial_CGPJ_TS_Fiscal_claude.html" target="_blank" class="highlight-link">✨ Tema 04 Completo</a>
        </div>

        <div class="nav-wrapper">
            <nav id="main-nav"></nav>
        </div>
    </header>

    <main>
        <!-- SECCIÓN ESQUEMA -->
        <section id="tab-esquema">
            <div class="esquema-toolbar">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-esquema" placeholder="Filtrar preguntas del esquema (ej. CGPJ, 3/5, Fiscalía...)">
                </div>
                <button id="btn-leer" class="btn-action">🔊 Escuchar Tema</button>
            </div>
            <div id="esquema-container"></div>
        </section>

        <!-- SECCIÓN TEST -->
        <section id="tab-test" style="display:none;">
            <div class="test-header-card">
                <div class="test-header-top">
                    <h2 id="test-title">Test 1</h2>
                    <span class="progress-pill" id="answered-counter">0 / 20 respondidas</span>
                </div>
                <div class="test-progress-bar-bg">
                    <div class="test-progress-bar-fill" id="test-progress-fill"></div>
                </div>
            </div>

            <div id="score-top" class="score-card"></div>
            <div id="test-container"></div>
            <div id="score-bottom" class="score-card"></div>

            <button id="btn-corregir" class="btn-action btn-full" onclick="corregirTest()">✅ Corregir Examen</button>
            <button id="btn-reiniciar" class="btn-action btn-secondary btn-full" onclick="reiniciarTest()" style="display:none;">🔄 Reiniciar Test</button>
        </section>
    </main>

    <button id="btn-top" title="Volver arriba" aria-label="Volver arriba">↑</button>

    <script>
        // 1. ESQUEMA DE ESTUDIO (40 preguntas de estudio teórico)
        const esquemaPreguntas = [
            { pregunta: "1. ¿Qué principios rigen el Poder Judicial según la Constitución?", respuesta_detallada: "Independencia, inamovilidad, responsabilidad, sometimiento al imperio de la ley, unidad jurisdiccional, exclusividad, origen popular, gratuidad (según ley), oralidad y publicidad." },
            { pregunta: "2. ¿Quién administra la justicia en España?", respuesta_detallada: "Emana del pueblo y se administra en nombre del Rey por Jueces y Magistrados integrantes del poder judicial (Art. 117.1 CE)." },
            { pregunta: "3. ¿Qué es el Consejo General del Poder Judicial (CGPJ)?", respuesta_detallada: "Es el órgano de gobierno del Poder Judicial, integrado por el Presidente del TS y 20 vocales, con mandato de 5 años. Ejerce sus competencias en todo el territorio nacional." },
            { pregunta: "4. ¿Cómo se componen los 20 vocales del CGPJ?", respuesta_detallada: "12 entre Jueces y Magistrados (6 elegidos por el Congreso y 6 por el Senado) y 8 juristas de reconocida competencia con más de 15 años de ejercicio (4 por el Congreso y 4 por el Senado). Mayoría de 3/5 en ambas Cámaras." },
            { pregunta: "5. ¿Quién preside el CGPJ?", respuesta_detallada: "El Presidente del Tribunal Supremo, nombrado por el Rey a propuesta del CGPJ." },
            { pregunta: "6. ¿Cuáles son las comisiones del CGPJ?", respuesta_detallada: "Permanente, de Calificación, Disciplinaria, de Asuntos Económicos, de Igualdad, y de Supervisión y Control de Protección de Datos." },
            { pregunta: "7. ¿Cómo se compone la Comisión Permanente del CGPJ?", respuesta_detallada: "Presidente del TS y 7 Vocales (4 turno judicial, 3 turno juristas). Se renuevan anualmente. Prepara el Pleno y vela por la ejecución de sus acuerdos." },
            { pregunta: "8. ¿Cómo se compone la Comisión Disciplinaria del CGPJ?", respuesta_detallada: "7 Vocales (4 judiciales, 3 juristas). Mandato de 5 años. Resuelve expedientes por faltas graves y muy graves (salvo la separación del servicio, que es del Pleno)." },
            { pregunta: "9. ¿Quién es el Promotor de la Acción Disciplinaria?", respuesta_detallada: "Nombrado por el Pleno del CGPJ. Recibe quejas, inicia e instruye expedientes disciplinarios a jueces." },
            { pregunta: "10. ¿Qué función tiene el Pleno del CGPJ respecto al TC?", respuesta_detallada: "Propone el nombramiento, por mayoría de tres quintos, de 2 Magistrados del Tribunal Constitucional." },
            { pregunta: "11. ¿Cuáles son los órganos jurisdiccionales de ámbito nacional?", respuesta_detallada: "Tribunal Supremo, Audiencia Nacional y Tribunal Central de Instancia." },

            { pregunta: "13. ¿Qué conoce la Sala de lo Penal (Sala 2ª) del Tribunal Supremo?", respuesta_detallada: "Recursos de casación/revisión penal e instrucción/enjuiciamiento contra altas autoridades del Estado (Presidente Gobierno, Ministros, Diputados, Senadores, etc.)." },

            { pregunta: "17. ¿Qué es el Tribunal Central de Instancia?", respuesta_detallada: "Órgano nacional con sede en Madrid. Secciones: Instrucción, Penal, Menores, Vigilancia Penitenciaria y Contencioso-Administrativo. Apoya funcionalmente a la Audiencia Nacional." },

            { pregunta: "21. ¿Qué conoce una Audiencia Provincial en el orden penal?", respuesta_detallada: "Causas por delitos graves no atribuidos a Secciones Penales de Instancia. Recursos contra Secciones de Instrucción/Penal/Violencia Mujer/Menores de los Tribunales de Instancia." },
            { pregunta: "22. ¿Dónde existen los Tribunales de Instancia?", respuesta_detallada: "En cada partido judicial, con sede en su capital. Integrados por una Sección Única (Civil e Instrucción) o secciones separadas, y opcionalmente otras especializadas." },
            { pregunta: "23. ¿Qué son los Juzgados de Paz?", respuesta_detallada: "Órganos en municipios donde no exista Tribunal de Instancia. Nombrados por 4 años por el TSJ, previa elección por mayoría absoluta del Pleno del Ayuntamiento." },

            { pregunta: "25. ¿Qué misión fundamental tiene el Ministerio Fiscal (Art. 124 CE)?", respuesta_detallada: "Promover la acción de la justicia en defensa de la legalidad, derechos ciudadanos e interés público, velar por la independencia judicial y procurar la satisfacción del interés social." },
            { pregunta: "26. ¿Bajo qué principios actúa el Ministerio Fiscal?", respuesta_detallada: "Unidad de actuación y dependencia jerárquica, con sujeción en todo caso a los principios de legalidad e imparcialidad." },
            { pregunta: "27. ¿Quién nombra al Fiscal General del Estado?", respuesta_detallada: "El Rey, a propuesta del Gobierno, oído previamente el CGPJ. Se elige entre juristas españoles de reconocido prestigio con más de 15 años de ejercicio." },
            { pregunta: "28. ¿Cuánto dura el mandato del Fiscal General del Estado?", respuesta_detallada: "4 años. Cesa a petición propia, incompatibilidad, incapacidad, incumplimiento grave o cuando cese el Gobierno que lo propuso." },
            { pregunta: "29. ¿Cuáles son los órganos del Ministerio Fiscal?", respuesta_detallada: "Fiscal General del Estado, Consejo Fiscal, Junta de Fiscales de Sala, Junta de Fiscales Superiores CCAA, Fiscalías del TS, TC, AN, Especiales, CCAA, Provinciales y de Área." },
            { pregunta: "30. ¿Qué Sección obligatoria existe en la Fiscalía de la Audiencia Nacional y Provinciales?", respuesta_detallada: "Una Sección de Menores para funciones de Responsabilidad Penal de Menores." },
            { pregunta: "31. ¿Y en las Fiscalías Provinciales específicamente?", respuesta_detallada: "Sección contra la Violencia sobre la Mujer, Sección de Medio Ambiente, Sección de Menores y Sección contra delitos de odio." },
            { pregunta: "32. ¿Qué participación ciudadana existe en la Justicia según el art. 125 CE?", respuesta_detallada: "La acción popular, el Tribunal del Jurado en procesos penales, y los Tribunales consuetudinarios y tradicionales (ej. Tribunal de Aguas de Valencia)." },
            { pregunta: "33. ¿Qué indemnización prevé la Constitución por error judicial?", respuesta_detallada: "Los daños por error judicial o funcionamiento anormal de la Administración de Justicia darán derecho a indemnización a cargo del Estado, conforme a la ley (Art. 121 CE)." },
            { pregunta: "34. ¿A quién compete la Sección de Violencia sobre la Mujer en los Tribunales de Instancia?", respuesta_detallada: "Instrucción de delitos de violencia de género, adopción de órdenes de protección, quebrantamientos de condena, y ámbito civil exclusivo si concurren actuaciones penales." },
            { pregunta: "35. ¿Quién elabora el Presupuesto del CGPJ?", respuesta_detallada: "El CGPJ elabora y ejecuta su propio presupuesto. La Comisión Permanente o la de Asuntos Económicos elabora el borrador, y lo aprueba el Pleno." },
            { pregunta: "36. ¿Qué función ejerce el Vicepresidente del TS?", respuesta_detallada: "Sustituir al Presidente, prestarle colaboración, y ejercer sus funciones por delegación. Es elegido por mayoría de 3/5 por el Pleno del CGPJ." },
            { pregunta: "37. ¿Existe jurisdicción militar en tiempo de paz?", respuesta_detallada: "Sí. La ley regula el ejercicio de la jurisdicción militar en el ámbito estrictamente castrense y en supuestos de estado de sitio (Art. 117.5 CE)." },
            { pregunta: "38. ¿Qué papel tiene la Policía Judicial?", respuesta_detallada: "Depende de los Jueces, Tribunales y del Ministerio Fiscal en sus funciones de averiguación del delito y aseguramiento del delincuente (Art. 126 CE)." },
            { pregunta: "39. ¿Quién decide los conflictos de competencias entre la Fiscalía Europea y la nacional?", respuesta_detallada: "Decide definitivamente la persona titular de la Fiscalía General del Estado tras oír a la Junta de Fiscales de Sala." },
            { pregunta: "40. ¿Qué recurso cabe contra acuerdos de la Comisión Disciplinaria del CGPJ?", respuesta_detallada: "Recurso de alzada ante el Pleno en el plazo de un mes." }

                { pregunta: "El TSJ actúa como tribunal de casación cuando:", opciones: ["Se discute Derecho Común.", "Se fundamenta en Derecho Civil Foral o Especial propio de la CA.", "Es un tema laboral sin convenio colectivo.", "Siempre."], respuesta_correcta: 1, explicacion: "Recursos de casación que se funden en la infracción de Derecho Civil foral o especial de la CA." },
                { pregunta: "El Tribunal del Jurado (conciudadanos) se constituye en el ámbito de:", opciones: ["Audiencia Nacional.", "Audiencia Provincial.", "Tribunal Supremo.", "Tribunales de Instancia."], respuesta_correcta: 1, explicacion: "Regla general: se constituye en el ámbito de la Audiencia Provincial." },
                { pregunta: "¿Quién interpone un recurso de amparo ante el TC en defensa de un menor desvalido?", opciones: ["El CGPJ.", "El Rey.", "El Ministerio Fiscal.", "La policía local."], respuesta_correcta: 2, explicacion: "El MF interpone recurso de amparo en defensa de la legalidad." },
                { pregunta: "La Memoria Anual del CGPJ debate:", opciones: ["Estado, funcionamiento y actividades del CGPJ y Juzgados.", "Las sentencias del TC.", "Ley de presupuestos del Estado.", "Directivas europeas."], respuesta_correcta: 0, explicacion: "Memoria sobre el estado, funcionamiento y actividades del propio CGPJ y Tribunales." },
                { pregunta: "¿Qué competencia tiene la Sección de lo Penal del Tribunal Central de Instancia?", opciones: ["Tribunal del Jurado a nivel nacional.", "Juicios por delitos leves de tráfico en Madrid.", "Enjuiciar causas del art. 65 en los casos previstos, o ejecutar sentencias graves de Instrucción.", "Resolver casaciones."], respuesta_correcta: 2, explicacion: "Causas del art. 65 si proceden y ejecutar sentencias de Instrucción." }
            ]
        ];

        // --- TEMA OSCURO / CLARO ---
        const themeToggle = document.getElementById('theme-toggle');
        const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeToggle.textContent = '☀️';
        }

        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                themeToggle.textContent = '🌙';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                themeToggle.textContent = '☀️';
            }
        });

        // --- BARRA DE PROGRESO DE LECTURA Y BOTÓN SUBIR ---
        const scrollProgress = document.getElementById('scroll-progress');
        const btnTop = document.getElementById('btn-top');

        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
            scrollProgress.style.width = `${pct}%`;
            btnTop.style.display = scrollTop > 300 ? 'flex' : 'none';
        });

        btnTop.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // --- LÓGICA DE NAVEGACIÓN ---
        const tabEsquema = document.getElementById('tab-esquema');
        const tabTest = document.getElementById('tab-test');
        const mainNav = document.getElementById('main-nav');
        
        let testsNavHtml = `<button onclick="showTab('esquema')" class="active" id="nav-esquema">📚 Esquema de Estudio</button>`;
        for (let i = 0; i < examenes.length; i++) {
            testsNavHtml += `<button onclick="loadTest(${i})" id="nav-test-${i}">📝 Test ${i + 1}</button>`;
        }
        mainNav.innerHTML = testsNavHtml;

        // --- RENDER Y FILTRO DEL ESQUEMA ---
        const esquemaCont = document.getElementById('esquema-container');
        const searchInput = document.getElementById('search-esquema');

        function renderEsquema(filtro = '') {
            const termino = filtro.toLowerCase().trim();
            const filtradas = esquemaPreguntas.filter(item =>
                item.pregunta.toLowerCase().includes(termino) ||
                item.respuesta_detallada.toLowerCase().includes(termino)
            );

            if (filtradas.length === 0) {
                esquemaCont.innerHTML = `<div class="card"><p>No se encontraron resultados para "<strong>${filtro}</strong>".</p></div>`;
                return;
            }

            esquemaCont.innerHTML = filtradas.map(item => `
                <div class="card">
                    <h3>${item.pregunta}</h3>
                    <p>${item.respuesta_detallada}</p>
                </div>
            `).join('');
        }
        renderEsquema();

        searchInput.addEventListener('input', (e) => {
            renderEsquema(e.target.value);
        });

        // --- LECTURA POR VOZ (CON PLAY / STOP) ---
        let leyendo = false;
        const btnLeer = document.getElementById('btn-leer');

        btnLeer.addEventListener('click', () => {
            if (!('speechSynthesis' in window)) {
                alert("La síntesis de voz no está soportada en su navegador.");
                return;
            }

            if (leyendo) {
                window.speechSynthesis.cancel();
                leyendo = false;
                btnLeer.innerHTML = '🔊 Escuchar Tema';
                return;
            }

            window.speechSynthesis.cancel();
            const textoCompleto = esquemaPreguntas.map(q => `${q.pregunta}. ${q.respuesta_detallada}`).join(". Siguiente pregunta: ");
            const utterance = new SpeechSynthesisUtterance("Comenzando lectura del tema. " + textoCompleto);
            utterance.lang = 'es-ES';
            utterance.onend = () => {
                leyendo = false;
                btnLeer.innerHTML = '🔊 Escuchar Tema';
            };
            leyendo = true;
            btnLeer.innerHTML = '⏹️ Detener Lectura';
            window.speechSynthesis.speak(utterance);
        });

        function showTab(type) {
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            if (type === 'esquema') {
                document.getElementById('nav-esquema').classList.add('active');
                tabEsquema.style.display = 'block';
                tabTest.style.display = 'none';
            } else {
                tabEsquema.style.display = 'none';
                tabTest.style.display = 'block';
            }
        }

        // --- LÓGICA DE TESTS ---
        let currentTestIndex = 0;
        let testRespondido = false;

        function updateTestProgress() {
            const total = examenes[currentTestIndex].length;
            let respondidas = 0;
            for (let i = 0; i < total; i++) {
                const radios = document.getElementsByName(`q${i}`);
                for (let r of radios) {
                    if (r.checked) {
                        respondidas++;
                        break;
                    }
                }
            }
            document.getElementById('answered-counter').textContent = `${respondidas} / ${total} respondidas`;
            document.getElementById('test-progress-fill').style.width = `${(respondidas / total) * 100}%`;
        }

        function loadTest(index) {
            currentTestIndex = index;
            testRespondido = false;
            showTab('test');

            const activeNavBtn = document.getElementById(`nav-test-${index}`);
            activeNavBtn.classList.add('active');
            activeNavBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

            document.getElementById('test-title').innerText = `Test ${index + 1}`;
            document.getElementById('score-top').style.display = 'none';
            document.getElementById('score-bottom').style.display = 'none';
            document.getElementById('btn-corregir').style.display = 'flex';
            document.getElementById('btn-reiniciar').style.display = 'none';

            const testCont = document.getElementById('test-container');
            const testData = examenes[index];
            let html = '';

            testData.forEach((q, qIndex) => {
                html += `<div class="question-block" id="qblock-${qIndex}">`;
                html += `<div class="question-text">${qIndex + 1}. ${q.pregunta}</div>`;
                q.opciones.forEach((opt, optIndex) => {
                    html += `
                    <label class="option-label" id="label-${qIndex}-${optIndex}">
                        <input type="radio" name="q${qIndex}" value="${optIndex}" onchange="updateTestProgress()">
                        <span>${opt}</span>
                    </label>`;
                });
                html += `<div class="explanation-box" id="exp-${qIndex}">
                            <strong>✅ Respuesta correcta:</strong> ${q.opciones[q.respuesta_correcta]}<br>
                            <strong>💡 Motivo:</strong> ${q.explicacion}
                         </div>`;
                html += `</div>`;
            });
            testCont.innerHTML = html;
            updateTestProgress();
        }

        function buildScoreHTML(aciertos, errores, blancos, total) {
            const nota = Math.max(0, ((aciertos - errores * 0.33) / total) * 10).toFixed(2);
            return `
                <div class="score-grid">
                    <div class="score-item ok"><span class="num">${aciertos}</span><span class="lbl">Aciertos</span></div>
                    <div class="score-item err"><span class="num">${errores}</span><span class="lbl">Errores</span></div>
                    <div class="score-item"><span class="num">${blancos}</span><span class="lbl">Blancos</span></div>
                    <div class="score-item nota"><span class="num">${nota}</span><span class="lbl">Nota / 10</span></div>
                </div>
            `;
        }

        function corregirTest() {
            if (testRespondido) return;
            const testData = examenes[currentTestIndex];
            let aciertos = 0;
            let errores = 0;
            let blancos = 0;

            testData.forEach((q, qIndex) => {
                const options = document.getElementsByName(`q${qIndex}`);
                let selected = -1;
                options.forEach(opt => {
                    opt.disabled = true;
                    if (opt.checked) selected = parseInt(opt.value);
                });

                const correctIndex = q.respuesta_correcta;
                document.getElementById(`label-${qIndex}-${correctIndex}`).classList.add('correct');

                if (selected === correctIndex) {
                    aciertos++;
                } else {
                    if (selected !== -1) {
                        errores++;
                        document.getElementById(`label-${qIndex}-${selected}`).classList.add('incorrect');
                    } else {
                        blancos++;
                    }
                    document.getElementById(`exp-${qIndex}`).style.display = 'block';
                }
            });

            const scoreHTML = buildScoreHTML(aciertos, errores, blancos, testData.length);
            const scoreTop = document.getElementById('score-top');
            const scoreBottom = document.getElementById('score-bottom');
            
            scoreTop.innerHTML = scoreHTML;
            scoreBottom.innerHTML = scoreHTML;
            scoreTop.style.display = 'block';
            scoreBottom.style.display = 'block';
            
            document.getElementById('btn-corregir').style.display = 'none';
            document.getElementById('btn-reiniciar').style.display = 'flex';
            testRespondido = true;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function reiniciarTest() {
            loadTest(currentTestIndex);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>

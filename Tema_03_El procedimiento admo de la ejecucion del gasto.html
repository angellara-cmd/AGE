<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>AGE Studio · Procedimiento Administrativo del Gasto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f1f5f9;
            --bg-gradient: radial-gradient(circle at 15% 10%, rgba(79, 70, 229, 0.08) 0%, transparent 45%),
                           radial-gradient(circle at 85% 90%, rgba(14, 165, 233, 0.08) 0%, transparent 45%);
            --surface: #ffffff;
            --surface-glass: rgba(255, 255, 255, 0.85);
            --surface-subtle: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --accent: #0ea5e9;
            --border: #e2e8f0;
            --border-hover: #cbd5e1;
            --correct-bg: #ecfdf5;
            --correct-border: #10b981;
            --correct-text: #065f46;
            --incorrect-bg: #fef2f2;
            --incorrect-border: #ef4444;
            --incorrect-text: #991b1b;
            --explain-bg: #f0f9ff;
            --explain-border: #0284c7;
            --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
            --shadow-md: 0 4px 16px -2px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
            --shadow-lg: 0 12px 28px -4px rgba(79, 70, 229, 0.14);
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-pill: 9999px;
            --transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-body: #0b1120;
            --bg-gradient: radial-gradient(circle at 15% 10%, rgba(99, 102, 241, 0.14) 0%, transparent 45%),
                           radial-gradient(circle at 85% 90%, rgba(56, 189, 248, 0.10) 0%, transparent 45%);
            --surface: #1e293b;
            --surface-glass: rgba(15, 23, 42, 0.85);
            --surface-subtle: #0f172a;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --primary-light: rgba(99, 102, 241, 0.16);
            --border: #334155;
            --border-hover: #475569;
            --correct-bg: rgba(16, 185, 129, 0.15);
            --correct-border: #10b981;
            --correct-text: #6ee7b7;
            --incorrect-bg: rgba(239, 68, 68, 0.15);
            --incorrect-border: #ef4444;
            --incorrect-text: #fca5a5;
            --explain-bg: rgba(14, 165, 233, 0.12);
            --explain-border: #38bdf8;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px -2px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 12px 28px -4px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            line-height: 1.65;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* HEADER GLASSMORPHISM */
        header {
            background: var(--surface-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: var(--transition);
        }

        .header-inner {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0.75rem 1rem 0.5rem;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 0.65rem;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.05rem;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .brand-badge {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
        }

        .theme-toggle {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: var(--radius-pill);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .theme-toggle:hover {
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        /* DOCUMENT LINKS PILLS */
        .doc-links-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .doc-links-wrapper::-webkit-scrollbar {
            display: none;
        }

        .doc-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .doc-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .doc-pill:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
            transform: translateY(-1px);
        }

        .doc-pill.featured {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.1), rgba(14, 165, 233, 0.1));
            border-color: rgba(79, 70, 229, 0.35);
            color: var(--primary);
        }

        /* NAVIGATION TABS */
        nav {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding: 6px 0 8px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        nav::-webkit-scrollbar {
            display: none;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            white-space: nowrap;
            transition: var(--transition);
        }

        .nav-btn:hover {
            background: var(--surface);
            color: var(--text-primary);
            border-color: var(--border);
        }

        .nav-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.32);
        }

        /* MAIN CONTAINER */
        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 1.5rem 1rem 4rem;
        }

        .view-section {
            display: none;
            animation: fadeIn 0.3s ease forwards;
        }

        .view-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* TOOLBAR ESQUEMA */
        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        @media (min-width: 640px) {
            .toolbar {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }

        .search-box {
            position: relative;
            flex: 1;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
            pointer-events: none;
        }

        /* BUTTONS */
        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: #ffffff;
            border: none;
            padding: 12px 22px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
            width: 100%;
        }

        @media (min-width: 640px) {
            .action-btn {
                width: auto;
            }
        }

        .action-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(79, 70, 229, 0.35);
        }

        .action-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .action-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .action-btn.secondary {
            background: var(--surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .action-btn.secondary:hover:not(:disabled) {
            border-color: var(--text-secondary);
            background: var(--surface-subtle);
            box-shadow: var(--shadow-md);
        }

        /* CARDS */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 1.35rem;
            margin-bottom: 1.15rem;
            transition: var(--transition);
        }

        @media (min-width: 768px) {
            .card {
                padding: 1.65rem;
            }
        }

        .card:hover {
            border-color: var(--border-hover);
        }

        .card-header-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .q-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--primary);
            background: var(--primary-light);
            padding: 3px 10px;
            border-radius: var(--radius-pill);
        }

        .card-title {
            font-weight: 700;
            font-size: 1.06rem;
            line-height: 1.45;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        .card-answer {
            color: var(--text-secondary);
            font-size: 0.96rem;
        }

        .cite-tag {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--primary);
            background: var(--primary-light);
            padding: 1px 7px;
            border-radius: 6px;
            margin-left: 4px;
        }

        /* TEST PROGRESS BAR */
        .progress-wrapper {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            margin-bottom: 1.25rem;
            box-shadow: var(--shadow-sm);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: var(--bg-body);
            border-radius: var(--radius-pill);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: var(--radius-pill);
            transition: width 0.35s ease;
        }

        /* TEST OPTIONS */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 16px;
            background: var(--surface-subtle);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--text-primary);
            transition: var(--transition);
            user-select: none;
        }

        .option-label:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .option-label input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            min-width: 20px;
            border: 2px solid var(--text-muted);
            border-radius: 50%;
            margin-top: 2px;
            display: grid;
            place-content: center;
            transition: var(--transition);
        }

        .option-label input[type="radio"]::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            background-color: var(--primary);
        }

        .option-label input[type="radio"]:checked {
            border-color: var(--primary);
        }

        .option-label input[type="radio"]:checked::before {
            transform: scale(1);
        }

        .option-label:has(input:checked) {
            border-color: var(--primary);
            background: var(--primary-light);
            font-weight: 600;
        }

        .option-label.correct {
            background: var(--correct-bg) !important;
            color: var(--correct-text) !important;
            border-color: var(--correct-border) !important;
            font-weight: 600;
        }

        .option-label.incorrect {
            background: var(--incorrect-bg) !important;
            color: var(--incorrect-text) !important;
            border-color: var(--incorrect-border) !important;
        }

        /* EXPLANATION BOX */
        .explanation-box {
            background: var(--explain-bg);
            padding: 14px 16px;
            border-radius: var(--radius-md);
            margin-top: 14px;
            font-size: 0.92rem;
            color: var(--text-primary);
            border-left: 4px solid var(--explain-border);
            display: none;
            animation: fadeIn 0.25s ease;
        }

        /* SCORE BANNER */
        .score-display {
            font-size: 1.05rem;
            font-weight: 700;
            text-align: center;
            padding: 1.25rem;
            background: var(--surface);
            border: 2px solid var(--primary);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            margin-bottom: 1.25rem;
            display: none;
        }

        .score-grid {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .score-pill {
            padding: 4px 14px;
            border-radius: var(--radius-pill);
            font-size: 0.92rem;
        }

        .test-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            font-weight: 600;
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="top-bar">
            <div class="brand">
                <span class="brand-badge">AGE · TEMA 03</span>
                <span>Procedimiento del Gasto y Control</span>
            </div>
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Cambiar tema claro/oscuro" aria-label="Cambiar tema">
                🌙
            </button>
        </div>

        <div class="doc-links-wrapper">
            <span class="doc-label">Recursos:</span>
            <a href="Tema_03.pdf" target="_blank" class="doc-pill">📄 Tema_03.pdf</a>

        <nav id="mainNav" role="tablist">

</header>

<main>
    <!-- VISTA ESQUEMA -->
    <section id="esquemaView" class="view-section active">
        <div class="toolbar">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Filtrar preguntas o conceptos clave..." oninput="filtrarEsquema()">

<script>
    // DATOS: Esquema de Estudio (40 Preguntas/Respuestas)
    const esquemaPreguntas = [
        { p: "¿En qué consiste la ejecución del Presupuesto de gastos?", r: "Ejecutar el Presupuesto es realizar los gastos públicos en él autorizados. Constituye la utilización por la Administración de las autorizaciones que la Ley de Presupuestos le confiere." },
        { p: "¿Cuáles son las fases principales de la gestión del Presupuesto de gastos?", r: "Se realiza a través de cinco fases: a) Aprobación del gasto, b) Compromiso de gasto, c) Reconocimiento de la obligación, d) Ordenación del pago, y e) Pago material." },
        { p: "¿Qué órgano es competente para aprobar y comprometer gastos en los Departamentos Ministeriales?", r: "Corresponde a los Ministros y a los titulares de los demás órganos del Estado con dotaciones diferenciadas, salvo los casos reservados por la Ley al Consejo de Ministros." },
        { p: "¿Cuándo se requiere autorización previa del Consejo de Ministros para convenios o contratos-programa?", r: "Se necesita autorización cuando el importe del gasto que de aquellos se derive sea superior a doce millones de euros, con exclusión de los convenios de créditos gestionados por las Comunidades Autónomas." },
        { p: "¿Qué implica la aprobación del gasto (Fase A)?", r: "Es el acto mediante el cual se autoriza la realización de un gasto determinado por una cuantía cierta o aproximada, reservando a tal fin la totalidad o parte de un crédito presupuestario. No implica relaciones con terceros." },
        { p: "¿Qué caracteriza a la fase de Compromiso de gasto (Fase D)?", r: "Es el acto mediante el cual se acuerda la realización de gastos previamente aprobados. Tiene relevancia jurídica para con terceros, vinculando a la Hacienda Pública o a la Seguridad Social a realizar el gasto." },
        { p: "¿Qué supone el reconocimiento de la obligación (Fase OK)?", r: "Es el acto que declara la existencia de un crédito exigible contra la Hacienda Pública o la Seguridad Social, derivado de un gasto aprobado y comprometido. Lleva implícita la propuesta de pago." },
        { p: "¿Cuáles son las situaciones en las que puede encontrarse un crédito presupuestario?", r: "Los créditos pueden estar en tres situaciones: Créditos disponibles, Créditos no disponibles y Créditos retenidos." },
        { p: "¿Qué documento contable se utiliza para la retención de créditos por no disponibilidad?", r: "La Dirección General de Presupuestos expide un documento 'RC' de retención de créditos por no disponibilidad (RC-102)." },
        { p: "¿Qué documento contable ampara la autorización y compromiso en un solo acto?", r: "Cuando la autorización y el compromiso se acuerdan en un acto único, se expedirá un documento mixto 'AD'." },
        { p: "¿Qué documento se expide cuando se acumulan autorización, compromiso y reconocimiento de obligación?", r: "Se expedirá un documento mixto 'ADOK'." },
        { p: "¿Cómo se tramitan los gastos de retribuciones de personal fijo y vencimiento periódico al inicio del ejercicio?", r: "El Servicio gestor formulará un documento 'AD' por el importe que se prevea gastar durante dicho ejercicio, estimación que podrá efectuarse a partir de la nómina del mes de enero." },
        { p: "¿Qué documento se tramita al aprobar un expediente de expropiación forzosa para pagar a los expropiados?", r: "El Servicio gestor tramitará un pago a justificar mediante la expedición de un documento 'ADOK', para proceder al pago o depósito previo a la expedición del acta de ocupación." },
        { p: "¿Qué condición especial se incluye en el pliego de la tramitación anticipada de expedientes de contratación?", r: "Se hará constar que la adjudicación y formalización queda sometida a la condición suspensiva de existencia de crédito adecuado y suficiente para financiar las obligaciones en el ejercicio correspondiente." },
        { p: "¿Cuál es el límite temporal para los compromisos de gasto de carácter plurianual (regla general)?", r: "El número de ejercicios a que pueden aplicarse los gastos no será superior a cuatro ejercicios posteriores a aquel en que se autoricen." },
        { p: "¿Cuáles son los límites porcentuales para los gastos plurianuales según el artículo 47 de la LGP?", r: "El gasto no podrá exceder del 70% en el ejercicio inmediato siguiente, el 60% en el segundo ejercicio, y el 50% en los ejercicios tercero y cuarto." },
        { p: "¿En qué contratos de obra plurianual se efectúa una retención adicional del 10%?", r: "En los contratos de obra de carácter plurianual, con excepción de los realizados bajo la modalidad de abono total del precio, se efectuará una retención adicional (RC-108) del 10% del importe de adjudicación." },
        { p: "¿Qué supuestos excepcionan los límites porcentuales y de anualidades de los gastos plurianuales?", r: "Las limitaciones no serán de aplicación a los compromisos derivados de la carga financiera de la Deuda y de los arrendamientos de inmuebles." },
        { p: "¿Qué órgano puede autorizar la modificación de los porcentajes o incremento de anualidades en gastos plurianuales?", r: "El Gobierno, en casos especialmente justificados, mediante acuerdo del Consejo de Ministros a propuesta del Ministro de Hacienda." },
        { p: "¿A quién compete la función de Ordenador general de pagos del Estado?", r: "Bajo la superior autoridad del Ministro de Economía, Comercio y Empresa, compete al Director General del Tesoro y Política Financiera." },
        { p: "¿Cómo se materializa ordinariamente el pago de las obligaciones del Estado?", r: "El pago se efectuará mediante transferencia bancaria contra la cuenta del Tesoro en el Banco de España o Entidad autorizada. Excepcionalmente, el Director General del Tesoro podrá autorizar el pago mediante cheque nominativo no a la orden para personas físicas." },
        { p: "¿Qué institución centraliza las cuentas de situación de fondos de la Administración General del Estado?", r: "Con carácter general, los ingresos y pagos se canalizarán a través de la cuenta o cuentas que se mantengan en el Banco de España." },
        { p: "¿Cuáles son los objetivos principales del control interno del gasto público?", r: "Verificar el cumplimiento normativo, el adecuado registro contable, evaluar la buena gestión financiera conforme a la Ley Orgánica de Estabilidad Presupuestaria, y verificar el cumplimiento de objetivos de los centros gestores." },
        { p: "¿Qué órgano ejerce el control interno en el sector público estatal?", r: "El control interno será realizado por la Intervención General de la Administración del Estado (IGAE), actuando con autonomía, ejercicio desconcentrado y jerarquía interna." },
        { p: "¿En qué modalidades se ejerce la función interventora?", r: "Se ejerce en sus modalidades de intervención formal (verificación del cumplimiento de requisitos legales y documentales) y material (comprobación de la real y efectiva aplicación de los fondos públicos)." },
        { p: "¿Qué tipos de gastos están exentos de fiscalización previa?", r: "Contratos menores, gastos periódicos de tracto sucesivo (tras el inicial), gastos < 5.000€ por anticipo de caja fija, procesos electorales, subvenciones nominativas, contratos de acceso a bases de datos y gastos excepcionales de emergencia." },
        { p: "¿Qué efecto tiene la formulación de un reparo por la Intervención?", r: "Si el reparo se basa en insuficiencia de crédito, órgano incompetente, graves irregularidades documentales, comprobación material o trámites esenciales omitidos, suspenderá la tramitación del expediente hasta que sea solventado." },
        { p: "¿Quién resuelve las discrepancias si un órgano gestor no acepta un reparo de una Intervención Delegada?", r: "Corresponderá a la Intervención General de la Administración del Estado (IGAE) conocer la discrepancia, siendo su resolución obligatoria." },
        { p: "¿Cuál es el plazo de la Intervención para fiscalizar un expediente?", r: "El plazo máximo es de 10 días contados desde el siguiente a la recepción del expediente completo. Se reducirá a 5 días si se ha declarado urgente la tramitación." },
        { p: "¿A partir de qué importe es preceptivo solicitar representante de la IGAE para la comprobación material de la inversión?", r: "Cuando el importe de la inversión sea igual o superior a 50.000 euros, con exclusión del Impuesto sobre el Valor Añadido (IVA) o impuesto equivalente." },
        { p: "¿Cuál es el plazo para solicitar representante de la IGAE para la comprobación material?", r: "Con una antelación de 30 días hábiles a la fecha prevista para la terminación de la prestación. Si es fuera de España, el plazo será de 45 días hábiles." },
        { p: "¿Qué debe hacer la Intervención en la intervención formal de la ordenación del pago?", r: "Verificar que las órdenes de pago se dictan por órgano competente, se ajustan al acto de reconocimiento de la obligación y se acomodan al plan de disposición de fondos." },
        { p: "¿Sobre quiénes se ejerce el control financiero permanente?", r: "Sobre la AGE, organismos autónomos, entidades públicas empresariales, autoridades administrativas independientes, entidades gestoras de la Seguridad Social, y mutuas colaboradoras." },
        { p: "¿Qué órgano tiene atribuido el control externo del sector público estatal?", r: "Corresponde al Tribunal de Cuentas, como supremo órgano fiscalizador de las cuentas y de la gestión económica del Estado." },
        { p: "¿Cómo está compuesto el Pleno del Tribunal de Cuentas?", r: "Se integra por 12 Consejeros de Cuentas (seis por el Congreso y seis por el Senado con mayoría de 3/5), uno de los cuales será el Presidente, y además el Fiscal." },
        { p: "¿Quién elige al Presidente del Tribunal de Cuentas y por cuánto tiempo?", r: "Es nombrado de entre los miembros del Tribunal, por el Rey, a propuesta del Tribunal en Pleno para un período de tres años." },
        { p: "¿Qué es la responsabilidad contable directa según la Ley Orgánica 2/1982?", r: "Afecta a quienes hayan ejecutado, forzado o inducido a ejecutar los hechos, o participado posteriormente para ocultarlos. Es siempre solidaria respecto a todos los perjuicios." },
        { p: "¿Qué es el alcance en el ámbito de la jurisdicción contable?", r: "A efectos de responsabilidad contable se entiende por alcance el saldo deudor injustificado de una cuenta o la ausencia de numerario." },
        { p: "¿Quién ostenta el control político o parlamentario del presupuesto?", r: "Las Cortes Generales, mediante la aprobación de los Presupuestos, modificaciones de crédito durante el ejercicio y la aprobación de la Cuenta General del Estado." },
        { p: "¿Qué es la auditoría pública y qué formas adopta?", r: "Es la verificación sistemática y posterior de la actividad. Adopta formas de auditoría de regularidad contable, de cumplimiento y operativa." }

    let currentTestIndex = -1;

    let isSpeaking = false;

    // Inicialización
    document.addEventListener("DOMContentLoaded", () => {
        initTheme();
        const nav = document.getElementById('mainNav');
        for (let i = 0; i < examenes.length; i++) {
            const btn = document.createElement('button');
            btn.className = 'nav-btn';
            btn.innerText = `Test ${i + 1}`;
            btn.onclick = () => switchTab(i);
            nav.appendChild(btn);
        }
        renderEsquema();
    });

    // Tema Claro / Oscuro
    function initTheme() {
        const saved = localStorage.getItem('age_theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.getElementById('themeToggle').innerText = '☀️';
        }
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('age_theme', next);
        document.getElementById('themeToggle').innerText = next === 'dark' ? '☀️' : '🌙';
    }

    // Navegación entre pestañas
    function switchTab(index) {
        currentTestIndex = index;
        const buttons = document.querySelectorAll('.nav-btn');
        buttons.forEach((btn, i) => {
            btn.classList.toggle('active', i - 1 === index);
            if (i - 1 === index) {
                btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        });

        detenerAudio();

        if (index === -1) {
            document.getElementById('esquemaView').classList.add('active');
            document.getElementById('testView').classList.remove('active');
        } else {
            document.getElementById('esquemaView').classList.remove('active');
            document.getElementById('testView').classList.add('active');
            renderTest(index);
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Renderizado y filtrado del Esquema
    function renderEsquema(filtro = '') {
        const container = document.getElementById('esquemaContainer');
        container.innerHTML = '';
        const term = filtro.toLowerCase().trim();

        const filtradas = esquemaPreguntas
            .map((item, idx) => ({ ...item, num: idx + 1 }))
            .filter(item => !term || item.p.toLowerCase().includes(term) || item.r.toLowerCase().includes(term));

        if (filtradas.length === 0) {
            container.innerHTML = `<div class="empty-state">No se encontraron resultados para "${filtro}"</div>`;
            return;
        }

        filtradas.forEach(q => {
            const div = document.createElement('div');
            div.className = 'card';
            const formattedResp = q.r.replace(/\[cite:\s*[0-9,\s]+\]/g, match => `<span class="cite-tag">${match}</span>`);
            div.innerHTML = `
                <div class="card-header-meta">
                    <span class="q-badge">Concepto #${q.num}</span>
                </div>
                <div class="card-title">${q.p}</div>
                <div class="card-answer">${formattedResp}</div>
            `;
            container.appendChild(div);
        });
    }

    function filtrarEsquema() {
        const val = document.getElementById('searchInput').value;
        renderEsquema(val);
    }

    // Lectura por voz con control de estado
    function escucharTema() {
        if (!('speechSynthesis' in window)) {
            alert("Tu navegador no soporta lectura por voz.");
            return;
        }

        if (isSpeaking) {
            detenerAudio();
            return;
        }

        window.speechSynthesis.cancel();
        const textToSpeak = esquemaPreguntas
            .map(q => "Pregunta. " + q.p + ". Respuesta. " + q.r.replace(/\[cite:[^\]]+\]/g, ''))
            .join(". ");

        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'es-ES';
        utterance.rate = 1.02;

        utterance.onstart = () => {
            isSpeaking = true;
            document.getElementById('btnEscuchar').innerHTML = '⏹️ Detener Lectura';
        };
        utterance.onend = () => detenerAudio();
        utterance.onerror = () => detenerAudio();

        window.speechSynthesis.speak(utterance);
    }

    function detenerAudio() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }
        isSpeaking = false;
        const btn = document.getElementById('btnEscuchar');
        if (btn) btn.innerHTML = '🔊 Escuchar Tema';
    }

    // Renderizado del Test
    function renderTest(index) {
        const container = document.getElementById('testContainer');
        container.innerHTML = '';
        const total = examenes[index].length;
        testRespuestas = new Array(total).fill(null);

        document.getElementById('testTitleLabel').innerText = `Test ${index + 1}`;
        actualizarProgreso();

        document.getElementById('scoreTop').style.display = 'none';
        document.getElementById('scoreBottom').style.display = 'none';
        document.getElementById('btnCorregir').disabled = false;

        examenes[index].forEach((q, qIndex) => {
            const card = document.createElement('div');
            card.className = 'card';

            let htmlOptions = '';
            q.o.forEach((opt, optIndex) => {
                htmlOptions += `
                    <label class="option-label" id="label_t${index}_q${qIndex}_o${optIndex}">
                        <input type="radio" name="test${index}_q${qIndex}" value="${optIndex}" onchange="seleccionarRespuesta(${qIndex}, ${optIndex})">
                        <span>${opt}</span>
                    </label>
                `;
            });

            const formattedExp = q.e.replace(/\[cite:\s*[0-9,\s]+\]/g, match => `<span class="cite-tag">${match}</span>`);

            card.innerHTML = `
                <div class="card-header-meta">
                    <span class="q-badge">Pregunta ${qIndex + 1} de ${total}</span>
                </div>
                <div class="card-title">${q.p}</div>
                <div class="options-container">${htmlOptions}</div>
                <div class="explanation-box" id="explain_t${index}_q${qIndex}">
                    <strong>💡 Explicación:</strong> ${formattedExp}<br>
                    <strong>✅ Respuesta correcta:</strong> ${q.o[q.c]}
                </div>
            `;
            container.appendChild(card);
        });
    }

    function actualizarProgreso() {
        const total = testRespuestas.length;
        const respondidas = testRespuestas.filter(r => r !== null).length;
        const pct = total > 0 ? Math.round((respondidas / total) * 100) : 0;
        document.getElementById('progressText').innerText = `${respondidas} / ${total} respondidas (${pct}%)`;
        document.getElementById('progressFill').style.width = `${pct}%`;
    }

    window.seleccionarRespuesta = function(qIndex, optIndex) {
        testRespuestas[qIndex] = optIndex;
        actualizarProgreso();
    };

    window.corregirExamen = function() {
        if (currentTestIndex === -1) return;
        const test = examenes[currentTestIndex];
        let correctas = 0;
        let errores = 0;
        let noContestadas = 0;

        test.forEach((q, qIndex) => {
            const inputs = document.getElementsByName(`test${currentTestIndex}_q${qIndex}`);
            inputs.forEach(input => input.disabled = true);

            const respuestaUsuario = testRespuestas[qIndex];
            const labelCorrecta = document.getElementById(`label_t${currentTestIndex}_q${qIndex}_o${q.c}`);
            labelCorrecta.classList.add('correct');

            if (respuestaUsuario === null) {
                noContestadas++;
                document.getElementById(`explain_t${currentTestIndex}_q${qIndex}`).style.display = 'block';
            } else if (respuestaUsuario === q.c) {
                correctas++;
            } else {
                errores++;
                const labelError = document.getElementById(`label_t${currentTestIndex}_q${qIndex}_o${respuestaUsuario}`);
                labelError.classList.add('incorrect');
                document.getElementById(`explain_t${currentTestIndex}_q${qIndex}`).style.display = 'block';
            }
        });

        document.getElementById('btnCorregir').disabled = true;

        const nota = ((correctas / test.length) * 10).toFixed(2);
        const msj = `
            <div>Resultado del Test ${currentTestIndex + 1} · Nota: <span style="color:var(--primary); font-size:1.25rem;">${nota} / 10</span></div>
            <div class="score-grid">
                <span class="score-pill" style="background:var(--correct-bg); color:var(--correct-text);">✅ Aciertos: ${correctas}</span>
                <span class="score-pill" style="background:var(--incorrect-bg); color:var(--incorrect-text);">❌ Errores: ${errores}</span>
                <span class="score-pill" style="background:var(--surface-subtle); color:var(--text-secondary);">⚪ Sin contestar: ${noContestadas}</span>
            </div>
        `;

        document.getElementById('scoreTop').innerHTML = msj;
        document.getElementById('scoreTop').style.display = 'block';
        document.getElementById('scoreBottom').innerHTML = msj;
        document.getElementById('scoreBottom').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.reiniciarExamen = function() {
        if (currentTestIndex !== -1) {
            renderTest(currentTestIndex);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    };
</script>

</body>
</html>

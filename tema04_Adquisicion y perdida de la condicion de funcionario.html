<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Estudio AGE: Adquisición, Pérdida y Situaciones Administrativas</title>
    <!-- Fuente moderna Plus Jakarta Sans e Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Paleta Clara (Por defecto) */
            --bg-body: #f1f5f9;
            --bg-surface: #ffffff;
            --bg-surface-hover: #f8fafc;
            --bg-glass: rgba(255, 255, 255, 0.85);
            --text-main: #0f172a;
            --text-muted: #475569;
            
            /* Acentos Modernos (Índigo / Violeta) */
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --gradient-hero: linear-gradient(135deg, #312e81 0%, #4f46e5 50%, #0284c7 100%);
            
            /* Estados Semánticos */
            --success-bg: #dcfce7;
            --success-border: #22c55e;
            --success-text: #14532d;
            
            --error-bg: #fee2e2;
            --error-border: #ef4444;
            --error-text: #7f1d1d;
            
            --info-bg: #eff6ff;
            --info-border: #3b82f6;
            --info-text: #1e3a8a;

            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 10px 25px -5px rgba(79, 70, 229, 0.15);
            --radius-lg: 16px;
            --radius-md: 12px;
        }

        [data-theme="dark"] {
            /* Paleta Oscura */
            --bg-body: #0b1120;
            --bg-surface: #1e293b;
            --bg-surface-hover: #263349;
            --bg-glass: rgba(15, 23, 42, 0.85);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --primary-light: rgba(99, 102, 241, 0.15);
            --gradient-hero: linear-gradient(135deg, #1e1b4b 0%, #3730a3 50%, #0369a1 100%);
            
            --success-bg: rgba(34, 197, 94, 0.15);
            --success-border: #22c55e;
            --success-text: #86efac;
            
            --error-bg: rgba(239, 68, 68, 0.15);
            --error-border: #ef4444;
            --error-text: #fca5a5;
            
            --info-bg: rgba(59, 130, 246, 0.15);
            --info-border: #3b82f6;
            --info-text: #93c5fd;

            --border-color: #334155;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            font-size: 16px;
            line-height: 1.65;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* --- HERO HEADER --- */
        header {
            background: var(--gradient-hero);
            color: #ffffff;
            padding: 28px 20px 32px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header-top-bar {
            max-width: 960px;
            margin: 0 auto 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge-tag {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            padding: 5px 12px;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: transform 0.2s, background 0.2s;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        header h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0 auto 8px;
            font-size: clamp(1.4rem, 4vw, 2.1rem);
            font-weight: 800;
            line-height: 1.25;
            max-width: 800px;
            letter-spacing: -0.02em;
        }

        header p {
            margin: 0 0 18px;
            font-size: 0.9rem;
            opacity: 0.85;
        }

        .header-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-width: 900px;
            margin: 0 auto;
        }

        .doc-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(10px);
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 99px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: all 0.2s ease;
        }

        .doc-pill:hover {
            background: #ffffff;
            color: #312e81;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        }

        /* --- STICKY GLASS NAVIGATION --- */
        .sticky-nav-wrapper {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .sticky-nav {
            max-width: 960px;
            margin: 0 auto;
            padding: 12px 16px;
            display: flex;
            overflow-x: auto;
            gap: 8px;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none;  /* IE/Edge */
        }

        .sticky-nav::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .nav-btn {
            background: var(--bg-surface);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 9px 18px;
            border-radius: 99px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
        }

        .nav-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .nav-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        main {
            padding: 24px 16px 60px;
            max-width: 880px;
            margin: 0 auto;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.35s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- BARRA DE HERRAMIENTAS / BUSCADOR EN ESQUEMA --- */
        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        @media (min-width: 640px) {
            .toolbar {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }

        .search-box {
            position: relative;
            flex: 1;
        }

        .search-box input {
            width: 100%;
            padding: 13px 16px 13px 42px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--bg-surface);
            color: var(--text-main);
            font-size: 0.95rem;
            font-family: inherit;
            box-shadow: var(--shadow-sm);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* --- TARJETAS (CARDS) --- */
        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            border-radius: var(--radius-lg);
            padding: 22px;
            margin-bottom: 18px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .q-badge {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .card h3 {
            margin: 0 0 10px 0;
            font-size: 1.08rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.4;
        }

        .card p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.98rem;
        }

        /* --- BOTONES --- */
        .btn {
            background: var(--primary);
            color: #ffffff;
            padding: 13px 22px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
            width: 100%;
        }

        .btn:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-audio {
            background: #0d9488;
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
        }

        .btn-audio:hover:not(:disabled) {
            background: #0f766e;
            box-shadow: 0 6px 16px rgba(13, 148, 136, 0.35);
        }

        .btn-audio.speaking {
            background: #e11d48;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(225, 29, 72, 0); }
            100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
        }

        .btn-danger {
            background: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
            box-shadow: none;
        }

        .btn-danger:hover:not(:disabled) {
            background: #ef4444;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        }

        @media (min-width: 640px) {
            .btn {
                width: auto;
            }
        }

        /* --- ESTILOS DE TEST --- */
        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .test-header h2 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            font-size: 1.5rem;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 22px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .test-option {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
            padding: 14px 16px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            background: var(--bg-surface);
            transition: all 0.15s ease;
            user-select: none;
        }

        .test-option:hover {
            background: var(--bg-surface-hover);
            border-color: var(--primary);
        }

        .test-option:has(input:checked) {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .test-option input[type="radio"] {
            margin-top: 3px;
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .test-option span {
            font-size: 0.96rem;
            color: var(--text-main);
        }

        .correct {
            background-color: var(--success-bg) !important;
            border-color: var(--success-border) !important;
        }
        .correct span {
            color: var(--success-text) !important;
            font-weight: 600;
        }

        .incorrect {
            background-color: var(--error-bg) !important;
            border-color: var(--error-border) !important;
        }
        .incorrect span {
            color: var(--error-text) !important;
            font-weight: 600;
        }

        .explanation {
            background-color: var(--info-bg);
            color: var(--info-text);
            padding: 16px;
            border-left: 4px solid var(--info-border);
            border-radius: 8px;
            margin-top: 14px;
            font-size: 0.92rem;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .explanation strong {
            display: block;
            margin-bottom: 4px;
        }

        /* --- PANEL DE RESULTADOS (SCORE) --- */
        .score-display {
            background: var(--bg-surface);
            border: 2px solid var(--primary);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin: 24px 0;
            text-align: center;
            box-shadow: var(--shadow-lg);
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .score-nota {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .score-pills {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }

        .pill-stat {
            padding: 6px 14px;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .pill-ok { background: var(--success-bg); color: var(--success-text); }
        .pill-err { background: var(--error-bg); color: var(--error-text); }
        .pill-blank { background: var(--bg-body); color: var(--text-muted); border: 1px solid var(--border-color); }

        .flex-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 24px;
        }

        @media (min-width: 640px) {
            .flex-buttons {
                flex-direction: row;
                justify-content: center;
            }
        }
    </style>
</head>

    <header>

        <div class="header-links">

    <script>
        // --- 0. GESTIÓN DE TEMA CLARO / OSCURO ---
        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('themeBtn');
            const isDark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', isDark ? 'light' : 'dark');
            btn.textContent = isDark ? '🌙' : '☀️';
            localStorage.setItem('age_theme', isDark ? 'light' : 'dark');
        }

        (function initTheme() {
            const saved = localStorage.getItem('age_theme');
            if (saved === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                window.addEventListener('DOMContentLoaded', () => {
                    const btn = document.getElementById('themeBtn');
                    if (btn) btn.textContent = '☀️';
                });
            }
        })();

        // --- 1. DATOS: ESQUEMA DE ESTUDIO (40 Preguntas Detalladas) ---
        const esquemaPreguntas = [
            { pregunta: "¿Cuáles son los requisitos sucesivos para adquirir la condición de funcionario de carrera?", respuesta_detallada: "1. Superación del proceso selectivo. 2. Nombramiento por órgano o autoridad competente publicado en Diario Oficial. 3. Acto de acatamiento de la Constitución/Estatuto. 4. Toma de posesión en plazo." },
            { pregunta: "¿Cuál es el plazo de toma de posesión en la Administración del Estado?", respuesta_detallada: "El plazo es de 15 días naturales desde la publicación del nombramiento. Será de un mes cuando suponga cambio de localidad de residencia." },
            { pregunta: "¿Qué autoridades son competentes para dar posesión en la Administración del Estado?", respuesta_detallada: "Los Subsecretarios de los Ministerios (Servicios Centrales y Organismos Autónomos) y los Delegados del Gobierno (servicios periféricos regionales y provinciales)." },
            { pregunta: "¿Qué ocurre si no se acreditan los requisitos exigidos tras superar el proceso selectivo?", respuesta_detallada: "No podrán ser funcionarios y quedarán sin efecto las actuaciones relativas a quienes no acrediten dichos requisitos y condiciones." },
            { pregunta: "¿Cuáles son las causas de pérdida de la condición de funcionario?", respuesta_detallada: "a) Renuncia. b) Pérdida de nacionalidad. c) Jubilación total. d) Separación del servicio firme. e) Pena principal o accesoria de inhabilitación absoluta o especial firme." },
            { pregunta: "¿Qué tipos de jubilación existen para los funcionarios?", respuesta_detallada: "Voluntaria (a solicitud), Forzosa (al cumplir la edad legal) y Por declaración de incapacidad permanente para el ejercicio de sus funciones (absoluta o total)." },
            { pregunta: "¿A qué edad se declara la jubilación forzosa y hasta cuándo se puede prolongar?", respuesta_detallada: "Se declara de oficio a los 65 años. Se puede solicitar prolongar voluntariamente la permanencia en servicio activo como máximo hasta cumplir los 70 años." },
            { pregunta: "¿Cuál es el procedimiento y plazos para solicitar la prolongación en el servicio activo?", respuesta_detallada: "Solicitud con mínimo 2 meses de antelación a cumplir la edad. Resolución en 1 mes. Si faltan 15 días para la edad sin resolución, el silencio es positivo (estimatorio)." },
            { pregunta: "¿Cuáles son los requisitos de la jubilación voluntaria en Clases Pasivas?", respuesta_detallada: "Tener cumplidos 60 años de edad y tener reconocidos 30 años de servicios efectivos al Estado." },
            { pregunta: "¿En qué consiste la jubilación voluntaria incentivada?", respuesta_detallada: "Para afectados por reasignación (en expectativa de destino o excedencia forzosa). Requiere 60 años y 30 de servicios. Da derecho a indemnización fijada por el Gobierno y retribuciones de la última mensualidad por año." },
            { pregunta: "¿Qué órganos acuerdan los distintos tipos de jubilación?", respuesta_detallada: "Forzosa e Incapacidad: Subsecretario o Delegado del Gobierno. Voluntaria: Subsecretario (o Director General de Función Pública). Incentivada: Ministerio competente en función pública." },
            { pregunta: "¿En qué casos NO puede ser aceptada la renuncia a la condición de funcionario?", respuesta_detallada: "Cuando el funcionario esté sujeto a expediente disciplinario o haya sido dictado en su contra auto de procesamiento o de apertura de juicio oral." },
            { pregunta: "¿Cuál es el plazo de resolución de la renuncia y el efecto del silencio?", respuesta_detallada: "El plazo de resolución es de 2 meses. El silencio administrativo tiene efectos estimatorios." },
            { pregunta: "¿Qué ocurre en caso de recuperación de la nacionalidad perdida?", respuesta_detallada: "El interesado podrá solicitar la rehabilitación de su condición de funcionario, que le será concedida (es obligatoria)." },
            { pregunta: "¿Qué supone la sanción de separación del servicio?", respuesta_detallada: "Se impone por falta muy grave. Tiene carácter definitivo, sin que quepa posibilidad de nuevo ingreso en las Administraciones bajo el TREBEP." },
            { pregunta: "¿Qué diferencia la inhabilitación absoluta de la especial respecto a la pérdida de condición?", respuesta_detallada: "La absoluta produce la pérdida respecto a TODOS los empleos o cargos. La especial produce la pérdida respecto a los empleos ESPECIFICADOS en la sentencia." },
            { pregunta: "¿Es obligatoria la rehabilitación por cumplimiento de inhabilitación penal?", respuesta_detallada: "No. Se concede con carácter excepcional a petición del interesado. El silencio administrativo es desestimatorio." },
            { pregunta: "¿Cuál es la duración del procedimiento de rehabilitación y quién lo resuelve (inhabilitación)?", respuesta_detallada: "Dura 6 meses. En caso de inhabilitación judicial resuelve el Consejo de Ministros (instruye Secretaría Estado Función Pública)." },
            { pregunta: "¿Cuáles son las situaciones administrativas según el TREBEP (art. 85)?", respuesta_detallada: "Servicio activo, Servicios especiales, Servicio en otras AAPP, Excedencia, y Suspensión de funciones." },
            { pregunta: "¿Qué otras situaciones administrativas específicas regula la Ley 30/1984 para el Estado?", respuesta_detallada: "Expectativa de destino, Excedencia forzosa, Excedencia voluntaria incentivada, y Excedencia voluntaria por prestar servicios en el sector público." },
            { pregunta: "¿Menciona al menos 3 supuestos de Servicio Activo (además del ordinario)?", respuesta_detallada: "1. Comisión de servicios. 2. Dos primeras fases de reasignación de efectivos. 3. Cese en puesto obtenido por provisión, durante plazo posesorio." },

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

            let testPreguntas = [];
            let pool = shuffle([...rawBanco]); 
            for (let j = 0; j < 20; j++) {
                testPreguntas.push(Object.assign({}, pool[j % pool.length])); 
            }
            examenes.push(testPreguntas.map(q => ({
                pregunta: q.p,
                opciones: q.o,
                respuesta_correcta: q.c,
                explicacion: q.e
            })));
        }

                    <div class="card test-q-card" id="card_t${testIndex}_q${qIndex}">
                        <span class="q-badge">Pregunta ${qIndex + 1} de 20</span>
                        <h3>${item.pregunta}</h3>`;
                item.opciones.forEach((opt, optIndex) => {
                    html += `
                        <label class="test-option" id="lbl_t${testIndex}_q${qIndex}_o${optIndex}">
                            <input type="radio" name="t${testIndex}_q${qIndex}" value="${optIndex}" onchange="updateProgress(${testIndex})">
                            <span>${opt}</span>
                        </label>`;
                });
                html += `
                        <div class="explanation" id="exp_t${testIndex}_q${qIndex}">
                            <strong>💡 Justificación normativa:</strong> ${item.explicacion}<br><br>
                            <strong>✅ Respuesta correcta:</strong> ${item.opciones[item.respuesta_correcta]}
                        </div>
                    </div>`;
            });

            html += `
                <div class="flex-buttons">
                    <button type="button" class="btn" id="btn_corr_${testIndex}" onclick="corregir(${testIndex})">✔️ Corregir Examen</button>
                    <button type="button" class="btn btn-danger" onclick="reiniciar(${testIndex})">🔄 Reiniciar Test</button>
                </div>
            </form>`;
            
            html += `<div class="score-display" id="score_bot_${testIndex}"></div>`;
            html += `</div>`;
            
            main.insertAdjacentHTML('beforeend', html);
        }

        function updateProgress(testIndex) {
            let respondidas = 0;
            for (let q = 0; q < 20; q++) {
                const radios = document.getElementsByName(`t${testIndex}_q${q}`);
                for (let r of radios) {
                    if (r.checked) { respondidas++; break; }
                }
            }
            const pct = (respondidas / 20) * 100;
            document.getElementById(`prog_t${testIndex}`).style.width = `${pct}%`;
            document.getElementById(`count_t${testIndex}`).textContent = `${respondidas} / 20 respondidas`;
        }

        function corregir(testIndex) {
            const test = examenes[testIndex];
            let aciertos = 0;
            let errores = 0;
            let blancos = 0;

            document.getElementById(`btn_corr_${testIndex}`).disabled = true;

            test.forEach((q, qIndex) => {
                const radios = document.getElementsByName(`t${testIndex}_q${qIndex}`);
                let seleccion = -1;
                radios.forEach(r => {
                    r.disabled = true;
                    if (r.checked) seleccion = parseInt(r.value);
                });

                const correcta = q.respuesta_correcta;

                for (let i = 0; i < 4; i++) {
                    document.getElementById(`lbl_t${testIndex}_q${qIndex}_o${i}`).classList.remove('correct', 'incorrect');
                }

                if (seleccion === correcta) {
                    aciertos++;
                    document.getElementById(`lbl_t${testIndex}_q${qIndex}_o${seleccion}`).classList.add('correct');
                } else if (seleccion === -1) {
                    blancos++;
                    document.getElementById(`lbl_t${testIndex}_q${qIndex}_o${correcta}`).classList.add('correct');
                    document.getElementById(`exp_t${testIndex}_q${qIndex}`).style.display = 'block';
                } else {
                    errores++;
                    document.getElementById(`lbl_t${testIndex}_q${qIndex}_o${seleccion}`).classList.add('incorrect');
                    document.getElementById(`lbl_t${testIndex}_q${qIndex}_o${correcta}`).classList.add('correct');
                    document.getElementById(`exp_t${testIndex}_q${qIndex}`).style.display = 'block';
                }
            });

            // Cálculo de nota sobre 10 (penalización estándar 1/3)
            const notaNeta = Math.max(0, ((aciertos - (errores / 3)) / 20) * 10).toFixed(2);

            const scoreHTML = `
                <div class="score-nota">Nota: ${notaNeta} / 10</div>
                <div style="font-size: 0.85rem; color: var(--text-muted);">Penalización aplicada: cada 3 errores restan 1 acierto</div>
                <div class="score-pills">
                    <span class="pill-stat pill-ok">✅ ${aciertos} Aciertos</span>
                    <span class="pill-stat pill-err">❌ ${errores} Errores</span>
                    <span class="pill-stat pill-blank">⚪ ${blancos} En blanco</span>
                </div>
            `;

            const scoreTop = document.getElementById(`score_top_${testIndex}`);
            const scoreBot = document.getElementById(`score_bot_${testIndex}`);
            
            scoreTop.innerHTML = scoreHTML;
            scoreBot.innerHTML = scoreHTML;
            scoreTop.style.display = 'block';
            scoreBot.style.display = 'block';
            
            window.scrollTo({ top: scoreTop.offsetTop - 90, behavior: 'smooth' });
        }

        function reiniciar(testIndex) {
            const form = document.getElementById(`form_test${testIndex}`);
            form.reset();

            examenes[testIndex].forEach((q, qIndex) => {
                const radios = document.getElementsByName(`t${testIndex}_q${qIndex}`);
                radios.forEach(r => r.disabled = false);

                for (let i = 0; i < 4; i++) {
                    const lbl = document.getElementById(`lbl_t${testIndex}_q${qIndex}_o${i}`);
                    lbl.classList.remove('correct', 'incorrect');
                }
                document.getElementById(`exp_t${testIndex}_q${qIndex}`).style.display = 'none';
            });

            document.getElementById(`score_top_${testIndex}`).style.display = 'none';
            document.getElementById(`score_bot_${testIndex}`).style.display = 'none';
            document.getElementById(`btn_corr_${testIndex}`).disabled = false;
            updateProgress(testIndex);
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- 4. TEXT-TO-SPEECH (Síntesis de voz) ---
        let isSpeaking = false;
        function escucharTema() {
            const btn = document.getElementById('btnAudio');
            if ('speechSynthesis' in window) {
                if (isSpeaking) {
                    window.speechSynthesis.cancel();
                    isSpeaking = false;
                    btn.classList.remove('speaking');
                    btn.innerHTML = '🔊 Escuchar Tema';
                    return;
                }
                
                window.speechSynthesis.cancel();
                let textoCompleto = "Esquema de Estudio sobre Situaciones Administrativas y Condición de Funcionario. ";
                esquemaPreguntas.forEach((item, i) => {
                    textoCompleto += "Pregunta " + (i + 1) + ". " + item.pregunta + ". Respuesta: " + item.respuesta_detallada + ". ";
                });
                
                let utterance = new SpeechSynthesisUtterance(textoCompleto);
                utterance.lang = 'es-ES';
                utterance.rate = 1.05;
                
                utterance.onend = function() {
                    isSpeaking = false;
                    btn.classList.remove('speaking');
                    btn.innerHTML = '🔊 Escuchar Tema';
                };
                
                isSpeaking = true;
                btn.classList.add('speaking');
                btn.innerHTML = '⏹️ Detener Lectura';
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Lo sentimos, tu navegador no soporta la función de lectura de texto.");
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>

    <script>
        // --- DATA STRUCTURES (Textos limpios y estructurados) ---
        const esquemaPreguntas = [
            { pregunta: "¿Cuál es el límite de tamaño de una base de datos en Access?", respuesta_detallada: "El tamaño máximo de un archivo de base de datos de Access es 2 gigabytes." },
            { pregunta: "¿Cuáles son las características y límites del nombre de un campo?", respuesta_detallada: "Pueden tener hasta 64 caracteres. Pueden incluir combinaciones de letras, números, espacios y caracteres especiales, excepto puntos (.), signos de exclamación (!), acentos graves (`) y corchetes ([]). No pueden comenzar por espacios ni incluir caracteres de control." },
            { pregunta: "¿Qué extensión por defecto tienen las bases de datos creadas en Access 365?", respuesta_detallada: "Utilizan por defecto el formato de MSO Access 2007, cuya extensión es .accdb." },
            { pregunta: "¿Qué tamaño tiene el tipo de dato Texto corto?", respuesta_detallada: "Admite hasta 255 caracteres." },
            { pregunta: "¿Qué tamaño de almacenamiento tiene el tipo de dato Texto largo?", respuesta_detallada: "Hasta 1 gigabyte de caracteres o 2 gigabytes de almacenamiento, de los que se pueden mostrar 64.000 caracteres en un control." },
            { pregunta: "¿Qué tamaños de almacenamiento admite el tipo de dato Número?", respuesta_detallada: "1, 2, 4 o 8 o 16 bytes cuando se usa en un id. de replicación (Byte, Entero, Entero largo, Simple, Doble, Id. de réplica, Decimal)." },
            { pregunta: "¿Qué es un campo con tipo de dato Autonumeración?", respuesta_detallada: "Es un valor número único que Access inserta automáticamente cuando se agrega un registro. Su tamaño es de 4 o 16 bytes." },
            { pregunta: "¿Qué tamaño ocupa el tipo de dato Sí/No?", respuesta_detallada: "Ocupa 1 byte (8 bits = 1 byte) y representa valores booleanos." },
            { pregunta: "¿Cuál es la función del tipo de dato Objeto OLE y cuál es su límite?", respuesta_detallada: "Se utiliza para almacenar objetos OLE u otros datos binarios. Admite hasta 2 gigabytes." },
            { pregunta: "¿Qué indica el carácter '0' en una máscara de entrada?", respuesta_detallada: "Indica que el usuario debe escribir un dígito (0 a 9) de forma obligatoria." },
            { pregunta: "¿Qué indica el carácter '9' en una máscara de entrada?", respuesta_detallada: "Indica que el usuario puede escribir un dígito (0 a 9) de forma opcional." },
            { pregunta: "¿Qué indica el carácter 'L' en una máscara de entrada?", respuesta_detallada: "Indica que el usuario debe escribir una letra de forma obligatoria." },
            { pregunta: "¿Qué indica el carácter '?' en una máscara de entrada?", respuesta_detallada: "Indica que el usuario puede escribir una letra de forma opcional." },
            { pregunta: "¿Qué indica el carácter 'A' en una máscara de entrada?", respuesta_detallada: "Indica que el usuario debe escribir una letra o un dígito obligatoriamente." },
            { pregunta: "¿Qué hace el comodín '*' en las consultas de Access?", respuesta_detallada: "Equivale a cero o más caracteres. Puede utilizarse como primer o último carácter de la cadena." },
            { pregunta: "¿Qué hace el comodín '?' en las consultas?", respuesta_detallada: "Equivale a un carácter alfabético." },
            { pregunta: "¿Cuáles son los tipos de relaciones entre tablas?", respuesta_detallada: "Uno a uno (1 a 1), Uno a muchos (1 a ∞), y Muchos a muchos (∞ a ∞) que utiliza una tabla intermedia." },
            { pregunta: "¿Qué significa exigir integridad referencial?", respuesta_detallada: "Es una norma obligatoria para mantener coherencia; implica que un hijo no puede existir sin su padre, y las modificaciones o borrados en cascada afectarán a las tablas relacionadas." },
            { pregunta: "¿Qué es una combinación externa izquierda en consultas?", respuesta_detallada: "Incluye todos los registros de la tabla de la izquierda y solo aquellos de la tabla derecha donde los campos combinados sean iguales." },
            { pregunta: "¿Qué es una consulta de creación de tabla?", respuesta_detallada: "Permite crear una tabla en base a la consulta de los datos de otra tabla extrayendo campos y datos específicos." },
            { pregunta: "¿Se pueden añadir nuevos registros con una consulta de actualización?", respuesta_detallada: "No. Las consultas de actualización no se pueden usar para agregar nuevos registros, ni para eliminar registros, solo modifican datos existentes." },
            { pregunta: "¿Qué hace la función DifFecha?", respuesta_detallada: "Devuelve un valor que especifica el número de intervalos de tiempo entre dos fechas especificadas. Sus parámetros son intervalo, fecha1, fecha2." },
            { pregunta: "¿Qué hace la función Silnm?", respuesta_detallada: "Evalúa una condición y devuelve un valor si la condición es verdadera y otro valor si es falsa. Sintaxis: Silnm(Expr; parteVerdadera; parteFalsa)." },
            { pregunta: "¿Para qué sirve el operador ! (exclamación) en los identificadores?", respuesta_detallada: "Indica que el elemento siguiente ha sido definido por el usuario, como una tabla, formulario, informe o campo." },
            { pregunta: "¿Para qué sirve el operador . (punto) en los identificadores?", respuesta_detallada: "Indica que el elemento siguiente ha sido definido por Microsoft Access, como por ejemplo las propiedades de un campo." },
            { pregunta: "¿Cuáles son las vistas disponibles para un Informe?", respuesta_detallada: "Vista Informes (Vista informes), Vista preliminar (Vista previa de impresión), Vista presentación, y Vista diseño." },
            { pregunta: "¿Cuáles son las vistas disponibles para un Formulario?", respuesta_detallada: "Vista Formulario, Vista Presentación y Vista Diseño." },
            { pregunta: "¿Qué atajo de teclado muestra u oculta el panel de navegación?", respuesta_detallada: "F11" },
            { pregunta: "¿Qué atajo de teclado muestra u oculta una hoja de propiedades?", respuesta_detallada: "F4" },
            { pregunta: "¿Qué atajo cambia entre el modo de edición y el modo de navegación en vista Hoja de datos?", respuesta_detallada: "F2" },
            { pregunta: "¿Qué hace el atajo F5 en Access?", respuesta_detallada: "Cambia a la vista Formulario desde el formulario en la vista Diseño." },
            { pregunta: "¿Cuál es la arquitectura principal de Access?", respuesta_detallada: "Access funciona como interfaz de usuario (UI de Access) que maneja el motor de Microsoft Access (motor ACE) para bases de datos .accdb." },
            { pregunta: "¿Qué es una clave foránea (externa o ajena)?", respuesta_detallada: "Una clave que se usa en una tabla secundaria y coincide con la clave primaria en una tabla primaria relacionada. Permiten exigir integridad referencial." },
            { pregunta: "¿Qué significa el modo 'Combinación interna' en las consultas?", respuesta_detallada: "Solo incluye las filas en la que los campos combinados de ambas tablas sean iguales." },
            { pregunta: "¿Qué hace una consulta General (de referencias cruzadas)?", respuesta_detallada: "Permite crear una tabla resumen de información, agrupando la información por filas y columnas." },
            { pregunta: "¿Qué función calcula la media aritmética en SQL de Access?", respuesta_detallada: "Promedio(Expresión)" },
            { pregunta: "¿Qué hace la función Conmutador?", respuesta_detallada: "Evalúa una lista de expresiones y devuelve un valor o expresión asociada a la primera expresión de la lista que sea Verdadero." },
            { pregunta: "¿Cómo se escriben los criterios de fecha en las consultas de Access?", respuesta_detallada: "La fecha se encierra entre almohadillas, ejemplo: #dd/mm/aaaa#" },
            { pregunta: "¿En qué lenguaje se escriben los módulos de Access?", respuesta_detallada: "En Visual Basic para Aplicaciones (VBA)." },
            { pregunta: "¿Cuáles son las 4 partes principales de las que consta un informe?", respuesta_detallada: "Encabezado de informe, encabezado de página, detalle y pie de página." }
        ];

        const baseTestQuestions = [
            {
                pregunta: "¿Cuál de los siguientes caracteres NO está permitido en el nombre de un campo de Access?",
                opciones: ["Espacio", "Punto (.)", "Guion bajo (_)", "Letras acentuadas"],
                respuesta_correcta: 1,
                explicacion: "Los nombres de campos no pueden incluir puntos (.), signos de exclamación (!), acentos graves (`) y corchetes ([])."
            },
            {
                pregunta: "¿Qué tamaño máximo admite una base de datos en Access (.accdb)?",
                opciones: ["1 Gigabyte", "2 Gigabytes", "4 Gigabytes", "Sin límite (depende del disco)"],
                respuesta_correcta: 1,
                explicacion: "El tamaño máximo de un archivo de base de datos de Access es 2 gigabytes."
            },

        // Generar los 10 tests con variedad determinista
        const allTests = [];
        for (let i = 0; i < 10; i++) {
            let test = [...baseTestQuestions];
            const shift = (i * 3) % test.length;
            const shifted = test.slice(shift).concat(test.slice(0, shift));
            const mapped = shifted.map((q) => ({
                q: q.pregunta,
                o: [...q.opciones],
                c: q.respuesta_correcta,
                e: q.explicacion
            }));
            allTests.push(mapped);
        }

        // --- ESTADO GLOBAL Y ALMACENAMIENTO ---
        let currentTabIndex = 0;

        let activeReadingIndex = -1;
        let speechUtterance = null;
        let searchQuery = '';
        let selectedCategoryFilter = 'Todos';

        function getSavedScores() {
            try {
                return JSON.parse(localStorage.getItem('access365_scores') || '{}');
            } catch (e) {
                return {};
            }
        }

        function saveTestScore(testNum, score, aciertos, total) {
            const scores = getSavedScores();
            scores[testNum] = { score, aciertos, total, date: new Date().toLocaleDateString() };
            localStorage.setItem('access365_scores', JSON.stringify(scores));
            updateGlobalStats();
            renderTabs();
        }

        function updateGlobalStats() {
            const scores = getSavedScores();
            const completed = Object.keys(scores).length;
            const badgeText = document.getElementById('completed-count-text');
            if (badgeText) {
                badgeText.textContent = `${completed}/10 tests`;
            }
        }

        // Tema Claro / Oscuro
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        }

        function toggleDocMenu() {
            const menu = document.getElementById('doc-menu-dropdown');
            menu.classList.toggle('hidden');
        }

        document.addEventListener('click', (e) => {
            const btn = document.getElementById('doc-menu-btn');
            const menu = document.getElementById('doc-menu-dropdown');
            if (btn && menu && !btn.contains(e.target) && !menu.contains(e.target)) {
                menu.classList.add('hidden');
            }
        });

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            updateGlobalStats();
            renderTabs();
            switchTab(0);

            // Atajos de teclado (A, B, C, D o 1, 2, 3, 4)
            document.addEventListener('keydown', (e) => {
                if (currentTabIndex === 0) return;
                if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;

                const key = e.key.toUpperCase();
                let optionIndex = -1;
                if (['A', '1'].includes(key)) optionIndex = 0;
                else if (['B', '2'].includes(key)) optionIndex = 1;
                else if (['C', '3'].includes(key)) optionIndex = 2;
                else if (['D', '4'].includes(key)) optionIndex = 3;

                if (optionIndex !== -1) {
                    const unansweredCards = document.querySelectorAll('.question-card:not(.answered)');
                    if (unansweredCards.length > 0) {
                        const targetCard = unansweredCards[0];
                        const radio = targetCard.querySelectorAll('input[type="radio"]')[optionIndex];
                        if (radio && !radio.disabled) {
                            radio.checked = true;
                            radio.dispatchEvent(new Event('change'));
                            updateQuestionProgress(currentTabIndex);
                            targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }
                }
            });
        });

        // --- NAVEGACIÓN POR PESTAÑAS ---

            const tabsNav = document.getElementById('tabs-nav');
            const scores = getSavedScores();

            let tabsHtml = `
                <button onclick="switchTab(0)" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-2 whitespace-nowrap transition-all duration-200" id="tab-btn-0">

                </button>

            for (let i = 1; i <= 10; i++) {
                const saved = scores[i];
                let scoreBadge = '';
                if (saved) {
                    const isPassed = (saved.aciertos / saved.total) >= 0.5;
                    const badgeBg = isPassed 
                        ? 'bg-emerald-500/20 text-emerald-700 dark:text-emerald-300 border-emerald-500/30' 
                        : 'bg-amber-500/20 text-amber-700 dark:text-amber-300 border-amber-500/30';

                tabsHtml += `
                    <button onclick="switchTab(${i})" class="tab-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-1 whitespace-nowrap transition-all duration-200" id="tab-btn-${i}">

                        ${scoreBadge}

            }
            tabsNav.innerHTML = tabsHtml;
            highlightActiveTab(currentTabIndex);

        function highlightActiveTab(tabIndex) {
            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                if (idx === tabIndex) {
                    btn.className = "tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-2 whitespace-nowrap bg-gradient-to-r from-rose-600 to-rose-500 text-white shadow-lg shadow-rose-500/25 scale-[1.02] transition-all duration-200";

        function switchTab(tabIndex) {
            stopTTS();
            currentTabIndex = tabIndex;
            highlightActiveTab(tabIndex);

            const activeBtn = document.getElementById(`tab-btn-${tabIndex}`);
            if (activeBtn) {
                activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

            renderTabContent(tabIndex);

                renderEsquemaView(main);

                                                    </svg>
                                                </button>
                                            </div>
                                            <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 leading-relaxed pl-8.5 sm:pl-9">
                                                ${formattedAns}
                                            </p>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        function formatHighlights(text) {
            let t = text;
            t = t.replace(/(F11|F4|F2|F5|Ctrl \+ [A-Za-z0-9+]+|MAYÚS\+[A-Za-z0-9+]+)/g, '<kbd>$1</kbd>');
            t = t.replace(/(\.accdb|2 gigabytes|255 caracteres|64\.000 caracteres|64 caracteres|1 gigabyte|1, 2, 4 o 8 o 16 bytes|4 o 16 bytes|1 byte|#dd\/mm\/aaaa#)/g, '<span class="px-1.5 py-0.5 rounded-md bg-rose-500/10 text-rose-700 dark:text-rose-300 font-mono text-xs font-bold border border-rose-500/20">$1</span>');
            return t;
        }

        function handleSearch(val) {
            searchQuery = val;
            renderEsquemaView(document.getElementById('main-content'));
        }

        function setCategoryFilter(cat) {
            selectedCategoryFilter = cat;
            renderEsquemaView(document.getElementById('main-content'));
        }

        // --- VISTA TEST INTERACTIVO ---
        function renderTestView(container, testIndex) {

                                <span id="progress-pct-t${testIndex}" class="font-mono">0%</span>
                            </div>
                            <div class="w-full h-2.5 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
                                <div id="progress-bar-t${testIndex}" class="h-full bg-gradient-to-r from-rose-600 via-rose-500 to-amber-500 rounded-full transition-all duration-300" style="width: 0%"></div>
                            </div>

                    <!-- Formulario de Preguntas -->
                    <form id="form-test-${testIndex}" onsubmit="evaluarTest(event, ${testIndex})" class="space-y-5 sm:space-y-6">

            testData.forEach((q, qIndex) => {

                    <div class="question-card bg-white/95 dark:bg-slate-900/90 rounded-3xl p-4 sm:p-6 border border-slate-200/80 dark:border-slate-800 shadow-sm transition-all" id="card-t${testIndex}q${qIndex}">
                        <div class="flex items-start gap-3 sm:gap-3.5 mb-4">
                            <span class="flex-shrink-0 w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-mono font-extrabold text-xs sm:text-sm flex items-center justify-center border border-slate-200/80 dark:border-slate-700">

                            </h3>
                        </div>

                        <!-- Opciones Táctiles -->
                        <div class="grid gap-2.5 pl-0 sm:pl-11">

                q.o.forEach((opt, oIndex) => {

                    html += `

                html += `

        // --- LÓGICA DE PROGRESO Y EVALUACIÓN ---
        function updateQuestionProgress(tabIndex) {
            const testData = allTests[tabIndex - 1];
            let count = 0;
            testData.forEach((_, qIndex) => {
                const selected = document.querySelector(`input[name="t${tabIndex}q${qIndex}"]:checked`);
                const card = document.getElementById(`card-t${tabIndex}q${qIndex}`);
                
                // Resaltar visualmente la opción seleccionada antes de corregir
                for (let o = 0; o < 4; o++) {
                    const lbl = document.getElementById(`label-t${tabIndex}q${qIndex}o${o}`);
                    if (lbl) {
                        lbl.classList.remove('border-rose-500', 'bg-rose-50/70', 'dark:bg-rose-950/30', 'ring-1', 'ring-rose-500/40');
                    }
                }

                if (selected) {
                    count++;
                    card.classList.add('answered');
                    const selLbl = document.getElementById(`label-t${tabIndex}q${qIndex}o${selected.value}`);
                    if (selLbl) {
                        selLbl.classList.add('border-rose-500', 'bg-rose-50/70', 'dark:bg-rose-950/30', 'ring-1', 'ring-rose-500/40');
                    }
                }
            });

            const pct = Math.round((count / testData.length) * 100);
            const textEl = document.getElementById(`progress-text-t${tabIndex}`);
            const pctEl = document.getElementById(`progress-pct-t${tabIndex}`);
            const barEl = document.getElementById(`progress-bar-t${tabIndex}`);

            if (textEl) textEl.textContent = `${count}/${testData.length}`;
            if (pctEl) pctEl.textContent = `${pct}%`;
            if (barEl) barEl.style.width = `${pct}%`;
        }

        function evaluarTest(event, tabIndex) {
            event.preventDefault();
            const testData = allTests[tabIndex - 1];
            let aciertos = 0;
            let errores = 0;

            testData.forEach((q, qIndex) => {
                const radios = document.querySelectorAll(`input[name="t${tabIndex}q${qIndex}"]`);
                const selected = document.querySelector(`input[name="t${tabIndex}q${qIndex}"]:checked`);
                const expBox = document.getElementById(`exp-t${tabIndex}q${qIndex}`);

                radios.forEach(r => r.disabled = true);

                // Limpiar estilos previos de selección
                for (let o = 0; o < 4; o++) {
                    const lbl = document.getElementById(`label-t${tabIndex}q${qIndex}o${o}`);
                    lbl.classList.remove('border-rose-500', 'bg-rose-50/70', 'dark:bg-rose-950/30', 'ring-1', 'ring-rose-500/40');
                }

                const correctLabel = document.getElementById(`label-t${tabIndex}q${qIndex}o${q.c}`);
                const correctBadge = document.getElementById(`badge-t${tabIndex}q${qIndex}o${q.c}`);

                if (selected) {
                    const ansVal = parseInt(selected.value);
                    const selectedLabel = document.getElementById(`label-t${tabIndex}q${qIndex}o${ansVal}`);
                    const selectedBadge = document.getElementById(`badge-t${tabIndex}q${qIndex}o${ansVal}`);

                    if (ansVal === q.c) {
                        aciertos++;
                        selectedLabel.classList.add('bg-emerald-50/90', 'dark:bg-emerald-950/40', 'border-emerald-500', 'text-emerald-950', 'dark:text-emerald-200');
                        selectedBadge.className = 'flex-shrink-0 w-7 h-7 rounded-xl bg-emerald-600 text-white font-bold text-xs flex items-center justify-center shadow-sm';
                        selectedBadge.innerText = '✓';
                    } else {
                        errores++;
                        selectedLabel.classList.add('bg-rose-50/90', 'dark:bg-rose-950/40', 'border-rose-500', 'text-rose-950', 'dark:text-rose-200');
                        selectedBadge.className = 'flex-shrink-0 w-7 h-7 rounded-xl bg-rose-600 text-white font-bold text-xs flex items-center justify-center shadow-sm';
                        selectedBadge.innerText = '✗';

                        correctLabel.classList.add('bg-emerald-50/80', 'dark:bg-emerald-950/30', 'border-emerald-500');
                        correctBadge.className = 'flex-shrink-0 w-7 h-7 rounded-xl bg-emerald-600 text-white font-bold text-xs flex items-center justify-center shadow-sm';
                        correctBadge.innerText = '✓';
                    }
                } else {
                    errores++;
                    correctLabel.classList.add('bg-emerald-50/80', 'dark:bg-emerald-950/30', 'border-emerald-500');
                    correctBadge.className = 'flex-shrink-0 w-7 h-7 rounded-xl bg-emerald-600 text-white font-bold text-xs flex items-center justify-center shadow-sm';
                    correctBadge.innerText = '✓';
                }

                expBox.classList.remove('hidden');
            });

            const score10 = (aciertos / testData.length) * 10;
            saveTestScore(tabIndex, score10, aciertos, testData.length);

            if (score10 >= 7.0 && typeof confetti === 'function') {
                confetti({
                    particleCount: 110,
                    spread: 75,
                    origin: { y: 0.65 }
                });
            }

            let badgeTitle = score10 >= 9 ? 'Sobresaliente 🏆' : (score10 >= 7 ? 'Notable 🔥' : (score10 >= 5 ? 'Aprobado ✅' : 'Sigue Practicando 💪'));
            let badgeColor = score10 >= 5 ? 'text-emerald-400' : 'text-amber-400';

            const summary = document.getElementById(`summary-t${tabIndex}`);
            summary.innerHTML = `
                <div class="text-[11px] font-extrabold uppercase tracking-widest text-rose-300 mb-1">Resultado Oficial del Simulacro</div>
                <div class="text-2xl sm:text-3xl font-black ${badgeColor} mb-2">${badgeTitle}</div>
                <div class="text-4xl sm:text-5xl font-extrabold font-mono text-white my-3">
                    ${score10.toFixed(2)} <span class="text-lg sm:text-xl text-slate-400 font-normal">/ 10</span>
                </div>
                <div class="flex justify-center items-center gap-6 text-xs sm:text-sm font-bold mt-4 pt-4 border-t border-white/10">
                    <span class="text-emerald-400">✓ Aciertos: ${aciertos}</span>
                    <span class="text-rose-400">✗ Fallos/Blancos: ${errores}</span>
                </div>
            `;
            summary.classList.remove('hidden');
            summary.classList.add('animate-fade-in');
            summary.scrollIntoView({ behavior: 'smooth', block: 'center' });

            const submitBtn = document.getElementById(`btn-submit-t${tabIndex}`);
            submitBtn.disabled = true;
            submitBtn.className = "flex-1 md:flex-initial bg-slate-200 dark:bg-slate-800 text-slate-400 font-bold py-3 px-6 rounded-xl text-xs sm:text-sm cursor-not-allowed";
            submitBtn.innerText = "✓ Corregido";
        }

        function reiniciarTest(tabIndex) {
            renderTabContent(tabIndex);
        }

        // --- MOTOR DE VOZ (TEXT-TO-SPEECH) ---
        function playTTS() {
            if (!('speechSynthesis' in window)) {
                alert("Tu navegador no soporta sintetizador de voz.");
                return;
            }

            stopTTS();

            let fullText = "Esquema Clave de Access 365. Oposiciones AGE Subgrupo C1. \n\n";
            esquemaPreguntas.forEach((item, index) => {
                const ans = item.respuesta_detallada || '';
                fullText += `Pregunta ${index + 1}. ${item.pregunta} . Respuesta: ${ans} . \n\n`;
            });

            speechUtterance = new SpeechSynthesisUtterance(fullText);
            speechUtterance.lang = 'es-ES';
            speechUtterance.rate = ttsSpeed;

            const readingBanner = document.getElementById('tts-reading-banner');
            const playBtn = document.getElementById('btn-play-tts');
            const stopBtn = document.getElementById('btn-stop-tts');

            speechUtterance.onstart = () => {
                if (readingBanner) readingBanner.classList.remove('hidden');
                if (playBtn) playBtn.classList.add('hidden');
                if (stopBtn) stopBtn.classList.remove('hidden');
            };

            speechUtterance.onend = () => {
                stopTTS();
            };

            speechSynthesis.speak(speechUtterance);
        }

        function readSingleQuestion(idx) {
            if (!('speechSynthesis' in window)) return;
            stopTTS();

            const item = esquemaPreguntas[idx];
            activeReadingIndex = idx;
            renderEsquemaView(document.getElementById('main-content'));

            const ans = item.respuesta_detallada || '';
            const text = `Pregunta ${idx + 1}. ${item.pregunta} . Respuesta: ${ans}`;
            speechUtterance = new SpeechSynthesisUtterance(text);
            speechUtterance.lang = 'es-ES';
            speechUtterance.rate = ttsSpeed;

            speechUtterance.onend = () => {
                activeReadingIndex = -1;
                renderEsquemaView(document.getElementById('main-content'));
            };

            speechSynthesis.speak(speechUtterance);
        }

        function changeTTSSpeed(speed) {
            ttsSpeed = parseFloat(speed);
            if (speechSynthesis.speaking) {
                playTTS();
            }
        }

        function stopTTS() {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                activeReadingIndex = -1;
                const readingBanner = document.getElementById('tts-reading-banner');
                const playBtn = document.getElementById('btn-play-tts');
                const stopBtn = document.getElementById('btn-stop-tts');
                if (readingBanner) readingBanner.classList.add('hidden');
                if (playBtn) playBtn.classList.remove('hidden');
                if (stopBtn) stopBtn.classList.add('hidden');
            }
        }
    </script>

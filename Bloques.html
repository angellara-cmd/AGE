<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloques - Temarios y Supuestos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Fondo Animado Mesh */
        @keyframes meshGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .mesh-background {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81, #1e293b);
            background-size: 300% 300%;
            animation: meshGradient 15s ease infinite;
        }
        
        /* Animación de Entrada en Cascada (Fade In Up) */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            opacity: 0; /* Empieza invisible */
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Custom scrollbar para las tarjetas en caso de ser necesario */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="mesh-background text-slate-100 h-screen w-full flex flex-col justify-between p-2 md:p-4 select-none overflow-hidden">

    <!-- Header Principal (Con animación de entrada rápida) -->
    <header class="animate-fade-in-up flex items-center justify-between px-3 md:px-4 py-2 bg-white/10 backdrop-blur-md rounded-xl border border-white/10 shadow-lg shrink-0 z-10 mb-2 md:mb-0" style="animation-delay: 0.1s;">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-tr from-blue-500 to-indigo-500 p-2 rounded-lg text-white shadow-md">
                <i class="fa-solid fa-layer-group text-lg"></i>
            </div>
            <div>
                <h1 class="text-base md:text-xl font-bold tracking-tight text-white leading-tight">Bloques</h1>
                <p class="text-[10px] md:text-xs text-slate-300">Panel de navegación de temarios y supuestos prácticos</p>
            </div>
        </div>
        <div class="hidden sm:flex items-center space-x-2 bg-white/5 px-3 py-1.5 rounded-full border border-white/10 text-xs text-slate-300">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>Sistema Responsivo & Animado</span>
        </div>
    </header>

    <!-- Main Content Container (Grid responsivo) -->
    <main id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-12 md:grid-rows-2 gap-3 md:gap-3 my-auto w-full max-w-[1700px] mx-auto flex-1 items-stretch min-h-0 overflow-y-auto md:overflow-hidden pb-4 md:pb-0 pr-1 md:pr-0">
        <!-- Inyectado dinámicamente por JavaScript -->
    </main>

    <!-- Footer Minimalista -->
    <footer class="animate-fade-in-up text-center py-1 text-[10px] md:text-[11px] text-slate-400 shrink-0 hidden md:block" style="animation-delay: 0.6s;">
        Panel optimizado para estudio institucional &bull; Acceso rápido a recursos
    </footer>

    <!-- Script de Renderizado Dinámico -->
    <script>
        const categories = [
            {
                id: 1,
                title: "Organización del estado y de la administración pública",
                icon: "fa-landmark-dome",
                color: "from-blue-600 to-indigo-700",
                borderColor: "border-blue-500/30",
                badgeBg: "bg-blue-500/20 text-blue-300",
                colSpan: "md:col-span-6",
                items: [
                    { name: "Tema_01_Constitución_TC_Defensor del Pueblo", url: "Tema_01_Constitución_TC_Defensor del Pueblo.html", active: true },
                    { name: "Tema_02_La Jefatura del Estado_La Corona", url: "Tema_02_La Jefatura del Estado_La Corona.html", active: true },
                    { name: "Tema_03_Las_Cortes_Generales", url: "Tema_03_Las_Cortes_Generales.html", active: true },
                    { name: "Tema_04_El_poder_judicial", url: "Tema_04_El_poder_judicial.html", active: true },
                    { name: "Tema_05_El_Gobierno_y_la_Administracion", url: "Tema_05_El_Gobierno_y_la_Administracion.html", active: true },
                    { name: "Tema_06_Gobierno Abierto y Agenda 2030", url: "Tema_06_Gobierno Abierto y Agenda 2030.html", active: true },
                    { name: "Tema_07_Ley 19_2013 de Transparencia y Buen Gobierno", url: "Tema_07_Ley 19_2013 de Transparencia y Buen Gobierno.html", active: true },
                    { name: "Tema_08_La administracion general del estado", url: "Tema_08_La administracion general del estado.html", active: true },
                    { name: "Tema_09_La organizacion territorial del estado", url: "Tema_09_La organizacion territorial del estado.html", active: true },
                    { name: "Tema_10_La administracion local", url: "Tema_10_La administracion local.html", active: true },
                    { name: "Tema_11_La organizacion de la union europea", url: "Tema_11_La organizacion de la union europea.html", active: true }
                ]
            },
            {
                id: 2,
                title: "Organización de oficinas públicas",
                icon: "fa-building-user",
                color: "from-orange-600 to-amber-600",
                borderColor: "border-orange-500/30",
                badgeBg: "bg-orange-500/20 text-orange-300",
                colSpan: "md:col-span-6",
                items: [
                    { name: "Tema_01_Atencion al publico", url: "Tema_01_Atencion al publico.hml", active: true },
                    { name: "Tema_02_Concepto de documento", url: "Tema_02_Concepto de documento_ampliado.html", active: true },
                    { name: "Tema_03_Administracion electronica y servicios al ciudadano", url: "Tema_03_Administracion electronica y servicios al ciudadano_ampliado.html", active: true },
                    { name: "Tema_04_La proteccion de datos personales", url: "Tema_04_La proteccion de datos personales_ampliado.html", active: true }
                ]
            },
            {
                id: 3,
                title: "Derecho administrativo general",
                icon: "fa-scale-balanced",
                color: "from-purple-600 to-fuchsia-700",
                borderColor: "border-purple-500/30",
                badgeBg: "bg-purple-500/20 text-purple-300",
                colSpan: "md:col-span-4",
                items: [
                    { name: "Tema_01_Las fuentes del derecho administrativo", url: "Tema_01_Las fuentes del derecho administrativo.hml", active: true },
                    { name: "Tema_02_El acto administrativo", url: "Tema_02_El acto administrativo.html", active: true },
                    { name: "Tema_03_Las leyes del procedimiento administrativo comun", url: "Tema_03_Las leyes del procedimiento administrativo comun.html", active: true },
                    { name: "Tema_04_Los contratos del sector publico", url: "Tema_04_Los contratos del sector publico.html", active: true },
                    { name: "Tema_05_Procedimientos y formas de la actividad administrativa", url: "Tema_05_Procedimientos y formas de la actividad administrativa.html", active: true },
                    { name: "Tema_06_La responsabilidad Patrimonial de las AAPP", url: "Tema_06_La responsabilidad Patrimonial de las AAPP.html", active: true },
                    { name: "Tema_07_Politicas de igualdad y contra la violencia de genero", url: "Tema_07_Politicas de igualdad y contra la violencia de genero.html", active: true }
                ]
            },
            {
                id: 4,
                title: "Gestión financiera",
                icon: "fa-chart-pie",
                color: "from-emerald-600 to-teal-700",
                borderColor: "border-emerald-500/30",
                badgeBg: "bg-emerald-500/20 text-emerald-300",
                colSpan: "md:col-span-4",
                items: [
                    { name: "Tema_01_El presupuesto", url: "Tema_01_El presupuesto.html", active: true },
                    { name: "Tema_02_El presupuesto del estado en España", url: "Tema_02_El presupuesto del estado en España.html", active: true },
                    { name: "Tema_03_El procedimiento admo de la ejecucion del gasto", url: "Tema_03_El procedimiento admo de la ejecucion del gasto.html", active: true },
                    { name: "Tema_04_Las retribuciones e indenizaciones de los funcionarios", url: "Tema_04_Las retribuciones e indenizaciones de los funcionarios.html", active: true },
                    { name: "Tema_05_Gastos para la compra de bienes y servicios", url: "Tema_05_Gastos para la compra de bienes y servicios.html", active: true },
                    { name: "Tema_06_Gestion economica y financiera de los contratos del sector pco", url: "Tema_06_Gestion economica y financiera de los contratos del sector pco.html", active: true }
                ]
            },
            {
                id: 5,
                title: "Gestión de personal",
                icon: "fa-users-gear",
                color: "from-indigo-600 to-violet-700",
                borderColor: "border-indigo-500/30",
                badgeBg: "bg-indigo-500/20 text-indigo-300",
                colSpan: "md:col-span-4",
                items: [
                    { name: "Tema_01_El personal al servicio de las admin publicas", url: "tema01_El personal al servicio de las admin publicas.html", active: true },
                    { name: "Tema_02_Seleccion de personal", url: "tema02_Seleccion de personal.html", active: true },
                    { name: "Tema_03_El personal funcionario al servicio de las adm publicas", url: "tema03_El personal funcionario al servicio de las adm publicas.html", active: true },
                    { name: "Tema_04_Adquisicion y perdida de la condicion de funcionario", url: "tema04_Adquisicion y perdida de la condicion de funcionario.html", active: true },
                    { name: "Tema_05_provision de puestos de trabajo en la funcion pub", url: "tema05_provision de puestos de trabajo en la funcion pub.html", active: true },
                    { name: "Tema_06_Las incompatibilidades", url: "tema06_Las incompatibilidades.html", active: true },
                    { name: "Tema_07_El regimen de la seguridad social de los funcionarios", url: "tema07_El regimen de la seguridad social de los funcionarios.html", active: true },
                    { name: "Tema_08_El personal laboral al servicio de las adm pub", url: "tema08_El personal laboral al servicio de las adm pub.html", active: true },
                    { name: "Tema_09_El regimen de la seguridad social del personal laboral", url: "tema09_El regimen de la seguridad social del personal laboral.html", active: true }
                ]
            }
        ];

        function renderDashboard() {
            const gridContainer = document.getElementById('dashboard-grid');
            gridContainer.innerHTML = '';

            categories.forEach((cat, index) => {
                // Cálculo de delay en cascada (0.2s, 0.3s, 0.4s...)
                const animationDelay = 0.2 + (index * 0.1); 

                const card = document.createElement('div');
                // Se añade animate-fade-in-up a la clase base de la tarjeta
                card.className = `animate-fade-in-up ${cat.colSpan} bg-slate-900/60 backdrop-blur-xl border ${cat.borderColor} rounded-2xl p-3 flex flex-col min-h-0 shadow-2xl transition-all duration-300 hover:bg-slate-900/80 group`;
                card.style.animationDelay = `${animationDelay}s`;

                let htmlContent = `
                    <div class="flex items-center justify-between pb-2 mb-2 border-b border-white/10 shrink-0">
                        <div class="flex items-center space-x-2.5 overflow-hidden">
                            <div class="bg-gradient-to-br ${cat.color} p-2 rounded-xl text-white shadow-md group-hover:scale-105 transition-transform duration-300 shrink-0">
                                <i class="fa-solid ${cat.icon} text-sm w-4 text-center"></i>
                            </div>
                            <h2 class="text-xs md:text-sm font-bold text-white tracking-wide leading-tight truncate">${cat.title}</h2>
                        </div>
                        <span class="${cat.badgeBg} text-[10px] font-semibold px-2 py-0.5 rounded-full shrink-0 ml-2 shadow-sm">
                            ${cat.items.filter(i => i.active).length}/${cat.items.length} activos
                        </span>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-1.5 overflow-y-auto pr-1 flex-1 min-h-0 content-start custom-scrollbar">
                `;

                cat.items.forEach(item => {
                    if (item.active) {
                        // Enlaces con glow hover, desplazamiento X/Y y animación en el icono
                        htmlContent += `
                            <a href="${item.url}" title="${item.name}" class="flex items-center justify-between px-2.5 py-1.5 rounded-lg bg-white/10 hover:bg-emerald-500 hover:text-slate-950 text-slate-200 text-[11px] font-medium transition-all duration-300 border border-white/5 hover:border-emerald-400 group/link hover:shadow-[0_0_12px_rgba(16,185,129,0.4)] hover:-translate-y-[1px] hover:translate-x-[2px] h-min">
                                <span class="truncate pr-1">${item.name}</span>
                                <i class="fa-solid fa-arrow-up-right-from-square text-[9px] opacity-70 transition-all duration-300 group-hover/link:opacity-100 group-hover/link:translate-x-[2px] group-hover/link:-translate-y-[2px] shrink-0"></i>
                            </a>
                        `;
                    } else {
                        htmlContent += `
                            <div class="flex items-center justify-between px-2.5 py-1.5 rounded-lg bg-white/5 border border-dashed border-white/10 text-slate-400 text-[11px] opacity-60 cursor-not-allowed select-none transition-colors duration-300 hover:bg-white/10 hover:border-white/20 h-min">
                                <span class="truncate pr-1">${item.name}</span>
                                <i class="fa-regular fa-circle text-[9px] opacity-40 shrink-0"></i>
                            </div>
                        `;
                    }
                });

                htmlContent += `
                    </div>
                `;

                card.innerHTML = htmlContent;
                gridContainer.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', renderDashboard);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Completo - Oposición Administrativo del Estado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .option-label { transition: all 0.2s ease-in-out; }
        input[type="radio"]:checked + .custom-radio {
            border-color: #4f46e5;
            background-color: #4f46e5;
        }
        input[type="radio"]:checked + .custom-radio::after {
            content: '';
            display: block;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            margin: 3px auto;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen p-2 md:p-6">

    <div class="max-w-5xl mx-auto">
        <!-- Cabecera (Ya NO es sticky) -->
        <header class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 md:p-6 mb-6 text-center">
            <h1 class="text-2xl md:text-3xl font-bold text-indigo-900 mb-2">Examen Oficial Completo</h1>
            <p class="text-slate-600 font-medium text-sm md:text-base">Cuerpo General Administrativo de la Administración del Estado</p>
            <div class="mt-4 flex flex-wrap justify-center gap-2 text-xs font-semibold">
                <span class="bg-slate-100 text-slate-700 px-3 py-1 rounded-full border border-slate-200">110 Preguntas</span>
                <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full border border-green-200">+1 Acierto</span>
                <span class="bg-red-100 text-red-700 px-3 py-1 rounded-full border border-red-200">-0.333 Fallo</span>
            </div>
        </header>

        <!-- Contenedor del Cuestionario -->
        <main id="quiz-container" class="space-y-8">
            <!-- Renderizado por JS -->
        </main>

        <!-- Botón de corrección -->
        <div class="mt-8 flex justify-center pb-24">
            <button id="btn-corregir" onclick="corregirEjercicio()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-lg py-4 px-12 rounded-xl shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-1 focus:outline-none focus:ring-4 focus:ring-indigo-300">
                Corregir Ejercicio
            </button>
        </div>

        <!-- Panel de Resultados (Total) -->
        <div id="resultados-panel" class="hidden fixed bottom-0 left-0 right-0 bg-white shadow-[0_-10px_25px_-5px_rgba(0,0,0,0.15)] border-t border-slate-200 z-50 p-4 md:p-6 transition-transform">
            <div class="max-w-5xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="flex-1 text-center md:text-left">
                    <h2 class="text-xl md:text-2xl font-bold text-slate-800">Resultado Final</h2>
                    <div id="desglose-resultados" class="flex flex-wrap justify-center md:justify-start gap-3 mt-2 text-sm md:text-base"></div>
                </div>
                <div class="bg-indigo-50 border-2 border-indigo-100 rounded-lg p-3 text-center min-w-[150px] shadow-inner">
                    <p class="text-xs text-indigo-600 font-bold uppercase tracking-wider mb-1">Nota Total</p>
                    <p id="puntuacion-final" class="text-3xl font-black text-indigo-900"></p>
                </div>
                <button onclick="reiniciarTest()" class="text-slate-500 hover:text-indigo-600 font-medium underline underline-offset-4 text-sm px-4 py-2 hover:bg-slate-50 rounded-lg transition-colors">
                    Repetir Examen
                </button>
            </div>
        </div>
    </div>

    <script>
        // Array de 110 preguntas con las respuestas adaptadas a la plantilla proporcionada
        const examData = [
            {
                section: "PRIMERA PARTE",
                context: "",
                questions: [
                    { id: 1, q: "De acuerdo con el artículo 167 de la Constitución Española de 1978, los proyectos de reforma constitucional deberán ser aprobados:", o: { a: "Por mayoría de tres quintos del Congreso.", b: "Por mayoría absoluta del Congreso.", c: "Por mayoría absoluta de cada una de las Cámaras.", d: "Por mayoría de tres quintos de cada una de las Cámaras." }, ans: "d" },
                    { id: 2, q: "Corresponde al Rey, conforme al artículo 62 de la Constitución Española de 1978:", o: { a: "Aprobar los Decretos Leyes.", b: "Aprobar los Reglamentos.", c: "Aprobar las Leyes.", d: "Sancionar y promulgar las leyes." }, ans: "d" },
                    { id: 3, q: "De acuerdo con el artículo 67 de la Constitución Española de 1978:", o: { a: "Nadie podrá ser miembro de las dos Cámaras simultáneamente.", b: "Nadie podrá ser miembro de las dos Cámaras simultáneamente, salvo el Presidente del Gobierno y los Ministros.", c: "Nadie podrá ser miembro de las dos Cámaras simultáneamente, salvo el Presidente del Gobierno.", d: "Nadie podrá ser miembro de las dos Cámaras simultáneamente, pero se podrá acumular el acta de una Asamblea de Comunidad Autónoma con la de Diputado al Congreso." }, ans: "a" },
                    { id: 4, q: "¿Quién nombrará al Presidente del Tribunal Supremo de acuerdo con lo previsto en el artículo 123 de la Constitución Española de 1978?", o: { a: "El Rey, a propuesta del Presidente del Gobierno, en la forma que determine la ley.", b: "El Presidente del Gobierno, a propuesta del Rey, en la forma que determine la ley.", c: "El Consejo General del Poder Judicial, a propuesta del Rey, en la forma que determine la ley.", d: "El Rey, a propuesta del Consejo del Poder Judicial, en la forma que determine la ley." }, ans: "c" },
                    { id: 5, q: "De acuerdo con el artículo 112 de la Constitución Española de 1978, la cuestión de confianza planteada por el Presidente de Gobierno se entenderá otorgada cuando vote a favor de la misma:", o: { a: "La mayoría simple del Congreso de los Diputados.", b: "La mayoría simple del Congreso de los Diputados y del Senado.", c: "La mayoría absoluta del Congreso de los Diputados.", d: "La mayoría absoluta del Congreso de los Diputados y del Senado." }, ans: "a" },
                    { id: 6, q: "¿Cuántos objetivos de desarrollo sostenible contiene la Agenda 2030?", o: { a: "Diecisiete objetivos.", b: "Veinte objetivos.", c: "Diecinueve objetivos.", d: "Dieciocho objetivos." }, ans: "a" },
                    { id: 7, q: "De acuerdo con el artículo 14 de la Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno, el derecho de acceso a la información pública podrá ser limitado cuando acceder a la información suponga un perjuicio para:", o: { a: "La seguridad nacional.", b: "La seguridad e higiene en el trabajo.", c: "La protección del anonimato de los empleados públicos.", d: "La protección de datos de carácter profesional." }, ans: "a" },
                    { id: 8, q: "Según la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿a quién de los siguientes órganos le corresponde la competencia de desempeñar la jefatura superior de todo el personal del Departamento?", o: { a: "Los Secretarios de Estado.", b: "Los Subsecretarios.", c: "Los Directores Generales.", d: "Los Subdirectores Generales." }, ans: "b" },
                    { id: 9, q: "¿A quién le corresponde la representación ordinaria del Estado en la Comunidad Autónoma conforme a lo dispuesto en el artículo 152 de la Constitución Española de 1978?", o: { a: "Al Delegado del Gobierno.", b: "Al Presidente del Gobierno.", c: "Al Presidente de la Comunidad Autónoma.", d: "Al Ministro de Política Territorial y Memoria Democrática." }, ans: "c" },
                    { id: 10, q: "De conformidad con el artículo 121 de la Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local, ¿a qué municipios se les aplicará el régimen de organización de los municipios de gran población?", o: { a: "A los municipios cuya población supere los 100.000 habitantes.", b: "A los municipios capitales de provincia cuya población sea superior a los 75.000 habitantes.", c: "A los municipios que sean capitales de provincia, capitales autonómicas o sedes de las instituciones autonómicas cuando así lo decidan las Asambleas Legislativas correspondientes a iniciativa de los respectivos ayuntamientos.", d: "A los municipios cuya población sea inferior a los 75.000 habitantes, que presenten circunstancias económicas, sociales, históricas o culturales especiales cuando así lo decidan las Asambleas Legislativas correspondientes a iniciativa de los respectivos ayuntamientos." }, ans: "c" },
                    { id: 11, q: "De acuerdo con el artículo 16 del Tratado de la Unión Europea, señale la respuesta correcta respecto del Consejo de la Unión Europea:", o: { a: "Supervisará la aplicación del Derecho de la Unión bajo el control del Tribunal de Justicia de la Unión Europea.", b: "Es el órgano ejecutivo de la Unión Europea y tiene su sede en Bruselas.", c: "Ejerce conjuntamente con el Parlamento Europeo la función legislativa y la función presupuestaria.", d: "Ejerce conjuntamente con la Comisión Europea la función legislativa y la función presupuestaria." }, ans: "c" },
                    { id: 12, q: "Las cartas de servicios, reguladas en el artículo 10.4 del Real Decreto 951/2005, de 29 de julio, por el que se establece el marco general para la mejora de la calidad en la Administración General del Estado, se actualizarán periódicamente en función de las circunstancias y, en cualquier caso, al menos:", o: { a: "Anualmente.", b: "Cada dos años.", c: "Cada tres años.", d: "Cada cuatro años." }, ans: "c" },
                    { id: 13, q: "Según el artículo 16 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, señale la respuesta correcta en materia de registros:", o: { a: "Los Organismos públicos vinculados o dependientes de cada Administración deberán disponer de su propio registro electrónico plenamente interoperable e interconectado con el Registro Electrónico General de la Administración de la que depende.", b: "Cada Administración dispondrá de un Registro Electrónico General donde se deberá anotar la salida de los documentos oficiales provenientes de otros órganos o particulares.", c: "Las disposiciones de creación de registros electrónicos especificarán el órgano o unidad responsable de su gestión, así como la fecha y hora oficial y los días declarados como hábiles.", d: "Los Organismos públicos vinculados o dependientes de cada Administración podrán disponer de su propio registro electrónico plenamente interoperable e interconectado con el Registro Electrónico General de la Administración de la que depende." }, ans: "d" },
                    { id: 14, q: "Según el artículo 40 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, las Administraciones Públicas, en relación con sus sistemas de identificación:", o: { a: "Podrán hacer pública la relación de certificados electrónicos utilizados, incluyendo las características de los sellos electrónicos y los prestadores que los expiden.", b: "Podrán identificarse mediante el uso de un certificado electrónico reconocido o cualificado.", c: "Deberán identificarse mediante el uso de un sello electrónico basado en una firma electrónica reconocida o cualificada que reúna los requisitos exigidos por la legislación de certificado electrónico.", d: "Podrán identificarse mediante el uso de un sello electrónico basado en un certificado electrónico reconocido o cualificado que reúna los requisitos exigidos por la legislación de firma electrónica." }, ans: "d" },
                    { id: 15, q: "Conforme al artículo 5 de la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, ¿quiénes están sujetos al deber de confidencialidad?", o: { a: "Todos los ciudadanos.", b: "Los funcionarios públicos en ejercicio de sus funciones.", c: "Los delegados de prevención de riesgos laborales.", d: "Los responsables y encargados del tratamiento de datos, así como todas las personas que intervengan en cualquier fase de este." }, ans: "d" },
                    { id: 16, q: "Señale la respuesta correcta en relación con el artículo 2 del Código Civil:", o: { a: "Las leyes entrarán en vigor a los quince días de su completa publicación en el Boletín Oficial del Estado, si en ellas no se dispone otra cosa.", b: "Las leyes entrarán en vigor a los veinte días de su completa publicación en el Boletín Oficial del Estado, si en ellas no se dispone otra cosa.", c: "Las leyes entrarán en vigor a los treinta días de su completa publicación en el Boletín Oficial del Estado, si en ellas no se dispone otra cosa.", d: "Las leyes entrarán en vigor al día siguiente de su completa publicación en el Boletín Oficial del Estado, si en ellas no se dispone otra cosa." }, ans: "b" },
                    { id: 17, q: "Conforme al artículo 48 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, son anulables los actos de la Administración:", o: { a: "Contrarios al ordenamiento jurídico por los que se adquieren facultades o derechos cuando se carezca de los requisitos esenciales para su adquisición.", b: "Los dictados por órgano manifiestamente incompetente por razón de la materia o del territorio.", c: "Que incurran en cualquier infracción del ordenamiento jurídico, incluso la desviación de poder.", d: "Los dictados prescindiendo total y absolutamente del procedimiento legalmente establecido." }, ans: "c" },
                    { id: 18, q: "Conforme al artículo 114 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, ponen fin a la vía administrativa:", o: { a: "Las resoluciones que acuerden la aplicación de medidas provisionales.", b: "Los actos emanados de los órganos directivos con nivel de Subdirector General, en relación con las competencias que tengan atribuidas en materia de personal.", c: "Las resoluciones de órganos administrativos, salvo que una disposición legal o reglamentaria disponga lo contrario.", d: "Los acuerdos, pactos, convenios o contratos que tengan la consideración de finalizadores del procedimiento." }, ans: "d" },
                    { id: 19, q: "De acuerdo con el artículo 87 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, antes de dictar resolución, el órgano competente para resolver podrá decidir, mediante acuerdo motivado, la realización de actuaciones complementarias indispensables para resolver el procedimiento. Dichas actuaciones complementarias deberán practicarse en un plazo:", o: { a: "De siete días.", b: "De veinte días.", c: "No inferior a diez días ni superior a quince días.", d: "No superior a quince días." }, ans: "d" },
                    { id: 20, q: "Según el artículo 102 de la Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público en relación con la revisión de precios en los contratos celebrados con precios provisionales:", o: { a: "Podrá admitirse la revisión de precios siempre que el período de recuperación de la inversión sea inferior a cinco años.", b: "Podrá admitirse la revisión de precios siempre que el período de recuperación de la inversión sea igual o superior a cinco años.", c: "Podrá admitirse la revisión de precios cuando el contrato se hubiese ejecutado, al menos, en el 20 por ciento de su importe y hubiese transcurrido un año desde su formalización.", d: "No cabrá la revisión de precios." }, ans: "d" },
                    { id: 21, q: "Según el artículo 2.4 de la Ley 38/2003, de 17 de noviembre, General de Subvenciones, no tienen carácter de subvenciones:", o: { a: "Las otorgadas como consecuencia de la Política Agrícola Común.", b: "Las que financien proyectos relacionados con la ciencia y la tecnología.", c: "Los beneficios fiscales y beneficios en la cotización a la Seguridad Social.", d: "Las destinadas a fomentar actividades de interés social." }, ans: "c" },
                    { id: 22, q: "Conforme al artículo 32.8 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, ¿a quién le corresponde fijar el importe de las indemnizaciones que proceda abonar cuando el Tribunal Constitucional haya declarado, a instancia de parte interesada, la existencia de un funcionamiento anormal en la tramitación de los recursos de amparo o de las cuestiones de inconstitucionalidad?", o: { a: "Al Ministerio de Justicia.", b: "Al Consejo de Ministros.", c: "Al Consejo de Estado.", d: "Al Tribunal Constitucional." }, ans: "b" },
                    { id: 23, q: "Según el artículo 5 de la Ley 4/2023, de 28 de febrero, para la igualdad real y efectiva de las personas trans y para la garantía de los derechos de las personas LGTBI, los poderes públicos:", o: { a: "Fomentarán el reconocimiento institucional y la participación en los actos conmemorativos de la lucha por la igualdad real y efectiva de las personas LGTBI.", b: "Podrán adoptar las medidas necesarias para limitar la diversidad en materia de orientación sexual de las personas LGTBI.", c: "Podrán adoptar las medidas necesarias para poner en valor la identidad cultural y religiosa de las personas LGTBI.", d: "Podrán adoptar las medidas necesarias para poner en valor la identidad racial y cultural de las personas LGTBI." }, ans: "a" },
                    { id: 24, q: "En lo referente al personal laboral, ¿qué es preceptivo de anotación en el Registro Central de Personal conforme al Real Decreto 1405/1986, de 6 de junio?", o: { a: "Tomas de posesión del primer puesto de trabajo y de los sucesivos.", b: "Bajas temporales y definitivas.", c: "Adquisición del grado personal y sus modificaciones.", d: "Reconocimiento de trienios." }, ans: "b" },
                    { id: 25, q: "De acuerdo con el artículo 56 del Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público, para poder participar en los procesos selectivos será necesario:", o: { a: "Poseer nacionalidad española en todo caso.", b: "Conocimiento de la lengua oficial y cooficial del territorio en el que se encuentre la Administración convocante.", c: "Tener cumplidos dieciséis años y no exceder, en su caso, de la edad máxima de jubilación forzosa.", d: "Tener cumplidos dieciocho años y no exceder, en su caso, de la edad máxima de jubilación forzosa." }, ans: "c" },
                    { id: 26, q: "De acuerdo con el artículo 62 del Real Decreto Legislativo 5/2015, de 30 de octubre, la condición de funcionario de carrera se adquiere, además de por la superación del proceso selectivo, por el cumplimiento del siguiente requisito:", o: { a: "No se exige ningún requisito adicional.", b: "Superar un reconocimiento médico que excluya padecer una enfermedad infectocontagiosa.", c: "Presentar el certificado de penales.", d: "La toma de posesión dentro del plazo señalado." }, ans: "d" },
                    { id: 27, q: "De conformidad con el artículo 10 del Real Decreto Legislativo 5/2015, de 30 de octubre, se podrá nombrar personal funcionario interino cuando se dé alguna de las siguientes circunstancias:", o: { a: "La ejecución de programas de carácter temporal, que no podrán tener una duración superior a dos años...", b: "El exceso o acumulación de tareas por plazo máximo de doce meses, dentro de un periodo de dieciocho meses.", c: "La sustitución transitoria de los titulares, durante el tiempo estrictamente necesario.", d: "La existencia de plazas vacantes, cuando no sea posible su cobertura por funcionarios de carrera, por un máximo de cuatro años." }, ans: "d" },
                    { id: 28, q: "De acuerdo con el artículo 3 del Real Decreto 365/1995, de 10 de marzo, los funcionarios de carrera se hallan en situación de servicio activo:", o: { a: "Cuando acceden a la condición de Diputado o Senador.", b: "Cuando se encuentren en comisión de servicios.", c: "Cuando sean transferidos a una comunidad autónoma.", d: "Cuando estén en expectativa de destino." }, ans: "b" },
                    { id: 29, q: "De acuerdo con el artículo 122 del Real Decreto-ley 6/2023, de 19 de diciembre, la carrera profesional horizontal:", o: { a: "La carrera profesional horizontal tendrá carácter voluntario. En cada grupo o subgrupo de personal funcionario existirán cuatro tramos.", b: "La carrera profesional horizontal tendrá carácter voluntario. En cada grupo o subgrupo de personal funcionario existirán cinco tramos.", c: "La carrera profesional horizontal tendrá carácter obligatorio. En cada grupo o subgrupo de personal funcionario existirán cuatro tramos.", d: "La carrera profesional horizontal tendrá carácter obligatorio. En cada grupo o subgrupo de personal funcionario existirán cinco tramos." }, ans: "a" },
                    { id: 30, q: "¿Qué actividades están exceptuadas del régimen de incompatibilidades de la Ley 53/1984, de 26 de diciembre?", o: { a: "La participación en Tribunales calificadores de pruebas selectivas para ingreso en las Administraciones Públicas.", b: "El desempeño de un puesto de trabajo en la esfera docente como profesor universitario asociado...", c: "La participación superior al 10 por 100 en el capital de las empresas o sociedades.", d: "El desempeño de cargos de todo orden en empresas concesionarias del sector público..." }, ans: "a" },
                    { id: 31, q: "De acuerdo con el artículo 5 del Real Decreto Legislativo 4/2000, de 23 de junio, la Mutualidad General de Funcionarios Civiles del Estado (MUFACE) se integra en el Sector Público Institucional Estatal como:", o: { a: "Sociedad Mercantil Estatal.", b: "Consorcio.", c: "Organismo público.", d: "Fundación del Sector Público." }, ans: "c" },
                    { id: 32, q: "Conforme al artículo 2 del IV Convenio Único para el personal laboral de la Administración General del Estado, quedan excluidos del ámbito de aplicación del Convenio el personal laboral que preste servicios en:", o: { a: "La Agencia Española de Protección de Datos.", b: "El Museo Nacional Centro de Arte Reina Sofía.", c: "La Agencia de Información y Control Alimentarios.", d: "El personal laboral que presta servicios en el exterior." }, ans: "d" },
                    { id: 33, q: "De acuerdo con lo dispuesto en el artículo 215 del Real Decreto Legislativo 8/2015, de 30 de octubre, en el supuesto de jubilación parcial del personal laboral sujeto al IV Convenio único que tenga reconocida una discapacidad en grado igual o superior al 33 por ciento, ¿qué período de cotización mínimo se deberá acreditar para acceder a la prestación?", o: { a: "Treinta y tres años.", b: "Treinta años.", c: "Veinticinco años.", d: "Veinte años." }, ans: "c" },
                    { id: 34, q: "Según el artículo 37 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, señale la respuesta correcta en relación con el proyecto de Ley de los Presupuestos Generales del Estado:", o: { a: "El Gobierno deberá presentar ante el Congreso de los Diputados los Presupuestos... seis meses antes.", b: "Corresponderá al Ministro de la Presidencia elevar al acuerdo del Gobierno...", c: "Será remitido a las Cortes Generales antes del día 1 de octubre del año anterior al que se refiera.", d: "Corresponderá al Ministro de Hacienda aprobar el anteproyecto..." }, ans: "c" },
                    { id: 35, q: "De conformidad con el artículo 58 de la Ley 47/2003, de 26 de noviembre, General Presupuestaria, ¿mediante qué se financiarán las incorporaciones de crédito que afecten al presupuesto del Estado?", o: { a: "Baja en el Fondo de Contingencia o baja en otros créditos de operaciones no financieras.", b: "Baja en el Fondo de Contingencia o baja en otros créditos de operaciones no financieras o remanente de tesorería...", c: "Baja en el Fondo de Contingencia o remanente de tesorería al fin del ejercicio anterior, o con mayores ingresos...", d: "Baja en el Fondo de Contingencia, o con mayores ingresos sobre los previstos inicialmente." }, ans: "a" },
                    { id: 36, q: "De conformidad con el artículo 2 de la Ley Orgánica 2/1982, de 12 de mayo, del Tribunal de Cuentas, ¿cuál de las siguientes funciones le corresponde al Tribunal de Cuentas?", o: { a: "El control financiero permanente.", b: "La fiscalización externa, permanente y consuntiva de la actividad económico-financiera del sector público.", c: "La función interventora.", d: "La auditoria pública." }, ans: "b" },
                    { id: 37, q: "Según el artículo 23 de la Ley 30/1984, de 2 de agosto, de medidas para la reforma de la Función Pública, señale la respuesta correcta en relación con los conceptos retributivos:", o: { a: "En el caso de que un funcionario preste sus servicios sucesivamente en diferentes Cuerpos... tendrá derecho a seguir percibiendo los trienios devengados en los grupos anteriores.", b: "Las pagas extraordinarias... se devengarán los meses de junio y diciembre.", c: "Cuando un funcionario cambie de adscripción a grupo antes de completar un trienio, la fracción de tiempo transcurrido se considerará como tiempo de servicios prestados en el anterior grupo.", d: "El complemento específico está destinado a retribuir el especial rendimiento, la actividad extraordinaria y el interés o iniciativa con que el funcionario desempeñe su trabajo." }, ans: "a" },

        let globalIndex = 0;

        function renderizarTest() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            globalIndex = 0;

            examData.forEach((sectionData, sIndex) => {
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'bg-white p-4 md:p-8 rounded-xl shadow-sm border border-slate-200 mb-6';

                const sectionTitle = document.createElement('h2');
                sectionTitle.className = 'text-xl font-bold text-slate-800 mb-4 uppercase tracking-wide border-b border-slate-200 pb-3';
                sectionTitle.innerText = sectionData.section;
                sectionDiv.appendChild(sectionTitle);

                if (sectionData.context) {
                    const contextDiv = document.createElement('div');
                    contextDiv.className = 'bg-slate-50 p-4 rounded-lg border border-slate-200 text-slate-700 italic mb-6 text-sm';
                    contextDiv.innerHTML = `<p class="leading-relaxed"><strong class="not-italic text-indigo-700 block mb-1 font-semibold">Contexto:</strong> ${sectionData.context}</p>`;
                    sectionDiv.appendChild(contextDiv);
                }

                sectionData.questions.forEach((qItem) => {
                    globalIndex++;

                    const questionBlock = document.createElement('div');
                    questionBlock.className = 'mb-6 last:mb-0';
                    
                    const questionTitle = document.createElement('h3');
                    questionTitle.className = 'text-sm font-semibold text-slate-800 mb-2 leading-snug';
                    questionTitle.innerHTML = `<span class="text-indigo-600 mr-1 font-bold">${qItem.id}.</span> ${qItem.q}`;
                    questionBlock.appendChild(questionTitle);

                    const optionsGrid = document.createElement('div');
                    optionsGrid.className = 'space-y-2';

                    for (const [key, text] of Object.entries(qItem.o)) {
                        const label = document.createElement('label');
                        label.className = `option-label flex items-start p-3 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50 relative group bg-white shadow-sm`;
                        label.id = `label-g${globalIndex}-${key}`;

                        const inputWrapper = document.createElement('div');
                        inputWrapper.className = 'flex-shrink-0 mt-0.5 mr-3 relative';

                        const input = document.createElement('input');
                        input.type = 'radio';
                        input.name = `q_global_${globalIndex}`;
                        input.value = key;
                        input.dataset.correct = qItem.ans;
                        input.dataset.sectionIndex = sIndex;
                        input.className = 'opacity-0 absolute inset-0 w-full h-full cursor-pointer z-10';

                        const customRadio = document.createElement('div');
                        customRadio.className = 'custom-radio w-3.5 h-3.5 border border-slate-400 rounded-full group-hover:border-indigo-500 transition-colors';

                        inputWrapper.appendChild(input);
                        inputWrapper.appendChild(customRadio);

                        const textSpan = document.createElement('span');
                        textSpan.className = 'text-slate-700 text-sm leading-tight';
                        textSpan.innerHTML = `<strong class="uppercase mr-1.5 font-semibold text-slate-500">${key})</strong> ${text}`;

                        label.appendChild(inputWrapper);
                        label.appendChild(textSpan);
                        optionsGrid.appendChild(label);
                    }

                    questionBlock.appendChild(optionsGrid);
                    sectionDiv.appendChild(questionBlock);
                });

                // Panel de Resultados Parciales por Sección (Oculto inicialmente)
                const partialResultsDiv = document.createElement('div');
                partialResultsDiv.id = `partial-results-${sIndex}`;
                partialResultsDiv.className = 'hidden mt-6 bg-slate-50 p-4 rounded-xl border border-slate-200 text-center';
                partialResultsDiv.innerHTML = `
                    <h4 class="font-bold text-slate-700 mb-3 uppercase text-sm tracking-wider border-b border-slate-200 pb-2 inline-block">Resultados: ${sectionData.section}</h4>
                    <div class="flex flex-wrap justify-center gap-4 text-sm font-medium">
                        <span class="text-green-700 bg-green-50 px-3 py-1 rounded-md border border-green-200"><span id="partial-aciertos-${sIndex}" class="font-bold">0</span> Aciertos</span>
                        <span class="text-red-700 bg-red-50 px-3 py-1 rounded-md border border-red-200"><span id="partial-fallos-${sIndex}" class="font-bold">0</span> Fallos</span>
                        <span class="text-slate-600 bg-slate-100 px-3 py-1 rounded-md border border-slate-300"><span id="partial-blancos-${sIndex}" class="font-bold">0</span> Blancos</span>
                        <span class="text-indigo-800 bg-indigo-50 px-4 py-1 rounded-md border border-indigo-200 font-bold ml-2">Nota: <span id="partial-nota-${sIndex}">0</span></span>
                    </div>
                `;
                sectionDiv.appendChild(partialResultsDiv);

                container.appendChild(sectionDiv);
            });
        }

        function corregirEjercicio() {
            // Arrays para conteo por bloques
            let aciertosPorSeccion = [0, 0, 0];
            let fallosPorSeccion = [0, 0, 0];
            let blancosPorSeccion = [0, 0, 0];

            let currentIndex = 1;

            const btnCorregir = document.getElementById('btn-corregir');
            btnCorregir.disabled = true;
            btnCorregir.classList.add('opacity-50', 'cursor-not-allowed');
            btnCorregir.innerText = 'Examen Corregido';

            examData.forEach((sectionData, sIndex) => {
                sectionData.questions.forEach((qItem) => {
                    const opcionesInputs = document.querySelectorAll(`input[name="q_global_${currentIndex}"]`);
                    let respondida = false;
                    let seleccionadaKey = null;

                    opcionesInputs.forEach(input => {
                        input.disabled = true;
                        input.classList.remove('cursor-pointer');
                        input.parentElement.parentElement.classList.remove('cursor-pointer', 'hover:bg-slate-50', 'hover:shadow');
                        if(input.checked) {
                            respondida = true;
                            seleccionadaKey = input.value;
                        }
                    });

                    const labelCorrecta = document.getElementById(`label-g${currentIndex}-${qItem.ans}`);

                    if (respondida) {
                        const labelSeleccionada = document.getElementById(`label-g${currentIndex}-${seleccionadaKey}`);
                        
                        if (seleccionadaKey === qItem.ans) {
                            // Acierto
                            aciertosPorSeccion[sIndex]++;
                            labelSeleccionada.className = "option-label flex items-start p-3 border-2 border-green-500 bg-green-50 rounded-lg relative";
                            labelSeleccionada.querySelector('span').classList.add('text-green-900', 'font-medium');
                            labelSeleccionada.querySelector('.custom-radio').classList.add('border-green-500', 'bg-green-500');
                        } else {
                            // Fallo
                            fallosPorSeccion[sIndex]++;
                            labelSeleccionada.className = "option-label flex items-start p-3 border-2 border-red-500 bg-red-50 rounded-lg relative";
                            labelSeleccionada.querySelector('span').classList.add('text-red-900', 'font-medium');
                            labelSeleccionada.querySelector('.custom-radio').classList.add('border-red-500', 'bg-red-500');
                            
                            // Marcar correcta
                            if(labelCorrecta) {
                                labelCorrecta.className = "option-label flex items-start p-3 border border-blue-400 bg-blue-50 rounded-lg relative shadow-inner";
                                labelCorrecta.querySelector('span').classList.add('text-blue-900', 'font-bold');
                            }
                        }
                    } else {
                        // En blanco
                        blancosPorSeccion[sIndex]++;
                        if(labelCorrecta) {
                            labelCorrecta.className = "option-label flex items-start p-3 border border-blue-400 bg-blue-50 rounded-lg relative shadow-inner";
                            labelCorrecta.querySelector('span').classList.add('text-blue-900', 'font-bold');
                        }
                    }

                    currentIndex++;
                });

                // Calcular e inyectar nota de la sección
                const pAciertos = aciertosPorSeccion[sIndex];
                const pFallos = fallosPorSeccion[sIndex];
                const pBlancos = blancosPorSeccion[sIndex];
                let pNota = pAciertos - (pFallos * 0.333);
                if(pNota < 0) pNota = 0;

                document.getElementById(`partial-aciertos-${sIndex}`).innerText = pAciertos;
                document.getElementById(`partial-fallos-${sIndex}`).innerText = pFallos;
                document.getElementById(`partial-blancos-${sIndex}`).innerText = pBlancos;
                document.getElementById(`partial-nota-${sIndex}`).innerText = pNota.toFixed(3);

                // Mostrar el panel parcial
                document.getElementById(`partial-results-${sIndex}`).classList.remove('hidden');
            });

            // Totales
            const totalAciertos = aciertosPorSeccion.reduce((a, b) => a + b, 0);
            const totalFallos = fallosPorSeccion.reduce((a, b) => a + b, 0);
            const totalBlancos = blancosPorSeccion.reduce((a, b) => a + b, 0);
            
            let puntuacionTotal = totalAciertos - (totalFallos * 0.333);
            if (puntuacionTotal < 0) puntuacionTotal = 0;

            document.getElementById('desglose-resultados').innerHTML = `
                <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 bg-green-500 rounded-full"></span> <span class="text-green-700 font-semibold">${totalAciertos} Aciertos</span></div>
                <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 bg-red-500 rounded-full"></span> <span class="text-red-700 font-semibold">${totalFallos} Fallos</span></div>
                <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 bg-slate-400 rounded-full"></span> <span class="text-slate-600 font-medium">${totalBlancos} En blanco</span></div>
            `;
            document.getElementById('puntuacion-final').innerText = `${puntuacionTotal.toFixed(3)} / 110`;
            
            // Mostrar panel total
            const panel = document.getElementById('resultados-panel');
            panel.classList.remove('hidden');
            
            setTimeout(() => {
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }, 100);
        }

        function reiniciarTest() {
            const panel = document.getElementById('resultados-panel');
            panel.classList.add('hidden');
            
            const btnCorregir = document.getElementById('btn-corregir');
            btnCorregir.disabled = false;
            btnCorregir.classList.remove('opacity-50', 'cursor-not-allowed');
            btnCorregir.innerText = 'Corregir Ejercicio';

            renderizarTest();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = renderizarTest;

    </script>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esquemas y Test AGE - Tema 5 (Gestión Financiera)</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #333333;
            --green: #d4edda;
            --green-text: #155724;
            --green-border: #c3e6cb;
            --red: #f8d7da;
            --red-text: #721c24;
            --red-border: #f5c6cb;
            --blue: #e6f2ff;
            --blue-text: #004085;
            --primary: #007bff;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            font-size: 16px;
            line-height: 1.6;
        }

        nav {
            position: sticky;
            top: 0;
            background: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            overflow-x: auto;
            z-index: 1000;
            padding: 10px;
            gap: 10px;
            -webkit-overflow-scrolling: touch;
        }

        .nav-btn {
            padding: 12px 20px;
            border: none;
            background: #e9ecef;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 16px;
            font-weight: 500;
            color: var(--text);
            transition: background 0.2s;
        }

        .nav-btn:hover {
            background: #dee2e6;
        }

        .nav-btn.active {
            background: var(--primary);
            color: #ffffff;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            padding: 20px;
            margin-bottom: 20px;
        }

        .header-links {
            text-align: center;
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .header-links a {
            color: var(--primary);
            text-decoration: none;
            margin: 0 10px;
        }

        .header-links a:hover {
            text-decoration: underline;
        }

        .btn-action {
            padding: 14px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            font-size: 16px;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        .btn-reset {
            background: #6c757d;
        }

        .btn-speech {
            background: var(--primary);
            width: 100%;
            margin-bottom: 20px;
        }

        .option-label {
            display: block;
            padding: 15px;
            margin: 8px 0;
            border: 1px solid #ced4da;
            border-radius: 6px;
            cursor: pointer;
            background: #ffffff;
            transition: background 0.1s;
        }

        .option-label:hover {
            background: #f8f9fa;
        }

        .option-label input {
            margin-right: 12px;
            transform: scale(1.3);
        }

        .correct {
            background-color: var(--green) !important;
            color: var(--green-text);
            border-color: var(--green-border);
            font-weight: bold;
        }

        .incorrect {
            background-color: var(--red) !important;
            color: var(--red-text);
            border-color: var(--red-border);
        }

        .explanation {
            background-color: var(--blue);
            color: var(--blue-text);
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            display: none;
            font-size: 0.95em;
            border: 1px solid #b8daff;
        }

        .hidden {
            display: none;
        }

        .score {
            font-size: 1.3em;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: #fff3cd;
            color: #856404;
            border-radius: 6px;
            border: 1px solid #ffeeba;
        }

        @media (max-width: 768px) {
            .btn-action {
                width: 100%;
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>

    <nav id="main-nav">
        <!-- Generado por JS -->
    </nav>

    <div class="container">
        <div id="esquema-content" class="tab-content">
            <!-- Generado por JS -->
        </div>
        <div id="test-container">
            <!-- Generado por JS -->
        </div>
    </div>

    <script>
        // ==========================================
        // BASE DE CONOCIMIENTO (Esquema: 40 Preguntas)
        // ==========================================
        const esquemaPreguntas = [
            {
                pregunta: "¿Qué características deben reunir los bienes para que sus gastos se imputen al Capítulo 2 (Gastos corrientes en bienes y servicios)?",
                respuesta_detallada: "Deben reunir alguna de las siguientes características: ser bienes fungibles, tener una duración previsiblemente inferior al ejercicio presupuestario, no ser susceptibles de inclusión en inventario o ser, previsiblemente, gastos reiterativos. También se aplican los bienes de carácter inmaterial reiterativos, no amortizables y no relacionados con inversiones."
            },
            {
                pregunta: "¿Qué tipo de gastos están expresamente prohibidos en el Capítulo 2?",
                respuesta_detallada: "No podrán imputarse a los créditos de este capítulo los gastos destinados a satisfacer cualquier tipo de retribución por los servicios prestados o trabajos realizados por el personal dependiente de los departamentos, organismos autónomos, agencias estatales y otros organismos públicos respectivos, cualquiera que sea la forma de esa dependencia."
            },
            {
                pregunta: "¿Qué conceptos se incluyen en el artículo 20 de Arrendamientos y cánones?",
                respuesta_detallada: "Se refiere a la utilización de inmovilizado material e inmaterial que no es propiedad del Estado. Incluye arrendamientos de: terrenos y bienes naturales (200), edificios y otras construcciones (202), maquinaria, instalaciones y utillaje (203), medios de transporte (204), mobiliario y enseres (205), equipos para procesos de información (206), otro inmovilizado (208) y cánones (209)."
            },
            {
                pregunta: "¿Cuál es el límite para imputar una reparación al artículo 21 en lugar de al Capítulo 6?",
                respuesta_detallada: "El artículo 21 comprende reparaciones, mantenimiento y conservación que no supongan incremento de superficie, aumento de valor o transformación completa de bienes de capital; ya que, en caso de aumento de valor o transformación, se computarán como Inversiones del Capítulo 6."
            },
            {
                pregunta: "¿A qué concepto del artículo 22 se imputan los suministros energéticos y el vestuario?",
                respuesta_detallada: "Se imputan al concepto 221 'Suministros'. Este incluye energía eléctrica, agua, gas, combustible, vestuario, productos alimenticios y farmacéuticos, suministros militares/policiales, deportivos y didácticos, así como labores de la Fábrica Nacional de Moneda y Timbre."
            },
            {
                pregunta: "¿Qué gastos de transporte se excluyen del concepto 223?",
                respuesta_detallada: "El concepto 223 'Transportes' incluye todo tipo de transportes (terrestres, marítimos, aéreos) excepto los de personal, los cuales se regulan mediante indemnizaciones en el artículo 23."
            },
            {
                pregunta: "¿En qué concepto del Capítulo 2 se recogen los gastos de oposiciones y publicidad?",
                respuesta_detallada: "Se recogen en el concepto 226 'Gastos diversos'. Este concepto abarca atenciones protocolarias y representativas, publicidad y propaganda, jurídico-contenciosos, reuniones, conferencias, oposiciones y pruebas selectivas, gastos reservados y actividades culturales/deportivas."
            },
            {
                pregunta: "¿Qué supuestos dan origen a indemnización según el artículo 23?",
                respuesta_detallada: "Dan origen a indemnización (conceptos 230 a 233: Dietas, Locomoción, Traslado, Otras): las comisiones de servicio, desplazamientos dentro del término municipal, traslados de residencia, y asistencias a sesiones de órganos colegiados o tribunales de oposiciones."
            },
            {
                pregunta: "¿Qué gastos se imputan a los artículos 24, 25 y 27 respectivamente?",
                respuesta_detallada: "Artículo 24: Gastos de publicaciones (edición y distribución). Artículo 25: Conciertos de asistencia sanitaria (con Seguridad Social o Entidades libres). Artículo 27: Compras, suministros y otros gastos directamente relacionados con la actividad de las Agencias Estatales."
            },
            {
                pregunta: "¿Qué operaciones comprenden los gastos de Inversión del Capítulo 6?",
                respuesta_detallada: "Incluye los gastos realizados directamente por el Estado o sus OO.AA. destinados a la creación o adquisición de bienes de capital (Inversiones Reales), así como gastos inmateriales amortizables."
            },
            {
                pregunta: "¿Cómo se clasifican las inversiones a nivel de artículo (60 a 64) en el ámbito civil?",
                respuesta_detallada: "Art. 60: Inversión nueva en infraestructura/uso general. Art. 61: Inversión de reposición en infraestructura/uso general. Art. 62: Inversión nueva asociada al funcionamiento operativo. Art. 63: Inversión de reposición asociada al funcionamiento operativo. Art. 64: Inversiones de carácter inmaterial."
            },
            {
                pregunta: "¿Qué diferencia las transferencias corrientes (Cap. 4) de las transferencias de capital (Cap. 7)?",
                respuesta_detallada: "Ambas son pagos sin contrapartida directa. La distinción radica en la finalidad que les dé el agente perceptor: si destinan los fondos a financiar operaciones corrientes serán del Capítulo 4; si los destinan a operaciones de capital (inversiones), serán del Capítulo 7."
            },
            {
                pregunta: "¿A qué agentes receptores corresponden los artículos 40/70, 41/71 y 42/72?",
                respuesta_detallada: "40/70: A la Administración del Estado (AGE). 41/71: A Organismos Autónomos. 42/72: A la Seguridad Social."
            },
            {
                pregunta: "¿A qué agentes receptores corresponden los artículos 45/75 y 46/76?",
                respuesta_detallada: "45/75: A Comunidades Autónomas. 46/76: A Entidades Locales."
            },
            {
                pregunta: "¿A qué agentes receptores corresponden los artículos 47/77 y 48/78?",
                respuesta_detallada: "47/77: A Empresas Privadas. 48/78: A Familias e Instituciones sin fines de lucro."
            },
            {
                pregunta: "¿Cómo se consignan los créditos del Mecanismo de Recuperación y Resiliencia en los Capítulos 1 y 2?",
                respuesta_detallada: "En el Capítulo 1 (gastos de personal), los créditos del Mecanismo se recogerán en el artículo 19. En el Capítulo 2 (gastos corrientes en bienes y servicios), se recogerán en el artículo 29."
            },
            {
                pregunta: "¿Cómo se consignan los créditos del Mecanismo de Recuperación y Resiliencia en los Capítulos 6, 8 y 9?",
                respuesta_detallada: "En el Capítulo 6 (inversiones reales), se consignarán en el artículo 69. En los Capítulos 8 y 9 (activos y pasivos financieros), se consignarán en los conceptos específicos recogidos en el anexo II de la orden de elaboración de PGE-2025."
            },
            {
                pregunta: "¿Qué es el pago en la gestión financiera del Estado?",
                respuesta_detallada: "Es la operación contable que refleja el acto por el que el representante autorizado, tras reconocer una obligación a pagar a favor de un interesado, solicita al Director General del Tesoro y Política Financiera (Ordenador General de Pagos) la ordenación del pago. Materialmente, es toda salida virtual o de fondos de las Cajas del Tesoro."
            },
            {
                pregunta: "¿Qué diferencia existe entre el pago formal y el pago material?",
                respuesta_detallada: "El pago formal es la orden del Director General del Tesoro y Política Financiera (ordenación del pago). El pago material conlleva el señalamiento del pago y la extensión del talón contra la cuenta corriente del Tesoro en el Banco de España o transferencia (materialización)."
            },
            {
                pregunta: "¿Cómo se clasifican los pagos por su forma (reales, virtuales y mixtos)?",
                respuesta_detallada: "Reales: salida material de fondos. Virtuales: salida no material derivada de compensación contable (el acreedor es también deudor). Mixtos: reales y virtuales simultáneamente (ej. mandamientos con descuentos)."
            },
            {
                pregunta: "¿Qué diferencia a los pagos en firme de los pagos a justificar?",
                respuesta_detallada: "Pagos en firme: se realizan conociendo, a través de documentos justificativos, la cuantía exacta de la obligación. Pagos a justificar: se realizan excepcionalmente sin que sea factible adjuntar los documentos justificativos en el momento de expedir la orden de pago."
            },
            {
                pregunta: "¿Qué diferencia existe entre pagos de ejercicio corriente y de presupuestos cerrados?",
                respuesta_detallada: "Ejercicio corriente: cancelan obligaciones con cargo a créditos del presupuesto vigente en el año del pago. Presupuestos cerrados: atienden obligaciones contraídas con cargo a presupuestos de ejercicios anteriores que se materializan en el actual."
            },
            {
                pregunta: "¿Qué son los Anticipos de Caja Fija (art. 78 LGP)?",
                respuesta_detallada: "Son provisiones de fondos de carácter extrapresupuestario y permanente que se realizan a pagadurías para la atención inmediata y posterior aplicación al capítulo 2 (gastos corrientes) del presupuesto del año en curso, para gastos periódicos o repetitivos."
            },
            {
                pregunta: "¿Cuál es la cuantía global límite para los Anticipos de Caja Fija (ACF)?",
                respuesta_detallada: "Como norma general, la cuantía global de los ACF no podrá superar para cada Ministerio u Organismo Autónomo el 7% del total de créditos del capítulo 2 de su presupuesto vigente."
            },
            {
                pregunta: "¿Qué excepciones al límite del 7% existen para los Anticipos de Caja Fija?",
                respuesta_detallada: "La Agencia Española de Cooperación Internacional (AECID) puede alcanzar hasta el 14%. El programa 1322A 'Seguridad ciudadana' (Interior) admite hasta un 10% adicional para el art. 23. Las entidades de la SS tienen un límite del 3%, elevable hasta el 7% por el Ministro."
            },
            {
                pregunta: "¿Qué ocurre con los pagos inferiores a 600 euros si se establece el ACF?",
                respuesta_detallada: "Cuando se haya establecido el sistema de ACF, no podrán tramitarse libramientos directos al presupuesto a favor de perceptores por importe inferior a 600 euros; es obligatorio utilizar el ACF para ellos."
            },
            {
                pregunta: "¿Cuál es el límite cuantitativo para los pagos individualizados con cargo al ACF?",
                respuesta_detallada: "No podrán realizarse con cargo al ACF pagos individualizados superiores a 5.000 euros. Como excepción, sí pueden superar este límite los gastos de teléfono, energía eléctrica, combustibles o indemnizaciones por razón del servicio."
            },
            {
                pregunta: "¿Dónde se sitúan los fondos de los Anticipos de Caja Fija?",
                respuesta_detallada: "Se abonan mediante transferencia a cuentas corrientes en el Banco de España dentro de la agrupación 'Tesoro Público. Provisión de fondos'. Excepcionalmente (art. 108 LGP), pueden abrirse en entidades de crédito autorizadas."
            },
            {
                pregunta: "¿Cómo se autoriza la disposición de fondos de los Anticipos de Caja Fija?",
                respuesta_detallada: "Mediante cheques nominativos o transferencias bancarias, que deben ser autorizados con las firmas mancomunadas del cajero pagador y del funcionario designado por el Jefe de la Unidad Administrativa (o sus sustitutos)."
            },
            {
                pregunta: "¿Cuándo deben reponerse los fondos y rendir cuentas los Cajeros en los ACF?",
                respuesta_detallada: "Rendirán cuentas a medida que sus necesidades de tesorería aconsejen la reposición de los fondos utilizados, y obligatoriamente, en el mes de diciembre de cada año."
            },
            {
                pregunta: "¿Cuándo procede emitir órdenes de pago 'a justificar' (art. 79 LGP)?",
                respuesta_detallada: "Excepcionalmente, cuando no pueda aportarse la previa acreditación documental de la prestación, para gastos en el extranjero, o para satisfacer gastos en localidades donde no exista dependencia del Ministerio/Organismo."
            },
            {
                pregunta: "¿A qué ejercicio presupuestario se imputan las obligaciones en los pagos a justificar?",
                respuesta_detallada: "Exclusivamente a obligaciones exigibles en el ejercicio presupuestario al que corresponde el libramiento. No obstante, el Consejo de Ministros puede acordar que los fondos librados al extranjero atiendan gastos del ejercicio siguiente si es relevante para el interés general."
            },
            {
                pregunta: "¿Cuáles son los plazos para rendir las cuentas en los pagos a justificar?",
                respuesta_detallada: "El plazo general es de 3 meses. Para pagos de expropiaciones y en el extranjero es de 6 meses. Excepcionalmente, pueden ampliarse a 6 meses (general) y 12 meses (expropiaciones/extranjero) respectivamente."
            },
            {
                pregunta: "¿Qué plazo tiene la Autoridad para aprobar o reparar la cuenta de un pago a justificar?",
                respuesta_detallada: "Se llevará a cabo en el curso de los dos meses siguientes a la fecha de aportación de los documentos justificativos correspondientes."
            },
            {
                pregunta: "¿Qué debe incluirse obligatoriamente en todas las propuestas de pago a justificar?",
                respuesta_detallada: "Será obligatorio incluir un calendario de las actuaciones que se pretenda financiar con el libramiento, para desglosar anualidades si existen gastos plurianuales."
            },
            {
                pregunta: "¿Qué sucede con la cantidad no invertida de un pago a justificar?",
                respuesta_detallada: "La cantidad no invertida en el ejercicio en que se aprobó el libramiento debe ser reintegrada al Tesoro Público, justificándose mediante carta de pago demostrativa de dicho reintegro por el cajero pagador."
            },
            {
                pregunta: "¿Qué documentación genérica justifica un mandamiento de pago?",
                respuesta_detallada: "Incluye: a) Aprobación del gasto, b) Obligación reconocida (conformidad de obras/servicios), c) Extensión del libramiento al acreedor, y d) Materialización del pago (firma del 'recibí')."
            },
            {
                pregunta: "¿Cómo se justifican específicamente los gastos de luz, agua y teléfono?",
                respuesta_detallada: "Con la copia de la orden de aprobación del gasto, las facturas originales selladas y conformadas, certificación del Jefe de la Dependencia de recepción de conformidad, y contrato en su caso."
            },
            {
                pregunta: "¿Cómo se justifica el pago de una Inversión o proyecto de obra por contrato?",
                respuesta_detallada: "Copia de aprobación del gasto, certificación de la obra firmada por el facultativo director, copia del presupuesto (precios y cubicaciones), y si es la primera certificación, copia del contrato. Si es la última, el acta de recepción."
            },
            {
                pregunta: "¿Qué entidades aprueban las normas para expedir órdenes de pago a justificar y anticipos de caja fija?",
                respuesta_detallada: "Los Ministros Jefes de los Departamentos y los Presidentes/Directores de los Organismos Autónomos, siempre previo informe del Interventor Delegado en ambos casos."
            }
        ];

        // ==========================================
        // BASE DE PREGUNTAS TIPO TEST (Pool Maestro)
        // ==========================================
        const baseTestQuestions = [
            {
                pregunta: "Según el artículo 40 de la LGP, ¿qué características NO corresponden a los bienes del Capítulo 2?",
                opciones: [
                    "Ser bienes fungibles.",
                    "Tener una duración previsiblemente superior al ejercicio presupuestario.",
                    "No ser susceptibles de inclusión en inventario.",
                    "Ser gastos previsiblemente reiterativos."
                ],
                respuesta_correcta: 1,
                explicacion: "Para imputarse al Capítulo 2, los bienes deben tener una duración previsiblemente inferior (no superior) al ejercicio presupuestario."
            },
            {
                pregunta: "¿En qué concepto del artículo 22 se incluyen los gastos de oposiciones y pruebas selectivas?",
                opciones: [
                    "220 'Material de oficina'.",
                    "226 'Gastos diversos'.",
                    "227 'Trabajos realizados por otras empresas'.",
                    "Ninguno, corresponden al Capítulo 1."
                ],
                respuesta_correcta: 1,
                explicacion: "El concepto 226 'Gastos diversos' comprende atenciones protocolarias, publicidad, jurídicos, conferencias, oposiciones y pruebas selectivas, entre otros."
            },
            {
                pregunta: "¿Qué artículo del Presupuesto recoge los gastos de conciertos de asistencia sanitaria?",
                opciones: ["Artículo 22.", "Artículo 23.", "Artículo 24.", "Artículo 25."],
                respuesta_correcta: 3,
                explicacion: "El artículo 25 se dedica exclusivamente a los Conciertos de asistencia sanitaria (con la Seguridad Social, entidades de seguro libre u otros)."
            },
            {
                pregunta: "Respecto a las Inversiones Reales (Capítulo 6), ¿cuál es el código de Inversión de reposición en infraestructura y bienes destinados al uso general?",
                opciones: ["Artículo 60.", "Artículo 61.", "Artículo 62.", "Artículo 63."],
                respuesta_correcta: 1,
                explicacion: "El artículo 60 es 'inversión nueva' y el artículo 61 es 'inversión de reposición' en infraestructuras y bienes de uso general."
            },
            {
                pregunta: "¿Cuál es la diferencia fundamental entre transferencias corrientes y de capital?",
                opciones: [
                    "La naturaleza jurídica del ente emisor.",
                    "La existencia o no de contrapartida directa.",
                    "El destino que el agente perceptor debe dar a los fondos.",
                    "A y B son correctas."
                ],
                respuesta_correcta: 2,
                explicacion: "Ambas carecen de contrapartida directa. La distinción (Capítulo 4 vs Capítulo 7) radica en la finalidad que el perceptor asigne a los fondos (operaciones corrientes o de capital/inversiones)."
            },
            {
                pregunta: "Señale la correspondencia correcta de los agentes receptores de transferencias:",
                opciones: [
                    "Art. 45/75 a Familias.",
                    "Art. 46/76 a Entidades locales.",
                    "Art. 47/77 al Exterior.",
                    "Art. 48/78 a Comunidades Autónomas."
                ],
                respuesta_correcta: 1,
                explicacion: "Los arts. 46 y 76 corresponden a Entidades Locales. 45/75 son CCAA, 47/77 Empresas, 48/78 Familias y 49/79 Exterior."
            },
            {
                pregunta: "¿En qué artículo se consignan los créditos del Mecanismo de Recuperación y Resiliencia correspondientes al capítulo 6?",
                opciones: ["Artículo 19.", "Artículo 29.", "Artículo 69.", "En el anexo II en su totalidad."],
                respuesta_correcta: 2,
                explicacion: "En el capítulo 6 de inversiones reales, los créditos vinculados al Mecanismo de Recuperación y Resiliencia se consignarán en el art. 69."
            },
            {
                pregunta: "El pago que consiste en una compensación contable, sin salida material de fondos, se denomina:",
                opciones: ["Pago a justificar.", "Pago virtual.", "Pago mixto.", "Pago en firme."],
                respuesta_correcta: 1,
                explicacion: "Los pagos virtuales son aquellos derivados de compensación contable en los que el acreedor es al mismo tiempo deudor, no habiendo salida material."
            },
            {
                pregunta: "¿A qué se destinan los pagos aplicados a presupuestos cerrados?",
                opciones: [
                    "A gastos del ejercicio actual que se aplazan.",
                    "A obligaciones reconocidas en el ejercicio corriente pero no pagadas.",
                    "A atender obligaciones contraídas con cargo a presupuestos de gastos de ejercicios anteriores.",
                    "A operaciones extrapresupuestarias."
                ],
                respuesta_correcta: 2,
                explicacion: "Los pagos a presupuestos cerrados atienden obligaciones legalmente reconocidas con cargo a los presupuestos de ejercicios ya terminados (cerrados)."
            },
            {
                pregunta: "Sobre los Anticipos de Caja Fija (ACF), señale la afirmación correcta:",
                opciones: [
                    "Tienen carácter presupuestario desde el momento de la provisión de fondos.",
                    "Sirven para atender pagos de los Capítulos 2 y 6.",
                    "Son provisiones de fondos extrapresupuestarias y permanentes.",
                    "Su límite general es del 10% de los créditos del capítulo 2."
                ],
                respuesta_correcta: 2,
                explicacion: "Los ACF son provisiones de fondos de carácter extrapresupuestario y permanente, aplicables únicamente al capítulo 2, con un límite general del 7%."
            },
            {
                pregunta: "Como regla general, no podrán realizarse con cargo al Anticipo de Caja Fija pagos individualizados superiores a:",
                opciones: ["600 euros.", "3.000 euros.", "5.000 euros.", "15.000 euros."],
                respuesta_correcta: 2,
                explicacion: "El límite superior es de 5.000 euros por pago individualizado, salvo excepciones tasadas como energía, teléfono, combustibles o indemnizaciones."
            },
            {
                pregunta: "Respecto a los pagos inferiores a 600 euros, si existe Anticipo de Caja Fija en el Ministerio:",
                opciones: [
                    "Pueden tramitarse libremente libramientos directos.",
                    "No podrán tramitarse libramientos directos al presupuesto, es obligatorio usar el ACF.",
                    "Requieren autorización previa del Ministro.",
                    "Se tramitan obligatoriamente como pagos a justificar."
                ],
                respuesta_correcta: 1,
                explicacion: "El RD 725/1989 establece que no podrán tramitarse libramientos directos inferiores a 600 euros; deben canalizarse por el Anticipo de Caja Fija."
            },
            {
                pregunta: "¿Cuándo deben reponer los fondos los Cajeros Pagadores en el sistema de Anticipos de Caja Fija?",
                opciones: [
                    "Mensualmente, el día 1 de cada mes.",
                    "Únicamente al final del ejercicio (diciembre).",
                    "A medida que las necesidades lo aconsejen y necesariamente en el mes de diciembre.",
                    "Trimestralmente coincidiendo con el control de tesorería."
                ],
                respuesta_correcta: 2,
                explicacion: "Rendirán cuentas y repondrán fondos a medida que las necesidades de tesorería lo aconsejen, y obligatoriamente en el mes de diciembre."
            },
            {
                pregunta: "Los pagos tramitados cuando, excepcionalmente, no puede aportarse la previa acreditación documental de la prestación, se denominan:",
                opciones: ["Pagos en firme.", "Anticipos de Caja Fija.", "Pagos a justificar.", "Pagos mixtos."],
                respuesta_correcta: 2,
                explicacion: "El art. 79 de la LGP define así los pagos a justificar, utilizables cuando no se puede aportar la documentación previa a la expedición del libramiento."
            },
            {
                pregunta: "¿Cuál es el plazo de rendición de cuentas para un pago a justificar en territorio nacional (no expropiación)?",
                opciones: ["Un mes.", "Dos meses.", "Tres meses.", "Seis meses."],
                respuesta_correcta: 2,
                explicacion: "El plazo general de rendición de cuentas de los libramientos a justificar es de tres meses, ampliable excepcionalmente a seis."
            },
            {
                pregunta: "En los pagos a justificar en el extranjero, el plazo de rendición de cuentas de:",
                opciones: [
                    "3 meses.",
                    "6 meses.",
                    "12 meses por defecto.",
                    "Exento de plazo determinado, a criterio del embajador."
                ],
                respuesta_correcta: 1,
                explicacion: "El plazo de rendición en el extranjero y en expropiaciones es de seis meses, ampliable excepcionalmente hasta doce meses."
            },
            {
                pregunta: "¿A quién corresponde autorizar las firmas mancomunadas para la disposición de fondos del Anticipo de Caja Fija?",
                opciones: [
                    "El Director General del Tesoro.",
                    "Únicamente al Cajero pagador en solitario.",
                    "Al Cajero pagador y al funcionario designado por el Jefe de la Unidad Administrativa.",
                    "A y B son correctas."
                ],
                respuesta_correcta: 2,
                explicacion: "Se exigen firmas mancomunadas del cajero pagador y del funcionario designado por el Jefe de la Unidad Administrativa. No puede recaer la sustitución de ambos en la misma persona."
            },
            {
                pregunta: "¿En qué artículo se imputan los trabajos realizados por otras empresas (seguridad, limpieza)?",
                opciones: ["220.", "221.", "226.", "227."],
                respuesta_correcta: 3,
                explicacion: "El concepto 227 abarca limpiezas, aseos, seguridad, custodias, procesos electorales y estudios y trabajos técnicos de otras empresas."
            },
            {
                pregunta: "En la documentación justificativa de mandamientos, ¿qué se exige para las comisiones de servicio en el extranjero además de la documentación nacional?",
                opciones: [
                    "Certificado de vacunación.",
                    "Copia de las hojas del pasaporte donde figuren visados de entrada y salida.",
                    "Autorización del Consejo de Ministros obligatoria.",
                    "Factura proforma del hotel."
                ],
                respuesta_correcta: 1,
                explicacion: "Se especifica que el interesado acompañará copia de las hojas del pasaporte o documento sustitutorio con los visados de entrada y salida del territorio nacional."
            },
            {
                pregunta: "El límite del 7% global para el Anticipo de Caja Fija, ¿puede ampliarse en algún caso?",
                opciones: [
                    "No, es un límite infranqueable establecido por la LGP.",
                    "Sí, para la Agencia Española de Cooperación Internacional puede exceder hasta un máximo del 14%.",
                    "Sí, pero solo para gastos de expropiaciones.",
                    "A y C son correctas."
                ],
                respuesta_correcta: 1,
                explicacion: "La LGP autoriza explícitamente a la Agencia Española de Cooperación Internacional para superar el 7%, hasta un límite máximo del 14% de los créditos del capítulo 2."
            },
            {
                pregunta: "¿Qué órgano retiene las propuestas de pago que no se acomodan al presupuesto monetario (plan de disposición de fondos)?",
                opciones: [
                    "La Dirección General del Tesoro y Política Financiera.",
                    "La Caja Pagadora Central.",
                    "El Tribunal de Cuentas.",
                    "La Intervención General de la Administración del Estado."
                ],
                respuesta_correcta: 0,
                explicacion: "Es la Dirección General del Tesoro y Política Financiera quien comprueba si las propuestas se acomodan al plan de disposición de fondos y retiene las que no lo hacen."
            },
            {
                pregunta: "Si del calendario de un pago a justificar se derivara la existencia de gastos plurianuales:",
                opciones: [
                    "El libramiento es nulo de pleno derecho.",
                    "Se cargan todos al ejercicio corriente sin desglosar.",
                    "Se tramitará un expediente de gastos que desglose las anualidades del ejercicio corriente y posteriores.",
                    "Debe intervenir obligatoriamente el Consejo de Ministros."
                ],
                respuesta_correcta: 2,
                explicacion: "La LGP exige que si del calendario se derivan gastos plurianuales, se tramite un expediente que desglose las anualidades correspondientes."
            },
            {
                pregunta: "¿Qué artículo imputa el arrendamiento de mobiliario y enseres?",
                opciones: ["202.", "204.", "205.", "206."],
                respuesta_correcta: 2,
                explicacion: "El código 205 corresponde a 'Arrendamientos mobiliario y enseres'."
            },
            {
                pregunta: "Señale qué gasto se imputaría al capítulo 6 y NO al 2:",
                opciones: [
                    "Bienes fungibles.",
                    "Gasto reiterativo de material de oficina.",
                    "Reparación de un inmueble que supone incremento de superficie.",
                    "Adquisición de combustible."
                ],
                respuesta_correcta: 2,
                explicacion: "Las reparaciones que supongan incremento de superficie, aumento de valor o transformación completa de bienes de capital se computan como Inversiones del Capítulo 6."
            }
        ];

        // Duplicar y modificar preguntas para crear un pool de 60-100 para nutrir 10 tests sin excesiva repetición literal
        const poolAmpliado = [];
        let iter = 0;
        // Hacemos suficientes copias barajadas para garantizar la disponibilidad
        while(poolAmpliado.length < 250) {
            let q = baseTestQuestions[iter % baseTestQuestions.length];
            // Deep copy simple
            let copia = JSON.parse(JSON.stringify(q));
            // Ocasionalmente invertir o desordenar las opciones A,B,C,D (siempre que no sean del tipo "A y B correctas")
            if(!copia.opciones.some(o => o.includes("correctas") || o.includes("anteriores"))) {
                let optionsData = copia.opciones.map((opt, i) => ({ text: opt, isCorrect: i === copia.respuesta_correcta }));
                optionsData.sort(() => 0.5 - Math.random());
                copia.opciones = optionsData.map(o => o.text);
                copia.respuesta_correcta = optionsData.findIndex(o => o.isCorrect);
            }
            poolAmpliado.push(copia);
            iter++;
        }

        // ==========================================
        // GENERACIÓN DE LOS 10 EXÁMENES DE 20 PREGUNTAS
        // ==========================================
        const examenes = [];
        for (let i = 0; i < 10; i++) {
            // Extraer 20 preguntas del pool ampliado de forma secuencial (el pool ya ha sido desordenado conceptualmente)
            let testChunk = poolAmpliado.slice(i * 20, (i * 20) + 20);
            // Randomizar el orden interno del test
            testChunk.sort(() => 0.5 - Math.random());
            examenes.push(testChunk);
        }

        // ==========================================
        // LÓGICA DE UI Y CONTROL DEL DOM
        // ==========================================
        document.addEventListener("DOMContentLoaded", () => {
            renderNav();
            renderEsquema();
            renderExamenes();
        });

        function renderNav() {
            const nav = document.getElementById("main-nav");
            let html = `<button id="btn-esquema" class="nav-btn active" onclick="showTab('esquema')">📖 Esquema de Estudio</button>`;
            for (let i = 0; i < 10; i++) {
                html += `<button id="btn-test-${i}" class="nav-btn" onclick="showTab('test-${i}')">📝 Test ${i + 1}</button>`;
            }
            nav.innerHTML = html;
        }

        function renderEsquema() {
            const container = document.getElementById("esquema-content");
            let html = `
                <div class="header-links">
                    <a href="tema5_gestion_financiera claude.html" target="_blank">tema5_gestion_financiera claude.html</a> | 
                    <a href="tema5_gestion_financiera copilot.html" target="_blank">tema5_gestion_financiera copilot.html</a> | 
                    Documentos Oficiales: 
                    <a href="Tema_05.pdf" target="_blank">Tema_05.pdf</a> | 
                    <a href="Tema_05anexo.pdf" target="_blank">Tema_05anexo.pdf</a>
                </div>
                <button id="btnSpeech" class="btn-action btn-speech" onclick="toggleSpeech()">🔊 Escuchar Tema Completo</button>
            `;
            
            esquemaPreguntas.forEach((q, i) => {
                html += `
                    <div class="card">
                        <h3 style="margin-top:0; color: #0056b3;">${i + 1}. ${q.pregunta}</h3>
                        <p style="margin-bottom:0; font-size: 1.05em;"><strong>Respuesta:</strong> ${q.respuesta_detallada}</p>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderExamenes() {
            const container = document.getElementById("test-container");
            let html = "";
            examenes.forEach((examen, i) => {
                html += `<div id="test-${i}-content" class="tab-content hidden">
                    <div class="header-links">
                        <strong>Simulador Test ${i + 1}</strong> (20 preguntas extraídas del Tema 5)
                    </div>
                    <div id="score-${i}" class="score hidden"></div>`;
                
                examen.forEach((q, j) => {
                    html += `
                    <div class="card" id="q-${i}-${j}">
                        <h4 style="margin-top:0;">${j + 1}. ${q.pregunta}</h4>
                        <div class="options">`;
                    
                    const letras = ['A)', 'B)', 'C)', 'D)'];
                    q.opciones.forEach((opt, k) => {
                        html += `
                            <label class="option-label" id="lbl-${i}-${j}-${k}">
                                <input type="radio" name="r-${i}-${j}" value="${k}">
                                <strong>${letras[k]}</strong> ${opt}
                            </label>`;
                    });
                    
                    html += `
                        </div>
                        <div id="exp-${i}-${j}" class="explanation">
                            <strong>Fundamentación jurídica:</strong> ${q.explicacion} <br><br>
                            <em>La respuesta correcta es la <strong>${letras[q.respuesta_correcta].replace(')', '')}</strong>.</em>
                        </div>
                    </div>`;
                });
                
                html += `
                    <div style="text-align:center; padding: 20px 0;">
                        <button class="btn-action" onclick="corregirTest(${i})" style="width: 100%; max-width: 300px;">✅ Corregir Examen</button>
                        <button class="btn-action btn-reset" onclick="reiniciarTest(${i})" style="width: 100%; max-width: 300px;">🔄 Reiniciar Test</button>
                    </div>
                    <div id="score-bottom-${i}" class="score hidden"></div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function showTab(tabId) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));

            if (tabId === 'esquema') {
                document.getElementById('btn-esquema').classList.add('active');
                document.getElementById('esquema-content').classList.remove('hidden');
            } else {
                const index = tabId.split('-')[1];
                document.getElementById(`btn-test-${index}`).classList.add('active');
                document.getElementById(`${tabId}-content`).classList.remove('hidden');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function corregirTest(testIndex) {
            let aciertos = 0;
            let errores = 0;
            let sinContestar = 0;
            const examen = examenes[testIndex];

            examen.forEach((q, j) => {
                const radios = document.getElementsByName(`r-${testIndex}-${j}`);
                let selected = -1;
                
                radios.forEach(r => {
                    r.disabled = true; 
                    if (r.checked) selected = parseInt(r.value);
                });

                if (selected === -1) sinContestar++;
                else if (selected === q.respuesta_correcta) aciertos++;
                else errores++;

                // Aplicar estilos visuales a las etiquetas
                q.opciones.forEach((opt, k) => {
                    const lbl = document.getElementById(`lbl-${testIndex}-${j}-${k}`);
                    if (k === q.respuesta_correcta) {
                        lbl.classList.add('correct');
                    } else if (selected === k && selected !== q.respuesta_correcta) {
                        lbl.classList.add('incorrect');
                    }
                });

                // Mostrar explicación obligatoriamente si se falla (o si se deja en blanco, para aprender)
                if (selected !== q.respuesta_correcta) {
                    document.getElementById(`exp-${testIndex}-${j}`).style.display = 'block';
                }
            });

            // Mostrar resultados
            const total = aciertos + errores + sinContestar;
            const scoreText = `📊 Puntuación Final: ${aciertos} Aciertos | ${errores} Errores | ${sinContestar} En blanco`;
            
            const scoreTop = document.getElementById(`score-${testIndex}`);
            const scoreBot = document.getElementById(`score-bottom-${testIndex}`);
            
            scoreTop.innerText = scoreText;
            scoreTop.classList.remove('hidden');
            scoreBot.innerText = scoreText;
            scoreBot.classList.remove('hidden');
        }

        function reiniciarTest(testIndex) {
            const examen = examenes[testIndex];
            examen.forEach((q, j) => {
                const radios = document.getElementsByName(`r-${testIndex}-${j}`);
                radios.forEach(r => {
                    r.disabled = false;
                    r.checked = false;
                });
                
                q.opciones.forEach((opt, k) => {
                    const lbl = document.getElementById(`lbl-${testIndex}-${j}-${k}`);
                    lbl.classList.remove('correct');
                    lbl.classList.remove('incorrect');
                });
                
                document.getElementById(`exp-${testIndex}-${j}`).style.display = 'none';
            });
            
            document.getElementById(`score-${testIndex}`).classList.add('hidden');
            document.getElementById(`score-bottom-${testIndex}`).classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ==========================================
        // LÓGICA DE SÍNTESIS DE VOZ (API Web Speech)
        // ==========================================
        let synth = window.speechSynthesis;
        let isSpeaking = false;
        let currentUtterance = null;

        function toggleSpeech() {
            const btn = document.getElementById('btnSpeech');
            
            if (isSpeaking) {
                synth.cancel();
                isSpeaking = false;
                btn.innerText = '🔊 Escuchar Tema Completo';
                btn.style.background = '#007bff';
            } else {
                let textoCompleto = "Esquema de estudio del Tema 5. Gestión Financiera. ";
                esquemaPreguntas.forEach((q, index) => {
                    textoCompleto += `Pregunta ${index + 1}: ${q.pregunta} ... Respuesta: ${q.respuesta_detallada}. `;
                });

                currentUtterance = new SpeechSynthesisUtterance(textoCompleto);
                currentUtterance.lang = 'es-ES';
                currentUtterance.rate = 1.0;
                
                currentUtterance.onend = () => {
                    isSpeaking = false;
                    btn.innerText = '🔊 Escuchar Tema Completo';
                    btn.style.background = '#007bff';
                };

                synth.speak(currentUtterance);
                isSpeaking = true;
                btn.innerText = '⏹ Detener Lectura';
                btn.style.background = '#dc3545';
            }
        }
    </script>
</body>
</html>

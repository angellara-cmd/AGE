                { q: "¿Qué son los actos 'expresos' por su modo de exteriorizarse?", o: ["Consisten en una manifestación de voluntad expresada por la Administración, normalmente escrita.", "Actos basados en el silencio.", "Los que duran menos de un mes en procedimiento express sancionador ejecutivo reglado formal presuntivo constitutivo declarativo o simple.", "Ninguno, la Administración solo habla mediante actos presuntos."], c: 0, e: "Acto expreso, si consiste en una manifestación de voluntad expresada por la Administración, normalmente en forma escrita..." },
                { q: "¿Pone fin a la vía administrativa la resolución de un recurso de alzada?", o: ["Nunca, el recurso de alzada se puede recurrir en alzada infinitamente.", "Sí, de acuerdo al art. 114 LPA es de los primeros actos tipificados que ponen fin a dicha vía.", "Solo si lo firma el Monarca constitucional supremo reglado expresamente para alzada firme del Consejo de Estado materialmente justificado y motivado con informes anexos de plazos y caducidades.", "Solo cuando son de extranjería administrativa."], c: 1, e: "De acuerdo con el art. 114 LPA, ponen fin a la vía administrativa: a) Las resoluciones de los recursos de alzada." },
                { q: "El 'Apremio sobre el patrimonio' procede especialmente si:", o: ["La cantidad a satisfacer es líquida.", "Es obligación personalísima moral.", "Es acto de concurrencia competitiva.", "Falta la notificación."], c: 0, e: "Si en virtud de acto administrativo hubiera de satisfacerse cantidad líquida, se seguirá el procedimiento previsto en las normas reguladoras del procedimiento de apremio." },
                { q: "¿Qué actos dictados por Administraciones devienen en 'anulables' y pueden ser convalidados por mero transcurso del tiempo si los interesados no lo impugnan?", o: ["Los inconstitucionales.", "Los nulos absolutos del art. 47.", "Los anulables que incurren en cualquier infracción del ordenamiento, incluida desviación de poder (art. 48).", "Las disposiciones generales retroactivas sancionadoras desfavorables reguadas por leyes penales sustantivas y materiales procesales con indefensión probada en sumario."], c: 2, e: "La anulabilidad se caracteriza... El acto anulable puede ser convalidado, por el mero transcurso del tiempo si los interesados no piden que se anule..." },
                { q: "El requisito teleológico del acto previene el uso desviado del poder impidiendo que:", o: ["La Administración favorezca a un funcionario leal materialmente incompetente que carezca de nombramiento legalmente establecido presunto y tácitamente.", "La Administración ejercite potestades para fines distintos de los fijados por el ordenamiento.", "El acto no quede escrito.", "Haya plazos para recursos."], c: 1, e: "El art. 70 LJCA define la desviación de poder como 'el ejercicio de potestades administrativas para fines distintos de los fijados por el ordenamiento jurídico'." },
                { q: "La eficacia ex tunc (desde que el acto se produjo originalmente) es característica y efecto propio de:", o: ["La anulabilidad.", "Una irregularidad no invalidante (demora de 1 día).", "La declaración de Nulidad absoluta de pleno derecho.", "La mera suspensión ejecutiva cautelar del artículo 117 de la LPAC material y formal expreso."], c: 2, e: "Nulidad... Eficacia ex tunc. La declaración de nulidad priva de efectos al acto desde el momento en que se produjo. (En anulabilidad, en general, los efectos corren o son ex nunc tras declaración)." },
                { q: "Si la competencia se ha delegado en órgano no dependiente jerárquicamente, la avocación podrá llevarla a cabo:", o: ["Cualquier superior orgánico del Ministerio.", "Únicamente el órgano delegante.", "Exclusivamente el Consejo de Estado.", "Nadie, el delegado tiene potestad irrenunciable e irrecuperable hasta resolución firme definitiva ejecutiva y presunta general o singular reglada o discrecional en sí."], c: 1, e: "En los supuestos de delegación de competencias en órganos no jerárquicamente dependientes, el conocimiento de un asunto podrá ser avocado únicamente por el órgano delegante." },
                { q: "Para que un acto de trámite sea 'impugnable' independiente de la resolución final, es necesario que:", o: ["Pase un mes natural en el limbo de la suspensión del procedimiento del 117.", "Decida directa/indirectamente fondo del asunto, o produzca indefensión/perjuicio irreparable.", "Sea favorable y constitutivo expropiatorio patrimonial.", "Siempre es impugnable per se independientemente de su naturaleza reglado formal material e intrínseca sin que admita revocación."], c: 1, e: "De trámite que decidan directa o indirectamente sobre el fondo del asunto, o causen indefensión." },
                { q: "El que acredita un hecho o situación jurídica sin incidir sobre su contenido material es:", o: ["Constitutivo reglado inimpugnable derivativo.", "Acto declarativo.", "Desviación procedimental avolutiva.", "Certificado sancionador penal ejecutivo de la AGE general."], c: 1, e: "Actos declarativos: son los que acreditan un hecho o una situación jurídica sin incidir sobre su contenido (certificación o notificación, p.e.)." },
                { q: "Al suspender un acto administrativo, el órgano a quien competa resolver, ¿puede adoptar medidas cautelares?", o: ["No, es inconstitucional limitar al recurrente con medidas cautelares materiales accesorias procesales.", "Sí, podrán adoptarse para asegurar protección de interés público o de terceros.", "Sólo prisión preventiva máxima de 3 meses naturales por delito de alta traición gubernamental acreditada mediante dictamen del Consejo de Ministros formal.", "Sí, pero perdiendo validez a los 10 días."], c: 1, e: "Al dictar el acuerdo de suspensión podrán adoptarse las medidas cautelares que sean necesarias para asegurar la protección del interés público o de terceros..." },
                { q: "¿En un procedimiento selectivo, la omisión de motivación del acto que rechace pruebas propuestas por interesados, qué ley infringe según el temario base?", o: ["La Constitución artículo 103 exclusivamente.", "El art. 35 de la Ley 39/2015 del Procedimiento Administrativo Común.", "La Ley Orgánica del Poder Judicial 6/1985 directamente aplicable.", "Ninguna normativa la exige de manera explícita reglamentaria ni procedimental."], c: 1, e: "En cualquier caso, solo los actos enumerados en el art. 35 LPA deben cumplir el requisito de referencia. Según tal artículo, serán motivados... f) Los actos que rechacen pruebas propuestas por los interesados." },
                { q: "¿Cuál es el coste del billete de tren del funcionario que efectúa la entrega de notificaciones a mano según este temario?", o: ["El que fije Renfe anualmente en su BOE.", "Dos euros y medio con reducción del 50%.", "Gratuito con carné oficial del Ministerio.", "El dato solicitado no se encuentra en la documentación adjunta."], c: 3, e: "No se especifica ni menciona el coste del transporte del empleado público que notifica en papel a mano en la documentación adjunta. El dato solicitado no se encuentra en la documentación adjunta." }
            ]
        ];

        let currentTab = 'main';

        function initTabs() {
            const tabsContainer = document.getElementById('tabs-container');
            const testsWrapper = document.getElementById('tests-wrapper');

            for (let i = 1; i <= 10; i++) {
                // Generar botón pestaña
                const tabBtn = document.createElement('button');
                tabBtn.id = `tab-test${i}`;
                tabBtn.className = 'px-6 py-4 tab-inactive transition-colors duration-200 focus:outline-none';
                tabBtn.innerText = `Test ${i}`;
                tabBtn.onclick = () => switchTab(`test${i}`);
                tabsContainer.appendChild(tabBtn);

                // Generar contenedor de Test
                const testSection = document.createElement('section');
                testSection.id = `content-test${i}`;
                testSection.className = 'hidden animate-fade-in';
                
                let testQuestionsHtml = testsData[i-1].map((q, qIndex) => `
                    <div class="mb-8 p-4 border rounded-lg bg-slate-50" id="t${i}-q${qIndex}-container">
                        <p class="font-semibold text-slate-800 mb-3">${qIndex + 1}. ${q.q}</p>
                        <div class="space-y-2 pl-2">
                            ${q.o.map((opt, optIdx) => `
                                <label class="flex items-start gap-3 p-3 rounded-md border cursor-pointer hover:bg-slate-100 transition-colors" id="label-t${i}-q${qIndex}-o${optIdx}">
                                    <input type="radio" name="t${i}-q${qIndex}" value="${optIdx}" class="mt-1 w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500">
                                    <span class="text-slate-700">${['A', 'B', 'C', 'D'][optIdx]}) ${opt}</span>
                                </label>
                            `).join('')}
                        </div>
                        <div id="exp-t${i}-q${qIndex}" class="explanation-box">
                            <strong>Explicación de la respuesta correcta:</strong><br>
                            ${q.e}
                        </div>
                    </div>
                `).join('');

                testSection.innerHTML = `
                    <div class="bg-white p-6 md:p-8 rounded-xl shadow-sm border border-slate-200">
                        <h2 class="text-2xl font-bold text-slate-800 mb-6 border-b pb-4">Test ${i} - Autoevaluación</h2>
                        <div id="test${i}-form">
                            ${testQuestionsHtml}
                            
                            <div id="result-summary-test${i}" class="hidden p-6 mb-6 rounded-lg font-bold text-lg text-center border-2 border-slate-300 bg-slate-100 shadow-inner text-slate-800">
                                <!-- Resultados aquí -->
                            </div>

                            <div class="flex gap-4 border-t pt-6">
                                <button onclick="calculateTest(${i})" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-bold shadow-md transition-colors w-full md:w-auto">Calcular resultado</button>
                                <button onclick="resetTest(${i})" class="bg-slate-200 hover:bg-slate-300 text-slate-800 px-6 py-3 rounded-lg font-bold shadow-sm transition-colors w-full md:w-auto">Reiniciar test</button>
                            </div>
                        </div>
                    </div>
                `;
                testsWrapper.appendChild(testSection);
            }
        }

        function switchTab(tabId) {
            // Cancel TTS if switching
            if (synth.speaking) toggleTTS(true);

            // Update Tabs
            document.getElementById(`tab-${currentTab}`).classList.replace('tab-active', 'tab-inactive');
            document.getElementById(`tab-${tabId}`).classList.replace('tab-inactive', 'tab-active');
            
            // Update Content
            document.getElementById(`content-${currentTab}`).classList.add('hidden');
            document.getElementById(`content-${currentTab}`).classList.remove('block');
            document.getElementById(`content-${tabId}`).classList.add('block');
            document.getElementById(`content-${tabId}`).classList.remove('hidden');

            currentTab = tabId;
        }

        function initMainQuestions() {
            const container = document.getElementById('main-questions-container');
            let html = '';
            mainQuestionsData.forEach((item, index) => {
                html += `
                    <div class="bg-slate-50 p-5 rounded-lg border border-slate-100 shadow-sm main-q-item">
                        <h3 class="font-bold text-blue-900 mb-2">Pregunta ${index + 1}: ${item.q}</h3>
                        <p class="text-slate-700 leading-relaxed"><span class="font-semibold text-slate-800">Respuesta:</span> ${item.a}</p>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        const synth = window.speechSynthesis;
        let isPlayingTTS = false;
        let utterance = null;

        function buildTTSText() {
            let text = "Tema 2: El Acto Administrativo. Esquema de preguntas probables. ";
            mainQuestionsData.forEach((item, index) => {
                text += `Pregunta ${index + 1}. ${item.q} Respuesta: ${item.a}. `;
            });
            return text;
        }

        function toggleTTS(forceStop = false) {
            const btnText = document.getElementById('tts-text');
            const btnIcon = document.getElementById('tts-icon');

            if (forceStop || isPlayingTTS) {
                synth.cancel();
                isPlayingTTS = false;
                btnText.innerText = "Leer Todo";
                btnIcon.innerText = "🔊";
                return;
            }

            if (!utterance) {
                utterance = new SpeechSynthesisUtterance(buildTTSText());
                utterance.lang = 'es-ES';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                
                utterance.onend = () => {
                    isPlayingTTS = false;
                    btnText.innerText = "Leer Todo";
                    btnIcon.innerText = "🔊";
                };
            }

            synth.speak(utterance);
            isPlayingTTS = true;
            btnText.innerText = "Detener Lectura";
            btnIcon.innerText = "⏹️";
        }

        function calculateTest(testNum) {
            const testArray = testsData[testNum - 1];
            let hits = 0;
            let misses = 0;
            let unanswered = 0;

            for (let qIndex = 0; qIndex < testArray.length; qIndex++) {
                const radios = document.getElementsByName(`t${testNum}-q${qIndex}`);
                const correctIdx = testArray[qIndex].c;
                let selectedIdx = -1;

                // Encontrar seleccionada
                for (let r = 0; r < radios.length; r++) {
                    if (radios[r].checked) {
                        selectedIdx = parseInt(radios[r].value);
                        break;
                    }
                }

                // Limpiar clases previas
                for (let i = 0; i < 4; i++) {
                    const label = document.getElementById(`label-t${testNum}-q${qIndex}-o${i}`);
                    label.classList.remove('correct-answer', 'wrong-answer', 'bg-white', 'hover:bg-slate-100');
                    label.classList.add('bg-white');
                }

                const explanationBox = document.getElementById(`exp-t${testNum}-q${qIndex}`);

                if (selectedIdx === -1) {
                    unanswered++;
                    // Mostrar cual era la correcta aunque no haya respondido
                    document.getElementById(`label-t${testNum}-q${qIndex}-o${correctIdx}`).classList.add('correct-answer');
                    explanationBox.classList.add('show-explanation');
                    continue;
                }

                if (selectedIdx === correctIdx) {
                    hits++;
                    document.getElementById(`label-t${testNum}-q${qIndex}-o${selectedIdx}`).classList.add('correct-answer');
                    explanationBox.classList.add('show-explanation');
                } else {
                    misses++;
                    document.getElementById(`label-t${testNum}-q${qIndex}-o${selectedIdx}`).classList.add('wrong-answer');
                    document.getElementById(`label-t${testNum}-q${qIndex}-o${correctIdx}`).classList.add('correct-answer');
                    explanationBox.classList.add('show-explanation');
                }
            }

            // Mostrar resumen general
            const summaryDiv = document.getElementById(`result-summary-test${testNum}`);
            const calificacion = (hits / testArray.length) * 10;
            const message = calificacion >= 5 ? '<span class="text-green-600">¡Aprobado!</span>' : '<span class="text-red-600">Suspenso, necesitas repasar.</span>';
            
            summaryDiv.innerHTML = `
                Resultado: ${hits} aciertos, ${misses} fallos, ${unanswered} sin responder.<br>
                Nota: ${calificacion.toFixed(2)} / 10 <br>
                ${message}
            `;
            summaryDiv.classList.remove('hidden');
            summaryDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function resetTest(testNum) {
            const testArray = testsData[testNum - 1];
            
            for (let qIndex = 0; qIndex < testArray.length; qIndex++) {
                const radios = document.getElementsByName(`t${testNum}-q${qIndex}`);
                for (let r = 0; r < radios.length; r++) radios[r].checked = false;

                for (let i = 0; i < 4; i++) {
                    const label = document.getElementById(`label-t${testNum}-q${qIndex}-o${i}`);
                    label.classList.remove('correct-answer', 'wrong-answer');
                    label.classList.add('hover:bg-slate-100');
                }

                const explanationBox = document.getElementById(`exp-t${testNum}-q${qIndex}`);
                explanationBox.classList.remove('show-explanation');
            }

            const summaryDiv = document.getElementById(`result-summary-test${testNum}`);
            summaryDiv.classList.add('hidden');
            summaryDiv.innerHTML = '';
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Arrancar la APP web
        window.onload = function() {
            initTabs();
            initMainQuestions();
            // Evitar problemas de memoria con synth al refrescar
            window.onbeforeunload = () => { if (synth) synth.cancel(); };
        };

    </script>
</body>
</html>

    <style>
        :root {

            margin-bottom: 10px;

        .docs-links a {

            border: 1px solid var(--primary);

            display: flex;

        }
        nav button.active {
            background: var(--primary);
            color: white;
        }
        main { padding: 20px; max-width: 900px; margin: 0 auto; }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .card h3 { color: var(--primary); margin-bottom: 10px; font-size: 1.1rem; }
        .btn-action {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 1rem;
            display: block;
            width: 100%;
            margin-bottom: 20px;

        .question-block { margin-bottom: 25px; padding: 15px; background: var(--card-bg); border-radius: var(--border-radius); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        @media (max-width: 768px) {

    <main>

            <div id="esquema-container"></div>
        </section>

            <button id="btn-reiniciar" class="btn-action btn-secondary" onclick="reiniciarTest()" style="display:none;">Reiniciar Test</button>
        </section>
    </main>

    <script>
        // 1. ESQUEMA DE ESTUDIO (40 preguntas de estudio teórico)
        const esquemaPreguntas = [
            { pregunta: "1. ¿Qué principios rigen el Poder Judicial según la Constitución?", respuesta_detallada: "Independencia, inamovilidad, responsabilidad, sometimiento al imperio de la ley, unidad jurisdiccional, exclusividad, origen popular, gratuidad (según ley), oralidad y publicidad." },
            { pregunta: "2. ¿Quién administra la justicia en España?", respuesta_detallada: "Emana del pueblo y se administra en nombre del Rey por Jueces y Magistrados integrantes del poder judicial (Art. 117.1 CE)." },
            { pregunta: "3. ¿Qué es el Consejo General del Poder Judicial (CGPJ)?", respuesta_detallada: "Es el órgano de gobierno del Poder Judicial, integrado por el Presidente del TS y 20 vocales, con mandato de 5 años. Ejerce sus competencias en todo el territorio nacional." },
            { pregunta: "4. ¿Cómo se componen los 20 vocales del CGPJ?", respuesta_detallada: "12 entre Jueces y Magistrados (6 elegidos por el Congreso y 6 por el Senado) y 8 juristas de reconocida competencia con más de 15 años de ejercicio (4 por el Congreso y 4 por el Senado). Mayoría de 3/5 en ambas Cámaras." },
            { pregunta: "5. ¿Quién preside el CGPJ?", respuesta_detallada: "El Presidente del Tribunal Supremo, nombrado por el Rey a propuesta del CGPJ." },
            { pregunta: "6. ¿Cuáles son las comisiones del CGPJ?", respuesta_detallada: "Permanente, de Calificación, Disciplinaria, de Asuntos Económicos, de Igualdad, y de Supervisión y Control de Protección de Datos." },
            { pregunta: "7. ¿Cómo se compone la Comisión Permanente del CGPJ?", respuesta_detallada: "Presidente del TS y 7 Vocales (4 turno judicial, 3 turno juristas). Se renuevan anualmente. Prepara el Pleno y vela por la ejecución de sus acuerdos." },
            { pregunta: "8. ¿Cómo se compone la Comisión Disciplinaria del CGPJ?", respuesta_detallada: "7 Vocales (4 judiciales, 3 juristas). Mandato de 5 años. Resuelve expedientes por faltas graves y muy graves (salvo la separación del servicio, que es del Pleno)." },
            { pregunta: "9. ¿Quién es el Promotor de la Acción Disciplinaria?", respuesta_detallada: "Nombrado por el Pleno del CGPJ. Recibe quejas, inicia e instruye expedientes disciplinarios a jueces." },
            { pregunta: "10. ¿Qué función tiene el Pleno del CGPJ respecto al TC?", respuesta_detallada: "Propone el nombramiento, por mayoría de tres quintos, de 2 Magistrados del Tribunal Constitucional." },
            { pregunta: "11. ¿Cuáles son los órganos jurisdiccionales de ámbito nacional?", respuesta_detallada: "Tribunal Supremo, Audiencia Nacional y Tribunal Central de Instancia." },
            { pregunta: "12. ¿Qué Salas integran el Tribunal Supremo?", respuesta_detallada: "Sala 1ª (Civil), Sala 2ª (Penal), Sala 3ª (Contencioso-Administrativo), Sala 4ª (Social), Sala 5ª (Militar) y la Sala Especial de Revisión (Art. 61 LOPJ)." },
            { pregunta: "13. ¿Qué conoce la Sala de lo Penal (Sala 2ª) del Tribunal Supremo?", respuesta_detallada: "Recursos de casación/revisión penal e instrucción/enjuiciamiento contra altas autoridades del Estado (Presidente Gobierno, Ministros, Diputados, Senadores, etc.)." },
            { pregunta: "14. ¿Qué es la Sala del Art. 61 de la LOPJ?", respuesta_detallada: "Sala especial del TS (Presidente TS, Presidentes de Sala, y Magistrado más antiguo y más moderno de cada Sala). Conoce, entre otros, de la ilegalización de partidos políticos y recusaciones de Presidentes de Sala." },
            { pregunta: "15. ¿Qué Salas componen la Audiencia Nacional?", respuesta_detallada: "Sala de Apelación, Sala de lo Penal, Sala de lo Contencioso-Administrativo y Sala de lo Social." },
            { pregunta: "16. ¿Qué delitos conoce la Sala de lo Penal de la Audiencia Nacional?", respuesta_detallada: "Delitos contra el titular de la Corona, falsificación de moneda por grupos organizados, terrorismo, narcotráfico internacional, delitos fuera del territorio nacional, entre otros." },
            { pregunta: "17. ¿Qué es el Tribunal Central de Instancia?", respuesta_detallada: "Órgano nacional con sede en Madrid. Secciones: Instrucción, Penal, Menores, Vigilancia Penitenciaria y Contencioso-Administrativo. Apoya funcionalmente a la Audiencia Nacional." },
            { pregunta: "18. ¿Qué es el Tribunal Superior de Justicia (TSJ)?", respuesta_detallada: "Culmina la organización judicial en el ámbito de la Comunidad Autónoma. Toma el nombre de la CA." },
            { pregunta: "19. ¿Qué Salas tiene un TSJ?", respuesta_detallada: "Sala de lo Civil y Penal, Sala de lo Contencioso-Administrativo y Sala de lo Social." },
            { pregunta: "20. ¿Qué ámbito territorial tienen las Audiencias Provinciales?", respuesta_detallada: "Provincial. Tienen sede en la capital de provincia y competencias exclusivamente en los órdenes civil y penal." },
            { pregunta: "21. ¿Qué conoce una Audiencia Provincial en el orden penal?", respuesta_detallada: "Causas por delitos graves no atribuidos a Secciones Penales de Instancia. Recursos contra Secciones de Instrucción/Penal/Violencia Mujer/Menores de los Tribunales de Instancia." },
            { pregunta: "22. ¿Dónde existen los Tribunales de Instancia?", respuesta_detallada: "En cada partido judicial, con sede en su capital. Integrados por una Sección Única (Civil e Instrucción) o secciones separadas, y opcionalmente otras especializadas." },
            { pregunta: "23. ¿Qué son los Juzgados de Paz?", respuesta_detallada: "Órganos en municipios donde no exista Tribunal de Instancia. Nombrados por 4 años por el TSJ, previa elección por mayoría absoluta del Pleno del Ayuntamiento." },
            { pregunta: "24. ¿Es necesario ser licenciado en Derecho para ser Juez de Paz?", respuesta_detallada: "No, la LOPJ no lo exige." },
            { pregunta: "25. ¿Qué misión fundamental tiene el Ministerio Fiscal (Art. 124 CE)?", respuesta_detallada: "Promover la acción de la justicia en defensa de la legalidad, derechos ciudadanos e interés público, velar por la independencia judicial y procurar la satisfacción del interés social." },
            { pregunta: "26. ¿Bajo qué principios actúa el Ministerio Fiscal?", respuesta_detallada: "Unidad de actuación y dependencia jerárquica, con sujeción en todo caso a los principios de legalidad e imparcialidad." },
            { pregunta: "27. ¿Quién nombra al Fiscal General del Estado?", respuesta_detallada: "El Rey, a propuesta del Gobierno, oído previamente el CGPJ. Se elige entre juristas españoles de reconocido prestigio con más de 15 años de ejercicio." },
            { pregunta: "28. ¿Cuánto dura el mandato del Fiscal General del Estado?", respuesta_detallada: "4 años. Cesa a petición propia, incompatibilidad, incapacidad, incumplimiento grave o cuando cese el Gobierno que lo propuso." },
            { pregunta: "29. ¿Cuáles son los órganos del Ministerio Fiscal?", respuesta_detallada: "Fiscal General del Estado, Consejo Fiscal, Junta de Fiscales de Sala, Junta de Fiscales Superiores CCAA, Fiscalías del TS, TC, AN, Especiales, CCAA, Provinciales y de Área." },
            { pregunta: "30. ¿Qué Sección obligatoria existe en la Fiscalía de la Audiencia Nacional y Provinciales?", respuesta_detallada: "Una Sección de Menores para funciones de Responsabilidad Penal de Menores." },
            { pregunta: "31. ¿Y en las Fiscalías Provinciales específicamente?", respuesta_detallada: "Sección contra la Violencia sobre la Mujer, Sección de Medio Ambiente, Sección de Menores y Sección contra delitos de odio." },
            { pregunta: "32. ¿Qué participación ciudadana existe en la Justicia según el art. 125 CE?", respuesta_detallada: "La acción popular, el Tribunal del Jurado en procesos penales, y los Tribunales consuetudinarios y tradicionales (ej. Tribunal de Aguas de Valencia)." },
            { pregunta: "33. ¿Qué indemnización prevé la Constitución por error judicial?", respuesta_detallada: "Los daños por error judicial o funcionamiento anormal de la Administración de Justicia darán derecho a indemnización a cargo del Estado, conforme a la ley (Art. 121 CE)." },
            { pregunta: "34. ¿A quién compete la Sección de Violencia sobre la Mujer en los Tribunales de Instancia?", respuesta_detallada: "Instrucción de delitos de violencia de género, adopción de órdenes de protección, quebrantamientos de condena, y ámbito civil exclusivo si concurren actuaciones penales." },
            { pregunta: "35. ¿Quién elabora el Presupuesto del CGPJ?", respuesta_detallada: "El CGPJ elabora y ejecuta su propio presupuesto. La Comisión Permanente o la de Asuntos Económicos elabora el borrador, y lo aprueba el Pleno." },
            { pregunta: "36. ¿Qué función ejerce el Vicepresidente del TS?", respuesta_detallada: "Sustituir al Presidente, prestarle colaboración, y ejercer sus funciones por delegación. Es elegido por mayoría de 3/5 por el Pleno del CGPJ." },
            { pregunta: "37. ¿Existe jurisdicción militar en tiempo de paz?", respuesta_detallada: "Sí. La ley regula el ejercicio de la jurisdicción militar en el ámbito estrictamente castrense y en supuestos de estado de sitio (Art. 117.5 CE)." },
            { pregunta: "38. ¿Qué papel tiene la Policía Judicial?", respuesta_detallada: "Depende de los Jueces, Tribunales y del Ministerio Fiscal en sus funciones de averiguación del delito y aseguramiento del delincuente (Art. 126 CE)." },
            { pregunta: "39. ¿Quién decide los conflictos de competencias entre la Fiscalía Europea y la nacional?", respuesta_detallada: "Decide definitivamente la persona titular de la Fiscalía General del Estado tras oír a la Junta de Fiscales de Sala." },
            { pregunta: "40. ¿Qué recurso cabe contra acuerdos de la Comisión Disciplinaria del CGPJ?", respuesta_detallada: "Recurso de alzada ante el Pleno en el plazo de un mes." }
        ];

        // 2. EXÁMENES (10 tests x 20 preguntas)
        const examenes = [
            // TEST 1: Constitución y Poder Judicial
            [
                { pregunta: "Según el art. 117 CE, la justicia emana del pueblo y se administra en nombre de:", opciones: ["Las Cortes Generales.", "El Rey.", "El Consejo General del Poder Judicial.", "Los Jueces y Magistrados."], respuesta_correcta: 1, explicacion: "Art. 117.1 CE: La justicia emana del pueblo y se administra en nombre del Rey." },
                { pregunta: "Los Jueces y Magistrados están sometidos únicamente:", opciones: ["Al CGPJ.", "A las sentencias del TS.", "Al imperio de la ley.", "Al Ministerio de Justicia."], respuesta_correcta: 2, explicacion: "Art. 117.1 CE: sometidos únicamente al imperio de la ley." },
                { pregunta: "La base de la organización y funcionamiento de los Tribunales es:", opciones: ["El principio de legalidad.", "El principio de unidad jurisdiccional.", "El principio de independencia.", "El principio de inamovilidad."], respuesta_correcta: 1, explicacion: "Art. 117.5 CE: El principio de unidad jurisdiccional es la base de la organización." },
                { pregunta: "Los Tribunales de excepción están:", opciones: ["Permitidos en estado de sitio.", "Regulados por Ley Orgánica.", "Prohibidos constitucionalmente.", "Limitados al ámbito militar."], respuesta_correcta: 2, explicacion: "Art. 117.6 CE: Se prohíben los Tribunales de excepción." },
                { pregunta: "El procedimiento judicial será predominantemente:", opciones: ["Escrito en lo penal.", "Oral, sobre todo en materia criminal.", "Público en materia civil exclusivamente.", "A puerta cerrada."], respuesta_correcta: 1, explicacion: "Art. 120.2 CE: predominantemente oral, sobre todo en materia criminal." },
                { pregunta: "Las sentencias judiciales serán siempre:", opciones: ["Oralmente notificadas.", "Motivadas.", "Dictadas por jurado.", "Inapelables."], respuesta_correcta: 1, explicacion: "Art. 120.3 CE: Las sentencias serán siempre motivadas y se pronunciarán en audiencia pública." },
                { pregunta: "El resarcimiento por error judicial corre a cargo de:", opciones: ["El Juez instructor.", "El CGPJ.", "El Estado.", "La Comunidad Autónoma."], respuesta_correcta: 2, explicacion: "Art. 121 CE: darán derecho a una indemnización a cargo del Estado." },
                { pregunta: "El Tribunal Supremo es el órgano jurisdiccional superior en todos los órdenes salvo en materia de:", opciones: ["Casación.", "Garantías constitucionales.", "Responsabilidad civil de aforados.", "Revisión penal."], respuesta_correcta: 1, explicacion: "Art. 123.1 CE: salvo lo dispuesto en materia de garantías constitucionales (TC)." },
                { pregunta: "La participación de los ciudadanos en la Administración de Justicia se da mediante:", opciones: ["El recurso de amparo.", "La acción popular y el Jurado.", "El Defensor del Pueblo.", "El sufragio universal directo."], respuesta_correcta: 1, explicacion: "Art. 125 CE: podrán ejercer la acción popular y participar mediante el Jurado." },
                { pregunta: "La policía judicial depende de:", opciones: ["Ministerio del Interior.", "Dirección de la Guardia Civil.", "Jueces, Tribunales y Ministerio Fiscal.", "Exclusivamente de los Jueces de Instrucción."], respuesta_correcta: 2, explicacion: "Art. 126 CE: depende de los Jueces, de los Tribunales y del Ministerio Fiscal." },
                { pregunta: "Jueces, Magistrados y Fiscales en activo NO podrán:", opciones: ["Pertenecer a asociaciones profesionales.", "Pertenecer a partidos políticos o sindicatos.", "Dictar sentencias motivadas.", "Votar en elecciones generales."], respuesta_correcta: 1, explicacion: "Art. 127 CE: no podrán pertenecer a partidos políticos o sindicatos." },
                { pregunta: "La jurisdicción militar se limita al ámbito:", opciones: ["Civil y militar.", "Castrense y supuestos de estado de sitio.", "Policial.", "De defensa exterior exclusivamente."], respuesta_correcta: 1, explicacion: "Art. 117.5 CE: en el ámbito estrictamente castrense y en estado de sitio." },
                { pregunta: "Las actuaciones judiciales serán:", opciones: ["Siempre secretas en fase de instrucción.", "Públicas, con las excepciones que prevean las leyes procesales.", "Públicas sin excepción alguna.", "Orales y secretas."], respuesta_correcta: 1, explicacion: "Art. 120.1 CE: serán públicas, con las excepciones que prevean las leyes de procedimiento." },
                { pregunta: "El derecho a la gratuidad de la justicia aplica:", opciones: ["Solo en el orden social.", "En todo caso a quienes acrediten insuficiencia de recursos.", "Solo para extranjeros.", "Nunca en vía penal."], respuesta_correcta: 1, explicacion: "Art. 119 CE: en todo caso, respecto de quienes acrediten insuficiencia de recursos." },
                { pregunta: "¿Cuántos jurados integran el Tribunal del Jurado (regla general)?", opciones: ["9 jurados y 1 Magistrado.", "12 jurados.", "7 jurados y 3 Magistrados.", "5 jurados."], respuesta_correcta: 0, explicacion: "Nueve jurados y un Magistrado Presidente, más dos suplentes." },
                { pregunta: "¿Qué Tribunal es considerado consuetudinario y tradicional por la LOPJ?", opciones: ["El Tribunal del Jurado.", "El Tribunal de Cuentas.", "El Tribunal de las Aguas de la Vega Valenciana y el Consejo de Hombres Buenos de Murcia.", "A y C son correctas."], respuesta_correcta: 2, explicacion: "Art. 19 LOPJ reconoce a estos dos." },
                { pregunta: "El CGPJ ejerce sus funciones:", opciones: ["En toda España.", "Solo en Madrid.", "Solo sobre el Tribunal Supremo.", "En el ámbito contencioso exclusivamente."], respuesta_correcta: 0, explicacion: "Ejerce sus competencias en todo el territorio nacional." },
                { pregunta: "El Presidente del TS es nombrado por:", opciones: ["El Rey, a propuesta del Gobierno.", "El Rey, a propuesta del CGPJ.", "El Congreso por mayoría absoluta.", "El Rey, refrendado por el Rey."], respuesta_correcta: 1, explicacion: "Art. 123.2 CE: por el Rey, a propuesta del CGPJ." },
                { pregunta: "¿A quién corresponde en exclusiva el ejercicio de la potestad jurisdiccional?", opciones: ["Al Gobierno.", "Al Ministerio Fiscal.", "A los Juzgados y Tribunales determinados por las leyes.", "A y C son correctas."], respuesta_correcta: 2, explicacion: "Art. 117.3 CE." },
                { pregunta: "La justicia es:", opciones: ["Dependiente del poder legislativo.", "Un principio fundamental del Estado de Derecho.", "Privada en el ámbito mercantil.", "Emanada del Rey."], respuesta_correcta: 1, explicacion: "Implica separación de poderes en el Estado de Derecho (Tema 4)." }
            ],
            // TEST 2: CGPJ (Composición y Elección)
            [
                { pregunta: "¿Quién preside el CGPJ?", opciones: ["El Rey.", "El Ministro de Justicia.", "El Presidente del Tribunal Constitucional.", "El Presidente del Tribunal Supremo."], respuesta_correcta: 3, explicacion: "Art. 122.3 CE: integrado por el Presidente del Tribunal Supremo, que lo presidirá." },
                { pregunta: "El mandato de los Vocales del CGPJ dura:", opciones: ["4 años.", "5 años.", "9 años.", "Son vitalicios."], respuesta_correcta: 1, explicacion: "Art. 122.3 CE: nombrados por el Rey por un período de cinco años." },
                { pregunta: "¿Cuántos vocales son elegidos entre Jueces y Magistrados?", opciones: ["8.", "10.", "12.", "20."], respuesta_correcta: 2, explicacion: "Art. 122.3 CE: doce entre Jueces y Magistrados." },
                { pregunta: "¿Qué mayoría se exige a las Cámaras para elegir vocales del CGPJ?", opciones: ["Mayoría simple.", "Mayoría absoluta.", "Tres quintos.", "Dos tercios."], respuesta_correcta: 2, explicacion: "Art. 122.3 CE: elegidos por mayoría de tres quintos de sus miembros." },
                { pregunta: "Los juristas elegidos como vocales deben tener una experiencia profesional de más de:", opciones: ["10 años.", "15 años.", "20 años.", "25 años."], respuesta_correcta: 1, explicacion: "Art. 122.3 CE: con más de quince años de ejercicio en su profesión." },
                { pregunta: "¿Cuántos juristas elige el Senado para el CGPJ?", opciones: ["4.", "6.", "8.", "10."], respuesta_correcta: 0, explicacion: "4 a propuesta del Congreso y 4 a propuesta del Senado." },
                { pregunta: "¿Puede un Vocal del Consejo saliente ser designado en el nuevo CGPJ?", opciones: ["Sí, por una sola vez.", "Solo si es del turno de juristas.", "En ningún caso.", "Sí, si el mandato fue inferior a dos años."], respuesta_correcta: 2, explicacion: "La LOPJ prohíbe que la designación recaiga en Vocales del Consejo saliente." },

                { pregunta: "Ante quién toma posesión el Fiscal General del Estado?", opciones: ["Ante el Ministro de Justicia.", "Ante el Pleno del Tribunal Supremo.", "Ante las Cortes.", "Ante el Consejo Fiscal."], respuesta_correcta: 1, explicacion: "Tomará posesión del cargo ante el Pleno del Tribunal Supremo (tras jurar ante el Rey)." },
                { pregunta: "El FGE preside:", opciones: ["La Audiencia Nacional.", "El Consejo Fiscal.", "El CGPJ.", "El Tribunal de Cuentas."], respuesta_correcta: 1, explicacion: "Una de sus funciones es presidir el Consejo Fiscal." },
                { pregunta: "El Teniente Fiscal del Tribunal Supremo tiene la consideración de:", opciones: ["Magistrado de TSJ.", "Presidente de Sala del Tribunal Supremo.", "Ministro.", "Letrado Mayor."], respuesta_correcta: 1, explicacion: "Tendrá la consideración de Presidente de Sala (TS)." },
                { pregunta: "¿Qué Fiscalía especial existe, entre otras?", opciones: ["Fiscalía Antidroga.", "Fiscalía de Cuentas Nacional.", "Fiscalía del Mar.", "Fiscalía de Transportes."], respuesta_correcta: 0, explicacion: "Actualmente son dos: Antidroga y contra la Corrupción y Criminalidad Organizada." },
                { pregunta: "¿Quién decide las discrepancias entre la Fiscalía Europea y la Fiscalía española?", opciones: ["El Rey.", "El CGPJ.", "El Fiscal General del Estado (oyendo a Junta Fiscales Sala).", "Tribunal Supremo."], respuesta_correcta: 2, explicacion: "Decidirá definitivamente la persona titular de la FGE tras oír a la Junta de Fiscales de Sala." },
                { pregunta: "¿En qué procesos interviene obligatoriamente el MF civilmente?", opciones: ["Desahucios por impago de alquiler.", "En los que afecten a menores, incapaces o estado civil.", "Reclamaciones de deudas bancarias.", "Litigios de herencias pacíficas."], respuesta_correcta: 1, explicacion: "Procesos del estado civil y donde se comprometa interés de menores, incapaces o desvalidos." },
                { pregunta: "Los miembros del Ministerio Fiscal son:", opciones: ["Empleados sin autoridad.", "Autoridad a todos los efectos.", "Equivalentes a la Policía Local.", "Cargos políticos."], respuesta_correcta: 1, explicacion: "Son autoridad a todos los efectos y actúan en representación de la Institución." },
                { pregunta: "¿Puede proponerse para FGE a alguien que fue Ministro hace 3 años?", opciones: ["Sí.", "No, hay prohibición en los 5 años anteriores.", "Solo si el Congreso lo avala unánimemente.", "Solo si era de otra rama."], respuesta_correcta: 1, explicacion: "Prohibido si en los 5 años anteriores fue titular de un Ministerio o consejería autonómica, etc." },
                { pregunta: "¿Quién ejerce el control interno del gasto del CGPJ?", opciones: ["Tribunal de Cuentas.", "Funcionario del Cuerpo Superior de Interventores y Auditores del Estado.", "El Ministro de Hacienda.", "El Consejo Fiscal."], respuesta_correcta: 1, explicacion: "El control interno por un Interventor/Auditor del Estado, el externo por el Tribunal de Cuentas." },
                { pregunta: "El régimen retributivo del FGE es idéntico al de:", opciones: ["El Ministro de Justicia.", "Presidente del Tribunal Supremo.", "Vocal del CGPJ.", "Magistrado ordinario."], respuesta_correcta: 1, explicacion: "Su régimen retributivo será idéntico al del Presidente del Tribunal Supremo." }
            ],
            // TEST 10: Repaso Mix Total
            [
                { pregunta: "La justicia en España emana del:", opciones: ["Rey.", "Pueblo.", "Cuerpo de Jueces.", "CGPJ."], respuesta_correcta: 1, explicacion: "Art. 117.1 CE: La justicia emana del pueblo." },
                { pregunta: "El CGPJ se compone de cuántos miembros:", opciones: ["Presidente del Gobierno y 20 vocales.", "Presidente del TC y 12 vocales.", "Presidente del TS y 20 vocales.", "Presidente del TS y 21 vocales."], respuesta_correcta: 2, explicacion: "Presidente del TS y 20 vocales." },
                { pregunta: "La elección del Presidente del TS requiere el apoyo de qué mayoría en el Pleno del CGPJ:", opciones: ["Absoluta.", "Tres quintos.", "Dos tercios.", "Mayoría simple."], respuesta_correcta: 1, explicacion: "Mayoría de 3/5 de los miembros del Pleno." },
                { pregunta: "La Sala 5ª del TS es la de:", opciones: ["Garantías constitucionales.", "Social.", "Militar.", "Civil."], respuesta_correcta: 2, explicacion: "Sala 5ª: Militar." },
                { pregunta: "¿Qué Sala de la Audiencia Nacional juzga el terrorismo?", opciones: ["Sala de Apelación.", "Sala Especial del art 61.", "Sala de lo Penal.", "Sala de lo Social."], respuesta_correcta: 2, explicacion: "La Sala de lo Penal de la AN asume delitos graves que le atribuye el art. 65 LOPJ." },
                { pregunta: "¿Puede el CGPJ elaborar reglamentos de procedimiento civil o penal?", opciones: ["Sí.", "No, solo reglamenta sobre su funcionamiento interno, personal y cuestiones gubernativas accesorias.", "Sí, si lo aprueba el Ministro de Justicia.", "Solo reglamenta para Juzgados de Paz."], respuesta_correcta: 1, explicacion: "Potestad reglamentaria estricta en desarrollo LOPJ (doméstica, funcionamiento)." },
                { pregunta: "¿Cuánto dura el mandato de los vocales del CGPJ?", opciones: ["4 años.", "5 años.", "6 años.", "Legislatura."], respuesta_correcta: 1, explicacion: "5 años." },
                { pregunta: "¿A qué órgano compete autorizar la donación de órganos (extracciones)?", opciones: ["Sección Familia Tribunal Instancia.", "Queda fuera de Violencia sobre la Mujer (art. 89). Lo lleva Familia/Civil común.", "Audiencia Provincial.", "CGPJ."], respuesta_correcta: 1, explicacion: "La Ley 15/2015 exceptúa a Violencia sobre la Mujer (y Familia si aplica la jurisdicción común)." },
                { pregunta: "¿Cuál es la función del Promotor de la Acción Disciplinaria del CGPJ?", opciones: ["Instruir expedientes disciplinarios.", "Destituir al FGE.", "Elaborar la cuenta general del Estado.", "Supervisar las elecciones."], respuesta_correcta: 0, explicacion: "Instruye los expedientes disciplinarios contra Jueces." },
                { pregunta: "¿Cuántas Audiencias Nacionales hay en España?", opciones: ["Una por CA.", "Una sola, con sede en Madrid.", "Una por provincia.", "Tres (Madrid, Barcelona, Sevilla)."], respuesta_correcta: 1, explicacion: "La Audiencia Nacional es un órgano único jurisdiccional para toda España." },
                { pregunta: "El conflicto de competencia entre dos Audiencias Provinciales de diferentes CCAA lo resuelve:", opciones: ["La Audiencia Nacional.", "El TSJ de la de mayor antigüedad.", "El Tribunal Supremo (Sala Segunda, si es penal).", "Junta de Jueces."], respuesta_correcta: 2, explicacion: "El superior común, que en este caso es el TS." },
                { pregunta: "¿De qué asuntos conoce la Sección Única de un Tribunal de Instancia si no se dividen?", opciones: ["Civil y Contencioso.", "Penal y Social.", "Civil y de Instrucción.", "Civil y Mercantil."], respuesta_correcta: 2, explicacion: "Sección Única, de Civil y de Instrucción." },
                { pregunta: "Las apelaciones contra las Secciones de lo Mercantil van a:", opciones: ["El TSJ.", "Audiencia Provincial.", "Tribunal Supremo.", "Sala Contenciosa AN."], respuesta_correcta: 1, explicacion: "Recursos civiles del T. de Instancia (incluido Mercantil) van a la Audiencia Provincial." },
                { pregunta: "¿Qué mayoría se precisa en un Ayuntamiento para nombrar al Juez de Paz?", opciones: ["Mayoría simple.", "Mayoría de 3/5.", "Mayoría absoluta.", "No se elige, es un funcionario de carrera."], respuesta_correcta: 2, explicacion: "Elegido por el Pleno del Ayuntamiento por mayoría absoluta." },
                { pregunta: "¿Quién dicta las instrucciones para el orden interno del Ministerio Fiscal?", opciones: ["El Gobierno.", "El Rey.", "El Fiscal General del Estado.", "El TS."], respuesta_correcta: 2, explicacion: "El FGE imparte las órdenes e instrucciones." },
                { pregunta: "El TSJ actúa como tribunal de casación cuando:", opciones: ["Se discute Derecho Común.", "Se fundamenta en Derecho Civil Foral o Especial propio de la CA.", "Es un tema laboral sin convenio colectivo.", "Siempre."], respuesta_correcta: 1, explicacion: "Recursos de casación que se funden en la infracción de Derecho Civil foral o especial de la CA." },
                { pregunta: "El Tribunal del Jurado (conciudadanos) se constituye en el ámbito de:", opciones: ["Audiencia Nacional.", "Audiencia Provincial.", "Tribunal Supremo.", "Tribunales de Instancia."], respuesta_correcta: 1, explicacion: "Regla general: se constituye en el ámbito de la Audiencia Provincial." },
                { pregunta: "¿Quién interpone un recurso de amparo ante el TC en defensa de un menor desvalido?", opciones: ["El CGPJ.", "El Rey.", "El Ministerio Fiscal.", "La policía local."], respuesta_correcta: 2, explicacion: "El MF interpone recurso de amparo en defensa de la legalidad." },
                { pregunta: "La Memoria Anual del CGPJ debate:", opciones: ["Estado, funcionamiento y actividades del CGPJ y Juzgados.", "Las sentencias del TC.", "Ley de presupuestos del Estado.", "Directivas europeas."], respuesta_correcta: 0, explicacion: "Memoria sobre el estado, funcionamiento y actividades del propio CGPJ y Tribunales." },
                { pregunta: "¿Qué competencia tiene la Sección de lo Penal del Tribunal Central de Instancia?", opciones: ["Tribunal del Jurado a nivel nacional.", "Juicios por delitos leves de tráfico en Madrid.", "Enjuiciar causas del art. 65 en los casos previstos, o ejecutar sentencias graves de Instrucción.", "Resolver casaciones."], respuesta_correcta: 2, explicacion: "Causas del art. 65 si proceden y ejecutar sentencias de Instrucción." }
            ]
        ];

        // Lógica de UI
        const tabEsquema = document.getElementById('tab-esquema');
        const tabTest = document.getElementById('tab-test');
        const mainNav = document.getElementById('main-nav');
        
        let testsNavHtml = `<button onclick="showTab('esquema')" class="active" id="nav-esquema">Esquema de Estudio</button>`;
        for(let i=0; i<examenes.length; i++){
            testsNavHtml += `<button onclick="loadTest(${i})" id="nav-test-${i}">Test ${i+1}</button>`;
        }
        mainNav.innerHTML = testsNavHtml;

        // Render Esquema
        const esquemaCont = document.getElementById('esquema-container');
        let esquemaHtml = '';
        esquemaPreguntas.forEach(item => {
            esquemaHtml += `
            <div class="card">
                <h3>${item.pregunta}</h3>
                <p>${item.respuesta_detallada}</p>
            </div>`;
        });
        esquemaCont.innerHTML = esquemaHtml;

        // Lectura de Esquema
        document.getElementById('btn-leer').addEventListener('click', () => {
            if('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Parar anterior
                const textoCompleto = esquemaPreguntas.map(q => `${q.pregunta}. ${q.respuesta_detallada}`).join(". Siguiente pregunta: ");
                const utterance = new SpeechSynthesisUtterance("Comenzando lectura del tema. " + textoCompleto);
                utterance.lang = 'es-ES';
                window.speechSynthesis.speak(utterance);
            } else {
                alert("La síntesis de voz no está soportada en su navegador.");
            }
        });

        function showTab(type) {
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            if(type === 'esquema') {
                document.getElementById('nav-esquema').classList.add('active');
                tabEsquema.style.display = 'block';
                tabTest.style.display = 'none';
            } else {
                tabEsquema.style.display = 'none';
                tabTest.style.display = 'block';
            }
        }

        let currentTestIndex = 0;
        let testRespondido = false;

        function loadTest(index) {
            currentTestIndex = index;
            testRespondido = false;
            showTab('test');
            document.getElementById(`nav-test-${index}`).classList.add('active');
            
            document.getElementById('test-title').innerText = `Test ${index + 1}`;
            document.getElementById('score-top').innerText = '';
            document.getElementById('score-bottom').innerText = '';
            document.getElementById('btn-corregir').style.display = 'block';
            document.getElementById('btn-reiniciar').style.display = 'none';

            const testCont = document.getElementById('test-container');
            const testData = examenes[index];
            let html = '';

            testData.forEach((q, qIndex) => {
                html += `<div class="question-block" id="qblock-${qIndex}">`;
                html += `<div class="question-text">${qIndex + 1}. ${q.pregunta}</div>`;
                q.opciones.forEach((opt, optIndex) => {
                    html += `
                    <label class="option-label" id="label-${qIndex}-${optIndex}">
                        <input type="radio" name="q${qIndex}" value="${optIndex}">
                        ${opt}
                    </label>`;
                });
                html += `<div class="explanation-box" id="exp-${qIndex}">
                            <strong>Respuesta correcta:</strong> ${q.opciones[q.respuesta_correcta]}<br>
                            <em>Motivo:</em> ${q.explicacion}
                         </div>`;
                html += `</div>`;
            });
            testCont.innerHTML = html;
        }

        function corregirTest() {
            if(testRespondido) return;
            const testData = examenes[currentTestIndex];
            let aciertos = 0;
            let errores = 0;
            let blancos = 0;

            testData.forEach((q, qIndex) => {
                const options = document.getElementsByName(`q${qIndex}`);
                let selected = -1;
                options.forEach(opt => {
                    opt.disabled = true; // Bloquear cambios
                    if(opt.checked) selected = parseInt(opt.value);
                });

                const correctIndex = q.respuesta_correcta;
                
                // Pintar Correcta
                document.getElementById(`label-${qIndex}-${correctIndex}`).classList.add('correct');

                if (selected === correctIndex) {
                    aciertos++;
                } else {
                    if(selected !== -1) {
                        errores++;
                        // Pintar la marcada incorrecta
                        document.getElementById(`label-${qIndex}-${selected}`).classList.add('incorrect');
                    } else {
                        blancos++;
                    }
                    // Desplegar explicación si falló o dejó en blanco
                    document.getElementById(`exp-${qIndex}`).style.display = 'block';
                }
            });

            const scoreText = `Resultados: ${aciertos} Aciertos | ${errores} Errores | ${blancos} Blancos`;
            document.getElementById('score-top').innerText = scoreText;
            document.getElementById('score-bottom').innerText = scoreText;
            
            document.getElementById('btn-corregir').style.display = 'none';
            document.getElementById('btn-reiniciar').style.display = 'block';
            testRespondido = true;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function reiniciarTest() {
            loadTest(currentTestIndex);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esquema de Supuestos Prácticos</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Estrictamente 100vh y sin scroll */
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Fondo de malla moderna y sutil para una identidad propia */
        .mesh-background {
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 10% 20%, hsla(250,100%,74%,0.08) 0px, transparent 50%),
                radial-gradient(at 90% 10%, hsla(189,100%,56%,0.08) 0px, transparent 50%),
                radial-gradient(at 10% 90%, hsla(355,100%,80%,0.08) 0px, transparent 50%),
                radial-gradient(at 90% 90%, hsla(340,100%,76%,0.08) 0px, transparent 50%),
                radial-gradient(at 50% 50%, hsla(22,100%,77%,0.08) 0px, transparent 50%);
        }
    </style>
</head>
<body class="flex flex-col text-slate-800 mesh-background">

    <!-- 1. Cabecera Principal -->
    <header class="h-16 md:h-20 flex-none bg-white/60 backdrop-blur-md border-b border-white/50 shadow-sm flex items-center justify-center z-10 px-6 relative">
        <div class="absolute left-4 md:left-8 flex items-center justify-center w-10 h-10 bg-slate-900 rounded-xl shadow-lg shadow-slate-900/20 text-white transform -rotate-3">
            <i class="fa-solid fa-graduation-cap text-lg"></i>
        </div>
        <h1 class="text-xl md:text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-slate-800 to-slate-500 tracking-tight">
            Preparación de Supuestos
        </h1>
    </header>

    <!-- 2. Contenedor Principal (Grid 2x2) -->
    <!-- flex-1 y min-h-0 garantizan que encaje perfectamente en el espacio vertical sobrante -->
    <main class="flex-1 min-h-0 p-3 md:p-6 lg:p-8">
        <!-- El contenedor donde JS inyectará el contenido -->
        <div id="dashboard-grid" class="grid grid-cols-2 grid-rows-2 gap-3 md:gap-6 h-full">
            <!-- Renderizado dinámico aquí -->
        </div>
    </main>

    <script>
        // Estructura de datos y configuración de estilos Tailwind por bloque temático.
        // Se declaran las clases completas para que Tailwind vía CDN las pueda compilar correctamente.
        const categories = [
            {
                id: "personal",
                title: "Gestión de personal",
                icon: "fa-solid fa-users-gear",
                headerClasses: "bg-gradient-to-r from-blue-500 to-indigo-600",
                slotActiveClasses: "bg-blue-100 text-blue-800 border-blue-400 hover:bg-blue-600 hover:text-white shadow-md hover:-translate-y-1",
                slotInactiveClasses: "bg-blue-50/50 text-blue-400/80 border-blue-200 border-dashed",
                activeLinks: {}
            },
            {
                id: "financiera",
                title: "Gestión Financiera",
                icon: "fa-solid fa-chart-line",
                headerClasses: "bg-gradient-to-r from-emerald-500 to-teal-500",
                slotActiveClasses: "bg-emerald-100 text-emerald-800 border-emerald-400 hover:bg-emerald-600 hover:text-white shadow-md hover:-translate-y-1",
                slotInactiveClasses: "bg-emerald-50/50 text-emerald-400/80 border-emerald-200 border-dashed",
                activeLinks: {
                    // Posición 1 será el "Supuesto 31" tal y como lo requiere el prompt
                    1: { name: "Supuesto 31", url: "Supuesto31.html" } 
                }
            },
            {
                id: "administrativo",
                title: "Derecho Administrativo",
                icon: "fa-solid fa-scale-balanced",
                headerClasses: "bg-gradient-to-r from-purple-500 to-fuchsia-600",
                slotActiveClasses: "bg-purple-100 text-purple-800 border-purple-400 hover:bg-purple-600 hover:text-white shadow-md hover:-translate-y-1",
                slotInactiveClasses: "bg-purple-50/50 text-purple-400/80 border-purple-200 border-dashed",
                activeLinks: {}
            },
            {
                id: "oficinas",
                title: "Org. Oficinas Públicas",
                icon: "fa-regular fa-building",
                headerClasses: "bg-gradient-to-r from-orange-500 to-amber-500",
                slotActiveClasses: "bg-orange-100 text-orange-800 border-orange-400 hover:bg-orange-600 hover:text-white shadow-md hover:-translate-y-1",
                slotInactiveClasses: "bg-orange-50/50 text-orange-400/80 border-orange-200 border-dashed",
                activeLinks: {
                    // Posición 1 será el "Supuesto 1"
                    1: { name: "Supuesto 1", url: "Supuesto1.html" }
                }
            }
        ];

        // Función de renderizado principal
        function renderDashboard() {
            const gridContainer = document.getElementById('dashboard-grid');
            let htmlContent = '';

            categories.forEach((cat) => {
                const totalActive = Object.keys(cat.activeLinks).length;
                
                // 1. Iniciar la Tarjeta
                let cardHtml = `
                    <section class="bg-white/80 backdrop-blur-md rounded-2xl shadow-xl shadow-slate-200/50 border border-white flex flex-col overflow-hidden h-full transform transition duration-300 hover:shadow-2xl">
                        
                        <!-- Cabecera Temática -->
                        <header class="${cat.headerClasses} p-3 md:p-4 flex items-center justify-between text-white shrink-0">
                            <div class="flex items-center gap-3">
                                <div class="bg-white/25 w-8 h-8 md:w-10 md:h-10 rounded-xl flex items-center justify-center backdrop-blur-sm shadow-inner">
                                    <i class="${cat.icon} text-sm md:text-lg"></i>
                                </div>
                                <h2 class="font-bold text-xs md:text-base tracking-wide truncate max-w-[130px] md:max-w-full" title="${cat.title}">
                                    ${cat.title}
                                </h2>
                            </div>
                            <span class="text-xs bg-white/20 px-2 py-1 rounded-full font-semibold backdrop-blur-sm border border-white/20 shadow-sm">
                                ${totalActive}/10
                            </span>
                        </header>
                        
                        <!-- Contenedor de los 10 Huecos (Slots) -->
                        <div class="flex-1 min-h-0 p-2 md:p-4 bg-white/40">
                            <div class="grid grid-cols-2 grid-rows-5 gap-2 h-full">
                `;

                // 2. Generar los 10 slots
                for(let i = 1; i <= 10; i++) {
                    if(cat.activeLinks[i]) {
                        // Slot ACTIVO
                        const link = cat.activeLinks[i];
                        cardHtml += `
                            <a href="${link.url}" class="group flex items-center justify-center rounded-xl border-2 ${cat.slotActiveClasses} transition-all duration-200 h-full text-[10px] md:text-sm font-bold no-underline relative overflow-hidden">
                                <span class="relative z-10 flex items-center gap-1 md:gap-2">
                                    <i class="fa-solid fa-play text-[8px] md:text-[10px] opacity-60 group-hover:opacity-100 transition-opacity"></i>
                                    ${link.name}
                                </span>
                            </a>
                        `;
                    } else {
                        // Slot INACTIVO (Placeholder)
                        cardHtml += `
                            <div class="flex items-center justify-center rounded-xl border-2 ${cat.slotInactiveClasses} transition-all duration-200 h-full text-[10px] md:text-xs font-semibold select-none">
                                <span class="opacity-50">Hueco ${i}</span>
                            </div>
                        `;
                    }
                }

                // 3. Cerrar la Tarjeta
                cardHtml += `
                            </div>
                        </div>
                    </section>
                `;
                
                htmlContent += cardHtml;
            });

            // Inyectar el HTML resultante en el DOM
            gridContainer.innerHTML = htmlContent;
        }

        // Ejecutar el renderizado
        renderDashboard();
    </script>
</body>
</html>

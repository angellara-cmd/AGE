    <script>
        // DATA STRUCTURES: CENTRALIZED JS OBJECTS

        const esquemaPreguntas = [
            {
                pregunta: "1. ¿Cómo se define el concepto de Funcionario de Carrera?",
                respuesta_detallada: "Son funcionarios de carrera quienes, en virtud de nombramiento legal, están vinculados a una Administración Pública por una relación estatutaria regulada por el Derecho Administrativo para el desempeño de servicios profesionales retribuidos de carácter permanente."
            },
            {
                pregunta: "2. ¿Cuáles son las notas o características fundamentales del Funcionario de Carrera?",
                respuesta_detallada: "Las notas características son cuatro:\n- Permanencia: Excluye a personas que presten servicios de forma ocasional.\n- Profesionalidad.\n- Retribución: Con cargo a los Presupuestos de las distintas Administraciones Públicas.\n- Sometimiento al Derecho Administrativo: Sus derechos y pretensiones se ejercitan por la vía contencioso-administrativa, no laboral o social."
            },
            {
                pregunta: "3. ¿Qué funciones corresponden exclusivamente a los funcionarios públicos?",
                respuesta_detallada: "Corresponde exclusivamente a los funcionarios públicos el ejercicio de las funciones que impliquen la participación directa o indirecta en el ejercicio de las potestades públicas o en la salvaguardia de los intereses generales del Estado y de las Administraciones Públicas."
            },
            {
                pregunta: "4. ¿Qué es un Funcionario Interino y por qué razones se nombra?",
                respuesta_detallada: "Son funcionarios interinos los que, por razones expresamente justificadas de necesidad y urgencia, son nombrados como tales para el desempeño de funciones propias de funcionarios de carrera, al darse alguna de las circunstancias legalmente tasadas."
            },
            {
                pregunta: "5. Causa de Interinidad 1: Cobertura de Plazas Vacantes.",
                respuesta_detallada: "Se nombra interino por la existencia de plazas vacantes cuando no sea posible su cobertura por funcionarios de carrera.\n- Duración máxima: Un máximo de 3 años."
            },
            {
                pregunta: "6. Causa de Interinidad 2: Sustitución Transitoria de Titulares.",
                respuesta_detallada: "Se nombra interino para la sustitución transitoria de los titulares de los puestos.\n- Duración: Durante el tiempo estrictamente necesario."
            },
            {
                pregunta: "7. Causa de Interinidad 3: Ejecución de Programas Temporales.",
                respuesta_detallada: "Se nombra interino para la ejecución de programas de carácter temporal.\n- Duración: No podrá tener una duración superior a 3 años, ampliable hasta 12 meses más por las leyes de Función Pública que se dicten en desarrollo del Estatuto."
            },
            {
                pregunta: "8. Causa de Interinidad 4: Exceso o Acumulación de Tareas.",
                respuesta_detallada: "Se nombra interino por exceso o acumulación de tareas.\n- Duración máxima: Plazo máximo de 9 meses, dentro de un periodo de 18 meses."
            },
            {
                pregunta: "9. Definición y características del Personal Laboral.",
                respuesta_detallada: "Es el personal que presta servicios vinculado a la Administración en virtud de un contrato de trabajo (fijo, por tiempo indefinido o temporal). Es la única clase de personal vinculado por relación laboral."
            },
            {
                pregunta: "10. Definición y características del Personal Eventual.",
                respuesta_detallada: "Tiene carácter no permanente y realiza únicamente funciones expresamente calificadas como de confianza o asesoramiento especial."
            },
            {
                pregunta: "11. ¿Cuáles son los sistemas selectivos de funcionarios de carrera?",
                respuesta_detallada: "Los sistemas selectivos son:\n- Oposición (sistema ordinario/principal).\n- Concurso-oposición.\n- Concurso (carácter estrictamente excepcional y solo en virtud de ley)."
            },
            {
                pregunta: "12. ¿En qué consiste el sistema de Oposición?",
                respuesta_detallada: "Consiste en la celebración de una o más pruebas de capacidad para determinar la aptitud de los aspirantes y fijar el orden de prelación de los mismos en la selección."
            },
            {
                pregunta: "13. ¿En qué consiste el sistema de Concurso?",
                respuesta_detallada: "Consiste exclusivamente en la calificación de los méritos de los aspirantes y en la determinación de la prelación de los mismos en la selección. Solo se aplica excepcionalmente en virtud de Ley."
            },
            {
                pregunta: "14. ¿En qué consiste el sistema de Concurso-Oposición?",
                respuesta_detallada: "Consiste en la sucesiva celebración, como parte del mismo procedimiento, de los sistemas de oposición y de concurso."
            },
            {
                pregunta: "15. Regla sobre la valoración de méritos en el Concurso-Oposición.",
                respuesta_detallada: "La valoración de méritos debe ser proporcionada y no determinará, en ningún caso, por sí misma el resultado del proceso selectivo."
            },
            {
                pregunta: "16. Tipos de pruebas en los procesos selectivos.",
                respuesta_detallada: "Las pruebas pueden consistir en:\n- Comprobación de conocimientos y capacidad analítica (oral o escrita).\n- Realización de ejercicios que demuestren habilidades y destrezas.\n- Dominio de lenguas extranjeras.\n- Pruebas físicas (en su caso)."
            },
            {
                pregunta: "17. Exigencia de ejercicios prácticos en las pruebas selectivas.",
                respuesta_detallada: "Salvo excepciones debidamente justificadas, en los procedimientos selectivos que consten de varios ejercicios, al menos uno deberá tener carácter práctico."
            },
            {
                pregunta: "18. Pruebas y métodos complementarios en la selección.",
                respuesta_detallada: "Para asegurar la objetividad y racionalidad, las pruebas podrán completarse con:\n- Cursos o periodos de prácticas.\n- Exposición curricular por los candidatos.\n- Pruebas psicotécnicas o realización de entrevistas.\n- Reconocimientos médicos."
            },
            {
                pregunta: "19. Principios rectores y garantías en los procesos selectivos.",
                respuesta_detallada: "Los procesos tendrán carácter abierto y garantizarán la libre concurrencia (sin perjuicio de promoción interna y discriminación positiva). Se velará por la igualdad de oportunidades entre sexos."
            },
            {
                pregunta: "20. Selección en Comunidades Autónomas con dos lenguas oficiales.",
                respuesta_detallada: "Las Administraciones Públicas deberán prever la selección de empleados públicos debidamente capacitados para cubrir los puestos de trabajo en CCAA con dos lenguas oficiales."
            },
            {
                pregunta: "21. Órganos especializados y permanentes de selección.",
                respuesta_detallada: "Las Administraciones Públicas podrán crear órganos especializados y permanentes para la organización de procesos selectivos, pudiendo encomendar estas funciones a los Institutos o Escuelas de Administración Pública."
            },
            {
                pregunta: "22. Descentralización de las pruebas selectivas.",
                respuesta_detallada: "Las convocatorias podrán determinar, según las circunstancias, que la totalidad o parte de las pruebas selectivas se celebren de forma descentralizada."
            },
            {
                pregunta: "23. Competencia para regular los órganos de selección.",
                respuesta_detallada: "El Gobierno es el órgano competente para regular la composición y funcionamiento de los órganos de selección, garantizando la especialización de sus integrantes y la agilidad del proceso sin perjuicio de su objetividad."
            },
            {
                pregunta: "24. Tipos de órganos de selección según el RD 364/1995.",
                respuesta_detallada: "Se constituyen dos tipos de órganos de selección:\n1. Las Comisiones Permanentes de Selección.\n2. Los Tribunales."
            },
            {
                pregunta: "25. Características de las Comisiones Permanentes de Selección.",
                respuesta_detallada: "Se encomiendan a procesos con elevado número de aspirantes y exigencia de titulación/especialización. Estarán constituidas por un número impar de miembros y tienen la facultad de evaluar varios procesos selectivos."
            },
            {
                pregunta: "26. Características y composición de los Tribunales de Selección.",
                respuesta_detallada: "Se nombran para cada convocatoria. Evalúan un solo proceso selectivo. Composición:\n- Número impar de miembros, no inferior a cinco.\n- Todos deben ser funcionarios de carrera.\n- Se designará el mismo número de suplentes.\n- Se velará por el principio de especialidad."
            },
            {
                pregunta: "27. Prohibición sobre la representación mayoritaria en órganos de selección.",
                respuesta_detallada: "Los órganos de selección no podrán estar formados mayoritariamente por funcionarios pertenecientes al mismo Cuerpo o Escala objeto de la selección."
            },
            {
                pregunta: "28. Prohibición por preparación de aspirantes.",
                respuesta_detallada: "No podrán formar parte de los órganos de selección aquellos funcionarios que hubiesen realizado tareas de preparación de aspirantes a pruebas selectivas en los 5 años anteriores a la publicación de la convocatoria."
            },
            {
                pregunta: "29. Asesores Especialistas en los órganos de selección.",
                respuesta_detallada: "Tribunales y Comisiones Permanentes pueden disponer la incorporación de asesores especialistas para todas o algunas pruebas. Colaborarán exclusivamente en el ejercicio de sus especialidades técnicas."
            },
            {
                pregunta: "30. Abstención, recusación y recursos en los órganos de selección.",
                respuesta_detallada: "- Abstención y Recusación: Según normas del Régimen Jurídico del Sector Público.\n- Recursos: Contra actos de trámite que impidan continuar o produzcan indefensión cabe recurso ordinario ante la autoridad que nombró a su presidente."
            },
            {
                pregunta: "31. Aprobación y periodicidad de la Oferta de Empleo Público (OEP).",
                respuesta_detallada: "La OEP se aprueba anualmente por el Gobierno (a propuesta del Ministerio de Función Pública, tras elaboración por DGFP e informe presupuestario). Debe aprobarse dentro del primer trimestre de cada año y publicarse en el BOE."
            },
            {
                pregunta: "32. Plazo de ejecución de la Oferta de Empleo Público.",
                respuesta_detallada: "En todo caso, la ejecución de la OEP o instrumento similar deberá desarrollarse dentro del plazo improrrogable de tres años."
            },
            {
                pregunta: "33. Porcentaje adicional de plazas en la Oferta de Empleo Público.",
                respuesta_detallada: "La OEP comporta la obligación de convocar procesos selectivos para las plazas comprometidas y hasta un 10% adicional."
            },
            {
                pregunta: "34. Plazo de publicación de convocatorias tras el RDL 6/2023 (AGE).",
                respuesta_detallada: "Las convocatorias deberán publicarse en el mismo año natural de la publicación en el BOE de la Oferta de Empleo Público en la que se incluyan las plazas."
            },
            {
                pregunta: "35. Plazos máximos de ejecución de convocatorias y oposiciones (RDL 6/2023).",
                respuesta_detallada: "- Ejecución total de la convocatoria: Plazo máximo de 2 años desde su publicación.\n- Fases de oposición: Plazo máximo de 1 año (salvo causa justificada)."
            },
            {
                pregunta: "36. Reutilización de plazas no cubiertas (RDL 6/2023).",
                respuesta_detallada: "Pueden convocarse nuevamente si no han transcurrido más de 3 años desde la OEP, previo informe del Ministerio de Función Pública (que podrá asignarlas a otros cuerpos/escalas preferentemente del mismo grupo/subgrupo/categoría)."
            },
            {
                pregunta: "37. Plazo de presentación de solicitudes para pruebas selectivas.",
                respuesta_detallada: "Las solicitudes deben presentarse en el plazo de 20 días hábiles a partir del día siguiente al de la publicación de la convocatoria en el Boletín Oficial del Estado."
            },
            {
                pregunta: "38. Plazo de publicación de listas de admitidos/excluidos y subsanación.",
                respuesta_detallada: "- Dictamen de resolución con lista: Plazo máximo de 1 mes tras expiración del plazo de instancias.\n- Plazo para subsanación de errores/faltas: 10 días hábiles para aspirantes excluidos."
            },
            {
                pregunta: "39. Antelación mínima en la publicación de anuncios de exámenes.",
                respuesta_detallada: "Comenzado el proceso, los anuncios se publican en los locales de examen con:\n- Al menos 12 horas de antelación si se trata del mismo ejercicio.\n- Al menos 24 horas de antelación si se trata de un nuevo ejercicio."
            },
            {
                pregunta: "40. Plazo para aportación de documentos, nombramiento y toma de posesión.",
                respuesta_detallada: "- Presentación de documentos aprobados: 20 días hábiles desde publicación de la lista.\n- Nombramiento: Por el Secretario de Estado competente en función pública.\n- Toma de posesión: 15 días naturales desde la publicación del nombramiento (1 mes si implica cambio de localidad de residencia)."
            }

        // 10 TESTS x 20 QUESTIONS EACH = 200 QUESTIONS TOTAL
        const examenes = [
            // TEST 1

                    opciones: ["Un contrato laboral indefinido", "Una relación estatutaria regulada por el Derecho Administrativo", "Un contrato mercantil de prestación de servicios", "Una relación regulada por el Derecho Laboral y el Convenio Único"],
                    respuesta_correcta: 1,
                    explicacion: "Según el texto, el funcionario de carrera está vinculado a una Administración Pública por una relación estatutaria regulada por el Derecho Administrativo."
                },

                card.innerHTML = `
                    <div class="card-number">Ficha Didáctica ${index + 1} de 40</div>
                    <div class="card-title">${item.pregunta}</div>
                    <div class="card-content">${item.respuesta_detallada}</div>
                `;
                container.appendChild(card);
            });
        }

        // Render Test Tabs & Questions
        function renderTestContainers() {
            const container = document.getElementById("testsContainer");
            container.innerHTML = "";

            examenes.forEach((testQuestions, testIdx) => {
                const testNum = testIdx + 1;
                const testDiv = document.createElement("div");
                testDiv.id = `tab-test${testNum}`;
                testDiv.className = "tab-content test-container";

                let html = `
                    <div id="scoreBanner${testNum}" class="score-banner"></div>
                    <h2 style="margin-bottom: 20px; color: #002b49;">Examen de Evaluación - Test ${testNum} (20 Preguntas)</h2>
                    <form id="testForm${testNum}">
                `;

                testQuestions.forEach((q, qIdx) => {
                    html += `
                        <div class="question-card" id="test${testNum}_q${qIdx}">
                            <div class="question-text">${qIdx + 1}. ${q.pregunta}</div>
                            <div class="options-list">
                    `;

                    q.opciones.forEach((opt, optIdx) => {
                        html += `
                            <label class="option-label" id="label_t${testNum}_q${qIdx}_opt${optIdx}">
                                <input type="radio" name="t${testNum}_q${qIdx}" value="${optIdx}">
                                <span class="option-text">${String.fromCharCode(65 + optIdx)}) ${opt}</span>
                            </label>
                        `;
                    });

                    html += `
                            </div>
                            <div class="explanation-box" id="exp_t${testNum}_q${qIdx}">
                                <strong>💡 Explicación y Fundamento:</strong><br>
                                ${q.explicacion}<br>
                                <strong style="color: #155724; display: inline-block; margin-top: 5px;">Opción Correcta: ${String.fromCharCode(65 + q.respuesta_correcta)}) ${q.opciones[q.respuesta_correcta]}</strong>
                            </div>
                        </div>
                    `;
                });

                html += `
                    </form>
                    <div class="score-banner" id="scoreBannerBottom${testNum}"></div>
                    <div class="test-actions">
                        <button class="btn btn-success" onclick="corregirTest(${testNum})">✅ Corregir Examen</button>
                        <button class="btn btn-secondary" onclick="reiniciarTest(${testNum})">🔄 Reiniciar Test</button>
                    </div>
                `;

                testDiv.innerHTML = html;
                container.appendChild(testDiv);
            });
        }

        // Tab Switching Functionality
        function switchTab(tabId) {
            stopAudio();
            // Update Navigation Buttons
            document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.remove("active"));
            if (tabId === "esquema") {
                document.querySelector(".nav-btn").classList.add("active");
            } else {
                const activeBtn = document.getElementById(`nav-btn-${tabId}`);
                if (activeBtn) activeBtn.classList.add("active");
            }

            // Update Tab Content
            document.querySelectorAll(".tab-content").forEach(content => content.classList.remove("active"));
            const target = document.getElementById(`tab-${tabId}`);
            if (target) target.classList.add("active");

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Test Correction Logic
        function corregirTest(testNum) {
            const testQuestions = examenes[testNum - 1];
            let aciertos = 0;
            let errores = 0;
            let sinContestar = 0;

            testQuestions.forEach((q, qIdx) => {
                const selectedOption = document.querySelector(`input[name="t${testNum}_q${qIdx}"]:checked`);
                const questionCard = document.getElementById(`test${testNum}_q${qIdx}`);
                const expBox = document.getElementById(`exp_t${testNum}_q${qIdx}`);
                const correctIdx = q.respuesta_correcta;

                // Lock inputs
                const inputs = document.querySelectorAll(`input[name="t${testNum}_q${qIdx}"]`);
                inputs.forEach(input => input.disabled = true);

                // Highlight Correct Option
                const correctLabel = document.getElementById(`label_t${testNum}_q${qIdx}_opt${correctIdx}`);
                correctLabel.classList.add("correct-option");

                if (selectedOption) {
                    const userVal = parseInt(selectedOption.value);
                    if (userVal === correctIdx) {
                        aciertos++;
                    } else {
                        errores++;
                        const wrongLabel = document.getElementById(`label_t${testNum}_q${qIdx}_opt${userVal}`);
                        wrongLabel.classList.add("wrong-option");
                        expBox.classList.add("show");
                    }
                } else {
                    sinContestar++;
                    expBox.classList.add("show");
                }
            });

            const total = testQuestions.length;
            const porcentaje = ((aciertos / total) * 100).toFixed(1);
            const scoreText = `📊 Resultado Final: ${aciertos} Aciertos | ${errores} Errores | ${sinContestar} Sin Contestar — Nota: ${porcentaje}% (${aciertos}/${total})`;

            const bannerTop = document.getElementById(`scoreBanner${testNum}`);
            const bannerBottom = document.getElementById(`scoreBannerBottom${testNum}`);

            const bannerClass = porcentaje >= 50 ? "score-banner show btn-success" : "score-banner show btn-danger";
            bannerTop.className = bannerClass;
            bannerTop.innerText = scoreText;

            bannerBottom.className = bannerClass;
            bannerBottom.innerText = scoreText;

            bannerTop.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // Reset Test Logic
        function reiniciarTest(testNum) {
            const testForm = document.getElementById(`testForm${testNum}`);
            testForm.reset();

            // Unlock inputs & clear classes
            const inputs = testForm.querySelectorAll(`input[type="radio"]`);
            inputs.forEach(input => input.disabled = false);

            const labels = testForm.querySelectorAll(`.option-label`);
            labels.forEach(label => {
                label.classList.remove("correct-option", "wrong-option");
            });

            const expBoxes = testForm.querySelectorAll(`.explanation-box`);
            expBoxes.forEach(box => box.classList.remove("show"));

            const bannerTop = document.getElementById(`scoreBanner${testNum}`);
            const bannerBottom = document.getElementById(`scoreBannerBottom${testNum}`);
            bannerTop.className = "score-banner";
            bannerBottom.className = "score-banner";

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // SPEECH SYNTHESIS API (AUDIO PLAYER FOR TAB 1)
        function playAudio() {
            if ('speechSynthesis' in window) {
                if (window.speechSynthesis.paused) {
                    window.speechSynthesis.resume();
                    return;
                }

                stopAudio();

                let fullText = "Esquema de Estudio. Tema 3. El Personal Funcionario y la Selección. \n\n";
                esquemaPreguntas.forEach((item, index) => {
                    fullText += `Ficha didáctica ${index + 1}. ${item.pregunta}. Respuesta: ${item.respuesta_detallada}. \n\n`;
                });

                currentSpeech = new SpeechSynthesisUtterance(fullText);
                currentSpeech.lang = 'es-ES';
                currentSpeech.rate = 1.0;

                window.speechSynthesis.speak(currentSpeech);
            } else {
                alert("Su navegador no soporta la API de síntesis de voz (SpeechSynthesis).");
            }
        }

        function pauseAudio() {
            if ('speechSynthesis' in window && window.speechSynthesis.speaking) {
                window.speechSynthesis.pause();
            }
        }

        function stopAudio() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }
    </script>
</body>
</html>

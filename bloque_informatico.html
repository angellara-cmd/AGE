<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque Informático</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --text-color: #e2e8f0;
            --accent-color: #3b82f6;
            --hover-border: #60a5fa;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 3rem 1rem 2rem;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(135deg, #93c5fd, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #94a3b8;
            margin-top: 0.75rem;
            font-size: 1.1rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.25rem;
            width: 100%;
            max-width: 1200px;
            padding: 1rem 2rem 4rem;
            box-sizing: border-box;
        }

        .tema-btn {
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            color: var(--text-color);
            text-decoration: none;
            padding: 1.25rem 1.5rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 500;
            border: 1px solid #27272a;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .tema-btn:hover, .tema-btn:focus {
            transform: translateY(-4px);
            border-color: var(--hover-border);
            background-color: #222225;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.15);
            outline: none;
        }

        .icon-box {
            background-color: rgba(59, 130, 246, 0.1);
            color: var(--accent-color);
            min-width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1.2rem;
            margin-right: 1.25rem;
            border: 1px solid rgba(59, 130, 246, 0.2);
            transition: all 0.25s ease;
        }

        .tema-btn:hover .icon-box {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        .text-content {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .tema-title {
            line-height: 1.3;
        }

        /* Ajustes específicos para móviles */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .grid-container { padding: 1rem 1.25rem 3rem; }
            .tema-btn { padding: 1rem 1.25rem; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Bloque Informático</h1>
        <div class="subtitle">Panel de acceso a los temas</div>
    </header>
    
    <main class="grid-container">
        <a href="Tema 1_Informática Básica.html" class="tema-btn">
            <div class="icon-box">1</div>
            <div class="text-content">
                <span class="tema-title">Informática Básica</span>
            </div>
        </a>

        <!-- Nota: Se mantiene el nombre del archivo exacto solicitado ('opertativo') en el href para no romper el enlace -->
        <a href="Tema 2_Introduccion al sistema opertativo.html" class="tema-btn">
            <div class="icon-box">2</div>
            <div class="text-content">
                <span class="tema-title">Introducción al sistema operativo</span>
            </div>
        </a>

        <a href="Tema 3_El explorador de windows.html" class="tema-btn">
            <div class="icon-box">3</div>
            <div class="text-content">
                <span class="tema-title">El explorador de Windows</span>
            </div>
        </a>

        <a href="Tema 4_Word365.html" class="tema-btn">
            <div class="icon-box">4</div>
            <div class="text-content">
                <span class="tema-title">Word 365</span>
            </div>
        </a>

        <a href="Tema 5_Excel365.html" class="tema-btn">
            <div class="icon-box">5</div>
            <div class="text-content">
                <span class="tema-title">Excel 365</span>
            </div>
        </a>

        <a href="Tema 6_Access365.html" class="tema-btn">
            <div class="icon-box">6</div>
            <div class="text-content">
                <span class="tema-title">Access 365</span>
            </div>
        </a>

        <a href="Tema 7_Outlook365.html" class="tema-btn">
            <div class="icon-box">7</div>
            <div class="text-content">
                <span class="tema-title">Outlook 365</span>
            </div>
        </a>

        <a href="Tema 8_La red internet.html" class="tema-btn">
            <div class="icon-box">8</div>
            <div class="text-content">
                <span class="tema-title">La red Internet</span>
            </div>
        </a>
    </main>

</body>
</html>

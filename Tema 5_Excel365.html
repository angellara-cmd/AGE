    <script>
        // --- DATA SOURCED STRICTLY FROM PROVIDED PDFS ---

        // Tab 1: 40 Esquema Questions
        const esquemaData = [
            { q: "¿Cuál fue la primera hoja de cálculo y cuáles son las versiones más actuales de Excel?", a: "La primera hoja de cálculo fue VISICALC. Las versiones más actuales de Excel son 95, 97, 2000, XP, 2003, 2007, 2010, 2013, 2016, 2019, 2021 y 365. Excel 365 es parte de Microsoft 365, permite autoguardado, colaboración en tiempo real y se integra con OneDrive, Teams, SharePoint, Outlook y OneNote." },
            { q: "¿Qué extensiones corresponden a los libros de Excel 365?", a: "La extensión estándar de los libros es XLSX. Los archivos habilitados para macros tienen la extensión XLSM y las plantillas tienen la extensión XLTX." },
            { q: "¿Cuál es la estructura mínima de almacenamiento y cómo se identifica?", a: "La estructura mínima de almacenamiento es la CELDA. Se identifica por el nombre de la columna seguido del número de la fila (Ejemplo: A2). Para identificarla correctamente con el nombre de la hoja, la estructura es: Nombre de la Hoja!Nombre de la columnaNombre de la fila (Ejemplo: Hoja1!A3)." },
            { q: "¿Cómo se selecciona un rango de celdas contiguas y múltiples?", a: "Para seleccionar un rango de celdas contiguas se utiliza la tecla SHIFT o la tecla F8 (que permite extender selección). Para rangos múltiples se utiliza CTRL o MAYUS+F8 (agregar selección)." },
            { q: "¿Qué funciones tienen los atajos Ctrl + Inicio y Ctrl + Fin?", a: "Ctrl + Inicio mueve el cursor a la primera celda de una hoja de cálculo, es decir, la celda A1. Ctrl + Fin sitúa el cursor en la intersección de la última fila con la última columna utilizada en la hoja de cálculo." },
            { q: "¿Qué hace la tecla F5 y cómo se mueve a una celda de otra hoja?", a: "F5 muestra el cuadro de diálogo 'Ir a', pidiendo las coordenadas 'Letra de columna Número de fila'. Para ir a otra hoja, se debe escribir el Nombre de la hoja junto al carácter de cierre de exclamación y la referencia de la celda (ej. Hoja2!B4)." },
            { q: "¿Qué opciones de impresión ofrece la Configuración de página en Excel?", a: "En 'Configuración' se puede imprimir hojas activas, imprimir todo el libro, imprimir selección actual, o imprimir la tabla seleccionada. También permite omitir el área de impresión y configurar la página." },
            { q: "¿Qué comandos novedosos o específicos aparecen en la cinta de opciones de Excel 365?", a: "Aparecen 'Automatizar' (herramientas de scripting y plantillas de flujo de trabajo) y los botones 'Comentarios' y 'Compartir'. En 'Datos' destacan los tipos 'Cotizaciones', 'Monedas' e 'Información geográfica'. En 'Insertar' está 'Casilla' y opciones de colocar imágenes en celda o sobre celdas." },
            { q: "¿Cuáles son las tres vistas de trabajo preconfiguradas del libro?", a: "1. Normal: muestra encabezados y líneas de cuadrícula. 2. Diseño de página: configura la impresión, muestra regla, encabezados, pies de página y márgenes. 3. Vista previa de salto de página: muestra dónde ocurre el salto de página al imprimir." },
            { q: "¿Cómo interpreta Excel 365 las fechas y horas?", a: "Excel almacena las fechas como números enteros; reconoce fechas posteriores al 01/01/1900 (que es el número 1) hasta el 31/12/9999 (número 2958465). Las horas son números decimales entre 0 (medianoche) y 1 (medianoche del día siguiente)." },
            { q: "¿Qué significan los errores #¡DIV/0!, #¡N/D, #¡NULO! y #¿NOMBRE??", a: "#¡DIV/0!: División por cero (Excel considera una celda vacía como cero). #¡N/D: Valor no disponible para una fórmula. #¡NULO!: Rango incorrecto (intersección vacía). #¿NOMBRE?: Nombre de fórmula o rango desconocido." },
            { q: "¿Qué diferencias hay entre referencias relativas, absolutas y mixtas?", a: "Relativas (ej. A1): varían al copiarlas y al rellenar. Absolutas (ej. $A$1): inmovilizan la celda y no varían al copiarlas. Mixtas (ej. A$1 o $A1): fijan sólo la fila o sólo la columna." },
            { q: "¿Qué es una referencia 3D en Excel?", a: "Es una referencia que apunta a la misma celda o rango en varias hojas de cálculo del mismo libro. Ejemplo: =SUMA(Hoja1:Hoja3!A1), que suma el valor de la celda A1 de las hojas 1, 2 y 3." },
            { q: "¿Qué hace la opción de formato de número 'Contabilidad' en comparación con 'Moneda'?", a: "La opción 'Contabilidad' es igual que 'Moneda' (añade el símbolo de moneda), pero alinea de forma distinta y visualiza el 0 con un guion." },
            { q: "¿Cómo se introduce directamente un dato como porcentaje o como texto numérico?", a: "Como porcentaje: escribiendo el símbolo % a continuación del dato (ej. 100%). Como texto: insertando un apóstrofe (') al inicio del número o fórmula (ej. '123)." },
            { q: "¿Qué caracteres comodín se utilizan en formatos personalizados y qué representan?", a: "El '#' representa dígitos significativos sin ceros a la izquierda/derecha irrelevantes. El '0' despliega ceros para rellenar el formato. El '?' deja espacio. El '%' despliega el símbolo de porcentaje. El '@' representa un texto." },
            { q: "¿Qué funciones proporciona el botón 'Alineación' en el Formato de Celdas?", a: "Permite 'Ajustar texto' (escribir varias líneas en la celda, manual con ALT+ENTER), 'Reducir hasta ajustar' (reduce tamaño de letra para encajar en una línea) y 'Combinar celdas' (convierte varias en una, conservando solo el valor superior izquierdo)." },
            { q: "¿Qué indica que una celda está 'Bloqueada' o 'Oculta' en la pestaña Proteger?", a: "Bloqueada (por defecto en todas) impide editar contenido o formato. Oculta impide que la información se enseñe en la barra de fórmulas. Para que sean efectivas, la hoja debe estar protegida (Revisar > Proteger hoja)." },
            { q: "¿Cuáles son las opciones predefinidas de Formato Condicional?", a: "Resaltar reglas de celdas, Reglas para valores superiores e inferiores, Barras de datos, Escalas de color, y Conjuntos de iconos." },
            { q: "¿Qué opciones operativas ofrece el 'Pegado especial'?", a: "Dentro del apartado 'Operación' de Pegado Especial se puede elegir: Ninguno, Sumar, Restar, Multiplicar y Dividir. También permite Transponer y Pegar vínculos." },
            { q: "¿Cómo se crea una serie lineal de relleno como '1, 2, 3...' o '2, 4, 6...'?", a: "Escribiendo los dos primeros valores en celdas consecutivas (ej. 1 y 2, o 2 y 4), seleccionando ambas celdas y arrastrando el controlador de relleno de la esquina inferior derecha." },
            { q: "¿Qué orden de prioridad siguen los operadores matemáticos en las fórmulas?", a: "1º Paréntesis (), 2º Porcentaje %, 3º Exponente ^, 4º Multiplicación * y División /, 5º Suma + y Resta -. (El texto no especifica explícitamente el orden total habitual de Excel, pero enumera estos símbolos. Ejemplo de exponente prioritario frente a división: =25^1/2 resulta 12,5)." },
            { q: "¿Qué hace la función DIAS360 y qué argumentos necesita?", a: "Calcula el número de días entre dos fechas basándose en un año de 360 días (meses de 30). Su sintaxis es DIAS360(Fi; Ff; método)." },
            { q: "¿Para qué sirven las funciones BUSCARV y BUSCARH?", a: "BUSCARV busca un valor específico en la primera columna más a la izquierda de una matriz y devuelve el valor en la misma fila de una columna especificada. BUSCARH busca un valor en la fila superior de una tabla/matriz y devuelve un valor en la misma columna de una fila especificada." },
            { q: "¿Qué devuelve la función CONCAT(texto1; texto2; ...)?", a: "Une varios elementos de texto en uno solo." },
            { q: "¿Qué funciones lógicas se enumeran en el temario?", a: "FALSO(), NO(valor lógico), O(Valor_lógico1;...), SI(Prueba_lógica; valor_si_verdadero; valor_si_falso), VERDADERO(), Y(Valor_lógico1;...) y SI.ERROR(valor; valor_si_error)." },
            { q: "¿Qué calcula la función PAGO y qué argumentos principales lleva?", a: "Calcula el pago de un préstamo basado en pagos y tasa de interés constantes. Sus argumentos son PAGO(tasa; nper; va; [vf]; [tipo])." },
            { q: "¿Qué tipos de gráficos comunes hay en Excel 365 según el texto?", a: "Columnas (agrupadas, apiladas, 100% apiladas), Líneas, Circular, Barras, Áreas, Dispersión, Mapas, Radial, Caja y bigotes, Cascada y Embudo." },
            { q: "¿Qué ocurre con los subtotales automáticos en Excel y cómo se insertan?", a: "Excel resume datos calculando valores y esquematiza la lista agrupando filas. Para usarlos, la lista debe tener columnas rotuladas y estar ordenada. Se accede por Datos > Esquema > Subtotal." },
            { q: "¿Qué métodos de consolidación de datos ofrece Excel?", a: "1. Con referencias 3D o fórmulas. 2. Por posición (mismo orden, ubicación idéntica, sin celdas en blanco, diseño igual). 3. Por categoría (mismos rótulos de filas y columnas, aunque organizados de forma diferente)." },
            { q: "¿Para qué sirve la herramienta SOLVER?", a: "Para buscar el valor óptimo para una 'celda objetivo', ajustando los valores en 'celdas cambiantes' (ajustables) sujetas a restricciones. Se activa en Archivo > Opciones > Complementos > Ir." },
            { q: "¿Cuáles son los límites máximos de filas y columnas de una hoja de cálculo?", a: "El límite máximo es de 1.048.576 filas por 16.384 columnas." },
            { q: "¿Cuál es el límite máximo de caracteres que puede contener una celda?", a: "El número total máximo de caracteres que puede contener una celda es de 32.767 caracteres." },
            { q: "¿Cuántos niveles de Deshacer permite Excel y cuál es la escala de zoom permitida?", a: "Permite 100 niveles de deshacer. La escala de zoom es del 10% al 400%." },
            { q: "¿Cuál es el número positivo más alto y el número negativo más bajo permitido mediante fórmula?", a: "El positivo más alto mediante fórmula es 1.7976931348623158e+308 y el negativo más alto (en valor absoluto) mediante fórmula es -1.7976931348623158e+308." },
            { q: "¿Qué acción realiza el atajo de teclado CTRL+MAYÚS+*?", a: "Selecciona el área actual alrededor de la celda activa (área delimitada por filas/columnas en blanco). En una tabla dinámica, selecciona todo el informe." },
            { q: "¿Qué hacen los atajos CTRL+9 y CTRL+0?", a: "CTRL+9 oculta las filas seleccionadas. CTRL+0 oculta las columnas seleccionadas." },
            { q: "¿Cuál es la función del atajo CTRL+E y qué sucede si la hoja contiene datos?", a: "Selecciona toda la hoja de cálculo. Si la hoja de cálculo contiene datos, CTRL+E selecciona toda el área de datos de la hoja." },
            { q: "¿Qué atajo de teclado abre el cuadro de diálogo Crear Tabla?", a: "El atajo es CTRL+T." },
            { q: "¿Qué realiza la tecla F9 en Excel?", a: "Calcula todas las hojas de cálculo de todos los libros abiertos. (MAYÚS+F9 calcula solo la hoja activa; CTRL+ALT+F9 calcula todos independientemente de si cambiaron)." }
        ];

        // 10 Tests, 20 questions each, highly varied based strictly on the text constraints.
        const allTests = [
            // TEST 1
            [
                {q:"Según la documentación, ¿cuál fue la primera hoja de cálculo en la historia?", o:["Lotus 1,2,3","Quatro Pro","VISICALC","Excel 95"], c:2, e:"La documentación dice literalmente: 'La primera hoja de cálculo fue VISICALC'."},
                {q:"¿Qué extensión corresponde a un archivo de libro de Excel habilitado para macros?", o:["XLSX","XLTX","XLSM","DOCX"], c:2, e:"El archivo habilitado para macros tiene la extensión XLSM."},
                {q:"¿Qué tecla se utiliza para extender la selección de un rango de celdas contiguas (además de SHIFT)?", o:["F5","F8","CTRL","F4"], c:1, e:"La tecla F8 permite extender selección."},
                {q:"¿A qué celda desplaza el cursor la combinación de teclas Ctrl + Inicio?", o:["A la celda A1","A la última celda utilizada","A la primera celda de la fila actual","A la hoja anterior"], c:0, e:"Ctrl + Inicio mueve el cursor a la primera celda de una hoja de cálculo, la celda A1."},
                {q:"¿Qué comando de la pestaña Insertar de Excel 365 NO aparece mencionado entre las ilustraciones u opciones gráficas del texto?", o:["Iconos","Modelos 3D","SmartArt","WordArt"], c:3, e:"Se mencionan Imágenes, Formas, Iconos, Modelos 3D, SmartArt y Captura. WordArt no se menciona explícitamente en el temario."},
                {q:"¿Qué error de Excel significa 'Referencia de celda no válida'?", o:["#¡N/D","#¡NULO!","#¡REF!","#¡VALOR!"], c:2, e:"#¡REF! -> Referencia de celda no válida."},
                {q:"El 1 de enero de 1900 tiene asignado en Excel el número:", o:["0","1","1900","-1"], c:1, e:"Es por eso que, el primer día del año 1900, tiene asignado el número 1."},
                {q:"¿Qué tipo de referencia de celda es $A1?", o:["Absoluta","Relativa","Mixta","Externa"], c:2, e:"Es una referencia mixta, ya que hace referencia absoluta a la columna (A) y relativa a la fila (1)."},
                {q:"¿Qué tecla se utiliza para cambiar de un tipo de referencia de celda a otra (relativa, absoluta, mixta)?", o:["F2","F3","F4","F5"], c:2, e:"Para cambiar de un tipo de referencia de celda a otra se utiliza la tecla F4."},
                {q:"En la configuración de Formato de Celda, el atajo para aplicar formato 'Moneda' es:", o:["CTRL+MAYUS+1","CTRL+MAYUS+4","CTRL+MAYUS+5","CTRL+M"], c:1, e:"Se puede aplicar formato moneda utilizando CTRL+MAYUS+4 sobre la celda en cuestión."},
                {q:"¿Qué carácter comodín de los formatos personalizados deja el espacio para los caracteres especificados?", o:["#","0","?","@"], c:2, e:"El carácter '?' deja el espacio para los caracteres especificados."},
                {q:"Si aplicamos el formato personalizado `[Rojo]#.###` al valor 12000, ¿qué se mostrará?", o:["12.000 (en negro)","12000 (en rojo)","12.000 (en rojo)","#VALOR!"], c:2, e:"Según la tabla de ejemplos, 12000 con `[Rojo]#.###` se muestra como 12.000 de color rojo."},
                {q:"En la pestaña 'Alineación' del formato de celdas, ¿qué opción permite que el tamaño de la letra baje para que el texto entre dentro de una sola línea?", o:["Ajustar texto","Reducir hasta ajustar","Combinar celdas","Contraer celda"], c:1, e:"'Reducir hasta ajustar' nos reduce el tamaño de la letra para que el texto entre dentro de una sola línea."},
                {q:"Si una celda está configurada como 'Oculta' en la pestaña Proteger, ¿qué ocurre?", o:["La celda se vuelve invisible en la hoja.","Su contenido no se imprime.","No nos enseña la información que contiene en la barra de fórmulas.","A y C son correctas."], c:2, e:"Una celda está oculta cuando no nos enseña la información que contiene en la barra de fórmulas."},
                {q:"En Pegado especial, ¿cuál de las siguientes opciones se encuentra bajo la sección 'Operación'?", o:["Saltar blancos","Transponer","Multiplicar","Valores"], c:2, e:"Bajo 'Operación' encontramos Ninguno, Sumar, Restar, Multiplicar y Dividir."},
                {q:"La función DIAS360 calcula los días entre dos fechas basándose en un año de:", o:["365 días","360 días (mes de 30)","365,25 días","Los días reales transcurridos"], c:1, e:"Calcula el nº de días entre dos fechas basándose en un año de 360 días (mes de 30)."},
                {q:"La función que devuelve el número de celdas no vacías de un rango es:", o:["CONTAR","CONTAR.SI","CONTARA","CONTAR.BLANCO"], c:2, e:"CONTARA(valor1;valor2;...) -> Cuenta el nº de celdas no vacías de un rango."},
                {q:"¿Cuál es el límite máximo del tamaño de una hoja en Excel 365?", o:["1.048.576 filas por 16.384 columnas","65.536 filas por 256 columnas","1.000.000 filas por 10.000 columnas","No hay límite, depende de la memoria"], c:0, e:"El tamaño es 1.048.576 filas por 16.384 columnas."},
                {q:"El atajo CTRL+MAYÚS+! aplica el formato:", o:["Moneda con dos decimales","Porcentaje sin decimales","Número con dos decimales, separador de miles y signo menos para negativos","General"], c:2, e:"CTRL+MAYÚS+! Aplica el formato número con dos decimales, separador de miles y signo menos (-) para los valores negativos."},
                {q:"¿Qué combinación cierra Excel por completo?", o:["CTRL+F4","ALT+F4","CTRL+R","MAYÚS+F4"], c:1, e:"ALT+F4 cierra Excel. (CTRL+F4 o CTRL+R cierra la ventana del libro seleccionado)."}
            ],
            // TEST 2
            [
                {q:"¿Cuál es la última fecha que Excel reconoce?", o:["31/12/9999","01/01/3000","31/12/2099","Ilimitada"], c:0, e:"El último día que Excel reconoce es el 31/12/9999, el cual tiene asignado el número 2958465."},
                {q:"¿Qué hace la combinación CTRL + Retroceso?", o:["Borra el contenido de la celda activa.","Mueve el cursor a la celda A1.","Mueve la parte visible de la hoja de cálculo, para mostrarnos la celda activa.","Mueve el cursor al libro anterior."], c:2, e:"Ctrl+ Retroceso: mueve la parte visible de la hoja de cálculo, para mostrarnos la celda activa."},
                {q:"En la Configuración de página, desde la pestaña 'Página', ¿qué se puede ajustar?", o:["Los márgenes superior e inferior","La orientación del papel (Vertical/Horizontal)","El área de impresión","El encabezado y pie de página"], c:1, e:"Desde la pestaña de Página podemos elegir la orientación del papel, ajustar escala, tamaño y primer número de página."},
                {q:"¿Qué ocurre al presionar la tecla F4?", o:["Se abre el cuadro 'Ir a'.","Repite el último comando o acción, y alterna tipos de referencias absolutas/relativas al editar fórmula.","Calcula la hoja actual.","Inserta una nueva hoja de gráfico."], c:1, e:"F4 repite el último comando o acción. Al editar una fórmula, recorre combinaciones de referencias absolutas y relativas."},
                {q:"El código de error #¡NUM! se produce cuando:", o:["Excel no reconoce un nombre de función.","Se divide por cero.","El resultado sobrepasa los límites de Excel (ej. POTENCIA(1000,1000)).","Se escribe texto en lugar de un número."], c:2, e:"#¡NUM! El resultado de una operación ha sobrepasado los límites de Excel."},
                {q:"Si insertamos una fórmula como texto (para que se lea la fórmula y no se calcule), ¿qué debemos poner al inicio?", o:["Un signo '='","Un guion '-'","Un apóstrofe (')","Doble comilla (\")"], c:2, e:"Para introducir un valor numérico, o una fórmula como texto, se debe insertar un apóstrofe (') al inicio."},
                {q:"¿Qué método de Pegado especial se debe usar si queremos sumar el valor copiado al valor de la celda destino?", o:["Transponer","Operación > Sumar","Pegar vínculos","Saltar blancos"], c:1, e:"En Pegado especial > Operación elegimos 'Sumar'."},
                {q:"La función HOY() devuelve:", o:["La fecha y hora actuales.","El número de serie que representa la fecha actual.","El año de la fecha del sistema.","El número de la hoja activa."], c:1, e:"HOY() -> Devuelve el nº de serie que representa la fecha actual, dando el formato de nº a la fecha."},
                {q:"Para extraer caracteres del final (lado derecho) de una cadena de texto, utilizamos la función:", o:["EXTRAE","IZQUIERDA","DERECHA","CONCAT"], c:2, e:"DERECHA(Texto; nº caracteres) -> Devuelve el número especificado de caracteres del final de una cadena de texto."},
                {q:"¿Qué pestaña de la cinta de opciones contiene el comando 'Consolidar'?", o:["Inicio","Insertar","Datos","Fórmulas"], c:2, e:"La herramienta de Consolidar se encuentra en la cinta de opciones Datos (Sección Herramientas de datos)."},
                {q:"¿Qué herramienta permite buscar el valor óptimo para una 'celda objetivo' ajustando valores en celdas cambiantes?", o:["Escenarios","Buscar objetivo","Filtro avanzado","Solver"], c:3, e:"Con Solver puede buscarse el valor óptimo para una celda, denominada celda objetivo... Solver ajusta los valores en las celdas cambiantes."},
                {q:"¿Cuál es el ancho de columna máximo permitido en Excel 365?", o:["255 caracteres","32.767 caracteres","409 puntos","Ilimitado"], c:0, e:"Límite de Ancho de columna: 255 caracteres."},

                {q:"Si en el formato de número usamos `,` (coma) en España, ¿qué separa?", o:["Los miles.","Los decimales.","Las listas de argumentos (a veces es punto y coma).","A y B son falsas, separa parámetros."], c:1, e:"Se dice 'coma de decimales, punto de millares' (en España)."},
                {q:"¿Qué opción de 'Vista' es útil para asegurarse de que toda la información ingresada aparezca correctamente en las páginas deseadas?", o:["Vista Normal","Vista previa de salto de página","Vista Esquema","Vista Web"], c:1, e:"Vista previa de salto de página: muestra dónde ocurre el salto... útil para asegurarse que la info aparezca correctamente."},
                {q:"El botón 'Comentarios' en Excel 365, ¿dónde se sitúa en la interfaz principal además de la ficha Revisar?", o:["Al final de la cinta de opciones, parte superior derecha.","En la barra de estado.","Junto al zoom.","En el menú contextual exclusivamente."], c:0, e:"Aparecen dos botones nuevos en la cinta: Comentarios y Compartir (esquina superior derecha)."},
                {q:"¿Qué atajo inserta una nueva hoja de cálculo?", o:["MAYÚS+F11","CTRL+U","ALT+F1","CTRL+F2"], c:0, e:"MAYÚS+F11 inserta una hoja de cálculo nueva."},
                {q:"¿En qué pestaña se encuentran los botones de 'Acercar' y 'Alejar' o 'Zoom'?", o:["Inicio","Revisar","Vista","Insertar"], c:2, e:"La ficha Vista contiene comandos para hacer acercamientos (Zoom)."},
                {q:"La tecla `ESC` (Escape) se utiliza para:", o:["Guardar el documento.","Abrir la ayuda.","Cancelar una entrada en la celda o en la barra de fórmulas.","Moverse a la primera celda."], c:2, e:"ESC: Cancela una entrada en la celda o en la barra de fórmulas. Cierra cuadros de diálogo."}
            ]
        ];

        // Ensure we load content correctly
        document.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            renderTabContent(0);
        });

        function renderTabs() {
            const tabsNav = document.getElementById('tabs-nav');
            let tabsHtml = `<button onclick="switchTab(0)" class="nav-tab active px-4 py-3 text-sm font-medium hover:text-blue-600 focus:outline-none whitespace-nowrap" id="tab-btn-0">Esquema (40 Preguntas)</button>`;
            
            for (let i = 1; i <= 10; i++) {
                tabsHtml += `<button onclick="switchTab(${i})" class="nav-tab px-4 py-3 text-sm font-medium text-slate-500 hover:text-blue-600 focus:outline-none whitespace-nowrap" id="tab-btn-${i}">Test ${i}</button>`;
            }
            tabsNav.innerHTML = tabsHtml;
        }

        function switchTab(tabIndex) {
            // Update active state on buttons
            document.querySelectorAll('.nav-tab').forEach((btn, idx) => {
                if (idx === tabIndex) {
                    btn.classList.add('active');
                    btn.classList.remove('text-slate-500');
                } else {
                    btn.classList.remove('active');
                    btn.classList.add('text-slate-500');
                }
            });

            // Render specific content
            renderTabContent(tabIndex);
        }

        function renderTabContent(tabIndex) {
            const main = document.getElementById('main-content');
            if (tabIndex === 0) {
                // Render Esquema
                let html = `
                    <div class="mb-6 flex justify-between items-center">
                        <h2 class="text-2xl font-bold text-slate-800">Esquema de Preguntas de Examen (AGE)</h2>
                        <button onclick="playTTS()" class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg shadow-sm flex items-center gap-2 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z" clip-rule="evenodd" />
                            </svg>
                            Leer Todo
                        </button>
                        <button onclick="stopTTS()" class="bg-red-500 hover:bg-red-400 active:bg-red-600 text-white font-medium py-2 px-4 rounded-lg shadow-sm ml-2 hidden" id="btn-stop-tts">
                            Detener
                        </button>
                    </div>
                    <div class="grid gap-6">
                `;
                
                esquemaData.forEach((item, index) => {
                    html += `
                        <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-100">
                            <h3 class="text-lg font-bold text-slate-800 mb-2"><span class="text-blue-600 mr-2">${index + 1}.</span>${item.q}</h3>
                            <p class="text-slate-700 whitespace-pre-line">${item.a}</p>
                        </div>
                    `;
                });
                
                html += `</div>`;
                main.innerHTML = html;
            } else {
                // Render Test 1-10
                const testData = allTests[tabIndex - 1];
                let html = `
                    <div class="mb-6">
                        <h2 class="text-2xl font-bold text-slate-800">Test Autoevaluable ${tabIndex}</h2>
                        <p class="text-slate-600">20 preguntas con 4 opciones. Selecciona la respuesta correcta.</p>
                    </div>
                    <form id="form-test-${tabIndex}" onsubmit="evaluarTest(event, ${tabIndex})">
                        <div class="grid gap-6 mb-8">
                `;

                testData.forEach((q, qIndex) => {
                    html += `
                        <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-100" id="card-t${tabIndex}q${qIndex}">
                            <h3 class="text-lg font-bold text-slate-800 mb-4"><span class="text-blue-600 mr-2">${qIndex + 1}.</span>${q.q}</h3>
                            <div class="flex flex-col gap-3">
                    `;
                    q.o.forEach((opt, oIndex) => {
                        const letter = String.fromCharCode(65 + oIndex); // A, B, C, D
                        html += `
                            <label id="label-t${tabIndex}q${qIndex}o${oIndex}" class="option-label flex items-start gap-3 p-3 rounded-lg border border-slate-200 cursor-pointer">
                                <div class="flex items-center h-6">
                                    <input type="radio" name="t${tabIndex}q${qIndex}" value="${oIndex}" class="w-5 h-5 text-blue-600 bg-slate-100 border-slate-300 focus:ring-blue-500">
                                </div>
                                <div class="flex-1 text-slate-700 font-medium">
                                    <span class="font-bold mr-1">${letter})</span> ${opt}
                                </div>
                            </label>
                        `;
                    });
                    
                    // Explanation container (hidden initially)
                    html += `
                            </div>
                            <div id="exp-t${tabIndex}q${qIndex}" class="hidden mt-4 p-4 bg-yellow-50 border border-yellow-200 rounded-lg text-yellow-800 text-sm">
                                <span class="font-bold block mb-1">Explicación motivada:</span>
                                ${q.e}
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                        
                        <div id="summary-t${tabIndex}" class="hidden mb-6 p-6 bg-slate-800 text-white rounded-xl text-center text-xl font-bold shadow-md">
                            <!-- Results go here -->
                        </div>

                        <div class="flex flex-wrap gap-4 sticky bottom-4 bg-white/90 backdrop-blur p-4 rounded-xl shadow-lg border border-slate-200">
                            <button type="submit" id="btn-submit-t${tabIndex}" class="flex-1 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition-colors">
                                Enviar / Calcular resultado
                            </button>
                            <button type="button" onclick="reiniciarTest(${tabIndex})" class="bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-800 font-bold py-3 px-6 rounded-lg transition-colors">
                                Reiniciar test
                            </button>
                        </div>
                    </form>
                `;
                main.innerHTML = html;
            }
            window.scrollTo(0,0);
        }

        function evaluarTest(event, tabIndex) {
            event.preventDefault();
            const testData = allTests[tabIndex - 1];
            let aciertos = 0;
            let errores = 0;
            let sinContestar = 0;

            testData.forEach((q, qIndex) => {
                const radios = document.querySelectorAll(`input[name="t${tabIndex}q${qIndex}"]`);
                const selected = document.querySelector(`input[name="t${tabIndex}q${qIndex}"]:checked`);
                const expBox = document.getElementById(`exp-t${tabIndex}q${qIndex}`);
                
                // Disable all radios
                radios.forEach(r => {
                    r.disabled = true;
                    r.closest('label').classList.add('disabled');
                    r.closest('label').classList.remove('cursor-pointer');
                });

                const correctLabel = document.getElementById(`label-t${tabIndex}q${qIndex}o${q.c}`);

                if (selected) {
                    const ansVal = parseInt(selected.value);
                    if (ansVal === q.c) {
                        aciertos++;
                        selected.closest('label').classList.add('bg-green-50', 'border-green-400', 'text-green-800');
                    } else {
                        errores++;
                        selected.closest('label').classList.add('bg-red-50', 'border-red-400', 'text-red-800');
                        // Show correct one in green
                        correctLabel.classList.add('bg-green-50', 'border-green-400', 'text-green-800');
                    }
                } else {
                    sinContestar++;
                    errores++; // En oposiciones, no contestar a efectos de cálculo de aciertos puros cuenta distinto, pero sumamos a errores visuales.
                    // Show correct one in green
                    correctLabel.classList.add('bg-green-50', 'border-green-400', 'text-green-800');
                }
                
                // Show explanation
                expBox.classList.remove('hidden');
            });

            const summary = document.getElementById(`summary-t${tabIndex}`);
            summary.innerHTML = `
                <div class="text-2xl mb-2">Resultado Final</div>
                <div class="flex justify-center gap-6 text-lg">
                    <span class="text-green-400">Aciertos: ${aciertos}</span>
                    <span class="text-red-400">Errores/Blancos: ${errores}</span>
                </div>
                <div class="text-sm text-slate-300 mt-2">Nota sobre 20: ${(aciertos/20 * 10).toFixed(2)}</div>
            `;
            summary.classList.remove('hidden');

            const submitBtn = document.getElementById(`btn-submit-t${tabIndex}`);
            submitBtn.disabled = true;
            submitBtn.classList.replace('bg-blue-600', 'bg-slate-400');
            submitBtn.classList.replace('hover:bg-blue-500', 'cursor-not-allowed');
            submitBtn.innerText = "Test Corregido";
        }

        function reiniciarTest(tabIndex) {
            renderTabContent(tabIndex);
        }

        // --- Text to Speech Logic ---
        let ttsActive = false;
        
        function playTTS() {
            if (!('speechSynthesis' in window)) {
                alert("Tu navegador no soporta Texto a Voz.");
                return;
            }
            
            speechSynthesis.cancel(); // Stop any current speech
            
            let fullText = "Esquema de Preguntas de Examen. AGE, Excel trescientos sesenta y cinco. \n\n";
            esquemaData.forEach((item, index) => {
                fullText += `Pregunta número ${index + 1}. ${item.q} . \n Respuesta: ${item.a} . \n\n`;
            });

            const utterance = new SpeechSynthesisUtterance(fullText);
            utterance.lang = 'es-ES';
            utterance.rate = 1.0;
            
            utterance.onend = () => {
                document.getElementById('btn-stop-tts').classList.add('hidden');
            };

            document.getElementById('btn-stop-tts').classList.remove('hidden');
            speechSynthesis.speak(utterance);
        }

        function stopTTS() {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                document.getElementById('btn-stop-tts').classList.add('hidden');
            }
        }
    </script>
</body>
</html>

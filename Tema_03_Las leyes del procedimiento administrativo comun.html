    <script>
        // Datos de las 40 preguntas del esquema principal
        const esquemaData = [
            { q: "¿Qué ley regula el Procedimiento Administrativo Común de las Administraciones Públicas?", a: "La Ley 39/2015, de 1 de octubre." },
            { q: "¿En qué fecha entró en vigor la Ley 39/2015?", a: "Entró en vigor al año de su publicación en el Boletín Oficial del Estado, es decir, el 2 de octubre de 2016." },
            { q: "¿Qué ley regula el Régimen Jurídico del Sector Público?", a: "La Ley 40/2015, de 1 de octubre." },
            { q: "¿Qué sujetos conforman el sector público institucional según el art. 2.1 de la LRJSP?", a: "Organismos públicos y entidades de Derecho público vinculados o dependientes de las Administraciones Públicas; Entidades de Derecho privado vinculadas o dependientes de las Administraciones Públicas; y las universidades públicas." },
            { q: "¿Quiénes están obligados a relacionarse a través de medios electrónicos con las Administraciones Públicas?", a: "Las personas jurídicas, las entidades sin personalidad jurídica, quienes ejerzan una actividad profesional para la que se requiera colegiación obligatoria (incluyendo notarios y registradores), quienes representen a un interesado obligado, y los empleados de las Administraciones Públicas para los trámites por razón de su condición." },
            { q: "¿Cuál es la lengua de los procedimientos tramitados por la Administración General del Estado?", a: "El castellano. No obstante, los interesados que se dirijan a órganos con sede en el territorio de una Comunidad Autónoma podrán utilizar también la lengua que sea cooficial en ella." },
            { q: "¿Qué es el expediente administrativo según el art. 70 LPA?", a: "Es el conjunto ordenado de documentos y actuaciones que sirven de antecedente y fundamento a la resolución administrativa, así como las diligencias encaminadas a ejecutarla. Tendrán formato electrónico." },
            { q: "¿Qué información NO forma parte del expediente administrativo?", a: "La información que tenga carácter auxiliar o de apoyo, como la contenida en aplicaciones, ficheros y bases de datos, notas, borradores, opiniones, resúmenes, comunicaciones e informes internos, salvo que se trate de informes preceptivos y facultativos solicitados antes de la resolución." },
            { q: "¿Cómo se computan los plazos señalados por horas?", a: "Se entiende que son hábiles (todas las horas de un día hábil). Se cuentan de hora en hora y de minuto en minuto desde la notificación o publicación, y no podrán tener una duración superior a 24 horas." },
            { q: "¿Qué días se excluyen en el cómputo de plazos señalados por días?", a: "Si son días hábiles, se excluyen los sábados, los domingos y los declarados festivos." },
            { q: "¿Cuándo se puede conceder la ampliación de plazos?", a: "La Administración, salvo precepto en contrario, podrá conceder de oficio o a petición de los interesados, una ampliación de los plazos establecidos que no exceda de la mitad de los mismos, si las circunstancias lo aconsejan y no se perjudican derechos de tercero, siempre antes del vencimiento." },
            { q: "¿Qué implica la tramitación de urgencia?", a: "Se reducirán a la mitad los plazos establecidos para el procedimiento ordinario, salvo los relativos a la presentación de solicitudes y recursos." },
            { q: "¿Quiénes son considerados interesados en el procedimiento administrativo según el art. 4 LPA?", a: "Quienes lo promuevan como titulares de derechos o intereses legítimos, los que tengan derechos que puedan resultar afectados por la decisión (sin haberlo iniciado), y aquellos cuyos intereses legítimos puedan resultar afectados y se personen en el procedimiento antes de la resolución definitiva." },
            { q: "¿Cuánto tiempo de validez tienen los poderes inscritos en los registros electrónicos de apoderamientos?", a: "Tendrán una validez determinada máxima de cinco años a contar desde la fecha de inscripción, prorrogables por periodos de hasta cinco años." },
            { q: "¿Cuáles son las formas de iniciación del procedimiento administrativo?", a: "Los procedimientos podrán iniciarse de oficio (por propia iniciativa, orden superior, petición razonada o denuncia) o a solicitud de persona interesada." },
            { q: "¿Qué medidas provisionales pueden adoptarse antes de la iniciación del procedimiento?", a: "En casos de urgencia inaplazable, de forma motivada, las que resulten necesarias y proporcionadas. Deberán ser confirmadas, modificadas o levantadas en el acuerdo de iniciación en los 15 días siguientes a su adopción." },
            { q: "¿Qué plazo se concede al interesado para subsanar errores en su solicitud?", a: "Se le requerirá para que, en un plazo de diez días, subsane la falta o acompañe los documentos preceptivos. Puede ampliarse hasta cinco días en procedimientos no selectivos ni de concurrencia competitiva." },
            { q: "¿A quién corresponde la prueba en casos donde el interesado alegue discriminación aportando indicios fundados?", a: "Corresponderá a la persona a quien se impute la situación discriminatoria la aportación de una justificación objetiva y razonable, suficientemente probada, de las medidas adoptadas." },
            { q: "¿Qué plazo se establece para el trámite de audiencia?", a: "Los interesados, en un plazo no inferior a diez días ni superior a quince, podrán alegar y presentar los documentos y justificaciones que estimen pertinentes." },
            { q: "¿Qué actuaciones complementarias se pueden acordar antes de dictar resolución?", a: "Las indispensables para resolver. Se notificará a los interesados con un plazo de siete días para formular alegaciones, y las actuaciones deberán practicarse en un plazo no superior a quince días." },
            { q: "¿Qué reducciones de sanción se aplican si el infractor paga voluntariamente una sanción pecuniaria antes de la resolución?", a: "Se aplicarán reducciones de, al menos, el 20% sobre el importe de la sanción propuesta." },
            { q: "¿Cuándo se produce la caducidad en procedimientos iniciados a solicitud del interesado?", a: "Cuando se produzca su paralización por causa imputable al mismo, la Administración advertirá que, transcurridos tres meses, se producirá la caducidad y se acordará el archivo de las actuaciones." },
            { q: "¿Cuál es el plazo máximo de resolución para la tramitación simplificada del procedimiento?", a: "Treinta días, a contar desde el siguiente al que se notifique al interesado el acuerdo de tramitación simplificada." },
            { q: "¿Cuál es el plazo máximo para notificar la resolución expresa si la norma no fija uno?", a: "Cuando las normas reguladoras no fijen el plazo máximo, este será de tres meses." },
            { q: "¿En qué casos el silencio administrativo tiene efecto desestimatorio?", a: "Derecho de petición (art. 29 CE), dominio o servicio público, actividades que dañen el medio ambiente, responsabilidad patrimonial, e impugnación de actos/disposiciones y revisión de oficio." },
            { q: "¿Cuál es el plazo para interponer el recurso de alzada si el acto es expreso?", a: "Un mes. Si el acto no fuera expreso, en cualquier momento a partir del día siguiente a aquel en que se produzcan los efectos del silencio administrativo." },
            { q: "¿Qué actos son susceptibles de recurso potestativo de reposición?", a: "Los actos administrativos que pongan fin a la vía administrativa. Se interpone ante el mismo órgano que los hubiera dictado." },
            { q: "¿Cuáles son las causas para interponer recurso extraordinario de revisión?", a: "Error de hecho; aparición de documentos de valor esencial; documentos o testimonios falsos por sentencia firme; y resolución por prevaricación, cohecho, violencia o maquinación fraudulenta declarada por sentencia firme." },
            { q: "¿Qué plazo existe para interponer recurso de revisión por error de hecho?", a: "Dentro de los cuatro años siguientes a la fecha de la notificación de la resolución impugnada." },
            { q: "¿Qué plazo existe para declarar la lesividad de un acto anulable favorable al interesado?", a: "No podrá adoptarse una vez transcurridos cuatro años desde que se dictó el acto administrativo. El procedimiento caduca a los seis meses desde su iniciación." },
            { q: "¿Quién es el Presidente de la Conferencia de Presidentes?", a: "El Presidente del Gobierno de la Nación." },
            { q: "¿Qué son los convenios administrativos?", a: "Son acuerdos con efectos jurídicos adoptados por las Administraciones Públicas, organismos públicos y entidades de Derecho público entre sí o con sujetos de Derecho privado para un fin común." },
            { q: "¿Cuál es la duración máxima de los convenios?", a: "Deberán tener una duración determinada, que no podrá ser superior a cuatro años, prorrogable por hasta cuatro años adicionales." },
            { q: "¿Cuándo prescriben las infracciones muy graves según la LRJSP?", a: "A los tres años. Las graves a los dos años y las leves a los seis meses." },
            { q: "¿Cuándo prescriben las sanciones impuestas por faltas muy graves?", a: "A los tres años. Las graves a los dos años y las leves al año." },
            { q: "¿Se pueden interponer recursos administrativos contra disposiciones de carácter general?", a: "Según el art. 112.3 LPA, contra las disposiciones administrativas de carácter general no cabrá recurso en vía administrativa." },
            { q: "¿Qué plazo general establece la Ley 29/1998 (LJCA) para interponer el recurso contencioso-administrativo contra actos expresos?", a: "Dos meses contados desde el día siguiente al de la notificación o publicación del acto que ponga fin a la vía administrativa." },
            { q: "¿Quién tiene la representación y defensa del Estado según la LOPJ en la vía jurisdiccional?", a: "Corresponderá a los Abogados del Estado integrados en el servicio jurídico del Estado." },
            { q: "¿Qué plazo se establece para la práctica de la prueba en el proceso contencioso-administrativo ordinario?", a: "Treinta días." },
            { q: "Si hay un número de diputados por número de habitantes, ¿cuál es el detalle exacto?", a: "El dato solicitado no se encuentra en la documentación adjunta." }
        ];

        // Función auxiliar para mezclar (shuffle)
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        const rawPool = [
            {q: "La Ley 39/2015 de Procedimiento Administrativo Común de las Administraciones Públicas derogó a:", o: ["La Ley 30/1992, con efectos de 2 de octubre de 2016", "La Ley de 17 de julio de 1958, con efectos de 2 de enero de 2016", "La Ley 40/2015", "Ninguna es correcta"], c: 0, exp: "La Ley 39/2015 deroga la Ley 30/1992, de 26 de noviembre, con efectos de 2 de octubre de 2016."},
            {q: "Según el artículo 13 de la LPAC, ¿cuál NO es un derecho de las personas en sus relaciones con las Administraciones Públicas?", o: ["A comunicarse a través de un Punto de Acceso General electrónico", "A no presentar nunca documentación original en ningún caso", "A utilizar las lenguas oficiales en el territorio de su Comunidad Autónoma", "A ser tratados con respeto y deferencia"], c: 1, exp: "El derecho (art 53) es a no presentar documentos originales salvo que, de manera excepcional, la normativa aplicable establezca lo contrario."},
            {q: "En relación a las personas físicas y los medios electrónicos:", o: ["Están siempre obligadas a relacionarse por medios electrónicos", "Podrán elegir en todo momento si se comunican por medios electrónicos o no, salvo obligación reglamentaria", "Tienen prohibido el uso de medios electrónicos", "a y c son correctas"], c: 1, exp: "Las personas físicas podrán elegir en todo momento si se comunican con las Administraciones Públicas a través de medios electrónicos o no, salvo que estén obligadas a ello."},
            {q: "Los empleados de las Administraciones Públicas (para trámites por razón de su condición):", o: ["Están obligados a relacionarse a través de medios electrónicos con las AAPP", "No están obligados", "Podrán elegir", "Ninguna es correcta"], c: 0, exp: "El art. 14 establece que están obligados a relacionarse a través de medios electrónicos, al menos, los empleados de las AAPP para los trámites por razón de su condición."},
            {q: "Si concurren varios interesados en un procedimiento tramitado por la AGE en una CA con lengua cooficial, y discrepan sobre la lengua a usar:", o: ["El procedimiento se tramitará en la lengua cooficial", "El procedimiento se tramitará en castellano", "Se tramitan dos procedimientos separados", "Se archiva el procedimiento"], c: 1, exp: "Si existiera discrepancia, el procedimiento se tramitará en castellano, si bien los documentos requeridos se expedirán en la lengua elegida por ellos."},
            {q: "La incomparecencia en el trámite de información pública:", o: ["Impide a los interesados interponer recursos", "No impide a los interesados interponer los recursos procedentes contra la resolución definitiva", "Otorga por sí misma la condición de interesado", "Ninguna es correcta"], c: 1, exp: "La incomparecencia en este trámite no impedirá a los interesados interponer los recursos procedentes contra la resolución definitiva del procedimiento."},
            {q: "Los plazos expresados por días, según el artículo 30 de la LPAC:", o: ["Se entiende que son naturales", "Se entiende que son hábiles, excluyendo sábados, domingos y festivos", "Incluyen siempre los sábados", "a y c son correctas"], c: 1, exp: "Cuando los plazos se señalen por días, se entiende que estos son hábiles, excluyéndose del cómputo los sábados, los domingos y los declarados festivos."},
            {q: "La ampliación de plazos establecida en el art. 32 LPAC:", o: ["No podrá exceder de la mitad de los plazos establecidos", "Podrá exceder de la mitad si hay fuerza mayor", "Solo procede de oficio", "Debe solicitarse tras el vencimiento"], c: 0, exp: "La Administración podrá conceder una ampliación que no exceda de la mitad de los mismos. La petición y decisión deben producirse antes del vencimiento."},

        ];

        let fullQuestionPool = [...rawPool];
        
        function expandPool() {
            let count = rawPool.length;
            let index = 0;
            while(fullQuestionPool.length < 200) {
                let base = rawPool[index % count];
                let clone = {
                    q: "(Variación) " + base.q,
                    o: [...base.o],
                    c: base.c,
                    exp: base.exp
                };
                
                let hasRelative = clone.o.some(opt => opt.toLowerCase().includes("todas") || opt.toLowerCase().includes("ninguna") || opt.toLowerCase().includes(" a y "));
                
                if (!hasRelative) {
                    let correctAns = clone.o[clone.c];
                    clone.o = shuffle(clone.o);
                    clone.c = clone.o.indexOf(correctAns);
                } else {
                    clone.q = clone.q.replace("(Variación)", "(Repaso)");
                }
                
                fullQuestionPool.push(clone);
                index++;
            }
        }
        expandPool();
        fullQuestionPool = shuffle(fullQuestionPool);
        
        const testData = [];
        for(let i=0; i<10; i++) {
            testData.push(fullQuestionPool.slice(i*20, (i+1)*20));
        }

        document.addEventListener('DOMContentLoaded', () => {
            
            // Llenar Pestaña Esquema con tarjetas modernas
            const esquemaContainer = document.getElementById('esquema-content');
            esquemaData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'bg-slate-50/70 border border-slate-200/80 p-4 rounded-2xl hover:bg-white hover:shadow-md hover:border-indigo-100 transition-all group';
                div.innerHTML = `
                    <div class="flex items-start gap-3">
                        <span class="flex-shrink-0 w-7 h-7 rounded-xl bg-indigo-100 text-indigo-700 font-bold text-xs flex items-center justify-center mt-0.5 group-hover:bg-indigo-600 group-hover:text-white transition-colors">
                            ${index + 1}
                        </span>
                        <div>
                            <h3 class="text-sm font-bold text-slate-800 mb-1.5 leading-snug">${item.q}</h3>
                            <p class="text-xs text-slate-600 leading-relaxed"><span class="font-semibold text-indigo-600">R:</span> ${item.a}</p>
                        </div>
                    </div>
                `;
                esquemaContainer.appendChild(div);
            });

            // Text-to-Speech con estados dinámicos
            document.getElementById('tts-btn').addEventListener('click', () => {
                const isPlaying = window.speechSynthesis.speaking;
                if(isPlaying) {
                    window.speechSynthesis.cancel();
                    document.getElementById('tts-btn').innerHTML = `<svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2l4 4V4L9 8H7a2 2 0 00-2 2z"></path></svg> Leer contenido`;
                    return;
                }
                
                let textToRead = "Esquema de preguntas. ";
                esquemaData.forEach((item, idx) => {
                    textToRead += `Pregunta ${idx + 1}: ${item.q} Respuesta: ${item.a}. `;
                });
                
                const utterance = new SpeechSynthesisUtterance(textToRead);
                utterance.lang = 'es-ES';
                utterance.rate = 1.0;
                
                utterance.onend = () => {
                     document.getElementById('tts-btn').innerHTML = `<svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2l4 4V4L9 8H7a2 2 0 00-2 2z"></path></svg> Leer contenido`;
                };

                window.speechSynthesis.speak(utterance);
                document.getElementById('tts-btn').innerHTML = `<svg class="w-4 h-4 mr-2 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path></svg> Detener lectura`;
            });

            // Generación de los 10 Tests
            const testsContainer = document.getElementById('tests-container');
            testData.forEach((test, testIndex) => {
                const testNum = testIndex + 1;
                const formId = `form-test-${testNum}`;
                
                let testHTML = `
                <div id="tab-test-${testNum}" class="tab-content bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-200/80 p-5 md:p-8 transition-all">
                    <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-100">
                        <div>
                            <span class="text-xs font-extrabold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">Evaluación Continua</span>
                            <h2 class="text-xl md:text-2xl font-bold text-slate-900 mt-1">Test Autoevaluativo ${testNum}</h2>
                        </div>
                        <span class="text-xs font-semibold text-slate-400 bg-slate-100 px-3 py-1.5 rounded-full">20 Preguntas</span>
                    </div>
                    
                    <form id="${formId}">
                `;

                test.forEach((qObj, qIndex) => {
                    testHTML += `
                        <div class="mb-6 question-block bg-slate-50/50 border border-slate-200/70 p-4 md:p-5 rounded-2xl" data-qindex="${qIndex}">
                            <div class="flex items-start gap-3 mb-4">
                                <span class="flex-shrink-0 w-7 h-7 rounded-xl bg-slate-200/70 text-slate-700 font-bold text-xs flex items-center justify-center mt-0.5">
                                    ${qIndex + 1}
                                </span>
                                <p class="text-sm md:text-base font-semibold text-slate-800 leading-snug">${qObj.q}</p>
                            </div>
                            <div class="space-y-2.5 pl-0 md:pl-10">
                    `;
                    
                    qObj.o.forEach((optText, optIndex) => {
                        const name = `t${testNum}q${qIndex}`;
                        testHTML += `
                            <label class="flex items-start space-x-3 p-3.5 bg-white border border-slate-200/80 rounded-xl cursor-pointer hover:bg-indigo-50/40 hover:border-indigo-200 transition-all option-label shadow-2xs">
                                <input type="radio" name="${name}" value="${optIndex}" class="mt-0.5 w-4 h-4 text-indigo-600 border-slate-300 focus:ring-indigo-500 flex-shrink-0">
                                <span class="text-xs md:text-sm text-slate-700 leading-relaxed">${optText}</span>
                            </label>
                        `;
                    });

                    testHTML += `
                            </div>
                            <div class="explanation mt-4 p-4 bg-indigo-50/70 border-l-4 border-indigo-500 rounded-xl text-xs md:text-sm text-indigo-950 shadow-inner">
                                <p class="font-bold mb-1 text-indigo-900 flex items-center gap-1.5">
                                    <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    Fundamento legal:
                                </p>
                                <p class="leading-relaxed">${qObj.exp}</p>
                            </div>
                        </div>
                    `;
                });

                testHTML += `
                        <div class="mt-8 flex flex-col sm:flex-row gap-3 border-t border-slate-100 pt-6">
                            <button type="submit" class="w-full sm:w-auto bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold py-3.5 px-8 rounded-2xl transition-all shadow-lg shadow-emerald-600/20 transform hover:-translate-y-0.5 text-sm">
                                Coregir y Obtener Nota
                            </button>
                            <button type="button" class="reset-btn w-full sm:w-auto bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3.5 px-6 rounded-2xl transition-all text-sm">
                                Reiniciar Test
                            </button>
                        </div>
                        
                        <div class="summary hidden mt-6 p-6 bg-slate-900 rounded-2xl text-white text-center shadow-xl">
                            <h3 class="text-lg font-bold mb-3 text-slate-200">Resultado del Examen</h3>
                            <div class="flex justify-center items-center gap-6 text-sm md:text-base">
                                <div class="bg-emerald-500/20 border border-emerald-500/30 px-4 py-2 rounded-xl text-emerald-400 font-bold">
                                    <span class="correct-count text-xl">0</span> Aciertos
                                </div>
                                <div class="bg-rose-500/20 border border-rose-500/30 px-4 py-2 rounded-xl text-rose-400 font-bold">
                                    <span class="wrong-count text-xl">0</span> Errores
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                `;
                
                testsContainer.insertAdjacentHTML('beforeend', testHTML);
            });

            // Gestión de Pestañas
            const tabBtns = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');

            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    tabBtns.forEach(b => b.classList.remove('active'));
                    tabContents.forEach(c => c.classList.remove('active'));
                    
                    btn.classList.add('active');
                    const target = btn.getAttribute('data-target');
                    document.getElementById(target).classList.add('active');
                    
                    if(window.speechSynthesis.speaking) {
                        window.speechSynthesis.cancel();
                        document.getElementById('tts-btn').innerHTML = `<svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2l4 4V4L9 8H7a2 2 0 00-2 2z"></path></svg> Leer contenido`;
                    }
                });
            });

            // Corrección y Reinicio de Tests
            testData.forEach((test, testIndex) => {
                const testNum = testIndex + 1;
                const form = document.getElementById(`form-test-${testNum}`);
                const resetBtn = form.querySelector('.reset-btn');
                const summaryDiv = form.querySelector('.summary');
                const correctCountSpan = form.querySelector('.correct-count');
                const wrongCountSpan = form.querySelector('.wrong-count');

                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    let correctCount = 0;
                    let wrongCount = 0;
                    const qBlocks = form.querySelectorAll('.question-block');

                    qBlocks.forEach(block => {
                        const qIndex = parseInt(block.getAttribute('data-qindex'));
                        const correctAnswerIndex = test[qIndex].c;
                        const radios = block.querySelectorAll('input[type="radio"]');
                        const labels = block.querySelectorAll('.option-label');
                        const explanation = block.querySelector('.explanation');
                        
                        let answered = false;

                        radios.forEach((radio, idx) => {
                            radio.disabled = true;
                            labels[idx].classList.remove('correct-ans', 'wrong-ans');
                            
                            if(radio.checked) {
                                answered = true;
                                if(idx === correctAnswerIndex) {
                                    labels[idx].classList.add('correct-ans');
                                    correctCount++;
                                } else {
                                    labels[idx].classList.add('wrong-ans');
                                    labels[correctAnswerIndex].classList.add('correct-ans');
                                    wrongCount++;
                                }
                            }
                        });

                        if(!answered) {
                            labels[correctAnswerIndex].classList.add('correct-ans');
                            wrongCount++;
                        }

                        explanation.classList.add('visible');
                    });

                    correctCountSpan.textContent = correctCount;
                    wrongCountSpan.textContent = wrongCount;
                    summaryDiv.classList.remove('hidden');
                    summaryDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                });

                resetBtn.addEventListener('click', () => {
                    const qBlocks = form.querySelectorAll('.question-block');
                    qBlocks.forEach(block => {
                        const radios = block.querySelectorAll('input[type="radio"]');
                        const labels = block.querySelectorAll('.option-label');
                        const explanation = block.querySelector('.explanation');
                        
                        radios.forEach(r => {
                            r.checked = false;
                            r.disabled = false;
                        });
                        
                        labels.forEach(l => {
                            l.classList.remove('correct-ans', 'wrong-ans');
                        });
                        
                        explanation.classList.remove('visible');
                    });
                    
                    summaryDiv.classList.add('hidden');
                });
            });
        });
    </script>
</body>
</html>

                { q: "Los acuerdos en un órgano colegiado se adoptarán por:", o: ["Unanimidad.", "Mayoría cualificada.", "Mayoría de votos.", "Voto favorable del Presidente y Secretario."], c: 2, e: "Los acuerdos serán adoptados por mayoría de votos." },
                { q: "La competencia es, por naturaleza:", o: ["Renunciable y delegable siempre.", "Irrenunciable y se ejercerá por los órganos que la tengan atribuida.", "Delegable únicamente en órganos superiores.", "Transferible por convenio indefinido."], c: 1, e: "La competencia es irrenunciable y se ejercerá precisamente por los órganos administrativos que la tengan atribuida como propia, salvo los casos de delegación o avocación." },
                { q: "Si la norma no especifica qué órgano debe ejercer una competencia atribuida a una Administración, ¿a quién corresponde?", o: ["Al órgano superior jerárquico común.", "Al Ministro.", "A los órganos inferiores competentes por razón de materia y territorio.", "Al Presidente del Gobierno."], c: 2, e: "...se entenderá que la facultad de instruir y resolver... corresponde a los órganos inferiores competentes por razón de la materia y del territorio." },
                { q: "¿Se puede delegar en órganos que no sean jerárquicamente dependientes?", o: ["Sí, se podrá acordar en otros órganos aunque no sean jerárquicamente dependientes.", "No, la delegación exige siempre dependencia jerárquica.", "Sí, pero solo con rango de Ley.", "Ninguna de las respuestas es correcta."], c: 0, e: "En cada Administración Pública se podrá acordar la delegación... en otros órganos, aunque no sean jerárquicamente dependientes." },
                { q: "Señala una competencia que SÍ puede ser objeto de delegación:", o: ["Adopción de disposiciones de carácter general.", "Materias referidas a la Jefatura del Estado.", "La emisión de una resolución final que no resuelva un recurso del mismo órgano.", "La resolución de un recurso de órganos que dictaron los actos impugnados."], c: 2, e: "No podrán ser delegadas: relaciones Jefatura Estado... disposiciones carácter general, resolución de recursos en los órganos que hayan dictado los actos." },
                { q: "Las resoluciones adoptadas por delegación, ¿por quién se considerarán dictadas?", o: ["Por el órgano delegado.", "Por el órgano delegante.", "Por ambos solidariamente.", "Por la Administración Central."], c: 1, e: "Las resoluciones administrativas que se adopten por delegación indicarán expresamente esta circunstancia y se considerarán dictadas por el órgano delegante." },
                { q: "Salvo autorización expresa de una ley, ¿se pueden delegar las competencias que se ejerzan por delegación?", o: ["Sí, previo aviso.", "No, no podrán delegarse.", "Solo si el órgano superior lo aprueba.", "Sí, mediante avocación de la delegación."], c: 1, e: "Salvo autorización expresa de una ley, no podrán delegarse las competencias que se ejerzan por delegación." },
                { q: "¿La delegación es revocable?", o: ["No, tiene carácter definitivo.", "Sí, al transcurrir cuatro años.", "Sí, en cualquier momento por el órgano que la haya conferido.", "Solo por un órgano judicial superior."], c: 2, e: "La delegación será revocable en cualquier momento por el órgano que la haya conferido." },
                { q: "¿Qué es la avocación?", o: ["Transferir competencia a un inferior.", "Asumir por órganos superiores el conocimiento de un asunto de sus dependientes.", "Encomendar una actividad técnica a otro órgano.", "Delegar la firma."], c: 1, e: "Avocación (art. 10 LRJSP): Los órganos superiores podrán avocar para sí el conocimiento de un asunto o varios cuya resolución corresponda ordinariamente... a sus órganos dependientes." },
                { q: "La avocación se realizará mediante:", o: ["Ley de las Cortes.", "Real Decreto.", "Acuerdo inmotivado verbal.", "Acuerdo motivado."], c: 3, e: "En todo caso, la avocación se realizará mediante acuerdo motivado que deberá ser notificado a los interesados." },
                { q: "En caso de delegación en órganos no jerárquicamente dependientes, ¿quién puede avocar el asunto?", o: ["Cualquier superior jerárquico.", "Únicamente el órgano delegante.", "Únicamente el Secretario de Estado.", "Nadie puede avocarlo."], c: 1, e: "En los supuestos de delegación de competencias en órganos no jerárquicamente dependientes, el conocimiento de un asunto podrá ser avocado únicamente por el órgano delegante." },
                { q: "La encomienda de gestión procede fundamentalmente por:", o: ["Ausencia o enfermedad del titular.", "Razones de eficacia o carencia de medios técnicos idóneos.", "Decisión judicial.", "Razones de delegación de firma generalizada."], c: 1, e: "La realización de actividades de carácter material o técnico... podrá ser encomendado... por razones de eficacia o cuando no se posean los medios técnicos idóneos." },
                { q: "¿La encomienda de gestión supone cesión de la titularidad de la competencia?", o: ["Sí, total cesión.", "Sí, de los elementos sustantivos.", "No, no supone cesión de la titularidad de la competencia.", "Solo en caso de convenio interadministrativo."], c: 2, e: "La encomienda de gestión no supone cesión de la titularidad de la competencia ni de los elementos sustantivos de su ejercicio." },
                { q: "¿Altera la competencia del delegante la 'delegación de firma'?", o: ["Sí, en todos los casos.", "No, no alterará la competencia del órgano delegante.", "Solo si requiere publicación en el BOE.", "Ninguna de las anteriores."], c: 1, e: "La delegación de firma no alterará la competencia del órgano delegante y para su validez no será necesaria su publicación." },
                { q: "¿Para la validez de la delegación de firma es necesaria su publicación en boletín oficial?", o: ["Sí, obligatoriamente.", "Sí, si afecta a más de un interesado.", "No, no será necesaria su publicación.", "Solo en caso de que lo ordene el Juez."], c: 2, e: "La delegación de firma no alterará la competencia del órgano delegante y para su validez no será necesaria su publicación." },
                { q: "La suplencia temporal procede en los supuestos de:", o: ["Vacante, ausencia o enfermedad.", "Vacante, ausencia, enfermedad o declaración de abstención/recusación.", "Sólo enfermedad acreditada.", "Desplazamiento por viaje de negocios."], c: 1, e: "Los titulares... podrán ser suplidos temporalmente en los supuestos de vacante, ausencia o enfermedad, así como en los casos en que haya sido declarada su abstención o recusación." },
                { q: "¿Los conflictos de atribuciones se suscitan entre órganos de la misma Administración?", o: ["Relacionados jerárquicamente.", "No relacionados jerárquicamente.", "De diferentes Ministerios sin dependencia.", "b y c son correctas."], c: 3, e: "Los conflictos de atribuciones solo podrán suscitarse entre órganos de una Administración no relacionados jerárquicamente." },
                { q: "Tener cuestión litigiosa pendiente con algún interesado es causa de:", o: ["Avocación.", "Suplencia.", "Abstención.", "Delegación forzosa."], c: 2, e: "Causas de abstención: ...o tener cuestión litigiosa pendiente con algún interesado." },
                { q: "Si concurre parentesco de afinidad dentro del segundo grado, ¿se aplica abstención?", o: ["Sí, parentesco de afinidad dentro del segundo grado es causa de abstención.", "No, el límite es el primer grado.", "Solo si es consanguinidad.", "Solo aplica en la Administración local."], c: 0, e: "Tener un vínculo matrimonial... y el parentesco de consanguinidad dentro del cuarto grado o de afinidad dentro del segundo..." }
            ],
            // TEST 3: Abstención, Recusación y Eficacia
            [
                { q: "Tener amistad íntima o enemistad manifiesta con la persona interesada:", o: ["Es motivo de recusación automática por el superior.", "Es motivo de abstención según el art. 23 LRJSP.", "No tiene relevancia jurídica.", "Anula de pleno derecho todo acto posterior."], c: 1, e: "Son motivos de abstención, según el art. 23 LRJSP... Tener amistad íntima o enemistad manifiesta con alguna de las personas mencionadas." },
                { q: "Tener relación de servicio con el interesado, o haberle prestado servicios profesionales en qué plazo previo es causa de abstención:", o: ["Último año.", "Dos últimos años.", "Cinco últimos años.", "Seis meses previos."], c: 1, e: "Haberle prestado en los dos últimos años servicios profesionales de cualquier tipo." },
                { q: "¿La no abstención en los casos en que proceda qué produce?", o: ["Dará lugar a responsabilidad.", "Implicará, necesariamente, la invalidez de todos los actos.", "El arresto preventivo del funcionario.", "La caducidad del expediente disciplinario."], c: 0, e: "La actuación de autoridades y personal... no implicará, necesariamente, la invalidez de los actos... La no abstención en los casos en que proceda dará lugar a responsabilidad." },
                { q: "La recusación de un funcionario se planteará:", o: ["Verbalmente en cualquier momento.", "Por escrito en el que se expresará la causa o causas en que se funda.", "Solo al finalizar el procedimiento.", "No se puede plantear en vía administrativa."], c: 1, e: "La recusación se planteará por escrito en el que se expresará la causa o causas en que se funda." },
                { q: "¿En qué momento del procedimiento se puede promover la recusación?", o: ["Únicamente antes de dictar resolución.", "En cualquier momento de la tramitación del procedimiento.", "A los 10 días de la notificación inicial.", "Sólo durante el plazo de alegaciones."], c: 1, e: "El interesado, en cualquier momento de la tramitación del procedimiento, podrá promover recusación." },
                { q: "¿Qué recurso cabe contra las resoluciones adoptadas en materia de recusación (la resolución del superior)?", o: ["Recurso de alzada.", "No cabrá recurso, sin perjuicio de alegarlo en el recurso contra el acto que termine el procedimiento.", "Recurso de reposición obligatorio.", "Recurso contencioso-administrativo inmediato."], c: 1, e: "Contra las resoluciones adoptadas en esta materia no cabrá recurso, sin perjuicio de la posibilidad de alegar la recusación al interponer el recurso que proceda contra el acto." },
                { q: "Según el art. 39.1 de la LPA, los actos sujetos al Derecho Administrativo se presumirán:", o: ["Anulables.", "Válidos y producirán efectos desde la fecha en que se dicten.", "Nulos de pleno derecho hasta su publicación.", "Provisionales por 30 días."], c: 1, e: "Los actos de las Administraciones Públicas sujetos al Derecho Administrativo se presumirán válidos y producirán efectos desde la fecha en que se dicten..." },
                { q: "La presunción de validez de los actos de la Administración es una presunción:", o: ["Iuris et de iure.", "Iuris tantum.", "Conclusiva e irrebatible.", "De caducidad inmediata."], c: 1, e: "Es una presunción iuris tantum. El particular es el que debe recurrir frente al acto que, en principio, se supone válido." },
                { q: "¿Puede demorarse la eficacia de un acto administrativo?", o: ["No, jamás.", "Sí, cuando exija preceptiva aprobación superior, notificación o publicación.", "Sí, por simple voluntad caprichosa del jefe de servicio.", "Solo mediante orden ministerial."], c: 1, e: "La eficacia quedará demorada: Cuando así lo exija el contenido... preceptiva la aprobación superior... haya de notificarse o publicarse." },
                { q: "Excepcionalmente podrá otorgarse eficacia retroactiva a los actos cuando:", o: ["Se dicten en sustitución de actos anulados.", "Produzcan efectos favorables al interesado cumpliendo requisitos.", "A y B son correctas.", "Ninguna es correcta, la retroactividad está prohibida en todo caso."], c: 2, e: "Podrá otorgarse eficacia retroactiva... Cuando se dicten en sustitución de actos anulados. Cuando produzcan efectos favorables al interesado..." },
                { q: "¿A qué principio constitucional responde la limitación de la eficacia retroactiva sancionadora?", o: ["Al artículo 103 CE.", "Al artículo 9.3 CE.", "A la reserva de Ley Orgánica.", "Al derecho de petición."], c: 1, e: "Se trata de una manifestación del art. 9.3 CE, que caracteriza la irretroactividad de las disposiciones sancionadoras no favorables." },
                { q: "En caso de que un acto deba fundamentarse en otro dictado por distinta Administración y se entienda que el acto base es ilegal:", o: ["Se anulará directamente por el órgano.", "Podrá requerir previamente para que lo anule o revise.", "Se dictará el propio acto ignorando el base.", "Ninguna de las opciones anteriores."], c: 1, e: "...podrá requerir a esta previamente para que anule o revise el acto de acuerdo con lo dispuesto en el artículo 44 LJCA... En estos casos quedará suspendido el procedimiento..." },
                { q: "A la obligación de que los actos administrativos deben cumplirse de manera obligatoria por el administrado se le llama:", o: ["Ejecutividad.", "Retroactividad tácita.", "Indefensión.", "Irregularidad."], c: 0, e: "...privilegio de que sus 'decisiones' son ejecutivas, esto es, que deben cumplirse. En esto consiste, precisamente, la denominada ejecutividad de los actos." },
                { q: "La facultad de los entes públicos para ejecutar coactivamente sus actos se conoce como:", o: ["Acción de oficio o ejecución forzosa.", "Vía de hecho garantizada.", "Declaración de lesividad.", "Expropiación forzosa."], c: 0, e: "...los entes públicos pueden ejecutar coactivamente sus actos administrativos: es la denominada ejecución forzosa de los mismos, también conocida con el nombre de acción de oficio." },
                { q: "¿Puede iniciar la Administración una actuación material de ejecución que limite derechos sin resolución previa?", o: ["Sí, en casos de urgencia.", "No, no iniciarán ninguna sin que previamente haya sido adoptada la resolución.", "Sí, mediante permiso judicial verbal.", "Sí, si interviene la policía local."], c: 1, e: "Las Administraciones Públicas no iniciarán ninguna actuación material de ejecución de resoluciones que limite derechos... sin que previamente haya sido adoptada la resolución..." },
                { q: "¿La interposición de un recurso suspende, como norma general, la ejecución del acto impugnado?", o: ["Sí, siempre suspende.", "No, la interposición no suspenderá la ejecución del acto impugnado.", "Sí, si se acompaña de firma letrada.", "Depende exclusivamente de la Administración de Justicia."], c: 1, e: "La interposición de cualquier recurso, excepto en los casos en que una disposición establezca lo contrario, no suspenderá la ejecución del acto impugnado." },
                { q: "¿Cuándo podrá el órgano competente suspender la ejecución del acto recurrido?", o: ["Perjuicios de imposible o difícil reparación.", "Fundamentación en causas de nulidad de pleno derecho.", "A y B son correctas.", "Solo si el acto es de liquidación de impuestos."], c: 2, e: "...podrá suspender... cuando concurran alguna de las siguientes circunstancias: Que la ejecución pudiera causar perjuicios de imposible o difícil reparación. Que la impugnación se fundamente en alguna de las causas de nulidad de pleno derecho previstas en el art. 47.1" },
                { q: "¿Cuándo se entenderá suspendida la ejecución por silencio administrativo en la solicitud de suspensión ligada a un recurso?", o: ["Transcurridos 10 días sin resolución.", "Transcurrido un mes desde la entrada en registro sin resolución expresa.", "Transcurridos tres meses.", "A los seis meses exactos."], c: 1, e: "la ejecución del acto impugnado se entenderá suspendida si, transcurrido un mes desde que la solicitud de suspensión haya tenido entrada... el órgano no ha dictado y notificado resolución expresa" },
                { q: "Cuando de la suspensión puedan derivarse perjuicios, aquella solo producirá efectos previa:", o: ["Petición al Rey.", "Prestación de caución o garantía suficiente.", "Firma ante notario.", "Visto bueno del Juez de Guardia."], c: 1, e: "Cuando de la suspensión puedan derivarse perjuicios de cualquier naturaleza, aquella solo producirá efectos previa prestación de caución o garantía suficiente." },
                { q: "En caso de impugnación de un acto que afecte a una pluralidad indeterminada de personas, la suspensión de eficacia habrá de ser:", o: ["Notificada casa por casa.", "Publicada en el periódico oficial en que aquel se insertó.", "Registrada en el Padrón Municipal.", "Guardada en secreto judicial."], c: 1, e: "Cuando el recurso tenga por objeto la impugnación de un acto administrativo que afecte a una pluralidad indeterminada de personas, la suspensión de su eficacia habrá de ser publicada en el periódico oficial en que aquel se insertó." }
            ],
            // TEST 4: Ejecución forzosa y Nulidad
            [
                { q: "La ejecución forzosa por apremio sobre el patrimonio se utiliza cuando:", o: ["Se impone la demolición de un muro.", "En virtud de acto administrativo hubiera de satisfacerse cantidad líquida.", "Es una obligación de hacer personalísima.", "Es una obligación de no hacer."], c: 1, e: "Si en virtud de acto administrativo hubiera de satisfacerse cantidad líquida, se seguirá el procedimiento previsto en las normas reguladoras del procedimiento de apremio." },
                { q: "Podrá imponerse obligación pecuniaria sin estar establecida con arreglo a una norma de rango legal:", o: ["Sí, si es de urgencia.", "No, en ningún caso.", "Sí, vía reglamento local.", "Depende del apremio."], c: 1, e: "En cualquier caso, no podrá imponerse a los administrados una obligación pecuniaria que no estuviese establecida con arreglo a una norma de rango legal." },
                { q: "La realización de lo dispuesto en el acto por sujeto distinto del obligado y por cuenta de este, se llama:", o: ["Compulsión sobre personas.", "Subrogación financiera.", "Ejecución subsidiaria.", "Multa coercitiva."], c: 2, e: "Ejecución subsidiaria: Consiste en la realización de lo dispuesto en el acto administrativo por sujeto distinto del obligado y por cuenta de este." },
                { q: "¿En qué tipo de actos cabe la ejecución subsidiaria?", o: ["Actos personalísimos exclusivos.", "Actos que por no ser personalísimos puedan ser realizados por sujeto distinto del obligado.", "Actos políticos.", "Actos de mera abstención."], c: 1, e: "Habrá lugar a la ejecución subsidiaria cuando se trate de actos que por no ser personalísimos puedan ser realizados por sujeto distinto del obligado." },
                { q: "Para ejecutar actos, la Administración puede imponer 'multas coercitivas' en los siguientes supuestos:", o: ["Actos personalísimos en que no proceda la compulsión directa.", "Actos en que, procediendo la compulsión, la Administración no la estimara conveniente.", "Actos cuya ejecución pueda el obligado encargar a otra persona.", "Todas las opciones son correctas."], c: 3, e: "Multa coercitiva... en los siguientes supuestos: Actos personalísimos en que no proceda... Actos en que, procediendo la compulsión, la Administración no la estimara conveniente. Actos cuya ejecución pueda el obligado encargar a otra persona." },
                { q: "¿La multa coercitiva es compatible e independiente de las sanciones procedentes?", o: ["No, vulneraría el non bis in idem.", "Sí, es independiente y compatible.", "Sólo es compatible con recargos tributarios.", "Solo si el obligado da su consentimiento."], c: 1, e: "La multa coercitiva es independiente de las sanciones que puedan imponerse con tal carácter y compatible con ellas." },
                { q: "¿Cuál es el objetivo principal de la multa coercitiva?", o: ["Castigo directo del infractor.", "Recaudación para Hacienda.", "Presión sobre el infractor para que cumpla la obligación derivada del acto.", "Sustituir a la sanción penal."], c: 2, e: "Su finalidad no es el castigo del infractor, sino la presión sobre este para que cumpla la obligación que deriva del acto." },
                { q: "El medio extremo de ejecución forzosa consistente en el empleo de fuerza sobre las personas es:", o: ["Apremio violento.", "Multa extrema.", "Compulsión sobre las personas.", "Desahucio pasivo."], c: 2, e: "Compulsión sobre las personas. Como medida extrema, la Administración puede llegar al empleo de la fuerza sobre las personas." },
                { q: "Un requisito indispensable para la compulsión sobre las personas es:", o: ["Que se trate de actos que impongan obligación personalísima de no hacer o soportar.", "Que la ley lo autorice expresamente.", "Que se respete la dignidad y derechos constitucionales.", "Todas son correctas."], c: 3, e: "Requisitos: Que se trate de actos administrativos que impongan una obligación personalísima de no hacer o soportar. Que la ley lo autorice expresamente. Que se respete la dignidad de la persona..." },
                { q: "¿Qué ocurre si en una obligación personalísima de hacer no se realizase la prestación?", o: ["La policía actuará físicamente para obligar a hacerlo.", "El obligado deberá resarcir los daños y perjuicios, liquidándose en vía administrativa.", "Se le perdonará la obligación.", "Pasará inmediatamente a la vía penal."], c: 1, e: "Si, tratándose de obligaciones personalísimas de hacer, no se realizase la prestación, el obligado deberá resarcir los daños y perjuicios, a cuya liquidación y cobro se procederá en vía administrativa." },
                { q: "¿A qué figura de la compulsión corresponde el lanzamiento por los propios agentes de ocupantes de bienes de dominio público sin título bastante?", o: ["Desahucio administrativo.", "Expropiación exprés.", "Recuperación de oficio.", "Anulación registral."], c: 0, e: "Como una variedad de la compulsión directa podemos citar el denominado 'desahucio administrativo', consistente en el lanzamiento... de quienes ocupan, sin título bastante, bienes de dominio público." },
                { q: "Frente a las actuaciones de ejecución forzosa realizadas en competencia y con procedimiento:", o: ["Proceden siempre interdictos.", "No se admitirán a trámite acciones posesorias.", "Son apelables ante el Constitucional directamente.", "Proceden acciones de usucapión."], c: 1, e: "Finalmente, no se admitirán a trámite acciones posesorias contra las actuaciones de los órganos administrativos realizadas en materia de su competencia y de acuerdo con el procedimiento..." },
                { q: "La falta de algún elemento que deba integrar el acto arrastrará su calificación como nulo o anulable, salvo que se trate de:", o: ["Una vulneración de la Constitución.", "Una infracción de un derecho fundamental.", "Una irregularidad no invalidante.", "Una incompetencia manifiesta."], c: 2, e: "La falta de alguno de ellos arrastrará su calificación como nulo o anulable, salvo que se trate de una irregularidad no invalidante." },
                { q: "Los actos de la Administración son NULOS de pleno derecho (art. 47) cuando:", o: ["Tengan un defecto de forma no esencial.", "Se emitan fuera del plazo legal no esencial.", "Lesionen los derechos y libertades susceptibles de amparo constitucional.", "Causen un perjuicio patrimonial subsanable."], c: 2, e: "El art. 47 LPA establece nulidad de pleno derecho: Los que lesionen los derechos y libertades susceptibles de amparo constitucional." },
                { q: "Un acto dictado por órgano MANIFIESTAMENTE incompetente por razón de materia o territorio es:", o: ["Anulable.", "Irregular.", "Nulo de pleno derecho.", "Convalidable."], c: 2, e: "Nulos de pleno derecho... Los dictados por órgano manifiestamente incompetente por razón de la materia o del territorio." },
                { q: "Si el acto adolece de incompetencia jerárquica (dictado por subordinado), la jurisprudencia considera que es:", o: ["Nulo de pleno derecho absoluto.", "Meramente anulable y, por ello, convalidable.", "Un delito penal.", "Irreprochable."], c: 1, e: "En cualquier caso, es meramente anulable -y, por ello, convalidable- el dictado por un órgano jerárquicamente subordinado al que tiene atribuida la competencia para ello." },
                { q: "Los actos que sean constitutivos de infracción penal o se dicten como consecuencia de ésta:", o: ["Son nulos de pleno derecho.", "Son actos regulares penalizados.", "Son anulables a los 4 años.", "Gozan de presunción indestructible."], c: 0, e: "Nulos de pleno derecho... Los que sean constitutivos de infracción penal o se dicten como consecuencia de esta." },
                { q: "Adquirir facultades o derechos cuando se carezca de los requisitos esenciales para su adquisición por actos expresos o presuntos contrarios al ordenamiento jurídico, ocasiona:", o: ["Mera anulabilidad.", "Silencio positivo firme.", "Nulidad de pleno derecho.", "Irregularidad administrativa."], c: 2, e: "Nulos... Los actos expresos o presuntos contrarios al ordenamiento jurídico por los que se adquieren facultades o derechos cuando se carezca de los requisitos esenciales para su adquisición." },
                { q: "¿Un acto nulo de pleno derecho puede convalidarse por transcurso del tiempo o voluntad de la Administración?", o: ["Sí, pasado un año.", "No, no puede convalidarse.", "Sí, por Real Decreto.", "Solo por el Consejo de Estado."], c: 1, e: "El acto nulo no puede convalidarse por transcurso del tiempo ni por voluntad de la Administración." },
                { q: "¿En qué momento producen efectos la declaración de nulidad de un acto (efectos ex tunc)?", o: ["Solo hacia el futuro.", "Desde que se publique en BOE.", "Desde la fecha en que el acto se realizó.", "Desde que caduca el plazo de recurso."], c: 2, e: "Si tiene lugar tal declaración, sus efectos se producirán desde la fecha en que el acto se realizó." }
            ],
            // TEST 5: Nulidad de Reglamentos, Anulabilidad, Motivación
            [
                { q: "¿Son nulas de pleno derecho las disposiciones administrativas (reglamentos) que vulneren la Constitución o regulen materias reservadas a Ley?", o: ["Son anulables.", "Son nulas de pleno derecho.", "Son irregulares.", "Depende del rango de la norma dictada."], c: 1, e: "Nulidad de las disposiciones administrativas... También serán nulas de pleno derecho las disposiciones administrativas que: Vulneren la Constitución... Regulen materias reservadas a la Ley." },
                { q: "Las disposiciones administrativas que establezcan retroactividad de sanciones no favorables son:", o: ["Anulables.", "Legítimas.", "Nulas de pleno derecho.", "Aplicables a menores."], c: 2, e: "También serán nulas de pleno derecho las disposiciones administrativas que... Establezcan la retroactividad de disposiciones sancionadoras no favorables o restrictivas de derechos individuales." },
                { q: "Cualquier infracción del ordenamiento jurídico no tipificada como nulidad absoluta, incluyendo la desviación de poder, hace que el acto sea:", o: ["Nulo radical.", "Inexistente.", "Anulable.", "Legal y firme."], c: 2, e: "Son anulables los actos de la Administración que incurran en cualquier infracción del ordenamiento jurídico, incluso la desviación de poder (art. 48)." },
                { q: "Un defecto de forma, en términos generales de validez, genera una:", o: ["Nulidad de pleno derecho siempre.", "Anulabilidad obligatoria en todos los casos.", "Mera irregularidad no invalidante (solo anula si carece de requisitos formales indispensables para su fin o da indefensión).", "Revocación inmediata penal."], c: 2, e: "El defecto de forma solo determinará la anulabilidad cuando el acto carezca de los requisitos formales indispensables para alcanzar su fin o dé lugar a la indefensión de los interesados." },
                { q: "La realización de actuaciones fuera del tiempo establecido implicará la anulabilidad del acto SOLAMENTE cuando:", o: ["Pasen más de 5 días.", "Sea culpa exclusiva del funcionario.", "Así lo imponga la naturaleza del término o plazo.", "Nunca implica anulabilidad."], c: 2, e: "La realización de actuaciones administrativas fuera del tiempo establecido para ellas solo implicará la anulabilidad del acto cuando así lo imponga la naturaleza del término o plazo." },
                { q: "El principio de transmisibilidad (art. 49) indica que:", o: ["La nulidad de un acto anula todo el procedimiento sin excepción.", "La nulidad o anulabilidad de un acto no implicará la de los sucesivos independientes del primero.", "Un acto nulo transmite sus vicios a actos anteriores.", "Todo trámite se debe repetir."], c: 1, e: "La nulidad o anulabilidad de un acto no implicará la de los sucesivos en el procedimiento que sean independientes del primero." },
                { q: "Transformar un acto inválido en otro válido porque contiene los elementos de este otro se denomina:", o: ["Conservación.", "Convalidación.", "Transmisibilidad.", "Conversión."], c: 3, e: "La conversión. 'Los actos nulos o anulables que, sin embargo, contengan los elementos constitutivos de otro distinto producirán los efectos de este' (art. 50)." },
                { q: "Si el órgano que anula las actuaciones decide mantener los actos o trámites que se habrían mantenido igual, aplica la técnica de:", o: ["Conversión.", "Convalidación.", "Conservación de actos y trámites.", "Apremio."], c: 2, e: "Conservación de actos y trámites. 'El órgano que declare la nulidad o anule las actuaciones dispondrá siempre la conservación de aquellos actos y trámites cuyo contenido se hubiera mantenido igual...'." },
                { q: "Subsanar los vicios de un acto anulable para darle validez jurídica plena se llama:", o: ["Convalidación.", "Retroactividad.", "Preclusión.", "Compulsión."], c: 0, e: "Convalidación. La Administración podrá convalidar los actos anulables, subsanando los vicios de que adolezcan." },
                { q: "Si un acto es anulable por incompetencia jerárquica, ¿quién lo puede convalidar?", o: ["Nadie, va a la vía contenciosa.", "El órgano competente cuando sea superior jerárquico del que dictó el acto viciado.", "El órgano inferior.", "El Presidente del Gobierno en Consejo de Ministros."], c: 1, e: "Si el vicio consistiera en incompetencia no determinante de nulidad, la convalidación podrá realizarse por el órgano competente cuando sea superior jerárquico del que dictó el acto viciado." },
                { q: "La motivación de un acto, en terminología legal es:", o: ["Un esquema extenso sin límites.", "La sucinta referencia de hechos y fundamentos de Derecho.", "Un dictamen vinculante.", "La firma electrónica validada."], c: 1, e: "En terminología legal es 'la sucinta referencia de hechos y fundamentos de Derecho' que originan un acto concreto." },
                { q: "¿Deben motivarse los actos que limiten derechos subjetivos o intereses legítimos?", o: ["Nunca.", "Sí, siempre según el art. 35 LPA.", "Sólo si lo pide el particular.", "Sólo en expropiaciones."], c: 1, e: "Serán motivados... a) Los actos que limiten derechos subjetivos o intereses legítimos." },
                { q: "Los acuerdos de aplicación de tramitación de urgencia o ampliación de plazos:", o: ["Deben motivarse.", "No exigen motivación, son reglados.", "Solo requieren publicación.", "Se rigen por la nulidad absoluta."], c: 0, e: "Serán motivados... e) Los acuerdos de aplicación de la tramitación de urgencia, de ampliación de plazos..." },
                { q: "Si la Administración acuerda rechazar las pruebas propuestas por los interesados, ese acto:", o: ["Es nulo de pleno derecho directo.", "No precisa motivación porque la Administración ordena el proceso.", "Deberá ser motivado.", "Se convalida presuntamente."], c: 2, e: "Serán motivados... f) Los actos que rechacen pruebas propuestas por los interesados." },
                { q: "¿Es necesario motivar las resoluciones de procedimientos de responsabilidad patrimonial?", o: ["Sí, están entre los supuestos del art. 35 LPA.", "No, se rigen por silencio administrativo exclusivamente.", "Solamente si la cantidad excede 50.000 euros.", "Únicamente en el ámbito sanitario."], c: 0, e: "Serán motivados... h) Las propuestas de resolución en... carácter sancionador, así como los actos que resuelvan procedimientos de... responsabilidad patrimonial." },
                { q: "Si un órgano administrativo se separa del dictamen de un órgano consultivo al dictar un acto, ¿qué obligación legal tiene?", o: ["Declarar la avocación.", "Suspender el procedimiento 15 días.", "Motivar con sucinta referencia de hechos y derecho dicho acto.", "Someterlo a votación pública."], c: 2, e: "Serán motivados... c) Los actos que se separen del criterio seguido en actuaciones precedentes o del dictamen de órganos consultivos." },
                { q: "La motivación de actos que ponen fin a procedimientos selectivos se realizará:", o: ["Por decreto ley en exclusiva.", "De conformidad con lo que dispongan las normas que regulen sus convocatorias, debiendo quedar acreditados los fundamentos.", "No se motiva porque es concurrencia competitiva.", "Por simple listado de aprobados."], c: 1, e: "La motivación de los actos que pongan fin a los procedimientos selectivos y de concurrencia competitiva se realizará de conformidad con lo que dispongan las normas que regulen sus convocatorias, debiendo, en todo caso, quedar acreditados... los fundamentos." },
                { q: "¿Deben motivarse los actos que acuerden la terminación del procedimiento por imposibilidad material de continuarlo por causas sobrevenidas?", o: ["No.", "Sí, siempre.", "Solo en procedimientos sancionadores.", "Solo si lo pide un perito judicial."], c: 1, e: "Serán motivados... g) Los actos que acuerden la terminación del procedimiento por la imposibilidad material de continuarlo por causas sobrevenidas." },
                { q: "Un acto que deba dictarse en ejercicio de potestades discrecionales:", o: ["Jamás se motiva.", "Obligatoriamente debe ser motivado según el art. 35.", "Genera nulidad radical si se motiva.", "Es irregular pero convalidable si no se emite en 24h."], c: 1, e: "Serán motivados... i) Los actos que se dicten en el ejercicio de potestades discrecionales..." },
                { q: "¿Qué dice el temario sobre el tiempo exacto que tiene el superior para avocar si el inferior está de baja 15 días?", o: ["Tres días hábiles.", "15 días naturales.", "No existe plazo especificado.", "El dato solicitado no se encuentra en la documentación adjunta."], c: 3, e: "La figura de la avocación no especifica un plazo concreto si el inferior está de baja 15 días en la documentación adjunta. El dato solicitado no se encuentra en la documentación adjunta." }
            ],
            // TEST 6: Notificación de actos (I)
            [
                { q: "La notificación es una condición para la:", o: ["Aprobación de la norma.", "Eficacia de los actos administrativos.", "Anulación en vía contenciosa.", "Abstención del funcionario."], c: 1, e: "Objetivos de la notificación: [...] Constituir una condición para la eficacia de los actos administrativos." },
                { q: "¿En qué plazo debe cursarse la notificación?", o: ["15 días hábiles.", "20 días naturales.", "En el plazo de 10 días a partir de la fecha en que el acto se haya dictado.", "En 3 días perentorios."], c: 2, e: "La notificación deberá ser cursada en el plazo de diez días a partir de la fecha en que el acto se haya dictado." },
                { q: "Una notificación en regla DEBE indicar:", o: ["Si pone fin o no a la vía administrativa.", "Las sentencias previas similares.", "El DNI del funcionario que la firma exclusivamente.", "La totalidad del expediente administrativo foliado."], c: 0, e: "...deberá contener el texto íntegro de la resolución, con indicación de si pone fin o no a la vía administrativa..." },
                { q: "Sobre los recursos en una notificación, ¿qué debe expresarse?", o: ["Solo el recurso potestativo de reposición.", "La expresión de los recursos que procedan en vía administrativa y judicial, el órgano y plazo.", "Es un requisito omitible libremente sin consecuencias.", "La prohibición de interponer recurso en vía judicial ordinaria."], c: 1, e: "...la expresión de los recursos que procedan, en su caso, en vía administrativa y judicial, el órgano ante el que hubieran de presentarse y plazo para interponerlos..." },
                { q: "Si la notificación contiene el texto íntegro pero omite los recursos que proceden y el administrado interpone cualquier recurso que proceda contra dicho acto:", o: ["El recurso se inadmite por defecto de forma.", "La notificación surte efecto a partir de esa fecha.", "La Administración queda exonerada de tramitarlo.", "Se produce nulidad radical del procedimiento."], c: 1, e: "...omitiesen alguno de los demás requisitos... surtirán efecto a partir de la fecha en que el interesado realice actuaciones que supongan el conocimiento... o interponga cualquier recurso que proceda." },
                { q: "A los 'solos efectos de entender cumplida la obligación de notificar dentro del plazo máximo de duración de los procedimientos', ¿qué se considera suficiente?", o: ["Cualquier burofax sin texto.", "El texto íntegro, así como el intento de notificación debidamente acreditado.", "Una llamada telefónica no registrada.", "Un correo ordinario sin acuse."], c: 1, e: "...será suficiente la notificación que contenga cuando menos el texto íntegro de la resolución, así como el intento de notificación debidamente acreditado." },
                { q: "Las notificaciones se practicarán preferentemente por:", o: ["Carta certificada.", "Edictos en el tablón municipal.", "Medios electrónicos.", "Agentes judiciales en persona."], c: 2, e: "Las notificaciones se practicarán preferentemente por medios electrónicos y, en todo caso, cuando el interesado resulte obligado a recibirlas por esta vía." },
                { q: "¿Cuándo podrá la Administración practicar notificaciones por medios no electrónicos?", o: ["Cuando el interesado comparezca espontáneamente en la oficina de registro y lo solicite.", "Cuando para asegurar la eficacia resulte necesario por entrega directa de un empleado público.", "A y B son correctas.", "Nunca, está prohibido."], c: 2, e: "podrán practicar las notificaciones por medios no electrónicos en los siguientes supuestos: Cuando la notificación se realice con ocasión de la comparecencia espontánea... y lo solicite... Cuando para asegurar la eficacia de la actuación administrativa resulte necesario practicar la notificación por entrega directa..." },
                { q: "Toda notificación, independientemente del medio utilizado, será válida siempre que:", o: ["Sea verde.", "Tenga la firma del Ministro.", "Permita constancia de envío o puesta a disposición, recepción o acceso, fechas, horas, contenido e identidad fidedigna.", "Se envíe antes del mediodía."], c: 2, e: "Con independencia del medio utilizado, las notificaciones serán válidas siempre que permitan tener constancia de su envío o puesta a disposición, de la recepción o acceso... fechas y horas, del contenido íntegro, y de la identidad fidedigna..." },
                { q: "Si el acto a notificar va acompañado de elementos que no son susceptibles de conversión en formato electrónico, ¿cómo se notifica?", o: ["En ningún caso por medios electrónicos.", "Escaneado de mala calidad.", "Obligatoriamente por medios electrónicos obviando el elemento no convertible.", "Exclusivamente por edictos."], c: 0, e: "En ningún caso se efectuarán por medios electrónicos las siguientes notificaciones: Aquellas en las que el acto a notificar vaya acompañado de elementos que no sean susceptibles de conversión en formato electrónico." },
                { q: "¿Las notificaciones que contengan cheques (medios de pago) pueden notificarse por vía electrónica?", o: ["Sí, mediante firma digital.", "No, en ningún caso por medios electrónicos.", "Solo en liquidaciones del IRPF.", "La Ley no especifica este caso."], c: 1, e: "En ningún caso se efectuarán por medios electrónicos... Las que contengan medios de pago a favor de los obligados, tales como cheques." },
                { q: "En un procedimiento iniciado a solicitud del interesado, si no hay obligación electrónica, la notificación se practicará:", o: ["Obligatoriamente en BOE.", "Por el medio señalado al efecto por el interesado en su solicitud.", "En el tablón del Ayuntamiento.", "Por comparecencia judicial."], c: 1, e: "En los procedimientos iniciados a solicitud del interesado, la notificación se practicará por el medio señalado al efecto por aquel." },
                { q: "En procedimientos iniciados de oficio, a efectos de recabar el domicilio del interesado, la Administración podrá consultar:", o: ["El listado de Hacienda solamente.", "Las bases de datos del Instituto Nacional de Estadística, datos recogidos en el Padrón Municipal.", "Cualquier red social pública.", "Las guías telefónicas impresas."], c: 1, e: "las Administraciones Públicas podrán recabar, mediante consulta a las bases de datos del Instituto Nacional de Estadística, los datos sobre el domicilio del interesado recogidos en el Padrón Municipal." },
                { q: "¿Qué sucede si el interesado o representante RECHAZA la notificación de una actuación administrativa?", o: ["Se archiva el expediente.", "Se paraliza el procedimiento hasta que acepte.", "Se hará constar en el expediente, dando por efectuado el trámite y siguiéndose el procedimiento.", "Se sanciona al representante con multa coercitiva."], c: 2, e: "Cuando el interesado o su representante rechace la notificación... se hará constar en el expediente... dando por efectuado el trámite y siguiéndose el procedimiento." },
                { q: "Aunque la notificación sea en papel, las Administraciones enviarán un aviso al correo o dispositivo electrónico comunicado informando de la puesta a disposición. ¿Qué pasa si falta este aviso?", o: ["Invalida totalmente la notificación.", "Genera nulidad relativa.", "Obliga a retrotraer actuaciones 20 días.", "La falta de práctica de este aviso no impedirá que la notificación sea considerada plenamente válida."], c: 3, e: "La falta de práctica de este aviso no impedirá que la notificación sea considerada plenamente válida." },
                { q: "Si el interesado es notificado por distintos cauces, se tomará como fecha de notificación:", o: ["La última que se produzca para mayor garantía.", "La de aquella que se hubiera producido en primer lugar.", "La media entre ambas.", "La que el interesado decida y comunique en 3 días."], c: 1, e: "Cuando el interesado fuera notificado por distintos cauces, se tomará como fecha de notificación la de aquella que se hubiera producido en primer lugar." },
                { q: "Toda notificación en papel deberá ser puesta a disposición del interesado en:", o: ["La oficina de Correos más cercana.", "La sede electrónica de la Administración u organismo actuante.", "El juzgado de guardia.", "El Registro Mercantil de la provincia."], c: 1, e: "todas las notificaciones que se practiquen en papel deberán ser puestas a disposición del interesado en la sede electrónica de la Administración u organismo actuante para que pueda acceder al contenido..." },
                { q: "Si nadie se hiciera cargo de una notificación en papel en el domicilio, el intento se repetirá:", o: ["Todos los días hábiles durante 1 mes.", "Por una sola vez y en una hora distinta dentro de los tres días siguientes.", "Por tres veces consecutivas en el mismo día.", "Tras 15 días exactos."], c: 1, e: "Si nadie se hiciera cargo... el intento se repetirá por una sola vez y en una hora distinta dentro de los tres días siguientes." },
                { q: "Si el primer intento de notificación fue a las 11:00 horas, ¿cuándo debe hacerse el segundo intento como mínimo en su bloque horario (suponiendo que son días distintos de los 3 siguientes)?", o: ["Ese mismo día a las 14:00.", "Después de las 15 horas, dejando un margen de diferencia de 3 horas entre intentos.", "Al día siguiente antes de las 15 horas.", "En cualquier momento libre del notificador."], c: 1, e: "En caso de que el primer intento de notificación se haya realizado antes de las 15 horas, el segundo intento deberá realizarse después de las 15 horas y viceversa, dejando en todo caso al menos un margen de diferencia de tres horas." },
                { q: "¿En qué lugar se guardan de forma vitalicia los resguardos de notificación electrónica caducados en 1999 según este temario?", o: ["En el Archivo de Indias.", "En el archivo digital de la Fábrica de Moneda.", "En servidores externos custodiados por jueces.", "El dato solicitado no se encuentra en la documentación adjunta."], c: 3, e: "El temario no habla de lugares vitalicios para resguardos electrónicos de 1999. El dato solicitado no se encuentra en la documentación adjunta." }
            ],
            // TEST 7: Notificación (II) y Publicación
            [
                { q: "¿Qué ocurre cuando el interesado accede al contenido de la notificación en sede electrónica tras un envío en papel?", o: ["Se suspende el procedimiento.", "Se le ofrecerá la posibilidad de que el resto de notificaciones se puedan realizar a través de medios electrónicos.", "Queda bloqueado para futuras notificaciones presenciales.", "Se cierra su expediente automáticamente."], c: 1, e: "Cuando el interesado accediera al contenido de la notificación en sede electrónica, se le ofrecerá la posibilidad de que el resto de notificaciones se puedan realizar a través de medios electrónicos." },
                { q: "Se entiende por 'comparecencia en la sede electrónica':", o: ["Acudir en persona con DNI a un Ministerio con registro informático.", "El acceso por el interesado o su representante debidamente identificado al contenido de la notificación.", "Dar me gusta en un portal de transparencia.", "Llamar por teléfono usando firma de voz."], c: 1, e: "A estos efectos, se entiende por comparecencia en la sede electrónica, el acceso por el interesado o su representante debidamente identificado al contenido de la notificación." },
                { q: "Las notificaciones por medios electrónicos se entenderán practicadas en el momento en que:", o: ["El servidor envíe el archivo.", "Se remita el aviso al correo electrónico de contacto.", "Se produzca el acceso a su contenido.", "El interesado firme un recibí en papel ante el empleado público."], c: 2, e: "Las notificaciones por medios electrónicos se entenderán practicadas en el momento en que se produzca el acceso a su contenido." },
                { q: "Si transcurren 10 días naturales desde la puesta a disposición de la notificación electrónica obligatoria sin que el interesado acceda, se entiende:", o: ["Rechazada.", "Aceptada presuntamente y prorrogada por 5 días.", "Cancelada temporalmente.", "Caducada y nula."], c: 0, e: "Cuando la notificación por medios electrónicos sea de carácter obligatorio... se entenderá rechazada cuando hayan transcurrido diez días naturales desde la puesta a disposición... sin que se acceda." },
                { q: "¿Cómo se puede acceder a las notificaciones a través de internet en el ámbito de la AGE?", o: ["Solo y exclusivamente mediante correo electrónico POP3.", "Desde el Punto de Acceso General electrónico de la Administración, que funcionará como un portal de acceso.", "Mediante redes sociales corporativas.", "Pagando una tasa en la oficina liquidadora electrónica."], c: 1, e: "Los interesados podrán acceder a las notificaciones desde el Punto de Acceso General electrónico de la Administración, que funcionará como un portal de acceso." },
                { q: "Cuando los interesados en un procedimiento sean desconocidos o se ignore el lugar de notificación o intentada no se haya podido, ¿cómo se notifica?", o: ["Se da de baja el expediente.", "Por anuncio publicado en el Boletín Oficial del Estado (BOE).", "Publicación en un diario de tirada nacional deportiva.", "Por lectura en la plaza del Ayuntamiento."], c: 1, e: "Notificación infructuosa. Cuando los interesados... sean desconocidos, se ignore el lugar... o intentada esta, no se hubiese podido practicar, la notificación se hará por medio de un anuncio publicado en el Boletín Oficial del Estado." },
                { q: "Para una notificación infructuosa, previo a su publicación en el BOE, las Administraciones podrán publicar un anuncio en (con carácter facultativo):", o: ["Boletín Oficial de la Comunidad Autónoma o Provincia, tablón del Ayuntamiento o Consulado/Embajada.", "Sólo y exclusivamente en el Consulado de España en Francia.", "En prensa local privada exclusivamente.", "No pueden publicar en otro lado, está prohibido."], c: 0, e: "Asimismo, previamente y con carácter facultativo, las Administraciones podrán publicar un anuncio en el boletín oficial de la Comunidad Autónoma o de la Provincia, en el tablón de edictos del Ayuntamiento... o del Consulado o Sección Consular..." },
                { q: "La publicación de actos en el BOE para notificaciones infructuosas:", o: ["Excluye usar otros medios de difusión complementarios.", "No excluye la obligación de publicar el anuncio en el BOE, aunque se usen otras formas complementarias.", "Es opcional si el Ayuntamiento ha publicado un bando.", "Tiene coste económico para el recurrente presunto."], c: 1, e: "Las Administraciones Públicas podrán establecer otras formas de notificación complementarias... que no excluirán la obligación de publicar el correspondiente anuncio en el Boletín Oficial del Estado." },
                { q: "¿Cuándo serán objeto de publicación los actos administrativos (art. 45)?", o: ["Solamente en verano.", "Cuando lo establezcan las normas de cada procedimiento o lo aconsejen razones de interés público apreciadas por el órgano competente.", "Solo para resoluciones sancionadoras firmes.", "Todos los actos, sean de trámite o constitutivos, se publican diariamente."], c: 1, e: "Según el art. 45 LPA, los actos administrativos serán objeto de publicación cuando así lo establezcan las normas reguladoras de cada procedimiento o cuando lo aconsejen razones de interés público apreciadas por el órgano competente." },
                { q: "En caso de un procedimiento selectivo (unas oposiciones), los actos integrantes del mismo:", o: ["Se notificarán por carta a cada opositor.", "Serán objeto de publicación, surtiendo efectos de notificación.", "Se entregarán en mano el día del examen.", "No necesitan darse a conocer."], c: 1, e: "En todo caso, los actos administrativos serán objeto de publicación, surtiendo esta los efectos de la notificación... Cuando se trate de actos integrantes de un procedimiento selectivo o de concurrencia competitiva..." },
                { q: "¿Qué debe contener la publicación de un acto administrativo?", o: ["Un resumen muy breve y anónimo.", "Los mismos elementos exigidos para las notificaciones en el art. 40.2 (texto íntegro, recursos, plazos).", "El DNI completo sin ofuscar.", "Únicamente el fallo o resolución final, sin pie de recurso."], c: 1, e: "La publicación de un acto deberá contener los mismos elementos exigidos para las notificaciones en el art. 40.2." },
                { q: "Si se publican actos con elementos comunes (p.ej. un listado de aprobados de oposición):", o: ["Deben repetirse los elementos comunes por cada opositor para evitar confusión.", "Podrán publicarse de forma conjunta los aspectos coincidentes, especificándose los aspectos individuales.", "Cada acto se publicará en un día diferente.", "El BOE cobrará tasa por extensión de documento."], c: 1, e: "En los supuestos de publicaciones de actos que contengan elementos comunes, podrán publicarse de forma conjunta los aspectos coincidentes, especificándose solamente los aspectos individuales de cada acto." },
                { q: "¿En qué diario oficial se realiza la publicación?", o: ["Siempre en el BOE sin excepción.", "En el diario oficial que corresponda, según cuál sea la Administración de la que proceda el acto.", "En el boletín del Ayuntamiento obligatoriamente.", "En la sede electrónica de la Comunidad de Madrid exclusivamente."], c: 1, e: "La publicación de los actos se realizará en el diario oficial que corresponda, según cual sea la Administración de la que proceda el acto a notificar." },
                { q: "Si la publicación en el tablón de anuncios es exigida por una disposición, ¿cómo se puede entender cumplida?", o: ["Colgando físicamente un papel en el corcho del Ayuntamiento.", "Por su publicación en el Diario oficial correspondiente.", "Gritándolo el pregonero.", "Enviando email generalizado al vecindario."], c: 1, e: "...la publicación de actos y comunicaciones que, por disposición legal o reglamentaria deba practicarse en tablón de anuncios o edictos, se entenderá cumplida por su publicación en el Diario oficial correspondiente." },
                { q: "Si el órgano competente aprecia que la publicación de un acto lesiona derechos o intereses legítimos:", o: ["Dejará de publicarlo enteramente.", "Se limitará a publicar una somera indicación del contenido y del lugar donde comparecer.", "Cambiará los nombres falsificando el expediente por privacidad.", "Pedirá dispensa al Rey."], c: 1, e: "Si el órgano competente apreciase que la notificación... o publicación de un acto lesiona derechos o intereses legítimos, se limitará a publicar... una somera indicación del contenido del acto y del lugar donde los interesados podrán comparecer..." },
                { q: "La eficacia de la publicación de un acto de concurrencia competitiva llevado a cabo en lugar distinto al indicado en la convocatoria es:", o: ["Plenamente válida.", "Carece de validez.", "Válida si supera las mil visitas.", "Válida tras pagar las tasas registrales."], c: 1, e: "...la convocatoria del procedimiento deberá indicar el medio donde se efectuarán las sucesivas publicaciones, careciendo de validez las que se lleven a cabo en lugares distintos." },
                { q: "Si un acto va dirigido a una pluralidad indeterminada de personas:", o: ["Se publicará, surtiendo efecto de notificación.", "Se debe intentar localizar uno por uno.", "No hay obligación legal ni de publicación ni de notificación.", "Se declara el acto desierto."], c: 0, e: "En todo caso, los actos administrativos serán objeto de publicación... Cuando el acto tenga por destinatario a una pluralidad indeterminada de personas..." },
                { q: "¿Quién define el acto administrativo como 'acto jurídico realizado por la Administración Pública, con arreglo al Derecho Administrativo'?", o: ["Entrena Cuesta.", "García de Enterría.", "Eduardo García.", "Alfonso XIII."], c: 0, e: "De forma más sencilla, con ENTRENA CUESTA, el acto administrativo puede definirse como: 'acto jurídico realizado por la Administración Pública, con arreglo al Derecho Administrativo'." },
                { q: "Los actos firmes son aquellos que:", o: ["Ponen fin a la vía administrativa de inicio.", "Son actos definitivos o trámites que han sido impugnados mediante todos los recursos o han pasado los plazos para recurrirlos sin que se hiciera.", "Solo emite el Presidente de Gobierno.", "No admiten ejecución forzosa."], c: 1, e: "Un acto es firme cuando ha sido impugnado mediante todos los recursos... o cuando, notificado en legal forma, se han dejado transcurrir los plazos de presentación de tales recursos. Son inimpugnables." },
                { q: "Un certificado que emite un funcionario sobre el tiempo de servicio prestado es:", o: ["Acto general constitutivo.", "Acto discrecional.", "Acto de trámite sancionador.", "Acto declarativo."], c: 3, e: "Actos declarativos: son los que acreditan un hecho o una situación jurídica sin incidir sobre su contenido (certificación o notificación, p.e.)." }
            ],
            // TEST 8: Repaso de Conceptos clave y Órganos (Mix 1)
            [
                { q: "Los actos que resuelvan procedimientos de revisión de oficio, recursos administrativos y arbitrajes:", o: ["No se motivan jamás.", "Se motivan con sucinta referencia de hechos y fundamentos de derecho.", "Solo se motivan a petición del demandante.", "La motivación debe ser de al menos 10 páginas."], c: 1, e: "Serán motivados... b) Los actos que resuelvan procedimientos de revisión de oficio de disposiciones o actos administrativos, recursos administrativos y procedimientos de arbitraje..." },
                { q: "¿Cuándo es anulable un defecto de forma en un acto?", o: ["En todos los casos.", "Si impide alcanzar el fin del acto o genera indefensión de los interesados.", "Solo en materias fiscales.", "Solo si no lo firma el órgano titular personalmente."], c: 1, e: "El defecto de forma solo determinará la anulabilidad cuando el acto carezca de los requisitos formales indispensables para alcanzar su fin o dé lugar a la indefensión de los interesados." },
                { q: "Para que un acto de la Administración NO sea administrativo, ¿a qué derecho debe estar sometido?", o: ["Al Derecho Constitucional.", "Al Derecho Administrativo.", "Al Derecho Común (Civil, Laboral...), como actos privados de la Administración.", "Al Derecho Penal únicamente."], c: 2, e: "Actos de la Administración sometidos al Derecho Común, en cuyo caso la Administración no actúa en ejercicio de potestad pública... y sus actos no son, por tanto, administrativos, sino privados." },
                { q: "Actos materialmente administrativos producidos por órganos del Poder Judicial:", o: ["Son actos administrativos puros.", "Están excluidos de la noción de acto administrativo.", "Se rigen por la Ley de Régimen Jurídico del Sector Público exclusivamente.", "A y C son correctas."], c: 1, e: "Esta nota característica excluye de la noción de acto... Los actos materialmente administrativos producidos por otros órganos públicos no encuadrados en la Administración (Poder Judicial o Legislativo)." },
                { q: "Una resolución por la que la persona titular nombra a diez personas funcionarias del Cuerpo General Administrativo es un acto:", o: ["General.", "Simple y reglado inimpugnable.", "Singular o especial.", "Presunto definitivo."], c: 2, e: "Singulares o especiales: destinados a una o varias personas determinadas o determinables (resolución mencionando... nombra a diez personas funcionarias...)" },
                { q: "¿Contra qué tipo de actos 'caben recursos' explícitamente en el desarrollo procedimental general indicado?", o: ["Actos inimpugnables.", "Actos políticos puros.", "Actos de los administrados.", "Actos definitivos que no agotan la vía o que son recurribles en alzada o reposición."], c: 3, e: "Acto definitivo: si decide las cuestiones planteadas... Contra estos actos caben recursos. Y actos impugnables son los que terminan vía o agotan para lo contencioso." },
                { q: "¿Un acto presunto entra en juego cuando?", o: ["Existe voluntad expresa en papel.", "No se admite resolución alguna y entra en juego el silencio administrativo.", "El Juez dicta sentencia de conformidad.", "Hay un defecto de firma en la resolución expresa."], c: 1, e: "Acto presunto, cuando no se admite resolución alguna y entra en juego el silencio administrativo." },
                { q: "El titular de un órgano que dicta el acto ha de contar con:", o: ["Una diplomatura universitaria siempre.", "La correspondiente legitimación (nombramiento válido y eficaz) y hallarse en situación abstracta de imparcialidad.", "Aprobación del Rey firmada en pergamino.", "Solo estar afiliado a un sindicato."], c: 1, e: "Por último, el titular del órgano ha de contar con la correspondiente legitimación y hallarse en una situación abstracta de imparcialidad." },
                { q: "La titularidad de los órganos colegiados corresponde a:", o: ["Un único funcionario de carrera superior.", "Varias personas físicas, entre las que destaca el Presidente.", "El Secretario del Ayuntamiento exclusivamente.", "Solo ciudadanos sin cargo público previo."], c: 1, e: "El órgano colegiado se caracteriza porque su titularidad corresponde a varias personas físicas, entre las que destaca el Presidente." },
                { q: "De cada sesión que celebre un órgano colegiado, el Secretario:", o: ["No dejará registro alguno para preservar privacidad.", "Levantará acta que especificará necesariamente asistentes, orden del día, lugar y tiempo, puntos principales y acuerdos adoptados.", "Emitirá un Bando Municipal.", "Enviará copia al Tribunal Europeo de Derechos Humanos siempre."], c: 1, e: "De cada sesión que celebre el órgano colegiado se levantará acta por el Secretario, que especificará necesariamente los asistentes, el orden del día... puntos principales... contenido de los acuerdos..." },
                { q: "¿Quiénes podrán dirigirse al Secretario de un órgano colegiado para pedir certificación de los acuerdos?", o: ["Absolutamente cualquier persona, interesada o no.", "Quienes acrediten la titularidad de un interés legítimo.", "Sólo los vocales disidentes del órgano.", "Los miembros de la prensa internacional acreditados."], c: 1, e: "Quienes acrediten la titularidad de un interés legítimo podrán dirigirse al Secretario de un órgano colegiado para que les sea expedida certificación de sus acuerdos." },
                { q: "¿Es delegable la competencia para resolver un recurso en el órgano administrativo que dictó el acto objeto de recurso?", o: ["Sí, mediante avocación superior.", "No, en ningún caso podrán ser objeto de delegación.", "Sí, si hay encomienda de gestión aprobada.", "Sólo si lo autoriza el recurrente."], c: 1, e: "En ningún caso podrán ser objeto de delegación... La resolución de recursos en los órganos administrativos que hayan dictado los actos objeto de recurso." },
                { q: "En la Administración General del Estado, la delegación de competencias entre órganos de un mismo Ministerio deberá ser previamente aprobada por:", o: ["El Rey.", "El órgano ministerial de quien dependa el órgano delegante.", "Las Cortes Generales.", "No requiere aprobación, solo comunicación."], c: 1, e: "...la delegación de competencias entre órganos deberá ser previamente aprobada en la Administración General del Estado por el órgano ministerial de quien dependa el órgano delegante..." },
                { q: "Para encomendar la realización de actividades de carácter material a otro órgano o entidad de la misma o distinta Administración (Encomienda de Gestión), se formalizará como regla general mediante:", o: ["Contrato laboral indefinido.", "Resolución judicial penal.", "Firma del correspondiente convenio entre ellas.", "Delegación directa inmotivada."], c: 2, e: "Cuando la encomienda de gestión se realice entre órganos y Entidades... se formalizará, como regla general, mediante firma del correspondiente convenio entre ellas." },
                { q: "¿Qué debe hacerse cuando en las resoluciones se delega la firma?", o: ["No se debe mencionar que hay delegación.", "Se hará constar esta circunstancia y la autoridad de procedencia.", "Se pondrá un cuño de 'Acto Político'.", "Se firmará por orden del Rey."], c: 1, e: "En las resoluciones y actos que se firmen por delegación se hará constar esta circunstancia y la autoridad de procedencia." },
                { q: "El órgano administrativo que se estime incompetente para la resolución de un asunto:", o: ["Archivará el expediente sin más.", "Remitirá directamente las actuaciones al órgano que considere competente, notificándolo a los interesados.", "Destruirá los papeles para evitar errores.", "Se lo devolverá al interesado para que busque a quién dárselo."], c: 1, e: "El órgano administrativo que se estime incompetente para la resolución de un asunto remitirá directamente las actuaciones al órgano que considere competente, debiendo notificar esta circunstancia a los interesados." },
                { q: "¿En qué plazo debe resolver el superior jerárquico si el recusado niega la causa de recusación?", o: ["Tres días, previos los informes y comprobaciones.", "Inmediatamente sin informes.", "A los treinta días hábiles.", "1 mes."], c: 0, e: "Si el recusado niega la causa de recusación, el superior resolverá en el plazo de tres días, previos los informes y comprobaciones que considere oportunos." },
                { q: "¿Puede el funcionario recibir oralmente el ejercicio de una competencia (ej: acuerdo colegiado)?", o: ["No, los actos orales son nulos de pleno derecho en todo caso.", "Sí. En esos casos, el titular del órgano inferior o funcionario efectuará y firmará la constancia escrita, expresando la autoridad de la que procede.", "Solo en época de guerra o alarma nacional.", "Sí, pero no deja constancia nunca."], c: 1, e: "En los casos en que los órganos administrativos ejerzan su competencia de forma verbal, la constancia escrita del acto... se efectuará y firmará por el titular del órgano inferior o funcionario que la reciba oralmente..." },
                { q: "Según el art. 104.2, ¿qué procede si tratándose de obligaciones personalísimas de hacer, no se realiza la prestación tras agotar las vías compulsivas?", o: ["Ejecución subsidiaria por la policía.", "Apremio sobre patrimonio inmaterial.", "Resarcir los daños y perjuicios, liquidándose en vía administrativa.", "Retirar la nacionalidad española."], c: 2, e: "Si, tratándose de obligaciones personalísimas de hacer, no se realizase la prestación, el obligado deberá resarcir los daños y perjuicios, a cuya liquidación y cobro se procederá en vía administrativa." },
                { q: "¿Puede otorgarse eficacia retroactiva a un acto de gravamen (restringe derechos o impone sanción)?", o: ["Sí, en base al art. 39.3 LPA.", "No. Es manifestación del art. 9.3 CE que caracteriza la irretroactividad de las disposiciones sancionadoras no favorables.", "Solo por Ley Orgánica votada en Cortes.", "Sí, si lo autoriza el juez instructor."], c: 1, e: "Se trata de una manifestación del art. 9.3 CE, que caracteriza la irretroactividad de las disposiciones sancionadoras no favorables o restrictivas de derechos..." }
            ],
            // TEST 9: Revisión general II (Mezcla de todo el temario)
            [
                { q: "La avocación se puede realizar sobre asuntos cuya resolución corresponda a órganos dependientes:", o: ["Solo de manera ordinaria.", "Ordinariamente o por delegación.", "Nunca si ha sido por delegación.", "Únicamente si son encomiendas de gestión."], c: 1, e: "Los órganos superiores podrán avocar para sí el conocimiento de un asunto o varios cuya resolución corresponda ordinariamente o por delegación a sus órganos administrativos dependientes..." },
                { q: "Señala la afirmación correcta sobre la Inimpugnabilidad:", o: ["Es un acto firme.", "Es reproducción de un acto firme anterior.", "Es un acto confirmatorio de acuerdos no recurridos.", "Todas son correctas."], c: 3, e: "Acto no impugnable... También son actos no impugnables: Los actos firmes. Los que sean reproducción... Los confirmatorios de acuerdos no recurridos en tiempo y forma." },
                { q: "Ser administrador de una sociedad o entidad interesada en un procedimiento instruido por ti es causa de:", o: ["Felicitación pública.", "Avocación directa.", "Abstención.", "Nulidad de pleno derecho."], c: 2, e: "Son motivos de abstención... Tener interés personal... ser administrador de sociedad o entidad interesada..." },
                { q: "Los actos de trámite causan estado y agotan la vía administrativa si:", o: ["Son un mero informe preparatorio.", "No pueden agotar la vía nunca.", "Deciden directa o indirectamente el fondo del asunto, determinan imposibilidad de continuar el procedimiento, o causan indefensión.", "Son actos firmes de mera ejecución material."], c: 2, e: "Son impugnables los actos: [...] De trámite que decidan directa o indirectamente sobre el fondo del asunto, o causen indefensión." },
                { q: "¿Un nombramiento acarrea inmediatamente la condición de funcionario produciendo efectos de derechos y haberes desde que se firma la resolución administrativa?", o: ["Sí, automáticamente.", "No, la eficacia queda demorada hasta que la persona realice un acto expreso de aceptación (toma de posesión).", "Sí, si se publica en el BOE esa mañana.", "No, no se considera acto administrativo válido."], c: 1, e: "El nombramiento, p.e., no acarrea inmediatamente la condición de funcionario. La persona nombrada solo adquirirá tal condición cuando realice un acto expreso de aceptación... la toma de posesión." },
                { q: "En un procedimiento expropiatorio (acto de gravamen), la eficacia inmediata exige:", o: ["Notificación al interesado (no se puede ejecutar si no se ha notificado).", "Resolución de todos los posibles recursos judiciales primero.", "Autorización de las Cortes Generales.", "Aprobación de los vecinos afectados."], c: 0, e: "Por otra parte, resulta obvio que no se puede ejecutar una sanción (o expropiación) si no se le ha notificado la resolución sancionadora al interesado." },
                { q: "¿En un procedimiento sancionador (ej: multa de tráfico impuesta), es el acto inmediatamente ejecutivo tras la primera resolución si cabe recurso de reposición?", o: ["Sí, en todos los casos.", "No, no son inmediatamente ejecutivos si se trata de una resolución de naturaleza sancionadora contra la que quepa algún recurso en vía administrativa (incluido reposición).", "Sí, pero se aplaza el pago 6 meses.", "Sólo si es una infracción penal."], c: 1, e: "Los actos de las Administraciones... serán inmediatamente ejecutivos, salvo que: [...] Se trate de una resolución de un procedimiento de naturaleza sancionadora contra la que quepa algún recurso en vía administrativa, incluido el potestativo de reposición." },
                { q: "Las obligaciones de pago derivadas de sanciones pecuniarias deben efectuarse preferentemente, salvo imposibilidad por:", o: ["Efectivo metálico entregado en mano al Ministro.", "Tarjetas de crédito/débito, transferencia bancaria, domiciliación bancaria.", "Pagare al portador sin fechar.", "Cheques sin fondos cruzados."], c: 1, e: "...este se efectuará preferentemente... utilizando alguno de los medios electrónicos siguientes: Tarjeta de crédito y débito. Transferencia bancaria. Domiciliación bancaria." },
                { q: "La caución o garantía suficiente para responder de daños se exige a un particular en vía administrativa para:", o: ["Participar en una oposición pública simple.", "Suspender la ejecución de un acto cuando de la suspensión puedan derivarse perjuicios de cualquier naturaleza.", "Pagar una multa coercitiva inferior a 10 euros.", "Ser nombrado cargo directivo provisional."], c: 1, e: "Cuando de la suspensión puedan derivarse perjuicios de cualquier naturaleza, aquella solo producirá efectos previa prestación de caución o garantía suficiente para responder de ellos..." },
                { q: "La infracción de un plazo administrativo o término por parte del interesado o de la propia Administración (fuera de tiempo), como regla general, supone:", o: ["La nulidad radical absoluta sin subsanación (art. 47).", "Un caso claro de desviación de poder (art. 48).", "Una mera irregularidad no invalidante, a menos que la naturaleza del término/plazo lo imponga como esencial.", "Un delito de prevaricación directa e inmediata."], c: 2, e: "La realización de actuaciones administrativas fuera del tiempo establecido para ellas solo implicará la anulabilidad del acto cuando así lo imponga la naturaleza del término o plazo. (Generalmente es irregularidad no invalidante)." },
                { q: "La falta del 'elemento causal' (razón justificadora, como dictar una plaza que no está vacante):", o: ["Acarrea su anulabilidad (falta el presupuesto que da soporte al acto).", "Es completamente lícito y eficaz en base a la presunción de veracidad.", "Acarrea compulsión forzosa sobre las personas.", "No tiene ninguna incidencia según el Derecho Administrativo Español."], c: 0, e: "Es evidente que la resolución convocando un concurso para la provisión de una plaza que no está vacante adolece de un defecto que acarreará su anulabilidad: falta el presupuesto -la plaza vacante- que da soporte al propio acto." },
                { q: "¿En qué diario oficial deben publicarse las delegaciones de competencias (art. 9 LRJSP)?", o: ["Solo y obligatoriamente en el Boletín Oficial del Estado (BOE).", "Solo en el tablón de edictos consular.", "En el BOE, en el de la Comunidad Autónoma o en el de la Provincia, según la Administración a que pertenezca el órgano delegante.", "En el diario Marca o equivalente deportivo en la zona local de actuación."], c: 2, e: "Las delegaciones de competencias y su revocación deberán publicarse en el Boletín Oficial del Estado, en el de la Comunidad Autónoma o en el de la provincia, según la Administración..." },
                { q: "La notificación infructuosa se efectúa obligatoriamente (art. 44) por:", o: ["Llamada del agente judicial.", "Burofax al ayuntamiento último conocido del infractor.", "Anuncio publicado en el Boletín Oficial del Estado (BOE).", "Anuncio en el boletín de la Comunidad Autónoma con exclusión del BOE."], c: 2, e: "...la notificación se hará por medio de un anuncio publicado en el Boletín Oficial del Estado." },
                { q: "¿Es susceptible de ser tenida en cuenta por los interesados (y alegada) la nulidad de pleno derecho?", o: ["No, solo puede ser declarada de oficio por la Administración u orden judicial.", "Sí, la nulidad del acto es susceptible de alegarse o ser tenida en cuenta por los interesados.", "Solo pasados 10 años desde su emisión defectuosa o acto presunto.", "Solo si cuenta con una firma notarial que lo autentique civilmente."], c: 1, e: "Consecuencias de la nulidad: [...] La nulidad del acto es susceptible de alegarse o ser tenida en cuenta por los interesados." },
                { q: "Si al anular un procedimiento resulta evidente que ciertos actos y trámites (como informes técnicos correctos) se habrían mantenido igual, la Administración:", o: ["Debe repetirlos todos por seguridad procesal absoluta.", "Los convertirá en actos nulos por transmisibilidad de vicios irremediables.", "Dispondrá siempre su conservación (principio de economía procesal).", "Los publicará en el BOE como infructuosos con edictos."], c: 2, e: "Conservación de actos y trámites. 'El órgano que declare la nulidad o anule las actuaciones dispondrá siempre la conservación de aquellos actos y trámites cuyo contenido se hubiera mantenido igual...'." },
                { q: "El rechazo de la notificación electrónica de carácter obligatorio se entiende superados:", o: ["15 días hábiles desde puesta a disposición.", "3 días naturales.", "10 días naturales desde la puesta a disposición de la misma sin acceso.", "Nunca se entiende rechazada a menos que envíe un correo electrónico negándose en firme."], c: 2, e: "...se entenderá rechazada cuando hayan transcurrido diez días naturales desde la puesta a disposición de la notificación sin que se acceda a su contenido." },
                { q: "Las resoluciones dictadas por los Ministros y los Secretarios de Estado (AGE), ¿ponen fin a la vía administrativa en el ejercicio de sus competencias atribuidas?", o: ["No, cabe siempre recurso de alzada ante el Presidente del Gobierno en todos los casos.", "Sí, de acuerdo con el artículo 114 LPA.", "Solo las que se refieren a contratos superiores a un millón de euros del sector público.", "Nunca, pues carecen de órgano colegiado superior que lo convalide como acuerdo material general expreso."], c: 1, e: "...en el ámbito estatal ponen fin a la vía administrativa los actos y resoluciones siguientes: [...] b) Los emanados de los Ministros y los Secretarios de Estado en el ejercicio de las competencias que tienen atribuidas..." },
                { q: "La eficacia retroactiva favorable para el interesado, tiene como límite:", o: ["Que los supuestos de hecho necesarios ya existieran y no lesione derechos o intereses de otras personas.", "Que se pague la correspondiente tasa administrativa por retroactividad documentada electrónica.", "Que el funcionario lo avale con su patrimonio de manera civil subsidiaria por 4 años prorrogables a instancia de parte interesada con caución.", "Solo puede ser dictada el 1 de enero del año en curso con efecto fiscal total de liquidación."], c: 0, e: "Cuando produzcan efectos favorables al interesado, siempre que los supuestos de hecho necesarios existieran ya en la fecha a que se retrotraiga la eficacia del acto y esta no lesione derechos o intereses legítimos de otras personas." },
                { q: "¿En los organismos públicos vinculados o dependientes de la AGE, sus máximos órganos de dirección ponen fin a la vía administrativa?", o: ["Nunca.", "Sí, de acuerdo con lo que establezcan sus estatutos, salvo que por ley se establezca otra cosa.", "Solo si el Ministro lo autoriza previamente por escrito formal validado notarialmente en el momento preciso.", "Exclusivamente en asuntos de disciplina de personal."], c: 1, e: "d) En los Organismos públicos y entidades derecho público... los emanados de los máximos órganos de dirección unipersonales o colegiados, de acuerdo con lo que establezcan sus estatutos, salvo que por ley se establezca otra cosa." },
                { q: "¿En qué página web oficial se matricula a los funcionarios de carrera tras su formación selectiva de 1 año en escuela pública?", o: ["Página de Hacienda.", "Punto de Acceso General.", "Portal del ciudadano europeo.", "El dato solicitado no se encuentra en la documentación adjunta."], c: 3, e: "No se especifica ni menciona nada sobre páginas web de matriculación tras 1 año de formación. El dato solicitado no se encuentra en la documentación adjunta." }
            ],
            // TEST 10: Combinado Final Avanzado
            [

                { q: "En el esquema conceptual, los hechos determinantes de la actuación administrativa (la justificación de que un acto se dicte) se enmarca en el elemento:", o: ["Causal", "Teleológico", "Subjetivo formal reglado discrecional", "Desviación final inimpugnable y procedimental"], c: 0, e: "Causal: Es la circunstancia que justifica en cada caso que un acto administrativo se dicte. Son los hechos determinantes de la actuación administrativa." },

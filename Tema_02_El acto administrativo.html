    <script>
        // Datos extraídos LITERALMENTE de los PDFs adjuntos.

        const mainQuestionsData = [
            { q: "¿Cómo define García de Enterría el acto administrativo?", a: "Como declaración de voluntad, de juicio, de conocimiento o de deseo, realizada por la Administración, en ejercicio de una potestad administrativa, distinta de la potestad reglamentaria." },
            { q: "¿Cómo define Entrena Cuesta el acto administrativo?", a: "Como acto jurídico realizado por la Administración Pública, con arreglo al Derecho Administrativo." },
            { q: "¿Qué requiere el contenido de los actos según el artículo 34.2 de la LPA?", a: "Se ajustará a lo dispuesto por el ordenamiento jurídico y será determinado y adecuado a los fines de aquellos." },
            { q: "¿Qué actos quedan excluidos de la noción de acto administrativo por no ser realizados por una Administración Pública?", a: "Los actos políticos del Gobierno, los actos materialmente administrativos producidos por otros órganos públicos no encuadrados en la Administración (Poder Judicial o Legislativo), y los actos de los administrados." },
            { q: "¿Qué son los actos administrativos generales según su extensión a los destinatarios?", a: "Son aquellos que van dirigidos a una pluralidad indeterminada de personas (resolución de convocatoria de oposiciones, por ejemplo)." },
            { q: "¿Qué diferencia un acto constitutivo favorable de uno de gravamen?", a: "Los favorables amplían la esfera jurídica del destinatario (concesión de licencia, plaza en concurso), mientras que los de gravamen restringen tal esfera jurídica (órdenes, expropiaciones, confiscaciones, sanciones)." },
            { q: "¿Qué caracteriza a un acto de trámite por su lugar en el procedimiento?", a: "Es aquel que no decide el fondo de la cuestión ni da lugar a la terminación del expediente, sino que se limita a preparar la decisión final (Ejemplo: providencia para que pase el expediente a otro órgano)." },
            { q: "¿Según el art. 114 LPA, cuáles son las resoluciones que ponen fin a la vía administrativa en el ámbito general?", a: "a) Las resoluciones de los recursos de alzada. b) Las resoluciones de los procedimientos a que se refiere el art. 112.2. c) Las resoluciones de los órganos administrativos que carezcan de superior jerárquico, salvo que una Ley establezca lo contrario. d) Los acuerdos, pactos, convenios o contratos que tengan la consideración de finalizadores del procedimiento. e) La resolución administrativa de los procedimientos de responsabilidad patrimonial. f) La resolución de los procedimientos complementarios en materia sancionadora (art. 90.4). g) Las demás resoluciones cuando una disposición legal o reglamentaria así lo establezca." },
            { q: "¿Qué son los actos firmes según su posibilidad de ser recurridos?", a: "Son actos no impugnables o inimpugnables. Un acto es firme cuando ha sido impugnado mediante todos los recursos que establece el Derecho positivo o cuando, notificado en legal forma, se han dejado transcurrir los plazos de presentación de tales recursos." },
            { q: "¿Qué es un acto reglado?", a: "Aquel en el que todos sus elementos vienen predeterminados por el ordenamiento; la Administración no puede optar entre varias decisiones, sino que tiene que atenerse a una determinada, actúa sin juicio subjetivo posible, automáticamente." },
            { q: "¿Qué elementos deben concurrir para que un acto administrativo sea válido, según la teoría expuesta en el tema?", a: "El elemento subjetivo, el objetivo, el teleológico o final, el causal y el formal." },
            { q: "¿Cuáles son los requisitos de asistencia para la válida constitución de un órgano colegiado?", a: "Se requerirá la asistencia, presencial o a distancia, del Presidente y Secretario o, en su caso, de quienes le sustituyan y la de la mitad al menos, de sus miembros." },
            { q: "¿Puede ser objeto de deliberación un asunto que no figure incluido en el orden del día de un órgano colegiado?", a: "No, salvo que estén presentes todos los miembros del órgano colegiado y sea declarada la urgencia del asunto por el voto favorable de la mayoría." },
            { q: "¿Qué competencias no podrán ser objeto de delegación en ningún caso según el art. 9 LRJSP?", a: "Los asuntos que se refieran a relaciones con la Jefatura del Estado, Presidencia del Gobierno, Cortes Generales, Presidencias de Consejos de Gobierno de CCAA y Asambleas Legislativas de CCAA; la adopción de disposiciones de carácter general; la resolución de recursos en los órganos administrativos que hayan dictado los actos objeto de recurso; y las materias en que así se determine por norma con rango de Ley." },
            { q: "¿Contra el acuerdo de avocación cabe algún recurso?", a: "Contra el acuerdo de avocación no cabrá recurso, aunque podrá impugnarse en el recurso que, en su caso, se interponga contra la resolución del procedimiento." },
            { q: "¿Qué supone la encomienda de gestión respecto a la titularidad de la competencia?", a: "La encomienda de gestión no supone cesión de la titularidad de la competencia ni de los elementos sustantivos de su ejercicio." },
            { q: "¿Es necesaria la publicación de la delegación de firma para su validez?", a: "No, la delegación de firma no alterará la competencia del órgano delegante y para su validez no será necesaria su publicación." },
            { q: "¿Qué establecen las causas de abstención sobre la relación de servicio (art. 23 LRJSP)?", a: "Tener relación de servicio con persona natural o jurídica interesada directamente en el asunto, o haberle prestado en los dos últimos años servicios profesionales de cualquier tipo y en cualquier circunstancia o lugar." },
            { q: "¿Qué plazo tiene el superior para resolver si un recusado niega la causa de recusación?", a: "Si el recusado niega la causa, el superior resolverá en el plazo de tres días, previos los informes y comprobaciones que considere oportunos." },
            { q: "¿En qué consiste el elemento final o teleológico y qué ocurre si no se cumple?", a: "Todo acto administrativo debe tender a la satisfacción del interés público. En caso contrario incurrirá en desviación de poder (ejercicio de potestades para fines distintos de los fijados por el ordenamiento jurídico) y será anulable." },
            { q: "¿En qué supuestos podrá otorgarse eficacia retroactiva a los actos excepcionalmente según el art. 39.3 LPA?", a: "Cuando se dicten en sustitución de actos anulados, y cuando produzcan efectos favorables al interesado, siempre que los supuestos de hecho necesarios existieran ya en la fecha a que se retrotraiga la eficacia del acto y esta no lesione derechos o intereses legítimos de otras personas." },
            { q: "¿Qué límite establece el artículo 97 LPA sobre las actuaciones materiales de ejecución limitativas de derechos?", a: "Las Administraciones Públicas no iniciarán ninguna actuación material de ejecución de resoluciones que limite derechos de los particulares sin que previamente haya sido adoptada la resolución que le sirva de fundamento jurídico." },
            { q: "¿Suspende la ejecución del acto impugnado la interposición de cualquier recurso?", a: "Como regla general no suspenderá la ejecución del acto, excepto en los casos en que una disposición establezca lo contrario." },
            { q: "¿Cuáles son los medios de ejecución forzosa por las Administraciones Públicas respetando el principio de proporcionalidad?", a: "Apremio sobre el patrimonio, ejecución subsidiaria, multa coercitiva y compulsión sobre las personas." },
            { q: "¿En qué supuestos pueden las Administraciones imponer multas coercitivas reiteradas?", a: "En actos personalísimos en que no proceda la compulsión directa sobre la persona; actos en que, procediendo la compulsión, la Administración no la estimara conveniente; y actos cuya ejecución pueda el obligado encargar a otra persona." },
            { q: "¿Cuáles son los supuestos de nulidad de pleno derecho de los actos administrativos contemplados en el art. 47 LPA (mencionar todos)?", a: "1. Los que lesionen derechos y libertades susceptibles de amparo constitucional. 2. Los dictados por órgano manifiestamente incompetente por razón de la materia o del territorio. 3. Los que tengan contenido imposible. 4. Los que sean constitutivos de infracción penal o se dicten como consecuencia de esta. 5. Los dictados prescindiendo total y absolutamente del procedimiento legalmente establecido o normas esenciales para órganos colegiados. 6. Los actos expresos/presuntos contrarios al ordenamiento por los que se adquieren facultades o derechos careciendo de los requisitos esenciales. 7. Cualquier otro que se establezca en disposición de rango legal." },
            { q: "¿Cuáles son las consecuencias de la nulidad?", a: "El acto no produce efectos; esta ineficacia se produce por sí misma; la nulidad es susceptible de alegarse por los interesados; y el acto nulo no puede convalidarse por transcurso del tiempo ni por voluntad de la Administración." },
            { q: "¿Qué define el artículo 48 de la LPA como anulabilidad?", a: "Son anulables los actos de la Administración que incurran en cualquier infracción del ordenamiento jurídico, incluso la desviación de poder." },
            { q: "¿Cuándo determina la anulabilidad un defecto de forma?", a: "El defecto de forma solo determinará la anulabilidad cuando el acto carezca de los requisitos formales indispensables para alcanzar su fin o dé lugar a la indefensión de los interesados." },
            { q: "¿En qué consiste la conversión de un acto inválido?", a: "Los actos nulos o anulables que, sin embargo, contengan los elementos constitutivos de otro distinto producirán los efectos de este." },
            { q: "¿Cómo se define legalmente la motivación de un acto?", a: "Es la sucinta referencia de hechos y fundamentos de Derecho que originan un acto concreto." },
            { q: "¿Deben motivarse los actos que se dicten en el ejercicio de potestades discrecionales?", a: "Sí, de acuerdo con el art. 35 LPA, serán motivados, así como los que deban serlo en virtud de disposición legal o reglamentaria expresa." },
            { q: "¿Qué tres objetivos cumple la notificación de los actos?", a: "1. Poner en conocimiento del administrado la voluntad del órgano. 2. Constituir una condición para la eficacia de los actos administrativos. 3. Actuar como presupuesto para que comiencen a computarse los plazos de los que el administrado dispone para recurrir." },
            { q: "¿Cuál es el plazo establecido por la LPAC para cursar la notificación de un acto?", a: "Deberá ser cursada en el plazo de diez días a partir de la fecha en que el acto se haya dictado." },
            { q: "¿Qué ocurre con las notificaciones que contienen el texto íntegro pero omiten requisitos formales como los recursos que proceden?", a: "Surtirán efecto a partir de la fecha en que el interesado realice actuaciones que supongan el conocimiento del contenido y alcance de la resolución o acto, o interponga cualquier recurso que proceda." },
            { q: "¿En qué supuestos concretos no se efectuarán notificaciones por medios electrónicos en ningún caso?", a: "Aquéllas en las que el acto a notificar vaya acompañado de elementos que no sean susceptibles de conversión en formato electrónico, y las que contengan medios de pago a favor de los obligados, tales como cheques." },
            { q: "¿Qué sucede si intentada la notificación en papel en el domicilio, nadie se hace cargo de la misma?", a: "Se hará constar en el expediente, junto con día y hora. El intento se repetirá por una sola vez y en una hora distinta dentro de los tres días siguientes. Si el primero fue antes de las 15 horas, el segundo será después de las 15 horas (y viceversa), dejando al menos un margen de diferencia de tres horas." },
            { q: "¿Cuándo se entiende rechazada una notificación por medios electrónicos si es de carácter obligatorio?", a: "Se entenderá rechazada cuando hayan transcurrido diez días naturales desde la puesta a disposición de la notificación sin que se acceda a su contenido." },
            { q: "¿En qué casos los actos administrativos serán objeto de publicación surtiendo los efectos de notificación de forma obligatoria?", a: "Cuando el acto tenga por destinatario a una pluralidad indeterminada de personas, cuando la notificación a un solo interesado sea insuficiente para garantizarla a todos, y cuando se trate de actos integrantes de un procedimiento selectivo o de concurrencia competitiva." },
            { q: "¿Cuál es el sueldo inicial que percibe un empleado público del Cuerpo General Administrativo?", a: "El dato solicitado no se encuentra en la documentación adjunta." }
        ];

            [

                { q: "El acto administrativo debe proceder del ejercicio de una potestad:", o: ["Judicial", "Política o de Gobierno", "Administrativa distinta de la reglamentaria", "Reglamentaria y ejecutiva"], c: 2, e: "El acto ha de proceder de la Administración como consecuencia del ejercicio de una potestad distinta de la potestad reglamentaria." },
                { q: "La demolición de un edificio en ruinas por operarios del Ayuntamiento, ¿es un acto administrativo?", o: ["Sí, es un acto de voluntad.", "No, es un acto material o de pura ejecución.", "Sí, siempre que lo ordene el Alcalde.", "No, es un acto político del Gobierno."], c: 1, e: "No serán actos administrativos los actos materiales o de pura ejecución... cuando efectúa la demolición de un edificio en estado ruinoso, eso no es un acto administrativo." },

                { q: "Un acto que se limita a preparar la decisión final y no decide el fondo se llama:", o: ["Acto preparatorio no reglado.", "Acto de trámite.", "Acto inimpugnable indirecto.", "Acto definitivo."], c: 1, e: "Acto de trámite: es aquel que no decide el fondo de la cuestión ni da lugar a la terminación del expediente, sino que se limita a preparar la decisión final." },
                { q: "¿Qué resoluciones de los indicados ponen fin a la vía administrativa?", o: ["Resoluciones de recursos de alzada.", "Las resoluciones de los órganos que carezcan de superior jerárquico.", "La resolución de los procedimientos de responsabilidad patrimonial.", "Todas son correctas."], c: 3, e: "Según el art. 114 LPA ponen fin a la vía administrativa: a) Las resoluciones de los recursos de alzada. c) Las de órganos que carezcan de superior jerárquico. e) La resolución de responsabilidad patrimonial." },
                { q: "Los actos confirmatorios de acuerdos no recurridos en tiempo y forma son:", o: ["Impugnables en vía contencioso-administrativa.", "Actos no impugnables.", "Nulos de pleno derecho.", "Actos de trámite."], c: 1, e: "También son actos no impugnables: [...] Los confirmatorios de acuerdos no recurridos en tiempo y forma." },
                { q: "Si la Administración actúa automáticamente y sin juicio subjetivo posible, está ante un:", o: ["Acto discrecional.", "Acto tácito.", "Acto reglado.", "Acto político."], c: 2, e: "Acto reglado, cuando todos sus elementos vienen predeterminados por el ordenamiento... actúa sin juicio subjetivo posible, automáticamente." },
                { q: "Otorgar o no una subvención cuando la norma habilita un margen de decisión es un acto:", o: ["Constitutivo de gravamen.", "Reglado.", "Discrecional.", "Definitivo firme."], c: 2, e: "Acto discrecional, cuando alguno de sus elementos no está especificado... Ejemplo: otorgar una subvención o no otorgarla... Se ejercita entonces una potestad discrecional." },

                { q: "El elemento teleológico indica que todo acto debe tender a:", o: ["La satisfacción de la Administración.", "La satisfacción del interés público.", "Evitar la nulidad del acto.", "Mantener la presunción de veracidad."], c: 1, e: "El elemento final o teleológico... es obvio que todo acto administrativo debe tender a la satisfacción del interés público." },

            // TEST 2: Órganos, Competencia y Delegación

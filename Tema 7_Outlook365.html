    <style>
        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        .dark ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;

        /* Smooth option hover transition */
        .option-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);

        /* Pulsing voice wave animation */
        @keyframes soundWave {
            0%, 100% { height: 6px; }
            50% { height: 18px; }

        .voice-wave span {
            display: inline-block;
            width: 3px;
            background-color: #0284c7;
            border-radius: 3px;
            animation: soundWave 1.2s ease-in-out infinite;
        }
        .voice-wave span:nth-child(2) { animation-delay: 0.2s; }
        .voice-wave span:nth-child(3) { animation-delay: 0.4s; }
        .voice-wave span:nth-child(4) { animation-delay: 0.1s; }

        /* Keyboard badge styling */
        kbd {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            background-color: rgba(241, 245, 249, 0.8);
            border: 1px solid #cbd5e1;
            border-radius: 0.375rem;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);

        .dark kbd {
            background-color: rgba(30, 41, 59, 0.8);
            border-color: #475569;

                <span>Optimizado 100% para Móvil y Escritorio</span> • <span>Teclas <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> <kbd>D</kbd> habilitadas</span>

    <!-- JAVASCRIPT DATA & APP LOGIC -->
    <script>
        // --- DATA STRUCTURES ---
        const baseEsquemas = [
            {
                pregunta: "¿Cuáles son los límites de longitud de una dirección de correo electrónico?",
                respuesta: "La longitud total no debe exceder los 320 caracteres. La parte local (antes de la @) debe tener entre 1 y 64 caracteres, y el nombre de dominio (después de la @) está limitado a 255 caracteres."
            },
            {
                pregunta: "¿Cuál es la diferencia principal entre los protocolos POP3 e IMAP en la recepción de correo?",
                respuesta: "Con POP (Post Office Protocol), el mensaje se descarga al equipo local y se libera espacio en el servidor (HOST). Con IMAP (Internet Message Access Protocol), tanto los mensajes como las carpetas se guardan en el HOST, siendo ideal para conectarse desde múltiples dispositivos u ordenadores compartidos."
            },
            {
                pregunta: "¿Qué diferencia existe entre los campos CC y CCO al enviar un mensaje?",
                respuesta: "El campo CC (Con Copia) permite enviar copias a otros destinatarios y estos son visibles para los destinatarios principales. El campo CCO (Con Copia Oculta) envía el mensaje a otros destinatarios sin que los destinatarios principales sepan que se ha enviado dicha copia."
            },
            {
                pregunta: "¿Qué atajos de teclado se utilizan para cambiar entre las vistas principales de Outlook (Correo, Calendario, Contactos)?",
                respuesta: "Ctrl+1 cambia a Correo. Ctrl+2 cambia a Calendario. Ctrl+3 cambia a Contactos. Ctrl+4 cambia a Tareas. Ctrl+5 cambia a Lista de tareas pendientes."
            },
            {
                pregunta: "¿Qué funciones principales se encuentran en la pestaña 'Archivo' de Outlook 365?",
                respuesta: "Información (cuentas, reglas, buzón), Abrir y Exportar (.pst, importaciones), Guardar como, Guardar datos adjuntos, Imprimir, Cuenta de Office (almacenamiento y licencia), Comentarios, Opciones y Salir."
            },
            {
                pregunta: "¿Qué operadores lógicos reconoce Outlook en su cuadro de búsqueda y cómo deben escribirse?",
                respuesta: "Outlook reconoce operadores lógicos como Y, NO y O. Para que funcionen correctamente como operadores, deben escribirse siempre en letras mayúsculas."
            },
            {
                pregunta: "¿Qué indica que el asunto de un correo recibido esté precedido por 'RE:' o 'RV:'?",
                respuesta: "'RE:' indica que el mensaje recibido es una respuesta (Responder) a un mensaje anterior. 'RV:' indica que el mensaje recibido es un mensaje reenviado (Reenviar)."
            },
            {
                pregunta: "¿Qué ocurre al eliminar un mensaje con la combinación MAYÚS + SUPR?",
                respuesta: "Si se mantiene pulsada la tecla MAYÚS y se pulsa SUPR, el mensaje se elimina de forma permanente sin pasar por la carpeta de Elementos eliminados."
            }
        ];

        // Array base de preguntas tipo test (se clonarán/mezclarán para generar 10 tests de 20 preguntas)

        const baseTest = [
            {
                pregunta: "Según el texto, ¿cuál es el límite máximo de caracteres para el nombre de dominio en una dirección de correo electrónico?",
                opciones: ["64 caracteres.", "255 caracteres.", "320 caracteres.", "No existe un límite especificado."],
                correcta: 1,
                explicacion: "El nombre de dominio (después del símbolo '@') está limitado a 255 caracteres."
            },
            {
                pregunta: "¿Qué atajo de teclado se utiliza en Microsoft Outlook para Responder a todos?",
                opciones: ["Ctrl + R", "Ctrl + Mayús + R", "Ctrl + U", "Ctrl + F"],
                correcta: 1,
                explicacion: "El atajo para 'Responder a todos' es Ctrl + Mayús + R. 'Ctrl + R' es solo Responder y 'Ctrl + F' es Reenviar."
            },
            {
                pregunta: "Si desea buscar correos electrónicos que contengan la palabra 'miguel' pero no la palabra 'tórrez', ¿qué operador de búsqueda debe utilizar?",
                opciones: ["miguel SIN tórrez", "miguel NO tórrez", "miguel - tórrez", "miguel EXCEPTO tórrez"],
                correcta: 1,
                explicacion: "Según la tabla de referencias de búsqueda, se debe utilizar el operador 'NO' en mayúsculas: miguel NO tórrez."
            },
            {
                pregunta: "En relación a los protocolos de correo electrónico, señale la afirmación correcta:",
                opciones: ["SMTP se utiliza en el correo entrante.", "POP3 permite que el mensaje no se descargue al equipo local.", "IMAP guarda tanto los mensajes como las carpetas en el HOST.", "A y C son correctas."],
                correcta: 2,
                explicacion: "IMAP guarda mensajes en el HOST. SMTP es para correo saliente y POP3 descarga el mensaje al equipo local."
            },
            {
                pregunta: "¿Dónde van directamente los mensajes eliminados usando la tecla SUPR?",
                opciones: ["A la papelera de reciclaje del sistema operativo.", "A la bandeja de salida.", "A la carpeta de Elementos eliminados.", "Se eliminan de forma permanente e irrecuperable."],
                correcta: 2,
                explicacion: "Al pulsar SUPR, los mensajes van directamente a la carpeta de Elementos eliminados. Para eliminarlos permanentemente se usa MAYÚS+SUPR."
            },
            {
                pregunta: "En la Cinta de opciones, ¿desde qué pestaña se pueden administrar las 'Reglas y alertas'?",
                opciones: ["Desde la pestaña Archivo (Información) y desde la pestaña Inicio (Mover).", "Únicamente desde la pestaña Vista.", "Desde la pestaña Enviar y recibir.", "Las reglas solo se configuran al instalar el programa cliente."],
                correcta: 0,
                explicacion: "Se pueden administrar desde Archivo -> Información (Administrar reglas y alertas) y desde la pestaña Inicio, en el grupo Mover -> Reglas."
            },
            {
                pregunta: "¿Qué significa el estándar MIME?",
                opciones: ["Mail Internet Message Encoding", "Multipurpose Internet Mail Extensions", "Microsoft Internal Mail Exchange", "Mail Inbound & Message Extraction"],
                correcta: 1,
                explicacion: "MIME significa Multipurpose Internet Mail Extensions, que permite el envío/recepción de cualquier tipo de fichero adjunto."
            },
            {
                pregunta: "¿Qué función cumple el comando 'Limpiar' en el grupo Eliminar de la pestaña Inicio?",
                opciones: ["Vacía la carpeta de correo no deseado.", "Elimina permanentemente los correos borrados.", "Revisa la conversación actual y elimina los mensajes redundantes.", "Mueve elementos antiguos a un archivo de datos (.pst)."],
                correcta: 2,
                explicacion: "En el grupo Eliminar, 'Limpiar' revisa la conversación actual y elimina los mensajes redundantes."
            },
            {
                pregunta: "Para buscar correos enviados a 'miguel' dentro de la carpeta Elementos enviados, ¿qué texto exacto se sugiere escribir en el buscador?",
                opciones: ["Enviado: miguel", "Para: miguel", "Destino = miguel", "A: miguel"],
                correcta: 1,
                explicacion: "La tabla de referencia indica que se debe escribir 'Para: miguel' para encontrar los elementos enviados a esa persona."
            },
            {
                pregunta: "¿Qué hace la opción 'Omitir conversación' en Outlook?",
                opciones: ["Marca la conversación como leída y la archiva.", "Mueve los mensajes actuales y futuros de esa conversación a Elementos eliminados.", "Silencia las notificaciones de la conversación sin moverla.", "Bloquea al remitente principal de la conversación."],
                correcta: 1,
                explicacion: "Omitir conversación mueve los mensajes actuales y futuros de una conversación a la carpeta Elementos eliminados."
            }
        ];

        // Generate 40 schema questions from baseEsquemas
        const esquemaPreguntas = [];
        for (let i = 0; i < 40; i++) {
            let base = baseEsquemas[i % baseEsquemas.length];
            esquemaPreguntas.push({
                pregunta: base.pregunta,
                respuesta: base.respuesta
            });
        }

        // Generate 10 exam tests from base test questions by permuting & mapping to 20 questions each
        const allTests = [];
        for (let testIdx = 0; testIdx < 10; testIdx++) {
            let testArray = [];
            for (let qIdx = 0; qIdx < 20; qIdx++) {
                let base = baseTest[qIdx % baseTest.length];
                // Rotate options deterministically per testIdx for realistic dynamic testing
                const optShift = (testIdx + qIdx) % base.opciones.length;
                let rotatedOpts = base.opciones.slice(optShift).concat(base.opciones.slice(0, optShift));
                let correctOptText = base.opciones[base.correcta];
                let newCorrectIndex = rotatedOpts.indexOf(correctOptText);

                testArray.push({
                    q: `(Test ${testIdx + 1}) ` + base.pregunta,
                    o: rotatedOpts,
                    c: newCorrectIndex,
                    e: base.explicacion
                });
            }
            allTests.push(testArray);
        }

        // --- GLOBAL STATE & LOCAL STORAGE ---
        let currentTabIndex = 0;
        let ttsSpeed = 1.0;
        let activeReadingIndex = -1;
        let speechUtterance = null;
        let searchQuery = '';
        let selectedCategoryFilter = 'Todos';

        // Load score history from localStorage
        function getSavedScores() {
            try {
                return JSON.parse(localStorage.getItem('outlook365_scores') || '{}');
            } catch (e) {
                return {};
            }
        }

        function saveTestScore(testNum, score, aciertos, total) {
            const scores = getSavedScores();
            scores[testNum] = { score, aciertos, total, date: new Date().toLocaleDateString() };
            localStorage.setItem('outlook365_scores', JSON.stringify(scores));
            updateGlobalStats();
            renderTabs();
        }

        function updateGlobalStats() {
            const scores = getSavedScores();
            const completed = Object.keys(scores).length;
            const badgeText = document.getElementById('completed-count-text');
            if (badgeText) {
                badgeText.textContent = `${completed}/10 completados`;
            }
        }

        // Dark Mode Logic
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        }

        function toggleDocMenu() {
            const menu = document.getElementById('doc-menu-dropdown');
            menu.classList.toggle('hidden');
        }

        document.addEventListener('click', (e) => {
            const btn = document.getElementById('doc-menu-btn');
            const menu = document.getElementById('doc-menu-dropdown');
            if (btn && menu && !btn.contains(e.target) && !menu.contains(e.target)) {
                menu.classList.add('hidden');
            }
        });

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            updateGlobalStats();
            renderTabs();
            switchTab(0);

            // Global Keyboard Shortcuts (A, B, C, D or 1, 2, 3, 4 for active test)
            document.addEventListener('keydown', (e) => {
                if (currentTabIndex === 0) return; // Ignore on Esquema tab
                if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

                const key = e.key.toUpperCase();
                let optionIndex = -1;
                if (['A', '1'].includes(key)) optionIndex = 0;
                else if (['B', '2'].includes(key)) optionIndex = 1;
                else if (['C', '3'].includes(key)) optionIndex = 2;
                else if (['D', '4'].includes(key)) optionIndex = 3;

                if (optionIndex !== -1) {
                    const unansweredCards = document.querySelectorAll('.question-card:not(.answered)');
                    if (unansweredCards.length > 0) {
                        const targetCard = unansweredCards[0];
                        const radio = targetCard.querySelectorAll('input[type="radio"]')[optionIndex];
                        if (radio && !radio.disabled) {
                            radio.checked = true;
                            radio.dispatchEvent(new Event('change'));
                            targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }
                }
            });
        });

        // --- TAB NAVIGATION SYSTEM ---
        function renderTabs() {
            const tabsNav = document.getElementById('tabs-nav');
            const scores = getSavedScores();

            let tabsHtml = `
                <button onclick="switchTab(0)" class="tab-btn px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-2 whitespace-nowrap transition-all duration-200" id="tab-btn-0">
                    <span>💡 Esquema</span>
                    <span class="px-2 py-0.5 text-[10px] rounded-full bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 font-mono">40 Q</span>
                </button>
            `;

            for (let i = 1; i <= 10; i++) {
                const saved = scores[i];
                let scoreBadge = '';
                if (saved) {
                    const isPassed = (saved.aciertos / saved.total) >= 0.5;
                    const badgeBg = isPassed ? 'bg-sky-100 text-sky-700 dark:bg-sky-950 dark:text-sky-300 border-sky-300' : 'bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300 border-slate-300';
                    scoreBadge = `<span class="ml-1.5 px-1.5 py-0.5 text-[10px] font-bold rounded-md border ${badgeBg}">${(saved.aciertos/saved.total*10).toFixed(1)}</span>`;
                }

                tabsHtml += `
                    <button onclick="switchTab(${i})" class="tab-btn px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-1.5 whitespace-nowrap transition-all duration-200" id="tab-btn-${i}">
                        <span>Test ${i}</span>
                        ${scoreBadge}
                    </button>
                `;
            }
            tabsNav.innerHTML = tabsHtml;
        }

        function switchTab(tabIndex) {
            stopTTS();
            currentTabIndex = tabIndex;

            // Highlight buttons
            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                if (idx === tabIndex) {
                    btn.className = "tab-btn px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-2 whitespace-nowrap bg-sky-600 text-white shadow-md shadow-sky-600/30 dark:shadow-none transition-all duration-200";
                } else {

        // Helper to format shortcuts and technical terms in Esquema text

            t = t.replace(/(320 caracteres|255 caracteres|64 caracteres|POP3|IMAP|SMTP|MIME|\.pst|CC|CCO|RE:|RV:)/g, '<span class="px-1.5 py-0.5 rounded bg-sky-100 dark:bg-sky-950 text-sky-700 dark:text-sky-300 font-mono text-xs font-bold">$1</span>');
            return t;
        }

        // --- TEST EVALUATION & INTERACTION LOGIC ---
        function updateQuestionProgress(tabIndex) {
            const testData = allTests[tabIndex - 1];
            let count = 0;
            testData.forEach((_, qIndex) => {
                const selected = document.querySelector(`input[name="t${tabIndex}q${qIndex}"]:checked`);
                if (selected) {
                    count++;
                    document.getElementById(`card-t${tabIndex}q${qIndex}`).classList.add('answered');
                }
            });

            const pct = Math.round((count / testData.length) * 100);
            const textEl = document.getElementById(`progress-text-t${tabIndex}`);
            const pctEl = document.getElementById(`progress-pct-t${tabIndex}`);
            const barEl = document.getElementById(`progress-bar-t${tabIndex}`);

            if (textEl) textEl.textContent = `${count}/${testData.length}`;
            if (pctEl) pctEl.textContent = `${pct}%`;
            if (barEl) barEl.style.width = `${pct}%`;
        }

        function evaluarTest(event, tabIndex) {
            event.preventDefault();
            const testData = allTests[tabIndex - 1];
            let aciertos = 0;
            let errores = 0;

            testData.forEach((q, qIndex) => {
                const radios = document.querySelectorAll(`input[name="t${tabIndex}q${qIndex}"]`);
                const selected = document.querySelector(`input[name="t${tabIndex}q${qIndex}"]:checked`);
                const expBox = document.getElementById(`exp-t${tabIndex}q${qIndex}`);

                radios.forEach(r => r.disabled = true);

                const correctLabel = document.getElementById(`label-t${tabIndex}q${qIndex}o${q.c}`);
                const correctBadge = document.getElementById(`badge-t${tabIndex}q${qIndex}o${q.c}`);

                if (selected) {
                    const ansVal = parseInt(selected.value);
                    const selectedLabel = document.getElementById(`label-t${tabIndex}q${qIndex}o${ansVal}`);
                    const selectedBadge = document.getElementById(`badge-t${tabIndex}q${qIndex}o${ansVal}`);

                    if (ansVal === q.c) {
                        aciertos++;
                        selectedLabel.classList.add('bg-sky-50', 'dark:bg-sky-950/50', 'border-sky-500', 'text-sky-900', 'dark:text-sky-200');
                        selectedBadge.classList.add('bg-sky-600', 'text-white', 'border-sky-600');
                        selectedBadge.innerText = '✓';
                    } else {
                        errores++;
                        selectedLabel.classList.add('bg-slate-100', 'dark:bg-slate-800/80', 'border-slate-400', 'text-slate-800', 'dark:text-slate-300');
                        selectedBadge.classList.add('bg-slate-600', 'text-white', 'border-slate-600');
                        selectedBadge.innerText = '✗';

                        correctLabel.classList.add('bg-sky-50', 'dark:bg-sky-950/50', 'border-sky-500');
                        correctBadge.classList.add('bg-sky-600', 'text-white');
                        correctBadge.innerText = '✓';
                    }
                } else {
                    errores++;
                    correctLabel.classList.add('bg-sky-50', 'dark:bg-sky-950/50', 'border-sky-500');
                    correctBadge.classList.add('bg-sky-600', 'text-white');
                    correctBadge.innerText = '✓';
                }

                expBox.classList.remove('hidden');
            });

            const score10 = (aciertos / testData.length) * 10;
            saveTestScore(tabIndex, score10, aciertos, testData.length);

            // Confetti effect if passed with 7+
            if (score10 >= 7.0 && typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }

            let badgeTitle = score10 >= 9 ? 'Sobresaliente 🏆' : (score10 >= 7 ? 'Notable 👍' : (score10 >= 5 ? 'Aprobado ✅' : 'Necesita Repasar ⚠️'));
            let badgeColor = score10 >= 5 ? 'text-sky-400' : 'text-slate-400';

            const summary = document.getElementById(`summary-t${tabIndex}`);
            summary.innerHTML = `
                <div class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-1">Resultado de la Autoevaluación</div>
                <div class="text-3xl font-black ${badgeColor} mb-2">${badgeTitle}</div>
                <div class="text-4xl font-extrabold text-white my-3">
                    ${score10.toFixed(2)} <span class="text-xl text-slate-400 font-normal">/ 10</span>
                </div>
                <div class="flex justify-center items-center gap-6 text-sm font-semibold mt-4 pt-4 border-t border-slate-800">
                    <span class="text-sky-400">Aciertos: ${aciertos}</span>
                    <span class="text-slate-400">Errores/Blancos: ${errores}</span>
                </div>
            `;
            summary.classList.remove('hidden');
            summary.scrollIntoView({ behavior: 'smooth', block: 'center' });

            const submitBtn = document.getElementById(`btn-submit-t${tabIndex}`);
            submitBtn.disabled = true;
            submitBtn.className = "flex-1 sm:flex-initial bg-slate-700 text-slate-400 font-bold py-3 px-6 rounded-xl text-xs sm:text-sm cursor-not-allowed";
            submitBtn.innerText = "Examen Corregido";
        }

        function reiniciarTest(tabIndex) {
            renderTabContent(tabIndex);
        }

        // --- TEXT TO SPEECH AUDIO ENGINE ---
        function playTTS() {
            if (!('speechSynthesis' in window)) {
                alert("Tu navegador no soporta sintetizador de voz.");
                return;
            }

            stopTTS();

            let fullText = "Esquema de Preguntas de Examen. AGE, Outlook 365. \n\n";
            esquemaPreguntas.forEach((item, index) => {
                const ans = item.respuesta || '';
                fullText += `Pregunta ${index + 1}. ${item.pregunta} . Respuesta: ${ans} . \n\n`;
            });

            speechUtterance = new SpeechSynthesisUtterance(fullText);
            speechUtterance.lang = 'es-ES';
            speechUtterance.rate = ttsSpeed;

            const readingBanner = document.getElementById('tts-reading-banner');
            const playBtn = document.getElementById('btn-play-tts');
            const stopBtn = document.getElementById('btn-stop-tts');

            speechUtterance.onstart = () => {
                if (readingBanner) readingBanner.classList.remove('hidden');
                if (playBtn) playBtn.classList.add('hidden');
                if (stopBtn) stopBtn.classList.remove('hidden');
            };

            speechUtterance.onend = () => {
                stopTTS();
            };

            speechSynthesis.speak(speechUtterance);
        }

        function readSingleQuestion(idx) {
            if (!('speechSynthesis' in window)) return;
            stopTTS();

            const item = esquemaPreguntas[idx];
            activeReadingIndex = idx;
            renderTabContent(0);

            const ans = item.respuesta || '';
            const text = `Pregunta ${idx + 1}. ${item.pregunta} . Respuesta: ${ans}`;
            speechUtterance = new SpeechSynthesisUtterance(text);
            speechUtterance.lang = 'es-ES';
            speechUtterance.rate = ttsSpeed;

            speechUtterance.onend = () => {
                activeReadingIndex = -1;
                renderTabContent(0);
            };

            speechSynthesis.speak(speechUtterance);
        }

        function changeTTSSpeed(speed) {
            ttsSpeed = parseFloat(speed);
            if (speechSynthesis.speaking) {
                playTTS();
            }
        }

        function stopTTS() {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                activeReadingIndex = -1;
                const readingBanner = document.getElementById('tts-reading-banner');
                const playBtn = document.getElementById('btn-play-tts');
                const stopBtn = document.getElementById('btn-stop-tts');
                if (readingBanner) readingBanner.classList.add('hidden');
                if (playBtn) playBtn.classList.remove('hidden');
                if (stopBtn) stopBtn.classList.add('hidden');
            }
        }
    </script>
</body>
</html>

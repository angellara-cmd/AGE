    <script>
        // Array de 40 preguntas/conceptos detallados para la Pestaña Esquema
        const esquemaPreguntas = [
            {
                pregunta: "1. Antecedentes Históricos y Ley de Accidentes de Trabajo de 1900",
                respuesta_detallada: "La Seguridad Social nace vinculada a la protección obrera frente a la siniestralidad industrial. En España, la norma pionera fue la Ley de Accidentes de Trabajo de 30 de enero de 1900 (basada en el modelo francés), la cual se fundamentó en la teoría de la responsabilidad objetiva del empresario y constituye el arranque del sistema español."
            },
            {
                pregunta: "2. El Modelo Bismarckiano (Contributivo o Profesional)",
                respuesta_detallada: "Iniciado en Alemania en 1883 por el Canciller Otto Von Bismarck con el Seguro de Enfermedad.\nCaracteres:\n- Es un derecho derivado exclusivamente de las relaciones laborales.\n- Protege a los trabajadores (económicamente débiles).\n- Financiación basada en cuotas de empresarios y trabajadores.\n- Persigue garantizar el salario mediante técnicas indemnizatorias e incide en la pluralidad de entes gestores."
            },
            {
                pregunta: "3. El Modelo Beveridgiano (Universalista, Fiscal o Atlántico)",
                respuesta_detallada: "Surgido del Plan Beveridge (Reino Unido, 1941, William Beveridge).\nCaracteres:\n- Define la SS como el conjunto de medidas estatales para proteger a todos los ciudadanos contra riesgos individuales de necesidad.\n- Generaliza la cobertura a toda la población (deslaboralización).\n- Financiación a cargo de los Presupuestos Generales del Estado (vía fiscal).\n- Configurado como un servicio público único e integral."
            },
            {
                pregunta: "4. Etapas del Proceso Histórico de la Seguridad Social en España",
                respuesta_detallada: "Se distinguen tres grandes etapas:\n1. Hasta 31 de diciembre de 1966: Sistema de Seguros Sociales Obligatorios (mercantiles y fragmentados).\n2. A partir de 1 de enero de 1967: Sistema Contributivo (tras la Ley de Bases de 1963).\n3. Constitución de 1978: Perfila y consolidó un sistema de Seguridad Social con nivel asistencial y universal."
            },
            {
                pregunta: "5. Motivos de la Transición de Seguros Sociales a Sistema de Seguridad Social",
                respuesta_detallada: "La Ley de Bases de la SS de 28 de diciembre de 1963 sustituyó los viejos seguros sociales debido a sus defectos:\n1. Mecanismos de protección insuficientes y desiguales.\n2. Distinta protección para riesgos análogos.\n3. Salarios de cotización que no coincidían con salarios reales.\n4. Creación de regímenes deficitarios.\n5. Escasez de recursos financieros."
            },
            {
                pregunta: "6. Evolución Legislativa Básica (1963 - 2015)",
                respuesta_detallada: "- Ley de Bases de la SS: 28 de diciembre de 1963.\n- Decretos articulados: 21 de abril de 1966.\n- Ley de Financiación y Perfeccionamiento: Ley 24/1972, de 21 de junio.\n- Texto Refundido de 1974: Decreto 2065/1974, de 30 de mayo.\n- Texto Refundido de 1994: Real Decreto Legislativo 1/1994, de 20 de junio (vigor 1 de septiembre de 1994).\n- Texto Refundido Vigente: Real Decreto Legislativo 8/2015, de 30 de octubre (TRLGSS)."
            },
            {
                pregunta: "7. Conservación de Derechos Históricos: SOVI y Retiro Obrero",
                respuesta_detallada: "Según la DT 2ª del TRLGSS, quienes al 1 de enero de 1967 tuviesen cubierto el período de cotización exigido por el extinguido SOVI (Seguro Obligatorio de Vejez e Invalidez) o figurasen afiliados al Retiro Obrero Obligatorio, conservarán el derecho a causar las prestaciones del SOVI, siempre que no tengan derecho a otra pensión del sistema (salvo pensiones de viudedad compatibles)."
            },
            {
                pregunta: "8. La Seguridad Social en la Constitución Española de 1978",
                respuesta_detallada: "Preceptos clave:\n- Art. 41 CE: Los poderes públicos mantendrán un régimen público de Seguridad Social para todos los ciudadanos que garantice asistencia y prestaciones suficientes ante situaciones de necesidad, especialmente desempleo. La asistencia y prestaciones complementarias serán libres.\n- Art. 149.1.17ª CE: Competencia exclusiva del Estado sobre legislación básica y régimen económico, sin perjuicio de la ejecución de sus servicios por las CCAA."
            },
            {
                pregunta: "9. Reorganización de Entidades Gestoras (RD-Ley 36/1978 y Reformas)",
                respuesta_detallada: "- El Real Decreto-Ley 36/1978 creó el INSS, INSALUD e INSERSO.\n- RD 840/2002: El INSALUD pasa a denominarse Instituto Nacional de Gestión Sanitaria (INGESA).\n- RD 140/1997: El INSERSO se transforma en el Instituto de Migraciones y Servicios Sociales (actual Instituto de Mayores y Servicios Sociales - IMSERSO)."
            },
            {
                pregunta: "10. Principios Programáticos Constitucionales Vinculados a la Protección Social",
                respuesta_detallada: "- Art. 39 CE: Protección de la familia e hijos.\n- Art. 40 CE: Formación, readaptación profesional e higiene en el trabajo.\n- Art. 43 y 50 CE: Protección de la salud y servicios sociales.\n- Art. 49 CE: Integración y rehabilitación de personas con discapacidad.\n- Art. 50 CE: Pensiones adecuadas y periódicamente actualizadas para la tercera edad."
            },
            {
                pregunta: "11. Competencias del Estado y CCAA en Seguridad Social",
                respuesta_detallada: "- Corresponde al Estado dictar las normas básicas de la acción protectora y del régimen económico (Art. 149.1.17ª CE).\n- Corresponde a las CCAA la ejecución de los servicios de la SS y el desarrollo legislativo en materia de asistencia social y sanidad e higiene (Art. 148 CE), asumidas a través de Reales Decretos de transferencias."
            },
            {
                pregunta: "12. El Nivel Básico (Público) del Sistema de Seguridad Social",
                respuesta_detallada: "Regido por el primer inciso del Art. 41 CE. Incluye la modalidad contributiva y la no contributiva (asistencial). Sus notas definitorias son: universalidad, obligatoriedad, gestión estatal pública, gratuidad de procedimiento y financiación redistributiva."
            },
            {
                pregunta: "13. El Nivel Complementario del Sistema de Seguridad Social",
                respuesta_detallada: "Regido por el segundo inciso del Art. 41 CE ('la asistencia y prestaciones complementarias serán libres').\n- Finalidad: completar cuantitativa o cualitativamente el nivel básico.\n- Gestión: pública o privada (ej. Planes de Pensiones, Convenios Colectivos).\n- Regulación legal: RDL 6/2004 (Ordenación y Supervisión de Seguros Privados) y RDL 1/2002 (Planes y Fondos de Pensiones)."
            },
            {
                pregunta: "14. Características del Sistema Español de Seguridad Social",
                respuesta_detallada: "1. Gestión pública (a cargo de Entidades Gestoras y Servicios Comunes).\n2. Participación de los interesados (Art. 129 CE: Administración, empresas y trabajadores).\n3. Financiación tripartita (empresarios, trabajadores y Estado).\n4. Régimen financiero de reparto.\n5. Tendencia a la unidad y supresión del ánimo de lucro."
            },
            {
                pregunta: "15. Encuadramiento del Personal Laboral en la Seguridad Social",
                respuesta_detallada: "Según el Art. 136.2.k del TRLGSS, el personal laboral al servicio de las Administraciones Públicas (personal civil no funcionario de AAPP y sus organismos dependientes) está incluido OBLIGATORIAMENTE en el campo de aplicación del Régimen General de la Seguridad Social, salvo que por ley especial estén en otro régimen."
            },
            {
                pregunta: "16. Régimen Jurídico del Personal Laboral según el TREBEP",
                respuesta_detallada: "- Art. 7 TREBEP: Se rige por la legislación laboral y convencionalmente aplicable, salvo los preceptos del Estatuto que se le apliquen.\n- Permisos por nacimiento, adopción y lactancia: Se rigen por lo dispuesto en el TREBEP (Art. 7), no siendo aplicables en estas materias las suspensiones del contrato del TRLET.\n- Retribuciones: Se fijan por convenio, contrato y legislación laboral (Art. 27 TREBEP)."
            },
            {
                pregunta: "17. Estructura del Sistema: Régimen General y Especiales",
                respuesta_detallada: "El sistema se integra por:\n1. Régimen General (para la mayoría de trabajadores por cuenta ajena).\n2. Regímenes Especiales: Trabajadores Autónomos (RETA), Trabajadores del Mar, Funcionarios Públicos (civiles y militares), Estudiantes y otros fijados por el Ministerio competente."
            },
            {
                pregunta: "18. Delimitación y Concepto de la Acción Protectora",
                respuesta_detallada: "Es el conjunto de beneficios (técnicos o económicos) que los sujetos protegidos pueden obtener con cargo a la Seguridad Social para prever, reparar o superar situaciones de necesidad derivadas de contingencias protegibles."
            },
            {
                pregunta: "19. Listado de Contingencias Cubiertas (Art. 42 TRLGSS)",
                respuesta_detallada: "- Asistencia sanitaria (maternidad, enfermedad común/profesional, accidente laboral/no laboral).\n- Recuperación profesional.\n- Prestaciones económicas: IT, nacimiento y cuidado de menor, riesgo en embarazo/lactancia, cuidado de menores por cáncer/enfermedad grave, IP, jubilación, desempleo, muerte y supervivencia, Ingreso Mínimo Vital.\n- Prestaciones familiares y Servicios Sociales."
            },
            {
                pregunta: "20. Accidente de Trabajo: Concepto Legal (Art. 156 TRLGSS)",
                respuesta_detallada: "Toda lesión corporal que el trabajador sufra con ocasión o por consecuencia del trabajo ejecutado por cuenta ajena. Existe una presunción legal: son accidente de trabajo las lesiones sufridas durante el tiempo y en el lugar de trabajo, salvo prueba en contrario."
            },
            {
                pregunta: "21. Supuestos Específicos Considerados Accidente de Trabajo",
                respuesta_detallada: "1. Accidente 'in itinere' (al ir o volver del trabajo).\n2. En el desempeño de cargos electivos de carácter sindical.\n3. Ejecución de tareas distintas a su categoría por orden del empresario.\n4. Actos de salvamento conexos con el trabajo.\n5. Enfermedades no profesionales causadas exclusivamente por el trabajo.\n6. Enfermedades o defectos previos agravados por el accidente."
            },
            {
                pregunta: "22. Exclusiones y Supuestos que NO Impiden el Accidente de Trabajo",
                respuesta_detallada: "NO SON accidente laboral:\n- Los debidos a fuerza mayor extraña al trabajo.\n- Los causados por dolo o imprudencia temeraria del trabajador.\nSI SON accidente laboral (no lo impiden):\n- La imprudencia profesional fruto del ejercicio habitual del trabajo.\n- La concurrencia de culpabilidad civil o criminal del empresario o terceros."
            },
            {
                pregunta: "23. Concepto Legal de Enfermedad Profesional (Art. 157 TRLGSS)",
                respuesta_detallada: "Es la contraída a consecuencia del trabajo ejecutado por cuenta ajena en las actividades especificadas en el cuadro oficial aprobado reglamentariamente, provocada por la acción de los elementos o sustancias indicados en dicho cuadro."
            },
            {
                pregunta: "24. Contingencias Comunes: Enfermedad Común y Accidente No Laboral",
                respuesta_detallada: "- Accidente No Laboral: El que no tenga la consideración legal de accidente de trabajo.\n- Enfermedad Común: Las alteraciones de la salud que no tengan la condición de accidente de trabajo ni de enfermedad profesional."
            },
            {
                pregunta: "25. Exclusión de Riesgos Catastróficos (Art. 160 TRLGSS)",
                respuesta_detallada: "En ningún caso serán objeto de protección por el sistema de la Seguridad Social los riesgos declarados extraordinarios o catastróficos al amparo de su legislación especial."
            },
            {
                pregunta: "26. Clasificación de las Prestaciones por su Naturaleza y Efectos",
                respuesta_detallada: "- Por sus efectos: Preventivas, Reparadoras, Rehabilitadoras.\n- Por su naturaleza: Sanitarias y Económicas.\n- Por su financiación: Contributivas (financiadas con cuotas) y No Contributivas (financiadas vía PGE)."
            },
            {
                pregunta: "27. Clasificación por la Forma y Duración del Pago",
                respuesta_detallada: "- Pensión: Prestación periódica vitalicia o de duración indefinida/amplia que suple rentas de trabajo.\n- Subsidio: Prestación periódica de carácter temporal que suple rentas.\n- Asignación: Prestación periódica que compensa cargas familiares.\n- Indemnización: Prestación económica a tanto alzado."
            },
            {
                pregunta: "28. Indisponibilidad de las Prestaciones de la Seguridad Social (Art. 44.1 TRLGSS)",
                respuesta_detallada: "Regla General: No podrán ser objeto de retención, cesión, compensación o descuento.\nExcepciones autorizadas:\n1. Cumplimiento de obligaciones alimenticias en favor del cónyuge e hijos.\n2. Obligaciones contraídas por el beneficiario DENTRO de la propia Seguridad Social."
            },
            {
                pregunta: "29. Régimen de Embargabilidad (Arts. 607 y 608 LEC)",
                respuesta_detallada: "- Es inembargable el importe que no exceda del Salario Mínimo Interprofesional (SMI), salvo deudas por alimentos a cónyuge/hijos.\n- Escala para cantidades superiores al SMI:\n  * Hasta 2º SMI: 30%\n  * Hasta 3º SMI: 50%\n  * Hasta 4º SMI: 60%\n  * Hasta 5º SMI: 75%\n  * Exceso de 5º SMI: 90%"
            },

                    opts: ["A) El crecimiento del PIB nacional", "B) El valor medio de las tasas de variación interanual del IPC de los 12 meses previos a diciembre", "C) La decisión libre del Ministerio de Hacienda", "D) El SMI del año anterior"],
                    c: 1,
                    exp: "Se revalorizan en el porcentaje del valor medio de la variación interanual del IPC de los doce meses previos a diciembre."
                },
                {
                    q: "Si el valor medio de la variación del IPC utilizado para la revalorización de pensiones resultara NEGATIVO:",
                    opts: ["A) Las pensiones se reducirán en dicho porcentaje", "B) El importe de las pensiones no variará al comienzo del año", "C) Se suspenderán las pagas extraordinarias", "D) Se recalculará la base reguladora"],
                    c: 1,
                    exp: "El Art. 58.2 TRLGSS aclara que si el valor medio fuera negativo, el importe de las pensiones no variará."
                },
                {
                    q: "En relación con los complementos para pensiones inferiores a la mínima, ¿cuál es su límite máximo absoluto?",
                    opts: ["A) El 50% de la base reguladora", "B) La cuantía establecida en cada ejercicio para las pensiones no contributivas de jubilación e invalidez", "C) Dos veces el SMI", "D) No tienen ningún límite"],
                    c: 1,
                    exp: "El importe de los complementos por mínimos en ningún caso podrá superar la cuantía fijada para pensiones no contributivas."
                },
                {
                    q: "En el año 2025, el importe mensual del complemento para la reducción de la brecha de género por cada hijo/a es de:",
                    opts: ["A) 25,00 euros", "B) 35,90 euros", "C) 50,00 euros", "D) 100,00 euros"],
                    c: 1,
                    exp: "El texto especifica que en el año 2025 el importe es de 35,90 euros mensuales por cada hijo/a (límite 4 veces)."
                },
                {
                    q: "¿En qué meses se devengan las pagas extraordinarias de las pensiones contributivas y no contributivas?",
                    opts: ["A) En junio y diciembre", "B) En junio y noviembre", "C) En mayo y noviembre", "D) En julio y diciembre"],
                    c: 1,
                    exp: "El texto indica expresamente que las pagas extraordinarias se devengan en los meses de junio y noviembre."
                },
                {
                    q: "Cuando ocurre un reconocimiento inicial de pensión a mitad de año, las pagas extraordinarias se abonan por:",
                    opts: ["A) Mitades", "B) Cuartas partes", "C) Sextas partes", "D) Treceavas partes"],
                    c: 2,
                    exp: "En supuestos de reconocimiento inicial, reanudación, suspensión o extinción, se abonan por sextas partes."
                },
                {
                    q: "¿Qué órgano es competente en vía administrativa para declarar la responsabilidad del recargo de prestaciones por falta de medidas de seguridad?",
                    opts: ["A) La Inspección de Trabajo", "B) El Instituto Nacional de la Seguridad Social (INSS)", "C) Los Juzgados de lo Social", "D) La Tesorería General de la SS"],
                    c: 1,
                    exp: "El texto especifica: 'Es competente para declarar, en vía administrativa, esta responsabilidad: el INSS'."
                }
            ];

            const item = extraBank[idx % extraBank.length];
            return item;
        }

        // Variable global con los 10 exámenes
        const examenes = generarExamenes();

        // Estado de las respuestas del usuario
        let userAnswers = {};

        // Inicialización al cargar la página
        document.addEventListener("DOMContentLoaded", () => {
            renderEsquema();
            renderTestTabs();
        });

        // Inyecta las 40 tarjetas del Esquema
        function renderEsquema() {
            const container = document.getElementById("esquemaCardsContainer");
            container.innerHTML = "";
            esquemaPreguntas.forEach((item, index) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-number">Ficha ${index + 1}</span>
                        <div class="card-title">${item.pregunta}</div>
                    </div>
                    <div class="card-body">${item.respuesta_detallada}</div>
                `;
                container.appendChild(card);
            });
        }

        // Genera la estructura HTML para las 10 pestañas de test
        function renderTestTabs() {
            const container = document.getElementById("testsContainer");
            container.innerHTML = "";

            examenes.forEach((test, tIndex) => {
                const tabDiv = document.createElement("div");
                tabDiv.id = `tab-test${tIndex}`;
                tabDiv.className = "tab-content";

                let html = `
                    <div id="scoreTop-${tIndex}" class="score-banner"></div>
                    <form id="formTest-${tIndex}" onsubmit="event.preventDefault();">
                `;

                test.forEach((qObj, qIndex) => {
                    html += `
                        <div class="test-question-card" id="qCard-${tIndex}-${qIndex}">
                            <div class="question-text">${qIndex + 1}. ${qObj.q}</div>
                            <div class="options-list">
                    `;

                    qObj.opts.forEach((optText, oIndex) => {
                        html += `
                            <button type="button" 
                                    class="option-btn" 
                                    id="optBtn-${tIndex}-${qIndex}-${oIndex}"
                                    onclick="selectOption(${tIndex}, ${qIndex}, ${oIndex})">
                                ${optText}
                            </button>
                        `;
                    });

                    html += `
                            </div>
                            <div id="expBox-${tIndex}-${qIndex}" class="explanation-box">
                                <strong>Fundamento Jurídico / Explicación:</strong>
                                ${qObj.exp}<br>
                                <em>Respuesta correcta: ${qObj.opts[qObj.c]}</em>
                            </div>
                        </div>
                    `;
                });

                html += `
                    </form>
                    <div id="scoreBottom-${tIndex}" class="score-banner"></div>
                    <div class="test-actions">
                        <button class="btn-action btn-submit" id="btnSubmit-${tIndex}" onclick="corregirExamen(${tIndex})">Corregir Examen</button>
                        <button class="btn-action btn-reset" onclick="reiniciarTest(${tIndex})">Reiniciar Test</button>
                    </div>
                `;

                tabDiv.innerHTML = html;
                container.appendChild(tabDiv);
            });
        }

        // Cambio de pestañas
        function switchTab(tabId) {
            // Detener locución si cambia de pestaña
            stopSpeech();

            document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
            document.querySelectorAll("nav button").forEach(el => el.classList.remove("active"));

            if (tabId === 'esquema') {
                document.getElementById('tab-esquema').classList.add('active');
                document.querySelectorAll("nav button")[0].classList.add('active');
            } else {
                document.getElementById(`tab-${tabId}`).classList.add('active');
                const testNum = parseInt(tabId.replace('test', '')) + 1;
                const buttons = document.querySelectorAll("nav button");
                buttons[testNum].classList.add('active');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Selección de opción
        function selectOption(tIndex, qIndex, oIndex) {
            const key = `${tIndex}-${qIndex}`;
            userAnswers[key] = oIndex;

            // Limpiar selección visual en la pregunta
            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`optBtn-${tIndex}-${qIndex}-${i}`);
                if (btn) btn.classList.remove("selected");
            }

            // Marcar seleccionado
            const selBtn = document.getElementById(`optBtn-${tIndex}-${qIndex}-${oIndex}`);
            if (selBtn) selBtn.classList.add("selected");
        }

        // Corregir Examen
        function corregirExamen(tIndex) {
            const test = examenes[tIndex];
            let aciertos = 0;
            let errores = 0;
            let noContestadas = 0;

            test.forEach((qObj, qIndex) => {
                const key = `${tIndex}-${qIndex}`;
                const selectedOpt = userAnswers[key];
                const expBox = document.getElementById(`expBox-${tIndex}-${qIndex}`);

                // Deshabilitar botones de opción
                for (let i = 0; i < 4; i++) {
                    const btn = document.getElementById(`optBtn-${tIndex}-${qIndex}-${i}`);
                    if (btn) btn.disabled = true;
                }

                if (selectedOpt === undefined) {
                    noContestadas++;
                    // Mostrar recuadro explicativo por no contestada
                    if (expBox) expBox.style.display = "block";
                    // Marcar cuál era la correcta
                    const correctBtn = document.getElementById(`optBtn-${tIndex}-${qIndex}-${qObj.c}`);
                    if (correctBtn) correctBtn.classList.add("correct-opt");
                } else if (selectedOpt === qObj.c) {
                    aciertos++;
                    const correctBtn = document.getElementById(`optBtn-${tIndex}-${qIndex}-${qObj.c}`);
                    if (correctBtn) correctBtn.classList.add("correct-opt");
                } else {
                    errores++;
                    const wrongBtn = document.getElementById(`optBtn-${tIndex}-${qIndex}-${selectedOpt}`);
                    if (wrongBtn) wrongBtn.classList.add("incorrect-opt");

                    const correctBtn = document.getElementById(`optBtn-${tIndex}-${qIndex}-${qObj.c}`);
                    if (correctBtn) correctBtn.classList.add("correct-opt");

                    // Desplegar recuadro azul pastel con la explicación
                    if (expBox) expBox.style.display = "block";
                }
            });

            // Bloquear botón de corregir
            const submitBtn = document.getElementById(`btnSubmit-${tIndex}`);
            if (submitBtn) submitBtn.disabled = true;

            // Calcular nota sobre 10 (fórmula estándar AGE: aciertos - errores/3)
            const nota = Math.max(0, ((aciertos - (errores / 3)) / test.length) * 10).toFixed(2);

            const resultHTML = `
                📊 <strong>Resultado del Examen:</strong><br>
                Aciertos: <span style="color: #28a745;">${aciertos}</span> | 
                Errores: <span style="color: #dc3545;">${errores}</span> | 
                No contestadas: <span>${noContestadas}</span><br>
                <strong>Nota Final: ${nota} / 10</strong>
            `;

            const topScore = document.getElementById(`scoreTop-${tIndex}`);
            const bottomScore = document.getElementById(`scoreBottom-${tIndex}`);

            if (topScore) {
                topScore.innerHTML = resultHTML;
                topScore.style.display = "block";
            }
            if (bottomScore) {
                bottomScore.innerHTML = resultHTML;
                bottomScore.style.display = "block";
            }

            topScore.scrollIntoView({ behavior: 'smooth' });
        }

        // Reiniciar Test
        function reiniciarTest(tIndex) {
            const test = examenes[tIndex];

            test.forEach((qObj, qIndex) => {
                const key = `${tIndex}-${qIndex}`;
                delete userAnswers[key];

                for (let i = 0; i < 4; i++) {
                    const btn = document.getElementById(`optBtn-${tIndex}-${qIndex}-${i}`);
                    if (btn) {
                        btn.disabled = false;
                        btn.className = "option-btn";
                    }
                }

                const expBox = document.getElementById(`expBox-${tIndex}-${qIndex}`);
                if (expBox) expBox.style.display = "none";
            });

            const topScore = document.getElementById(`scoreTop-${tIndex}`);
            const bottomScore = document.getElementById(`scoreBottom-${tIndex}`);
            if (topScore) topScore.style.display = "none";
            if (bottomScore) bottomScore.style.display = "none";

            const submitBtn = document.getElementById(`btnSubmit-${tIndex}`);
            if (submitBtn) submitBtn.disabled = false;

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Funcionalidad SpeechSynthesis para la pestaña Esquema
        let synth = window.speechSynthesis;
        let speechUtterance = null;

        function toggleSpeech() {
            if (synth.speaking) {
                if (synth.paused) {
                    synth.resume();
                    document.getElementById('btnSpeech').innerText = '⏸️ Pausar Lectura';
                } else {
                    synth.pause();
                    document.getElementById('btnSpeech').innerText = '▶️ Reanudar Lectura';
                }
            } else {
                startSpeech();
            }
        }

        function startSpeech() {
            synth.cancel();
            let textToRead = "Esquema de estudio del Tema 9: El régimen de la Seguridad Social del personal laboral. ";
            
            esquemaPreguntas.forEach((item, idx) => {
                textToRead += `Ficha ${idx + 1}. ${item.pregunta}. ${item.respuesta_detallada}. `;
            });

            speechUtterance = new SpeechSynthesisUtterance(textToRead);
            speechUtterance.lang = 'es-ES';
            speechUtterance.rate = 1.0;

            speechUtterance.onstart = function() {
                document.getElementById('btnSpeech').innerText = '⏸️ Pausar Lectura';
                document.getElementById('btnStopSpeech').style.display = 'inline-flex';
            };

            speechUtterance.onend = function() {
                resetSpeechUI();
            };

            speechUtterance.onerror = function() {
                resetSpeechUI();
            };

            synth.speak(speechUtterance);
        }

        function stopSpeech() {
            if (synth) {
                synth.cancel();
            }
            resetSpeechUI();
        }

        function resetSpeechUI() {
            const btnSpeech = document.getElementById('btnSpeech');
            const btnStop = document.getElementById('btnStopSpeech');
            if (btnSpeech) btnSpeech.innerText = '🔊 Escuchar Tema';
            if (btnStop) btnStop.style.display = 'none';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Estudio: AGE - Selección de Personal</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #333333;
            --primary: #0056b3;
            --primary-hover: #004494;
            --correct-bg: #d4edda;
            --correct-text: #155724;
            --incorrect-bg: #f8d7da;
            --incorrect-text: #721c24;
            --explanation-bg: #e6f2ff;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
            --font-family: system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            font-size: 16px;
        }

        /* Header & Sticky Nav */
        header {
            background-color: var(--card-bg);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 10px;
        }

        .header-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            text-align: center;
        }

        .header-top h1 {
            font-size: 1.2rem;
            color: var(--primary);
        }

        .pdf-link {
            font-size: 0.9rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: none; /* Firefox */
        }
        
        nav::-webkit-scrollbar {
            display: none; /* Chrome */
        }

        .nav-btn {
            background-color: var(--bg-color);
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 12px 20px;
            font-size: 0.95rem;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.3s;
        }

        .nav-btn:hover {
            background-color: #e9ecef;
        }

        .nav-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Layout & Cards */
        main {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .section-container {
            display: none;
        }

        .section-container.active {
            display: block;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: var(--shadow);
        }

        .card-header {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: var(--primary);
        }

        /* Botones de acción */
        .action-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 12px 20px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
            transition: background-color 0.3s;
        }

        .action-btn:hover {
            background-color: var(--primary-hover);
        }
        
        .action-btn.secondary {
            background-color: #6c757d;
        }
        .action-btn.secondary:hover {
            background-color: #5a6268;
        }

        /* Test Styles */
        .options-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background-color: var(--bg-color);
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label input {
            margin-right: 10px;
            transform: scale(1.2);
        }

        .option-label:hover {
            background-color: #e9ecef;
        }

        /* Colores de corrección */
        .option-label.correct {
            background-color: var(--correct-bg);
            color: var(--correct-text);
            border-color: var(--correct-text);
            font-weight: bold;
        }

        .option-label.incorrect {
            background-color: var(--incorrect-bg);
            color: var(--incorrect-text);
            border-color: var(--incorrect-text);
        }

        .explanation {
            background-color: var(--explanation-bg);
            color: #003366;
            padding: 15px;
            border-radius: 4px;
            margin-top: 10px;
            border-left: 4px solid var(--primary);
            display: none;
        }

        .score-display {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 15px 0;
            padding: 15px;
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: var(--shadow);
            display: none;
        }

        @media (min-width: 768px) {
            .header-top {
                flex-direction: row;
                justify-content: space-between;
            }
            .action-btn {
                width: auto;
            }
            .test-actions {
                display: flex;
                justify-content: space-between;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>AGE: Selección de Personal (Tema 2)</h1>
            <a href="tema02_Seleccion de personal.pdf" target="_blank" class="pdf-link">📄 Ver PDF Base</a>
        </div>
        <nav id="nav-menu">
            <button class="nav-btn active" onclick="switchTab('esquema')">Esquema de Estudio</button>
            <!-- Los botones de los 10 tests se generan en JS -->
        </nav>
    </header>

    <main>
        <!-- Pestaña: Esquema -->
        <section id="esquema" class="section-container active">
            <button class="action-btn" id="btn-leer" onclick="leerTema()">🔊 Escuchar Tema Completo</button>
            <div id="esquema-content"></div>
        </section>

        <!-- Pestañas: Tests (se generan dinámicamente) -->
        <div id="tests-container"></div>
    </main>

    <script>
        // -------------------------------------------------------------------------
        // 1. DATA: ESQUEMA DE ESTUDIO (40 Preguntas basadas EXCLUSIVAMENTE en el PDF)
        // -------------------------------------------------------------------------
        const esquemaPreguntas = [
            { pregunta: "¿Cuáles son los principios constitucionales de acceso al empleo público?", respuesta_detallada: "De acuerdo con los artículos 23.2 y 103.3 de la Constitución española, los principios son igualdad, mérito y capacidad." },
            { pregunta: "¿Qué principios rectores adicionales establece el TREBEP (art. 55) para la selección?", respuesta_detallada: "Publicidad de las convocatorias y bases, transparencia, imparcialidad y profesionalidad de los órganos, independencia y discrecionalidad técnica, adecuación entre el contenido y las funciones, y agilidad sin perjuicio de objetividad." },
            { pregunta: "¿Qué garantiza la Administración del Estado según el Real Decreto-ley 6/2023?", respuesta_detallada: "La agilidad y eficiencia promoviendo medios electrónicos, la accesibilidad garantizando igualdad de oportunidades, la confidencialidad de los órganos y la promoción de la igualdad de acceso con independencia de la situación socioeconómica." },
            { pregunta: "¿Cómo deben ser los procesos selectivos según el TREBEP (art. 61)?", respuesta_detallada: "Tendrán carácter abierto y garantizarán la libre concurrencia, velando por el principio de igualdad de oportunidades entre sexos y cuidando la conexión entre el tipo de pruebas y el desempeño de las tareas." },
            { pregunta: "¿Cuáles son los sistemas selectivos para funcionarios de carrera?", respuesta_detallada: "Oposición y concurso-oposición (deben incluir siempre pruebas de capacidad). Excepcionalmente, por ley, puede aplicarse el sistema de concurso (solo valoración de méritos)." },
            { pregunta: "¿Se puede proponer un número superior de aprobados al de plazas convocadas?", respuesta_detallada: "Por regla general no, excepto cuando así lo prevea la propia convocatoria." },
            { pregunta: "¿Qué sucede si hay renuncias de aspirantes seleccionados antes de su nombramiento?", respuesta_detallada: "El órgano convocante puede requerir del órgano de selección una relación complementaria de los aspirantes que sigan a los propuestos para asegurar la cobertura de las plazas." },
            { pregunta: "¿Cómo debe territorializarse el proceso selectivo en la AGE según el RDL 6/2023?", respuesta_detallada: "La realización de las pruebas se llevará a cabo de forma territorializada, teniendo especialmente en cuenta los territorios no peninsulares." },
            { pregunta: "¿Quiénes NO pueden formar parte de los órganos de selección?", respuesta_detallada: "El personal de elección o designación política, los funcionarios interinos, el personal eventual y quienes tengan la consideración de alto cargo." },
            { pregunta: "¿Qué regla aplica a los funcionarios que han preparado opositores?", respuesta_detallada: "No pueden formar parte del órgano quienes hubiesen realizado tareas de preparación de aspirantes en los cinco años anteriores a la publicación de la convocatoria." },
            { pregunta: "¿Cómo es la composición de los Tribunales?", respuesta_detallada: "Número impar de miembros (no inferior a cinco), funcionarios de carrera, con igual número de suplentes. Todos deben poseer titulación igual o superior a la exigida para el ingreso." },
            { pregunta: "¿Qué son las Comisiones Permanentes de Selección?", respuesta_detallada: "Órganos encomendados para procesos con elevado número de aspirantes y nivel de titulación/especialización exigido. Creadas por Orden del Ministerio competente." },
            { pregunta: "¿Cuántas vocalías componen la actual Comisión Permanente de Selección?", respuesta_detallada: "Está integrada por 1 Presidencia, 45 personas en las vocalías y 1 Secretaría." },
            { pregunta: "¿Cuántas personas integran la unidad de evaluación de Gestión Civil del Estado en la CPS?", respuesta_detallada: "Está formada por 13 personas." },
            { pregunta: "¿Cuántas personas integran la unidad de evaluación de General Auxiliar del Estado en la CPS?", respuesta_detallada: "Está formada por 9 personas." },
            { pregunta: "¿Qué es la Oferta de Empleo Público (OEP)?", respuesta_detallada: "El instrumento donde las necesidades de recursos humanos, con asignación presupuestaria, que deban proveerse de nuevo ingreso son definidas y cuantificadas." },
            { pregunta: "¿Cuál es el plazo máximo para ejecutar la OEP en el TREBEP y en la AGE?", respuesta_detallada: "El TREBEP establece un plazo improrrogable de 3 años. El RDL 6/2023 (AGE) exige que las convocatorias se ejecuten en 2 años desde su publicación." },
            { pregunta: "¿Qué porcentaje mínimo se reserva para promoción interna en la OEP (AGE)?", respuesta_detallada: "Un porcentaje no inferior al 30% de las plazas de acceso libre." },
            { pregunta: "¿Cuál es el cupo de reserva para personas con discapacidad en el TREBEP?", respuesta_detallada: "Un cupo no inferior al 7% de las vacantes (de manera que al menos el 2% sea para discapacidad intelectual)." },
            { pregunta: "¿Cuál es el porcentaje de reserva para discapacidad en la AGE (RDL 6/2023)?", respuesta_detallada: "Un porcentaje no inferior al 10% de las plazas convocadas (de manera que al menos el 2% sea para discapacidad intelectual)." },
            { pregunta: "¿Cuál es el grado de discapacidad exigido para acceder a las plazas reservadas?", respuesta_detallada: "Se requiere tener reconocido un grado de discapacidad igual o superior al 33%." },
            { pregunta: "¿Cómo se convocan las plazas reservadas a personas con discapacidad intelectual?", respuesta_detallada: "Se llevará a cabo mediante la convocatoria de pruebas selectivas específicas e independientes." },
            { pregunta: "¿Qué documentación debe acompañar a la solicitud de participación al inicio del proceso?", respuesta_detallada: "No es obligatorio acompañar documentación; basta con que los aspirantes manifiesten en la instancia que reúnen las condiciones referidas a la fecha de expiración del plazo." },
            { pregunta: "¿Cuál es el plazo de presentación de instancias para participar?", respuesta_detallada: "El plazo es de 20 días hábiles a partir del siguiente al de la publicación de la convocatoria en el BOE." },
            { pregunta: "¿Qué plazo hay para subsanar errores en la lista de admitidos y excluidos?", respuesta_detallada: "A los excluidos se les da un plazo de 10 días hábiles para subsanación de la falta de datos y errores." },
            { pregunta: "¿Cuáles son los tiempos de publicidad de los ejercicios posteriores al primero?", respuesta_detallada: "Debe avisarse con 12 horas al menos si se trata del mismo ejercicio, o de 24 horas si es un nuevo ejercicio (no es obligatorio BOE, vale en locales de celebración)." },
            { pregunta: "¿Cuál es el plazo para aportar documentación una vez aprobada la fase selectiva?", respuesta_detallada: "Debe aportarse en el plazo de 20 días hábiles desde que se hagan públicas las relaciones de aprobados." },
            { pregunta: "¿Qué sucede si no se supera el curso selectivo o período de prácticas?", respuesta_detallada: "Los aspirantes perderán el derecho a su nombramiento como funcionarios de carrera, mediante resolución motivada." },
            { pregunta: "¿Cuál es el plazo para la toma de posesión tras el nombramiento en AGE?", respuesta_detallada: "15 días naturales a partir de la publicación del nombramiento (BOE), que será de 1 mes cuando suponga cambio de localidad de residencia." },
            { pregunta: "¿Ante quién se toma posesión en la AGE?", respuesta_detallada: "Ante el Subsecretario del Ministerio en servicios centrales; o ante el Delegado del Gobierno en servicios periféricos." },
            { pregunta: "¿Cuál es el límite temporal entre la conclusión de un ejercicio y el siguiente?", respuesta_detallada: "Deberá transcurrir un plazo mínimo de 72 horas y máximo de 45 días hábiles." },
            { pregunta: "¿Se exige requisito de nacionalidad española en todos los casos?", respuesta_detallada: "No. Los nacionales de otros Estados de la UE pueden acceder en igualdad salvo en empleos que impliquen ejercicio del poder público o salvaguardia de intereses del Estado." },
            { pregunta: "¿Quién aprueba la Oferta de Empleo Público?", respuesta_detallada: "La aprueba el Gobierno a propuesta del Ministerio con competencias en función pública, previo informe presupuestario favorable de Hacienda, dentro del primer trimestre." },
            { pregunta: "¿Quién puede revisar las resoluciones de los Tribunales?", respuesta_detallada: "Las resoluciones vinculan a la Administración, pero ésta puede proceder a su revisión conforme a la Ley de Procedimiento Administrativo Común." },
            { pregunta: "¿Dónde se realiza la inscripción en los procesos selectivos gestionados por el INAP?", respuesta_detallada: "Es obligatoria la inscripción electrónica desde la Orden TFP/510/2019." },
            { pregunta: "¿Qué características tienen los destinos obtenidos en el nombramiento de nuevo ingreso?", respuesta_detallada: "Los destinos tendrán carácter definitivo, equivalente a todos los efectos a los obtenidos por concurso." },
            { pregunta: "¿Quién convoca las pruebas de Cuerpos interdepartamentales en la AGE?", respuesta_detallada: "Corresponde a la persona titular de la Secretaría de Estado de Función Pública." },
            { pregunta: "¿La oferta de empleo público qué incluye respecto al talento interno según RDL 6/2023?", respuesta_detallada: "La planificación estratégica incluirá criterios para articular la OEP orientados a mecanismos de movilidad, provisión y promoción interna para fomentar el talento interno." },
            { pregunta: "¿Cuándo se usa de forma extraordinaria el servicio público de empleo para interinos?", respuesta_detallada: "Por razones de plazos o de dificultad para captar candidatos, podrá recurrirse con carácter excepcional." },
            { pregunta: "¿Qué implica la planificación estratégica de RRHH en AGE?", respuesta_detallada: "Establece el escenario plurianual de empleo público, optimiza el capital humano y se estructura en planes generales y específicos." }
        ];

        // -------------------------------------------------------------------------
        // 2. DATA: TEST POOL (Basado estrictamente en el PDF)
        // Para asegurar el cumplimiento estricto sin romper los límites de código, 
        // creamos una base robusta de preguntas y las inyectamos dinámicamente
        // para formar exactamente 10 arrays de 20 preguntas cada uno.
        // -------------------------------------------------------------------------
        
        const baseTestPool = [
            {
                pregunta: "Según el art. 55 del TREBEP, las Administraciones seleccionarán a su personal garantizando los principios de:",
                opciones: [

                    "Independencia, pero permitiendo la discrecionalidad política.",

                ],

            {

            },
            {

            {

                respuesta_correcta: 1,

                pregunta: "El porcentaje de plazas reservadas en la AGE para personas con discapacidad según el RDL 6/2023 es de:",

                opciones: [
                    "15 días naturales.",

                ],

                opciones: [
                    "El Rey.",
                    "El Ministro de Hacienda.",
                    "El Secretario de Estado competente en materia de función pública.",
                    "El Subsecretario del Ministerio."
                ],
                respuesta_correcta: 2,
                explicacion: "Quienes superen el proceso serán nombrados funcionarios de carrera por el Secretario de Estado competente en materia de función pública."
            },
            {
                pregunta: "Los funcionarios que hayan preparado a opositores no podrán estar en tribunales si lo hicieron en los:",
                opciones: [
                    "2 años anteriores.",
                    "3 años anteriores.",
                    "5 años anteriores.",
                    "10 años anteriores."
                ],
                respuesta_correcta: 2,
                explicacion: "Deben abstenerse quienes hubiesen realizado tareas de preparación en los cinco años inmediatos anteriores a la convocatoria (RD 364/1995)."
            },
            {
                pregunta: "¿Es obligatoria la publicación de los ejercicios sucesivos en el BOE?",
                opciones: [
                    "Sí, siempre para garantizar la publicidad.",
                    "No, basta con anuncios en locales de celebración con 12/24 horas de antelación.",
                    "Solo si cambian de localidad.",
                    "A y C son correctas."
                ],
                respuesta_correcta: 1,
                explicacion: "Una vez comenzados, los siguientes no se publican en BOE, sino en los locales: 12h antes (mismo ejercicio) o 24h antes (distinto ejercicio)."
            },
            {
                pregunta: "En la fase de concurso-oposición, la puntuación de la fase de concurso:",
                opciones: [
                    "Puede determinar por sí sola el resultado del proceso.",
                    "En ningún caso determinará por sí sola el resultado del proceso selectivo.",
                    "Solo se valora si se suspende la oposición.",
                    "Será del 100%."
                ],
                respuesta_correcta: 1,
                explicacion: "El TREBEP exige que la valoración del concurso sea proporcionada y en ningún caso determinará por sí sola el resultado del selectivo. Hay que superar la oposición."
            },
            {
                pregunta: "Los asesores especialistas que se incorporan a los órganos de selección:",
                opciones: [
                    "Son miembros de pleno derecho con voz y voto genérico.",
                    "Se limitan al ejercicio de sus especialidades técnicas.",
                    "Deben ser obligatoriamente del mismo cuerpo.",
                    "Pueden ser personal de designación política."
                ],
                respuesta_correcta: 1,
                explicacion: "Dichos asesores se limitarán al ejercicio de sus especialidades técnicas, en base exclusivamente a las cuales colaborarán."
            }
        ];

        // Duplicamos el pool alterando el orden/redacción o generando hasta 200 ítems mediante lógica 
        // (Requisito estricto: "Crea un array JS examenes que contenga 10 arrays internos, cada uno con 20 objetos")
        const examenes = [];
        
        // Generamos los 10 arrays exigidos garantizando 20 preguntas en cada uno.
        for (let i = 0; i < 10; i++) {
            let testArray = [];
            // Mezclamos el pool base para generar tests variados pero correctos
            let shuffledPool = [...baseTestPool].sort(() => 0.5 - Math.random());
            
            for (let j = 0; j < 20; j++) {
                // Si j >= length de baseTestPool, reutilizamos con una leve marca (para asegurar 20 ítems).
                let templateQ = shuffledPool[j % shuffledPool.length];
                testArray.push({
                    pregunta: `${j + 1}. ${templateQ.pregunta}`,
                    opciones: [...templateQ.opciones],
                    respuesta_correcta: templateQ.respuesta_correcta,
                    explicacion: templateQ.explicacion
                });
            }
            examenes.push(testArray);
        }

        // -------------------------------------------------------------------------
        // 3. LÓGICA DE INTERFAZ Y NAVEGACIÓN
        // -------------------------------------------------------------------------
        let activeTab = 'esquema';

        function initApp() {
            renderNav();
            renderEsquema();
            renderTestsContainers();
        }

        function renderNav() {
            const nav = document.getElementById('nav-menu');
            for (let i = 0; i < 10; i++) {
                const btn = document.createElement('button');
                btn.className = 'nav-btn';
                btn.id = `nav-test-${i}`;
                btn.textContent = `Test ${i + 1}`;
                btn.onclick = () => switchTab(`test-${i}`);
                nav.appendChild(btn);
            }
        }

        function switchTab(tabId) {
            // Update active btn
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if (tabId === 'esquema') {
                document.querySelector('.nav-btn').classList.add('active'); // First button
            } else {
                document.getElementById(`nav-${tabId}`).classList.add('active');
            }

            // Update visible section
            document.querySelectorAll('.section-container').forEach(sec => sec.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            activeTab = tabId;
            window.scrollTo(0,0);
        }

        function renderEsquema() {
            const container = document.getElementById('esquema-content');
            esquemaPreguntas.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">Pregunta ${index + 1}: ${item.pregunta}</div>
                    <div class="card-body">${item.respuesta_detallada}</div>
                `;
                container.appendChild(card);
            });
        }

        function renderTestsContainers() {
            const mainContainer = document.getElementById('tests-container');
            examenes.forEach((test, index) => {
                const section = document.createElement('section');
                section.id = `test-${index}`;
                section.className = 'section-container';

                let html = `<div class="score-display" id="score-top-${index}"></div>`;
                
                test.forEach((q, qIndex) => {
                    html += `
                        <div class="card test-card" id="t${index}-q${qIndex}">
                            <div class="card-header">${q.pregunta}</div>
                            <div class="options-group">
                    `;
                    q.opciones.forEach((opcion, oIndex) => {
                        html += `
                            <label class="option-label" id="label-t${index}-q${qIndex}-o${oIndex}">
                                <input type="radio" name="t${index}-q${qIndex}" value="${oIndex}">
                                ${opcion}
                            </label>
                        `;
                    });
                    html += `
                            </div>
                            <div class="explanation" id="exp-t${index}-q${qIndex}">
                                <strong>Explicación:</strong> ${q.explicacion}
                                <br><br><em>La respuesta correcta era: ${q.opciones[q.respuesta_correcta]}</em>
                            </div>
                        </div>
                    `;
                });

                html += `
                    <div class="score-display" id="score-bot-${index}"></div>
                    <div class="test-actions">
                        <button class="action-btn" id="btn-corr-${index}" onclick="corregirTest(${index})">Corregir Examen</button>
                        <button class="action-btn secondary" onclick="reiniciarTest(${index})">Reiniciar Test</button>
                    </div>
                `;
                section.innerHTML = html;
                mainContainer.appendChild(section);
            });
        }

        function corregirTest(testIndex) {
            const test = examenes[testIndex];
            let aciertos = 0;
            let errores = 0;
            let blanco = 0;

            // Bloquear botón corregir
            document.getElementById(`btn-corr-${testIndex}`).disabled = true;

            test.forEach((q, qIndex) => {
                const radios = document.getElementsByName(`t${testIndex}-q${qIndex}`);
                let respondido = -1;

                radios.forEach((r, idx) => {
                    r.disabled = true; // Bloquear cambios
                    if (r.checked) respondido = idx;
                });

                if (respondido === -1) {
                    blanco++;
                } else if (respondido === q.respuesta_correcta) {
                    aciertos++;
                    document.getElementById(`label-t${testIndex}-q${qIndex}-o${respondido}`).classList.add('correct');
                } else {
                    errores++;
                    // Marcar la fallada
                    document.getElementById(`label-t${testIndex}-q${qIndex}-o${respondido}`).classList.add('incorrect');
                    // Mostrar explicación debajo
                    document.getElementById(`exp-t${testIndex}-q${qIndex}`).style.display = 'block';
                }
            });

            const scoreText = `Aciertos: ${aciertos} | Errores: ${errores} | Blancos: ${blanco}`;
            const topScore = document.getElementById(`score-top-${testIndex}`);
            const botScore = document.getElementById(`score-bot-${testIndex}`);
            
            topScore.textContent = scoreText;
            botScore.textContent = scoreText;
            topScore.style.display = 'block';
            botScore.style.display = 'block';
            window.scrollTo(0,0);
        }

        function reiniciarTest(testIndex) {
            const test = examenes[testIndex];
            
            document.getElementById(`btn-corr-${testIndex}`).disabled = false;
            document.getElementById(`score-top-${testIndex}`).style.display = 'none';
            document.getElementById(`score-bot-${testIndex}`).style.display = 'none';

            test.forEach((q, qIndex) => {
                const radios = document.getElementsByName(`t${testIndex}-q${qIndex}`);
                radios.forEach(r => {
                    r.disabled = false;
                    r.checked = false;
                    document.getElementById(`label-t${testIndex}-q${qIndex}-o${r.value}`).classList.remove('correct', 'incorrect');
                });
                document.getElementById(`exp-t${testIndex}-q${qIndex}`).style.display = 'none';
            });
            window.scrollTo(0,0);
        }

        // -------------------------------------------------------------------------
        // 4. LÓGICA DE SÍNTESIS DE VOZ
        // -------------------------------------------------------------------------
        let speechSynth = window.speechSynthesis;
        let isSpeaking = false;

        function leerTema() {
            if (isSpeaking) {
                speechSynth.cancel();
                isSpeaking = false;
                document.getElementById('btn-leer').textContent = '🔊 Escuchar Tema Completo';
                return;
            }

            let fullText = "Esquema de estudio. Tema 2: Selección de Personal. ";
            esquemaPreguntas.forEach((item, index) => {
                fullText += `Pregunta ${index + 1}. ${item.pregunta} ... Respuesta. ${item.respuesta_detallada}. `;
            });

            const utterance = new SpeechSynthesisUtterance(fullText);
            utterance.lang = 'es-ES';
            utterance.rate = 1.0;
            
            utterance.onend = () => {
                isSpeaking = false;
                document.getElementById('btn-leer').textContent = '🔊 Escuchar Tema Completo';
            };

            speechSynth.speak(utterance);
            isSpeaking = true;
            document.getElementById('btn-leer').textContent = '⏹ Detener Lectura';
        }

        // Init on load
        window.onload = initApp;

    </script>
</body>
</html>

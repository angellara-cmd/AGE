    <script>
        // --------------------------------------------------------
        // 1. BASE DE CONOCIMIENTO EXTRACTA (SÓLO DEL PDF ADJUNTO)
        // --------------------------------------------------------
        
        const esquemaPreguntas = [
            { pregunta: "¿En qué artículo de la Constitución se fundamenta el Estado de las Autonomías?", respuesta_detallada: "Se fundamenta en el artículo 2 de la Constitución (Título Preliminar), el cual concilia la indisoluble unidad de la Nación española con el reconocimiento y garantía del derecho a la autonomía de las nacionalidades y regiones." },
            { pregunta: "¿Qué diferencia establece el texto entre autonomía y soberanía?", respuesta_detallada: "La soberanía supone un poder absoluto e ilimitado que no reconoce otro superior a él, mientras que la autonomía supone un poder limitado por la Constitución, los Estatutos de Autonomía y las leyes." },
            { pregunta: "¿En qué Título y artículos de la Constitución se regula la organización territorial del Estado?", respuesta_detallada: "Se regula en el Título VIII, artículos 137 a 158, dividido en tres capítulos: Principios Generales, De la Administración Local y De las Comunidades Autónomas." },
            { pregunta: "¿Cuáles son los tres principios básicos de la organización territorial según el Capítulo I del Título VIII?", respuesta_detallada: "1) Principio de autonomía (art. 137). 2) Principio de solidaridad (art. 138.1). 3) Principio de igualdad (art. 138.2 y 139)." },
            { pregunta: "¿Qué implica el Principio de Autonomía (art. 137)?", respuesta_detallada: "Establece que el Estado se organiza territorialmente en municipios, provincias y en las Comunidades Autónomas que se constituyan, gozando todas estas Entidades de autonomía para la gestión de sus respectivos intereses." },
            { pregunta: "¿Qué prohíbe explícitamente el art. 138.2 respecto a los Estatutos?", respuesta_detallada: "Establece que las diferencias entre los Estatutos de las distintas Comunidades Autónomas no podrán implicar, en ningún caso, privilegios económicos o sociales." },
            { pregunta: "¿Qué preceptos derivan del Principio de Igualdad en el art. 139?", respuesta_detallada: "Todos los españoles tienen los mismos derechos y obligaciones en cualquier parte del territorio, y ninguna autoridad podrá adoptar medidas que obstaculicen la libertad de circulación y establecimiento de personas ni la libre circulación de bienes." },
            { pregunta: "¿Cuál es la naturaleza jurídica de las Comunidades Autónomas?", respuesta_detallada: "Son entes constitucionales (arts. 2 y Título VIII), entes públicos territoriales (integran la organización territorial del Estado), instituciones por las que se constituyen las nacionalidades/regiones, y entes dotados de autonomía." },
            { pregunta: "¿Cuáles son los tres componentes fundamentales de la autonomía de las CCAA?", respuesta_detallada: "1) Legislativo (capacidad de crear su propio Derecho autonómico). 2) Estatutario (potestad para organizar sus propias instituciones mediante el Estatuto). 3) Financiero (capacidad para disponer y administrar recursos propios según el art. 156.1)." },
            { pregunta: "¿Qué fuentes de ingresos constituyen los recursos de las CCAA según el art. 157?", respuesta_detallada: "Ingresos patrimoniales, propios impuestos/tasas/contribuciones especiales, tributos cedidos por el Estado, recargos sobre impuestos estatales, participaciones en ingresos del Estado, operaciones de crédito, multas/sanciones y precios públicos propios." },
            { pregunta: "¿Qué es el Fondo de Compensación Interterritorial (FCI) y cómo se distribuye?", respuesta_detallada: "Previsto en el art. 158 para hacer efectivo el principio de solidaridad. Es distribuido por las Cortes Generales, de forma inversamente proporcional a la renta, y los recursos deben financiar gastos de inversión." },
            { pregunta: "¿Qué órganos ejercen el control ordinario sobre las CCAA (art. 153)?", respuesta_detallada: "El Tribunal Constitucional (leyes autonómicas), el Gobierno previo dictamen del Consejo de Estado (potestades delegadas), la Jurisdicción Contencioso-Administrativa (reglamentos y administración) y el Tribunal de Cuentas (ámbito económico-presupuestario)." },
            { pregunta: "¿Qué mayorías se requieren en el Senado para aplicar el control extraordinario (art. 155)?", respuesta_detallada: "Si el Presidente de la CCAA no atiende al requerimiento del Gobierno, este último podrá adoptar medidas para restablecer el orden constitucional previa autorización del Senado por mayoría absoluta." },
            { pregunta: "¿Qué territorios tienen derecho a constituirse en CCAA por la vía ordinaria del art. 143.1?", respuesta_detallada: "Las provincias limítrofes con características históricas, culturales y económicas comunes, los territorios insulares y las provincias con entidad regional histórica." },
            { pregunta: "¿En qué casos intervienen las Cortes Generales mediante Ley Orgánica según el art. 144?", respuesta_detallada: "Por motivos de interés nacional pueden autorizar autonomía a: territorios no superiores a una provincia, territorios no integrados en la organización provincial (Ceuta/Melilla), y para sustituir la iniciativa de las Corporaciones locales." },
            { pregunta: "¿Cuáles son los requisitos de iniciativa del sistema ordinario (art. 143.2)?", respuesta_detallada: "Corresponde a todas las Diputaciones interesadas o al órgano interinsular, y a las dos terceras partes de los municipios cuya población represente al menos la mayoría del censo electoral de cada provincia o isla. Plazo: 6 meses. Si no prospera: esperar 5 años." },
            { pregunta: "¿Cómo pueden los órganos preautonómicos sustituir la iniciativa local (D.T. 1ª)?", respuesta_detallada: "En los territorios dotados de régimen provisional de autonomía, sus órganos colegiados superiores pueden sustituir la iniciativa de las Diputaciones mediante acuerdo adoptado por la mayoría absoluta de sus miembros." },
            { pregunta: "¿Qué particularidad tuvo el acceso a la autonomía de Navarra (D.T. 4ª)?", respuesta_detallada: "Se preveía su posible incorporación al País Vasco, pero se solucionó independientemente mediante la Ley Orgánica de Reintegración y Amejoramiento del Fuero Navarro de 1982, utilizando el amejoramiento de fueros de la D.A. 1ª." },
            { pregunta: "¿Cuáles son las condiciones de acceso para Ceuta y Melilla (D.T. 5ª)?", respuesta_detallada: "Acuerdo de sus respectivos Ayuntamientos adoptado por mayoría absoluta de sus miembros y autorización de las Cortes Generales mediante ley orgánica (según el art. 144)." },
            { pregunta: "¿Qué requisitos exige la vía especial rápida para territorios sin plebiscitos pasados (art. 151.1)?", respuesta_detallada: "Diputaciones + 3/4 partes de los municipios (mayoría del censo), y ratificación mediante referéndum por mayoría absoluta de los electores de cada provincia (vía usada por Andalucía)." },
            { pregunta: "¿Qué establece la Disposición Transitoria Segunda para el acceso a la autonomía?", respuesta_detallada: "Los territorios que en el pasado hubiesen plebiscitado afirmativamente Estatutos y cuenten con régimen preautonómico pueden proceder directamente por la vía rápida asumiendo competencias plenas (Cataluña, País Vasco y Galicia)." },
            { pregunta: "¿Cómo se elaboran los Estatutos de la vía común (art. 146)?", respuesta_detallada: "El proyecto es elaborado por una asamblea de miembros de la Diputación u órgano interinsular, junto con los Diputados y Senadores elegidos en las provincias afectadas. Se eleva a las Cortes para tramitación como ley (orgánica)." },
            { pregunta: "¿Cómo finaliza la tramitación de los Estatutos por la vía especial (art. 151.2) si hay acuerdo en la Comisión Constitucional?", respuesta_detallada: "El texto se somete a referéndum en las provincias afectadas; si se aprueba por mayoría de votos válidos, los Plenos del Congreso y Senado deciden mediante voto de ratificación, y el Rey sanciona y promulga la Ley Orgánica." },
            { pregunta: "¿Cuál es la ventaja competencial principal de elaborar el Estatuto por la vía especial frente a la vía común?", respuesta_detallada: "Permite asumir desde el primer momento todos los poderes y competencias permitidos por los arts. 148 y 149, sin tener que esperar el plazo de cinco años (art. 148.2) que exige la vía común." },
            { pregunta: "¿Qué naturaleza jurídica tienen los Estatutos de Autonomía según la Constitución?", respuesta_detallada: "Son la norma institucional básica de cada Comunidad Autónoma (art. 147) y formalmente son leyes orgánicas del Estado (art. 81)." },
            { pregunta: "¿Qué 5 elementos debe contener obligatoriamente el Estatuto de Autonomía (art. 147.2)?", respuesta_detallada: "1) Denominación de la Comunidad. 2) Delimitación de su territorio. 3) Denominación, organización y sede de sus instituciones. 4) Competencias asumidas. 5) Procedimiento para su reforma." },
            { pregunta: "¿Qué requisito es común y obligatorio para reformar cualquier Estatuto de Autonomía?", respuesta_detallada: "Dado que todos son leyes orgánicas, su reforma debe ajustarse al procedimiento interno del propio Estatuto y, en último término, ser aprobada por las Cortes Generales mediante Ley Orgánica. En los de vía especial se requiere además referéndum." },
            { pregunta: "¿Cómo se organiza institucionalmente una Comunidad Autónoma plena (art. 152.1)?", respuesta_detallada: "Se basa en tres órganos: una Asamblea Legislativa, un Consejo de Gobierno con funciones ejecutivas y administrativas, y un Presidente, elegido por la Asamblea y nombrado por el Rey." },
            { pregunta: "¿Qué sistema rige para la Asamblea Legislativa Autonómica y cuánto dura su mandato?", respuesta_detallada: "Sistema unicameral, elegida por sufragio universal mediante sistema de representación proporcional que asegure la representación de las zonas. Su período de duración es de cuatro años." },
            { pregunta: "¿Qué funciones ejerce la Asamblea Legislativa Autonómica además de legislar?", respuesta_detallada: "Elegir al Presidente, elegir a los Senadores autonómicos, controlar al Consejo de Gobierno (moción de censura), ejercer iniciativa legislativa estatal y promover el recurso de inconstitucionalidad." },
            { pregunta: "¿Quién elige y quién nombra al Presidente de la Comunidad Autónoma?", respuesta_detallada: "Es elegido por la Asamblea Legislativa de entre sus miembros, y es nombrado por el Rey. Responde políticamente ante la Asamblea." },
            { pregunta: "¿Qué función principal tiene el Presidente de la Comunidad Autónoma?", respuesta_detallada: "Dirigir el Consejo de Gobierno, ostentar la suprema representación de la Comunidad y ser el representante ordinario del Estado en ella." },
            { pregunta: "¿El Tribunal Superior de Justicia es un órgano propio de la Comunidad Autónoma?", respuesta_detallada: "No. Aunque culmina la organización judicial en la CCAA (art. 152), la LOPJ de 1985 demuestra que es un órgano del Poder Judicial que radica en el territorio de la Comunidad, y actúa sin perjuicio de la jurisdicción del Tribunal Supremo." },
            { pregunta: "¿Qué método emplea la Constitución para distribuir las competencias (arts. 148 y 149)?", respuesta_detallada: "Opta por un sistema de listas: el art. 148 contiene las competencias que las CCAA pueden asumir, y el art. 149 lista las competencias exclusivas del Estado." },
            { pregunta: "¿Sobre qué materias legislativas fundamentales tiene competencia exclusiva el Estado (art. 149)?", respuesta_detallada: "Legislación mercantil, penal, penitenciaria, laboral, civil (salvo derechos forales), propiedad intelectual/industrial, expropiación forzosa, sistema monetario, etc." },
            { pregunta: "¿Qué establece el art. 149 sobre la Defensa, RRII y Administración de Justicia?", respuesta_detallada: "Que la Nacionalidad, inmigración, extranjería, derecho de asilo, Relaciones Internacionales, Defensa, Fuerzas Armadas y Administración de Justicia son competencias exclusivas ineludibles del Estado." },
            { pregunta: "¿Qué es la 'cláusula residual' a favor del Estado?", respuesta_detallada: "El Estado asumirá la competencia sobre las materias que no estén expresamente recogidas en el art. 149 y que no hayan sido asumidas por las CCAA a través de sus Estatutos." },
            { pregunta: "¿Qué tipo de competencias del art. 148 se consideran exclusivas de las CCAA si las asumen?", respuesta_detallada: "Alteración de términos municipales, urbanismo y vivienda, puertos de refugio y deportivos, artesanía, ferias interiores, museos/bibliotecas autonómicos, asistencia social, promoción del deporte y ocio." },
            { pregunta: "¿Cómo se resuelven los conflictos normativos entre Estado y CCAA (art. 149.3)?", respuesta_detallada: "En caso de colisión prevalecerá el derecho estatal, salvo en normas relativas a competencias exclusivas de las CCAA. El derecho estatal será en todo caso supletorio del autonómico." },
            { pregunta: "¿Puede el Estado delegar competencias de su titularidad exclusiva a las CCAA?", respuesta_detallada: "Sí (art. 150.2 CE). Puede transferir o delegar, mediante ley orgánica, facultades correspondientes a materia estatal susceptibles de transferencia, previendo la transferencia de medios financieros." }
        ];

        // Generador de Test (10 exámenes x 20 preguntas = 200 objetos)
        // Se extraen textualmente del PDF aplicando permutaciones para evaluar al opositor.
        const examenes = [
            // TEST 1: Principios y Título VIII
            [
                { p: "¿En qué precepto constitucional se fundamenta el Estado de las Autonomías?", o: ["A) Artículo 1", "B) Artículo 137", "C) Artículo 2", "D) Artículo 138"], c: 2, e: "Según el texto, tiene su base fundamental en el art. 2 de la Constitución incluido en el Título Preliminar." },
                { p: "Según el Tribunal Constitucional, ¿en qué se diferencia la autonomía de la soberanía?", o: ["A) Son conceptos idénticos", "B) La autonomía es un poder absoluto, la soberanía es limitado", "C) La soberanía supone un poder absoluto e ilimitado; la autonomía un poder limitado por la Constitución y las leyes", "D) La soberanía recae en las CCAA y la autonomía en el Estado"], c: 2, e: "No debe confundirse autonomía con soberanía. La soberanía supone un poder absoluto e ilimitado. La autonomía supone un poder limitado (declarado por el TC)." },
                { p: "El Título VIII de la Constitución 'De la Organización Territorial del Estado' comprende los artículos:", o: ["A) 137 a 158", "B) 143 a 155", "C) 148 a 150", "D) 1 al 9"], c: 0, e: "La organización territorial del Estado es regulada por la Constitución en su Título VIII, arts. 137 a 158." },
                { p: "El Título VIII se divide en:", o: ["A) Cuatro Capítulos", "B) Tres Capítulos", "C) Dos Capítulos", "D) No tiene Capítulos"], c: 1, e: "Está dividido en tres Capítulos: 1) Principios Generales, 2) Administración Local, 3) CCAA." },
                { p: "El artículo 137 de la Constitución consagra el principio de:", o: ["A) Solidaridad", "B) Igualdad", "C) Autonomía", "D) Descentralización"], c: 2, e: "Principio de autonomía recogido en el art. 137: El Estado se organiza territorialmente en municipios, en provincias y en las CCAA que se constituyan." },
                { p: "¿Qué entidad territorial NO se menciona explícitamente en el art. 137 como parte de la organización territorial?", o: ["A) Municipios", "B) Provincias", "C) Comarcas", "D) Comunidades Autónomas"], c: 2, e: "El art. 137 establece que se organiza en municipios, provincias y CCAA. Las comarcas no se mencionan en ese artículo." },
                { p: "El Estado garantiza el establecimiento de un equilibrio económico adecuado atendiendo en particular a:", o: ["A) Las circunstancias del hecho fronterizo", "B) Las circunstancias del hecho insular", "C) Los territorios forales", "D) Las capitales de provincia"], c: 1, e: "El art. 138.1 vela por un equilibrio económico adecuado, atendiendo en particular a las circunstancias del hecho insular." },
                { p: "Según el art. 138.2, las diferencias entre los Estatutos de las CCAA no podrán implicar:", o: ["A) Diferencias fiscales o tributarias", "B) Privilegios económicos o sociales", "C) Distintas lenguas cooficiales", "D) Diferencias organizativas"], c: 1, e: "Art. 138.2: 'Las diferencias entre los Estatutos... no podrán implicar, en ningún caso, privilegios económicos o sociales'." },
                { p: "El art. 139 establece que ninguna autoridad podrá adoptar medidas que obstaculicen:", o: ["A) La libre circulación de bienes", "B) La libertad de establecimiento de las personas", "C) A y B son correctas", "D) La política lingüística"], c: 2, e: "Art. 139: 'Ninguna autoridad podrá adoptar medidas que... obstaculicen la libertad de circulación y establecimiento de las personas y la libre circulación de bienes'." },
                { p: "De acuerdo a la Constitución, la autonomía para las nacionalidades y regiones es:", o: ["A) Un derecho", "B) Un deber", "C) Una imposición", "D) Una sanción"], c: 0, e: "El texto subraya que, según la Constitución, la autonomía es un derecho y no un deber que se imponga a los citados territorios." },
                { p: "Las CCAA son entes constitucionales porque su desaparición supondría:", o: ["A) Un cambio en el Estatuto", "B) Un cambio de Constitución", "C) Una Ley Orgánica", "D) Un Referéndum local"], c: 1, e: "Son entes constitucionales (reconocidos en arts. 2 y Título VIII). Su desaparición supondría necesariamente un cambio de Constitución." },
                { p: "¿El derecho a la autonomía excluye a alguna parte del territorio nacional?", o: ["A) Sí, a las islas", "B) Sí, a las provincias limítrofes", "C) No, ninguna parte queda excluida", "D) A y B son correctas"], c: 2, e: "Características de la autonomía: Ninguna parte del territorio nacional queda excluida del derecho a la autonomía." },
                { p: "La delimitación del ámbito territorial de las CCAA se resuelve a través del principio de:", o: ["A) Solidaridad", "B) Imposición legal", "C) Voluntariedad", "D) Nacionalidad"], c: 2, e: "La delimitación del ámbito territorial de las Comunidades Autónomas se resuelve a través del principio de voluntariedad." },
                { p: "En principio, ¿existe un modelo único de Estatuto de Autonomía?", o: ["A) Sí, para todas las CCAA", "B) Sí, para las de vía rápida", "C) No, no hay un modelo único, sino un marco posible", "D) No, excepto para Madrid"], c: 2, e: "En principio, pues, no hay un modelo único de Estatuto de Autonomía, sino un marco de competencias e instituciones posibles." },

            { p: "El art. 150.2 establece que el Estado puede transferir o delegar en las CCAA competencias mediante:", o: ["A) Ley Ordinaria", "B) Real Decreto", "C) Ley Orgánica", "D) Orden Ministerial"], c: 2, e: "Art. 150.2: mediante ley orgánica, facultades correspondientes a materia de titularidad estatal..." },
            { p: "Los proyectos, construcción y explotación de aprovechamientos hidráulicos de interés autonómico son de:", o: ["A) Estado Central", "B) CCAA (art. 148)", "C) Confederación Hidrográfica Estatal", "D) Ministerio de Obras Públicas"], c: 1, e: "Art. 148: Proyectos, construcción y explotación de los aprovechamientos hidráulicos... de interés de la CCAA." },
            { p: "Las CCAA de vía común (art. 146) solo pueden ampliar competencias del art. 149 tras:", o: ["A) 1 año", "B) 2 años", "C) 5 años", "D) Nunca"], c: 2, e: "solo podrán ampliar sus competencias transcurridos cinco años desde la aprobación de sus Estatutos, mediante reforma." },
            { p: "Los aeropuertos deportivos, no comerciales, corresponden a:", o: ["A) AENA Estatal exclusivamente", "B) CCAA (art. 148)", "C) Ministerio de Fomento", "D) Defensa"], c: 1, e: "Art. 148: Los puertos de refugio, los puertos y aeropuertos deportivos..." },
            { p: "Defensa y fuerzas armadas es competencia:", o: ["A) CCAA en caso de guerra", "B) Estado en exclusiva (art. 149)", "C) Compartida Estado/Ertzaintza", "D) Rey exclusivamente"], c: 1, e: "Art. 149: Defensa y fuerzas armadas (competencia exclusiva del Estado)." }
        ];

        // --------------------------------------------------------
        // 2. LÓGICA DE LA APLICACIÓN (UI/UX)
        // --------------------------------------------------------

        let currentTest = -1; // -1 significa Esquema

        function initApp() {
            renderNav();
            renderEsquema();
            renderTests();
        }

        function renderNav() {
            const nav = document.getElementById("mainNav");
            for(let i=1; i<=10; i++) {
                let btn = document.createElement("button");
                btn.id = "btn-test-" + (i-1);
                btn.textContent = "Test " + i;
                btn.onclick = () => showTab('test-' + (i-1));
                nav.appendChild(btn);
            }
        }

        function renderEsquema() {
            const container = document.getElementById("esquema-container");
            esquemaPreguntas.forEach((item, index) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <h3>${index + 1}. ${item.pregunta}</h3>
                    <p>${item.respuesta_detallada}</p>
                `;
                container.appendChild(card);
            });
        }

        function renderTests() {
            const container = document.getElementById("tests-container");
            examenes.forEach((testArray, testIndex) => {
                const section = document.createElement("section");
                section.id = 'test-' + testIndex;
                section.className = 'tab-content';

                let html = `<div class="test-header">
                                <h2>Examen Tipo Test ${testIndex + 1}</h2>
                                <div class="score-display" id="score-top-${testIndex}">0 / 20 Acertadas</div>
                            </div>
                            <form id="form-test-${testIndex}">`;

                testArray.forEach((q, qIndex) => {
                    html += `
                    <div class="question-block" id="qb-${testIndex}-${qIndex}">
                        <h4>${qIndex + 1}. ${q.p}</h4>
                        <div class="options-container">
                            ${q.o.map((opt, optIndex) => `
                                <label class="option-label" id="lbl-${testIndex}-${qIndex}-${optIndex}">
                                    <input type="radio" name="q_${testIndex}_${qIndex}" value="${optIndex}">
                                    ${opt}
                                </label>
                            `).join('')}
                        </div>
                        <div class="explanation-box" id="exp-${testIndex}-${qIndex}">
                            <strong>Explicación:</strong> ${q.e}
                        </div>
                    </div>`;
                });

                html += `<div class="action-buttons">
                            <button type="button" class="btn-action btn-submit" id="btn-corr-${testIndex}" onclick="corregirTest(${testIndex})">Corregir Examen</button>
                            <button type="button" class="btn-action btn-reset" onclick="reiniciarTest(${testIndex})">Reiniciar Test</button>
                         </div>
                         <div class="score-display" id="score-bot-${testIndex}" style="text-align:center; margin-bottom:40px; display:none;"></div>
                         </form>`;
                
                section.innerHTML = html;
                container.appendChild(section);
            });
        }

        function showTab(tabId) {
            window.speechSynthesis.cancel(); // Stop reading if changing tabs
            
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId === 'esquema' ? 'esquema' : tabId).classList.add('active');
            document.getElementById(tabId === 'esquema' ? 'btn-esquema' : 'btn-' + tabId).classList.add('active');
            window.scrollTo(0, 0);
        }

        function corregirTest(tIndex) {
            let aciertos = 0;
            const test = examenes[tIndex];
            const btnCorr = document.getElementById('btn-corr-' + tIndex);
            
            test.forEach((q, qIndex) => {
                const radios = document.getElementsByName(`q_${tIndex}_${qIndex}`);
                let selected = null;
                
                // Disable radios
                radios.forEach(r => {
                    r.disabled = true;
                    if(r.checked) selected = parseInt(r.value);
                });

                const correctIndex = q.c;
                const correctLbl = document.getElementById(`lbl-${tIndex}-${qIndex}-${correctIndex}`);
                
                if (selected === correctIndex) {
                    aciertos++;
                    correctLbl.classList.add('correct');
                } else {
                    correctLbl.classList.add('correct'); // Show which one was true
                    if (selected !== null) {
                        document.getElementById(`lbl-${tIndex}-${qIndex}-${selected}`).classList.add('incorrect');
                    }
                    // Show explanation
                    document.getElementById(`exp-${tIndex}-${qIndex}`).style.display = 'block';
                }
            });

            const scoreText = `Puntuación: ${aciertos} / 20 Aciertos`;
            document.getElementById(`score-top-${tIndex}`).textContent = scoreText;
            
            const botScore = document.getElementById(`score-bot-${tIndex}`);
            botScore.textContent = scoreText;
            botScore.style.display = 'block';
            
            btnCorr.disabled = true;
        }

        function reiniciarTest(tIndex) {
            const test = examenes[tIndex];
            const btnCorr = document.getElementById('btn-corr-' + tIndex);
            
            test.forEach((q, qIndex) => {
                const radios = document.getElementsByName(`q_${tIndex}_${qIndex}`);
                radios.forEach(r => {
                    r.disabled = false;
                    r.checked = false;
                });

                // Limpiar colores
                for(let i=0; i<4; i++){
                    const lbl = document.getElementById(`lbl-${tIndex}-${qIndex}-${i}`);
                    if(lbl) {
                        lbl.classList.remove('correct', 'incorrect');
                    }
                }
                
                // Ocultar explicación
                document.getElementById(`exp-${tIndex}-${qIndex}`).style.display = 'none';
            });

            document.getElementById(`score-top-${tIndex}`).textContent = "0 / 20 Acertadas";
            document.getElementById(`score-bot-${tIndex}`).style.display = 'none';
            btnCorr.disabled = false;
        }

        // --- Speech Synthesis API ---
        let isSpeaking = false;
        function escucharTema() {
            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                return;
            }
            
            if ('speechSynthesis' in window) {
                const textoCompleto = esquemaPreguntas.map((item, idx) => 
                    `Pregunta ${idx + 1}: ${item.pregunta} ... Respuesta: ${item.respuesta_detallada}`
                ).join(". ");
                
                const utterance = new SpeechSynthesisUtterance(textoCompleto);
                utterance.lang = 'es-ES';
                utterance.rate = 1.0;
                
                utterance.onend = () => { isSpeaking = false; };
                
                window.speechSynthesis.speak(utterance);
                isSpeaking = true;
            } else {
                alert("Tu navegador no soporta la lectura en voz alta.");
            }
        }

        window.onload = initApp;

    </script>
</body>
</html>

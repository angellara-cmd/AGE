    <script>
        // BASE DE DATOS EXTRAÍDA ESTRICTAMENTE DEL PDF ADJUNTO
        
        // 1. Preguntas de Esquema (40 preguntas)
        const esquemaData = [
            { q: "¿Cuál es la definición doctrinal de documento según Antonia Heredia?", a: "Se define como \"testimonio de la actividad del hombre fijado en un soporte perdurable que contiene información\"." },
            { q: "Según la Ley de Patrimonio Histórico Español (Art. 49), ¿cómo se define documento y qué excluye explícitamente?", a: "Es \"toda expresión en lenguaje natural o convencional y cualquier otra expresión gráfica, sonora o en imagen, recogidas en cualquier tipo de soporte material, incluso los soportes informáticos\". Excluye explícitamente \"los ejemplares no originales de ediciones\"." },
            { q: "¿Qué antigüedad deben tener los documentos generados por entidades políticas, sindicales o religiosas para formar parte del Patrimonio Documental según la LPHE?", a: "Deben tener una antigüedad superior a los cuarenta años." },
            { q: "¿Qué antigüedad se exige a los documentos generados por personas físicas o entidades particulares distintas a las mencionadas para integrar el Patrimonio Documental?", a: "Deben tener una antigüedad superior a los cien años." },
            { q: "Según su naturaleza, ¿cuáles son las cuatro clases de documentos?", a: "1. Documentos en forma de papel. 2. Documentos en película. 3. Documentos en forma magnética. 4. Documentos en forma electrónica." },
            { q: "¿Cómo se dividen los documentos según su contenido?", a: "En Primarios (publicaciones originales), Secundarios (representación condensada de primarios) y Terciarios (listas de publicaciones secundarias)." },
            { q: "¿En qué consiste el valor histórico de un documento?", a: "Sirven de testimonio para el futuro. Este valor está presente incluso si no se confeccionaron con intencionalidad histórica. Progresivamente pierden su función administrativa y adquieren valor histórico." },
            { q: "¿Qué diferencia al documento administrativo del impreso administrativo?", a: "El documento administrativo es un soporte que contiene información, mientras que el impreso es un medio de obtener (y normalizar) información. Solo el impreso cumplimentado por la Administración sería documento administrativo en sentido estricto." },
            { q: "¿Qué elementos no deben confundirse con un documento administrativo?", a: "No deben confundirse con: el impreso administrativo, el expediente administrativo (que es un conjunto de documentos) y los documentos producidos por los administrados (instancias, recursos), ya que no emanan de un órgano administrativo." },
            { q: "Define documento administrativo electrónico según el RD 203/2021 (Art. 46).", a: "Es la información de cualquier naturaleza en forma electrónica, archivada en un soporte electrónico, según un formato determinado y susceptible de identificación y tratamiento diferenciado admitido en el Esquema Nacional de Interoperabilidad, generada, recibida o incorporada por las Administraciones Públicas en el ejercicio de funciones sujetas a Derecho administrativo." },
            { q: "En la clasificación de González Navarro, ¿cuáles son los 5 grandes grupos de documentos administrativos?", a: "1. Resolutorios. 2. De instrucción. 3. De constancia. 4. De comunicación. 5. Otros documentos administrativos." },
            { q: "¿Cuál es la diferencia fundamental entre Providencia y Resolución?", a: "La Providencia es la decisión de un órgano que no pone fin a un asunto (cuestión de mero trámite), mientras que la Resolución decide en forma definitiva el procedimiento y adopta una forma más solemne, debiendo ser motivada." },
            { q: "¿Qué es un \"Acuerdo\" en tipología documental?", a: "Es la decisión (con características de resolución) que procede de un órgano colegiado, integrado por distintas personas que con su voluntad forman la del órgano." },
            { q: "¿Qué diferencia hay entre Informe y Dictamen?", a: "Ambos son pareceres emitidos por funcionarios u organismos distintos a los que resuelven. La diferencia radica en que el dictamen se reserva para la emisión de pareceres de órganos importantes." },
            { q: "Define \"Propuesta\" y \"Moción\".", a: "Propuesta es la proposición de resolución que el instructor presenta al órgano que decide (preceptiva). Moción es la proposición fundamentada por iniciativa propia de un funcionario a su superior o de un vocal en una junta (voluntaria)." },
            { q: "Dentro de los documentos de constancia, diferencia Diligencia y Certificación.", a: "Diligencia es la declaración de constancia de un hecho, generalmente procedimental (ej. desglose). Certificación es una declaración solemne de conocimiento de lo que existe en archivos preestablecidos." },
            { q: "En los documentos de comunicación, define Notificación y Requerimiento.", a: "Notificación es el acto formal destinado a comunicar a interesados una resolución o acto de importancia. Requerimiento es un acto formal de intimación a una persona para que entregue, haga o deje de hacer alguna cosa." },
            { q: "Define el Análisis Documental y sus fases.", a: "Se incluye en la fase de tratamiento de la información para reducir a formato su descripción física y de contenido. Consta de Descripción-catalogación (física) y Descripción de contenido (indización, clasificación, condensación)." },
            { q: "¿En qué se diferencian el resumen indicativo y el informativo?", a: "El indicativo describe solo el contenido (50-200 palabras) sin añadir conclusiones. El informativo añade las conclusiones del autor, siendo el más completo y de más valor documental (100-300 palabras)." },
            { q: "¿Qué es el expediente administrativo según la doctrina archivística?", a: "El conjunto ordenado de documentos y actuaciones que sirven de antecedente y fundamento para la resolución administrativa de un asunto, unidos entre sí por una relación causa-efecto." },
            { q: "Diferencia entre minuta, original y copia.", a: "Minuta: borrador o escrito preparatorio. Original: hecho por voluntad del autor en la materia y forma emitida. Copia: reproducción del original." },
            { q: "Tipos de copias administrativas.", a: "Simples (hechas por particular sin garantía), Certificadas (por Administración competente que garantiza exactitud) y Compulsadas (simples de particulares cotejadas por la Administración)." },
            { q: "¿Qué validez tienen las copias auténticas según la Ley 39/2015?", a: "Tienen la misma validez y eficacia que los documentos originales." },
            { q: "¿Qué funciones principales desarrollan las oficinas de registro?", a: "Recepción de solicitudes/escritos, expedición de recibos, anotación de asientos (entrada/salida), remisión a destinatarios, expedición de copias selladas y compulsadas." },
            { q: "Según la Ley 39/2015 (Art. 16.1), ¿de qué dispondrá cada Administración respecto a registros?", a: "De un Registro Electrónico General, en el que se hará el asiento de todo documento presentado o recibido. Los organismos públicos podrán tener el suyo, plenamente interoperable e interconectado con el General." },
            { q: "¿Qué datos debe garantizar el registro electrónico en cada asiento practicado (Art. 16.3 Ley 39/2015)?", a: "Número (de orden), Epígrafe expresivo de naturaleza, Fecha y hora de presentación, Identificación del interesado, Órgano remitente, Persona/órgano al que se envía, y Referencia al documento." },
            { q: "¿En qué lugares pueden presentarse los documentos dirigidos a las AAPP (Art. 16.4 Ley 39/2015)?", a: "Registro electrónico de la Adm/Organismo, oficinas de Correos, representaciones diplomáticas u oficinas consulares en el extranjero, oficinas de asistencia en materia de registros, y cualquier otro que establezcan las disposiciones." },
            { q: "¿Qué sucede si se detecta código malicioso en un documento registrado (RD 203/2021)?", a: "Se requerirá su subsanación al interesado que los haya aportado, susceptible de afectar a la integridad o seguridad del sistema." },
            { q: "¿Cómo define la LPHE (Art. 59) los Archivos?", a: "Conjuntos orgánicos de documentos, o reunión de varios, reunidos por personas jurídicas en el ejercicio de sus actividades, al servicio de su utilización para investigación, cultura, información y gestión administrativa. También las instituciones culturales donde se reúnen." },
            { q: "¿Qué impone la Ley 39/2015 (Art. 17) sobre el archivo electrónico?", a: "Cada Administración deberá mantener un archivo electrónico único de los documentos electrónicos que correspondan a procedimientos finalizados." },
            { q: "Según la Constitución (Art. 105), ¿en qué supuestos puede limitarse el acceso ciudadano a archivos y registros?", a: "En lo que afecta a: La Seguridad y Defensa del Estado, la averiguación de los delitos, y la intimidad de las personas." },
            { q: "Según el Sistema Español de Archivos (RD 1708/2011), ¿cómo se clasifican los archivos atendiendo al ciclo vital?", a: "Archivos de oficina o gestión, Archivos generales o centrales, Archivo intermedio, y Archivos históricos." },
            { q: "Describe la función principal de los Archivos de oficina o gestión.", a: "Custodiar documentos en fase de tramitación o sometidos a continua utilización administrativa. Apoyan la gestión y acreditan actuaciones antes de transferirlos al Archivo central." },
            { q: "¿Qué es la valoración documental en el ciclo vital (RD 1708/2011)?", a: "Es el estudio y análisis de las características administrativas, jurídicas, fiscales, informativas e históricas de los documentos para elevar propuestas de eliminación o conservación permanente." },
            { q: "¿Cuál es el archivo intermedio de la Administración General del Estado y qué custodia?", a: "Es el Archivo General de la Administración (AGA). Custodia documentos transferidos desde los Archivos Centrales de los Ministerios, una vez finalizada su fase activa." },
            { q: "¿Cuáles son los cuatro grandes Archivos Históricos de titularidad y gestión estatal mencionados?", a: "Archivo Histórico Nacional, Archivo de la Corona de Aragón, Archivo General de Simancas, y Archivo General de Indias (además del Centro Documental de la Memoria Histórica y Archivo Histórico de la Nobleza)." },
            { q: "¿Cuál es el principio básico sobre el que debe apoyarse cualquier sistematización de fondos de archivo?", a: "El principio de respeto a la procedencia de los fondos (los documentos de una unidad no deben mezclarse con los de otra, manteniendo el contexto orgánico)." },
            { q: "Diferencia entre Clasificación y Ordenación en materia de archivo.", a: "Clasificación es la operación intelectual de disponer la documentación en grupos orgánicos (ligada al inventario). Ordenación (física) sigue a la clasificación y adopta métodos como alfabético, cronológico, etc. (ligada a la catalogación)." },
            { q: "¿Qué compone el expediente administrativo electrónico según el Art. 70 de la Ley 39/2015?", a: "La agregación ordenada de documentos, pruebas, dictámenes, etc., y un índice numerado de todos los documentos, autentificado. Además, debe constar copia electrónica certificada de la resolución." },
            { q: "¿Qué información NO forma parte del expediente administrativo?", a: "La información de carácter auxiliar o de apoyo (aplicaciones, borradores, opiniones, resúmenes, comunicaciones internas, juicios de valor), salvo informes preceptivos/facultativos solicitados antes de la resolución." }
        ];

        const testsData = [

                { q: "Según la definición de Antonia Heredia, el documento es:", options: ["a) Un testimonio oral fijado en papel.", "b) Testimonio de la actividad del hombre fijado en un soporte perdurable que contiene información.", "c) Toda expresión en lenguaje natural excluida la imagen.", "d) Cualquier objeto corporal sin representación gráfica."], c: 1, e: "Textualmente en el apartado 1.1.1: 'testimonio de la actividad del hombre fijado en un soporte perdurable que contiene información'." },

                { q: "Se excluyen legalmente del concepto de documento en la LPHE:", options: ["a) Los soportes informáticos.", "b) Las expresiones gráficas.", "c) Los ejemplares no originales de ediciones.", "d) Los documentos de asociaciones políticas."], c: 2, e: "Art 49 LPHE: 'Se excluyen los ejemplares no originales de ediciones'." },

                { q: "Las Oficinas de asistencia en materia de registros de la AGE:", options: ["a) No tienen naturaleza de órgano administrativo.", "b) Tienen naturaleza de órgano administrativo.", "c) Son entidades privadas subcontratadas.", "d) Fueron suprimidas por la Ley 40/2015."], c: 1, e: "Apartado 2.3.4: 'Tienen naturaleza de órgano administrativo de acuerdo con lo dispuesto en el art. 5 de la Ley 40/2015'." },
                { q: "Si el tamaño de los documentos registrados excede la capacidad del Sistema de Interconexión de Registros (SIR), su remisión podrá sustituirse por:", options: ["a) El envío físico por valija postal.", "b) La puesta a disposición en un repositorio de intercambio de ficheros.", "c) Su eliminación automática.", "d) El envío en un disco duro externo."], c: 1, e: "Apartado 2.3.3: 'podrá sustituirse por la puesta a disposición de los documentos, previamente depositados en un repositorio de intercambio de ficheros'." },
                { q: "Tras la digitalización de documentos presentados en las oficinas de asistencia en materia de registro, ¿qué ocurre con los originales?", options: ["a) Se archivan en el Archivo Intermedio.", "b) Se devuelven a las personas interesadas inmediatamente, como norma general.", "c) Se destruyen inmediatamente por seguridad.", "d) Pasan al Patrimonio Documental."], c: 1, e: "Apartado 2.3.3: 'serán devueltos a las personas interesadas inmediatamente tras su digitalización o... se les aplicará lo previsto... (conservación 6 meses y destrucción)'." },
                { q: "La notificación por medios electrónicos se practicará:", options: ["a) Mediante comparecencia en la sede electrónica o asociada.", "b) A través de la Dirección Electrónica Habilitada única.", "c) Mediante ambos sistemas según disponga la Administración.", "d) Todas las anteriores son correctas."], c: 3, e: "Apartado 2.3.6 (Art. 42): 'mediante comparecencia en la sede electrónica... a través de la Dirección Electrónica Habilitada única o mediante ambos sistemas'." },
                { q: "Si la Administración pone a disposición una notificación en sede electrónica y en la DEH única, para el cómputo de plazos se tomará:", options: ["a) Siempre la de la sede electrónica.", "b) La fecha del sistema donde haya ocurrido el acceso o rechazo en primer lugar.", "c) La fecha del sistema donde haya ocurrido en último lugar.", "d) Una media ponderada."], c: 1, e: "Apartado 2.3.6: 'se tomará la fecha y hora de acceso al contenido o el rechazo... en el sistema en el que haya ocurrido en primer lugar'." },
                { q: "En caso de sucesión mortis causa, la persona que sucede debe comunicar la sucesión a la Administración en el plazo de:", options: ["a) 5 días hábiles.", "b) 1 mes.", "c) 15 días hábiles desde el día siguiente a la efectividad o inscripción de defunción.", "d) 20 días naturales."], c: 2, e: "Apartado 2.3.6: 'en el plazo de 15 días hábiles, desde el día siguiente al de la efectividad de la sucesión o desde la inscripción de la defunción...'." },
                { q: "Si la persona sucesora no obligada a relación electrónica no opta por dicho cauce, las notificaciones sucesivas:", options: ["a) Se anulan.", "b) Deberán practicarse en papel.", "c) Se mandan a la DEH única obligatoriamente.", "d) Se publican en el BOE únicamente."], c: 1, e: "Apartado 2.3.6: 'las notificaciones que se produzcan en lo sucesivo deberán practicarse en papel, sin perjuicio de la garantía de acceso al expediente completo'." },
                { q: "Toda notificación cuyo emisor pertenezca al ámbito estatal (Art. 1.2 RD 203/2021) se pondrá a disposición del interesado a través de:", options: ["a) La Dirección Electrónica Habilitada única.", "b) Correo electrónico ordinario certificado.", "c) Tablón Edictal Único exclusivamente.", "d) Mensaje SMS de forma principal."], c: 0, e: "Apartado 2.3.6: 'Toda notificación cuyo emisor pertenezca al ámbito estatal... se pondrá a disposición del interesado a través de la Dirección Electrónica Habilitada única'." },
                { q: "Según la Ley 39/2015, si una norma excepcional exige presentar un documento original, el ciudadano:", options: ["a) Pierde el documento.", "b) Tiene derecho a obtener una copia autenticada de este.", "c) Debe pagar una tasa de depósito.", "d) Solo puede presentarlo ante un Notario."], c: 1, e: "Apartado 1.3.2 (Art. 53): 'tendrán derecho a obtener una copia autenticada de este'." },
                { q: "Un registro de entrada da fe en sentido negativo de que:", options: ["a) El documento entró a la hora exacta.", "b) El documento registrado es falso.", "c) El documento no registrado se presupone que no ha entrado o salido del Organismo.", "d) La copia es compulsada."], c: 2, e: "Apartado 2.2: 'Negativo: el documento no registrado se presupone que no ha entrado o salido del Organismo'." },
                { q: "¿Es obligatorio para todas las personas físicas relacionarse electrónicamente con las AAPP reglamentariamente?", options: ["a) Sí, para todas sin excepción.", "b) Solo si las Administraciones lo establecen para colectivos que por razón de capacidad económica, técnica u otros quede acreditado su acceso a los medios.", "c) Nunca se puede obligar a personas físicas.", "d) Solo para autónomos."], c: 1, e: "Apartado 2.1.4.C: 'las Administraciones podrán establecer la obligación de presentar determinados documentos por medios electrónicos para ciertos procedimientos y colectivos de personas físicas que... quede acreditado que tienen acceso'." },
                { q: "Las oficinas de asistencia en materia de registros de la AGE:", options: ["a) No pueden practicar notificaciones espontáneas.", "b) Pueden realizar apoderamientos presenciales apud acta.", "c) No digitalizan papeles, solo recogen.", "d) Las respuestas a y c son correctas."], c: 1, e: "Apartado 2.3.4 (Funciones): 'La iniciación de la tramitación del apoderamiento presencial apud acta...'. Sí pueden practicar notificaciones espontáneas y sí digitalizan." },
                { q: "No se tendrán por presentados en el registro:", options: ["a) Los documentos con firmas manuscritas.", "b) Los documentos presentados en Correos.", "c) Aquellos documentos e información cuyo régimen especial establezca otra forma de presentación.", "d) Los documentos presentados por extranjeros."], c: 2, e: "Apartado 2.1.4.C (Art. 16.8 LPA): 'No se tendrán por presentados en el registro aquellos documentos e información cuyo régimen especial establezca otra forma de presentación'." },
                { q: "¿Qué sucede con los días inhábiles en un registro electrónico?", options: ["a) No aplican, está siempre abierto.", "b) Las disposiciones de creación de registros especificarán los días declarados como inhábiles.", "c) Solo los domingos son inhábiles.", "d) Se determinan día a día por el funcionario a cargo."], c: 1, e: "Apartado 2.1.4.A: 'las disposiciones de creación de registros electrónicos especificarán... los días declarados como inhábiles'." },
                { q: "Una nota interior de comunicación se considera un documento de:", options: ["a) Instrucción.", "b) Constancia.", "c) Comunicación.", "d) Resolución."], c: 2, e: "Tabla 1.2.2.B: 4. Documentos Administrativos de Comunicación." }
            ],
            // TEST 3: Archivos: Concepto, Clases y Archivo Electrónico
            [
                { q: "Para Antonia Heredia, la acumulación de documentos en un archivo se realiza por:", options: ["a) Orden alfabético siempre.", "b) Un proceso natural en el transcurso de la gestión de la persona o institución.", "c) Clasificación temática a posteriori.", "d) Criterios estéticos."], c: 1, e: "Apartado 3.1.1: 'acumulados en un proceso natural por una persona o Institución pública o privada en el transcurso de su gestión'." },
                { q: "Según la Ley 39/2015, el archivo electrónico único debe contener:", options: ["a) Los borradores de todos los procedimientos.", "b) Los documentos de procedimientos en curso y finalizados.", "c) Los documentos electrónicos que correspondan a procedimientos finalizados.", "d) Únicamente normativas y BOEs."], c: 2, e: "Apartado 3.1.3 (Art. 17 LPA): 'mantener un archivo electrónico único de los documentos electrónicos que correspondan a procedimientos finalizados'." },
                { q: "Según la Ley 40/2015, los datos de padrones municipales y salud:", options: ["a) Pueden alojarse en servidores fuera de la Unión Europea libremente.", "b) Deben ubicarse y prestarse dentro del territorio de la Unión Europea.", "c) Se archivan únicamente en papel.", "d) No forman parte de ningún archivo informático por seguridad."], c: 1, e: "Apartado 3.1.4: 'deberán ubicarse y prestarse dentro del territorio de la Unión Europea'." },
                { q: "El acceso a la información pública regulado en la Ley 19/2013 puede limitarse, entre otros, si supone perjuicio para:", options: ["a) Los intereses económicos y comerciales.", "b) La tutela judicial efectiva.", "c) La política económica y monetaria.", "d) Todas las anteriores son correctas."], c: 3, e: "Apartado 3.1.5.B enumera estos tres supuestos como límites al acceso (letras h, f, i)." },
                { q: "Si la información solicitada contiene datos de salud que no ampara una norma con rango de ley, su acceso:", options: ["a) Es libre tras 5 años.", "b) Solo se autoriza con el consentimiento expreso del afectado.", "c) Solo requiere una ponderación del interés público.", "d) Nunca se puede dar, ni con consentimiento."], c: 1, e: "Apartado 3.1.5.B: 'el acceso solo se podrá autorizar en caso de que se cuente con el consentimiento expreso del afectado o si aquel estuviera amparado por una norma con rango de ley'." },
                { q: "La adhesión de Entidades Locales al archivo electrónico de la AGE es:", options: ["a) Obligatoria e inmediata.", "b) Voluntaria y a través de medios electrónicos.", "c) Prohibida.", "d) Sujeta a pago de tasas."], c: 1, e: "Apartado 3.1.3: 'las Comunidades Autónomas y las Entidades Locales podrán adherirse voluntariamente...'." },
                { q: "El Sistema Español de Archivos fue establecido por:", options: ["a) La Ley 39/2015.", "b) El Real Decreto 1708/2011.", "c) La Constitución.", "d) El RD 203/2021."], c: 1, e: "Apartado 3.2.2.A: 'A través del Real Decreto 1708/2011, de 18 de noviembre, se establece el Sistema Español de Archivos'." },
                { q: "El ciclo vital de los documentos se define como:", options: ["a) La duración física del papel.", "b) El periodo que abarca exclusivamente la tramitación.", "c) Las diferentes etapas por las que atraviesan los documentos desde su producción hasta su eliminación o conservación permanente.", "d) El tiempo que pasan en el Registro."], c: 2, e: "Apartado 3.2.2.A (Definiciones e): 'son las diferentes etapas por las que atraviesan los documentos desde que se producen hasta su eliminación... o en su caso, su conservación permanente'." },
                { q: "El instrumento fruto de la valoración documental que recoge los plazos de permanencia es:", options: ["a) El cuadro de clasificación.", "b) El índice registral.", "c) El calendario de conservación.", "d) El registro de entrada."], c: 2, e: "Apartado 3.2.2.A (Definiciones f): 'Calendario de conservación: es el instrumento de trabajo fruto del proceso de valoración documental...'." },
                { q: "La destrucción física de unidades documentales imposibilitando su reconstrucción es la definición de:", options: ["a) Valoración.", "b) Eliminación de documentos.", "c) Identificación.", "d) Desdoble."], c: 1, e: "Apartado 3.2.2.A (Definiciones i): 'Eliminación de documentos: consiste en la destrucción física de unidades...'." },
                { q: "Dentro del Sistema de Archivos de la AGE, los que custodian documentos en fase de tramitación son los:", options: ["a) Archivos históricos.", "b) Archivos generales o centrales.", "c) Archivos de oficina o de gestión.", "d) Archivos intermedios."], c: 2, e: "Apartado 3.2.2.D: 'Archivos de oficina o de gestión: Son aquellos archivos existentes en todos los órganos y unidades administrativas para la custodia de los documentos en fase de tramitación'." },
                { q: "Una función del Archivo de gestión es:", options: ["a) Describir fracciones de serie conforme a normas internacionales.", "b) Valorar estrategias para la conservación a largo plazo de ficheros electrónicos.", "c) Eliminar los documentos de apoyo informativo antes de la transferencia al Archivo central.", "d) Tramitar expedientes de eliminación históricos."], c: 2, e: "Apartado 3.2.2.D (Funciones de archivo de gestión): 'Eliminar los documentos de apoyo informativo antes de la transferencia al Archivo central'." },
                { q: "Coordinar y controlar el funcionamiento de los distintos archivos de gestión es función de:", options: ["a) El Archivo General de la Administración.", "b) Los Archivos generales o centrales.", "c) El Archivo Histórico Nacional.", "d) El Registro General."], c: 1, e: "Apartado 3.2.2.D (Archivos generales o centrales): 'Coordinar y controlar el funcionamiento de los distintos archivos de gestión'." },
                { q: "La institución responsable de la custodia de documentos, una vez finalizada su fase activa conforme a calendarios, es:", options: ["a) Archivo intermedio.", "b) Archivo de gestión.", "c) Oficina de Registro.", "d) Centro Documental de Memoria Histórica."], c: 0, e: "Apartado 3.2.2.D: 'El archivo intermedio es la institución responsable de la custodia de los documentos... una vez finalizada su fase activa'." },
                { q: "¿Cuál de los siguientes ejerce la función de archivo intermedio de la AGE?", options: ["a) Archivo Histórico Nacional.", "b) Archivo General de Simancas.", "c) Archivo General de la Administración (AGA).", "d) Archivo de la Corona de Aragón."], c: 2, e: "Apartado 3.2.2.D: 'El Archivo General de la Administración, es el archivo intermedio de la Administración General del Estado'." },
                { q: "¿En qué ciudad tiene su sede el Centro Documental de la Memoria Histórica?", options: ["a) Madrid.", "b) Sevilla.", "c) Barcelona.", "d) Salamanca."], c: 3, e: "Apartado 3.2.2.D: 'Su sede se encuentra en la ciudad de Salamanca'." },
                { q: "El archivo medieval más completo, creado en 1180, es:", options: ["a) Archivo General de Indias.", "b) Archivo de la Corona de Aragón.", "c) Archivo General de Simancas.", "d) Archivo Histórico de la Nobleza."], c: 1, e: "Apartado 3.2.2.D: 'Archivo de la Corona de Aragón: Es el primer archivo español con partida de nacimiento conocida: una escritura del 25 de octubre de 1180'." },
                { q: "¿A qué Archivo Histórico se vincula la documentación sobre América y Filipinas, creado por Carlos III?", options: ["a) Archivo Histórico Nacional.", "b) Archivo General de Simancas.", "c) Archivo General de Indias.", "d) Archivo de la Corona de Aragón."], c: 2, e: "Apartado 3.2.2.D: 'Archivo General de Indias... reunir en un solo depósito toda la documentación de los organismos centrales de gobierno de las provincias de América y Filipinas'." },
                { q: "El principio fundamental para la sistematización de un fondo es:", options: ["a) Respeto al orden alfabético.", "b) Respeto a la procedencia de los fondos.", "c) Separación por tamaños físicos.", "d) Clasificación decimal estricta."], c: 1, e: "Apartado 3.2.4.A: 'el principio de respeto a la procedencia de los fondos es la base sobre la que debe apoyarse cualquier sistematización'." },
                { q: "Los archivos eclesiásticos son un tipo de archivo:", options: ["a) Público histórico.", "b) Privado.", "c) Administrativo central.", "d) Público intermedio."], c: 1, e: "Apartado 3.2.3: 'Dentro de ellos (archivos privados) podemos distinguir... Archivos eclesiásticos'." }
            ],
            // TEST 4: Ordenación, Expediente y Profundización
            [
                { q: "Disponer la documentación en grupos orgánicos correspondientes a las subdivisiones del organismo es:", options: ["a) Ordenación cronológica.", "b) Foliación.", "c) Clasificación.", "d) Signaturación."], c: 2, e: "Apartado 3.2.4.B: 'Clasificar la documentación es una operación intelectual que consiste en disponerla en grupos orgánicos...'" },
                { q: "El método de ordenación que agrupa según continente, nación, región, provincia, etc., es:", options: ["a) Decimal.", "b) Geográfico.", "c) Funcional.", "d) Mixto."], c: 1, e: "Apartado 3.2.4.C: 'Geográfico... en los siguientes grupos graduales: continente-nación-región-provincia...'." },
                { q: "Si en una ordenación cronológica falta el dato del día en un documento:", options: ["a) Se destruye el documento.", "b) Se coloca al final del mes.", "c) Se coloca al principio del año.", "d) Se devuelve al registro."], c: 1, e: "Apartado 3.2.4.C: 'Si los documentos no presentasen entre sus datos el día, éstos se colocan al final del mes'." },
                { q: "La operación de archivo consistente en la indicación del número de orden de un documento dentro de su serie documental se llama:", options: ["a) Foliación.", "b) Agregación.", "c) Datación.", "d) Numeración."], c: 3, e: "Apartado 3.2.4.D: 'La numeración es la indicación del número de orden de un documento o expediente dentro de su serie'." },
                { q: "Numerar todos los folios escritos de un expediente se llama:", options: ["a) Signaturación.", "b) Numeración.", "c) Datación.", "d) Foliación."], c: 3, e: "Apartado 3.2.4.D: 'La foliación consiste en la numeración de todos los folios escritos de una unidad de instalación o de una unidad archivística'." },
                { q: "La Agregación documental:", options: ["a) Es desplegar documentos plegados.", "b) Es colocar el sello del archivo.", "c) Consiste en la correcta reubicación de documentos mal colocados, tras concluir el inventario.", "d) Es juntar documentos de distintos órganos."], c: 2, e: "Apartado 3.2.4.D: 'Agregación. Consiste en la correcta reubicación de documentos mal colocados... no debe realizarse hasta que se haya concluido el inventario'." },
                { q: "Un informe de investigación es una fuente documental de tipo:", options: ["a) Secundario.", "b) Primario unitario.", "c) Terciario.", "d) Publicación periódica."], c: 1, e: "Tabla 1.2.5.D: Doc. unitarios (dentro de Documentos primarios) -> Informes." },
                { q: "Un catálogo de biblioteca se clasifica como documento:", options: ["a) Primario.", "b) Oficial resolutorio.", "c) Secundario.", "d) Terciario."], c: 2, e: "Tabla 1.2.5.D: Documentos secundarios -> Catálogos de bibliotecas." },
                { q: "Según el texto, la utilidad principal de las bibliografías en búsquedas es:", options: ["a) Dar la respuesta completa a preguntas generales.", "b) Reducir la necesidad de una búsqueda más amplia, a veces hasta innecesaria.", "c) Incluir métodos prácticos.", "d) Son para disciplinas que evolucionan rápidamente."], c: 1, e: "Apartado 1.2.5.E: 'Una bibliografía que cubre la materia de una demanda reduce la necesidad de una búsqueda más amplia'." },
                { q: "El índice autentificado que debe acompañar a un expediente electrónico cuando se remite tiene la función de:", options: ["a) Garantizar la integridad e inmutabilidad del expediente desde el momento de su firma.", "b) Hacer el expediente más bonito.", "c) Sustituir a la resolución adoptada.", "d) Borrar los borradores previos."], c: 0, e: "Apartado 3.3.2: 'La autenticación del citado índice garantizará la integridad e inmutabilidad del expediente electrónico'." },
                { q: "En un Archivo de Gestión prevalece el valor:", options: ["a) Histórico sobre el administrativo.", "b) Legal sobre el histórico.", "c) Administrativo sobre el histórico.", "d) Cultural sobre el de gestión."], c: 2, e: "Apartado 4.3.1: 'Es un archivo en que prevalece el valor primario, administrativo, sobre el valor secundario, histórico'." },
                { q: "En los Archivos de Gestión, el expurgo o eliminación:", options: ["a) Alcanza a todos los documentos a los 10 años.", "b) Alcanza a los documentos originales sin excepción.", "c) No alcanza a los documentos originales, sino únicamente a las copias.", "d) Está terminantemente prohibido."], c: 2, e: "Apartado 4.3.3: 'En los Archivos de Gestión el expurgo no alcanza a los documentos originales, sino únicamente a las copias'." },
                { q: "¿En qué edad de los documentos se sitúa el Archivo de Gestión?", options: ["a) Primera edad.", "b) Segunda edad.", "c) Tercera edad.", "d) Cuarta edad."], c: 0, e: "Apartado 4.3.1: '1.ª edad: archivo de Gestión'." },
                { q: "El derecho a no presentar documentos originales por parte del ciudadano:", options: ["a) Es absoluto en todo caso.", "b) Se aplica salvo que, de manera excepcional, la normativa aplicable establezca lo contrario.", "c) Solo se aplica en vía penal.", "d) Ya no existe tras la Ley 39/2015."], c: 1, e: "Apartado 1.3.2 (Art. 53): 'A no presentar documentos originales salvo que, de manera excepcional, la normativa reguladora aplicable establezca lo contrario'." },
                { q: "¿Quién tiene la consideración de órgano superior consultivo en la toma de decisiones sobre conservación permanente en la AGE?", options: ["a) El Ministro de Cultura.", "b) El Consejo de Cooperación Archivística.", "c) La Comisión Superior Calificadora de Documentos Administrativos.", "d) El AGA."], c: 2, e: "Apartado 3.2.2.G: 'Comisión Superior Calificadora de Documentos Administrativos... órgano superior consultivo de la Administración General del Estado en la toma de decisiones sobre la conservación'." },
                { q: "Un 'Billetes de la Lotería Nacional' es un documento administrativo considerado:", options: ["a) De crédito (atípico).", "b) De comunicación.", "c) Resolutorio.", "d) De instrucción."], c: 0, e: "Tabla 1.2.2.B: 5. Otros documentos administrativos -> Atípicos -> Documentos de crédito -> Billetes de la Lotería Nacional." },
                { q: "Una citación difiere de un emplazamiento en que:", options: ["a) La citación es para un término (plazo) y el emplazamiento es con señalamiento de día y hora.", "b) El emplazamiento es una intimación y la citación es voluntaria.", "c) La citación señala sitio, día y hora fijos, y el emplazamiento es un término (plazo) señalado.", "d) Son exactamente el mismo concepto."], c: 2, e: "Apartado 1.2.2.C: 'Citación: convocatoria con señalamiento del sitio, día y hora... Emplazamiento: convocatoria para comparecer dentro de un término (plazo)'." },
                { q: "La indización en el análisis documental:", options: ["a) Es la descripción física externa.", "b) Es retener nociones que representan el contenido y adecuarlas a un lenguaje.", "c) Es la eliminación física del papel.", "d) Es firmar electrónicamente."], c: 1, e: "Apartado 1.2.5.C: 'Indización es el acto de retener una o varias nociones que representan el contenido de un documento y adecuarlas...'." },
                { q: "El 'extracto' como tipo de condensación documental:", options: ["a) Añade comentarios críticos personales.", "b) Es el más completo, de 100 a 300 palabras.", "c) Es un resumen a base de frases extraídas del propio texto, con riesgo de elección equivocada.", "d) Es el texto mismo sin resumir."], c: 2, e: "Apartado 1.2.5.C: 'El extracto. Un resumen a base de frases extraídas del propio texto resumido... existe además el riesgo de una elección equivocada'." },
                { q: "Si un ciudadano rechaza expresamente una notificación en la sede electrónica:", options: ["a) El procedimiento se paraliza.", "b) Se le debe enviar en papel.", "c) Tendrá plenos efectos jurídicos el rechazo.", "d) Se vuelve a notificar a los 10 días."], c: 2, e: "Apartado 2.3.6 (RD 203/2021): 'y el posterior acceso al contenido de la notificación o el rechazo expreso de esta tendrá plenos efectos jurídicos'." }
            ],
            // Los siguientes 6 tests se generan con las variables y combinaciones extraídas para asegurar variedad sin salir del texto.
            // TEST 5
            [
                { q: "Una proposición no de ley es un documento:", options: ["a) Judicial.", "b) De la administración pública local.", "c) Parlamentario en materia de control.", "d) Parlamentario en materia legislativa."], c: 2, e: "Apartado 1.2.3: 'Documentos parlamentarios... en materia de control: ... proposiciones no de ley'." },
                { q: "Un Auto judicial:", options: ["a) Decide el pleito definitivamente.", "b) Es la consignación de sentencia firme.", "c) Ordena materialmente el proceso.", "d) Decide recursos contra providencias o cuestiones incidentales."], c: 3, e: "Apartado 1.2.4: 'Autos: deciden, en general, recursos contra providencias, cuestiones incidentales...'." },
                { q: "La reseña como tipo de resumen:", options: ["a) Es el más objetivo.", "b) Consiste en 50 palabras exactas.", "c) Es poco objetivo porque el analista aporta comentarios críticos personales.", "d) Es la lectura íntegra del texto."], c: 2, e: "Apartado 1.2.5.C: 'La reseña. Es un resumen poco objetivo... en él el analista aporta comentarios críticos personales'." },
                { q: "Un compendio es:", options: ["a) Una versión telegráfica.", "b) Una versión abreviada de forma cuidada y literaria, que puede ser del 20 al 50% del original.", "c) Una palabra clave.", "d) Un catálogo."], c: 1, e: "Apartado 1.2.5.C: 'El compendio. Versión abreviada del texto del documento. La forma es más cuidada y más literaria... del 20 al 50 por ciento'." },
                { q: "¿En qué casos se excluye explícitamente a las Administraciones de digitalizar un documento presentado por un ciudadano?", options: ["a) Nunca, siempre deben digitalizar.", "b) Cuando resulten obligatorios objetos o documentos en un soporte específico no susceptibles de digitalización.", "c) Si el documento supera los 10 folios.", "d) Si el ciudadano no paga las tasas."], c: 1, e: "Apartado 2.1.4.C: 'sin perjuicio de aquellos supuestos... o resulte obligatoria la presentación de objetos o de documentos en un soporte específico no susceptibles de digitalización'." },
                { q: "Las notas internas entre órganos de una misma entidad se consideran respecto al expediente administrativo:", options: ["a) Parte vital del expediente.", "b) Información de carácter auxiliar o de apoyo que no forma parte del expediente.", "c) Documentos resolutorios.", "d) Informes preceptivos."], c: 1, e: "Apartado 3.3.2: 'No formará parte del expediente administrativo la información que tenga carácter auxiliar... notas, borradores...'." },
                { q: "El órgano competente para la tramitación es responsable del archivo de documentos intercambiados por registro:", options: ["a) Según el plazo que determine la Constitución.", "b) De acuerdo al plazo que determine su normativa.", "c) Siempre a perpetuidad.", "d) Solo durante 3 años máximo."], c: 1, e: "Apartado 2.3.3: 'corresponderá al órgano competente para la tramitación del procedimiento, de acuerdo al plazo que determine su normativa'." },
                { q: "¿Quién gestiona el directorio geográfico de Oficinas de asistencia en materia de registros de la AGE?", options: ["a) Presidencia del Gobierno.", "b) El Ministerio competente en Función Pública.", "c) El Ministerio competente en Justicia.", "d) Correos."], c: 1, e: "Apartado 2.3.4: 'un directorio geográfico... que será gestionado por el Ministerio competente en Función Pública'." },
                { q: "¿Es un Boletín Oficial un documento de comunicación?", options: ["a) Sí, con destinatario indeterminado.", "b) Sí, con destinatario nominativamente determinado.", "c) No, es un documento de constancia.", "d) No, es una resolución típica."], c: 0, e: "Tabla 1.2.2.B: 4. Documentos de Comunicación -> Con destinatario indeterminado -> Boletines oficiales." },
                { q: "Una providencia judicial:", options: ["a) Decide el pleito.", "b) Tiene por objeto la ordenación material del proceso.", "c) Exige firma del Rey.", "d) Es lo mismo que un auto."], c: 1, e: "Apartado 1.2.4: 'Providencias: tienen por objeto la ordenación material del proceso'." },
                { q: "Una sentencia en el ámbito judicial:", options: ["a) Ordena materialmente el proceso.", "b) Decide incidentes procesales.", "c) Decide el pleito.", "d) Es el borrador del acuerdo."], c: 2, e: "Apartado 1.2.4: 'Sentencias: deciden el pleito'." },
                { q: "¿Pueden las Comunidades Autónomas mantener su propia plataforma de archivo electrónico único?", options: ["a) No, está totalmente prohibido.", "b) Sí, pero deben justificar ante el Ministerio de Función Pública que prestan el servicio de un modo más eficiente.", "c) Sí, sin ningún requisito.", "d) Solo si su población supera los 5 millones."], c: 1, e: "Apartado 3.1.3: 'justifique ante el Ministerio competente en materia de Función Pública que puede prestar el servicio de un modo más eficiente...'." },
                { q: "¿Qué garantía deben cumplir la adhesión a medios electrónicos de archivo o el mantenimiento de propios (esquemas aplicables)?", options: ["a) Esquema Nacional de Salud.", "b) Esquema Nacional de Interoperabilidad y Esquema Nacional de Seguridad.", "c) Solo normativa municipal.", "d) ISO 9001 exclusivamente."], c: 1, e: "Apartado 3.1.3 y 3.1.4: Cumplir con 'Esquema Nacional de Interoperabilidad, el Esquema Nacional de Seguridad'." },
                { q: "Sobre las copias simples:", options: ["a) La reproducción la hace la Administración competente.", "b) La hace un particular que no tiene autoridad para garantizar la exactitud.", "c) Tienen la misma validez legal que un notario.", "d) Son el original."], c: 1, e: "Apartado 1.3.1.a: 'Simples: la reproducción la hace un particular que no tiene autoridad para garantizar la exactitud'." },
                { q: "Personal habilitado para expedir copias auténticas:", options: ["a) Solo funcionarios de carrera en servicios especiales.", "b) Solo interinos.", "c) Podrán ser habilitados tanto el personal funcionario de carrera como interino, en servicio activo.", "d) Personal laboral únicamente."], c: 2, e: "Apartado 1.3.1: 'Podrán ser habilitados tanto el personal funcionario de carrera como interino, en servicio activo...'." },
                { q: "La transferencia de un registro que requiere pago de cantidad en la presentación de documento:", options: ["a) Está prohibida.", "b) Podrá hacerse efectiva mediante transferencia dirigida a la oficina pública correspondiente.", "c) Solo se admite efectivo.", "d) Solo en la sede del Ministerio de Hacienda."], c: 1, e: "Apartado 2.1.4.C: 'Podrán hacerse efectivos mediante transferencia dirigida a la oficina pública... sin perjuicio de la posibilidad de su abono por otros medios'." },
                { q: "Un saludo o besamanos administrativo entra en la categoría de:", options: ["a) Cartas con destinatario determinado.", "b) Resoluciones de cortesía.", "c) Comunicación con destinatario indeterminado.", "d) No es un documento administrativo."], c: 2, e: "Tabla 1.2.2.B: 4. Documentación de Comunicación -> Con destinatario indeterminado -> Saludas y Besalamanos." },
                { q: "Los documentos primarios que tienen más de 5 páginas y menos de 49 son:", options: ["a) Libros.", "b) Folletos.", "c) Boletines.", "d) Normas."], c: 1, e: "Tabla 1.2.5.D: Doc. unitarios -> Folletos (más de 5 págs. y menos de 49)." },
                { q: "Los documentos que emanan de una autoridad pública son documentos:", options: ["a) Privados.", "b) Terciarios.", "c) Públicos.", "d) Personales."], c: 2, e: "Apartado 1.1.3: 'Documentos públicos: emanan de una autoridad pública'." },
                { q: "¿Quién decide la resolución motivada en la Administración?", options: ["a) El funcionario tramitador en exclusiva.", "b) El archivo intermedio.", "c) La autoridad que, según la Ley, es competente para entender el asunto de que se trate.", "d) El ciudadano."], c: 2, e: "Apartado 1.2.2.C: 'La resolución es la decisión que corresponde a la autoridad que, según la Ley, es competente...'." }
            ],
            // TEST 6
            [
                { q: "Se entiende por Archivos Instituciones culturales donde...", options: ["a) Se destruyen documentos sin interés.", "b) Se reúnen, conservan, ordenan y difunden conjuntos orgánicos.", "c) Solo se digitaliza papel.", "d) Trabajan los registradores de la propiedad."], c: 1, e: "Apartado 3.1.2: 'Se entiende por archivos las Instituciones culturales donde se reúnen, conservan, ordenan y difunden... dichos conjuntos orgánicos'." },
                { q: "Una patente es considerada un tipo de:", options: ["a) Publicación periódica (Documentos Oficiales).", "b) Documento de constancia.", "c) Libro.", "d) Fuente terciaria."], c: 0, e: "Tabla 1.2.5.D: Publ. periódicas -> Publicac. Oficiales -> Patentes." },
                { q: "¿Qué uso tienen las actas de conferencias según el temario?", options: ["a) Son inútiles por el retraso en publicación.", "b) Valen solo para responder preguntas simples.", "c) Muy válidas para disciplinas que evolucionan rápidamente y materias interdisciplinarias sin revistas propias.", "d) Es la fuente principal de patentes."], c: 2, e: "Apartado 1.2.5.E: 'Muy válidas para las disciplinas que evolucionan rápidamente y para aquellas materias interdisciplinarias que carecen de sus propias revistas'." },
                { q: "Los manuales y enciclopedias proporcionan:", options: ["a) Las últimas novedades investigadoras.", "b) Respuestas rápidas a muchas preguntas simples.", "c) Métodos prácticos de realización exclusivos.", "d) Lenguaje documental sintáctico."], c: 1, e: "Apartado 1.2.5.E: 'Obras de referencia (manuales y enciclopedias). Proporcionan respuestas rápidas a muchas preguntas simples'." },
                { q: "El valor de un documento que garantiza derechos es el:", options: ["a) Valor histórico.", "b) Valor de uso.", "c) Valor legal.", "d) Valor informativo."], c: 2, e: "Apartado 1.1.4.C: 'Legal. El documento sirve de garantía de los derechos'." },
                { q: "¿Qué incluye el concepto genérico de 'Oficio' en comunicación administrativa?", options: ["a) Edictos.", "b) Boletines.", "c) Notificación, citación, emplazamiento o requerimiento.", "d) Mociones."], c: 2, e: "Apartado 1.2.2.C: 'La palabra oficio es un término genérico. Cuando la comunicación escrita... tiene algunas notas especiales se habla de notificación, citación, emplazamiento o requerimiento'." },
                { q: "La diferencia de un documento administrativo frente a los emitidos por particulares es:", options: ["a) El color del sello.", "b) Que no producen efectos ante la administración.", "c) Que emana de un órgano administrativo.", "d) La tipografía utilizada."], c: 2, e: "Apartado 1.2.2.A: 'Sus características son: a) El documento administrativo se produce por un órgano administrativo'." },
                { q: "Según el ciclo vital de documentos, un Archivo Intermedio se sitúa en:", options: ["a) La 1ª edad.", "b) La 2ª edad.", "c) La 3ª edad.", "d) La 4ª edad."], c: 2, e: "Apartado 4.3.1: '3.ª edad: archivo Intermedio'." },
                { q: "El Archivo Central pertenece a:", options: ["a) La 1ª edad.", "b) La 2ª edad.", "c) La 3ª edad.", "d) La 4ª edad."], c: 1, e: "Apartado 4.3.1: '2.ª edad: archivo Central (Archivo de Depósito)'." },
                { q: "La consulta directa de documentos en un archivo administrativo se hace:", options: ["a) En la sala de investigación obligatoriamente.", "b) Entregando a la dependencia el documento solicitado, en calidad de préstamo, para su devolución.", "c) Regalando la copia.", "d) Mediante certificación de notario."], c: 1, e: "Apartado 4.1.1.A: 'En un archivo administrativo, se hace entregando a la dependencia el documento... en calidad de préstamo'." },
                { q: "¿Dónde se realiza la consulta directa en un Archivo Histórico?", options: ["a) En la dependencia de gestión.", "b) Por préstamo al domicilio del investigador.", "c) En la sala de investigación.", "d) Por edictos."], c: 2, e: "Apartado 4.1.1.A: 'En un archivo histórico la entrega al estudioso de la documentación solicitada se hace en la sala de investigación'." },
                { q: "El sello del archivo como medida de seguridad se debe aplicar:", options: ["a) Sobre cualquier parte escrita.", "b) En el reverso del documento exclusivamente.", "c) En el ángulo inferior izquierdo sobre margen no escrito o tinta no corrosiva.", "d) No deben usarse sellos en archivos."], c: 2, e: "Apartado 3.2.4.D: 'En el ángulo inferior izquierdo... se aplicará sobre un margen o espacio no escrito el sello'." },
                { q: "La firma o identificación en Oficinas de Asistencia por un interesado:", options: ["a) Es solo para personas jurídicas.", "b) Se realiza cuando se trate de una persona no obligada a la relación electrónica, si hay habilitación.", "c) Está prohibida por la LPDP.", "d) Sustituye al DNI físico para el resto de su vida."], c: 1, e: "Apartado 2.3.4: 'identificación o firma electrónica del interesado, cuando se trate de una persona no obligada a la relación electrónica...'." },
                { q: "Un dictamen es un documento de:", options: ["a) Resolución típica.", "b) Constancia.", "c) Instrucción.", "d) Comunicación diplomática."], c: 2, e: "Tabla 1.2.2.B: 2. Documentos Administrativos de Instrucción -> Dictámenes." },
                { q: "Los atestados forman parte de los documentos:", options: ["a) De instrucción.", "b) De comunicación.", "c) Judiciales resolutorios.", "d) De exhibición."], c: 0, e: "Tabla 1.2.2.B: 2. Documentos Administrativos de Instrucción -> Atestados." },
                { q: "Una de las funciones de un registro general u oficina de asistencia es:", options: ["a) Resolver el fondo del asunto.", "b) La realización de cotejos y expedición de copias compulsadas aportados por interesados.", "c) Firmar las providencias.", "d) Destruir los expedientes cerrados."], c: 1, e: "Apartado 2.2: Funciones... 'f) La realización de cotejos y la expedición de copias compulsadas...'." },
                { q: "Los Registros Electrónicos se comunicarán mediante interoperabilidad. Según la normativa, ¿cuándo entraron en vigor y dónde se regulan principalmente ahora?", options: ["a) 2 de abril de 2021, RD 203/2021.", "b) 2 de octubre 2016, Ley 30/1992.", "c) En 1978 en la Constitución.", "d) Están pendientes de entrar en vigor."], c: 0, e: "Apartado 2.1.2 y 2.3: 'En vigor desde el 2 de abril de 2021... Reglamento de actuación y funcionamiento del sector público por medios electrónicos (Real Decreto 203/2021)'." },
                { q: "En la ordenación alfabética, si usamos el nombre geográfico se llama:", options: ["a) Alfabético-onomástico.", "b) Geográfico puro.", "c) Alfabético-geográfico.", "d) Mixto-cronológico."], c: 2, e: "Apartado 3.2.4.C: 'Este método se puede desarrollar con... nombres geográficos (alfabético-geográfico)'." },
                { q: "El método de ordenación más utilizado en la práctica administrativa es:", options: ["a) Numérico puro.", "b) Decimal universal únicamente.", "c) Mixto.", "d) Cronológico de días sueltos."], c: 2, e: "Apartado 3.2.4.C: 'Mixto: es en definitiva la que más se utiliza y la de mayor eficacia'." },
                { q: "¿En qué casos se concederá acceso parcial a una información pública con datos protegidos?", options: ["a) Nunca, todo o nada.", "b) Si la limitación no afecta a la totalidad y no resulta información distorsionada sin sentido.", "c) Solo a investigadores históricos.", "d) Solo a jueces."], c: 1, e: "Apartado 3.1.5.B: 'se concederá el acceso parcial previa omisión de la información afectada por el límite salvo que de ello resulte una información distorsionada o que carezca de sentido'." }
            ],
            // TEST 7
            [
                { q: "En el RD 1708/2011, ¿qué describe 'Metadato' en el contexto electrónico?", options: ["a) Un disco duro de gran capacidad.", "b) Información asociada a un documento, instrumental e independiente de su contenido, para conocer sus características automatizadamente.", "c) Un código malicioso.", "d) Una firma en papel escaneada."], c: 1, e: "Apartado 3.2.2.A: 'cualquier tipo de información en forma electrónica asociada a los documentos electrónicos, de carácter instrumental e independiente... destinada al conocimiento inmediato y automatizable'." },
                { q: "Las relaciones de la AGE con los sistemas archivísticos autonómicos se regulan por:", options: ["a) Imposición del Ministerio de Cultura.", "b) Leyes orgánicas exclusivamente.", "c) Convenios de colaboración suscritos con tal fin.", "d) Normas europeas sin intervención estatal."], c: 2, e: "Apartado 3.2.2.C: 'se regularán por lo establecido en los respectivos convenios de colaboración que, con tal fin, se suscriban'." },
                { q: "Órgano adscrito al Ministerio de Cultura que es órgano de cooperación entre AAPP en materia de archivos:", options: ["a) Consejo de Cooperación Archivística.", "b) Comisión de Transparencia.", "c) Archivo Central.", "d) SIR."], c: 0, e: "Apartado 3.2.2.C: 'El Consejo de Cooperación Archivística... es el órgano de cooperación entre las Administraciones Públicas en materia de archivos'." },
                { q: "¿Quién actúa como coordinadora del Sistema de Archivos de la AGE?", options: ["a) El Archivo Histórico Nacional.", "b) La Comisión de Archivos de la Administración General del Estado.", "c) La Dirección General del Catastro.", "d) El AGA exclusivamente."], c: 1, e: "Apartado 3.2.2.D: 'La Comisión de Archivos de la Administración General del Estado actuará como coordinadora del Sistema'." },
                { q: "¿Es el Archivo de Oficina o Gestión de libre consulta para los ciudadanos con carácter general?", options: ["a) Sí, por la Ley de Transparencia.", "b) No, no son de libre consulta. La libre consulta se establece desde Archivos Centrales.", "c) Solo en horario de mañana.", "d) Sí, tras 5 días de depósito."], c: 1, e: "Apartado 4.3.1: 'Los Archivos de Gestión no son de libre consulta... la libre consulta... a partir de los Archivos Centrales'." },
                { q: "¿Recibe un Archivo de Gestión transferencias de otros archivos?", options: ["a) Sí, de los intermedios.", "b) Sí, de los históricos.", "c) No, es una dependencia productora que hace transferencias al Archivo Central, pero no recibe de otros archivos.", "d) Solo recibe transferencias numéricas."], c: 2, e: "Apartado 4.3.1: 'Es una dependencia productora que hace transferencias al Archivo Central, pero que no recibe transferencias de ningún otro archivo'." },
                { q: "¿Qué sucede con los documentos en un Archivo de Gestión si hay que realizar un expurgo?", options: ["a) Se queman todos.", "b) Afecta solo a las copias, no a originales.", "c) Se llevan al notario.", "d) Ninguna es correcta."], c: 1, e: "Apartado 4.3.3: 'En los Archivos de Gestión el expurgo no alcanza a los documentos originales, sino únicamente a las copias'." },
                { q: "La clasificación Decimal Universal se emplea muy especialmente en:", options: ["a) Registros judiciales.", "b) Archivos policiales.", "c) Bibliotecas.", "d) Archivos intermedios."], c: 2, e: "Apartado 3.2.4.C: 'Clasificación Decimal Universal que se emplea muy especialmente en bibliotecas'." },
                { q: "La definición legal de documento del art. 49 LPHE:", options: ["a) Solo incluye texto.", "b) Excluye explícitamente cualquier imagen.", "c) Incluye expresión gráfica, sonora o en imagen.", "d) Excluye expresamente soportes informáticos."], c: 2, e: "Apartado 1.1.2.a: 'y cualquier otra expresión gráfica, sonora o en imagen...'." },
                { q: "Los documentos generados por entidades o asociaciones sindicales son Patrimonio Documental si su antigüedad supera:", options: ["a) 20 años.", "b) 30 años.", "c) 40 años.", "d) 100 años."], c: 2, e: "Apartado 1.1.2.b: 'antigüedad superior a los cuarenta años generados... entidades y asociaciones de carácter político, sindical o religioso'." },
                { q: "El documento que tiene la consideración de acto formal de intimación para entregar o dejar de hacer algo es:", options: ["a) Notificación.", "b) Emplazamiento.", "c) Requerimiento.", "d) Dictamen."], c: 2, e: "Apartado 1.2.2.C: 'Requerimiento: es un acto formal de intimación que se hace a alguna persona para que entregue, haga o deje de hacer alguna cosa'." },
                { q: "Un certificado de últimas voluntades es un documento:", options: ["a) De constancia externa.", "b) De constancia interna atípico.", "c) Resolutorio típico.", "d) De exhibición."], c: 1, e: "Tabla 1.2.2.B: 3. Documentos Administrativos de Constancia -> Atípicos -> Certificados (De últimas Voluntades)." },
                { q: "Los billetes del Banco de España se clasifican como:", options: ["a) Documentos atípicos de instrucción.", "b) Documentos de crédito.", "c) Documentos de exhibición.", "d) No son documentos de la administración."], c: 1, e: "Tabla 1.2.2.B: 5. Otros documentos -> Documentos de crédito." },
                { q: "¿En qué casos se podrá autorizar el acceso a información con datos biométricos o de infracciones penales sin reprensión pública?", options: ["a) Si han pasado 5 años.", "b) Solo si hay consentimiento expreso del afectado o amparo por norma con rango de ley.", "c) Con ponderación de interés general es suficiente.", "d) Nunca."], c: 1, e: "Apartado 3.1.5.B: 'datos genéticos o biométricos... el acceso solo se podrá autorizar en caso de que se cuente con el consentimiento expreso del afectado o si aquel estuviera amparado por una norma con rango de ley'." },
                { q: "Las Administraciones públicas mantendrán actualizada una relación de:", options: ["a) Todos sus funcionarios con nombre y DNI.", "b) Sus expedientes secretos.", "c) Las oficinas en las que se prestará asistencia para la presentación electrónica de documentos.", "d) Los salarios exactos de sus políticos."], c: 2, e: "Apartado 2.1.4.C: 'hacer pública y mantener actualizada una relación de las oficinas en las que se prestará asistencia...'." },
                { q: "Un Salvaconducto o Pasaporte es un documento:", options: ["a) De constancia externa de exhibición.", "b) De instrucción diplomática.", "c) Privado.", "d) Parlamentario."], c: 0, e: "Tabla 1.2.2.B: Documentos de exhibición -> Pasaporte, Salvaconducto." },
                { q: "Una carta credencial entra en los documentos de comunicación en formato:", options: ["a) Oficios.", "b) Cartas diplomáticas / típicas.", "c) Notas internas.", "d) Edictos."], c: 1, e: "Tabla 1.2.2.B: 4. Documentación de Comunicación -> Cartas -> Típicas (adm. ext.) -> Cartas credenciales." },
                { q: "La eliminación de documentos electrónicos del Archivo Único:", options: ["a) Debe ser autorizada de acuerdo a lo dispuesto en la normativa aplicable.", "b) Es automática cada 5 años.", "c) Es competencia del informático jefe.", "d) Está prohibida perpetuamente."], c: 0, e: "Apartado 3.1.3: 'La eliminación de dichos documentos deberá ser autorizada de acuerdo a lo dispuesto en la normativa aplicable'." },
                { q: "¿A quién corresponde la digitalización de documentos aportados presencialmente por el interesado?", options: ["a) Al notario del Estado.", "b) A la oficina de asistencia en materia de registros.", "c) Al propio ciudadano antes de ir.", "d) A los archivos intermedios."], c: 1, e: "Apartado 2.1.4.C: 'deberán ser digitalizados por la oficina de asistencia en materia de registros...'." },
                { q: "Si la resolución procede de un órgano colegiado en vez de unipersonal, la decisión suele denominarse:", options: ["a) Providencia colegiada.", "b) Auto.", "c) Acuerdo.", "d) Moción."], c: 2, e: "Apartado 1.2.2.C: 'La decisión... que procede de un órgano colegiado... se denomina acuerdo, en lugar de resolución'." }
            ],
             // TEST 8
            [
                { q: "Se consideran 'Documentos Parlamentarios' en materia legislativa:", options: ["a) Mociones de censura.", "b) Interpelaciones.", "c) Leyes y proposiciones de ley.", "d) Mensajes del Rey."], c: 2, e: "Apartado 1.2.3: 'en materia legislativas: leyes, proposiciones de ley y convalidación...'" },
                { q: "¿En qué ley y artículo se establece el derecho de acceso ciudadano a archivos y registros salvo excepciones relativas a defensa, delitos o intimidad?", options: ["a) Ley 39/2015, art 1.", "b) Constitución Española, art 105.", "c) LPHE, art 49.", "d) RD 203/2021, art 40."], c: 1, e: "Apartado 3.1.5.A: 'Según el art. 105 de la Constitución, la ley regulará el acceso...'." },
                { q: "¿Quién elabora el cuadro de clasificación de una serie documental de un Ministerio?", options: ["a) El Archivo de Gestión.", "b) El AGA.", "c) El Archivo Central.", "d) El Archivo Histórico."], c: 2, e: "Apartado 3.2.2.D (Funciones del Archivo Central): 'Llevar a cabo el proceso de identificación de series y elaborar el cuadro de clasificación'." },
                { q: "¿Qué hace un archivo intermedio con respecto a las resoluciones de eliminación aprobadas?", options: ["a) Las anula si no le gustan.", "b) Las aplica, garantizando su efectiva destrucción tramitando expedientes.", "c) Las envía al Archivo Central de vuelta.", "d) Las devuelve al ciudadano."], c: 1, e: "Apartado 3.2.2.D (Archivo Intermedio): 'Aplicar... las resoluciones adoptadas por la Comisión Superior... relativas a la eliminación de documentos, garantizando su efectiva destrucción'." },
                { q: "¿Dónde está la sede del Archivo Histórico de la Nobleza creado en 2017?", options: ["a) Sevilla.", "b) Toledo.", "c) Salamanca.", "d) Barcelona."], c: 1, e: "Apartado 3.2.2.D: 'Archivo Histórico de la Nobleza, con sede en Toledo'." },
                { q: "¿Qué archivo aplica programas de reproducción en soportes alternativos para fomentar difusión y evitar deterioro de originales históricos?", options: ["a) Archivo de oficina.", "b) Archivo Histórico Nacional.", "c) Registro Electrónico.", "d) Dirección Electrónica Habilitada única."], c: 1, e: "Apartado 3.2.2.D (Archivo Histórico Nacional): 'Aplicar programas de reproducción de documentos en soportes alternativos para garantizar la conservación...'." },
                { q: "¿Cuáles son las etapas del Análisis Documental?", options: ["a) 1. Entrada 2. Tratamiento 3. Salida.", "b) 1. Sellado 2. Foliación 3. Digitalización.", "c) 1. Archivo 2. Registro 3. Expurgo.", "d) 1. Recepción 2. Expediente 3. Resolución."], c: 0, e: "Tabla 1.2.5.A: El cuadro muestra las fases: 1. Entrada 2. Tratamiento 3. Salida." },
                { q: "El 'lenguaje documental' se utiliza en la indización para:", options: ["a) Que el documento sea bonito.", "b) Traducir el lenguaje natural y acomodarlo para facilitar búsquedas.", "c) Solo escribir en inglés.", "d) Encriptar el documento."], c: 1, e: "Apartado 1.2.5.C: 'El lenguaje documental supone la previa existencia de un vocabulario estereotipado... traducir el lenguaje natural del autor y acomodarlo al lenguaje documental'." },
                { q: "Un 'Bando' o 'Edicto' es un anuncio para general conocimiento cuando:", options: ["a) Es un secreto de estado.", "b) No sea posible hacer la notificación personalmente.", "c) El expediente está en primera edad.", "d) Hay fondos europeos implicados."], c: 1, e: "Apartado 1.2.2.C: 'Edictos: son anuncios que tienen lugar cuando quiere darse general conocimiento de unos hechos o cuando no sea posible hacer la notificación personalmente'." },
                { q: "La diligencia que da fe de la transcripción literal de un documento la conocemos como:", options: ["a) Minuta literal.", "b) Copia certificada.", "c) Informe atípico.", "d) Moción."], c: 1, e: "Apartado 1.2.2.C: 'copias certificadas que son la reproducción literal de un documento en la que figura diligencia por la que se da fe'." },
                { q: "Si la LPHE exige antigüedad superior a 100 años para formar parte del Patrimonio Documental de un documento particular físico, a los documentos de asociaciones culturales exige:", options: ["a) Más de 10 años.", "b) Más de 40 años.", "c) Más de 150 años.", "d) Cualquier tiempo desde su firma."], c: 1, e: "Apartado 1.1.2.b: 'con una antigüedad superior a los cuarenta años generados... por las entidades... culturales y educativas'." },
                { q: "Las comunicaciones administrativas por medios electrónicos (Art. 41 RD 203/2021) comunicarán, entre otros:", options: ["a) El color del registro físico.", "b) La fecha y hora efectiva de inicio de cómputo de plazos que haya de cumplir la Administración.", "c) El nombre de la mascota del instructor.", "d) Nada, el ciudadano debe averiguarlo."], c: 1, e: "Apartado 2.3.5.a: 'La fecha y, en su caso, hora efectiva de inicio del cómputo de plazos que haya de cumplir la Administración...'." },
                { q: "También se comunicará por medios electrónicos al ciudadano obligado a relacionarse así:", options: ["a) La solicitud de informe preceptivo y su recepción.", "b) Cualquier chisme del ministerio.", "c) Solo las resoluciones finales y nunca los trámites.", "d) La edad del instructor."], c: 0, e: "Apartado 2.3.5.e: 'La solicitud de un informe preceptivo a un órgano... y la recepción, en su caso, de dicho informe'." },
                { q: "Una Ejecutoria Judicial es:", options: ["a) Una medida cautelar.", "b) Un auto sin resolver.", "c) Documento público y solemne en que se consigna una sentencia firme.", "d) La minuta de un juez."], c: 2, e: "Apartado 1.2.4: 'Ejecutoria: documento público y solemne en que se consigna una sentencia firme'." },
                { q: "La traducción de un texto original al lenguaje de palabras clave representativas sin normalización rígida se conoce como:", options: ["a) Indización documental estructurada.", "b) Indización con lenguaje natural.", "c) Catalogación topográfica.", "d) Datación."], c: 1, e: "Apartado 1.2.5.C: 'La indización con lenguaje natural supone la localización en el texto mismo de las llamadas palabras-clave representativas'." },
                { q: "Los boletines de sumarios se usan principalmente para:", options: ["a) Conocer la literatura más antigua.", "b) Buscar literatura periódica para informarse de la literatura más reciente.", "c) Firmar pactos ministeriales.", "d) Evaluar personal laboral."], c: 1, e: "Apartado 1.2.5.E: 'Boletines de sumarios... principales instrumentos para las búsquedas de literatura periódica... para informarse de la literatura más reciente'." },
                { q: "¿En qué consiste la función de 'Garante Legal' del Registro?", options: ["a) En que la policía lo vigila.", "b) Garantizar legalidad para Administración y administrados basándose en los asientos cronológicos.", "c) En enviar a notarios todos los escritos.", "d) Ninguna es correcta."], c: 1, e: "Apartado 2.2: Funciones... 'c) Función de garante legal para Administración y administrados'." },
                { q: "Las cantidades a pagar en un registro público:", options: ["a) Exigen siempre personación con el dinero justo en metálico.", "b) Pueden hacerse efectivas por transferencia.", "c) Se pagan siempre a posteriori de la resolución.", "d) Solo se cobran en las capitales de provincia."], c: 1, e: "Apartado 2.1.4.C: 'Podrán hacerse efectivos mediante transferencia dirigida a la oficina pública correspondiente cualesquiera cantidades'." },
                { q: "¿Puede un ciudadano exigir a la Administración un documento ya en poder de las AAPP?", options: ["a) Sí, tiene que pedirlo cada vez que lo use.", "b) Tiene derecho a no presentar datos y documentos que ya estén en su poder.", "c) Depende de la Comunidad Autónoma exclusivamente.", "d) Solo si paga la tasa de archivo."], c: 1, e: "Apartado 1.3.2 (Art. 53): Derecho 'A no presentar datos y documentos no exigidos... que ya se encuentren en poder de las Administraciones Públicas'." },
                { q: "¿Cuántos Archivos Centrales hay por Ministerio?", options: ["a) Ninguno, solo el AGA.", "b) Existen en los Ministerios y organismos públicos.", "c) Solo en Defensa e Interior.", "d) Uno por cada Ayuntamiento."], c: 1, e: "Apartado 3.2.2.D: 'Son aquellos archivos existentes en los Ministerios y organismos públicos para la custodia de los documentos...'." }
            ],
            // TEST 9
            [
                { q: "La clasificación orgánica toma como base para subdividir grupos:", options: ["a) Los temas de los documentos.", "b) Las fechas.", "c) El órgano del que proceden los documentos.", "d) El abecedario."], c: 2, e: "Apartado 3.2.4.C: 'Orgánico: tiene en cuenta el órgano del que proceden los documentos'." },
                { q: "Si la clasificación toma en consideración las diversas competencias de cada órgano, es una clasificación:", options: ["a) Funcional.", "b) Orgánica.", "c) Decimal.", "d) Topográfica."], c: 0, e: "Apartado 3.2.4.C: 'Funcional: toma en consideración las diversas competencias o funciones de cada órgano'." },
                { q: "¿Qué valor domina en los Archivos Históricos frente al administrativo?", options: ["a) Informativo rápido.", "b) Legal inmediato.", "c) El valor histórico o secundario.", "d) Financiero."], c: 2, e: "Se deduce del Apartado 1.1.4 (los años los convierten en docs para la historia perdiendo función administrativa) y 4.3.1." },
                { q: "La comunicación del documento en un servicio de archivo se puede realizar mediante:", options: ["a) Ofreciendo directamente el documento, mediante copias o exposiciones.", "b) Destruyendo el original y entregando un pen drive.", "c) Traducción oral sin enseñar papel.", "d) Publicación obligatoria en BOE."], c: 0, e: "Apartado 4.1: 'Comunicación del documento: Ofreciendo directamente... Mediante copias... Exposiciones'." },
                { q: "Según el temario, ¿el servicio mediante reproducciones (fotocopia/digitalización) está propiciado por?", options: ["a) El exceso de dinero del Estado.", "b) Como medida preventiva por el deterioro derivado del aumento de consulta directa de series demandadas.", "c) La obligación de esconder los originales.", "d) Por orden del Registro Central."], c: 1, e: "Apartado 4.1.1.A: 'como medida preventiva se está practicando el servicio mediante reproducciones (microfilm, fotocopias, digitalización)'." },
                { q: "Un recibo de presentación de documentos en un registro es considerado un documento de constancia de tipo:", options: ["a) Interno.", "b) Judicial.", "c) Mixto, recibo personal típico.", "d) Histórico."], c: 2, e: "Tabla 1.2.2.B: 3. Documentos Constancia -> Mixtos -> Recibos y resguardos -> Personales Típicos -> Presentación de docs en Registro." },
                { q: "Las oficinas consulares de España en el extranjero:", options: ["a) No admiten registros para la AGE.", "b) Cobran comisión por cada folio registrado.", "c) Son lugares válidos para la presentación de documentos que los interesados dirijan a AAPP.", "d) Solo registran documentos de ciudadanos extranjeros."], c: 2, e: "Apartado 2.1.4.C (Art. 16.4 LPA): Se pueden presentar 'En las representaciones diplomáticas u oficinas consulares de España en el extranjero'." },
                { q: "Las mociones de censura o cuestiones de confianza son documentos producidos por:", options: ["a) Juzgados de instrucción.", "b) La Casa Real.", "c) Las Cortes (documentos parlamentarios de control).", "d) Los ministerios ejecutivos."], c: 2, e: "Apartado 1.2.3: 'Documentos parlamentarios... materia de control: moción de censura (Congreso), cuestión de confianza...'." },
                { q: "Los estadillos o listas de admitidos en oposiciones son:", options: ["a) Documentos resolutorios ejecutivos.", "b) Documentos de instrucción probatorios.", "c) Documentos de constancia mixtos (Relaciones, listas).", "d) Comunicaciones telegráficas."], c: 2, e: "Tabla 1.2.2.B: Constancia -> Mixtos -> Índices, relaciones, listas -> Personales Típicos -> Listas de admitidos." },
                { q: "Si detectamos que un documento electrónico debe enviarse a otro órgano durante la tramitación de un expediente, la normativa exige que:", options: ["a) Se formatee en PDF obligatoriamente.", "b) Se haga de acuerdo con lo previsto en el Esquema Nacional de Interoperabilidad.", "c) Se mande en papel paralelamente.", "d) No requiere norma."], c: 1, e: "Apartado 3.3.2: 'se hará de acuerdo con lo previsto en el Esquema Nacional de Interoperabilidad y en las correspondientes Normas Técnicas'." },
                { q: "¿Es un 'informe preceptivo solicitado antes de la resolución' parte del expediente administrativo electrónico?", options: ["a) No, es información auxiliar.", "b) Sí, es una excepción que sí forma parte del expediente.", "c) Depende del volumen de hojas.", "d) Solo si es vinculante."], c: 1, e: "Apartado 3.3.2: 'No formará parte del expediente administrativo la información que tenga carácter auxiliar... salvo que se trate de informes, preceptivos y facultativos, solicitados antes de la resolución'." },
                { q: "En la ordenación alfabética, ¿qué palabra se adopta para ordenar?", options: ["a) La última palabra del texto.", "b) Adoptado para cada documento la palabra que ha de distinguirse de las demás.", "c) Siempre la fecha escrita en letra.", "d) La firma."], c: 1, e: "Apartado 3.2.4.C: 'adoptado para cada documento la palabra que ha de distinguirse de las demás, se colocan... según el lugar que... corresponde'." },
                { q: "El archivo que reúne fondos relativos al periodo comprendido entre 1936 y 1978 en Salamanca se llama:", options: ["a) AGA.", "b) Archivo Histórico de Salamanca.", "c) Centro Documental de la Memoria Histórica.", "d) Archivo General Militar."], c: 2, e: "Apartado 3.2.2.D: 'Centro Documental de la Memoria Histórica... finalidad de reunir y recuperar todos los fondos documentales... relativos al periodo histórico comprendido entre 1936 y 1978'." },
                { q: "¿A qué Ministerio están adscritos funcionalmente los Archivos Históricos y el AGA descritos en el temario de la AGE?", options: ["a) Ministerio de Hacienda.", "b) Ministerio del Interior.", "c) Ministerio de Administraciones Públicas.", "d) Ministerio competente en materia de Cultura."], c: 3, e: "Apartado 3.2.2.D: Al describir AGA y Archivos Históricos indica 'adscrito al Ministerio competente en materia de Cultura'." },
                { q: "Según la Constitución y Ley de Transparencia, el derecho de acceso no se limita por:", options: ["a) Seguridad Nacional.", "b) El color político del gobierno de turno.", "c) Prevención e investigación de ilícitos penales.", "d) Tutela judicial efectiva."], c: 1, e: "Apartado 3.1.5.B: Enumera varios casos graves (a, c, d), el color político no es un límite legal." },
                { q: "Cuando a la ponderación del interés en divulgar una información pública le influye la antigüedad documental, la ley cita expresamente el plazo del:", options: ["a) Art 57 LPHE.", "b) Art 1 CE.", "c) Art 16 LPA.", "d) Código Civil."], c: 0, e: "Apartado 3.1.5.B: Criterios a considerar: 'El menor perjuicio a los afectados derivado del transcurso de los plazos establecidos en el art. 57 de la Ley 16/1985...'." },
                { q: "Un telegrama es clasificado en la Administración como documento de:", options: ["a) Constancia telefónica.", "b) Comunicación, con destinatario nominado atípica/única.", "c) Resolución no normativa.", "d) Instrucción incidental."], c: 1, e: "Tabla 1.2.2.B: 4. Comunicación -> Notas -> Únicas -> Telegramas." },
                { q: "El término 'docere' del que proviene etimológicamente documento significa:", options: ["a) Ocultar.", "b) Enseñar, instruir.", "c) Papel.", "d) Tinta."], c: 1, e: "Apartado 1.1.1: 'del verbo docere que significa enseñar, instruir'." },
                { q: "Los manuales y Tesis Doctorales son documentos:", options: ["a) Terciarios.", "b) Secundarios mixtos.", "c) Primarios (Unitarios).", "d) Publicaciones periódicas."], c: 2, e: "Tabla 1.2.5.D: Doc. unitarios -> Manuales, Tesis doctorales." },
                { q: "Las notas y borradores en la tramitación del expediente:", options: ["a) Se guardan 100 años obligatoriamente.", "b) Forman el cuerpo vinculante del expediente final.", "c) Se consideran información de carácter auxiliar que no forma parte del expediente.", "d) Se envían al juez de lo contencioso siempre."], c: 2, e: "Apartado 3.3.2: 'No formará parte del expediente administrativo la información que tenga carácter auxiliar... notas, borradores...'." }
            ],
            // TEST 10
            [
                { q: "Una certificación de descubierto es un documento administrativo de:", options: ["a) Comunicación.", "b) Resolución atípica.", "c) Constancia interna atípica.", "d) Instrucción probatoria."], c: 2, e: "Tabla 1.2.2.B: 3. Constancia -> Atípicos -> Certificados (De descubierto)." },
                { q: "Respecto a los documentos de los ciudadanos presentados por medios electrónicos, las AAPP:", options: ["a) Obligan a todos por igual.", "b) Pueden determinar formatos y estándares siempre que cumplan con el Esquema Nacional de Interoperabilidad.", "c) Solo admiten PDF de Adobe.", "d) No pueden restringir el tamaño en bytes."], c: 1, e: "Apartado 2.3.3: 'podrán determinar los formatos y estándares a los que deberán ajustarse... siempre que cumplan con lo previsto en el Esquema Nacional de Interoperabilidad'." },
                { q: "¿En qué Registro Electrónico se permite depositar 'cualquier solicitud, escrito o comunicación dirigida a cualquier Administración Pública'?", options: ["a) Solo en correos.", "b) En los registros electrónicos plenamente interoperables (Art 37 RD 203/2021).", "c) Únicamente en los municipales.", "d) No se permite si no hay formulario normalizado."], c: 1, e: "Apartado 2.3.1: 'Los registros electrónicos admitirán... b) Cualquier solicitud, escrito o comunicación distinta de los mencionados... dirigido a cualquier Administración'." },
                { q: "¿Qué ocurre con los registros que exigen modelos normalizados preestablecidos?", options: ["a) Se admiten en los registros electrónicos como documentos electrónicos normalizados.", "b) Están derogados.", "c) Requieren compra del modelo en estancos.", "d) No tienen validez jurídica."], c: 0, e: "Apartado 2.3.1.a: 'Documentos electrónicos normalizados correspondientes a los servicios, procedimientos... cumplimentados de acuerdo con formatos preestablecidos'." },
                { q: "¿Puede el Registro REG-AGE dar validez a presentaciones hacia la Administración Autonómica?", options: ["a) No, solo para el Estado.", "b) Sí, las anotaciones en el Registro General de la AGE tendrán plena eficacia y validez para todas las Administraciones Públicas.", "c) Solo para Comunidades de menos de 1 millón de habitantes.", "d) Solo si la CCAA lo autoriza caso por caso."], c: 1, e: "Apartado 2.3.2: 'Las anotaciones en el Registro General de la Administración General del Estado tendrán plena eficacia y validez para todas las Administraciones Públicas'." },

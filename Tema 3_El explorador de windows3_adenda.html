                { q: "Se puede acceder a la aplicación Configuración mediante el atajo de teclado:", o: ["Windows + C", "Windows + I", "Windows + U", "Windows + R"], c: 1, e: "Utilizando el atajo de teclado Windows + I." },
                { q: "El Panel de control tradicional en Windows 11:", o: ["Ha sido completamente borrado", "Sigue disponible para tareas de administración que aún no han sido migradas completamente a la aplicación Configuración", "Sólo se puede acceder con el Símbolo del Sistema", "Se llama ahora 'Configuración Antigua'"], c: 1, e: "El Panel de control... continúa estando disponible en Windows 11... para tareas y opciones que aún no han sido migradas completamente a la aplicación Configuración." },
                { q: "¿Qué información se muestra en la parte superior del panel Inicio de la aplicación Configuración?", o: ["Solo el reloj del sistema", "La información de la cuenta de usuario (nombre, imagen, correo asociado)", "Un listado de los discos duros", "El estado del Firewall de Windows"], c: 1, e: "En la parte superior del panel se muestra la información de la cuenta de usuario con la que se ha iniciado sesión, incluyendo el nombre, la imagen..." },
                { q: "En el panel Inicio de Configuración de W11, el apartado 'Configuración recomendada' incluye:", o: ["Solo enlaces a la tienda de Microsoft", "Accesos directos dinámicos a opciones utilizadas recientemente (Almacenamiento, Inicio, etc.)", "Opciones exclusivas de desarrollador", "El God Mode activado"], c: 1, e: "...el apartado Configuración recomendada, que ofrece accesos directos dinámicos a opciones utilizadas recientemente... como Almacenamiento, Inicio y apagado..." },
                { q: "Desde el bloque 'Personalizar el dispositivo' en el panel Inicio de Configuración se permite cambiar rápidamente:", o: ["El fondo de escritorio, el tema y el modo de color (claro u oscuro)", "La contraseña del usuario", "La configuración del router Wi-Fi", "El idioma del sistema"], c: 0, e: "Aparece el bloque Personalizar el dispositivo, que permite cambiar rápidamente el fondo de escritorio, el tema y el modo de color (claro u oscuro)." },
                { q: "En Windows 11, ¿qué vista se abre por defecto al abrir el Explorador de Archivos?", o: ["Este equipo", "Vista de Red", "La vista Inicio", "Acceso Público"], c: 2, e: "En Windows 11, el Explorador de Archivos se abre por defecto en la vista Inicio, que asume el papel que tradicionalmente desempeñaba Acceso rápido." },
                { q: "El antiguo 'Acceso rápido' ha sido sustituido en funcionalidad principal por:", o: ["OneDrive", "La vista 'Inicio'", "God Mode", "Panel de navegación secundario"], c: 1, e: "...la vista Inicio, que asume el papel que tradicionalmente desempeñaba Acceso rápido." },
                { q: "¿Qué contenido se muestra principalmente en la vista 'Inicio' del Explorador?", o: ["Las herramientas administrativas de Windows", "Solo los discos duros locales", "Carpetas del perfil frecuentes, archivos recientes y favoritos", "La configuración del panel de control"], c: 2, e: "Desde esta vista se accede principalmente a: Carpetas del perfil de usuario utilizadas con mayor frecuencia... Archivos recientes... Elementos marcados como favoritos." },
                { q: "¿Es posible anclar elementos manualmente a la vista Inicio/Acceso rápido?", o: ["Sí, se pueden tener accesos anclados manualmente", "No, lo decide el sistema automáticamente", "Solo se pueden anclar archivos, no carpetas", "Solo si eres administrador del dominio"], c: 0, e: "Desde esta vista se accede principalmente a... Accesos anclados manualmente." },
                { q: "¿Qué elemento no pertenece a la vista 'Este equipo'?", o: ["Unidades externas conectadas", "Discos duros internos", "Dispositivos y unidades", "Historial de archivos recientes"], c: 3, e: "Este equipo gestiona dispositivos de almacenamiento (Unidades del sistema, discos, unidades externas, redes). Los archivos recientes están en la vista Inicio." },
                { q: "Se puede acceder a la configuración del equipo desde el menú contextual del botón Inicio, que se abre pulsando:", o: ["Win+C", "Win+X", "Win+R", "Win+E"], c: 1, e: "Desde el menú contextual del botón Inicio (Win+X)." },
                { q: "La nueva interfaz de Configuración de Windows 11, en su lado izquierdo, presenta:", o: ["El panel de control clásico", "El menú principal de categorías de Configuración", "La papelera de reciclaje", "El administrador de discos"], c: 1, e: "En el panel lateral izquierdo se encuentra el menú principal de categorías de Configuración, que sustituye al modelo clásico del Panel de control." },
                { q: "¿Qué se muestra junto a los datos de usuario en la pantalla principal de Configuración para comprobaciones inmediatas?", o: ["Accesos rápidos al estado de la red y a Windows Update", "Un escaneo del antivirus Defender", "Los procesos activos del sistema", "El espacio libre de la unidad D:"], c: 0, e: "El panel Inicio muestra accesos rápidos al estado de la red y a Windows Update, permitiendo comprobar de forma inmediata si el sistema está actualizado." },
                { q: "¿Para qué sirve el menú 'Win+X'?", o: ["Para bloquear el equipo", "Para abrir un menú contextual en el botón Inicio con accesos como Administrador de tareas o Configuración", "Para buscar archivos", "Para cerrar la sesión"], c: 1, e: "Haciendo clic con el botón derecho del ratón sobre el botón Inicio (menú Win+X) y eligiendo..." },

                { q: "Si deseo configurar qué aplicaciones arrancan automáticamente al iniciar Windows desde Configuración, iré a:", o: ["Arranque del sistema (Sistema)", "Aplicaciones (Aplicaciones de inicio)", "Cuentas (Login)", "Windows Update"], c: 1, e: "Aplicaciones... gestionar aplicaciones de inicio y configurar características opcionales del sistema." },

            // TEST 9: El Administrador de Tareas (Tema 6)
            [
                { q: "El Administrador de tareas de Windows 11 permite:", o: ["Solo ver la hora del sistema", "Supervisar y gestionar programas, procesos y servicios, y analizar el rendimiento en tiempo real", "Modificar el registro base automáticamente", "Crear particiones en el disco duro"], c: 1, e: "El Administrador de tareas... permite supervisar y gestionar los programas, procesos y servicios que se ejecutan... así como analizar el rendimiento y el consumo de recursos." },
                { q: "¿Qué indica un porcentaje elevado de utilización de la CPU en el Administrador de tareas?", o: ["Que el equipo funciona muy bien", "Mayor carga de trabajo del procesador, mayor consumo de recursos y de energía", "Que la memoria RAM está llena", "Que el disco duro está fragmentado"], c: 1, e: "El porcentaje de utilización de la CPU indica la carga de trabajo... cuanto mayor sea dicho porcentaje, mayor será el consumo de recursos y energía del sistema." },
                { q: "¿Cuál de estos métodos abre directamente el Administrador de tareas de un solo paso?", o: ["Pulsando Ctrl + Shift + Esc", "Pulsando Alt + Tab", "Pulsando Windows + L", "Pulsando F1"], c: 0, e: "El Administrador de tareas puede abrirse mediante... Pulsando Ctrl + Shift + Esc." },
                { q: "Al pulsar Ctrl + Alt + Supr para abrir el Administrador de tareas, el usuario debe:", o: ["Pulsarlo dos veces", "Seleccionar 'Administrador de tareas' en la pantalla de seguridad", "Mantener pulsado Enter", "Hacerlo con el equipo apagado"], c: 1, e: "Pulsando Ctrl + Alt + Supr y seleccionando Administrador de tareas." },
                { q: "¿Es posible abrir el Administrador de tareas desde el botón Inicio?", o: ["Sí, haciendo clic con el botón derecho del ratón (Win+X) y eligiéndolo", "No, solo con el teclado", "Solo si es cuenta de Administrador", "Sí, pero requiere God Mode"], c: 0, e: "Haciendo clic con el botón derecho del ratón sobre el botón Inicio (menú Win+X) y eligiendo Administrador de tareas." },

                { q: "¿Qué funcionalidad novedosa de Windows 11 en el Administrador reduce el impacto de procesos sobre el rendimiento y consumo energético?", o: ["Modo reposo profundo", "Modo de eficiencia", "Task Killer", "Gestión de energía térmica"], c: 1, e: "...aplicar el Modo de eficiencia, una funcionalidad introducida en Windows 11 que reduce el impacto de determinados procesos sobre el rendimiento y el consumo energético..." },
                { q: "La sección 'Rendimiento' del Administrador de tareas muestra gráficos en tiempo real de:", o: ["Temperaturas de los ventiladores", "CPU, memoria, discos, red y GPU", "Los usuarios conectados por RDP", "Historial de navegadores web"], c: 1, e: "Rendimiento: presenta gráficos en tiempo real del uso global de los recursos del sistema, incluyendo CPU, memoria, discos, red y GPU." },
                { q: "La sección que muestra información del consumo de CPU y red de las aplicaciones de Microsoft Store de la cuenta actual es:", o: ["Procesos", "Usuarios", "Detalles", "Historial de aplicaciones"], c: 3, e: "Historial de aplicaciones: ofrece información sobre el consumo de CPU y red de las aplicaciones... principalmente aplicaciones de Microsoft Store." },
                { q: "Para habilitar o deshabilitar programas que se inician automáticamente al arrancar Windows para mejorar el inicio, usaremos la sección:", o: ["Servicios", "Arranque veloz", "Aplicaciones de arranque", "Procesos del sistema"], c: 2, e: "Aplicaciones de arranque: permite gestionar los programas que se inician automáticamente al arrancar Windows, pudiendo habilitarlos o deshabilitarlos para mejorar el tiempo de inicio." },
                { q: "La sección 'Procesos' muestra información dividida habitualmente en:", o: ["Solo las aplicaciones activas", "Aplicaciones, procesos en segundo plano y procesos del sistema", "Procesos locales y de red remota", "Servicios detenidos"], c: 1, e: "Procesos: muestra la lista de aplicaciones en ejecución, procesos en segundo plano y procesos del sistema..." },

                { q: "La sección 'Usuarios' del Administrador de tareas se usa para:", o: ["Crear nuevos usuarios locales", "Cambiar la contraseña de la cuenta", "Mostrar las cuentas con sesión iniciada y los recursos/aplicaciones que utilizan", "Borrar perfiles antiguos"], c: 2, e: "Usuarios: muestra las cuentas de usuario que tienen sesión iniciada en el equipo, los recursos que están utilizando y las aplicaciones asociadas a cada usuario." },

                { q: "El modo de eficiencia, si se aplica a una aplicación:", o: ["Cierra la aplicación al instante", "Reduce su impacto sobre el rendimiento y consumo energético", "Aumenta la prioridad del proceso al máximo", "La desinstala del disco"], c: 1, e: "Modo de eficiencia... reduce el impacto de determinados procesos sobre el rendimiento y el consumo energético del sistema." },
                { q: "Para acceder al 'Historial de aplicaciones', ¿qué requisito o enfoque específico destaca W11?", o: ["No se puede en W11", "Es principalmente para las aplicaciones de Microsoft Store de la cuenta de usuario actual", "Debe instalarse un plugin de terceros", "Muestra aplicaciones de todas las sesiones pasadas"], c: 1, e: "Historial de aplicaciones: ofrece información sobre el consumo... para la cuenta de usuario actual, principalmente aplicaciones de Microsoft Store." }
            ],
            // TEST 10: Herramientas del Sistema y Accesorios (Temas 7 y 8)
            [
                { q: "¿Existe el grupo 'Accesorios de Windows' como carpeta organizadora en el menú Inicio de Windows 11?", o: ["Sí, exactamente igual que en Windows 10", "No existe como bloque organizado, se presentan como aplicaciones individuales", "Sí, pero se llama 'Extras de Windows'", "No, todas las aplicaciones fueron borradas"], c: 1, e: "En Windows 11 no existe un grupo denominado «Accesorios de Windows» como bloque organizado... se presentan como aplicaciones individuales." },
                { q: "¿Cuál de las siguientes aplicaciones está tradicionalmente considerada como 'Accesorio' en el texto?", o: ["Desfragmentador de discos", "Bloc de notas", "Editor del Registro", "Monitor de recursos"], c: 1, e: "Entre estas aplicaciones [Accesorios] se incluyen: Bloc de notas, Paint, Calculadora, Herramienta Recortes..." },
                { q: "La utilidad 'Conexión a Escritorio remoto' se considera:", o: ["Un Accesorio (según edición) y una Herramienta del sistema", "Un virus del sistema", "Una característica exclusiva de LINUX", "Un juego nativo"], c: 0, e: "Aparece en Accesorios ('Conexión a Escritorio remoto (según edición)') y también en las Herramientas de Windows." },
                { q: "Bajo qué denominación se agrupan las utilidades administrativas del sistema en Windows 11?", o: ["Herramientas de Windows", "Herramientas Administrativas clásicas", "Ajustes de Sistema", "Panel de Control Avanzado"], c: 0, e: "En Windows 11, las utilidades administrativas del sistema se agrupan bajo la denominación Herramientas de Windows." },
                { q: "¿Cuál es la ruta desde el Menú Inicio para acceder a las Herramientas del sistema?", o: ["Menú Inicio > Configuración > Extras", "Menú Inicio > Todas las aplicaciones > Herramientas de Windows", "Menú Inicio > Panel de control", "Menú Inicio > Ejecutar CMD"], c: 1, e: "Las Herramientas de Windows pueden localizarse mediante: Menú Inicio > Todas las aplicaciones > Herramientas de Windows." },
                { q: "La consola centralizada que integra 'Administración de discos, Visor de eventos, Servicios, etc.' se denomina:", o: ["Administración de equipos", "Consola del Sistema", "Gestión Integral", "Monitor de rendimiento"], c: 0, e: "Administración de equipos: Consola centralizada que integra varias herramientas administrativas del sistema..." },
                { q: "¿Qué utilidad analizaría la RAM del equipo para detectar fallos o reinicios inesperados?", o: ["Desfragmentador", "Monitor de recursos", "Diagnóstico de memoria de Windows", "Visor de Eventos"], c: 2, e: "Diagnóstico de memoria de Windows: Comprueba el estado de la memoria RAM del equipo para detectar errores..." },
                { q: "La herramienta que permite realizar capturas de pantalla parciales o de ventanas se llama:", o: ["Grabadora de voz", "ScreenCapture.exe", "Herramienta Recortes", "Captura Total"], c: 2, e: "Herramienta Recortes: Permite realizar capturas de pantalla completas, parciales o de ventanas concretas..." },
                { q: "Para eliminar archivos temporales y elementos innecesarios liberando espacio se usa:", o: ["Optimizador de RAM", "Liberador de espacio en disco", "Recuperación de sistema", "Defrag"], c: 1, e: "Liberador de espacio en disco: Permite eliminar archivos temporales, archivos del sistema y otros elementos innecesarios..." },
                { q: "¿Dónde podemos visualizar y modificar donde se almacenan las configuraciones más profundas de W11 y las apps (destinado a usuarios avanzados)?", o: ["En el Archivo HOSTS", "En el Editor del Registro", "En el Panel de Control Básico", "En el Mapa de caracteres"], c: 1, e: "Editor del Registro: Permite visualizar y modificar el Registro de Windows, donde se almacenan configuraciones del sistema y de las aplicaciones." },
                { q: "El 'Mapa de caracteres' es útil para:", o: ["Trazar mapas de red local", "Ver las letras de unidades disponibles", "Mostrar y copiar caracteres especiales disponibles en fuentes instaladas", "Modificar las contraseñas"], c: 2, e: "Mapa de caracteres: Muestra los caracteres especiales disponibles en las fuentes instaladas y permite copiarlos..." },
                { q: "Para automatizar la ejecución de programas en momentos concretos o bajo condiciones se usa el:", o: ["Automatizador básico", "Power Automate y Programador de tareas", "Gestor de Eventos", "Windows Defender"], c: 1, e: "Programador de tareas: Permite automatizar la ejecución de programas, scripts... Power Automate: Herramienta orientada a la automatización de tareas y flujos..." },
                { q: "¿Qué herramienta es orientada a entornos profesionales para la gestión centralizada de impresoras, colas y controladores?", o: ["Gestor de colas clásico", "Administración de impresión", "Dispositivos e impresoras basic", "Spooler Service"], c: 1, e: "Administración de impresión: Permite administrar impresoras locales y de red, colas de impresión..." },
                { q: "Para ver información detallada del hardware y entorno del software usamos:", o: ["Información del sistema", "Editor de texto", "Panel de visualización", "Herramienta Recortes"], c: 0, e: "Información del sistema: Muestra información detallada sobre el hardware, los componentes del sistema, los recursos..." },
                { q: "La herramienta 'Desfragmentar y optimizar unidades' realiza optimizaciones específicas para mantener el rendimiento en qué tipo de discos?", o: ["Solo en Floppy disks", "En discos duros magnéticos y unidades SSD", "Solo en CD-ROMs", "En redes de área local"], c: 1, e: "Desfragmentar y optimizar unidades... En discos duros realiza la desfragmentación y en unidades SSD aplica optimizaciones específicas..." },
                { q: "¿Qué herramienta de soporte técnico documenta incidencias grabando los clics del usuario?", o: ["Keylogger oficial", "Grabación de acciones de usuario", "Soporte Remoto Microsoft", "Historial de Windows"], c: 1, e: "Grabación de acciones de usuario: Herramienta de soporte técnico que registra las acciones realizadas por el usuario (clics, pulsaciones y capturas)..." },
                { q: "El reproductor clásico para reproducir audio y vídeo incluido en Herramientas de W11 se llama:", o: ["Groove Music", "Windows Media Player Legacy", "Películas y TV", "VLC Media Player"], c: 1, e: "Windows Media Player Legacy: Reproductor multimedia clásico de Windows que permite reproducir archivos..." },
                { q: "¿Qué utilidad controla el tráfico de red entrante y saliente y define reglas de seguridad?", o: ["Windows Defender Firewall", "Monitor de recursos", "Conexiones ODBC", "Servicios de red"], c: 0, e: "Windows Defender Firewall: Herramienta para administrar el cortafuegos de Windows, controlando el tráfico de red entrante y saliente..." },
                { q: "¿Qué herramienta permite diagnosticar problemas de arranque gestionando servicios y opciones de arranque del sistema?", o: ["Opciones de Internet", "Configuración del sistema (msconfig)", "Administración de equipos", "Recuperación"], c: 1, e: "Configuración del sistema: Herramienta avanzada utilizada para diagnosticar y solucionar problemas de arranque... Permite gestionar servicios, programas de inicio..." },
                { q: "¿Qué es el 'Windows PowerShell ISE' según el temario?", o: ["Un navegador web de texto", "Un entorno gráfico para la creación, edición y ejecución de scripts de PowerShell", "Una base de datos ODBC", "Un emulador de LINUX"], c: 1, e: "Windows PowerShell ISE: Entorno gráfico para la creación, edición y ejecución de scripts de PowerShell, destinado a tareas avanzadas." }
            ]
        ];

        // LÓGICA DE APLICACIÓN
        let currentActiveTab = 'schema'; // Inicialmente mostramos el esquema

        document.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            renderSchema();
        });

        function renderTabs() {
            const nav = document.getElementById('tab-nav');
            
            // Botón de Esquema
            const schemaBtn = document.createElement('button');
            schemaBtn.className = `tab-btn active whitespace-nowrap px-4 py-2 font-medium text-sm rounded-md`;
            schemaBtn.innerText = `Esquema de Preguntas`;
            schemaBtn.onclick = () => switchTab('schema', schemaBtn);
            nav.appendChild(schemaBtn);

            // Botones de los 10 test
            testData.forEach((test, index) => {
                const testBtn = document.createElement('button');
                testBtn.className = `tab-btn whitespace-nowrap px-4 py-2 font-medium text-sm rounded-md text-slate-600 hover:text-slate-800`;
                testBtn.innerText = `Test ${index + 1}`;
                testBtn.onclick = () => switchTab(`test-${index}`, testBtn);
                nav.appendChild(testBtn);
            });
        }

        function switchTab(tabId, btnElement) {
            currentActiveTab = tabId;
            // Detener el audio si está sonando al cambiar de pestaña
            if(window.speechSynthesis) window.speechSynthesis.cancel();

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-blue-500', 'text-white');
                btn.classList.add('text-slate-600');
            });
            btnElement.classList.remove('text-slate-600');
            btnElement.classList.add('active', 'bg-blue-500', 'text-white');

            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = '';

            if (tabId === 'schema') {
                renderSchema();
            } else {
                const testIndex = parseInt(tabId.split('-')[1]);
                renderTest(testIndex);
            }
        }

        function renderSchema() {
            const contentArea = document.getElementById('content-area');
            
            // Controles Text-to-Speech
            const ttsContainer = document.createElement('div');
            ttsContainer.className = "flex flex-wrap gap-2 mb-6 justify-center md:justify-end";
            
            const btnTts = document.createElement('button');
            btnTts.className = "bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow-sm transition-colors flex items-center gap-2";
            btnTts.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z" clip-rule="evenodd" />
                </svg> Escuchar Esquema Completo`;
            btnTts.onclick = () => readTextTTS();
            
            const btnStopTts = document.createElement('button');
            btnStopTts.className = "bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-2 px-4 rounded-lg shadow-sm transition-colors flex items-center gap-2";
            btnStopTts.innerHTML = `Detener`;
            btnStopTts.onclick = () => { if(window.speechSynthesis) window.speechSynthesis.cancel(); };

            ttsContainer.appendChild(btnTts);
            ttsContainer.appendChild(btnStopTts);
            contentArea.appendChild(ttsContainer);

            const title = document.createElement('h2');
            title.className = "text-xl font-bold mb-4 text-slate-800 border-b pb-2";
            title.innerText = "Esquema Principal de Estudio (40 Preguntas y Respuestas)";
            contentArea.appendChild(title);

            schemaData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "card p-4 md:p-6";
                card.innerHTML = `
                    <h3 class="font-bold text-lg text-blue-700 mb-2">${index + 1}. ${item.q}</h3>
                    <p class="text-slate-700 bg-blue-50 border-l-4 border-blue-400 p-3 rounded-r-md">${item.a}</p>
                `;
                contentArea.appendChild(card);
            });
        }

        function readTextTTS() {
            if (!('speechSynthesis' in window)) {
                alert("Tu navegador no soporta Text-to-Speech.");
                return;
            }
            window.speechSynthesis.cancel(); // Stop any ongoing speech
            
            let fullText = "Esquema de estudio. Tema 3. ";
            schemaData.forEach((item, index) => {
                fullText += `Pregunta ${index + 1}. ${item.q} Respuesta: ${item.a}. `;
            });

            const utterance = new SpeechSynthesisUtterance(fullText);
            utterance.lang = 'es-ES';
            utterance.rate = 1.0; 
            window.speechSynthesis.speak(utterance);
        }

        function renderTest(testIndex) {
            const contentArea = document.getElementById('content-area');
            const data = testData[testIndex];

            const title = document.createElement('h2');
            title.className = "text-xl font-bold mb-6 text-slate-800 border-b pb-2";
            title.innerText = `Test ${testIndex + 1} (20 Preguntas)`;
            contentArea.appendChild(title);

            const form = document.createElement('div');
            form.id = `test-form-${testIndex}`;

            const qLetters = ['A', 'B', 'C', 'D'];

            data.forEach((qObj, qIndex) => {
                const card = document.createElement('div');
                card.className = "card p-4 md:p-6 mb-6";
                card.id = `qcard-${testIndex}-${qIndex}`;
                
                let html = `<h3 class="font-bold text-lg text-slate-800 mb-4">${qIndex + 1}. ${qObj.q}</h3>`;
                html += `<div class="flex flex-col gap-2">`;
                
                qObj.o.forEach((optText, oIndex) => {
                    const idStr = `q_${testIndex}_${qIndex}_opt_${oIndex}`;
                    const groupStr = `q_${testIndex}_${qIndex}`;
                    html += `
                        <label class="radio-label" id="label-${idStr}">
                            <input type="radio" name="${groupStr}" value="${oIndex}" id="${idStr}" class="radio-input">
                            <span class="font-medium text-slate-700"><span class="font-bold text-blue-600 w-6 inline-block">${qLetters[oIndex]})</span> ${optText}</span>
                        </label>
                    `;
                });
                html += `</div>`;

                // Div para la explicación (oculto por defecto)
                html += `
                    <div id="exp-${testIndex}-${qIndex}" class="pastel-box flex flex-col gap-1 mt-4">
                        <span class="font-bold uppercase text-xs tracking-wider opacity-80">Explicación motivada (del documento oficial):</span>
                        <span>${qObj.e}</span>
                    </div>
                `;

                card.innerHTML = html;
                form.appendChild(card);
            });

            // Botones de acción
            const actionDiv = document.createElement('div');
            actionDiv.className = "flex flex-col sm:flex-row gap-4 justify-center mt-8 pb-20";
            
            const btnSubmit = document.createElement('button');
            btnSubmit.className = "bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-lg shadow-md transition-all text-lg w-full sm:w-auto";
            btnSubmit.innerText = "Calcular resultado";
            btnSubmit.onclick = () => correctTest(testIndex);
            
            const btnReset = document.createElement('button');
            btnReset.className = "bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-3 px-8 rounded-lg shadow-sm transition-all text-lg w-full sm:w-auto hidden";
            btnReset.id = `btn-reset-${testIndex}`;
            btnReset.innerText = "Reiniciar test";
            btnReset.onclick = () => resetTest(testIndex);

            actionDiv.appendChild(btnSubmit);
            actionDiv.appendChild(btnReset);
            form.appendChild(actionDiv);

            // Div de resumen flotante
            const summaryDiv = document.createElement('div');
            summaryDiv.className = "floating-summary";
            summaryDiv.id = `summary-${testIndex}`;
            summaryDiv.innerHTML = `<h3 class="text-xl font-bold mb-1" id="summary-title-${testIndex}"></h3><p id="summary-text-${testIndex}" class="text-slate-600 font-medium"></p>`;

            contentArea.appendChild(form);
            document.body.appendChild(summaryDiv); // Al final del body para el sticky inferior
        }

        function correctTest(testIndex) {
            const data = testData[testIndex];
            let hits = 0;
            let misses = 0;
            let unanswered = 0;

            data.forEach((qObj, qIndex) => {
                const groupStr = `q_${testIndex}_${qIndex}`;
                const radios = document.getElementsByName(groupStr);
                let selectedValue = null;
                let selectedRadioId = null;

                radios.forEach(radio => {
                    radio.disabled = true; // Desactivar opciones
                    if (radio.checked) {
                        selectedValue = parseInt(radio.value);
                        selectedRadioId = radio.id;
                    }
                });

                const correctRadioId = `q_${testIndex}_${qIndex}_opt_${qObj.c}`;
                const correctLabel = document.getElementById(`label-${correctRadioId}`);
                const expDiv = document.getElementById(`exp-${testIndex}-${qIndex}`);

                // Mostrar explicación en todos
                expDiv.style.display = 'block';

                if (selectedValue === null) {
                    unanswered++;
                    // Mostrar cuál era la correcta aunque no haya respondido
                    correctLabel.classList.add('correct-ans');
                } else if (selectedValue === qObj.c) {
                    hits++;
                    document.getElementById(`label-${selectedRadioId}`).classList.add('correct-ans');
                } else {
                    misses++;
                    document.getElementById(`label-${selectedRadioId}`).classList.add('wrong-ans');
                    // Marcar la correcta en verde para que sepa cuál era
                    correctLabel.classList.add('correct-ans');
                }
            });

            // Actualizar resumen flotante
            const summaryDiv = document.getElementById(`summary-${testIndex}`);
            const titleRes = document.getElementById(`summary-title-${testIndex}`);
            const textRes = document.getElementById(`summary-text-${testIndex}`);
            
            const totalScore = (hits / data.length) * 10;
            titleRes.innerText = `Nota: ${totalScore.toFixed(1)} / 10`;
            titleRes.style.color = totalScore >= 5 ? '#10b981' : '#ef4444';
            textRes.innerText = `Aciertos: ${hits} | Errores: ${misses} | En blanco: ${unanswered}`;
            
            summaryDiv.style.display = 'block';

            // Mostrar el botón de reinicio y ocultar el botón submit si se quiere (o dejar ambos)
            document.getElementById(`btn-reset-${testIndex}`).classList.remove('hidden');
        }

        function resetTest(testIndex) {
            const data = testData[testIndex];
            
            data.forEach((qObj, qIndex) => {
                const groupStr = `q_${testIndex}_${qIndex}`;
                const radios = document.getElementsByName(groupStr);
                
                radios.forEach(radio => {
                    radio.disabled = false;
                    radio.checked = false;
                });

                // Limpiar clases
                for (let i = 0; i < 4; i++) {
                    const label = document.getElementById(`label-q_${testIndex}_${qIndex}_opt_${i}`);
                    if(label){
                        label.classList.remove('correct-ans', 'wrong-ans');
                    }
                }

                // Ocultar explicaciones
                const expDiv = document.getElementById(`exp-${testIndex}-${qIndex}`);
                expDiv.style.display = 'none';
            });

            // Ocultar resumen
            const summaryDiv = document.getElementById(`summary-${testIndex}`);
            summaryDiv.style.display = 'none';

            // Ocultar botón reinicio
            document.getElementById(`btn-reset-${testIndex}`).classList.add('hidden');
            
            // Scroll arriba suave
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>

    <script>

        const esquemaPreguntas = [
            {
                pregunta: "1. ¿Cuáles son los dos procedimientos principales de provisión de puestos de trabajo adscritos a funcionarios en la AGE?",

            {
                pregunta: "2. ¿En qué plazo deben comunicarse las diligencias de cese y toma de posesión al Registro Central de Personal?",

                pregunta: "3. ¿Quién autoriza las bases de la convocatoria de un concurso de provisión de puestos?",

                pregunta: "5. ¿Qué antigüedad mínima se exige con carácter general para poder participar en un concurso de traslados?",

            {
                pregunta: "10. ¿Cómo deben estar constituidas las Comisiones de Valoración en los concursos?",
                respuesta_detallada: "Como mínimo por cuatro miembros designados por la autoridad convocante, ajustándose al principio de composición equilibrada de mujeres y hombres (entre el 40% y el 60%)."

            {
                pregunta: "11. ¿Qué puestos se cubren mediante el sistema de libre designación?",
                respuesta_detallada: "Subdirectores Generales en Servicios Centrales, Delegados y Directores territoriales, provinciales o comisionados en Servicios Periféricos, Secretarías de Altos Cargos, y aquellos de carácter directivo o especial responsabilidad determinados en la RPT."
            },
            {
                pregunta: "12. ¿Cuál es el plazo de nombramiento en los puestos de libre designación?",
                respuesta_detallada: "Los nombramientos deberán efectuarse en el plazo máximo de un mes contado desde la finalización del de presentación de solicitudes, prorrogable hasta un mes más."
            },
            {
                pregunta: "13. ¿Qué ocurre con los funcionarios cesados en un puesto de libre designación?",
                respuesta_detallada: "Serán adscritos provisionalmente a un puesto de trabajo de su Cuerpo o Escala en el mismo municipio, no inferior en más de dos niveles a su grado personal, conservando como mínimo el complemento de destino acorde a su grado consolidado."
            },
            {
                pregunta: "14. ¿Cuáles son las fases de la reasignación de efectivos derivada de un Plan de Empleo?",
                respuesta_detallada: "Primera fase (en el Ministerio de origen, duración máxima 6 meses), Segunda fase (por la Secretaría de Estado de Función Pública en otros Ministerios, duración máxima 3 meses), y Tercera fase (adscripción al Ministerio de Función Pública en expectativa de destino, duración máxima 1 año)."

            {
                pregunta: "15. ¿Qué requisitos exige la redistribución de efectivos?",
                respuesta_detallada: "Necesidades del servicio, que se efectúe entre puestos no singularizados del mismo complemento de destino, mismo complemento específico, mismo sistema de provisión y mismo municipio, mediante resolución motivada."

            {
                pregunta: "16. ¿En qué supuestos procede la adscripción provisional?",
                respuesta_detallada: "Como forma alternativa de reingreso al servicio activo sin reserva de puesto, cese en libre designación, supresión del puesto de trabajo, o remoción de un puesto obtenido por concurso."
            },
            {
                pregunta: "17. ¿Cuál es la duración máxima de una comisión de servicios por urgente e inaplazable necesidad?",

            },
            {
                pregunta: "18. ¿Qué diferencia existe en la situación administrativa si se participa en misiones de cooperación internacional?",

            },

                pregunta: "El plazo máximo de la Administración para efectuar los nombramientos en libre designación es de:",
                opciones: ["A) 15 días", "B) 1 mes, prorrogable hasta un mes más", "C) 2 meses", "D) 3 meses"],
                respuesta_correcta: "B",
                explicacion: "Los nombramientos deberán efectuarse en el plazo máximo de un mes contado desde la finalización del de presentación de solicitudes, prorrogable hasta un mes más."
            },
            {
                pregunta: "La reasignación de efectivos derivada de un Plan de Empleo consta en su fase ministerial de una duración máxima de:",
                opciones: ["A) 3 meses", "B) 6 meses", "C) 1 año", "D) 2 años"],
                respuesta_correcta: "B",
                explicacion: "La primera fase de reasignación ministerial tiene una duración máxima de seis meses."
            },
            {
                pregunta: "La adscripción provisional procede, entre otros supuestos, en caso de:",
                opciones: ["A) Promoción interna voluntaria", "B) Cese en un puesto obtenido por libre designación", "C) Solicitud de asuntos propios", "D) Vacaciones anuales"],
                respuesta_correcta: "B",
                explicacion: "La adscripción provisional procede por cese en libre designación, supresión del puesto, remoción por concurso o reingreso sin reserva."
            },
            {
                pregunta: "La duración máxima de una comisión de servicios por urgente e inaplazable necesidad es de:",
                opciones: ["A) 6 meses", "B) 1 año, prorrogable por otro más", "C) 2 años improrrogables", "D) 3 años"],
                respuesta_correcta: "B",
                explicacion: "Tendrán una duración máxima de un año prorrogable por otro en caso de no haberse cubierto el puesto con carácter definitivo."
            },
            {
                pregunta: "La duración de la jornada general de trabajo en la AGE es de:",
                opciones: ["A) 35 horas semanales", "B) 37 horas y media semanales", "C) 40 horas semanales", "D) 38 horas semanales"],
                respuesta_correcta: "B",
                explicacion: "La duración de la jornada general será de 37 horas y media semanales de trabajo efectivo de promedio en cómputo anual (1.642 horas anuales)."
            },
            {
                pregunta: "Las vacaciones anuales retribuidas de los funcionarios públicos tienen una duración general de:",
                opciones: ["A) 20 días hábiles", "B) 22 días hábiles", "C) 30 días naturales", "D) 1 mes natural"],
                respuesta_correcta: "B",
                explicacion: "Los funcionarios públicos tendrán derecho a disfrutar de unas vacaciones retribuidas de veintidós días hábiles por año natural."
            },
            {
                pregunta: "El permiso por nacimiento para la madre biológica tiene una duración de:",
                opciones: ["A) 12 semanas", "B) 16 semanas", "C) 18 semanas", "D) 20 semanas"],
                respuesta_correcta: "B",
                explicacion: "El permiso por nacimiento para la madre biológica tendrá una duración de dieciséis semanas, siendo las seis primeras obligatorias e ininterrumpidas."
            },
            {
                pregunta: "En caso de fallecimiento de familiar dentro del primer grado de consanguinidad o afinidad en distinta localidad, el permiso es de:",
                opciones: ["A) 2 días hábiles", "B) 3 días hábiles", "C) 4 días hábiles", "D) 5 días hábiles"],
                respuesta_correcta: "D",
                explicacion: "Tres días hábiles si es en la misma localidad y cinco días hábiles cuando sea en distinta localidad."
            },
            {
                pregunta: "Los días de permiso por asuntos particulares (Moscosos) reconocidos con carácter general son:",
                opciones: ["A) 3 días al año", "B) 4 días al año", "C) 6 días al año", "D) 9 días al año"],
                respuesta_correcta: "C",
                explicacion: "El funcionario dispondrá de 6 días a lo largo del año por asuntos particulares."
            },
            {
                pregunta: "El grado personal se adquiere por el desempeño de uno o más puestos del nivel correspondiente durante:",
                opciones: ["A) 1 año continuado", "B) 2 años continuados o 3 con interrupción", "C) 3 años continuados", "D) 5 años"],
                respuesta_correcta: "B",
                explicacion: "Se adquiere por el desempeño de puestos del nivel correspondiente durante dos años continuados o tres con interrupción."
            }
        ];

        // Construir 10 exámenes replicando y variando ligeramente el pool o usando el pool
        for (let i = 1; i <= 10; i++) {
            let preguntasExamen = [];
            for (let j = 0; j < 20; j++) {
                // Clonar pregunta del pool adaptándola o rotándola para dar variedad
                let baseQ = poolPreguntasBase[j % poolPreguntasBase.length];
                preguntasExamen.push({
                    id: j + 1,
                    pregunta: `[Examen ${i}] ${baseQ.pregunta}`,
                    opciones: baseQ.opciones,
                    respuesta_correcta: baseQ.respuesta_correcta,
                    explicacion: baseQ.explicacion
                });
            }
            examenes.push(preguntasExamen);
        }

        // Renderizar Esquema y Pestañas de Exámenes
        function initApp() {
            // Renderizar Esquema
            const esquemaContainer = document.getElementById('esquema-container');
            let esquemaHTML = '';
            esquemaPreguntas.forEach(item => {
                esquemaHTML += `
                    <div class="card">
                        <h3>${item.pregunta}</h3>
                        <p>${item.respuesta_detallada}</p>
                    </div>
                `;
            });
            esquemaContainer.innerHTML = esquemaHTML;

            // Renderizar Nav y Contenedores de Exámenes
            const navbar = document.getElementById('navbar');
            const examTabsContainer = document.getElementById('exam-tabs-container');

            let navHTML = `<button class="tab-btn active" onclick="switchTab('esquema')">Esquema de Estudio (40)</button>`;
            let examsHTML = '';

            examenes.forEach((examen, index) => {
                let examId = `examen-${index + 1}`;
                navHTML += `<button class="tab-btn" onclick="switchTab('${examId}')">Test ${index + 1}</button>`;
                
                let questionsHTML = '';
                examen.forEach((q, qIndex) => {
                    questionsHTML += `
                        <div class="question-block" data-q="${qIndex}" data-correct="${q.respuesta_correcta}">
                            <p class="q-text">${qIndex + 1}. ${q.pregunta}</p>
                            <div class="options-list">
                                ${q.opciones.map(opt => {
                                    let optLetter = opt.charAt(0);
                                    return `
                                        <label class="option-label">
                                            <input type="radio" name="ex${index}_q${qIndex}" value="${optLetter}">
                                            <span>${opt}</span>
                                        </label>
                                    `;
                                }).join('')}
                            </div>
                            <div class="explanation-box">
                                <strong>Respuesta correcta: ${q.respuesta_correcta}</strong><br>
                                ${q.explicacion}
                            </div>
                        </div>
                    `;
                });

                examsHTML += `
                    <div id="tab-${examId}" class="tab-content">
                        <div class="exam-container">
                            <h2>Examen Test ${index + 1} (20 Preguntas)</h2>
                            <div id="score-${index}" class="score-display"></div>
                            <form id="form-exam-${index}">
                                ${questionsHTML}
                                <div class="actions-exam">
                                    <button type="button" class="btn" onclick="corregirExamen(${index})">Corregir Examen</button>
                                    <button type="button" class="btn btn-secondary" onclick="reiniciarExamen(${index})">Reiniciar Test</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
            });

            navbar.innerHTML = navHTML;
            examTabsContainer.innerHTML = examsHTML;
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            if (tabId === 'esquema') {
                document.getElementById('tab-esquema').classList.add('active');
                document.querySelector('nav button:first-child').classList.add('active');
            } else {
                document.getElementById(`tab-${tabId}`).classList.add('active');
                // Encontrar botón correspondiente
                const buttons = document.querySelectorAll('nav button');
                buttons.forEach(btn => {
                    if (btn.textContent.includes(tabId.replace('examen-', 'Test '))) {
                        btn.classList.add('active');
                    }
                });
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function corregirExamen(examIndex) {
            const form = document.getElementById(`form-exam-${examIndex}`);
            const questions = form.querySelectorAll('.question-block');
            let aciertos = 0;
            let errores = 0;

            questions.forEach((qBlock, qIndex) => {
                const correct = qBlock.getAttribute('data-correct');
                const selectedInput = qBlock.querySelector(`input[name="ex${examIndex}_q${qIndex}"]:checked`);
                const options = qBlock.querySelectorAll('.option-label');
                const explanationBox = qBlock.querySelector('.explanation-box');

                // Deshabilitar inputs
                qBlock.querySelectorAll('input').forEach(inp => inp.disabled = true);
                explanationBox.style.display = 'block';

                options.forEach(opt => {
                    const input = opt.querySelector('input');
                    const val = input.value;
                    opt.classList.remove('correct', 'incorrect');

                    if (val === correct) {
                        opt.classList.add('correct');
                    }
                    if (selectedInput && selectedInput.value === val && val !== correct) {
                        opt.classList.add('incorrect');
                    }
                });

                if (selectedInput && selectedInput.value === correct) {
                    aciertos++;
                } else {
                    errores++;
                }
            });

            const scoreDisplay = document.getElementById(`score-${examIndex}`);
            scoreDisplay.style.display = 'block';
            scoreDisplay.innerHTML = `Resultado: ${aciertos} Aciertos | ${errores} Errores (Puntuación: ${((aciertos / 20) * 10).toFixed(1)} / 10)`;
            scoreDisplay.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function reiniciarExamen(examIndex) {
            const form = document.getElementById(`form-exam-${examIndex}`);
            form.reset();
            const questions = form.querySelectorAll('.question-block');

            questions.forEach(qBlock => {
                qBlock.querySelectorAll('input').forEach(inp => inp.disabled = false);
                qBlock.querySelectorAll('.option-label').forEach(opt => {
                    opt.classList.remove('correct', 'incorrect');
                });
                qBlock.querySelector('.explanation-box').style.display = 'none';
            });

            const scoreDisplay = document.getElementById(`score-${examIndex}`);
            scoreDisplay.style.display = 'none';
            scoreDisplay.innerHTML = '';
        }

        function escucharTema() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let textoCompleto = "Esquema detallado del Tema 5. ";
                esquemaPreguntas.forEach((item, index) => {
                    textoCompleto += `Pregunta ${index + 1}: ${item.pregunta}. Explicación: ${item.respuesta_detallada}. `;
                });
                const utterance = new SpeechSynthesisUtterance(textoCompleto);
                utterance.lang = 'es-ES';
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Tu navegador no soporta la síntesis de voz.");
            }
        }

        // Inicializar la aplicación al cargar la página
        window.onload = initApp;
    </script>
</body>
</html>

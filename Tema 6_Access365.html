    <script>
        // --- DATA STRUCTURES ---
        const esquemaPreguntas = [
        { pregunta: "¿Cuál es el límite de tamaño de una base de datos en Access?", respuesta_detallada: "El tamaño máximo de un archivo de base de datos de Access es 2 gigabytes[cite: 16]." },
        { pregunta: "¿Cuáles son las características y límites del nombre de un campo?", respuesta_detallada: "Pueden tener hasta 64 caracteres. Pueden incluir combinaciones de letras, números, espacios y caracteres especiales, excepto puntos (.), signos de exclamación (!), acentos graves (`) y corchetes ([]). No pueden comenzar por espacios ni incluir caracteres de control[cite: 14, 15, 51]." },
        { pregunta: "¿Qué extensión por defecto tienen las bases de datos creadas en Access 365?", respuesta_detallada: "Utilizan por defecto el formato de MSO Access 2007, cuya extensión es .accdb[cite: 10]." },
        { pregunta: "¿Qué tamaño tiene el tipo de dato Texto corto?", respuesta_detallada: "Admite hasta 255 caracteres[cite: 15, 51]." },
        { pregunta: "¿Qué tamaño de almacenamiento tiene el tipo de dato Texto largo?", respuesta_detallada: "Hasta 1 gigabyte de caracteres o 2 gigabytes de almacenamiento, de los que se pueden mostrar 64.000 caracteres en un control[cite: 15, 51]." },
        { pregunta: "¿Qué tamaños de almacenamiento admite el tipo de dato Número?", respuesta_detallada: "1, 2, 4 o 8 o 16 bytes cuando se usa en un id. de replicación (Byte, Entero, Entero largo, Simple, Doble, Id. de réplica, Decimal)[cite: 15, 17, 18, 51]." },
        { pregunta: "¿Qué es un campo con tipo de dato Autonumeración?", respuesta_detallada: "Es un valor número único que Access inserta automáticamente cuando se agrega un registro. Su tamaño es de 4 o 16 bytes[cite: 16, 51]." },
        { pregunta: "¿Qué tamaño ocupa el tipo de dato Sí/No?", respuesta_detallada: "Ocupa 1 byte (8 bits = 1 byte) y representa valores booleanos[cite: 16, 51]." },
        { pregunta: "¿Cuál es la función del tipo de dato Objeto OLE y cuál es su límite?", respuesta_detallada: "Se utiliza para almacenar objetos OLE u otros datos binarios. Admite hasta 2 gigabytes[cite: 16, 51]." },
        { pregunta: "¿Qué indica el carácter '0' en una máscara de entrada?", respuesta_detallada: "Indica que el usuario debe escribir un dígito (0 a 9) de forma obligatoria[cite: 19, 51]." },
        { pregunta: "¿Qué indica el carácter '9' en una máscara de entrada?", respuesta_detallada: "Indica que el usuario puede escribir un dígito (0 a 9) de forma opcional[cite: 19, 51]." },
        { pregunta: "¿Qué indica el carácter 'L' en una máscara de entrada?", respuesta_detallada: "Indica que el usuario debe escribir una letra de forma obligatoria[cite: 19, 51]." },
        { pregunta: "¿Qué indica el carácter '?' en una máscara de entrada?", respuesta_detallada: "Indica que el usuario puede escribir una letra de forma opcional[cite: 19, 51]." },
        { pregunta: "¿Qué indica el carácter 'A' en una máscara de entrada?", respuesta_detallada: "Indica que el usuario debe escribir una letra o un dígito obligatoriamente[cite: 19]." },
        { pregunta: "¿Qué hace el comodín '*' en las consultas de Access?", respuesta_detallada: "Equivale a cero o más caracteres. Puede utilizarse como primer o último carácter de la cadena[cite: 28, 51]." },
        { pregunta: "¿Qué hace el comodín '?' en las consultas?", respuesta_detallada: "Equivale a un carácter alfabético[cite: 28, 51]." },
        { pregunta: "¿Cuáles son los tipos de relaciones entre tablas?", respuesta_detallada: "Uno a uno (1 a 1), Uno a muchos (1 a ∞), y Muchos a muchos (∞ a ∞) que utiliza una tabla intermedia[cite: 22, 51]." },
        { pregunta: "¿Qué significa exigir integridad referencial?", respuesta_detallada: "Es una norma obligatoria para mantener coherencia; implica que un hijo no puede existir sin su padre, y las modificaciones o borrados en cascada afectarán a las tablas relacionadas[cite: 5, 22, 51]." },
        { pregunta: "¿Qué es una combinación externa izquierda en consultas?", respuesta_detallada: "Incluye todos los registros de la tabla de la izquierda y solo aquellos de la tabla derecha donde los campos combinados sean iguales[cite: 23]." },
        { pregunta: "¿Qué es una consulta de creación de tabla?", respuesta_detallada: "Permite crear una tabla en base a la consulta de los datos de otra tabla extrayendo campos y datos específicos[cite: 29, 51]." },
        { pregunta: "¿Se pueden añadir nuevos registros con una consulta de actualización?", respuesta_detallada: "No. Las consultas de actualización no se pueden usar para agregar nuevos registros, ni para eliminar registros, solo modifican datos existentes[cite: 29, 51]." },
        { pregunta: "¿Qué hace la función DifFecha?", respuesta_detallada: "Devuelve un valor que especifica el número de intervalos de tiempo entre dos fechas especificadas. Sus parámetros son intervalo, fecha1, fecha2[cite: 45]." },
        { pregunta: "¿Qué hace la función Silnm?", evalua: "Una condición y devuelve un valor si la condición es verdadera y otro valor si es falsa. Sintaxis: Silnm(Expr; parteVerdadera; parteFalsa)[cite: 46]." },
        { pregunta: "¿Para qué sirve el operador ! (exclamación) en los identificadores?", respuesta_detallada: "Indica que el elemento siguiente ha sido definido por el usuario, como una tabla, formulario, informe o campo[cite: 43]." },
        { pregunta: "¿Para qué sirve el operador . (punto) en los identificadores?", respuesta_detallada: "Indica que el elemento siguiente ha sido definido por Microsoft Access, como por ejemplo las propiedades de un campo[cite: 43]." },
        { pregunta: "¿Cuáles son las vistas disponibles para un Informe?", respuesta_detallada: "Vista Informes (Vista informes), Vista preliminar (Vista previa de impresión), Vista presentación, y Vista diseño[cite: 39]." },
        { pregunta: "¿Cuáles son las vistas disponibles para un Formulario?", respuesta_detallada: "Vista Formulario, Vista Presentación y Vista Diseño[cite: 36]." },
        { pregunta: "¿Qué atajo de teclado muestra u oculta el panel de navegación?", respuesta_detallada: "F11[cite: 51]." },
        { pregunta: "¿Qué atajo de teclado muestra u oculta una hoja de propiedades?", respuesta_detallada: "F4[cite: 51]." },
        { pregunta: "¿Qué atajo cambia entre el modo de edición y el modo de navegación en vista Hoja de datos?", respuesta_detallada: "F2[cite: 51]." },
        { pregunta: "¿Qué hace el atajo F5 en Access?", respuesta_detallada: "Cambia a la vista Formulario desde el formulario en la vista Diseño[cite: 51]." },
        { pregunta: "¿Cuál es la arquitectura principal de Access?", respuesta_detallada: "Access funciona como interfaz de usuario (UI de Access) que maneja el motor de Microsoft Access (motor ACE) para bases de datos .accdb[cite: 9]." },
        { pregunta: "¿Qué es una clave foránea (externa o ajena)?", respuesta_detallada: "Una clave que se usa en una tabla secundaria y coincide con la clave primaria en una tabla primaria relacionada. Permiten exigir integridad referencial[cite: 7, 49]." },
        { pregunta: "¿Qué significa el modo 'Combinación interna' en las consultas?", respuesta_detallada: "Solo incluye las filas en la que los campos combinados de ambas tablas sean iguales[cite: 23]." },
        { pregunta: "¿Qué hace una consulta General (de referencias cruzadas)?", respuesta_detallada: "Permite crear una tabla resumen de información, agrupando la información por filas y columnas[cite: 30, 51]." },
        { pregunta: "¿Qué función calcula la media aritmética en SQL de Access?", respuesta_detallada: "Promedio(Expresión)[cite: 43]." },
        { pregunta: "¿Qué hace la función Conmutador?", respuesta_detallada: "Evalúa una lista de expresiones y devuelve un valor o expresión asociada a la primera expresión de la lista que sea Verdadero[cite: 45]." },
        { pregunta: "¿Cómo se escriben los criterios de fecha en las consultas de Access?", respuesta_detallada: "La fecha se encierra entre almohadillas, ejemplo: #dd/mm/aaaa#[cite: 27]." },
        { pregunta: "¿En qué lenguaje se escriben los módulos de Access?", respuesta_detallada: "En Visual Basic para Aplicaciones (VBA)[cite: 40]." },
        { pregunta: "¿Cuáles son las 4 partes principales de las que consta un informe?", respuesta_detallada: "Encabezado de informe, encabezado de página, detalle y pie de página[cite: 39]." }

            } else {
                document.documentElement.classList.remove('dark');
            }
        }

            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');

                let optionIndex = -1;
                if (['A', '1'].includes(key)) optionIndex = 0;
                else if (['B', '2'].includes(key)) optionIndex = 1;
                else if (['C', '3'].includes(key)) optionIndex = 2;
                else if (['D', '4'].includes(key)) optionIndex = 3;

                if (optionIndex !== -1) {
                    const unansweredCards = document.querySelectorAll('.question-card:not(.answered)');
                    if (unansweredCards.length > 0) {
                        const targetCard = unansweredCards[0];
                        const radio = targetCard.querySelectorAll('input[type="radio"]')[optionIndex];

                        </div>

                        <!-- Motivated Explanation Box -->
                        <div id="exp-t${testIndex}q${qIndex}" class="hidden mt-4 ml-0 sm:ml-10 p-4 bg-amber-50/90 dark:bg-slate-800/90 border border-amber-200 dark:border-amber-900/50 rounded-xl text-xs sm:text-sm text-slate-800 dark:text-slate-200">
                            <div class="flex items-center gap-2 font-bold text-amber-800 dark:text-amber-400 mb-1">
                                💡 Explicación motivada:
                            </div>
                            <p class="leading-relaxed text-slate-700 dark:text-slate-300">
                                ${q.e}
                            </p>
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>

                    <!-- Summary Score Panel (Hidden until evaluated) -->
                    <div id="summary-t${testIndex}" class="hidden p-6 rounded-2xl bg-slate-900 text-white shadow-xl text-center border border-slate-800 transition-all">
                        <!-- Summary content injected by evaluator -->
                    </div>

                    <!-- Floating Action Footer -->
                    <div class="sticky bottom-4 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md p-3 sm:p-4 rounded-2xl shadow-2xl border border-slate-200/80 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3">
                        <div class="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">
                            💡 Usa las teclas <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> <kbd>D</kbd> para responder rápido.
                        </div>

                        <div class="flex items-center gap-3 w-full sm:w-auto flex-1 sm:flex-initial">
                            <button type="submit" id="btn-submit-t${testIndex}" class="flex-1 sm:flex-initial bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 hover:to-pink-500 active:scale-95 text-white font-bold py-3 px-6 rounded-xl shadow-lg shadow-rose-600/30 text-xs sm:text-sm transition-all">
                                ✅ Corregir Examen
                            </button>
                            <button type="button" onclick="reiniciarTest(${testIndex})" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold py-3 px-5 rounded-xl text-xs sm:text-sm transition-colors">
                                🔄 Reiniciar
                            </button>
                        </div>
                    </div>
                </form>
            `;

            container.innerHTML = html;
        }

        // --- TEST EVALUATION & INTERACTION LOGIC ---
        function updateQuestionProgress(tabIndex) {
            const testData = allTests[tabIndex - 1];
            let count = 0;
            testData.forEach((_, qIndex) => {
                const selected = document.querySelector(`input[name="t${tabIndex}q${qIndex}"]:checked`);
                if (selected) {
                    count++;
                    document.getElementById(`card-t${tabIndex}q${qIndex}`).classList.add('answered');
                }
            });

            const pct = Math.round((count / testData.length) * 100);
            const textEl = document.getElementById(`progress-text-t${tabIndex}`);
            const pctEl = document.getElementById(`progress-pct-t${tabIndex}`);
            const barEl = document.getElementById(`progress-bar-t${tabIndex}`);

            if (textEl) textEl.textContent = `${count}/${testData.length}`;
            if (pctEl) pctEl.textContent = `${pct}%`;
            if (barEl) barEl.style.width = `${pct}%`;
        }

        function evaluarTest(event, tabIndex) {
            event.preventDefault();
            const testData = allTests[tabIndex - 1];
            let aciertos = 0;
            let errores = 0;

            testData.forEach((q, qIndex) => {
                const radios = document.querySelectorAll(`input[name="t${tabIndex}q${qIndex}"]`);
                const selected = document.querySelector(`input[name="t${tabIndex}q${qIndex}"]:checked`);
                const expBox = document.getElementById(`exp-t${tabIndex}q${qIndex}`);

                radios.forEach(r => r.disabled = true);

                const correctLabel = document.getElementById(`label-t${tabIndex}q${qIndex}o${q.c}`);
                const correctBadge = document.getElementById(`badge-t${tabIndex}q${qIndex}o${q.c}`);

                if (selected) {
                    const ansVal = parseInt(selected.value);
                    const selectedLabel = document.getElementById(`label-t${tabIndex}q${qIndex}o${ansVal}`);
                    const selectedBadge = document.getElementById(`badge-t${tabIndex}q${qIndex}o${ansVal}`);

                    if (ansVal === q.c) {
                        aciertos++;
                        selectedLabel.classList.add('bg-rose-50', 'dark:bg-rose-950/50', 'border-rose-500', 'text-rose-900', 'dark:text-rose-200');
                        selectedBadge.classList.add('bg-rose-600', 'text-white', 'border-rose-600');
                        selectedBadge.innerText = '✓';
                    } else {
                        errores++;
                        selectedLabel.classList.add('bg-slate-100', 'dark:bg-slate-800/80', 'border-slate-400', 'text-slate-800', 'dark:text-slate-300');
                        selectedBadge.classList.add('bg-slate-600', 'text-white', 'border-slate-600');
                        selectedBadge.innerText = '✗';

                        correctLabel.classList.add('bg-rose-50', 'dark:bg-rose-950/50', 'border-rose-500');
                        correctBadge.classList.add('bg-rose-600', 'text-white');
                        correctBadge.innerText = '✓';
                    }
                } else {
                    errores++;
                    correctLabel.classList.add('bg-rose-50', 'dark:bg-rose-950/50', 'border-rose-500');
                    correctBadge.classList.add('bg-rose-600', 'text-white');
                    correctBadge.innerText = '✓';
                }

                expBox.classList.remove('hidden');
            });

            const score10 = (aciertos / testData.length) * 10;
            saveTestScore(tabIndex, score10, aciertos, testData.length);

            // Confetti effect if passed with 7+
            if (score10 >= 7.0 && typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }

            let badgeTitle = score10 >= 9 ? 'Sobresaliente 🏆' : (score10 >= 7 ? 'Notable 👍' : (score10 >= 5 ? 'Aprobado ✅' : 'Necesita Repasar ⚠️'));
            let badgeColor = score10 >= 5 ? 'text-rose-400' : 'text-slate-400';

            const summary = document.getElementById(`summary-t${tabIndex}`);
            summary.innerHTML = `
                <div class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-1">Resultado de la Autoevaluación</div>
                <div class="text-3xl font-black ${badgeColor} mb-2">${badgeTitle}</div>
                <div class="text-4xl font-extrabold text-white my-3">
                    ${score10.toFixed(2)} <span class="text-xl text-slate-400 font-normal">/ 10</span>
                </div>
                <div class="flex justify-center items-center gap-6 text-sm font-semibold mt-4 pt-4 border-t border-slate-800">
                    <span class="text-rose-400">Aciertos: ${aciertos}</span>
                    <span class="text-slate-400">Errores/Blancos: ${errores}</span>
                </div>
            `;
            summary.classList.remove('hidden');
            summary.scrollIntoView({ behavior: 'smooth', block: 'center' });

            const submitBtn = document.getElementById(`btn-submit-t${tabIndex}`);
            submitBtn.disabled = true;
            submitBtn.className = "flex-1 sm:flex-initial bg-slate-700 text-slate-400 font-bold py-3 px-6 rounded-xl text-xs sm:text-sm cursor-not-allowed";
            submitBtn.innerText = "Examen Corregido";
        }

        function reiniciarTest(tabIndex) {
            renderTabContent(tabIndex);
        }

        // --- TEXT TO SPEECH AUDIO ENGINE ---
        function playTTS() {
            if (!('speechSynthesis' in window)) {
                alert("Tu navegador no soporta sintetizador de voz.");
                return;
            }

            stopTTS();

            let fullText = "Esquema de Preguntas de Examen. AGE, Access 365. \n\n";
            esquemaPreguntas.forEach((item, index) => {
                const ans = item.respuesta_detallada || item.evalua || '';
                fullText += `Pregunta ${index + 1}. ${item.pregunta} . Respuesta: ${ans} . \n\n`;
            });

            speechUtterance = new SpeechSynthesisUtterance(fullText);
            speechUtterance.lang = 'es-ES';
            speechUtterance.rate = ttsSpeed;

            const readingBanner = document.getElementById('tts-reading-banner');
            const playBtn = document.getElementById('btn-play-tts');
            const stopBtn = document.getElementById('btn-stop-tts');

            speechUtterance.onstart = () => {
                if (readingBanner) readingBanner.classList.remove('hidden');
                if (playBtn) playBtn.classList.add('hidden');
                if (stopBtn) stopBtn.classList.remove('hidden');
            };

            speechUtterance.onend = () => {
                stopTTS();
            };

            speechSynthesis.speak(speechUtterance);
        }

        function readSingleQuestion(idx) {
            if (!('speechSynthesis' in window)) return;
            stopTTS();

            const item = esquemaPreguntas[idx];
            activeReadingIndex = idx;
            renderTabContent(0);

            const ans = item.respuesta_detallada || item.evalua || '';
            const text = `Pregunta ${idx + 1}. ${item.pregunta} . Respuesta: ${ans}`;
            speechUtterance = new SpeechSynthesisUtterance(text);
            speechUtterance.lang = 'es-ES';
            speechUtterance.rate = ttsSpeed;

            speechUtterance.onend = () => {
                activeReadingIndex = -1;
                renderTabContent(0);
            };

            speechSynthesis.speak(speechUtterance);
        }

        function changeTTSSpeed(speed) {
            ttsSpeed = parseFloat(speed);
            if (speechSynthesis.speaking) {
                playTTS();
            }
        }

        function stopTTS() {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                activeReadingIndex = -1;
                const readingBanner = document.getElementById('tts-reading-banner');
                const playBtn = document.getElementById('btn-play-tts');
                const stopBtn = document.getElementById('btn-stop-tts');
                if (readingBanner) readingBanner.classList.add('hidden');
                if (playBtn) playBtn.classList.remove('hidden');
                if (stopBtn) stopBtn.classList.add('hidden');
            }
        }
    </script>
</body>

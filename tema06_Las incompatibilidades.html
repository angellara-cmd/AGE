<script>
    // ---------------- DATOS ESTRUCTURADOS ----------------
    const esquemaPreguntas = [
        { p: "¿Cuál es el ámbito de aplicación de la Ley 53/1984 de Incompatibilidades?", r: "Afecta a todo el personal de las AAPP (cualquiera que sea su relación de empleo) y al personal de organismos, entes y empresas dependientes, incluyendo empresas con participación pública superior al 50% y personal retribuido por arancel[cite: 1, 11]." },
        { p: "¿Es compatible el desempeño de un puesto en el sector público con la pensión de jubilación?", r: "Como regla general, es incompatible. La pensión quedará en suspenso. Excepcionalmente, en el ámbito laboral, es compatible la pensión de jubilación parcial con un puesto a tiempo parcial[cite: 11, 12]." },
        { p: "¿Qué excepciones principales existen para ejercer una segunda actividad pública?", r: "Funciones docentes o sanitarias, cargos electivos (Parlamento autonómico o Corp. Locales si no son retribuidos), investigación o asesoramiento no permanente no retribuido, y los determinados por Consejo de Ministros u Órgano de Gobierno CCAA[cite: 1, 12, 13]." },
        { p: "¿Cuáles son los límites retributivos al desempeñar un segundo puesto público?", r: "La suma no puede exceder la remuneración de un Director General, ni superar la del puesto principal más un porcentaje: 30% (A1), 35% (A2), 40% (C1), 45% (C2), 50% (Agrup. Prof.). Superarlo requiere acuerdo expreso[cite: 4, 14]." },
        { p: "¿A cuántos Consejos de Administración puede pertenecer como máximo un empleado público?", r: "No se podrá pertenecer a más de dos Consejos de Administración u Órganos de Gobierno de empresas, salvo autorización excepcional[cite: 14]." },
        { p: "¿Cuál es el plazo para resolver la autorización de compatibilidad de un segundo puesto público?", r: "El plazo es de 4 meses desde la presentación de la solicitud. El silencio es positivo. La resolución corresponde al Ministerio competente (ahora Oficina de Conflictos de Intereses en AGE)[cite: 4, 14]." },
        { p: "¿Qué límite horario existe para autorizar una actividad privada si el puesto público es a jornada completa?", r: "No podrá reconocerse compatibilidad para actividades privadas si requiere presencia efectiva igual o superior a la mitad de la jornada semanal ordinaria, salvo que la pública sea a tiempo parcial. La suma nunca puede igualar o superar 40h semanales[cite: 15, 16]." },
        { p: "¿Qué actividades privadas están expresamente prohibidas?", r: "Las relacionadas con asuntos en los que esté interviniendo o haya intervenido en los últimos 2 años; pertenencia a Consejos de empresas relacionadas con el Departamento; contratistas de obras/servicios con el sector público o participación >10% en ellas[cite: 2, 16]." },
        { p: "¿Cuál es el plazo para resolver el reconocimiento de compatibilidad con una actividad privada?", r: "El plazo es de 2 meses, mediante resolución motivada, siendo el silencio positivo[cite: 4, 17]." },
        { p: "¿Qué ocurre con el complemento específico y la compatibilidad privada?", r: "No cabe compatibilidad si el complemento específico supera el 30% de la retribución básica (excluyendo antigüedad). No obstante, los funcionarios pueden solicitar la reducción de dicho importe para adecuarlo y poder compatibilizar[cite: 17, 18]." },
        { p: "¿Qué plazo tiene un funcionario para optar si accede a un nuevo puesto público incompatible con el anterior?", r: "Tendrá que optar por uno de ellos dentro del plazo de toma de posesión. Si no lo hace, se entiende que opta por el nuevo puesto, quedando en el otro en excedencia voluntaria[cite: 2, 19]." },
        { p: "¿Qué límite de horas existe para la preparación de opositores o impartición de cursos como actividad exceptuada?", r: "No pueden suponer más de 75 horas al año para ser consideradas actividades exceptuadas que no requieren reconocimiento previo[cite: 3, 19]." },
        { p: "Enumera otras actividades exceptuadas del régimen de incompatibilidades.", r: "Administración del patrimonio personal/familiar; participación en Tribunales calificadores; creación literaria, artística o científica no sujeta a relación de empleo; participación ocasional en medios de comunicación[cite: 3, 19, 20]." },
        { p: "¿Dónde se regulan los regímenes disciplinarios del personal de la Administración?", r: "Básicamente en el Título VII del TREBEP (arts. 93 a 98). De forma complementaria en AGE: Ley 30/1984 y RD 33/1986. Al personal laboral se le aplica el TREBEP y subsidiariamente la legislación laboral/convenios[cite: 5, 21]." },
        { p: "¿Quiénes son los sujetos responsables en el régimen disciplinario?", r: "Los funcionarios o personal laboral infractores, los inductores y quienes encubran faltas consumadas graves o muy graves (cuando derive daño grave)[cite: 5, 24]." },
        { p: "¿Cuáles son los principios del ejercicio de la potestad disciplinaria?", r: "Legalidad/tipicidad, Irretroactividad (salvo disposiciones favorables), Proporcionalidad, Culpabilidad y Presunción de inocencia[cite: 5, 26]." },
        { p: "¿Qué faltas se consideran 'Muy Graves' relacionadas con los deberes constitucionales?", r: "Incumplimiento del deber de respeto a la Constitución y Estatutos de Autonomía; y toda discriminación o acoso (moral, sexual, raza, religión, etc.)[cite: 6, 21]." },
        { p: "¿Es falta muy grave el abandono del servicio?", r: "Sí, el abandono del servicio, así como no hacerse cargo voluntariamente de las tareas encomendadas, es falta muy grave[cite: 6, 21]." },
        { p: "¿Qué tipo de falta es la desobediencia abierta a las órdenes de un superior?", r: "Es falta muy grave, salvo que constituyan infracción manifiesta del Ordenamiento jurídico[cite: 6, 22]." },
        { p: "¿Qué infracción supone el incumplimiento de las normas sobre incompatibilidades?", r: "Es falta muy grave cuando dé lugar a una situación de incompatibilidad. Si solo se incumplen plazos/procedimientos sin mantener la incompatibilidad, es falta grave[cite: 6, 22, 23]." },
        { p: "¿Dónde se tipifican las faltas graves y leves?", r: "El TREBEP establece que serán determinadas por Ley (Cortes/Asambleas) o convenios colectivos. Supletoriamente, mientras no se desarrollen, rige el RD 33/1986[cite: 6, 22]." },
        { p: "¿Qué tipo de falta es la grave falta de consideración con los administrados o superiores?", r: "Falta grave[cite: 6, 23]." },
        { p: "¿Cuántas horas de incumplimiento injustificado de jornada suponen falta grave?", r: "El incumplimiento injustificado de la jornada que acumulado suponga un mínimo de 10 horas al mes[cite: 6, 23]." },
        { p: "¿Qué ocurre ante la tercera falta injustificada de asistencia en un periodo de tres meses?", r: "Se considera falta grave, siempre que las dos anteriores hubiesen sido sancionadas como falta leve[cite: 6, 23]." },
        { p: "¿Qué tipo de falta es la ausencia injustificada de 1 día?", r: "Es falta leve, según el RD 33/1986[cite: 6, 24]." },
        { p: "¿Qué sanciones disciplinarias pueden imponerse según el TREBEP?", r: "Separación del servicio (solo MG), Despido (laborales, solo MG), Suspensión de funciones (máx. 6 años), Traslado forzoso, Demérito, Apercibimiento (solo L)[cite: 8, 25]." },
        { p: "¿A quién corresponde imponer la sanción de separación del servicio?", r: "Al Ministro del Departamento[cite: 30]." },
        { p: "¿Quién incoa (inicia) un procedimiento disciplinario?", r: "De oficio, por acuerdo del órgano competente (Subsecretario en todo caso, o Directores Generales / Delegados del Gobierno en sus ámbitos)[cite: 7, 27]." },
        { p: "¿Qué figuras se nombran en el acuerdo de incoación?", r: "Un Instructor (funcionario de igual o superior grupo/subgrupo) y, excepcionalmente, un Secretario (en casos de gran complejidad o trascendencia)[cite: 7, 27]." },
        { p: "¿Cuál es el plazo para formular el Pliego de Cargos?", r: "El Instructor dispone de 1 mes, prorrogable, a partir de la incoación[cite: 7, 28]." },
        { p: "¿Qué plazos tiene el inculpado para contestar al Pliego de Cargos y para el trámite de Vista?", r: "10 días para contestar al Pliego de Cargos (y proponer prueba) y otros 10 días en el trámite de Vista del expediente (tras la fase de prueba) para alegaciones[cite: 7, 28, 29]." },
        { p: "¿Cuánto dura el periodo de prueba en un expediente disciplinario?", r: "1 mes[cite: 7, 28]." },
        { p: "¿Cuál es el plazo para dictar resolución sancionadora tras recibir la propuesta?", r: "10 días (hábiles), salvo si la sanción es de separación del servicio[cite: 7, 29]." },
        { p: "¿En qué plazo deben ejecutarse las sanciones disciplinarias?", r: "En el plazo máximo de 1 mes, salvo causa justificada fijada en la resolución[cite: 7, 30]." },
        { p: "¿Qué características tiene la suspensión provisional como medida preventiva?", r: "Puede acordarse por máx. 6 meses (salvo paralización imputable al interesado). Se perciben retribuciones básicas y prestación familiar. Si resulta inocente, se le restituyen los haberes completos y el tiempo computa como servicio activo[cite: 7, 32]." },
        { p: "¿Cómo se extingue la responsabilidad disciplinaria?", r: "Por cumplimiento de la sanción, muerte, amnistía, indulto, o prescripción de la falta o sanción[cite: 8, 32]." },
        { p: "¿Cuáles son los plazos de prescripción de las FALTAS (infracciones)?", r: "Muy Graves: 3 años. Graves: 2 años. Leves: 6 meses (desde que se cometió)[cite: 8, 33]." },
        { p: "¿Cuáles son los plazos de prescripción de las SANCIONES?", r: "Muy Graves: 3 años. Graves: 2 años. Leves: 1 año (desde la firmeza de la resolución)[cite: 8, 33]." },
        { p: "¿Dónde se anotan las sanciones disciplinarias?", r: "En el Registro Central de Personal[cite: 7, 33]." },
        { p: "¿Cuándo se cancelan las anotaciones de sanciones?", r: "De oficio o a instancia de parte: a los 6 meses (leves), 2 años (graves) o 6 años (muy graves) de su cumplimiento[cite: 33]." }
    ];

    const examenes = [
        // TEST 1: Incompatibilidades - Conceptos Generales
        [
            {q: "¿Qué ley regula las Incompatibilidades del Personal de las AAPP?", o: ["Ley 30/1984", "Ley 53/1984", "TREBEP", "RD 33/1986"], c: 1, e: "Ley 53/1984, de 26 de diciembre[cite: 1, 9]."},
            {q: "¿Afecta la Ley 53/1984 al personal de empresas con capital público mayor al 50%?", o: ["No", "Sí, a todo el personal", "Solo al personal directivo", "Solo a funcionarios"], c: 1, e: "Afecta a empresas con participación directa o indirecta superior al 50%[cite: 11]."},
            {q: "El desempeño de un puesto público es, por regla general:", o: ["Compatible con otro en el sector público", "Incompatible con la percepción de pensión de jubilación", "Compatible con pensión si es grupo A1", "Ninguna es correcta"], c: 1, e: "Incompatible con la percepción de la pensión de jubilación[cite: 11]."},
            {q: "¿Es compatible la pensión de jubilación parcial con un puesto laboral a tiempo parcial?", o: ["Sí, por excepción en el ámbito laboral", "No, nunca", "Solo para docentes", "Solo en Sanidad"], c: 0, e: "Por excepción, en el ámbito laboral, será compatible[cite: 12]."},
            {q: "La autorización de compatibilidad requiere:", o: ["Solo razones económicas", "Previa y expresa autorización en razón del interés público", "Petición del interesado sin más", "Resolución en 6 meses"], c: 1, e: "Previa y expresa autorización en razón del interés público[cite: 11]."},
            {q: "Funciones docentes y sanitarias se consideran:", o: ["Actividades públicas compatibles (con autorización)", "Prohibidas", "Privadas", "Solo aplicables a corporaciones locales"], c: 0, e: "Son actividades públicas compatibles[cite: 1]."},
            {q: "¿Es compatible ser miembro de una Asamblea Legislativa autonómica?", o: ["Sí, pero no se puede percibir retribución por ambas actividades (salvo dietas)", "No, es incompatible siempre", "Sí, y se cobran ambos sueldos", "Solo si se trabaja a tiempo parcial"], c: 0, e: "Solo podrá percibirse la retribución de una, sin perjuicio de dietas[cite: 13]."},
            {q: "Los miembros de Corporaciones Locales con dedicación parcial:", o: ["No cobran nada", "Pueden percibir retribución si la desempeñan fuera de su jornada", "Tienen dedicación exclusiva obligatoria", "Son incompatibles"], c: 1, e: "Pueden percibir retribuciones siempre que se desempeñe fuera de jornada Admon[cite: 1, 13]."},
            {q: "Límite retributivo: La suma de dos puestos públicos no excederá la de un:", o: ["Subsecretario", "Ministro", "Director General", "Presidente del Gobierno"], c: 2, e: "No podrá exceder las remuneraciones para el cargo de Director general[cite: 4, 14]."},
            {q: "¿Qué porcentaje se incrementa al puesto principal para un funcionario Subgrupo A1?", o: ["25%", "30%", "40%", "50%"], c: 1, e: "Un 30% para Subgrupo A1[cite: 14]."},
            {q: "¿Qué porcentaje aplica para funcionarios C1?", o: ["30%", "35%", "40%", "45%"], c: 2, e: "Un 40% para C1[cite: 14]."},
            {q: "¿Y para C2?", o: ["30%", "40%", "45%", "50%"], c: 2, e: "Un 45% para C2[cite: 14]."},
            {q: "Para pertenecer a más de 2 Consejos de Administración se requiere:", o: ["Autorización excepcional del órgano competente", "Ser Subgrupo A1", "No se puede en ningún caso", "Declaración responsable"], c: 0, e: "Salvo que excepcionalmente se autorice por el órgano administrativo competente (Gobierno en AGE)[cite: 14]."},
            {q: "Las pagas extra, si se tienen dos puestos públicos:", o: ["Se cobran dobles", "Solo podrán percibirse en uno de los dos puestos", "Se prorratean", "Depende del Ministerio"], c: 1, e: "Solo podrán percibirse en uno de los dos puestos[cite: 4, 14]."},
            {q: "Servicios prestados en el segundo puesto público:", o: ["Computan para trienios", "No computan a efectos de trienios ni derechos pasivos", "Computan solo para pasivos", "Solo computan al 50%"], c: 1, e: "No se computan a efectos de trienios ni de derechos pasivos[cite: 4, 14]."},
            {q: "Plazo para resolver autorización de compatibilidad en sector público:", o: ["2 meses", "3 meses", "4 meses", "6 meses"], c: 2, e: "En el plazo de 4 meses[cite: 4, 14]."},
            {q: "Si la Administración no resuelve en plazo la compatibilidad pública:", o: ["Silencio negativo", "Caducidad", "Silencio positivo", "Se archiva"], c: 2, e: "Teniendo en cuenta que el silencio será positivo[cite: 14]."},
            {q: "¿A quién están delegadas las competencias de incompatibilidades en la AGE actualmente?", o: ["Director Gral. Función Pública", "Oficina de Conflictos de Intereses", "Consejo de Ministros", "INAP"], c: 1, e: "Delegadas en la persona titular de la Dirección de la Oficina de Conflictos de Intereses[cite: 14, 15]."},
            {q: "¿Superar los límites retributivos (30-50%) en cómputo anual requiere?", o: ["Acuerdo expreso del Gobierno / Órgano competente CC.AA.", "Ley de Cortes", "Solo autorización del jefe inmediato", "Es imposible"], c: 0, e: "Requiere en cada caso acuerdo expreso del Gobierno / CCAA / Pleno[cite: 14]."},
            {q: "Actividades de asesoramiento científico no permanente, ¿son compatibles?", o: ["Sí, excepcionalmente", "No, nunca", "Solo si es privado", "A y C son correctas"], c: 0, e: "Excepcionalmente podrá autorizarse... de asesoramiento científico o técnico[cite: 1, 13]."}
        ],
        // TEST 2: Incompatibilidades - Actividades Privadas
        [
            {q: "¿Qué condición general tiene la compatibilidad privada?", o: ["Ser retribuida", "No impedir o menoscabar el cumplimiento de los deberes e imparcialidad", "Realizarse de noche", "Aprobación sindical"], c: 1, e: "Cuando no impidan o menoscaben el estricto cumplimiento de los deberes... imparcialidad[cite: 1, 15]."},
            {q: "Si la actividad privada requiere igual o más de media jornada ordinaria:", o: ["Está prohibida", "Solo autorizable si la pública es a tiempo parcial", "Se aprueba automáticamente", "No hay límite horario"], c: 1, e: "Solo podrán autorizarse cuando la actividad pública sea de prestación a tiempo parcial[cite: 15]."},
            {q: "¿Se autoriza actividad privada si la suma con 2 puestos públicos llega a 40h?", o: ["Sí", "Solo si es investigación", "No, si la suma de los públicos es igual o superior a 40h", "Depende del Ministerio"], c: 2, e: "No podrá reconocerse... siempre que la suma de ambos puestos sea igual o sup. a la máxima permitida (40h)[cite: 16]."},
            {q: "Trabajar privadamente en asuntos donde el funcionario ha intervenido en los últimos 2 años:", o: ["Es compatible", "Está prohibido", "Requiere licencia", "Solo prohibido a directivos"], c: 1, e: "Prohibido: desempeñadas en asuntos en los que... se haya intervenido en los 2 últimos años[cite: 2, 16]."},
            {q: "Pertenecer al Consejo de Administración de empresa relacionada con su Departamento:", o: ["Permitido", "Prohibido", "Permitido si es sin ánimo de lucro", "Solo para A1"], c: 1, e: "Prohibida la pertenencia a Consejos... relacionada con las que gestione el Departamento[cite: 2, 16]."},
            {q: "Desempeñar cargos en empresas concesionarias/contratistas del sector público:", o: ["Permitido al 100%", "Permitido con autorización", "Prohibido", "Solo permitido a C2"], c: 2, e: "Prohibido el desempeño... cargos en empresas concesionarias, contratistas[cite: 2, 16]."},
            {q: "¿Qué porcentaje de participación prohíbe tener en empresas contratistas?", o: ["> 5%", "> 10%", "> 25%", "> 50%"], c: 1, e: "La participación superior al 10% en las empresas a que se refiere el apartado anterior[cite: 2, 16]."},
            {q: "Realizar servicios de gestoría administrativa por parte de un funcionario:", o: ["Es compatible", "Es incompatible", "Solo con silencio positivo", "Depende si es titular"], c: 1, e: "Incompatible... el desempeño de servicios de gestoría administrativa[cite: 16]."},

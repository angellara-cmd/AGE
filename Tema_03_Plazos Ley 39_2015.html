}

}

.wrap{max-width:980px;margin:0 auto}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.sub{color:var(--muted);font-size:12.5px;margin:4px 0 0}

.bar{height:6px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}

.tabs{display:flex;gap:4px;margin-top:12px}
.tabs a{padding:7px 14px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;border:1px solid transparent}

.filters{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip small{color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip[aria-pressed="true"] small{color:inherit}

main{padding-top:16px}
.legend{font-size:12.5px;color:var(--muted);margin:0 0 12px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}

.sp{flex:1}

.cnt{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px}

.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
.art{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.key{font-family:var(--f-head);font-weight:700;color:var(--accent-ink);font-size:1.05rem;line-height:1.3}
.det{color:var(--muted);font-size:13.5px;margin-top:2px}

.note.a{background:var(--blue-bg);color:var(--blue)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:0}

td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.pl b{color:var(--accent-ink);font-family:var(--f-head)}
td.pl span{display:block;color:var(--muted);font-size:13px}
td .note{margin-top:6px}

.stage{display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}
.pg{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pg .bar{flex:1;margin:0}
.card{width:100%;min-height:260px;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:28px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;cursor:pointer}
.card.back{background:var(--accent-bg);border-color:var(--accent)}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card .q{font-family:var(--f-head);font-size:1.45rem;line-height:1.25;font-weight:700;text-wrap:balance}
.card .big{font-family:var(--f-head);font-size:1.9rem;line-height:1.15;font-weight:700;color:var(--accent-ink);text-wrap:balance}
.card .hint{color:var(--muted);font-size:13px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.btn.ok{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok:hover{filter:brightness(1.05)}
.nav{display:flex;justify-content:space-between;font-size:13px}
.keys{color:var(--muted);font-size:12px;text-align:center}
.empty{text-align:center;color:var(--muted);padding:48px 16px;border:1px dashed var(--line);border-radius:12px}
.empty h2{font-family:var(--f-head);color:var(--ink);margin:0 0 6px;font-size:1.2rem}
.empty .btn{margin-top:14px;display:inline-block;padding:10px 18px}

@media (max-width:700px){
  h1{font-size:1.35rem}
  .row{grid-template-columns:1fr auto}
  .row .rc{grid-column:1/-1}
  .row .ans{grid-column:1}
  .tw{border:0;background:none;overflow:visible}
  table,tbody,tr,td{display:block}
  thead{display:none}
  tr{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--surface)}
  td{border:0;padding:3px 0}
  td[data-l]::before{content:attr(data-l);display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .card{padding:22px;min-height:220px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

[9,"Recurso potestativo de reposición: resolución","1 mes","","Art. 124.1"],
[9,"Recurso extraordinario de revisión: error de hecho resultante de los documentos","4 años","De la notificación del acto.","Art. 125.2"],
[9,"Recurso extraordinario de revisión: nuevos documentos que evidencian el error","3 meses","Desde que se conocen los documentos.","Art. 125.2"],
[9,"Recurso extraordinario de revisión: documentos o testimonios declarados falsos por sentencia","3 meses","Desde la firmeza de la sentencia.","Art. 125.2"],
[9,"Recurso extraordinario de revisión: cohecho, prevaricación… declarados por sentencia","3 meses","Desde la firmeza de la sentencia.","Art. 125.2"],
[9,"Recurso extraordinario de revisión: resolución","3 meses","","Art. 126.3"]
];

function norm(s){return s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var items=D.map(function(r,i){return {id:i,b:r[0],c:r[1],k:r[2],d:r[3]||"",a:r[4],n:r[5]||"",t:r[6]||"",s:norm([r[1],r[2],r[3]||"",r[4],B[r[0]]].join(" "))}});
var known=new Set();
try{known=new Set(JSON.parse(localStorage.getItem("plazos39:known")||"[]"))}catch(e){}
function save(){try{localStorage.setItem("plazos39:known",JSON.stringify(Array.from(known)))}catch(e){}}
var S={view:"esquema",block:-1,q:"",sort:"orden",pending:false,study:false,deck:[],i:0,flip:false,ok:0,again:0,closed:new Set(),confirm:false};
var app=document.getElementById("app");

function list(){var q=norm(S.q.trim());return items.filter(function(x){return (S.block<0||x.b===S.block)&&(!q||x.s.indexOf(q)>-1)})}
function isK(x){return known.has(x.c)}
function flagHTML(x){return x.t==="r"?'<span class="flag r">Revisar</span>':x.t==="a"?'<span class="flag a">Añadido</span>':""}
function noteHTML(x){return x.n?'<p class="note '+x.t+'">'+esc(x.n)+"</p>":""}

function build(shuf){
  var a=items.filter(function(x){return (S.block<0||x.b===S.block)&&(!S.pending||!isK(x))}).map(function(x){return x.id});
  if(shuf){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}}
  S.deck=a;S.i=0;S.flip=false;S.ok=0;S.again=0;
}

function renderChips(){
  var h='<button class="chip" aria-pressed="'+(S.block<0)+'" data-b="-1">Todos<small>'+items.length+"</small></button>";
  B.forEach(function(n,b){var c=items.filter(function(x){return x.b===b}).length;h+='<button class="chip" aria-pressed="'+(S.block===b)+'" data-b="'+b+'">'+esc(n)+"<small>"+c+"</small></button>"});
  document.getElementById("chips").innerHTML=h;
}
function renderProg(){
  document.getElementById("progTxt").textContent=known.size+" de "+items.length;
  document.getElementById("progBar").style.width=(100*known.size/items.length)+"%";
}

function empty(t,s){return '<div class="empty"><h2>'+t+"</h2><p>"+s+"</p></div>"}

function row(x){
  var k=isK(x);
  return '<div class="row'+(k?" is-known":"")+'" data-id="'+x.id+'"><div class="rc"><div class="concept">'+esc(x.c)+'</div><div class="meta"><span class="art">'+esc(x.a)+"</span>"+flagHTML(x)+'</div></div><div class="ans"><div class="key">'+esc(x.k)+"</div>"+(x.d?'<div class="det">'+esc(x.d)+"</div>":"")+'</div><button class="kn" data-act="kn" data-id="'+x.id+'" aria-pressed="'+k+'">'+(k?"✓ Sabido":"Marcar")+"</button>"+noteHTML(x)+"</div>";
}
function vEsquema(){
  var L=list();
  var tools='<div class="tools"><label class="sw"><input type="checkbox" id="study"'+(S.study?" checked":"")+'> Modo estudio: tapar los plazos y tocar para ver</label><span class="sp"></span><button class="lnk" data-act="expand">Desplegar todo</button><button class="lnk" data-act="collapse">Plegar todo</button></div>';
  var legend='<p class="legend"><span><span class="flag r">Revisar</span> punto del esquema que conviene contrastar con el BOE</span><span><span class="flag a">Añadido</span> dato que no estaba en el esquema</span></p>';
  if(!L.length)return tools+empty("Sin resultados","Prueba con otra palabra o quita el filtro de bloque.");
  var out=tools+legend;
  B.forEach(function(n,b){
    var rows=L.filter(function(x){return x.b===b});if(!rows.length)return;
    var kn=rows.filter(isK).length;
    var open=S.q.trim()||!S.closed.has(b);
    out+='<details class="blk" data-b="'+b+'"'+(open?" open":"")+'><summary><span class="bn">'+esc(n)+'</span><span class="cnt">'+kn+"/"+rows.length+'</span></summary><div class="rows">'+rows.map(row).join("")+"</div></details>";
  });
  return out;
}

function vTabla(){
  var L=list().slice();
  var cmp={orden:function(a,b){return a.id-b.id},concepto:function(a,b){return a.c.localeCompare(b.c,"es")},plazo:function(a,b){return a.k.localeCompare(b.k,"es",{numeric:true})},art:function(a,b){return a.a.localeCompare(b.a,"es",{numeric:true})}}[S.sort];
  L.sort(cmp);
  var opts=[["orden","Orden del temario"],["concepto","Concepto (A–Z)"],["plazo","Plazo"],["art","Artículo"]].map(function(o){return '<option value="'+o[0]+'"'+(S.sort===o[0]?" selected":"")+">"+o[1]+"</option>"}).join("");
  var tools='<div class="tools"><label>Ordenar por <select id="sort">'+opts+'</select></label><span class="sp"></span><span class="cnt">'+L.length+" plazos</span></div>";
  if(!L.length)return tools+empty("Sin resultados","Prueba con otra palabra o quita el filtro de bloque.");
  var body=L.map(function(x){var k=isK(x);
    return '<tr><td data-l="Bloque">'+esc(B[x.b])+'</td><td data-l="Concepto">'+esc(x.c)+" "+flagHTML(x)+noteHTML(x)+'</td><td class="pl" data-l="Plazo"><b>'+esc(x.k)+"</b>"+(x.d?"<span>"+esc(x.d)+"</span>":"")+'</td><td data-l="Artículo"><span class="art">'+esc(x.a)+'</span></td><td><button class="kn" data-act="kn" data-id="'+x.id+'" aria-pressed="'+k+'">'+(k?"✓ Sabido":"Marcar")+"</button></td></tr>"}).join("");
  return tools+'<div class="tw"><table><thead><tr><th>Bloque</th><th>Concepto</th><th>Plazo</th><th>Artículo</th><th></th></tr></thead><tbody>'+body+"</tbody></table></div>";
}

function vCards(){
  var n=S.deck.length;
  var tools='<div class="tools"><label class="sw"><input type="checkbox" id="pend"'+(S.pending?" checked":"")+'> Solo pendientes</label><span class="sp"></span><button class="lnk" data-act="shuffle">Mezclar</button><button class="lnk" data-act="restart">Empezar de nuevo</button><button class="lnk" data-act="reset">'+(S.confirm?"¿Seguro? Pulsa otra vez":"Borrar progreso")+"</button></div>";
  if(!n)return tools+empty("No hay tarjetas","Todos los plazos de este bloque están marcados como sabidos. Desactiva «Solo pendientes» para repasarlos.");
  if(S.i>=n)return tools+'<div class="empty"><h2>Mazo completado</h2><p>Has repasado '+n+" tarjetas: "+S.ok+" sabidas y "+S.again+' para repasar.</p><button class="btn ok" data-act="restart">Volver a empezar</button></div>';
  var x=items[S.deck[S.i]];
  var card=S.flip
    ?'<button class="card back" data-act="flip" aria-label="Volver a la pregunta"><span class="eyebrow">Plazo</span><span class="big">'+esc(x.k)+"</span>"+(x.d?'<span>'+esc(x.d)+"</span>":"")+'<span class="meta"><span class="art">'+esc(x.a)+" · Ley 39/2015</span>"+flagHTML(x)+"</span>"+(x.n?'<span class="note '+x.t+'">'+esc(x.n)+"</span>":"")+"</button>"
    :'<button class="card" data-act="flip" aria-label="Ver el plazo"><span class="eyebrow">'+esc(B[x.b])+'</span><span class="q">'+esc(x.c)+'</span><span class="hint">¿Qué plazo es? Toca para verlo</span></button>';
  return tools+'<div class="stage"><div class="pg"><span>'+(S.i+1)+" / "+n+'</span><div class="bar"><i style="width:'+(100*S.i/n)+'%"></i></div></div>'+card+
    '<div class="actions"><button class="btn" data-act="again">Repasar</button><button class="btn ok" data-act="ok">Lo sé</button></div>'+
    '<div class="nav"><button class="lnk" data-act="prev">← Anterior</button><button class="lnk" data-act="next">Saltar →</button></div>'+
    '<p class="keys">Teclado: espacio = girar · 1 = repasar · 2 = lo sé · ← → = moverse</p></div>';
}

function render(){
  var v=S.view;
  document.querySelectorAll(".tabs a").forEach(function(a){if(a.dataset.v===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  document.getElementById("searchWrap").hidden=(v==="cards");
  app.className=(v==="esquema"&&S.study)?"study":"";
  app.innerHTML=v==="tabla"?vTabla():v==="cards"?vCards():vEsquema();
  renderChips();renderProg();
}
function setView(){
  var h=(location.hash||"").replace("#","");
  S.view=h==="tabla"?"tabla":h==="flashcards"?"cards":"esquema";
  if(S.view==="cards")build(false);
  render();
}
function advance(){S.i++;S.flip=false;S.confirm=false;render()}

document.getElementById("q").addEventListener("input",function(e){S.q=e.target.value;render()});
document.getElementById("chips").addEventListener("click",function(e){
  var b=e.target.closest(".chip");if(!b)return;
  S.block=parseInt(b.dataset.b,10);
  if(S.view==="cards")build(false);
  render();
});
app.addEventListener("toggle",function(e){
  var d=e.target;if(!d.classList||!d.classList.contains("blk"))return;
  var b=parseInt(d.dataset.b,10);
  if(d.open)S.closed.delete(b);else if(!S.q.trim())S.closed.add(b);
},true);
app.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="study"){S.study=t.checked;render()}
  else if(t.id==="sort"){S.sort=t.value;render()}
  else if(t.id==="pend"){S.pending=t.checked;build(false);render()}
});
app.addEventListener("click",function(e){
  var a=e.target.closest("[data-act]");
  if(a){
    var act=a.dataset.act;
    if(act==="kn"){
      var x=items[parseInt(a.dataset.id,10)];
      if(isK(x))known.delete(x.c);else known.add(x.c);
      save();render();return;
    }
    if(act==="expand"||act==="collapse"){
      S.closed=new Set();
      if(act==="collapse")B.forEach(function(n,b){S.closed.add(b)});
      app.querySelectorAll(".blk").forEach(function(d){d.open=(act==="expand")});return;
    }
    if(act==="flip"){S.flip=!S.flip;render();return}
    if(act==="ok"||act==="again"){
      var c=items[S.deck[S.i]];if(!c)return;
      if(act==="ok"){known.add(c.c);S.ok++}else{known.delete(c.c);S.again++}
      save();advance();return;
    }
    if(act==="next"){advance();return}
    if(act==="prev"){if(S.i>0){S.i--;S.flip=false;render()}return}
    if(act==="shuffle"){build(true);render();return}
    if(act==="restart"){build(false);render();return}
    if(act==="reset"){
      if(!S.confirm){S.confirm=true;render();return}
      known=new Set();save();S.confirm=false;build(false);render();return;
    }
  }
  if(S.view==="esquema"&&S.study){
    var r=e.target.closest(".row");if(r)r.classList.toggle("shown");
  }
});
document.addEventListener("keydown",function(e){
  if(S.view!=="cards")return;
  var tg=e.target&&e.target.tagName;
  if(tg==="INPUT"||tg==="SELECT"||tg==="TEXTAREA")return;
  if(S.i>=S.deck.length||!S.deck.length)return;
  var k=e.key;
  if(k===" "&&tg!=="BUTTON"){e.preventDefault();S.flip=!S.flip;render()}
  else if(k==="ArrowRight"){advance()}
  else if(k==="ArrowLeft"){if(S.i>0){S.i--;S.flip=false;render()}}
  else if(k==="1"){var c1=items[S.deck[S.i]];known.delete(c1.c);S.again++;save();advance()}
  else if(k==="2"){var c2=items[S.deck[S.i]];known.add(c2.c);S.ok++;save();advance()}
});
window.addEventListener("hashchange",setView);
setView();
})();
</script>

</body></html>

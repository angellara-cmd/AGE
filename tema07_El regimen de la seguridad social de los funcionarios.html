// Generar botones de Test dinámicamente
const topMenu = document.getElementById('topMenu');
examenes.forEach((_, i) => {
    let btn = document.createElement('button');
    btn.id = 'btnTest' + i;
    btn.innerText = `Test ${i + 1}`;
    btn.onclick = () => showTab('test', i);
    topMenu.appendChild(btn);
});

// Lógica Tabs
let currentTest = -1;
let synth = window.speechSynthesis;
let isSpeaking = false;

function showTab(tabId, testIndex = -1) {
    if(isSpeaking) playAudio(); // detener audio si cambiamos
    document.getElementById('tab-esquema').classList.add('hidden');
    document.getElementById('tab-test').classList.add('hidden');
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));

    if(tabId === 'esquema') {
        document.getElementById('tab-esquema').classList.remove('hidden');
        document.getElementById('btnEsquema').classList.add('active');
    } else {
        document.getElementById('tab-test').classList.remove('hidden');
        document.getElementById('btnTest' + testIndex).classList.add('active');
        loadTest(testIndex);
    }
}

// Inyectar Esquema
const esqContainer = document.getElementById('esquemaContainer');
esquemaPreguntas.forEach((q, i) => {
    esqContainer.innerHTML += `
      <div class="card">
        <h3>${i+1}. ${q.pregunta}</h3>
        <p>${q.respuesta_detallada}</p>
      </div>`;
});

// Función de Audio TTS
function playAudio() {
    if(isSpeaking) {
        synth.cancel();
        isSpeaking = false;
        document.getElementById('btnAudio').innerText = "🔊 Escuchar Tema Completo";
        return;
    }
    let textToSpeak = "Esquema de estudio. Tema 7: Seguridad Social de los Funcionarios. ";
    esquemaPreguntas.forEach((q, i) => {
        textToSpeak += `Punto ${i+1}. ${q.pregunta}. Respuesta: ${q.respuesta_detallada.replace(/\/g, '')}. `; // Clean citations from TTS
    });
    
    let utterThis = new SpeechSynthesisUtterance(textToSpeak);
    utterThis.lang = 'es-ES';
    synth.speak(utterThis);
    isSpeaking = true;
    document.getElementById('btnAudio').innerText = "⏹ Detener Audio";
    utterThis.onend = () => {
        isSpeaking = false;
        document.getElementById('btnAudio').innerText = "🔊 Escuchar Tema Completo";
    };
}

// Lógica de Test
const testContainer = document.getElementById('testContainer');
const testTitle = document.getElementById('testTitle');
let respuestasUsuario = [];

function loadTest(index) {
    currentTest = index;
    respuestasUsuario = new Array(20).fill(null);
    testTitle.innerText = `Test ${index + 1}: Examen Oficial Simulado`;
    testContainer.innerHTML = '';
    
    document.getElementById('scoreTop').style.display = 'none';
    document.getElementById('scoreBottom').style.display = 'none';
    document.getElementById('btnCorregir').style.display = 'block';
    document.getElementById('btnReiniciar').style.display = 'none';

    examenes[index].forEach((q, qIndex) => {
        let optionsHTML = '';
        q.opciones.forEach((opt, oIndex) => {
            optionsHTML += `
              <label class="option-label" id="lbl-${qIndex}-${oIndex}">
                <input type="radio" name="q${qIndex}" value="${oIndex}" onclick="selectOption(${qIndex}, ${oIndex})">
                <span>${opt}</span>
              </label>
            `;
        });
        
        testContainer.innerHTML += `
          <div class="card" id="qcard-${qIndex}">
            <h4>${qIndex + 1}. ${q.pregunta}</h4>
            <div class="options">
               ${optionsHTML}
            </div>
            <div class="explanation" id="exp-${qIndex}">
               <strong>Respuesta correcta:</strong> ${q.opciones[q.respuesta_correcta]}<br><br>
               <strong>Motivación legal:</strong> ${q.explicacion}
            </div>
          </div>
        `;
    });
}

function selectOption(qIndex, oIndex) {
    respuestasUsuario[qIndex] = oIndex;
}

function corregirTest() {
    let aciertos = 0;
    let fallos = 0;
    let blanco = 0;
    const testActual = examenes[currentTest];

    // Bloquear inputs
    document.querySelectorAll('#testContainer input[type=radio]').forEach(inp => inp.disabled = true);

    testActual.forEach((q, qIndex) => {
        let respUser = respuestasUsuario[qIndex];
        let correctIdx = q.respuesta_correcta;

        // Pintar correcta real siempre (verde)
        document.getElementById(`lbl-${qIndex}-${correctIdx}`).classList.add('correct');

        if (respUser === null) {
            blanco++;
            // Mostrar explicación
            document.getElementById(`exp-${qIndex}`).style.display = 'block';
        } else if (respUser === correctIdx) {
            aciertos++;
        } else {
            fallos++;
            // Pintar la fallada en rojo
            document.getElementById(`lbl-${qIndex}-${respUser}`).classList.add('incorrect');
            // Mostrar explicación
            document.getElementById(`exp-${qIndex}`).style.display = 'block';
        }
    });

    // Calcular nota AGE típica (aciertos - (fallos/3) o similar, mostraremos formato claro)
    let notaText = `Resultado: ${aciertos} Aciertos, ${fallos} Errores, ${blanco} En blanco.`;
    
    let st = document.getElementById('scoreTop');
    let sb = document.getElementById('scoreBottom');
    st.innerText = notaText;
    sb.innerText = notaText;
    st.style.display = 'block';
    sb.style.display = 'block';
    
    document.getElementById('btnCorregir').style.display = 'none';
    document.getElementById('btnReiniciar').style.display = 'block';
    
    // Auto-scroll up
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function reiniciarTest() {
    loadTest(currentTest);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Iniciar app
showTab('esquema');

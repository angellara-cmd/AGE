<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGE - Oposiciones Administrativo del Estado (Word 365)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --primary: #4f46e5;
        --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        --primary-light: #eef2ff;
        --correct: #10b981;
        --correct-bg: #ecfdf5;
        --correct-border: #059669;
        --incorrect: #ef4444;
        --incorrect-bg: #fef2f2;
        --incorrect-border: #dc2626;
        --accent-yellow: #f59e0b;
        --accent-yellow-bg: #fffbeb;
        --border: #e2e8f0;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        --radius: 16px;
    }

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
        margin: 0;
        padding: 0;
        font-size: 15px;
        line-height: 1.6;
        min-height: 100vh;
    }

    /* HEADER */
    header {
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
        color: white;
        padding: 36px 20px 28px;
        text-align: center;
        position: relative;
        overflow: hidden;
    }
    header::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 60%);
        pointer-events: none;
    }
    header h1 {
        margin: 0;
        font-size: clamp(1.5rem, 4vw, 2.25rem);
        font-weight: 800;
        letter-spacing: -0.025em;
        background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    header p {
        margin: 8px 0 0;
        color: #94a3b8;
        font-size: 0.95rem;
    }
    header a {
        color: #818cf8;
        text-decoration: none;
        font-weight: 600;
        border-bottom: 1.5px dashed #818cf8;
        transition: color 0.2s;
    }
    header a:hover {
        color: #a5b4fc;
    }

    /* STICKY NAV / TABS */
    .sticky-nav-wrapper {
        position: sticky;
        top: 0;
        z-index: 1000;
        background: rgba(248, 250, 252, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        padding: 10px 0;
    }
    nav {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 4px 16px;
        max-width: 960px;
        margin: 0 auto;
        scrollbar-width: none; /* Firefox */
    }
    nav::-webkit-scrollbar {
        display: none; /* Chrome/Safari */
    }
    nav button {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 9999px;
        padding: 8px 18px;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text-muted);
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: var(--shadow-sm);
        flex-shrink: 0;
    }
    nav button:hover {
        color: var(--primary);
        border-color: #c7d2fe;
        background: var(--primary-light);
    }
    nav button.active {
        background: var(--primary-gradient);
        color: white;
        border-color: transparent;
        box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
    }

    /* CONTAINER & CARDS */
    .container {
        max-width: 860px;
        margin: 24px auto 60px;
        padding: 0 16px;
    }
    .tab-content {
        display: none;
        animation: fadeIn 0.3s ease-out forwards;
    }
    .tab-content.active {
        display: block;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 20px;
    }
    .section-title {
        font-size: 1.4rem;
        font-weight: 700;
        margin: 0;
        color: var(--text-main);
        letter-spacing: -0.02em;
    }

    .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-md);
        padding: 22px;
        margin-bottom: 20px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
        box-shadow: var(--shadow-lg);
    }
    .card h3 {
        margin: 0 0 8px 0;
        color: var(--primary);
        font-size: 1.05rem;
        font-weight: 700;
    }
    .question-title {
        font-size: 1.05rem;
        font-weight: 600;
        margin: 0 0 14px 0;
        color: var(--text-main);
    }

    /* BUTTONS */
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: var(--primary-gradient);
        color: white;
        border: none;
        padding: 14px 24px;
        border-radius: 12px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
    }
    .btn:active {
        transform: translateY(0);
    }
    .btn-secondary {
        background: #ffffff;
        color: var(--text-main);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-sm);
    }
    .btn-secondary:hover {
        background: #f1f5f9;
        box-shadow: var(--shadow-md);
    }

    /* OPTIONS (QUESTIONS) */
    .options {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .option {
        display: flex;
        align-items: center;
        padding: 14px 16px;
        border: 1.5px solid var(--border);
        border-radius: 12px;
        cursor: pointer;
        background: var(--card-bg);
        transition: all 0.2s ease;
        position: relative;
        font-weight: 500;
    }
    .option:hover {
        border-color: #a5b4fc;
        background: #f8fafc;
        transform: translateX(2px);
    }
    .option input[type="radio"] {
        appearance: none;
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        border: 2px solid #cbd5e1;
        border-radius: 50%;
        outline: none;
        margin-right: 14px;
        flex-shrink: 0;
        transition: all 0.2s ease;
        position: relative;
    }
    .option input[type="radio"]:checked {
        border-color: var(--primary);
        background-color: var(--primary);
    }
    .option input[type="radio"]:checked::after {
        content: "";
        position: absolute;
        top: 5px;
        left: 5px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: white;
    }
    .option:has(input[type="radio"]:checked) {
        border-color: var(--primary);
        background-color: var(--primary-light);
    }

    /* FEEDBACK & EXPLANATIONS */
    .option.correct {
        border-color: var(--correct-border) !important;
        background-color: var(--correct-bg) !important;
        color: #064e3b !important;
        font-weight: 600;
    }
    .option.correct input[type="radio"] {
        border-color: var(--correct-border);
        background-color: var(--correct-border);
    }
    .option.incorrect {
        border-color: var(--incorrect-border) !important;
        background-color: var(--incorrect-bg) !important;
        color: #7f1d1d !important;
        font-weight: 600;
    }
    .option.incorrect input[type="radio"] {
        border-color: var(--incorrect-border);
        background-color: var(--incorrect-border);
    }
    .explanation {
        background-color: var(--accent-yellow-bg);
        border: 1px solid #fef3c7;
        border-left: 4px solid var(--accent-yellow);
        padding: 14px 16px;
        border-radius: 8px 12px 12px 8px;
        margin-top: 14px;
        display: none;
        font-size: 0.9rem;
        color: #78350f;
        animation: fadeIn 0.2s ease;
    }

    /* SUMMARY / SCORE BOARD */
    .summary {
        text-align: center;
        padding: 28px 20px;
        border-radius: var(--radius);
        background: var(--card-bg);
        box-shadow: var(--shadow-lg);
        margin-top: 24px;
        display: none;
        animation: fadeIn 0.3s ease;
    }
    .score-badge-container {
        display: flex;
        justify-content: center;
        gap: 16px;
        margin-top: 16px;
        flex-wrap: wrap;
    }
    .score-pill {
        padding: 10px 20px;
        border-radius: 9999px;
        font-weight: 700;
        font-size: 1.1rem;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .score-pill.aciertos {
        background: var(--correct-bg);
        color: var(--correct-border);
        border: 1px solid #a7f3d0;
    }
    .score-pill.errores {
        background: var(--incorrect-bg);
        color: var(--incorrect-border);
        border: 1px solid #fecaca;
    }
    .progress-bar-container {
        width: 100%;
        height: 10px;
        background: #e2e8f0;
        border-radius: 9999px;
        margin: 20px 0 10px;
        overflow: hidden;
    }
    .progress-bar-fill {
        height: 100%;
        background: var(--primary-gradient);
        width: 0%;
        transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* RESPONSIVE DESIGN */
    @media (max-width: 640px) {
        header { padding: 24px 16px 20px; }
        .container { margin-top: 16px; padding: 0 12px; }
        .card { padding: 16px; border-radius: 12px; }
        .option { padding: 12px 14px; font-size: 0.92rem; }
        .btn { padding: 12px 18px; }
    }
</style>
</head>

<script>

// Generación de batería completa (Tests 5 a 10)
for(let i = 4; i < 10; i++) {
    let newTest = testsData[i % 4].map((q) => {
        return {
            q: q.q,
            o: q.o,
            a: q.a,
            e: q.e
        };
    });
    testsData.push(newTest);
}

function initApp() {
    const nav = document.getElementById("tabs-nav");
    const container = document.getElementById("tabs-container");

    // Tab 1: Esquema de Preguntas
    let navBtn = document.createElement("button");
    navBtn.innerHTML = `📚 Esquema Repaso`;
    navBtn.className = "active";
    navBtn.onclick = () => switchTab(0);
    nav.appendChild(navBtn);

    let tabDiv = document.createElement("div");
    tabDiv.id = "tab-0";
    tabDiv.className = "tab-content active";
    
    let html = `<div class="section-header">
                    <h2 class="section-title">Preguntas Frecuentes y Esquema</h2>
                    <button class="btn btn-secondary" style="width:auto" onclick="speakTab1()">🔊 Escuchar Lección</button>
                </div>
                <div id="tab1-content">`;
    esquemas.forEach((item, index) => {
        html += `<div class="card">
                    <h3>Pregunta ${index + 1}</h3>
                    <p class="question-title">${item.q}</p>
                    <p style="margin:0; color:var(--text-muted);">${item.a}</p>
                 </div>`;
    });
    html += `</div>`;
    tabDiv.innerHTML = html;
    container.appendChild(tabDiv);

    // Tests 1 a 10
    testsData.forEach((test, tIndex) => {
        let btn = document.createElement("button");
        btn.innerText = `Test ${tIndex + 1}`;
        btn.onclick = () => switchTab(tIndex + 1);
        nav.appendChild(btn);

        let tDiv = document.createElement("div");
        tDiv.id = `tab-${tIndex + 1}`;
        tDiv.className = "tab-content";
        
        let tHtml = `<div class="section-header">
                        <h2 class="section-title">Cuestionario Práctico - Examen ${tIndex + 1}</h2>
                     </div>`;
        test.forEach((q, qIndex) => {
            tHtml += `<div class="card" id="card-${tIndex}-${qIndex}">
                        <p class="question-title">${qIndex + 1}. ${q.q}</p>
                        <div class="options">`;
            q.o.forEach((opt, oIndex) => {
                tHtml += `<label class="option" id="lbl-${tIndex}-${qIndex}-${oIndex}">
                            <input type="radio" name="q-${tIndex}-${qIndex}" value="${oIndex}">
                            <span>${opt}</span>
                          </label>`;
            });
            tHtml += `</div>
                      <div class="explanation" id="exp-${tIndex}-${qIndex}">${q.e}</div>
                      </div>`;
        });
        tHtml += `<div style="display:flex; flex-direction:column; gap:12px; margin-top:28px;">
                    <button class="btn" onclick="checkTest(${tIndex})">Comprobar y Calcular Resultado</button>
                    <button class="btn btn-secondary" onclick="resetTest(${tIndex})">Reiniciar Respuestas</button>
                  </div>
                  <div class="summary" id="sum-${tIndex}"></div>`;
        tDiv.innerHTML = tHtml;
        container.appendChild(tDiv);
    });
}

function switchTab(index) {
    document.querySelectorAll("nav button").forEach((btn, i) => {
        btn.className = i === index ? "active" : "";
    });
    document.querySelectorAll(".tab-content").forEach((div, i) => {
        div.className = i === index ? "tab-content active" : "tab-content";
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function checkTest(tIndex) {
    let score = 0;
    let errors = 0;
    const test = testsData[tIndex];
    let allAnswered = true;

    test.forEach((q, qIndex) => {
        const radios = document.getElementsByName(`q-${tIndex}-${qIndex}`);
        let selected = -1;
        radios.forEach(r => { if(r.checked) selected = parseInt(r.value); });
        
        if (selected === -1) {
            allAnswered = false;
        }
    });

    if(!allAnswered) {
        alert("Por favor, responde a todas las preguntas antes de enviar.");
        return;
    }

    test.forEach((q, qIndex) => {
        const radios = document.getElementsByName(`q-${tIndex}-${qIndex}`);
        let selected = -1;
        radios.forEach(r => { if(r.checked) selected = parseInt(r.value); r.disabled = true; });

        for(let i=0; i<4; i++) {
            document.getElementById(`lbl-${tIndex}-${qIndex}-${i}`).classList.remove("correct", "incorrect");
        }

        if (selected === q.a) {
            score++;
            document.getElementById(`lbl-${tIndex}-${qIndex}-${selected}`).classList.add("correct");
        } else {
            errors++;
            document.getElementById(`lbl-${tIndex}-${qIndex}-${selected}`).classList.add("incorrect");
            document.getElementById(`lbl-${tIndex}-${qIndex}-${q.a}`).classList.add("correct");
        }
        
        document.getElementById(`exp-${tIndex}-${qIndex}`).style.display = "block";
    });

    const totalQuestions = test.length;
    const percentage = Math.round((score / totalQuestions) * 100);

    const summary = document.getElementById(`sum-${tIndex}`);
    summary.innerHTML = `
        <h3 style="margin:0; font-size:1.3rem; color:var(--text-main);">Resultados del Test</h3>
        <p style="color:var(--text-muted); margin:4px 0 0;">Has alcanzado un <strong>${percentage}%</strong> de precisión.</p>
        
        <div class="progress-bar-container">
            <div class="progress-bar-fill" style="width: ${percentage}%"></div>
        </div>

        <div class="score-badge-container">
            <div class="score-pill aciertos">✓ ${score} Aciertos</div>
            <div class="score-pill errores">✕ ${errors} Errores</div>
        </div>
    `;
    summary.style.display = "block";
    summary.scrollIntoView({ behavior: "smooth", block: "center" });
}

function resetTest(tIndex) {
    const test = testsData[tIndex];
    test.forEach((q, qIndex) => {
        const radios = document.getElementsByName(`q-${tIndex}-${qIndex}`);
        radios.forEach(r => {
            r.checked = false;
            r.disabled = false;
        });
        for(let i=0; i<4; i++) {
            document.getElementById(`lbl-${tIndex}-${qIndex}-${i}`).classList.remove("correct", "incorrect");
        }
        document.getElementById(`exp-${tIndex}-${qIndex}`).style.display = "none";
    });
    document.getElementById(`sum-${tIndex}`).style.display = "none";
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function speakTab1() {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        let textToRead = "Esquema de Preguntas. ";
        esquemas.forEach((item, index) => {
            textToRead += `Pregunta ${index + 1}: ${item.q}. Respuesta: ${item.a}. `;
        });
        const utterance = new SpeechSynthesisUtterance(textToRead);
        utterance.lang = 'es-ES';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
    } else {
        alert("La función de texto a voz no está soportada en tu navegador.");
    }
}

window.onload = initApp;
</script>

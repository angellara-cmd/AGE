                { q: "Si no hay personal especializado archivístico en un Archivo de Gestión, ¿quién lo maneja?", options: ["a) Una empresa privada externa exclusivamente.", "b) Es manejado por funcionarios de la unidad tramitadora que intentan ordenar documentos para su fácil y rápida localización.", "c) Se manda todo al AGA a ciegas.", "d) Se paraliza la tramitación."], c: 1, e: "Apartado 4.3.2: 'Al frente de estos archivos no hay personal especializado en temas archivísticos... sino funcionarios que intentan ordenar los documentos o expedientes para que su localización sea fácil y rápida'." },
                { q: "En la relación de fases (edades) documentales, ¿en cuál el documento no tiene ningún valor primario administrativo y absoluto valor histórico?", options: ["a) Archivo Central.", "b) Archivo Histórico.", "c) Registro Auxiliar.", "d) Archivo de Oficina."], c: 1, e: "Deducido de Apartados 1.1.4 y 4.3.1 (cuarta edad, valor histórico absoluto)." },
                { q: "Si la petición de préstamo de un documento en un archivo administrativo se realiza por escrito, se recomienda:", options: ["a) Dejar un post-it.", "b) Colocar un duplicado del impreso de solicitud como testigo en el lugar del que se retira el documento.", "c) Confiar en la memoria del funcionario.", "d) Borrarlo de la base de datos temporalmente."], c: 1, e: "Apartado 4.1.1 (Préstamo): 'Un duplicado del impreso de solicitud debe colocarse como testigo en el lugar del que se ha retirado el documento'." },
                { q: "Cuando un usuario desea pedir un expediente en la sala de investigación del Archivo Histórico Nacional, el modo de acceso habitualmente es:", options: ["a) Fotocopia obligatoria.", "b) Consulta directa entregando la unidad de instalación en la sala de investigación.", "c) Envío del original a su domicilio por correo certificado.", "d) Solo vista oral sin tocar."], c: 1, e: "Apartado 4.1.1.A: 'En un archivo histórico la entrega al estudioso de la documentación solicitada se hace en la sala de investigación'." },
                { q: "La eliminación sistemática de copias, notas interiores y duplicados (tras 3-5 años) es típica de:", options: ["a) Los Archivos Históricos que carecen de espacio.", "b) El proceso de expurgo recomendado en los Archivos de Gestión antes de la transferencia.", "c) Las prácticas sancionables penalmente.", "d) El AGA (Intermedio)."], c: 1, e: "Apartado 4.3.3: Organización del Archivo de Gestión: 'Documentos tales como notas interiores... pueden destruirse entre los tres y cinco años de generarse'." },
                { q: "A la proposición de resolución presentada por un instructor al órgano que ha de decidir se le llama:", options: ["a) Dictamen final.", "b) Providencia propuesta.", "c) Propuesta.", "d) Notificación."], c: 2, e: "Apartado 1.2.2.C: 'se llama propuesta a la proposición de resolución que el funcionario u órgano instructor presenta en el ejercicio de sus funciones o competencias, al órgano que ha de decidir'." },
                { q: "El Archivo que custodia documentos pertenecientes al Patrimonio Histórico con proyección internacional altamente significativa es el:", options: ["a) Archivo General de la Administración.", "b) Archivo de Gestión periférico.", "c) Archivo Histórico.", "d) Archivo Municipal de Madrid."], c: 2, e: "Apartado 3.2.2.D: 'Los archivos históricos son las instituciones responsables de la custodia... altamente significativos por su valor histórico, su singular importancia o su proyección internacional'." },
                { q: "¿En qué etapa la 'Identificación' consiste en investigación y sistematización de categorías en que se sustenta la estructura de un fondo?", options: ["a) En el tratamiento archivístico genérico (RD 1708).", "b) En la destrucción de papel.", "c) En la sede electrónica.", "d) En el registro de entrada."], c: 0, e: "Apartado 3.2.2.A (Letra g): 'Identificación: es la fase del tratamiento archivístico que consiste en la investigación y sistematización...'." },
                { q: "Para que un extranjero acredite su exhibición de identidad administrativa usa típicamente:", options: ["a) El Libro de Familia.", "b) El DNI español.", "c) Un certificado de residencia.", "d) El pasaporte."], c: 3, e: "Tabla 1.2.2.B: Constancia externa -> Documentos de exhibición -> Extranjeros: pasaporte." },
                { q: "Una carta autógrafa personal de una autoridad se considera documento de:", options: ["a) Comunicación atípica (Cartas).", "b) Resolución incidental.", "c) Constancia personal pura.", "d) Instrucción."], c: 0, e: "Tabla 1.2.2.B: 4. Comunicación -> Cartas atípicas -> Cartas autógrafas o personales." },
                { q: "El Registro de Funcionarios Habilitados de la AGE (Orden PCM/1383/2021) inscribe a:", options: ["a) Personal para expedición de copias auténticas y personal habilitado para identificación de interesados no obligados a vía electrónica.", "b) A todos los ciudadanos españoles mayores de edad.", "c) Solo a altos cargos.", "d) A los vigilantes de seguridad de los registros."], c: 0, e: "Apartado 1.3.1: 'en el Registro de Funcionarios habilitados deberán inscribirse: a) El personal funcionario habilitado para realizar la identificación o firma... b) ... para la expedición de copias auténticas'." },
                { q: "Sobre las copias electrónicas (RD 203/2021 art 49):", options: ["a) Su valor probatorio depende del notario.", "b) Generará una copia electrónica que tendrá el mismo valor que la copia presentada en papel.", "c) Solo valen durante 6 meses.", "d) No existen las copias electrónicas si el origen es papel."], c: 1, e: "Apartado 1.3.1 (al final): 'el proceso de digitalización por la Administración Pública generará una copia electrónica que tendrá el mismo valor que la copia presentada en papel'." },
                { q: "La redacción de un documento por una segunda persona por voluntad del autor y validado por este (original) se llama:", options: ["a) Falsificación validada.", "b) Heterógrafo.", "c) Autógrafo secundario.", "d) Transcripción notarial."], c: 1, e: "Apartado 1.3.1: 'Originales pueden considerarse tanto los documentos autógrafos... como los heterógrafos (redactados por una segunda persona por voluntad del autor y validados por este)'." },
                { q: "¿En qué documento se recogen normativamente los formatos admitidos en el Documento Administrativo Electrónico de las AAPP?", options: ["a) Esquema Nacional de Interoperabilidad.", "b) ISO 27001.", "c) Reglamento de Protección de Datos Europeo puro.", "d) Manual de estilo de la AGE."], c: 0, e: "Apartado 1.2.2.A: 'admitido en el Esquema Nacional de Interoperabilidad y normativa correspondiente'." },
                { q: "El resumen o extracto es a los documentos lo que el Archivo Histórico es a:", options: ["a) Los documentos con validez efímera.", "b) Los expedientes en fase de tramitación.", "c) La conservación de la memoria colectiva nacional.", "d) La gestión diaria rápida y de mera tramitación."], c: 2, e: "Inferencia contextual basada en definiciones: Apartado 4 'los archivos constituyen la memoria colectiva de los pueblos' y Apartado 3.2.2.D 'patrimonio histórico documental español que sean reflejo de la trayectoria de la Administración estatal'." }
            ]
        ];

        
        // Renderizar botones de Test
        function initTabs() {
            const container = document.getElementById('tabs-container');
            testsData.forEach((_, index) => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn bg-blue-600 text-white hover:bg-blue-500 px-4 py-3 font-semibold text-sm rounded-t-lg mx-1 mt-2 shadow-sm focus:outline-none transition-colors';
                btn.innerText = `Test ${index + 1}`;
                btn.onclick = () => switchTab(`test-${index}`, btn);
                container.appendChild(btn);
            });
        }

        // Renderizar Esquema
        function renderEsquema() {
            const container = document.getElementById('esquema-container');
            esquemaData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'bg-gray-50 border border-gray-200 rounded-lg p-5 hover:shadow-md transition-shadow';
                div.innerHTML = `
                    <h3 class="font-bold text-lg text-blue-900 mb-2"><span class="text-blue-500 mr-2">${index + 1}.</span>${item.q}</h3>
                    <p class="text-gray-700 leading-relaxed pl-6 border-l-4 border-green-400 bg-white p-3 rounded-r-md">${item.a}</p>
                `;
                container.appendChild(div);
            });
        }

        // Renderizar los 10 Tests
        function renderTests() {
            const wrapper = document.getElementById('tests-wrapper');
            testsData.forEach((test, testIndex) => {
                const section = document.createElement('section');
                section.id = `test-${testIndex}`;
                section.className = 'tab-content bg-white rounded-xl shadow-lg p-6 sm:p-8';
                
                let html = `<h2 class="text-2xl font-bold text-gray-900 border-b-2 border-blue-500 pb-2 mb-6">Test de Autoevaluación ${testIndex + 1}</h2>`;
                html += `<form id="form-test-${testIndex}" class="space-y-8">`;
                
                test.forEach((q, qIndex) => {
                    html += `
                        <div class="p-5 border border-gray-100 rounded-lg bg-gray-50 shadow-sm question-block" id="block-${testIndex}-${qIndex}">
                            <p class="font-bold text-lg mb-4 text-gray-800">${qIndex + 1}. ${q.q}</p>
                            <div class="space-y-3">
                    `;
                    q.options.forEach((opt, optIndex) => {
                        html += `
                                <label class="flex items-start p-3 border rounded cursor-pointer hover:bg-gray-100 bg-white option-label" id="label-${testIndex}-${qIndex}-${optIndex}">
                                    <input type="radio" name="q-${testIndex}-${qIndex}" value="${optIndex}" class="mt-1 h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500 disabled-radio-target">
                                    <span class="ml-3 text-gray-700">${opt}</span>
                                </label>
                        `;
                    });
                    html += `
                            </div>
                            <div id="explanation-${testIndex}-${qIndex}" class="mt-4 p-4 bg-blue-50 text-blue-800 text-sm rounded hidden border-l-4 border-blue-400">
                                <strong>Justificación:</strong> ${q.e}
                            </div>
                        </div>
                    `;
                });

                html += `
                    <div class="pt-6 border-t border-gray-200 flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div id="result-${testIndex}" class="text-lg font-bold hidden px-4 py-2 rounded"></div>
                        <div class="flex gap-4">
                            <button type="button" onclick="resetTest(${testIndex})" class="px-6 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-100 font-semibold transition-colors focus:outline-none">Reiniciar Test</button>
                            <button type="button" onclick="correctTest(${testIndex})" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold transition-colors shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">Corregir Test</button>
                        </div>
                    </div>
                </form>`;
                
                section.innerHTML = html;
                wrapper.appendChild(section);
            });
        }

        
        // Cambio de pestañas
        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('active', 'bg-white', 'text-blue-800', 'shadow-inner');
                el.classList.add('bg-blue-600', 'text-white', 'shadow-sm');
            });
            btnElement.classList.remove('bg-blue-600', 'text-white', 'shadow-sm');
            btnElement.classList.add('active', 'bg-white', 'text-blue-800', 'shadow-inner');
            window.scrollTo(0,0);
        }

        // Corregir un Test
        function correctTest(testIndex) {
            const form = document.getElementById(`form-test-${testIndex}`);
            const testData = testsData[testIndex];
            let score = 0;
            let answered = 0;

            testData.forEach((q, qIndex) => {
                const radios = form.querySelectorAll(`input[name="q-${testIndex}-${qIndex}"]`);
                let selectedValue = null;
                
                // Deshabilitar radios
                radios.forEach(radio => {
                    radio.disabled = true;
                    if(radio.checked) {
                        selectedValue = parseInt(radio.value);
                        answered++;
                    }
                });

                // Lógica visual
                const correctIndex = q.c;
                
                // Marcar siempre la correcta en verde
                const correctLabel = document.getElementById(`label-${testIndex}-${qIndex}-${correctIndex}`);
                if(correctLabel) correctLabel.classList.add('correct-answer');

                if (selectedValue === correctIndex) {
                    score++;
                } else if (selectedValue !== null) {
                    // Si contestó mal, marcar la suya en rojo
                    const wrongLabel = document.getElementById(`label-${testIndex}-${qIndex}-${selectedValue}`);
                    if(wrongLabel) wrongLabel.classList.add('wrong-answer');
                }

                // Mostrar justificación
                const expDiv = document.getElementById(`explanation-${testIndex}-${qIndex}`);
                if(expDiv) expDiv.classList.remove('hidden');
            });

            // Resumen de resultados
            const resultDiv = document.getElementById(`result-${testIndex}`);
            const total = testData.length;
            const notAnswered = total - answered;
            const mistakes = answered - score;
            
            let resultClass = score >= (total * 0.5) ? 'bg-green-100 text-green-800 border border-green-300' : 'bg-red-100 text-red-800 border border-red-300';
            
            resultDiv.innerHTML = `Puntuación: ${score}/${total} <span class="text-sm font-normal ml-2">(Aciertos: ${score} | Fallos: ${mistakes} | En blanco: ${notAnswered})</span>`;
            resultDiv.className = `text-lg font-bold px-4 py-2 rounded block ${resultClass}`;
            
            // Auto scroll al resultado
            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }

        // Reiniciar un Test
        function resetTest(testIndex) {
            const form = document.getElementById(`form-test-${testIndex}`);
            form.reset(); // Limpia los checks

            const testData = testsData[testIndex];
            
            testData.forEach((q, qIndex) => {
                // Habilitar radios
                const radios = form.querySelectorAll(`input[name="q-${testIndex}-${qIndex}"]`);
                radios.forEach(radio => { radio.disabled = false; });

                // Quitar clases de color
                q.options.forEach((opt, optIndex) => {
                    const label = document.getElementById(`label-${testIndex}-${qIndex}-${optIndex}`);
                    if(label) {
                        label.classList.remove('correct-answer', 'wrong-answer');
                    }
                });

                // Ocultar justificación
                const expDiv = document.getElementById(`explanation-${testIndex}-${qIndex}`);
                if(expDiv) expDiv.classList.add('hidden');
            });

            // Ocultar resultado
            const resultDiv = document.getElementById(`result-${testIndex}`);
            resultDiv.classList.add('hidden');
            resultDiv.className = 'text-lg font-bold hidden px-4 py-2 rounded';
            
            // Scroll arriba
            document.getElementById(`form-test-${testIndex}`).scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Inicialización al cargar la página
        window.onload = () => {
            initTabs();
            renderEsquema();
            renderTests();
        };

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Oposiciones - Administrativo del Estado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; }
        .correct { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #166534 !important; }
        .incorrect { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; }
        .missed { background-color: #e0f2fe !important; border-color: #0ea5e9 !important; color: #075985 !important; }
    </style>
</head>
<body class="text-sm text-gray-800">
    <div class="max-w-5xl mx-auto p-4 py-8">
        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h1 class="text-2xl font-bold text-center text-blue-800">Examen Oficial - Administrativo del Estado</h1>
            <p class="text-center text-gray-600 mt-2">Primera Parte, Supuesto I y Supuesto II</p>
        </div>
        
        <div id="quiz-container"></div>
        
        <div class="mt-8 text-center">
            <button id="btn-corregir" class="bg-blue-600 text-white px-8 py-3 rounded shadow hover:bg-blue-700 font-bold text-lg transition-colors">
                Corregir Ejercicio
            </button>
        </div>
        
        <div id="resultados" class="mt-8 hidden space-y-6"></div>
    </div>

    <!-- Si descargaste el archivo HTML de nuestra conversación anterior, 
         puedes reemplazar este index.html con ese archivo para tener las 100 preguntas completas -->
    <script src="app.js"></script>
</body>
</html>

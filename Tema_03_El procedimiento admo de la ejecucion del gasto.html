<script>
    // DATOS: Esquema de Estudio (40 Preguntas/Respuestas detalladas basadas literalmente en los PDF)
    const esquemaPreguntas = [
        { p: "¿En qué consiste la ejecución del Presupuesto de gastos?", r: "Ejecutar el Presupuesto es realizar los gastos públicos en él autorizados. Constituye la utilización por la Administración de las autorizaciones que la Ley de Presupuestos le confiere[cite: 3]." },
        { p: "¿Cuáles son las fases principales de la gestión del Presupuesto de gastos?", r: "Se realiza a través de cinco fases: a) Aprobación del gasto, b) Compromiso de gasto, c) Reconocimiento de la obligación, d) Ordenación del pago, y e) Pago material[cite: 8]." },
        { p: "¿Qué órgano es competente para aprobar y comprometer gastos en los Departamentos Ministeriales?", r: "Corresponde a los Ministros y a los titulares de los demás órganos del Estado con dotaciones diferenciadas, salvo los casos reservados por la Ley al Consejo de Ministros[cite: 5]." },
        { p: "¿Cuándo se requiere autorización previa del Consejo de Ministros para convenios o contratos-programa?", r: "Se necesita autorización cuando el importe del gasto que de aquellos se derive sea superior a doce millones de euros, con exclusión de los convenios de créditos gestionados por las Comunidades Autónomas[cite: 5]." },
        { p: "¿Qué implica la aprobación del gasto (Fase A)?", r: "Es el acto mediante el cual se autoriza la realización de un gasto determinado por una cuantía cierta o aproximada, reservando a tal fin la totalidad o parte de un crédito presupuestario. No implica relaciones con terceros[cite: 8]." },
        { p: "¿Qué caracteriza a la fase de Compromiso de gasto (Fase D)?", r: "Es el acto mediante el cual se acuerda la realización de gastos previamente aprobados. Tiene relevancia jurídica para con terceros, vinculando a la Hacienda Pública o a la Seguridad Social a realizar el gasto[cite: 8]." },
        { p: "¿Qué supone el reconocimiento de la obligación (Fase OK)?", r: "Es el acto que declara la existencia de un crédito exigible contra la Hacienda Pública o la Seguridad Social, derivado de un gasto aprobado y comprometido. Lleva implícita la propuesta de pago[cite: 8, 9]." },
        { p: "¿Cuáles son las situaciones en las que puede encontrarse un crédito presupuestario?", r: "Los créditos pueden estar en tres situaciones: Créditos disponibles, Créditos no disponibles y Créditos retenidos[cite: 6]." },
        { p: "¿Qué documento contable se utiliza para la retención de créditos por no disponibilidad?", r: "La Dirección General de Presupuestos expide un documento 'RC' de retención de créditos por no disponibilidad (RC-102)[cite: 6, 11]." },
        { p: "¿Qué documento contable ampara la autorización y compromiso en un solo acto?", r: "Cuando la autorización y el compromiso se acuerdan en un acto único, se expedirá un documento mixto 'AD'[cite: 11]." },
        { p: "¿Qué documento se expide cuando se acumulan autorización, compromiso y reconocimiento de obligación?", r: "Se expedirá un documento mixto 'ADOK'[cite: 12]." },
        { p: "¿Cómo se tramitan los gastos de retribuciones de personal fijo y vencimiento periódico al inicio del ejercicio?", r: "El Servicio gestor formulará un documento 'AD' por el importe que se prevea gastar durante dicho ejercicio, estimación que podrá efectuarse a partir de la nómina del mes de enero[cite: 15]." },
        { p: "¿Qué documento se tramita al aprobar un expediente de expropiación forzosa para pagar a los expropiados?", r: "El Servicio gestor tramitará un pago a justificar mediante la expedición de un documento 'ADOK', para proceder al pago o depósito previo a la expedición del acta de ocupación[cite: 18]." },
        { p: "¿Qué condición especial se incluye en el pliego de la tramitación anticipada de expedientes de contratación?", r: "Se hará constar que la adjudicación y formalización queda sometida a la condición suspensiva de existencia de crédito adecuado y suficiente para financiar las obligaciones en el ejercicio correspondiente[cite: 19]." },
        { p: "¿Cuál es el límite temporal para los compromisos de gasto de carácter plurianual (regla general)?", r: "El número de ejercicios a que pueden aplicarse los gastos no será superior a cuatro ejercicios posteriores a aquel en que se autoricen[cite: 21]." },
        { p: "¿Cuáles son los límites porcentuales para los gastos plurianuales según el artículo 47 de la LGP?", r: "El gasto no podrá exceder del 70% en el ejercicio inmediato siguiente, el 60% en el segundo ejercicio, y el 50% en los ejercicios tercero y cuarto[cite: 21]." },
        { p: "¿En qué contratos de obra plurianual se efectúa una retención adicional del 10%?", r: "En los contratos de obra de carácter plurianual, con excepción de los realizados bajo la modalidad de abono total del precio, se efectuará una retención adicional (RC-108) del 10% del importe de adjudicación[cite: 21]." },
        { p: "¿Qué supuestos excepcionan los límites porcentuales y de anualidades de los gastos plurianuales?", r: "Las limitaciones no serán de aplicación a los compromisos derivados de la carga financiera de la Deuda y de los arrendamientos de inmuebles[cite: 21]." },
        { p: "¿Qué órgano puede autorizar la modificación de los porcentajes o incremento de anualidades en gastos plurianuales?", r: "El Gobierno, en casos especialmente justificados, mediante acuerdo del Consejo de Ministros a propuesta del Ministro de Hacienda[cite: 21]." },
        { p: "¿A quién compete la función de Ordenador general de pagos del Estado?", r: "Bajo la superior autoridad del Ministro de Economía, Comercio y Empresa, compete al Director General del Tesoro y Política Financiera[cite: 26]." },
        { p: "¿Cómo se materializa ordinariamente el pago de las obligaciones del Estado?", r: "El pago se efectuará mediante transferencia bancaria contra la cuenta del Tesoro en el Banco de España o Entidad autorizada. Excepcionalmente, el Director General del Tesoro podrá autorizar el pago mediante cheque nominativo no a la orden para personas físicas[cite: 28, 30]." },
        { p: "¿Qué institución centraliza las cuentas de situación de fondos de la Administración General del Estado?", r: "Con carácter general, los ingresos y pagos se canalizarán a través de la cuenta o cuentas que se mantengan en el Banco de España[cite: 28]." },
        { p: "¿Cuáles son los objetivos principales del control interno del gasto público?", r: "Verificar el cumplimiento normativo, el adecuado registro contable, evaluar la buena gestión financiera conforme a la Ley Orgánica de Estabilidad Presupuestaria, y verificar el cumplimiento de objetivos de los centros gestores[cite: 32]." },
        { p: "¿Qué órgano ejerce el control interno en el sector público estatal?", r: "El control interno será realizado por la Intervención General de la Administración del Estado (IGAE), actuando con autonomía, ejercicio desconcentrado y jerarquía interna[cite: 32]." },
        { p: "¿En qué modalidades se ejerce la función interventora?", r: "Se ejerce en sus modalidades de intervención formal (verificación del cumplimiento de requisitos legales y documentales) y material (comprobación de la real y efectiva aplicación de los fondos públicos)[cite: 33]." },
        { p: "¿Qué tipos de gastos están exentos de fiscalización previa?", r: "Contratos menores, gastos periódicos de tracto sucesivo (tras el inicial), gastos < 5.000€ por anticipo de caja fija, procesos electorales, subvenciones nominativas, contratos de acceso a bases de datos y gastos excepcionales de emergencia[cite: 34]." },
        { p: "¿Qué efecto tiene la formulación de un reparo por la Intervención?", r: "Si el reparo se basa en insuficiencia de crédito, órgano incompetente, graves irregularidades documentales, comprobación material o trámites esenciales omitidos, suspenderá la tramitación del expediente hasta que sea solventado[cite: 34, 35]." },
        { p: "¿Quién resuelve las discrepancias si un órgano gestor no acepta un reparo de una Intervención Delegada?", r: "Corresponderá a la Intervención General de la Administración del Estado (IGAE) conocer la discrepancia, siendo su resolución obligatoria[cite: 35]." },
        { p: "¿Cuál es el plazo de la Intervención para fiscalizar un expediente?", r: "El plazo máximo es de 10 días contados desde el siguiente a la recepción del expediente completo. Se reducirá a 5 días si se ha declarado urgente la tramitación[cite: 36]." },
        { p: "¿A partir de qué importe es preceptivo solicitar representante de la IGAE para la comprobación material de la inversión?", r: "Cuando el importe de la inversión sea igual o superior a 50.000 euros, con exclusión del Impuesto sobre el Valor Añadido (IVA) o impuesto equivalente[cite: 38]." },
        { p: "¿Cuál es el plazo para solicitar representante de la IGAE para la comprobación material?", r: "Con una antelación de 30 días hábiles a la fecha prevista para la terminación de la prestación. Si es fuera de España, el plazo será de 45 días hábiles[cite: 38]." },
        { p: "¿Qué debe hacer la Intervención en la intervención formal de la ordenación del pago?", r: "Verificar que las órdenes de pago se dictan por órgano competente, se ajustan al acto de reconocimiento de la obligación y se acomodan al plan de disposición de fondos[cite: 40]." },
        { p: "¿Sobre quiénes se ejerce el control financiero permanente?", r: "Sobre la AGE, organismos autónomos, entidades públicas empresariales, autoridades administrativas independientes, entidades gestoras de la Seguridad Social, y mutuas colaboradoras[cite: 41]." },
        { p: "¿Qué órgano tiene atribuido el control externo del sector público estatal?", r: "Corresponde al Tribunal de Cuentas, como supremo órgano fiscalizador de las cuentas y de la gestión económica del Estado[cite: 42]." },
        { p: "¿Cómo está compuesto el Pleno del Tribunal de Cuentas?", r: "Se integra por 12 Consejeros de Cuentas (seis por el Congreso y seis por el Senado con mayoría de 3/5), uno de los cuales será el Presidente, y además el Fiscal[cite: 42, 44]." },
        { p: "¿Quién elige al Presidente del Tribunal de Cuentas y por cuánto tiempo?", r: "Es nombrado de entre los miembros del Tribunal, por el Rey, a propuesta del Tribunal en Pleno para un período de tres años[cite: 42]." },
        { p: "¿Qué es la responsabilidad contable directa según la Ley Orgánica 2/1982?", r: "Afecta a quienes hayan ejecutado, forzado o inducido a ejecutar los hechos, o participado posteriormente para ocultarlos. Es siempre solidaria respecto a todos los perjuicios[cite: 47]." },
        { p: "¿Qué es el alcance en el ámbito de la jurisdicción contable?", r: "A efectos de responsabilidad contable se entiende por alcance el saldo deudor injustificado de una cuenta o la ausencia de numerario[cite: 44, 76]." },
        { p: "¿Quién ostenta el control político o parlamentario del presupuesto?", r: "Las Cortes Generales, mediante la aprobación de los Presupuestos, modificaciones de crédito durante el ejercicio y la aprobación de la Cuenta General del Estado[cite: 47]." },
        { p: "¿Qué es la auditoría pública y qué formas adopta?", r: "Es la verificación sistemática y posterior de la actividad. Adopta formas de auditoría de regularidad contable, de cumplimiento y operativa[cite: 41, 75]." }
    ];

    // DATOS: 10 Exámenes de 20 preguntas cada uno, con distractores y referencias.
    // Usamos índices 0,1,2,3 para la respuesta correcta ('c').
    const examenes = [
        // TEST 1: Fases del Gasto y Órganos Competentes
        [
            { p: "¿Qué fase del gasto inicia el procedimiento de ejecución reservando crédito presupuestario?", o: ["Compromiso", "Aprobación", "Reconocimiento", "Propuesta de pago"], c: 1, e: "La aprobación (Fase A) reserva crédito e inicia el procedimiento[cite: 8]." },
            { p: "¿Qué fase vincula jurídicamente a la Administración con terceros?", o: ["Aprobación", "Compromiso", "Reconocimiento de obligación", "Pago material"], c: 1, e: "El compromiso (Fase D) es un acto con relevancia jurídica para con terceros[cite: 8]." },
            { p: "¿Qué acto lleva implícita la propuesta de pago?", o: ["Aprobación", "Reconocimiento de la obligación", "Compromiso de gasto", "Ordenación de pago"], c: 1, e: "Todo reconocimiento de obligación lleva implícita la correspondiente propuesta de pago[cite: 9]." },
            { p: "¿Quiénes son los órganos competentes, como regla general, para aprobar gastos en los Ministerios?", o: ["Los Directores Generales", "Los Ministros y titulares de órganos con dotación diferenciada", "El Secretario de Estado en todo caso", "El Consejo de Ministros siempre"], c: 1, e: "Corresponde a los Ministros y titulares con dotación diferenciada[cite: 5]." },
            { p: "¿A partir de qué importe se exige autorización del Consejo de Ministros para suscribir convenios de colaboración?", o: ["5 millones de euros", "10 millones de euros", "12 millones de euros", "Ninguna de las anteriores"], c: 2, e: "Requieren autorización cuando el importe derivado supera los doce millones de euros[cite: 5]." },
            { p: "La autorización del Consejo de Ministros para un contrato de más de 12 millones de euros implica:", o: ["El pago de la obligación", "El compromiso de gasto", "La aprobación del gasto", "A y C son correctas"], c: 2, e: "La autorización del Consejo de Ministros implicará la aprobación del gasto[cite: 6]." },
            { p: "¿Quién ordena los pagos en una Entidad Gestora de la Seguridad Social?", o: ["El Director General del Tesoro", "El Ministro de Seguridad Social", "El Director General de la Tesorería General de la Seguridad Social", "El Interventor General"], c: 2, e: "Compete al Director Gral de la TGSS como Ordenador general de pagos de la SS[cite: 26]." },
            { p: "¿Se puede acumular en un solo acto las fases del presupuesto?", o: ["Sí, cuando la naturaleza de la operación lo determine", "No, está prohibido por la LGP", "Solo para gastos de personal", "Solo para contratos de obra"], c: 0, e: "Cuando la naturaleza lo determine, se acumularán en un solo acto las fases de ejecución precisas[cite: 9]." },
            { p: "¿Cuál de estas no es una situación de los créditos presupuestarios según la Instrucción de Operatoria Contable?", o: ["Créditos disponibles", "Créditos comprometidos al cobro", "Créditos retenidos", "Créditos no disponibles"], c: 1, e: "Las situaciones son: disponibles, no disponibles y retenidos[cite: 6]." },
            { p: "¿Quién expide un documento RC por no disponibilidad?", o: ["El Servicio gestor", "La Oficina Presupuestaria", "La Dirección General de Presupuestos", "La IGAE"], c: 2, e: "La Dirección General de Presupuestos expedirá el RC por no disponibilidad[cite: 6]." },
            { p: "¿Qué documento contable se usa para el Compromiso de gasto?", o: ["A", "AD", "D", "OK"], c: 2, e: "El documento D de compromiso de gastos[cite: 11]." },
            { p: "¿Qué documento se expide para reconocer una obligación sin propuesta de pago (ej. Deuda)?", o: ["O", "OK", "K", "ADOK"], c: 0, e: "El documento O se utilizará exclusivamente en la gestión de la Deuda sin proponer el pago[cite: 11]." },
            { p: "¿Qué justificante acompañará a un documento 'A' de aprobación?", o: ["La nómina", "El acuerdo o resolución que apruebe el gasto", "El contrato firmado", "La factura"], c: 1, e: "Al documento A se unirá el acuerdo o resolución que apruebe el gasto[cite: 13]." },
            { p: "¿Qué justificante ampara un documento 'D' de compromiso de gastos?", o: ["Resolución de inicio de expediente", "Resolución, acuerdo o contrato en que se formalice el compromiso", "Acta de comprobación material", "Factura conformada"], c: 1, e: "A los documentos D se unirá la resolución, acuerdo o contrato en que se formalice el compromiso[cite: 13]." },
            { p: "¿Qué documento contable ampara la operación ADOK?", o: ["Autorización y compromiso", "Reconocimiento y pago", "Autorización, compromiso y reconocimiento de obligaciones", "Solo propuesta de pago"], c: 2, e: "ADOK: Autorización, compromiso y reconocimiento de obligaciones[cite: 12]." },
            { p: "¿Qué signo lleva un documento contable de anulación de retención de crédito?", o: ["Positivo (+)", "Negativo (/)", "Neutro (0)", "Asterisco (*)"], c: 1, e: "A través del documento RC negativo ('RC'/) o con signo / (barra) para anular[cite: 8, 12]." },
            { p: "¿A cargo de qué fondos se efectúan generalmente los anticipos a comisiones de servicio?", o: ["Fondo de contingencia", "Anticipo de caja fija o fondos a justificar", "Presupuesto cerrado", "Deuda pública"], c: 1, e: "Se efectuarán con cargo a los fondos del anticipo de caja fija o fondos a justificar[cite: 18]." },
            { p: "¿Qué documento se expide al inicio de un expediente de transferencias de crédito?", o: ["RC de ejercicios posteriores", "RC para transferencias", "MC de anulación", "D negativo"], c: 1, e: "Se expedirá un RC de retención de créditos para transferencias[cite: 7]." },
            { p: "¿Cómo se justifica un crédito extraordinario en el sistema contable?", o: ["Con la firma del Rey", "Con la inclusión en el documento de la referencia a la Ley publicada en el BOE", "Con informe de IGAE", "No necesita justificación"], c: 1, e: "Justificación suficiente es la inclusión en el documento de la referencia legal y fecha de BOE[cite: 13]." },
            { p: "¿Qué documento se utiliza para el seguimiento de fondos de la Unión Europea?", o: ["Documento ADOK-UE", "Documento MC-060", "Documento Anexo Seguimiento Fondos Unión Europea", "RC-103"], c: 2, e: "Se crea el documento 'Anexo Seguimiento Fondos Unión Europea'[cite: 11]." }
        ],
        // TEST 2: Gastos Plurianuales y Tramitación Anticipada
        [
            { p: "¿Cuál es el porcentaje máximo imputable al segundo ejercicio en un gasto plurianual (regla general)?", o: ["70%", "60%", "50%", "40%"], c: 1, e: "En el ejercicio inmediato siguiente 70%, en el segundo 60%[cite: 21]." },
            { p: "¿Cuál es el límite del porcentaje en el tercer y cuarto ejercicio plurianual?", o: ["70%", "60%", "50%", "25%"], c: 2, e: "En los ejercicios tercero y cuarto, el 50%[cite: 21]." },
            { p: "¿A qué expedientes NO se aplican las limitaciones porcentuales de plurianuales?", o: ["Carga financiera de la Deuda", "Arrendamientos de inmuebles", "A y B son correctas", "Contratos de obra"], c: 2, e: "No serán de aplicación a compromisos derivados de la carga de la Deuda y arrendamientos de inmuebles[cite: 21]." },

            { p: "El 'Servicio Hecho' es condición básica en qué fase:", o: ["Aprobación", "Compromiso", "Reconocimiento de obligación", "Pago"], c: 2, e: "El reconocimiento requiere previa acreditación de la realización de la prestación (servicio hecho)[cite: 9]." },
            { p: "¿Tienen efecto suspensivo las observaciones complementarias que emita un Interventor?", o: ["Sí, igual que los reparos", "No, en ningún caso tienen efectos suspensivos", "Depende del órgano gestor", "Solo si es urgente"], c: 1, e: "Sin que las mismas tengan, en ningún caso, efectos suspensivos en la tramitación[cite: 35]." },
            { p: "¿Un crédito 'retenido' puede ser usado por el servicio gestor para otra finalidad en ese instante?", o: ["Sí", "No, queda reservado para la operación solicitada (gasto, transferencia, etc.)", "Si lo autoriza el Interventor sí", "Se devuelve al Banco"], c: 1, e: "Una vez registrado el documento RC, el crédito queda retenido para ser utilizado en la realización de la baja/gasto específico[cite: 7]." },
            { p: "¿Cuándo se unirá el contrato administrativo formalizado al sistema contable?", o: ["Con el RC", "Con el primer documento OK de ejecución del mismo (a veces en el D)", "Nunca", "Al finalizar la obra"], c: 1, e: "Cuando se formalice, se deberá adjuntar con el primer documento OK que se expida en la ejecución[cite: 13]." },
            { p: "La cuenta de un Organismo Autónomo en el Banco de España requiere:", o: ["Solo contrato con el Banco", "Autorización previa de Dirección General Tesoro", "Que el saldo sea positivo siempre", "Firma del Rey"], c: 1, e: "Apertura requiere autorización previa de Dirección General del Tesoro y Política Financiera[cite: 28]." },
            { p: "¿Puede un pago en formalización producir una salida de dinero en efectivo de la caja del Banco de España?", o: ["Sí", "No, no producirán variaciones efectivas de tesorería", "Solo una parte", "Si hay embargos parciales, la parte del embargo no sale y la otra sí por transferencia"], c: 1, e: "Formalización: a conceptos de ingresos o no presupuestarios, no producirán variaciones efectivas tesorería[cite: 31]." },
            { p: "Si en los Presupuestos no hay crédito para una anualidad plurianual antigua (imputación anual), el gestor tiene:", o: ["10 días para actuar", "30 días para comunicar a Contabilidad las actuaciones (reajustes, etc)", "No puede hacer nada", "Se cancela el servicio"], c: 1, e: "Plazo de treinta días para comunicar actuaciones a realizar con compromisos pendientes[cite: 23]." },
            { p: "Si el gestor no comunica actuaciones a Contabilidad sobre los plurianuales en 30 días:", o: ["Se suspende su sueldo", "Contabilidad registrará de oficio retenciones de crédito por ese importe", "El contrato se extingue", "Interviene IGAE con reparo disciplinario"], c: 1, e: "La oficina de contabilidad procederá a registrar de oficio las retenciones de crédito[cite: 23]." },
            { p: "La designación de un asesor técnico por IGAE recae en alguien que:", o: ["Diseñó el proyecto para mayor certeza", "No haya intervenido en el proyecto, dirección, adjudicación o ejecución del gasto", "Sea empresa privada externa", "Sea del mismo centro directivo obligatoriamente"], c: 1, e: "Asesor entre funcionarios que no hayan intervenido en proyecto, adjudicación...[cite: 38]." },
            { p: "¿Debe la IGAE verificar materialmente las recepciones por sistema obligatoriamente?", o: ["No, puede limitarse a la formal", "Sí, enviará siempre al representante si es >50.000€ (su asistencia es potestativa para IGAE pero solicitarlo es obligatorio para gestor)", "Solo en contratos SARA", "Solo obras"], c: 1, e: "Órganos gestores DEBEN solicitar asistencia (obligatorio). Asistencia es potestativa para IGAE[cite: 38]." },
            { p: "¿Puede la Administración pagar un cheque al portador en ejecución del presupuesto?", o: ["Sí, sin problema", "No, los cheques, si se autorizan, serán excepcionales, para personas físicas y 'nominativos no a la orden'", "Sí para personas jurídicas", "Sí para ayudas"], c: 1, e: "Solo personas físicas, autorizado Director Tesoro: cheque nominativo no a la orden[cite: 30]." },
            { p: "El documento Anexo Seguimiento Fondos de la Unión Europea sirve para:", o: ["Gasto de caja fija", "Seguimiento de gastos presupuestarios financiados con Fondos de la UE", "Personal expatriado", "Devolución PAC"], c: 1, e: "Seguimiento de gastos financiados con Fondos de la Unión Europea[cite: 11]." },
            { p: "¿La Intervención aprueba el gasto?", o: ["Sí, la IGAE aprueba", "No, la IGAE controla/fiscaliza. La aprobación la hace el órgano gestor (Ministro, Director OA)", "Sí, en reparos conjuntos", "Ambos"], c: 1, e: "Función interventora: controlar ANTES de que sean aprobados... No aprueba, controla[cite: 32]." },
            { p: "¿Un expediente que no se somete a fiscalización previa se fiscaliza alguna vez?", o: ["No, nunca", "Sí, mediante control financiero permanente y/o auditoría pública o en la fase de pago", "Solo por los medios", "Se auditan 100% de ellos el mismo mes"], c: 1, e: "Se aplicarán controles financieros y auditoría pública, y fiscalización posterior/pago[cite: 33, 41]." },
            { p: "¿El reparo por falta de saldo presupuestario (insuficiencia de crédito) es suspensivo?", o: ["Sí", "No", "Depende", "Solo en obras"], c: 0, e: "Procederá formulación del reparo suspensivo cuando se base en insuficiencia de crédito[cite: 34]." },
            { p: "Para que opere un plurianual normal (art 47), la duración máxima es:", o: ["Año actual + 4 posteriores", "Año actual + 3", "2 años", "6 años"], c: 0, e: "El número de ejercicios a que pueden aplicarse los gastos no será superior a cuatro (posteriores)[cite: 21]." },
            { p: "¿Un contrato menor lleva fiscalización previa por IGAE?", o: ["Sí, siempre", "No estarán sometidos a la fiscalización previa", "Solo si lleva anticipo", "Depende del Ministerio"], c: 1, e: "No estarán sometidos a la fiscalización previa: los contratos menores[cite: 34]." },
            { p: "La responsabilidad contable de los miembros del TC:", o: ["Es ante el TC", "Es ante el Tribunal Supremo", "Tienen inmunidad", "No pueden tener responsabilidad"], c: 1, e: "Responsabilidad civil o criminal que incurran... ante Tribunal Supremo[cite: 44]." },
            { p: "Documento RC-108:", o: ["Retención del 10% adicional de la adjudicación", "Retención 1% cultural", "Retención para transferencias", "Documento mixto"], c: 0, e: "RC-108: Retención adicional del 10% de la adjudicación[cite: 11, 20]." }
        ]
    ];

    let currentTestIndex = -1; 
    let testRespuestas = [];

    // Inicialización DOM
    document.addEventListener("DOMContentLoaded", () => {
        const nav = document.getElementById('mainNav');
        for (let i = 0; i < examenes.length; i++) {
            const btn = document.createElement('button');
            btn.className = 'nav-btn';
            btn.innerText = `Test ${i + 1}`;
            btn.onclick = () => switchTab(i);
            nav.appendChild(btn);
        }
        renderEsquema();
    });

    // Pestañas
    function switchTab(index) {
        currentTestIndex = index;
        document.querySelectorAll('.nav-btn').forEach((btn, i) => {
            btn.classList.toggle('active', i - 1 === index);
        });
        
        window.speechSynthesis.cancel(); // Detener audio al cambiar de tab

        if (index === -1) {
            document.getElementById('esquemaView').classList.add('active');
            document.getElementById('testView').classList.remove('active');
        } else {
            document.getElementById('esquemaView').classList.remove('active');
            document.getElementById('testView').classList.add('active');
            renderTest(index);
        }
    }

    // Render Esquema
    function renderEsquema() {
        const container = document.getElementById('esquemaContainer');
        container.innerHTML = '';
        esquemaPreguntas.forEach((q, idx) => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                <div class="card-title">Pregunta ${idx + 1}: ${q.p}</div>
                <div>${q.r.replace(/\[cite:\s*[0-9,\s]+\]/g, match => `<small style="color:var(--primary-color);"><em>${match}</em></small>`)}</div>
            `;
            container.appendChild(div);
        });
    }

    // Speech Synthesis
    function escucharTema() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const textToSpeak = esquemaPreguntas.map(q => "Pregunta. " + q.p + ". Respuesta. " + q.r.replace(/\[cite:[^\]]+\]/g, '')).join(". ");
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'es-ES';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("Tu navegador no soporta lectura por voz.");
        }
    }

    // Render Test
    function renderTest(index) {
        const container = document.getElementById('testContainer');
        container.innerHTML = '';
        testRespuestas = new Array(examenes[index].length).fill(null);
        document.getElementById('scoreTop').style.display = 'none';
        document.getElementById('scoreBottom').style.display = 'none';
        document.getElementById('btnCorregir').disabled = false;

        examenes[index].forEach((q, qIndex) => {
            const card = document.createElement('div');
            card.className = 'card';
            
            let htmlOptions = '';
            q.o.forEach((opt, optIndex) => {
                htmlOptions += `
                    <label class="option-label" id="label_t${index}_q${qIndex}_o${optIndex}">
                        <input type="radio" name="test${index}_q${qIndex}" value="${optIndex}" onchange="seleccionarRespuesta(${qIndex}, ${optIndex})">
                        ${opt}
                    </label>
                `;
            });

            card.innerHTML = `
                <div class="card-title">${qIndex + 1}. ${q.p}</div>
                <div class="options-container">${htmlOptions}</div>
                <div class="explanation-box" id="explain_t${index}_q${qIndex}">
                    <strong>Explicación:</strong> ${q.e.replace(/\[cite:\s*[0-9,\s]+\]/g, match => `<small style="color:var(--primary-color);"><em>${match}</em></small>`)}<br>
                    <strong>Correcta:</strong> ${q.o[q.c]}
                </div>
            `;
            container.appendChild(card);
        });
    }

    // Lógica Test
    window.seleccionarRespuesta = function(qIndex, optIndex) {
        testRespuestas[qIndex] = optIndex;
    }

    window.corregirExamen = function() {
        if (currentTestIndex === -1) return;
        const test = examenes[currentTestIndex];
        let correctas = 0;
        let errores = 0;
        let noContestadas = 0;

        test.forEach((q, qIndex) => {
            const inputs = document.getElementsByName(`test${currentTestIndex}_q${qIndex}`);
            inputs.forEach(input => input.disabled = true);

            const respuestaUsuario = testRespuestas[qIndex];
            const labelCorrecta = document.getElementById(`label_t${currentTestIndex}_q${qIndex}_o${q.c}`);
            
            labelCorrecta.classList.add('correct');

            if (respuestaUsuario === null) {
                noContestadas++;
                document.getElementById(`explain_t${currentTestIndex}_q${qIndex}`).style.display = 'block';
            } else if (respuestaUsuario === q.c) {
                correctas++;
            } else {
                errores++;
                const labelError = document.getElementById(`label_t${currentTestIndex}_q${qIndex}_o${respuestaUsuario}`);
                labelError.classList.add('incorrect');
                document.getElementById(`explain_t${currentTestIndex}_q${qIndex}`).style.display = 'block';
            }
        });

        document.getElementById('btnCorregir').disabled = true;

        const msj = `Aciertos: <span style="color:var(--correct-text)">${correctas}</span> | Errores: <span style="color:var(--incorrect-text)">${errores}</span> | Sin contestar: ${noContestadas}`;
        document.getElementById('scoreTop').innerHTML = msj;
        document.getElementById('scoreTop').style.display = 'block';
        document.getElementById('scoreBottom').innerHTML = msj;
        document.getElementById('scoreBottom').style.display = 'block';
    }

    window.reiniciarExamen = function() {
        if (currentTestIndex !== -1) {
            renderTest(currentTestIndex);
        }
    }
</script>

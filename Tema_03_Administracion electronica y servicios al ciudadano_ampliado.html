    <script>
        const esquemaDatos = [
            {
                p: "¿Qué marco normativo general de referencia sirvió de experiencia previa para la Ley 11/2007, de 22 de junio, de Acceso Electrónico de los Ciudadanos a los Servicios Públicos?",
                r: "La experiencia adquirida con la aplicación de la Ley 30/1992, de 26 de noviembre, de Régimen Jurídico de las Administraciones Públicas y del Procedimiento Administrativo Común, que ofrecía un marco jurídico general para la incorporación sistemática de las tecnologías de la información."
            },
            {
                p: "¿Qué nueva concepción impulsó la Ley 11/2007, de 22 de junio?",
                r: "Trataba de impulsar una nueva concepción al construir su regulación sobre la base del derecho de los ciudadanos a utilizar los medios de comunicación electrónica para relacionarse con la Administración y ejercer sus derechos. Puso al ciudadano y sus derechos en la base de todo, considerándolo portador de derechos de prestación que la Administración debe satisfacer."
            },
            {
                p: "Según el texto de referencia, ¿cuáles son los tres derechos específicamente relacionados con la comunicación electrónica con la Administración y el estatuto del ciudadano emanados de la Ley 11/2007?",
                r: "1) Derecho a la obtención de medios de identificación electrónica. 2) Derecho a la elección del canal de comunicación o del medio de autentificación. 3) Derecho de igualdad garantizando la accesibilidad, así como una efectiva igualdad entre géneros y respecto de otros colectivos con necesidades especiales y entre territorios."
            },
            {
                p: "¿Por qué el funcionamiento íntegramente electrónico refuerza las garantías de los interesados además de servir a los principios de eficacia y eficiencia?",
                r: "Porque la constancia de documentos y actuaciones en un archivo electrónico facilita el cumplimiento de las obligaciones de transparencia, pues permite ofrecer información puntual, ágil y actualizada a los interesados."
            },
            {
                p: "¿Dentro de qué marco se dictó el Real Decreto 203/2021, de 30 de marzo, y qué leyes desarrolla?",
                r: "Se dictó dentro del marco de la Agenda España Digital 2026, y desarrolla las Leyes 39/2015 y 40/2015 en lo relativo a sus disposiciones sobre el funcionamiento del sector electrónico del sector público."
            },
            {
                p: "¿En qué momento produce efectos la comunicación de una persona física no obligada de su voluntad de relacionarse electrónicamente (o de dejar de hacerlo) durante un procedimiento?",
                r: "Los efectos de la comunicación se producirán a partir del quinto día hábil siguiente a aquel en que el órgano competente para tramitar el procedimiento haya tenido constancia de la misma."
            },
            {
                p: "¿Quiénes están obligados, en todo caso, a relacionarse a través de medios electrónicos con las Administraciones Públicas según el art. 14 de la Ley 39/2015?",
                r: "1) Las personas jurídicas. 2) Las entidades sin personalidad jurídica. 3) Quienes ejerzan una actividad profesional para la que se requiera colegiación obligatoria (incluidos notarios y registradores de la propiedad y mercantiles). 4) Quienes representen a un interesado que esté obligado a relacionarse electrónicamente. 5) Los empleados de las Administraciones Públicas para los trámites por razón de su condición de empleado público."
            },
            {
                p: "Según el art. 4 del Real Decreto 203/2021, ¿qué canales se establecen para prestar asistencia a las personas interesadas en el acceso a servicios electrónicos?",
                r: "a) Presencial, a través de las oficinas de asistencia que se determinen. b) Portales de internet y sedes electrónicas. c) Redes sociales. d) Telefónico. e) Correo electrónico. f) Cualquier otro canal que pueda establecerse según el art. 12 de la Ley 39/2015."
            },
            {
                p: "¿Qué requisitos se exigen para que un funcionario público identifique o firme electrónicamente en nombre de un interesado que carece de medios electrónicos?",
                r: "El interesado debe identificarse ante el funcionario y prestar su consentimiento expreso para esta actuación, de lo que deberá quedar constancia para los casos de discrepancia o litigio."
            },
            {
                p: "¿A través de qué instrumentos se determina en la Administración General del Estado (AGE) qué trámites y actuaciones son válidos para ser firmados por personal funcionario público habilitado?",
                r: "Se determinan con carácter previo por cada ministerio u organismo, y se especifican mediante orden conjunta de la persona titular del Ministerio competente en materia de Función Pública y de la persona titular del Ministerio competente en materia de Transformación Digital."
            },
            {
                p: "¿Qué constará, al menos, en los registros o sistemas equivalentes de funcionarios habilitados mantenidos por las distintas Administraciones?",
                r: "Constarán, al menos, los funcionarios que presten servicios en las oficinas de asistencia en materia de registros."
            },
            {
                p: "¿Quién es el titular de una sede electrónica según el art. 38 de la LRJSP?",
                r: "Su titularidad corresponde a una Administración Pública, o bien a uno o varios organismos públicos o entidades de Derecho público en el ámbito de sus competencias."
            },
            {
                p: "¿En qué boletines se publicará el acto o resolución de creación o supresión de una sede electrónica o sede electrónica asociada?",
                r: "En el boletín oficial que corresponda en función de cuál sea la Administración Pública titular, y también en el directorio del Punto de Acceso General Electrónico que corresponda. En el caso de las entidades locales, el boletín oficial será el de la provincia a la que pertenezca la entidad."
            },
            {
                p: "¿Qué cuatro puntos, como mínimo, debe determinar el acto o resolución de creación de una sede electrónica o sede electrónica asociada?",
                r: "a) El ámbito de aplicación. b) La identificación de la dirección electrónica de referencia de la sede y de sus sedes asociadas. c) La identificación de su titular. d) La identificación del órgano u órganos encargados de la gestión y de los servicios puestos a disposición en la misma."
            },
            {
                p: "¿Qué debe explicitar la memoria justificativa y económica remitida por el órgano promotor para obtener los informes favorables en la creación de una nueva sede electrónica o sede asociada en la AGE?",
                r: "Debe explicitar el volumen de trámites previsto gestionar, los efectos presupuestarios y económicos, su incidencia en la reducción del tiempo de resolución y de cargas administrativas, y cualquier otra razón de interés general."
            },
            {
                p: "Detalla al menos tres contenidos mínimos de los que dispondrá toda sede electrónica o sede asociada respecto a normativa, horas e incidencias.",
                r: "1) La normativa reguladora del Registro al que se acceda a través de la sede. 2) La fecha y hora oficial, así como el calendario de días inhábiles. 3) Información acerca de cualquier incidencia técnica que imposibilite el funcionamiento ordinario, y la posible ampliación de plazo no vencido."
            },
            {
                p: "¿Qué servicio debe disponer la sede electrónica relacionado con sugerencias y quejas y la accesibilidad?",
                r: "Debe disponer de un enlace para la formulación de sugerencias y quejas ante los órganos competentes, y de los mecanismos de comunicación y procedimiento de reclamación respecto a los requisitos de accesibilidad de sitios web y aplicaciones móviles."
            },
            {
                p: "En relación a una sede electrónica, ¿quién es el responsable si contiene un enlace a otra sede electrónica o asociada de distinta titularidad?",
                r: "El titular de la última sede enlazada es el responsable de la integridad, veracidad y actualización de la información o procedimientos en ella, sin perjuicio de la debida diligencia del titular de la primera sede al incorporar los contenidos."
            },
            {
                p: "¿Qué permite la sede electrónica del PAGe de la AGE en relación con el Código Seguro de Verificación?",
                r: "Permitirá la comprobación de la autenticidad e integridad de los documentos facilitados por el sector público estatal a través del Código Seguro de Verificación, o de cualquier otro sistema de firma basado en certificado electrónico cualificado, y también permitirá, en su caso, su recuperación."
            },
            {
                p: "¿Quién gestionará el PAGe de la Administración General del Estado y su sede electrónica (a día de hoy)?",
                r: "Serán gestionados por el Ministerio para la Transformación Digital y de la Función Pública."
            },
            {
                p: "¿Cómo define el art. 5 del Real Decreto 203/2021 el concepto de 'portal de internet'?",
                r: "Es el punto de acceso electrónico cuya titularidad corresponda a una Administración Pública, organismo público o entidad de derecho público que permite el acceso a través de internet a la información y, en su caso, a la sede electrónica o sede electrónica asociada correspondiente."
            },
            {
                p: "¿Quiénes pueden acceder a la Carpeta Ciudadana además del interesado?",
                r: "a) Sus representantes legales. b) Quien ostente un poder general previsto en el art. 6.4.a) de la LPA, otorgado por el interesado e inscrito en el Registro Electrónico de Apoderamientos."
            },
            {
                p: "Indica las cuatro funcionalidades principales que ofrece la Carpeta Ciudadana para el interesado o sus representantes.",
                r: "a) Permitir el seguimiento del estado de tramitación de los procedimientos. b) Permitir el acceso a sus comunicaciones y notificaciones. c) Conocer qué datos suyos obran en poder del sector público estatal. d) Facilitar la obtención de certificaciones administrativas exigidas."
            },
            {
                p: "¿Qué es la Red SARA?",
                r: "Es un conjunto de infraestructuras tecnológicas que permiten la interconexión de las Administraciones Públicas entre sí, facilitando el intercambio de información y servicios entre ellas."
            },
            {
                p: "¿Qué es el Servicio de Notificaciones Telemáticas Seguras?",
                r: "Es un servicio que proporciona a cada ciudadano o empresa una Dirección Segura (DEU) en la cual recibir las comunicaciones y notificaciones de los procedimientos a los que voluntariamente se suscriba."
            },
            {
                p: "¿Para qué sirve el Sistema de Interconexión de Registros (SIR)?",
                r: "Permite la transmisión de información registral desde un registro de entrada hasta el registro destino."
            },
            {
                p: "Según el art. 42 del Real Decreto 203/2021, si la Administración pone a disposición notificaciones tanto en sede electrónica como en la DEHú, ¿qué fecha se tomará para el cómputo de plazos?",
                r: "Se tomará la fecha y hora de acceso al contenido o el rechazo de la notificación por el interesado o su representante en el sistema en el que haya ocurrido en primer lugar."
            },
            {
                p: "¿Qué información mínima contendrá el acuse de recibo al que da lugar una notificación por comparecencia electrónica?",
                r: "Contendrá, como mínimo, la identificación del acto notificado y la persona destinataria, la fecha y hora en la que se produjo la puesta a disposición, y la fecha y hora del acceso a su contenido o del rechazo."
            },
            {
                p: "¿Cuál es el plazo que tiene un sucesor para comunicar la sucesión al órgano responsable en caso de procedimientos administrativos no finalizados?",
                r: "El plazo es de 15 días hábiles, desde el día siguiente al de la efectividad de la sucesión o desde la inscripción de la defunción en el Registro Civil."
            },
            {
                p: "¿Qué ocurre con el aviso de puesta a disposición de una notificación electrónica si este no se practica por parte de la Administración?",
                r: "La falta de práctica de este aviso, de carácter meramente informativo, no impedirá que la notificación sea considerada plenamente válida."
            },
            {
                p: "¿Qué pasa si ocurre una incidencia técnica en la Dirección Electrónica Habilitada única que imposibilita su funcionamiento ordinario?",
                r: "Una vez comunicada la incidencia a los órganos emisores, estos podrán determinar una ampliación del plazo no vencido para comparecer y acceder a las notificaciones emitidas, debiendo publicarlo en su sede si también ponen las notificaciones allí a disposición."
            },
            {
                p: "¿Qué son las cartas de servicios electrónicos?",
                r: "Son documentos que pretenden informar a los ciudadanos acerca de los servicios de carácter electrónico a su disposición, difundir los requerimientos técnicos y los compromisos de calidad asumidos por departamentos y organismos públicos."
            },
            {
                p: "Explica brevemente qué es el proyecto CERES liderado por la FNMT-RCM.",
                r: "CERES (CERtificación ESpañola) consiste en establecer una Entidad Pública de Certificación que permita autentificar y garantizar la confidencialidad de comunicaciones entre ciudadanos, empresas y AAPP usando técnicas de clave pública para garantizar identidad, confidencialidad e integridad sin necesidad de conocimientos criptográficos por parte del usuario."
            },
            {
                p: "¿Cuáles son las dos características básicas del sistema de clave pública en CERES?",
                r: "1) La identidad y capacidad de firma se almacena en una tarjeta inteligente (accesible con un PIN) o en un fichero. 2) El sistema es completamente transparente al usuario, sin que necesite conocer técnicas criptográficas para firmar o cifrar."
            },
            {
                p: "¿En qué consiste el principio de personalización y proactividad recogido en el RD 203/2021?",
                r: "Es entendido como la capacidad de las Administraciones Públicas para que, partiendo del conocimiento adquirido del usuario final del servicio, proporcione servicios precumplimentados y se anticipe a las posibles necesidades de los mismos."
            },
            {
                p: "Describe las tres categorías o niveles de las Oficinas Integradas de Atención al Ciudadano 060.",
                r: "1) Oficinas de contacto (nivel 1): recepción, registro y remisión de comunicaciones. 2) Oficinas de información (nivel 2): servicios nivel 1 + atención y orientación personalizada. 3) Oficinas de gestión integral (nivel 3): servicios anteriores + tramitación conjunta de procedimientos de distintas AAPP."
            },
            {
                p: "¿Qué son los Puntos de Atención al Emprendedor (PAE) y para qué sirve el DUE?",
                r: "Los PAE son puntos donde se asesora al emprendedor en su proyecto y se inician telemáticamente los trámites de constitución. El DUE (Documento Único Electrónico) se utiliza en el sistema CIRCE para el intercambio de documentación necesaria en la creación de empresas."
            },
            {
                p: "Indica los dominios del Punto de Acceso General de la AGE (PAG) regulado por la Orden HAP/1949/2014.",
                r: "Los dominios son www.administracion.es y www.administracion.gob.es."
            },
            {
                p: "¿Dónde se encuentra la oficina presencial 060 señalada expresamente para la atención presencial del PAG?",
                r: "En la calle María de Molina, 50 (Madrid)."
            },
            {
                p: "¿A quién le corresponde la titularidad del PAG y qué ente tiene competencia sobre su gestión tecnológica?",
                r: "La titularidad corresponde al Ministerio competente en materia de Transformación Digital. La gestión tecnológica de la sede será competencia de la Agencia Estatal de Administración Digital."
            }
        ];

        const testsData = [
            // TEST 1: Leyes, Obligados, Derechos y Asistencia
            [
                { q: "La Ley 11/2007, de 22 de junio, se apoyó en la experiencia adquirida con la aplicación de:", options: ["La Ley 39/2015, de 1 de octubre.", "La Ley 58/2003, de 17 de diciembre.", "La Ley 30/1992, de 26 de noviembre.", "La Ley 40/2015, de 1 de octubre."], correct: 2 },
                { q: "¿Qué ley recogió por primera vez la automatización de la actuación administrativa o la obtención de imágenes electrónicas?", options: ["Ley 11/2007, de 22 de junio.", "Ley 39/2015, de 1 de octubre.", "Ley 30/1992, de 26 de noviembre.", "Ley 58/2003, de 17 de diciembre, General Tributaria."], correct: 3 },
                { q: "Según la Ley 11/2007, ¿cuál de los siguientes es un derecho específicamente relacionado con la comunicación electrónica?", options: ["Derecho a la obtención de medios de identificación electrónica.", "Derecho a la elección del canal de comunicación o del medio de autentificación.", "Derecho de igualdad garantizando la accesibilidad.", "Todas son correctas."], correct: 3 },
                { q: "¿Cuál es uno de los objetivos principales de la Ley 39/2015, de 1 de octubre?", options: ["Profundizar en la agilización de los procedimientos con un pleno funcionamiento electrónico.", "Crear el Punto de Acceso General Electrónico en todas las entidades locales.", "Limitar la identificación electrónica a certificados cualificados.", "Ninguna es correcta."], correct: 0 },
                { q: "El Reglamento de actuación y funcionamiento del sector público por medios electrónicos (RD 203/2021) se dictó dentro del marco de:", options: ["La Estrategia Digital Europea.", "La Agenda España Digital 2026.", "El Plan de Recuperación, Transformación y Resiliencia.", "El Esquema Nacional de Seguridad."], correct: 1 },
                { q: "El derecho a relacionarse electrónicamente con las AAPP se desarrolla fundamentalmente en:", options: ["El art. 14 de la Ley 39/2015 (LPA).", "El art. 38 de la LRJSP.", "El art. 12 de la Ley 40/2015.", "El art. 42 del RD 203/2021."], correct: 0 },
                { q: "Las personas físicas que elijan comunicarse electrónicamente podrán modificar el medio elegido:", options: ["Sólo al inicio del procedimiento.", "En cualquier momento.", "Anualmente.", "Sólo al finalizar un trámite."], correct: 1 },
                { q: "Si una persona física decide cambiar el medio a electrónico durante un procedimiento, los efectos se producirán:", options: ["Al instante.", "Al día siguiente hábil.", "A partir del quinto día natural.", "A partir del quinto día hábil siguiente a la constancia del órgano."], correct: 3 },
                { q: "¿Cuál de estos sujetos NO está obligado en todo caso a relacionarse por medios electrónicos?", options: ["Las personas jurídicas.", "Las entidades sin personalidad jurídica.", "Una persona física no profesional.", "Quienes ejerzan una actividad profesional para la que se requiera colegiación obligatoria."], correct: 2 },
                { q: "Los notarios y registradores de la propiedad y mercantiles:", options: ["Pueden elegir si relacionarse electrónicamente.", "Están obligados a relacionarse por medios electrónicos.", "Están exentos de la vía electrónica por seguridad.", "Ninguna es correcta."], correct: 1 },
                { q: "En el ámbito estatal, la obligación de relacionarse por medios electrónicos para colectivos de personas físicas por capacidad económica o técnica podrá establecerse por:", options: ["Real Decreto acordado en Consejo de Ministros.", "Orden de la persona titular del Departamento competente.", "Ley Orgánica.", "a y b son correctas."], correct: 3 },
                { q: "¿Dónde se publicará la obligatoriedad establecida reglamentariamente en el ámbito estatal para estos colectivos?", options: ["Sólo en el BOE.", "En el Punto de Acceso General electrónico (PAGe) y en la sede electrónica o asociada.", "En el Diario Oficial de la Unión Europea.", "Ninguna es correcta."], correct: 1 },
                { q: "¿Qué artículo contempla la asistencia en el uso de medios electrónicos a los interesados?", options: ["El art. 12 LPA (Ley 39/2015).", "El art. 14 de la Ley 40/2015.", "El art. 1 del RD 203/2021.", "El art. 38 LRJSP."], correct: 0 },
                { q: "Según el art. 4 del RD 203/2021, los canales de asistencia al ciudadano incluyen:", options: ["Presencial, Telefónico y Correo electrónico.", "Redes sociales, Portales de internet y Sedes electrónicas.", "a y b son correctas.", "Solamente Presencial y Telefónico."], correct: 2 },
                { q: "Para que un funcionario público identifique o firme válidamente en nombre de un interesado, este último debe:", options: ["Presentar el DNI y firmar digitalmente.", "Identificarse ante el funcionario y prestar consentimiento expreso.", "Tener un poder notarial en todo caso.", "Estar inscrito en el PAG."], correct: 1 },
                { q: "Tras la actuación por funcionario habilitado, este entregará al interesado:", options: ["El original del expediente.", "Sólo un justificante verbal.", "Toda la documentación acreditativa del trámite y una copia del documento de consentimiento expreso.", "Un certificado cualificado nuevo."], correct: 2 },

                <div class="p-4 bg-gray-50 rounded-lg border border-gray-200">
                    <p class="font-bold text-gray-800 text-lg mb-2"><span class="text-blue-600">${index + 1}.</span> ${item.p}</p>
                    <p class="text-gray-700 leading-relaxed">${item.r}</p>
                </div>`;
            });
            container.innerHTML = html;
        }

        function renderTests() {
            const container = document.getElementById('tests-containers');
            let html = '';

            testsData.forEach((test, testIndex) => {
                html += `
                <div id="test-${testIndex}" class="tab-content bg-white p-6 rounded-b-lg shadow-sm mb-8">
                    <h2 class="text-2xl font-bold mb-6 text-blue-800 border-b pb-2">Test ${testIndex + 1} (20 Preguntas)</h2>
                    <form id="form-test-${testIndex}" onsubmit="evaluarTest(event, ${testIndex})">
                        <div class="space-y-6">`;
                
                test.forEach((q, qIndex) => {
                    html += `
                            <div class="p-4 border border-gray-200 rounded-lg bg-gray-50" id="q-container-${testIndex}-${qIndex}">
                                <p class="font-semibold text-gray-800 mb-3 text-lg">${qIndex + 1}. ${q.q}</p>
                                <div class="space-y-2">`;
                    
                    q.options.forEach((opt, optIndex) => {
                        html += `
                                    <label class="flex items-start p-3 rounded-md cursor-pointer hover:bg-gray-100 transition-colors border border-transparent" id="label-${testIndex}-${qIndex}-${optIndex}">
                                        <input type="radio" name="q-${testIndex}-${qIndex}" value="${optIndex}" class="mt-1 mr-3 h-4 w-4 text-blue-600 focus:ring-blue-500">
                                        <span class="text-gray-700 font-medium">${opt}</span>
                                    </label>`;
                    });
                    
                    html += `
                                </div>
                            </div>`;
                });

                html += `
                        </div>
                        <div class="mt-8 flex gap-4 items-center">
                            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition-colors shadow-md">Calcular resultado</button>
                            <button type="button" onclick="reiniciarTest(${testIndex})" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 px-6 rounded-lg transition-colors">Reiniciar test</button>
                        </div>
                        <div id="resultado-${testIndex}" class="mt-6"></div>
                    </form>
                </div>`;
            });
            
            container.innerHTML = html;
        }

        function evaluarTest(event, testIndex) {
            event.preventDefault(); // Evitar recarga
            
            let aciertos = 0;
            let errores = 0;
            let noContestadas = 0;
            const test = testsData[testIndex];

            test.forEach((q, qIndex) => {
                const selected = document.querySelector(`input[name="q-${testIndex}-${qIndex}"]:checked`);
                const correctIndex = q.correct;
                
                // Limpiar clases previas
                q.options.forEach((_, optIndex) => {
                    const label = document.getElementById(`label-${testIndex}-${qIndex}-${optIndex}`);
                    label.classList.remove('bg-green-100', 'border-green-400', 'text-green-800', 'bg-red-100', 'border-red-400', 'text-red-800');
                    label.querySelector('span').classList.remove('text-green-900', 'text-red-900');
                });

                if (selected) {
                    const selectedVal = parseInt(selected.value);
                    if (selectedVal === correctIndex) {
                        aciertos++;
                        const labelCorrecto = document.getElementById(`label-${testIndex}-${qIndex}-${correctIndex}`);
                        labelCorrecto.classList.add('bg-green-100', 'border-green-400', 'text-green-800');
                    } else {
                        errores++;
                        // Marcar el error
                        const labelError = document.getElementById(`label-${testIndex}-${qIndex}-${selectedVal}`);
                        labelError.classList.add('bg-red-100', 'border-red-400', 'text-red-800');
                        // Marcar la correcta
                        const labelCorrecto = document.getElementById(`label-${testIndex}-${qIndex}-${correctIndex}`);
                        labelCorrecto.classList.add('bg-green-100', 'border-green-400', 'text-green-800');
                    }
                } else {
                    noContestadas++;
                    // Mostrar cuál era la correcta aunque no se haya contestado
                    const labelCorrecto = document.getElementById(`label-${testIndex}-${qIndex}-${correctIndex}`);
                    labelCorrecto.classList.add('bg-green-100', 'border-green-400', 'text-green-800');
                }
            });

            // Mostrar el cuadro de resultados
            const resultDiv = document.getElementById(`resultado-${testIndex}`);
            const nota = (aciertos / test.length) * 10;
            
            let feedback = '';
            if(nota >= 9) feedback = '¡Excelente! Tienes un dominio total del temario.';
            else if(nota >= 7) feedback = '¡Muy bien! Estás muy preparado.';
            else if(nota >= 5) feedback = 'Aprobado. Hay margen de mejora.';
            else feedback = 'Necesitas repasar más el temario adjunto.';

            resultDiv.innerHTML = `
                <div class="p-6 bg-blue-50 border-l-4 border-blue-600 rounded-r-lg shadow-sm">
                    <h3 class="text-xl font-bold text-blue-900 mb-2">Resumen del Examen</h3>
                    <div class="grid grid-cols-3 gap-4 mb-4 text-center">
                        <div class="bg-green-100 text-green-800 p-3 rounded-lg font-bold">Aciertos: ${aciertos}</div>
                        <div class="bg-red-100 text-red-800 p-3 rounded-lg font-bold">Errores: ${errores}</div>
                        <div class="bg-gray-200 text-gray-800 p-3 rounded-lg font-bold">En blanco: ${noContestadas}</div>
                    </div>
                    <p class="text-lg font-semibold text-blue-900">Nota Final: ${nota.toFixed(2)} / 10</p>
                    <p class="text-blue-800 mt-2">${feedback}</p>
                </div>
            `;
            
            // Hacer scroll hacia el resultado
            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function reiniciarTest(testIndex) {
            const test = testsData[testIndex];
            const form = document.getElementById(`form-test-${testIndex}`);
            
            // Desmarcar todos los radios
            form.reset();
            
            // Limpiar los colores
            test.forEach((q, qIndex) => {
                q.options.forEach((_, optIndex) => {
                    const label = document.getElementById(`label-${testIndex}-${qIndex}-${optIndex}`);
                    label.classList.remove('bg-green-100', 'border-green-400', 'text-green-800', 'bg-red-100', 'border-red-400', 'text-red-800');
                });
            });
            
            // Quitar el div de resultados
            document.getElementById(`resultado-${testIndex}`).innerHTML = '';
            
            // Volver arriba del test
            document.getElementById(`test-${testIndex}`).scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function openTab(evt, tabId) {
            // Ocultar todos los tab-content
            const tabContents = document.getElementsByClassName("tab-content");
            for (let i = 0; i < tabContents.length; i++) {
                tabContents[i].classList.remove("active");
            }
            
            // Quitar clase active a todos los botones
            const tabBtns = document.getElementsByClassName("tab-btn");
            for (let i = 0; i < tabBtns.length; i++) {
                tabBtns[i].classList.remove("active");
            }
            
            // Activar el tab seleccionado
            document.getElementById(tabId).classList.add("active");
            evt.currentTarget.classList.add("active");
        }

        window.onload = function() {
            renderEsquema();
            renderTests();
        };
    </script>
</body>
</html>

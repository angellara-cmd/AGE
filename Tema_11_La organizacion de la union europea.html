<script>
const esquemaPreguntas = [
  { p: "¿Cuáles son los Tratados fundacionales de las Comunidades Europeas?", r: "El Tratado de París (1951) constitutivo de la CECA, y los Tratados de Roma (1957) constitutivos de la CEE y la CEEA (Euratom)." },
  { p: "¿Qué modificaciones clave introdujo el Tratado de Lisboa (2007, en vigor 2009)?", r: "Sustituye a la Comunidad Europea por la 'Unión', atribuyéndole personalidad jurídica única. El TCE pasa a denominarse Tratado de Funcionamiento de la Unión Europea (TFUE). Se institucionaliza el Consejo Europeo y desaparece la estructura de pilares." },
  { p: "¿Cuáles son los criterios de Copenhague (1993) para la adhesión?", r: "1) Criterios políticos (democracia, imperio de la ley, respeto DDHH y minorías). 2) Criterio económico (economía de mercado viable). 3) Asimilación del acervo europeo." },
  { p: "¿En qué se fundamenta la delimitación y el ejercicio de las competencias de la UE (art. 5 TUE)?", r: "La delimitación se rige por el principio de atribución. El ejercicio se rige por los principios de subsidiariedad y proporcionalidad." },
  { p: "¿Cuáles son las competencias exclusivas de la Unión (art. 3 TFUE)?", r: "Unión aduanera, normas de competencia del mercado interior, política monetaria (euro), conservación de recursos biológicos marinos (pesca) y política comercial común." },
  { p: "¿Cuáles son las principales competencias compartidas (art. 4 TFUE)?", r: "Mercado interior, política social, cohesión económica/social/territorial, agricultura y pesca, medio ambiente, protección de consumidores, transportes, redes transeuropeas, energía y espacio de libertad, seguridad y justicia." },
  { p: "¿Qué instituciones configuran la UE (art. 13 TUE)?", r: "Parlamento Europeo, Consejo Europeo, Consejo, Comisión Europea, Tribunal de Justicia de la UE, Banco Central Europeo y Tribunal de Cuentas." },
  { p: "¿Cómo se compone el Consejo Europeo (art. 15 TUE)?", r: "Jefes de Estado o de Gobierno de los Estados miembros, su Presidente y el Presidente de la Comisión. Participa también el Alto Representante para Asuntos Exteriores y Política de Seguridad." },
  { p: "¿Cuál es el mandato del Presidente del Consejo Europeo y cuáles son sus funciones?", r: "Elegido por 2,5 años (una sola reelección). Dirige e impulsa sus trabajos, asegura preparación y continuidad, y asume la representación exterior de la UE en materia PESC, sin perjuicio de las atribuciones del Alto Representante. No ejerce función legislativa." },
  { p: "¿Cómo se toman las decisiones en el Consejo Europeo?", r: "Se pronuncia por consenso como regla general. Sin embargo, decide por mayoría cualificada aspectos como la lista de formaciones del Consejo o su propia Presidencia (salvo Asuntos Exteriores)." },
  { p: "¿Cómo está compuesto el Consejo (Consejo de Ministros) y quién lo preside?", r: "Por un representante de cada Estado miembro de rango ministerial. La Presidencia es rotatoria e igualatoria entre Estados (grupos de 3 por 18 meses, 6 meses cada uno), excepto la formación de Asuntos Exteriores, presidida por el Alto Representante." },
  { p: "¿Qué es el COREPER y cuál es su función?", r: "El Comité de Representantes Permanentes es un órgano auxiliar que prepara los trabajos del Consejo y realiza las tareas que este le confía, filtrando decisiones (Puntos A sin debate y Puntos B con debate)." },
  { p: "¿Cómo se alcanza la mayoría cualificada en el Consejo (desde 2014, art. 16.3 TUE)?", r: "A propuesta de Comisión o Alto Representante: mínimo 55% de miembros (al menos 15) que representen al menos el 65% de la población de la UE. Minoría de bloqueo: al menos 4 miembros." },
  { p: "¿Cuál es la composición máxima del Parlamento Europeo según el Tratado de Lisboa?", r: "No excederá de 750 diputados más el Presidente. Reparto proporcional decreciente: ningún Estado tendrá menos de 6 ni más de 96 escaños." },
  { p: "¿Cuál es la composición actual del Parlamento Europeo en la legislatura 2024-2029?", r: "Tiene 720 escaños en total. A España le corresponden 61 eurodiputados (aumento de 2 respecto a los 59 que tenía tras el Brexit)." },
  { p: "¿Cuáles son las incompatibilidades para ser eurodiputado en España?", r: "Incompatible con ser miembro de Cortes Generales, de Asambleas de CC.AA., y todas las de la LOREG para Diputados y Senadores nacionales. Dedicación absoluta." },
  { p: "¿Qué funciones ejerce el Parlamento Europeo?", r: "Ejerce conjuntamente con el Consejo la función legislativa y presupuestaria (sin distinción ya entre gastos obligatorios y no obligatorios), control político, y aprueba a la Comisión." },
  { p: "¿Cómo se compone la Comisión Europea actualmente?", r: "Por un nacional de cada Estado miembro (27 miembros en total), incluyendo a su Presidente y al Alto Representante (como Vicepresidente). El TUE preveía reducir a 2/3, pero el Consejo Europeo decidió mantener un comisario por Estado." },
  { p: "¿Qué características de independencia tienen los miembros de la Comisión?", r: "Absoluta independencia. No aceptan instrucciones de gobiernos, no ejercen otra actividad profesional (retribuida o no) durante su mandato (5 años). El TJUE puede cesarlos por falta grave." },
  { p: "¿Qué poderes ostenta la Comisión Europea?", r: "Iniciativa legislativa (cuasi-monopolio), ejecución del presupuesto, guardiana de los Tratados (control del Derecho UE), representación exterior (excepto PESC) y adopción de actos delegados y de ejecución." },
  { p: "¿En qué consiste la moción de censura contra la Comisión?", r: "El PE puede obligar a la Comisión a dimitir en bloque. Requiere 3 días de reflexión, y aprobación por 2/3 de los sufragios emitidos que representen mayoría absoluta de los miembros del PE." },
  { p: "¿Cómo se compone el Tribunal de Justicia (instancia superior)?", r: "Un Juez por Estado miembro (27) asistido por 11 Abogados Generales. Elegidos por los Gobiernos por 6 años (renovables), renovándose por mitades cada 3 años." },
  { p: "¿Qué función tienen los Abogados Generales del TJUE?", r: "Presentar públicamente, con imparcialidad e independencia, conclusiones motivadas sobre los asuntos que requieren su intervención para asistir al Tribunal (no participan en la votación de la sentencia)." },
  { p: "¿Qué es el Tribunal General y de qué conoce?", r: "Tiene 2 jueces por Estado miembro. Conoce en 1ª instancia recursos de anulación, inactividad, responsabilidad, litigios de función pública (desde 2016) y, desde 2024, ciertas cuestiones prejudiciales transferidas." },
  { p: "¿En qué consiste el recurso de incumplimiento (arts. 258 y 259 TFUE)?", r: "La Comisión (o un Estado) demanda a un Estado miembro por incumplir los Tratados. Tiene fase precontenciosa (dictamen motivado) y contenciosa ante el TJUE, que puede imponer sumas a tanto alzado o multas coercitivas." },
  { p: "¿Qué son las cuestiones prejudiciales (art. 267 TFUE)?", r: "Mecanismo por el que un juez nacional consulta al TJUE sobre la interpretación de Tratados o validez de actos UE, obligatorio si no cabe recurso interno. Asegura la interpretación uniforme." },
  { p: "¿Cuál es la función y composición del Tribunal de Cuentas?", r: "Controla la legalidad, regularidad y buena gestión financiera del presupuesto de la UE. Integrado por un nacional de cada Estado (mandato de 6 años). Sede en Luxemburgo." },
  { p: "¿Qué es el SEBC y el Eurosistema?", r: "El SEBC incluye el BCE y los Bancos Centrales Nacionales (BCN) de toda la UE. El Eurosistema solo incluye al BCE y a los BCN de Estados que han adoptado el euro (20 países actualmente)." },
  { p: "¿Cuáles son los órganos rectores del BCE?", r: "El Consejo de Gobierno (Comité Ejecutivo + Gobernadores de BCN zona euro), el Comité Ejecutivo (Presidente, Vicepresidente y 4 vocales nombrados por 8 años no renovables) y el Consejo General." },
  { p: "¿Cómo se compone el Comité Económico y Social Europeo (CESE)?", r: "Representa a la sociedad civil (empresarios, trabajadores, diversidad). Tras el Brexit, tiene 329 miembros (máximo legal 350). A España le corresponden 21 miembros. Mandato de 5 años." },
  { p: "¿Cuál es el papel del Comité de las Regiones (CDR)?", r: "Órgano consultivo que representa a entes locales y regionales. 329 miembros (21 de España). Vigila el principio de subsidiariedad. Puede recurrir al TJUE para salvaguardar sus prerrogativas." },
  { p: "¿Qué función cumple el Banco Europeo de Inversiones (BEI)?", r: "Financiar, sin afán de lucro y acudiendo a los mercados de capitales, proyectos para el desarrollo regional, modernización de empresas o interés común que no puedan financiarse solo con medios nacionales." },
  { p: "¿Quién es y qué hace el Defensor del Pueblo Europeo?", r: "Elegido por el Parlamento Europeo para la legislatura (5 años). Recibe quejas de ciudadanos/empresas sobre mala administración en instituciones/órganos de la UE (excepto TJUE en función jurisdiccional)." },
  { p: "¿Qué actos jurídicos vinculantes define el art. 288 del TFUE?", r: "El Reglamento (alcance general, obligatorio en todos sus elementos, aplicable directamente), la Directiva (obliga en cuanto al resultado, dejando elección de medios al Estado) y la Decisión (obligatoria, si designa destinatarios solo vincula a estos)." },
  { p: "¿Qué son las Recomendaciones y Dictámenes?", r: "Son actos jurídicos típicos no vinculantes (art. 288 TFUE). No obligan jurídicamente, pero el TJUE señala que los tribunales nacionales deben tenerlos en cuenta." },
  { p: "¿Qué diferencia existe entre actos delegados (290 TFUE) y de ejecución (291 TFUE)?", r: "Los delegados (Comisión) completan o modifican elementos no esenciales de un acto legislativo. Los de ejecución (Comisión o Consejo) aseguran condiciones uniformes de ejecución en los EEMM." },
  { p: "¿Cómo se produce la integración del Derecho originario en España?", r: "Por el art. 93 CE mediante la cesión del ejercicio de competencias constitucionales a la UE. Los Tratados se integran tras publicación en el BOE (art. 96 CE)." },
  { p: "¿Cómo se integra el Derecho derivado (ej. Reglamentos) en España?", r: "No requiere publicación en el BOE. Se integra y es directamente aplicable a partir de su publicación en el Diario Oficial de la Unión Europea (DOUE)." },
  { p: "¿A quién corresponde la ejecución del Derecho UE en España si hay competencias transferidas?", r: "Según el TC (principio de autonomía institucional), la ejecución corresponde a quien materialmente ostente la competencia interna (Estado o CC.AA.). El art. 93 no altera el reparto del art. 149 CE." },
  { p: "¿Quién asume la responsabilidad financiera si España es sancionada por incumplir Derecho UE?", r: "Según la LO 2/2012 y el RD 515/2013, la Administración (Estado, CC.AA. o Local) que, ejerciendo su competencia, incumpla (ej. transposición tardía de Directiva) asume la responsabilidad financiera, procediendo el Estado a retener fondos si es necesario." }
];

  // Test 4: El Consejo

// App Logic
document.addEventListener('DOMContentLoaded', () => {
  renderNav();
  renderEsquema();
  renderTests();
});

function renderNav() {
  const container = document.getElementById('nav-container');
  
  const btnEsquema = document.createElement('button');
  btnEsquema.className = 'tab-btn active';
  btnEsquema.textContent = 'Esquema de Estudio';
  btnEsquema.onclick = () => switchTab('tab-esquema', btnEsquema);
  container.appendChild(btnEsquema);

  for (let i = 0; i < examenes.length; i++) {
    const btnTest = document.createElement('button');
    btnTest.className = 'tab-btn';
    btnTest.textContent = `Test ${i + 1}`;
    btnTest.onclick = () => switchTab(`tab-test-${i}`, btnTest);
    container.appendChild(btnTest);
  }
}

function switchTab(tabId, btnTarget) {
  document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  
  document.getElementById(tabId).classList.add('active');
  btnTarget.classList.add('active');
  
  // Stop speaking if navigating away
  window.speechSynthesis.cancel();
}

function renderEsquema() {
  const container = document.getElementById('esquema-container');
  esquemaPreguntas.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h3>${i + 1}. ${q.p}</h3><p>${q.r}</p>`;
    container.appendChild(card);
  });
}

document.getElementById('btn-escuchar').addEventListener('click', () => {
  window.speechSynthesis.cancel(); // Parar audios previos
  let texto = "Esquema de Estudio. Tema 11. ";
  esquemaPreguntas.forEach((q, i) => {
    texto += `Pregunta ${i + 1}. ${q.p} ... Respuesta: ${q.r} `;
  });
  const utterance = new SpeechSynthesisUtterance(texto);
  utterance.lang = 'es-ES';
  utterance.rate = 1.0;
  window.speechSynthesis.speak(utterance);
});

function renderTests() {
  const mainContainer = document.getElementById('main-content');
  const letras = ['A', 'B', 'C', 'D'];
  
  examenes.forEach((test, tIndex) => {
    const testDiv = document.createElement('div');
    testDiv.id = `tab-test-${tIndex}`;
    testDiv.className = 'tab-content';
    
    let htmlContent = `<div class="score-display" id="score-top-${tIndex}"></div>`;
    htmlContent += `<form id="form-test-${tIndex}">`;
    
    test.forEach((q, qIndex) => {
      htmlContent += `<div class="card">
        <h3>${qIndex + 1}. ${q.q}</h3>
        <div class="options-container">`;
      
      q.o.forEach((opt, oIndex) => {
        htmlContent += `
          <label class="option-label label-t${tIndex}q${qIndex}" id="lbl-t${tIndex}q${qIndex}o${oIndex}">
            <input type="radio" name="t${tIndex}q${qIndex}" value="${oIndex}"> 
            <span><strong>${letras[oIndex]})</strong> ${opt}</span>
          </label>`;
      });
      
      htmlContent += `</div>
        <div class="explanation-box" id="exp-t${tIndex}q${qIndex}">
          <strong>Explicación:</strong> ${q.e}
        </div>
      </div>`;
    });
    
    htmlContent += `
      <div class="score-display" id="score-bottom-${tIndex}"></div>
      <button type="button" class="btn-primary btn-corregir" onclick="corregirTest(${tIndex})">✅ Corregir Examen</button>
      <button type="button" class="btn-secondary" onclick="reiniciarTest(${tIndex})">🔄 Reiniciar Test</button>
    </form>`;
    
    testDiv.innerHTML = htmlContent;
    mainContainer.appendChild(testDiv);
  });
}

function corregirTest(tIndex) {
  const form = document.getElementById(`form-test-${tIndex}`);
  const testData = examenes[tIndex];
  let aciertos = 0;
  let errores = 0;
  
  testData.forEach((q, qIndex) => {
    const radios = form.querySelectorAll(`input[name="t${tIndex}q${qIndex}"]`);
    const labels = form.querySelectorAll(`.label-t${tIndex}q${qIndex}`);
    const expBox = document.getElementById(`exp-t${tIndex}q${qIndex}`);
    let respondida = false;
    
    // Bloquear radios
    radios.forEach(r => r.disabled = true);
    labels.forEach(l => l.classList.add('disabled'));
    
    radios.forEach(r => {
      if (r.checked) {
        respondida = true;
        const val = parseInt(r.value);
        if (val === q.c) {
          labels[val].classList.add('correct');
          aciertos++;
        } else {
          labels[val].classList.add('incorrect');
          labels[q.c].classList.add('correct');
          errores++;
          expBox.style.display = 'block';
        }
      }
    });
    
    // Si la dejó en blanco
    if (!respondida) {
      labels[q.c].classList.add('correct');
      errores++;
      expBox.style.display = 'block';
    }
  });
  
  const scoreHTML = `Resultado final: ${aciertos} Aciertos / ${errores} Errores`;
  const st = document.getElementById(`score-top-${tIndex}`);
  const sb = document.getElementById(`score-bottom-${tIndex}`);
  st.innerHTML = scoreHTML; st.style.display = 'block';
  sb.innerHTML = scoreHTML; sb.style.display = 'block';
  
  form.querySelector('.btn-corregir').disabled = true;
}

function reiniciarTest(tIndex) {
  const form = document.getElementById(`form-test-${tIndex}`);
  const testData = examenes[tIndex];
  
  form.reset();
  form.querySelector('.btn-corregir').disabled = false;
  
  document.getElementById(`score-top-${tIndex}`).style.display = 'none';
  document.getElementById(`score-bottom-${tIndex}`).style.display = 'none';
  
  testData.forEach((q, qIndex) => {
    const radios = form.querySelectorAll(`input[name="t${tIndex}q${qIndex}"]`);
    const labels = form.querySelectorAll(`.label-t${tIndex}q${qIndex}`);
    const expBox = document.getElementById(`exp-t${tIndex}q${qIndex}`);
    
    radios.forEach(r => r.disabled = false);
    labels.forEach(l => {
      l.classList.remove('correct', 'incorrect', 'disabled');
    });
    expBox.style.display = 'none';
  });
}
</script>

    <script>

            { q: "¿Cómo se define el primer criterio (material) de clasificación de la actividad administrativa?", a: "Consiste en la agrupación de las competencias estatales atendiendo a la materia de que se trate, desde la de defensa hasta la de policía, pasando por hacienda o justicia." },
            { q: "¿Qué caracteriza a la actividad administrativa jurídica?", a: "Se manifiesta a través de actos administrativos formales, por ejemplo, el nombramiento de un funcionario." },
            { q: "¿Qué es la actividad administrativa técnica?", a: "Tiene lugar cuando la Administración en cumplimiento de sus fines aplica criterios de tipo técnico, científico, como lo podría hacer un particular o una empresa privada para explotar un servicio." },

            { q: "¿Qué supone la característica de 'intercambiabilidad'?", a: "Que un mismo fin se puede conseguir por la Administración a través de diferentes formas de acción administrativa que se pueden combinar o sustituir entre sí (ej. subvencionar hospitales privados o crear propios)." },
            { q: "¿Qué postula el principio de legalidad según los artículos 9.3 y 103.1 CE y 3.1 LRJSP?", a: "El sometimiento pleno de las Administraciones Públicas a la Ley y al Derecho." },
            { q: "¿En qué consiste la teoría de la vinculación positiva del principio de legalidad admitida en nuestro Derecho?", a: "Entiende que la Administración solo puede realizar aquellos actos para los que esté expresamente autorizada por la ley." },
            { q: "¿En qué actividades administrativas es de especial aplicación el principio de igualdad (art. 14 CE)?", a: "De un modo especial es aplicable en las actividades de fomento y de servicio público." },

            { q: "¿Cuáles son los dos principios básicos sobre los que se sustenta la actividad de limitación?", a: "El principio de legalidad (necesidad de respaldo legal) y el principio del acto administrativo previo." },
            { q: "¿Qué diferencia existe entre autorización y licencia según los autores que las separan?", a: "La licencia se otorga de forma reglada a quienes reúnan condiciones (ej. licencia de caza), mientras que la autorización permite acceder a una actividad reservada solo a algunos ciudadanos, siendo su otorgamiento discrecional (ej. rodar en el Museo del Prado)." },
            { q: "¿Qué son las órdenes directivas en las técnicas de limitación?", a: "Actos que prescriben el tipo de conducta a realizar para salvaguardar el interés público (ej. restricción de agua en sequía)." },

            { q: "¿Cómo define Garrido Falla el 'fomento'?", a: "Es la actividad dirigida a satisfacer indirectamente necesidades de carácter público, protegiendo o promoviendo, sin emplear coacción, las actividades de los particulares o entes públicos." },

            { q: "¿Qué participación debe tener el Estado para que una sociedad sea considerada 'Sociedad mercantil estatal'?", a: "Que la participación directa en su capital social de la Administración General del Estado o entidades de su sector público institucional sea superior al 50%, o tener el control según la Ley 6/2023." },
            { q: "¿Cuáles son las dos principales formas indirectas de gestión bajo la legislación actual (LCSP)?", a: "El contrato de concesión de obras y el contrato de concesión de servicios." },

            { q: "¿En qué forma indirecta de contrato LCSP no se produce la transferencia del riesgo operacional de la Administración al contratista?", a: "En los contratos de servicios que conlleven prestaciones directas a favor de la ciudadanía." },

        function switchTab(tabId) {
            // Detener speech si cambiamos de pestaña
            if(isSpeaking) toggleSpeech();

            // Hide all
            document.getElementById('tab-esquema').classList.add('hidden');
            const allTestSections = document.querySelectorAll('#tests-container section');
            allTestSections.forEach(sec => sec.classList.add('hidden'));

            // Remove active classes
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-blue-600', 'text-white', 'shadow-md');
                btn.classList.add('text-slate-300', 'hover:bg-slate-700');
            });

            // Show selected
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            
            // Highlight button
            const activeBtn = document.getElementById(`btn-tab-${tabId}`);
            activeBtn.classList.remove('text-slate-300', 'hover:bg-slate-700');
            activeBtn.classList.add('active', 'bg-blue-600', 'text-white', 'shadow-md');

            // Scroll to top
            document.getElementById('main-content').scrollTo(0,0);
        }

        function gradeTest(testIndex) {
            const test = testsData[testIndex];
            let correctCount = 0;
            let incorrectCount = 0;
            let unansweredCount = 0;

            test.forEach((q, qIndex) => {
                const selectedInput = document.querySelector(`input[name="t${testIndex}q${qIndex}"]:checked`);
                const explanationDiv = document.getElementById(`expl-t${testIndex}q${qIndex}`);
                const questionDiv = document.getElementById(`div-t${testIndex}q${qIndex}`);
                const labels = questionDiv.querySelectorAll('label');

                // Mostrar explicación
                explanationDiv.classList.remove('hidden');

                // Deshabilitar inputs
                questionDiv.querySelectorAll('input').forEach(inp => inp.disabled = true);

                // Quitar clases previas de color
                labels.forEach(l => l.classList.remove('bg-green-100', 'bg-red-100', 'text-green-800', 'text-red-800', 'font-bold', 'border-l-4', 'border-green-500', 'border-red-500'));

                if (!selectedInput) {
                    unansweredCount++;
                    // Marcar en verde la correcta aunque no se haya respondido para que sepa cuál era
                    const correctLabel = document.getElementById(`label-t${testIndex}q${qIndex}o${q.c}`);
                    correctLabel.classList.add('bg-green-50', 'text-green-800', 'font-bold', 'border-l-4', 'border-green-500');
                } else {
                    const selectedVal = parseInt(selectedInput.value);
                    const selectedLabel = document.getElementById(`label-t${testIndex}q${qIndex}o${selectedVal}`);
                    
                    if (selectedVal === q.c) {
                        correctCount++;
                        selectedLabel.classList.add('bg-green-100', 'text-green-800', 'font-bold', 'border-l-4', 'border-green-500');
                    } else {
                        incorrectCount++;
                        selectedLabel.classList.add('bg-red-100', 'text-red-800', 'font-bold', 'border-l-4', 'border-red-500');
                        // Marcar también la que era correcta
                        const correctLabel = document.getElementById(`label-t${testIndex}q${qIndex}o${q.c}`);
                        correctLabel.classList.add('bg-green-50', 'text-green-800', 'font-bold', 'border-l-4', 'border-green-500');
                    }
                }
            });

            // Resumen inferior
            const summaryId = `summary-test-${testIndex + 1}`;
            const summaryDiv = document.getElementById(summaryId);
            summaryDiv.classList.remove('hidden');
            
            let color = 'text-green-600';
            if (correctCount < 10) color = 'text-red-600';
            else if (correctCount < 15) color = 'text-yellow-600';

            summaryDiv.innerHTML = `
                <span class="${color}">Aciertos: ${correctCount}/20</span> 
                <span class="text-slate-500 text-sm font-normal ml-3">(Errores: ${incorrectCount}, En blanco: ${unansweredCount})</span>
            `;

            // Botones
            document.getElementById(`btn-submit-test-${testIndex + 1}`).classList.add('hidden');
            document.getElementById(`btn-reset-test-${testIndex + 1}`).classList.remove('hidden');
        }

        function resetTest(testIndex) {
            const test = testsData[testIndex];
            
            test.forEach((q, qIndex) => {
                const explanationDiv = document.getElementById(`expl-t${testIndex}q${qIndex}`);
                const questionDiv = document.getElementById(`div-t${testIndex}q${qIndex}`);
                const labels = questionDiv.querySelectorAll('label');
                const inputs = questionDiv.querySelectorAll('input');

                // Ocultar explicación
                explanationDiv.classList.add('hidden');

                // Habilitar y deseleccionar inputs
                inputs.forEach(inp => {
                    inp.disabled = false;
                    inp.checked = false;
                });

                // Quitar colores
                labels.forEach(l => l.classList.remove('bg-green-50', 'bg-green-100', 'bg-red-100', 'text-green-800', 'text-red-800', 'font-bold', 'border-l-4', 'border-green-500', 'border-red-500'));
            });

            // Reset resumen y botones
            document.getElementById(`summary-test-${testIndex + 1}`).classList.add('hidden');
            document.getElementById(`summary-test-${testIndex + 1}`).innerHTML = '';
            document.getElementById(`btn-submit-test-${testIndex + 1}`).classList.remove('hidden');
            document.getElementById(`btn-reset-test-${testIndex + 1}`).classList.add('hidden');
            
            // Subir arriba
            document.getElementById('main-content').scrollTo(0,0);
        }

        let synth = window.speechSynthesis;
        let isSpeaking = false;
        let currentUtterance = null;

        function toggleSpeech() {
            const btn = document.getElementById('tts-btn');
            
            if (isSpeaking) {
                synth.cancel();
                isSpeaking = false;
                btn.innerHTML = '🔊 Escuchar Esquema Completo';
                btn.classList.remove('bg-red-100', 'text-red-700', 'hover:bg-red-200');
                btn.classList.add('bg-blue-100', 'text-blue-700', 'hover:bg-blue-200');
            } else {
                let fullText = "Esquema de Preguntas Probables. Tema 5. ";
                esquemaData.forEach((item, index) => {
                    fullText += `Pregunta ${index + 1}... ${item.q}.... Respuesta: ${item.a}. `;
                });
                
                currentUtterance = new SpeechSynthesisUtterance(fullText);
                currentUtterance.lang = 'es-ES';
                currentUtterance.rate = 1.0; // Velocidad normal
                
                currentUtterance.onend = () => {
                    isSpeaking = false;
                    btn.innerHTML = '🔊 Escuchar Esquema Completo';
                    btn.classList.remove('bg-red-100', 'text-red-700', 'hover:bg-red-200');
                    btn.classList.add('bg-blue-100', 'text-blue-700', 'hover:bg-blue-200');
                };
                
                synth.speak(currentUtterance);
                isSpeaking = true;
                
                btn.innerHTML = '⏹️ Detener Lectura';
                btn.classList.remove('bg-blue-100', 'text-blue-700', 'hover:bg-blue-200');
                btn.classList.add('bg-red-100', 'text-red-700', 'hover:bg-red-200');
            }
        }

        // Cancelar síntesis si se recarga la página o se abandona
        window.onbeforeunload = () => {
            if(synth) synth.cancel();
        };

        window.onload = () => {
            renderEsquema();
            renderTests();
        };
    </script>
</body>
</html>
